<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player GLB Editor</title>
<script src="./cdn/babylon.js"></script>
<script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
<script src="./cdn/gui/babylon.gui.min.js"></script>
<script src="./cdn/serializers/babylonjs.serializers.min.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#111;color:#0ff;font-family:monospace;}
#renderCanvas{width:100%;height:100%;display:block;}
#ui-frame{
  position:fixed;top:0;left:0;right:0;height:60px;
  background:rgba(0,0,0,0.85);border-bottom:1px solid #0ff;
  display:flex;align-items:center;gap:10px;padding:5px 10px;z-index:20;
}
#ui-frame input,#ui-frame button{
  background:#000;border:1px solid #0ff;color:#0ff;padding:6px 10px;font-size:13px;cursor:pointer;
}
#ui-frame button:hover{background:#033;}
</style>
</head>
<body>
<div id="ui-frame">
  <label>Base Model<input type="file" id="baseModel" accept=".fbx"></label>
  <label>Idle<input type="file" id="idleAnim" accept=".fbx"></label>
  <label>Walking<input type="file" id="walkAnim" accept=".fbx"></label>
  <label>Crouching Idle<input type="file" id="crouchIdleAnim" accept=".fbx"></label>
  <label>Crouched Walking<input type="file" id="crouchWalkAnim" accept=".fbx"></label>
  <label>Standing↔Crouched<input type="file" id="standToCrouchAnim" accept=".fbx"></label>
  <button id="btnLoadPlayer">Load Player</button>
  <button id="btnTestMap">Test Map</button>
  <button id="btnExport">Export GLB</button>
  <label>Scale<input type="range" id="playerScale" min="0.1" max="3" step="0.01" value="1"></label>
</div>
<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas,true);
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.05,0.05,0.05,1);

let camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0,2,5), scene);
camera.attachControl(canvas,true);

let light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0,1,0), scene);
let ground = BABYLON.MeshBuilder.CreateGround("ground",{width:50,height:50},scene);
ground.material = new BABYLON.StandardMaterial("gmat",scene);
ground.material.diffuseColor = new BABYLON.Color3(0.1,0.1,0.1);

let player = null;
let animGroups = {};
let keys = {};
let isCrouching = false;

document.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
  // Reverse crouch/stand
  if(player && e.key.toLowerCase()==="c"){
    if(animGroups["StandingToCrouched"]){
      if(isCrouching){
        animGroups["StandingToCrouched"].speedRatio=-1;
        animGroups["StandingToCrouched"].play(false);
      } else {
        animGroups["StandingToCrouched"].speedRatio=1;
        animGroups["StandingToCrouched"].play(false);
      }
    }
    isCrouching = !isCrouching;
  }
});

// Player Scale
document.getElementById("playerScale").addEventListener("input",e=>{
  if(player) player.scaling.setAll(parseFloat(e.target.value));
});

async function loadFBX(file){
  return new Promise((res,rej)=>{
    BABYLON.SceneLoader.ImportMeshAsync("", "file:", file, scene).then(result=>{
      res(result);
    }).catch(err=>{
      rej(err);
    });
  });
}

async function loadPlayer(){
  const files = {
    base: document.getElementById("baseModel").files[0],
    idle: document.getElementById("idleAnim").files[0],
    walk: document.getElementById("walkAnim").files[0],
    crouchIdle: document.getElementById("crouchIdleAnim").files[0],
    crouchWalk: document.getElementById("crouchWalkAnim").files[0],
    standToCrouch: document.getElementById("standToCrouchAnim").files[0]
  };
  if(!files.base) return alert("Upload base model");

  // Clear previous
  if(player) player.dispose();
  animGroups={};

  const base = await loadFBX(files.base);
  player = base.meshes[0];
  player.position = new BABYLON.Vector3(0,0,0);
  player.scaling.setAll(parseFloat(document.getElementById("playerScale").value));

  async function loadAnim(file,name){
    if(!file) return;
    const animRes = await loadFBX(file);
    if(animRes.animationGroups.length>0){
      animGroups[name] = animRes.animationGroups[0];
      // Attach to player
      animGroups[name].targetedAnimations.forEach(t=>{
        t.target = player;
      });
    }
  }

  await loadAnim(files.idle,"Idle");
  await loadAnim(files.walk,"Walking");
  await loadAnim(files.crouchIdle,"CrouchingIdle");
  await loadAnim(files.crouchWalk,"CrouchedWalking");
  await loadAnim(files.standToCrouch,"StandingToCrouched");

  alert("Player loaded!");
}

// Simple test map
document.getElementById("btnTestMap").addEventListener("click",()=>{
  if(!player) return alert("Load player first");
  canvas.requestPointerLock();
});

// Movement + Animation
scene.onBeforeRenderObservable.add(()=>{
  if(!player) return;
  let move=false;
  const speed = keys["shift"]?0.2:0.1;
  if(keys["w"]){player.position.z -= speed; move=true;}
  if(keys["s"]){player.position.z += speed; move=true;}
  if(keys["a"]){player.position.x -= speed; move=true;}
  if(keys["d"]){player.position.x += speed; move=true;}

  // Play animations
  if(move){
    if(isCrouching){
      if(animGroups["CrouchedWalking"]) animGroups["CrouchedWalking"].play(true);
    } else {
      if(animGroups["Walking"]) animGroups["Walking"].speedRatio = keys["shift"]?2:1;
      if(animGroups["Walking"]) animGroups["Walking"].play(true);
    }
  } else {
    if(isCrouching){
      if(animGroups["CrouchingIdle"]) animGroups["CrouchingIdle"].play(true);
    } else {
      if(animGroups["Idle"]) animGroups["Idle"].play(true);
    }
  }
});

// Export GLB
document.getElementById("btnExport").addEventListener("click",()=>{
  if(!player) return;
  BABYLON.GLTF2Export.GLBAsync(scene,"Player").then(glb=>glb.downloadFiles());
});

engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize",()=>engine.resize());
</script>
</body>
</html>
