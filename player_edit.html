<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player FBX Editor + Test Scene</title>
<script src="./cdn/babylon.js"></script>
<script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
<script src="./cdn/gui/babylon.gui.min.js"></script>
<script src="./cdn/serializers/babylonjs.serializers.min.js"></script>
<style>
body { margin:0; font-family:sans-serif; background:#111; color:#0ff; }
h1 { text-align:center; }
#ui { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:12px; }
#ui label { display:block; }
button { padding:6px 12px; background:#000; color:#0ff; border:1px solid #0ff; cursor:pointer; }
button:hover { background:#033; }
#renderCanvas { width:100%; height:70vh; display:block; margin:0 auto; border:1px solid #0ff; }
input[type=range] { width:100px; }
</style>
</head>
<body>
<h1>Player FBX Editor + Test Scene</h1>
<div id="ui">
  <div><label>Base Model (BASE.fbx)<input type="file" id="baseFile"></label></div>
  <div><label>Idle Animation<input type="file" id="idleFile"></label></div>
  <div><label>Walking<input type="file" id="walkFile"></label></div>
  <div><label>Crouching Idle<input type="file" id="crouchIdleFile"></label></div>
  <div><label>Crouched Walking<input type="file" id="crouchWalkFile"></label></div>
  <div><label>Standing To Crouched<input type="file" id="standToCrouchFile"></label></div>
  <div><label>Player Scale<input type="range" id="playerScale" min="0.1" max="5" step="0.1" value="1"></label></div>
  <button id="btnLoadPlayer">Load Player</button>
  <button id="btnExportGLB">Export GLB</button>
  <button id="btnTestMap">Test Map</button>
</div>
<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas,true);
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.05,0.05,0.05,1);

// Camera and light
const camera = new BABYLON.FreeCamera("playerCam", new BABYLON.Vector3(0,2,0), scene);
camera.attachControl(canvas,true);
camera.checkCollisions = true;
camera.applyGravity = true;

const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0,1,0), scene);

// Ground
let ground = BABYLON.MeshBuilder.CreateGround("ground",{width:50,height:50},scene);
ground.checkCollisions = true;

// Player variables
let baseMesh = null;
let animGroups = {};
let keys = {};
let targetCrouch = 0;
let crouchProgress = 0;
let crouchSpeed = 0.1;
let playerSpeed = 0.05;

function createBlobURL(file){ return URL.createObjectURL(file); }
async function loadFBX(file){
    const url = createBlobURL(file);
    const result = await BABYLON.SceneLoader.ImportMeshAsync("", url, "", scene);
    URL.revokeObjectURL(url);
    return result;
}

async function loadPlayer(){
    if(!document.getElementById("baseFile").files[0]){
        alert("Upload BASE.fbx");
        return;
    }
    scene.meshes.forEach(m=>{if(m!==ground) m.dispose();});
    animGroups={};
    baseMesh=null;

    const baseRes = await loadFBX(document.getElementById("baseFile").files[0]);
    baseMesh = baseRes.meshes[0];
    baseMesh.name="PlayerBase";
    baseMesh.position = new BABYLON.Vector3(0,1,0);
    baseMesh.scaling = new BABYLON.Vector3(1,1,1);

    const animFiles = {
        "Idle": document.getElementById("idleFile").files[0],
        "Walking": document.getElementById("walkFile").files[0],
        "CrouchIdle": document.getElementById("crouchIdleFile").files[0],
        "CrouchedWalking": document.getElementById("crouchWalkFile").files[0],
        "StandingToCrouched": document.getElementById("standToCrouchFile").files[0]
    };

    for(const [name,file] of Object.entries(animFiles)){
        if(file){
            const animRes = await loadFBX(file);
            animRes.animationGroups.forEach(ag=>{
                ag.targetedAnimations.forEach(t=>{ t.target = baseMesh; });
                ag.name=name;
                animGroups[name]=ag;
            });
        }
    }

    const scaleSlider = document.getElementById("playerScale");
    scaleSlider.addEventListener("input",()=>{ 
        if(baseMesh) baseMesh.scaling.setAll(scaleSlider.valueAsNumber); 
    });

    alert("Player loaded with animations!");
}

// Movement input
window.addEventListener("keydown", e=>{
    keys[e.key.toLowerCase()]=true;
    if(e.key.toLowerCase()=="c") targetCrouch = 1-targetCrouch;
});
window.addEventListener("keyup", e=>{ keys[e.key.toLowerCase()]=false; });

// Test map button triggers pointer lock and first-person view
document.getElementById("btnTestMap").addEventListener("click",()=>{
    if(baseMesh){
        canvas.requestPointerLock();
    }
});

engine.runRenderLoop(()=>{
    if(baseMesh){
        // Smooth crouch
        crouchProgress += (targetCrouch - crouchProgress)*crouchSpeed;

        // Stop all animations
        for(let agName in animGroups) animGroups[agName].stop();

        // Movement vector
        let forward = keys["w"]?-1:keys["s"]?1:0;
        let right = keys["d"]?-1:keys["a"]?1:0;
        let move = forward!==0 || right!==0;

        // Update animation
        if(move){
            if(crouchProgress>0.5) animGroups["CrouchedWalking"]?.play(true);
            else if(keys["shift"]) { animGroups["Walking"].speedRatio=2; animGroups["Walking"]?.play(true);}
            else { animGroups["Walking"].speedRatio=1; animGroups["Walking"]?.play(true);}
        }else{
            if(crouchProgress>0.5) animGroups["CrouchIdle"]?.play(true);
            else animGroups["Idle"]?.play(true);
        }

        // Update player position
        let forwardVec = new BABYLON.Vector3(0,0,forward*playerSpeed);
        let rightVec = new BABYLON.Vector3(right*playerSpeed,0,0);
        let moveVec = forwardVec.add(rightVec);
        baseMesh.moveWithCollisions(moveVec);

        // Adjust vertical based on crouch
        baseMesh.position.y = 1 - 0.5*crouchProgress;

        // Camera follows
        camera.position = baseMesh.position.add(new BABYLON.Vector3(0,2,0));
        camera.target = baseMesh.position.add(new BABYLON.Vector3(0,1,0));
    }
    scene.render();
});

// Load / Export buttons
document.getElementById("btnLoadPlayer").addEventListener("click",loadPlayer);
document.getElementById("btnExportGLB").addEventListener("click", async ()=>{
    if(!baseMesh){ alert("Load a player first"); return; }
    const glb = await BABYLON.GLTF2Export.GLBAsync(scene,"Player");
    glb.downloadFiles();
});

window.addEventListener("resize",()=>engine.resize());
</script>
</body>
</html>
