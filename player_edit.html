<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player Model Editor</title>
<script src="./cdn/babylon.js"></script>
<script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
<script src="./cdn/gui/babylon.gui.min.js"></script>
<script src="./cdn/serializers/babylonjs.serializers.min.js"></script>
<style>
body {
  margin:0; padding:0; background:#1a1a1a; color:#0ff; font-family: monospace;
}
#ui-frame {
  position: fixed; top:0; left:0; right:0; background: rgba(0,0,0,0.85);
  border-bottom: 1px solid #0ff; padding: 10px; display:flex; flex-wrap: wrap; gap:10px; z-index:20;
}
#ui-frame label {
  display:flex; flex-direction: column; font-size: 13px; color:#0ff;
}
#ui-frame input, #ui-frame button {
  margin-top:4px; background:#000; color:#0ff; border:1px solid #0ff; padding:4px 8px; cursor:pointer;
}
#ui-frame button:hover, #ui-frame input:hover { background:#022; }
#renderCanvas { width:100%; height:100%; display:block; margin-top:72px; background:#111; }
</style>
</head>
<body>

<div id="ui-frame">
  <label>Base Model
    <input type="file" id="baseUpload" accept=".fbx"/>
  </label>
  <label>Idle Animation
    <input type="file" id="idleUpload" accept=".fbx"/>
  </label>
  <label>Walking Animation
    <input type="file" id="walkUpload" accept=".fbx"/>
  </label>
  <label>Crouched Walking
    <input type="file" id="crouchWalkUpload" accept=".fbx"/>
  </label>
  <label>Crouching Idle
    <input type="file" id="crouchIdleUpload" accept=".fbx"/>
  </label>
  <label>Standing To Crouched
    <input type="file" id="standCrouchUpload" accept=".fbx"/>
  </label>
  <label>Left Strafe
    <input type="file" id="leftStrafeUpload" accept=".fbx"/>
  </label>
  <label>Right Strafe
    <input type="file" id="rightStrafeUpload" accept=".fbx"/>
  </label>
  <button id="btnLoadPlayer">Load Player</button>
  <button id="btnExport">Export GLB</button>
</div>

<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.05,0.05,0.05,1);

const camera = new BABYLON.ArcRotateCamera("cam", Math.PI/2, Math.PI/3, 10, new BABYLON.Vector3(0,1,0), scene);
camera.attachControl(canvas,true);

const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0,1,0), scene);
let player = null;
let skeleton = null;
let animGroups = {};
let scaleFactor = 1;

async function loadFBX(file){
  try {
    const result = await BABYLON.SceneLoader.ImportMeshAsync(
      "", "file:", file, scene
    );
    return result;
  } catch(e){
    console.error("Unable to load file:", file.name, e);
    alert("Failed to load " + file.name);
  }
}

// Combine base mesh and animations
async function loadPlayer(){
  if(player) player.dispose();
  skeleton = null;
  animGroups = {};

  const baseFile = document.getElementById("baseUpload").files[0];
  if(!baseFile){ alert("Upload base model"); return; }

  const baseResult = await loadFBX(baseFile);
  player = baseResult.meshes[0];
  skeleton = baseResult.skeletons[0] || null;

  // Auto-scale down if too large
  const bb = player.getBoundingInfo().boundingBox;
  const size = bb.maximum.subtract(bb.minimum).length();
  scaleFactor = 2/size;
  player.scaling.scaleInPlace(scaleFactor);

  // Load animations
  const animInputs = {
    Idle: "idleUpload",
    Walking: "walkUpload",
    CrouchedWalking: "crouchWalkUpload",
    CrouchingIdle: "crouchIdleUpload",
    StandingToCrouched: "standCrouchUpload",
    LeftStrafe: "leftStrafeUpload",
    RightStrafe: "rightStrafeUpload"
  };

  for(const [name,id] of Object.entries(animInputs)){
    const file = document.getElementById(id).files[0];
    if(file){
      const result = await loadFBX(file);
      if(result.animationGroups.length>0){
        const group = result.animationGroups[0];
        // Attach skeleton from base
        if(skeleton) group.targetedAnimations.forEach(t => {
          t.target = skeleton.bones.find(b=>b.name===t.target.name) || t.target;
        });
        animGroups[name] = group;
      }
    }
  }

  alert("Player loaded successfully!");
}

// Export as GLB
document.getElementById("btnExport").addEventListener("click", async ()=>{
  if(!player) { alert("Load player first"); return; }
  const glb = await BABYLON.GLTF2Export.GLBAsync(scene, "Player");
  glb.downloadFiles();
});

document.getElementById("btnLoadPlayer").addEventListener("click", loadPlayer);

engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize", ()=>engine.resize());
</script>

</body>
</html>
