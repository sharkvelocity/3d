<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLB Editor</title>
<script src="./cdn/babylon.js"></script>
<script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
<script src="./cdn/gui/babylon.gui.min.js"></script>
<script src="./cdn/serializers/babylonjs.serializers.min.js"></script>
<script src="./cdn/serializers/babylon.glTF2Export.min.js"></script>
<style>
html, body { margin:0; padding:0; overflow:hidden; height:100%; background:#111; color:#0ff; font-family:monospace; }
#frame { position:fixed; inset:0; border:4px solid #0ff; box-sizing:border-box; display:flex; flex-direction:column; }
#toolbar { background:rgba(0,0,0,0.85); padding:10px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
#toolbar button, #toolbar input { font-size:12px; padding:4px 8px; cursor:pointer; border:1px solid #0ff; color:#0ff; background:#111; border-radius:4px; }
#toolbar button:hover, #toolbar input:hover { background:#033; }
#hoverInfo { margin-left:12px; font-size:12px; }
#renderCanvas { flex:1; width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div id="frame">
  <div id="toolbar">
    <input type="file" id="fileInput" accept=".glb,.gltf" />
    <button id="btn-add">Add GLB</button>
    <button id="btn-spawn">Add Spawn</button>
    <button id="btn-anim">Add Anim to Player</button>
    <button id="btn-undo">Undo</button>
    <button id="btn-origin">Center to Origin</button>
    <button id="btn-export">Export GLB</button>
    <button id="btn-grid">Toggle Grid</button>
    <span id="hoverInfo">Hover: (none)</span>
  </div>
  <canvas id="renderCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);
let scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.05,0.05,0.05,1);

let camera = new BABYLON.ArcRotateCamera("cam", Math.PI/2, Math.PI/3, 15, new BABYLON.Vector3(0,2,0), scene);
camera.attachControl(canvas, true);

let light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0,1,0), scene);
let highlight = new BABYLON.HighlightLayer("hl1", scene);

let ground=null, spawnCount=0, grid=null;
let lastAdded = [];
let playerSkeleton=null;

// ================== Initialize Ground ==================
function createGround() {
  if(ground) ground.dispose();
  ground = BABYLON.MeshBuilder.CreateGround("Ground",{width:50,height:50},scene);
  ground.position.y=0;
  let mat=new BABYLON.StandardMaterial("gmat",scene);
  mat.diffuseColor = new BABYLON.Color3(0.1,0.1,0.1);
  ground.material=mat;
}
createGround();

// ================== Hover highlight ====================
scene.onPointerMove = (evt, pick)=>{
  highlight.removeAllMeshes();
  if(pick.hit && pick.pickedMesh){
    highlight.addMesh(pick.pickedMesh, BABYLON.Color3.Teal());
    document.getElementById("hoverInfo").innerText = "Hover: " + pick.pickedMesh.name;
  }else{
    document.getElementById("hoverInfo").innerText = "Hover: (none)";
  }
};

// ================== GLB Load ===========================
let fileToAdd=null;
document.getElementById("fileInput").addEventListener("change", e=>{
  fileToAdd = e.target.files[0] || null;
});

document.getElementById("btn-add").addEventListener("click", ()=>{
  if(!fileToAdd) return alert("Select a GLB file first.");
  loadGLB(fileToAdd);
});

// ================== Spawn point ========================
document.getElementById("btn-spawn").addEventListener("click", ()=>{
  const sphere = BABYLON.MeshBuilder.CreateSphere("Spawn_"+(++spawnCount), {diameter:0.4}, scene);
  sphere.position = camera.target.clone();
  let mat = new BABYLON.StandardMaterial("spmat",scene);
  mat.emissiveColor = BABYLON.Color3.Red();
  sphere.material = mat;
  lastAdded.push(sphere);
});

// ================== Undo ==============================
document.getElementById("btn-undo").addEventListener("click", ()=>{
  if(lastAdded.length){
    const m = lastAdded.pop();
    if(m.dispose) m.dispose();
  }
});

// ================== Animation Loader ==================
document.getElementById("btn-anim").addEventListener("click", ()=>{
  const input = document.createElement("input");
  input.type="file"; input.accept=".glb,.gltf";
  input.onchange = async e=>{
    const file = e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    const result = await BABYLON.SceneLoader.ImportMeshAsync("", "", url, scene, null, ".glb");
    const skel = result.skeletons[0];
    if(playerSkeleton && skel){
      skel.bones.forEach((b,i)=>{ if(playerSkeleton.bones[i]) playerSkeleton.bones[i].animations = b.animations; });
    }
    URL.revokeObjectURL(url);
  };
  input.click();
});

// ================== World Origin Fixer =================
document.getElementById("btn-origin").addEventListener("click", ()=>{
  const all = scene.meshes;
  if(!all.length) return;
  let bbMin = new BABYLON.Vector3(Infinity,Infinity,Infinity);
  let bbMax = new BABYLON.Vector3(-Infinity,-Infinity,-Infinity);
  all.forEach(m=>{
    const b = m.getBoundingInfo().boundingBox;
    bbMin.minimizeInPlace(b.minimumWorld);
    bbMax.maximizeInPlace(b.maximumWorld);
  });
  const center = bbMin.add(bbMax).scale(0.5).negate();
  all.forEach(m=> m.position.addInPlace(center));
});

// ================== Grid Toggle ========================
document.getElementById("btn-grid").addEventListener("click", ()=>{
  if(grid){
    grid.dispose();
    grid = null;
  }else{
    grid = BABYLON.MeshBuilder.CreateGround("Grid",{width:50,height:50, subdivisions:50},scene);
    let gridMat = new BABYLON.StandardMaterial("gridMat",scene);
    gridMat.wireframe = true;
    gridMat.diffuseColor = new BABYLON.Color3(0,1,1);
    grid.material = gridMat;
    grid.position.y=0.001; // slightly above ground to prevent z-fighting
  }
});

// ================== Raycast Drag/Drop ==================
let pickedMesh=null;
scene.onPointerDown = (evt, pick)=>{
  if(pick.hit && pick.pickedMesh && pick.pickedMesh!==ground && pick.pickedMesh!==grid){
    pickedMesh = pick.pickedMesh;
  }
};
scene.onPointerUp = ()=>{ pickedMesh=null; };
scene.onPointerMove = (evt, pick)=>{
  if(pickedMesh && pick.hit && (pick.pickedMesh===ground || pick.pickedMesh===grid)){
    pickedMesh.position = pick.pickedPoint.clone();
  }
};

// ================== Right click place GLB ==================
scene.onPointerDown = (evt, pick)=>{
  if(evt.button===2 && ground && pick.hit && pick.pickedMesh===ground && fileToAdd){
    loadGLB(fileToAdd, pick.pickedPoint);
  }
};

// ================== Export GLB ==========================
document.getElementById("btn-export").addEventListener("click", async ()=>{
  try{
    const glb = await BABYLON.GLTF2Export.GLBAsync(scene,"scene");
    glb.downloadFiles();
  }catch(e){
    console.error("Export failed:",e);
  }
});

// ================== Helper for loading GLB =============
async function loadGLB(file, position){
  if(!file) return;
  const url = URL.createObjectURL(file);
  const result = await BABYLON.SceneLoader.ImportMeshAsync("", "", url, scene);
  result.meshes.forEach(m=>{
    if(position) m.position = position.clone();
    lastAdded.push(m);
  });
  URL.revokeObjectURL(url);
  fileToAdd=null;
  document.getElementById("fileInput").value="";
}

engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize", ()=>engine.resize());
window.addEventListener("contextmenu", e=>e.preventDefault());
</script>
</body>
</html>
