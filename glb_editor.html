<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLB Editor</title>
<script src="./cdn/babylon.js"></script>
<script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
<script src="./cdn/gui/babylon.gui.min.js"></script>
<script src="./cdn/serializers/babylonjs.serializers.min.js"></script>
<style>
html, body { margin:0; padding:0; overflow:hidden; height:100%; background:#111; color:#0ff; font-family:monospace; }
#renderCanvas { width:100%; height:100%; touch-action:none; display:block; }

/* Frame-style UI */
#ui-frame {
  position: fixed; top:0; left:0; right:0; height:42px;
  background: rgba(0,0,0,0.8);
  border-bottom: 1px solid #0ff;
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px; z-index: 20;
}
#ui-frame button, #ui-frame input {
  background: #000; border: 1px solid #0ff; color: #0ff;
  padding: 4px 8px; font-size: 13px; cursor: pointer;
}
#ui-frame button:hover { background:#033; }

/* Zoom slider on right */
#zoom-slider {
  position: fixed; top: 50%; right: 12px; transform: translateY(-50%);
  height: 200px; writing-mode: bt-lr;
  -webkit-appearance: slider-vertical;
}
#hoverInfo {
  position: fixed; bottom: 10px; left: 10px;
  background: rgba(0,0,0,0.7);
  padding: 6px 10px; border:1px solid #0ff; border-radius:6px;
  font-size:13px;
}
</style>
</head>
<body>
<div id="ui-frame">
  <input type="file" id="fileInput" accept=".glb,.gltf" multiple />
  <button id="btn-add">Add GLB</button>
  <button id="btn-ground">Ground</button>
  <button id="btn-grid">Grid</button>
  <button id="btn-spawn">Spawn</button>
  <button id="btn-undo">Undo</button>
  <button id="btn-center">Center/Normalize</button>
  <button id="btn-export">Export GLB</button>
</div>
<input type="range" id="zoom-slider" min="2" max="100" step="1" value="15">
<div id="hoverInfo">Hover: (none)</div>
<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);
let scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.05,0.05,0.05,1);

let camera = new BABYLON.ArcRotateCamera("cam", Math.PI/2, Math.PI/3, 15, new BABYLON.Vector3(0,2,0), scene);
camera.attachControl(canvas, true);

let light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0,1,0), scene);
let highlight = new BABYLON.HighlightLayer("hl1", scene);
let ground = BABYLON.MeshBuilder.CreateGround("Ground", {width:50, height:50}, scene);
ground.material = new BABYLON.StandardMaterial("gmat", scene);
ground.material.diffuseColor = new BABYLON.Color3(0.1,0.1,0.1);
let grid = null;
let spawnCount = 0;

// Undo stack
let undoStack = [];

// Hover highlight
scene.onPointerMove = (evt, pick) => {
  highlight.removeAllMeshes();
  if (pick.hit && pick.pickedMesh) {
    highlight.addMesh(pick.pickedMesh, BABYLON.Color3.Teal());
    document.getElementById("hoverInfo").innerText = "Hover: " + pick.pickedMesh.name;
  } else {
    document.getElementById("hoverInfo").innerText = "Hover: (none)";
  }
};

// Load GLB
async function loadGLB(fileOrUrl, position) {
  try {
    const before = scene.meshes.slice();
    if (fileOrUrl instanceof File) {
      // Load from local file correctly
      await BABYLON.SceneLoader.AppendAsync("file:", fileOrUrl, scene);
    } else {
      // Load from URL
      await BABYLON.SceneLoader.AppendAsync("", fileOrUrl, scene);
    }

    // Find new meshes
    const after = scene.meshes.filter(m => !before.includes(m));
    if (position) {
      after.forEach(m => m.position.addInPlace(position));
    }
    undoStack.push(() => after.forEach(m => m.dispose()));

  } catch (err) {
    console.error("Failed to load GLB:", err);
    alert("Failed to load GLB. See console.");
  }
}

    // Newly added meshes
    const after = scene.meshes.filter(m => !before.includes(m));
    if(position){
      after.forEach(m => m.position.addInPlace(position));
    }
    undoStack.push(()=>after.forEach(m=>m.dispose()));

  } catch(err){
    console.error("Failed to load GLB:", err);
    alert("Failed to load GLB. See console.");
  }
}

// File picker
document.getElementById("fileInput").addEventListener("change", e=>{
  [...e.target.files].forEach(f=>loadGLB(f));
});

// Add button triggers file input
document.getElementById("btn-add").addEventListener("click", ()=>{
  document.getElementById("fileInput").click();
});

// Drag + drop
window.addEventListener("dragover", e=>e.preventDefault());
window.addEventListener("drop", e=>{
  e.preventDefault();
  if(e.dataTransfer.files.length){
    [...e.dataTransfer.files].forEach(f=>loadGLB(f));
  }
});

// Ground
document.getElementById("btn-ground").addEventListener("click", ()=>{
  if(ground) ground.dispose();
  ground = BABYLON.MeshBuilder.CreateGround("Ground", {width:50, height:50}, scene);
  ground.material = new BABYLON.StandardMaterial("gmat", scene);
  ground.material.diffuseColor = new BABYLON.Color3(0.1,0.1,0.1);
});

// Grid toggle
document.getElementById("btn-grid").addEventListener("click", ()=>{
  if(grid){ grid.dispose(); grid=null; }
  else grid = BABYLON.MeshBuilder.CreateGround("Grid", {width:100, height:100}, scene);
});

// Spawn
document.getElementById("btn-spawn").addEventListener("click", ()=>{
  const sphere = BABYLON.MeshBuilder.CreateSphere("Spawn_"+(++spawnCount), {diameter:0.4}, scene);
  sphere.position = camera.target.clone();
  const mat = new BABYLON.StandardMaterial("spmat", scene);
  mat.emissiveColor = BABYLON.Color3.Red();
  sphere.material = mat;
  undoStack.push(()=>sphere.dispose());
});

// Undo
document.getElementById("btn-undo").addEventListener("click", ()=>{
  const act = undoStack.pop();
  if(act) act();
});

// Normalize to world origin
document.getElementById("btn-center").addEventListener("click", ()=>{
  let meshes = scene.meshes.filter(m=>m !== ground && m !== grid);
  if(!meshes.length) return;
  let min = new BABYLON.Vector3(Number.MAX_VALUE, Number.MAX_VALUE, Number.MAX_VALUE);
  let max = new BABYLON.Vector3(-Number.MAX_VALUE, -Number.MAX_VALUE, -Number.MAX_VALUE);

  meshes.forEach(m=>{
    const info = m.getBoundingInfo().boundingBox;
    min.minimizeInPlace(info.minimumWorld);
    max.maximizeInPlace(info.maximumWorld);
  });

  let center = min.add(max).scale(0.5);
  meshes.forEach(m=>m.position.subtractInPlace(center));

  let size = max.subtract(min).length();
  let scaleFactor = 10/size; // normalize scale
  meshes.forEach(m=>m.scaling.scaleInPlace(scaleFactor));
});

// Export GLB
document.getElementById("btn-export").addEventListener("click", ()=>{
  BABYLON.GLTF2Export.GLBAsync(scene, "scene").then(glb=>{
    glb.downloadFiles();
  });
});

// Zoom slider
document.getElementById("zoom-slider").addEventListener("input", e=>{
  camera.radius = parseFloat(e.target.value);
});

engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize", ()=>engine.resize());
</script>
</body>
</html>
