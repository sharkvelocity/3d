<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLB Editor</title>
<script src="./cdn/babylon.js"></script>
<script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
<script src="./cdn/gui/babylon.gui.min.js"></script>
<script src="./cdn/serializers/babylonjs.serializers.min.js"></script>
<style>
html, body { margin:0; padding:0; overflow:hidden; height:100%; background:#111; color:#0ff; font-family:monospace; }
#renderCanvas { width:100%; height:100%; touch-action:none; display:block; }
#overlay { position:fixed; top:10px; left:10px; background:rgba(0,0,0,0.65); padding:10px; border:1px solid #0ff; border-radius:6px; font-size:14px; z-index:10; }
button,input { margin:3px; font-size:12px; }
</style>
</head>
<body>
<div id="overlay">
  <input type="file" id="fileInput" accept=".glb,.gltf" />
  <input type="file" id="fileAdd" accept=".glb,.gltf" multiple />
  <input type="file" id="fileAnim" accept=".glb,.gltf" />
  <button id="btn-ground">Add Ground</button>
  <button id="btn-spawn">Add Spawn</button>
  <button id="btn-undo">Undo</button>
  <button id="btn-export">Export GLB</button>
  <div id="hoverInfo">Hover: (none)</div>
</div>
<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);
let scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.05,0.05,0.05,1);

// Camera
let camera = new BABYLON.ArcRotateCamera("cam", Math.PI/2, Math.PI/3, 15, new BABYLON.Vector3(0,2,0), scene);
camera.attachControl(canvas, true);

// Lights
let light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0,1,0), scene);
let highlight = new BABYLON.HighlightLayer("hl1", scene);

let ground = null, spawnCount = 0;
let pickedMesh = null;
let undoStack = [];
let selectedMesh = null;

// =============== Hover highlight & select ===============
scene.onPointerObservable.add(evt=>{
  const pick = evt.pickInfo;
  if(evt.type === BABYLON.PointerEventTypes.POINTERMOVE){
    highlight.removeAllMeshes();
    if (pick.hit && pick.pickedMesh) {
      highlight.addMesh(pick.pickedMesh, BABYLON.Color3.Teal());
      document.getElementById("hoverInfo").innerText = "Hover: " + pick.pickedMesh.name;
    } else {
      document.getElementById("hoverInfo").innerText = "Hover: (none)";
    }
  }
  if(evt.type === BABYLON.PointerEventTypes.POINTERDOWN && pick.hit && pick.pickedMesh){
    selectedMesh = pick.pickedMesh;
    console.log("Selected mesh:", selectedMesh.name);
  }
});

// =============== Load GLB ===============
function loadGLB(file, append=false, position){
  let url = URL.createObjectURL(file);
  const loader = append ? BABYLON.SceneLoader.AppendAsync : BABYLON.SceneLoader.ImportMeshAsync;

  loader("", url, "", scene).then(res=>{
    if(res.meshes){
      res.meshes.forEach(m=>{
        if(position) m.position = position.clone();
        if(m !== scene.meshes[0]) undoStack.push(m);
      });
    }
    URL.revokeObjectURL(url);
  }).catch(err=>console.error("GLB load failed:", err));
}

// Main file loader
document.getElementById("fileInput").addEventListener("change", e=>{
  [...e.target.files].forEach(f=>loadGLB(f,false));
});

// Add-to-scene loader
document.getElementById("fileAdd").addEventListener("change", e=>{
  [...e.target.files].forEach(f=>loadGLB(f,true));
});

// =============== Add Animations ===============
document.getElementById("fileAnim").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file || !selectedMesh){ alert("Select a mesh with a skeleton first."); return; }

  const url = URL.createObjectURL(file);
  BABYLON.SceneLoader.ImportMeshAsync("", url, "", scene).then(res=>{
    if(res.skeletons.length){
      let sourceSkel = res.skeletons[0];
      let targetSkel = selectedMesh.skeleton;
      if(targetSkel){
        // copy animation ranges
        sourceSkel.getAnimationRanges().forEach(r=>{
          targetSkel.createAnimationRange(r.name, r.from, r.to);
        });
        // copy animatable tracks
        sourceSkel.animations.forEach(anim=>{
          targetSkel.animations.push(anim.clone());
        });
        alert("Animations added to: " + selectedMesh.name);
      } else {
        alert("Selected mesh has no skeleton.");
      }
    }
    res.meshes.forEach(m=>m.dispose()); // discard temp meshes
    URL.revokeObjectURL(url);
  });
});

// =============== Ground plane ===============
document.getElementById("btn-ground").addEventListener("click", ()=>{
  if(ground) ground.dispose();
  ground = BABYLON.MeshBuilder.CreateGround("Ground", {width:50, height:50}, scene);
  ground.position.y = 0;
  ground.material = new BABYLON.StandardMaterial("gmat", scene);
  ground.material.diffuseColor = new BABYLON.Color3(0.1,0.1,0.1);
  undoStack.push(ground);
});

// =============== Spawn point ===============
document.getElementById("btn-spawn").addEventListener("click", ()=>{
  const sphere = BABYLON.MeshBuilder.CreateSphere("Spawn_"+(++spawnCount), {diameter:0.4}, scene);
  sphere.position = camera.target.clone();
  const mat = new BABYLON.StandardMaterial("spmat", scene);
  mat.emissiveColor = BABYLON.Color3.Red();
  sphere.material = mat;
  undoStack.push(sphere);
});

// =============== Undo ===============
document.getElementById("btn-undo").addEventListener("click", ()=>{
  const last = undoStack.pop();
  if(last && last.dispose) last.dispose();
});

// =============== Drag/Drop mesh transform ===============
scene.onPointerObservable.add(evt=>{
  const pick = evt.pickInfo;
  if(evt.type === BABYLON.PointerEventTypes.POINTERDOWN && pick.hit && pick.pickedMesh && pick.pickedMesh !== ground){
    pickedMesh = pick.pickedMesh;
  }
  if(evt.type === BABYLON.PointerEventTypes.POINTERUP){ pickedMesh = null; }
  if(evt.type === BABYLON.PointerEventTypes.POINTERMOVE && pickedMesh && pick.hit && pick.pickedMesh===ground){
    pickedMesh.position.copyFrom(pick.pickedPoint);
  }
});

// =============== Export Scene to GLB ===============
document.getElementById("btn-export").addEventListener("click", ()=>{
  BABYLON.GLTF2Export.GLBAsync(scene, "scene").then(glb=>{
    glb.downloadFiles();
  });
});

engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize", ()=>engine.resize());
</script>
</body>
</html>
