<script>
/* ————— Globals ————— */
const canvas = document.getElementById('renderCanvas');
let engine, scene, camera;
let hemiLight=null, moonLight, moonShadows, flashLight, flashShadows, uvLight, irLight, cloudMat, skybox;
let houseLights=[], housePower=true;
let vanZone = { center: new BABYLON.Vector3(43.657, 2, -119.008), radius: 11 };

let player = { sanity:100, room:'Van', speedWalk:0.9, speedRun:1.8, running:false, god:false };
let controls = { forward:false, back:false, left:false, right:false };

let itemsGlb=null, houseRoot=null;
let ghost = { mesh:null, hunting:false, visible:false, target:null, speed:1.4, slowSpeed:0.9, stepInterval:0.55, footAudible:18, isTwins:false, roomCenter:null, profile:"spirit" };

const weather = { state:'Clear', rainPS:null, snowPS:null, snowTex:null, lightningTimer:0, nextStrike:5, modSanityDrain:1, modHuntChance:1, modHuntPace:1 };
function scheduleNextLightning(){ weather.lightningTimer=0; weather.nextStrike = 3 + Math.random()*10; }
function lightningStrike(){ const o=document.getElementById('flash-overlay'); o.style.opacity='0.6'; setTimeout(()=>o.style.opacity='0',120); }

function toast(msg,ms=1500){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',ms); }

/* ————— Input System (WASD + pointer-lock + touch halves + buttons) ————— */
const InputSystem = (()=> {
  let move={x:0,z:0}, running=false, lookDelta={x:0,y:0}, q=[], locked=false;
  const keys=new Set();
  const km={ 'KeyW':'fw','ArrowUp':'fw','KeyS':'bk','ArrowDown':'bk','KeyA':'lt','ArrowLeft':'lt','KeyD':'rt','ArrowRight':'rt',
             'ShiftLeft':'run','ShiftRight':'run','Digit1':'slot1','Digit2':'slot2','Digit3':'slot3','Digit4':'slot4','Digit5':'slot5',
             'KeyN':'openNotebook','KeyF':'toggleFlash','KeyU':'toggleUV','KeyI':'toggleIR' };
  function recompute(){ const f=(keys.has('fw')?1:0)+(keys.has('bk')?-1:0), r=(keys.has('rt')?1:0)+(keys.has('lt')?-1:0); move.z=f; move.x=r; running=keys.has('run'); }
  function onKey(e,down){ const tag=km[e.code]; if(tag){ if(down) keys.add(tag); else keys.delete(tag); recompute(); if(down && /^slot[1-5]|openNotebook|toggle(F|U|IR)$/.test(tag)) q.push(tag);} }
  function bindPointerLock(c){ function pl(){ try{ c.requestPointerLock&&c.requestPointerLock(); }catch{} }
    c.addEventListener('click',pl); document.addEventListener('pointerlockchange',()=>{ locked=document.pointerLockElement===c; });
    document.addEventListener('mousemove',e=>{ if(!locked) return; lookDelta.x+=(e.movementX||0); lookDelta.y+=(e.movementY||0); });
  }
  function bindTouch(){ const L=document.getElementById('touch-left'), R=document.getElementById('touch-right'); let lid=null,rid=null,lastR=null;
    function norm(v,d=10){ return Math.abs(v)<d?0:v; }
    L.addEventListener('touchstart',e=>{ for(const t of e.changedTouches) if(lid===null){ lid=t.identifier; break; }},{passive:false});
    R.addEventListener('touchstart',e=>{ for(const t of e.changedTouches) if(rid===null){ rid=t.identifier; lastR={x:t.clientX,y:t.clientY}; break; }},{passive:false});
    window.addEventListener('touchmove',e=>{
      for(const t of e.changedTouches){
        if(t.identifier===lid){ const cx=t.clientX, cy=t.clientY, midX=window.innerWidth*0.25, refY=window.innerHeight*0.70;
          const vx=norm(cx-midX), vy=norm(cy-refY); move.x=Math.sign(vx); move.z=vy<0?1:(vy>0?-1:0);
        } else if(t.identifier===rid){ if(lastR){ lookDelta.x+=(t.clientX-lastR.x); lookDelta.y+=(t.clientY-lastR.y); } lastR={x:t.clientX,y:t.clientY}; }
      }
    },{passive:false});
    window.addEventListener('touchend',e=>{ for(const t of e.changedTouches){ if(t.identifier===lid){ lid=null; move.x=0; move.z=0; } if(t.identifier===rid){ rid=null; lastR=null; } } },{passive:false});
  }
  function bindButtons(){ const map=[['btn-use','use'],['btn-place','place'],['btn-toss','toss'],['btn-slot-prev','slotPrev'],['btn-slot-next','slotNext'],['btn-notebook','openNotebook']];
    map.forEach(([id,a])=>{ const el=document.getElementById(id); if(el) el.onclick=()=>q.push(a); });
  }
  return {
    init(c){ document.addEventListener('keydown',e=>onKey(e,true)); document.addEventListener('keyup',e=>onKey(e,false)); bindPointerLock(c); bindTouch(); bindButtons(); },
    snapshot(){ const out={ moveVec:{x:move.x,z:move.z}, running, lookDelta:{x:lookDelta.x,y:lookDelta.y}, actions:q.splice(0) }; lookDelta.x=0; lookDelta.y=0; return out; }
  };
})();

/* ————— Movement/Look ————— */
function handleMovementFromInput(input,dt){
  if(!camera||!scene) return;
  const sp=input.running?player.speedRun:player.speedWalk;
  const f=camera.getForwardRay().direction.clone(); f.y=0; f.normalize();
  const r=BABYLON.Vector3.Cross(f,BABYLON.Axis.Y).scale(-1);
  const d=f.scale(input.moveVec.z).add(r.scale(input.moveVec.x));
  camera.cameraDirection = d.lengthSquared()>0 ? d.normalize().scale(sp*dt*60*0.0167) : BABYLON.Vector3.Zero();
}
function applyLookFromInput(look){
  if(!camera) return; const sens=0.0023; camera.rotation.y += look.x*sens;
  const min=-Math.PI/2+0.15,max=Math.PI/2-0.15; const pitch=(camera.rotation.x||0)+(-look.y*sens*0.8);
  camera.rotation.x = Math.min(max,Math.max(min,pitch));
}

/* ————— Inventory / Belt / Items ————— */
let activeItemSlot=1;
const inventory={
  slots:{1:null,2:null,3:null,4:'Lighter',5:'Notebook'},
  slotCharges:{1:0,2:0,3:0,4:Infinity,5:Infinity},
  defaultCharges:{'Smudge':1,'Salt':3}
};
function labelForSlot(i){ const it=inventory.slots[i]||'-'; const c=inventory.slotCharges[i]; if(isFinite(c)) return `${it} (${c})`; return it; }
function rebuildBelt(){
  const belt=document.getElementById('belt'); belt.innerHTML='';
  for(let i=1;i<=5;i++){
    const div=document.createElement('div'); div.className='slot'+(i===activeItemSlot?' active':''); div.dataset.slot=i;
    const k=document.createElement('div'); k.className='key'; k.textContent=i; div.appendChild(k);
    const s=document.createElement('div'); s.style.cssText='font-size:11px;color:#8ff;text-align:center'; s.textContent=labelForSlot(i); div.appendChild(s);
    div.onclick=ev=>{ ev.stopPropagation(); selectSlot(i); }; belt.appendChild(div);
  }
  refreshCameraOverlay(); syncHeldLights();
}
function selectSlot(n){ activeItemSlot=n; rebuildBelt(); }
function decChargeForActive(){
  const i=activeItemSlot; let c=inventory.slotCharges[i]??0; if(c===Infinity) return true; if(c<=0) return false;
  inventory.slotCharges[i]=c-1; if(inventory.slotCharges[i]<=0){ toast(`${inventory.slots[i]} depleted.`,900); inventory.slots[i]=null; }
  rebuildBelt(); return true;
}

/* ————— UV Cone + IR overlay ————— */
let uvCone=null;
function buildUVCone(){
  const h=6,r=1.7;
  uvCone=BABYLON.MeshBuilder.CreateCylinder("uvCone",{diameterTop:0,diameterBottom:r,height:h,tessellation:24,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);
  uvCone.parent=camera; uvCone.rotation.x=Math.PI/2; uvCone.position.z= h*0.5; uvCone.isPickable=false; uvCone.visibility=0;
  const m=new BABYLON.StandardMaterial("uvMat",scene); m.emissiveColor=new BABYLON.Color3(0.6,0.2,0.9); m.alpha=0.18; m.backFaceCulling=false; uvCone.material=m;
}
let flashOn=false, uvOn=false, irOn=false;
function refreshCameraOverlay(){ const show=inventory.slots[activeItemSlot]==='Camera'; document.getElementById('camera-overlay').style.display = show?'block':'none'; document.getElementById('camera-ir').style.display = (show && irOn)?'block':'none'; }
function syncHeldLights(){
  if(!flashLight||!uvLight||!irLight) return;
  flashLight.intensity=uvLight.intensity=irLight.intensity=0;
  const it=inventory.slots[activeItemSlot];
  if(it==='Flashlight' && flashOn) flashLight.intensity=3.0;
  if(it==='UV Light' && uvOn){ uvLight.intensity=2.0; if(uvCone) uvCone.visibility=0.25; } else if(uvCone) uvCone.visibility=0;
  if(it==='Camera' && irOn) { irLight.intensity=1.6; }
}

/* ————— Salt strips + UV footprints ————— */
const salt={ strips:[], preview:null, canPlace:true };
function ensureSaltPreview(){
  if(salt.preview) return;
  const p=BABYLON.MeshBuilder.CreateGround("saltPreview",{width:1.4,height:0.25},scene);
  const m=new BABYLON.StandardMaterial("saltPrevMat",scene); m.emissiveColor=new BABYLON.Color3(0.9,0.9,1); m.alpha=0.35; m.backFaceCulling=false; p.material=m; p.isPickable=false; p.visibility=0; salt.preview=p;
}
function saltPreviewTick(){
  if(inventory.slots[activeItemSlot]!=='Salt') { if(salt.preview) salt.preview.visibility=0; return; }
  ensureSaltPreview();
  const pos=camera.position.add(camera.getForwardRay().direction.scale(1.2));
  const y=pickGroundHeightAt(pos.x,pos.z);
  salt.preview.position.copyFromFloats(pos.x,y+0.01,pos.z);
  salt.preview.rotation.y = camera.rotation.y;
  salt.preview.visibility=0.35;
}
function placeActiveItem(){
  const it=inventory.slots[activeItemSlot]; if(!it) return;
  if(it==='Salt'){
    if(!decChargeForActive()) return;
    const pos=camera.position.add(camera.getForwardRay().direction.scale(1.2));
    const y=pickGroundHeightAt(pos.x,pos.z);
    const strip=BABYLON.MeshBuilder.CreateGround("saltStrip",{width:1.4,height:0.25},scene);
    const m=new BABYLON.StandardMaterial("saltMat",scene); m.emissiveColor=new BABYLON.Color3(1,1,1); m.alpha=0.9; strip.material=m; strip.isPickable=true;
    strip.position.copyFromFloats(pos.x,y+0.01,pos.z); strip.rotation.y=camera.rotation.y;
    salt.strips.push({mesh:strip, t:0, cooldown:0});
    toast("Salt placed.",900); return;
  }
  // motion sensor / crucifix, etc. could go here later
}
function trySaltTriggerAt(pos,dir){
  // Ghost stepping on nearest strip?
  let nearest=null, best=999;
  for(const s of salt.strips){
    const d=BABYLON.Vector3.Distance(pos,s.mesh.position);
    if(d<1.2 && d<best && s.cooldown<=0) { nearest=s; best=d; }
  }
  if(!nearest) return;
  nearest.cooldown=12; // anti-spam
  spawnFootprintsFrom(nearest.mesh.position, dir);
}
const footprints=[];
function spawnFootprintsFrom(start,dir){
  const n=4 + (Math.random()<0.5?1:0);
  const step=0.55;
  for(let i=0;i<n;i++){
    const p=start.add(dir.scale((i+1)*step));
    const y=pickGroundHeightAt(p.x,p.z);
    const f=BABYLON.MeshBuilder.CreateGround("uvFoot",{width:0.22,height:0.36},scene);
    const mat=new BABYLON.StandardMaterial("uvFootMat",scene); mat.emissiveColor=new BABYLON.Color3(0.7,0.3,1); mat.alpha=0.0; f.material=mat; f.isPickable=false;
    f.position.copyFromFloats(p.x,y+0.012,p.z); f.rotation.y=Math.atan2(dir.x,dir.z);
    footprints.push({mesh:f, life:60, visible:false});
  }
}
function uvFootprintsTick(dt){
  // show only when UV on AND beam intersects footprint
  const show = (inventory.slots[activeItemSlot]==='UV Light' && uvOn);
  const camPos=camera.position; const fwd=camera.getForwardRay().direction;
  const coneAngle=Math.cos(Math.PI/6); // ~30 deg
  const maxDist=6.0;
  for(let i=footprints.length-1;i>=0;i--){
    const fp=footprints[i]; fp.life-=dt; if(fp.life<=0){ fp.mesh.dispose(); footprints.splice(i,1); continue; }
    if(show){
      const v=fp.mesh.position.subtract(camPos); v.y=0; const d=v.length(); const ok = (d<maxDist) && (BABYLON.Vector3.Dot(v.normalize(), fwd)>coneAngle);
      const targetAlpha = ok?0.85:0.0;
      fp.mesh.material.alpha = BABYLON.Scalar.Lerp(fp.mesh.material.alpha, targetAlpha, 0.25);
    } else {
      fp.mesh.material.alpha = 0.0;
    }
  }
}

/* ————— EMF Reader (beeps + level 2..5) ————— */
const EMF = {
  on:false, level:0, ctx:null, beeper:null, lastPing:0, indicator:null,
  ensureAudio(){ if(this.ctx) return; try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch{} },
  startBeep(freq=850, dur=0.12, vol=0.06){
    if(!this.ctx) return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.frequency.value=freq; o.type='square'; g.gain.value=vol;
    o.connect(g).connect(this.ctx.destination); o.start();
    setTimeout(()=>{ try{o.stop();}catch{} }, dur*1000);
  },
  tick(dt){
    if(!this.on) return;
    // Level depends on nearby ghost or disturbed proxy item
    const nearGhost = ghost.mesh ? BABYLON.Vector3.Distance(ghost.mesh.position, camera.position) < 4.0 : false;
    let target = nearGhost ? (Math.random()<0.3?5:2) : 0;

    // also check proxy interactive items within 0.6m radius that were nudged
    const near = ProxyItemSystem.nearestNudged(camera.position, 0.6);
    if(near) target = Math.max(target, 2);

    // settle
    this.level = BABYLON.Scalar.Lerp(this.level, target, 0.25);
    // pattern
    const now = performance.now();
    if(this.level>=4.7){ // solid tone for ~10s bursts
      if(now - this.lastPing > 260){
        this.startBeep(950,0.25,0.07);
        this.lastPing = now;
      }
    } else if(this.level>=1.5){ // beep...beep...
      if(now - this.lastPing > (700 + Math.random()*700)){
        const f=650 + Math.random()*120;
        this.startBeep(f,0.12,0.055);
        this.lastPing = now;
      }
    }
    if(this.indicator){ this.indicator.alpha = this.on ? 0.9 : 0.0; }
  }
};

/* ————— Proxy Items (simple boxes/cyls for EMF interactions) ————— */
const ProxyItemSystem = {
  list:[],
  scatter(n=20){
    for(let i=0;i<n;i++){
      const type = (Math.random()<0.5)?'box':'cyl';
      const m = type==='box' ? BABYLON.MeshBuilder.CreateBox("pBox",{size:0.3},scene)
                             : BABYLON.MeshBuilder.CreateCylinder("pCyl",{diameter:0.22,height:0.12},scene);
      const x=18+Math.random()*40, z=-150+Math.random()*60;
      const y=pickGroundHeightAt(x,z)+0.06;
      m.position.copyFromFloats(x,y,z); m.rotation.y=Math.random()*Math.PI*2;
      const mat=new BABYLON.StandardMaterial("pMat",scene); mat.diffuseColor=new BABYLON.Color3(0.25,0.25,0.28); m.material=mat; m.checkCollisions=true;
      this.list.push({mesh:m, lastNudge:0});
    }
  },
  nudgeIfNearGhost(dt){
    if(!ghost.mesh) return;
    for(const p of this.list){
      const d=BABYLON.Vector3.Distance(p.mesh.position, ghost.mesh.position);
      if(d<1.2 && (performance.now()-p.lastNudge)>1500){
        p.mesh.rotation.y += (Math.random()<0.5?-1:1)*0.35;
        p.lastNudge = performance.now();
      }
    }
  },
  nearestNudged(pos,rad){
    let best=null, bd=rad;
    for(const p of this.list){
      if(performance.now()-p.lastNudge < 10000){
        const d=BABYLON.Vector3.Distance(p.mesh.position,pos);
        if(d<bd){ bd=d; best=p; }
      }
    }
    return best;
  }
};

/* ————— Ghost profiles (slim) ————— */
const GHOST_PROFILES = {
  spirit:{ leash:Infinity, roam:12, modifiers:{} },
  goryo :{ leash:4, roam:0, modifiers:{} },
  mimic :{ leash:10, roam:10, modifiers:{ orbs:true } },
  shade :{ leash:12, roam:8, modifiers:{} }
};
const ghostPolygon = [
  new BABYLON.Vector3(18.404, 0, -96.040),
  new BABYLON.Vector3(57.205, 0, -94.031),
  new BABYLON.Vector3(62.145, 0, -105.142),
  new BABYLON.Vector3(61.872, 0, -149.928),
  new BABYLON.Vector3(18.660, 0, -149.900)
];
function pointInPolyXZ(p, poly){ let inside=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const xi=poly[i].x, zi=poly[i].z, xj=poly[j].x, zj=poly[j].z; const it=((zi>p.z)!=(zj>p.z)) && (p.x < (xj-xi)*(p.z-zi)/(zj-zi)+xi); if(it) inside=!inside; } return inside; }
function randomPointInPolygonXZ(poly){ let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity; poly.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z);});
  for(let i=0;i<300;i++){ const x=minX+Math.random()*(maxX-minX), z=minZ+Math.random()*(maxZ-minZ); const p=new BABYLON.Vector3(x,0,z); if(pointInPolyXZ(p,poly)) return p; } return poly[0].clone();
}
function pickGroundHeightAt(x,z){
  const ray=new BABYLON.Ray(new BABYLON.Vector3(x, 80, z), new BABYLON.Vector3(0,-1,0), 200);
  const hit=scene.pickWithRay(ray, m=> m && m.isPickable);
  return (hit.hit && hit.pickedPoint)? hit.pickedPoint.y : 1.2;
}

/* ————— Boot / Scene ————— */
async function loadMap(){
  try{
    const result=await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/map/", "Abandoned_House.glb", scene);
    houseRoot = result.meshes[0] || result.meshes.find(m=>m.name==="__root__");
    result.meshes.forEach(m=>{ m.checkCollisions=true; m.isPickable=true; m.receiveShadows=true; });
    // spawn near van zone ground
    const y=pickGroundHeightAt(vanZone.center.x, vanZone.center.z);
    camera.position.copyFromFloats(vanZone.center.x, y+1.7, vanZone.center.z);
  }catch(e){
    console.warn("Map load failed, using ground fallback", e);
    const ground=BABYLON.MeshBuilder.CreateGround("fallbackGround",{width:200,height:200},scene);
    ground.position.y=0; ground.checkCollisions=true;
    const gmat=new BABYLON.StandardMaterial("gmat",scene); gmat.diffuseColor=new BABYLON.Color3(0.06,0.08,0.12); gmat.specularColor=new BABYLON.Color3(0,0,0);
    ground.material=gmat;
    camera.position.copyFromFloats(0,2,0);
  }
}
function afterMapLoadedForShadows(){ (scene.meshes||[]).forEach(m=> m && (m.receiveShadows = true)); }
function adoptExistingGltfLights(){ return 0; }
function buildHouseLights(){
  const place = [new BABYLON.Vector3(40,3.6,-120), new BABYLON.Vector3(58,3.6,-140), new BABYLON.Vector3(25,3.6,-110)];
  place.forEach((p,i)=>{ const L=new BABYLON.PointLight("houseLight_"+i,p,scene); L.range=14; L.intensity=0.0; L.diffuse=new BABYLON.Color3(1,0.95,0.8); houseLights.push({light:L,mesh:null}); });
}
function toggleNearestHouseLight(){
  if(!housePower) return toast("Power is off.",900);
  let best=null,bd=9e9;
  houseLights.forEach(h=>{ const pos=h.light.position; const d=BABYLON.Vector3.Distance(pos,camera.position); if(d<bd){bd=d; best=h;} });
  if(!best) return; best.light.intensity = best.light.intensity>0 ? 0 : 0.8;
}
function setHousePower(on){ housePower=on; houseLights.forEach(h=> h.light.intensity = on ? 0.8 : 0); }

function setupNightAtmosphere(){
  scene.clearColor=new BABYLON.Color4(0.01,0.01,0.02,1);
  scene.fogMode=BABYLON.Scene.FOGMODE_EXP2; scene.fogDensity=0.0045; scene.fogColor=new BABYLON.Color3(0.02,0.03,0.05);
  // fill + moon + flashlight/uv/ir
  hemiLight=new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene); hemiLight.intensity=0.06;
  moonLight=new BABYLON.DirectionalLight("moonLight", new BABYLON.Vector3(-0.2,-1,0.1), scene); moonLight.position=new BABYLON.Vector3(0,200,0); moonLight.intensity=0.45;
  moonShadows=new BABYLON.ShadowGenerator(2048, moonLight); moonShadows.useBlurExponentialShadowMap=true; moonShadows.blurKernel=16; moonShadows.bias=0.001; moonShadows.normalBias=0.5;
  flashLight=new BABYLON.SpotLight("flashLight", new BABYLON.Vector3(0,0,0), new BABYLON.Vector3(0,0,1), Math.PI/3, 10, scene);
  flashLight.parent=camera; flashLight.intensity=0; flashLight.range=40; flashLight.diffuse=new BABYLON.Color3(1,0.98,0.92); flashLight.specular=new BABYLON.Color3(0.8,0.8,0.8);
  flashShadows=new BABYLON.ShadowGenerator(1024, flashLight); flashShadows.useBlurExponentialShadowMap=true;
  uvLight=new BABYLON.SpotLight("uvLight", new BABYLON.Vector3(0,0,0), new BABYLON.Vector3(0,0,1), Math.PI/3, 8, scene); uvLight.parent=camera; uvLight.intensity=0; uvLight.range=30; uvLight.diffuse=new BABYLON.Color3(0.6,0.3,0.9);
  irLight=new BABYLON.SpotLight("irLight", new BABYLON.Vector3(0,0,0), new BABYLON.Vector3(0,0,1), Math.PI/2, 10, scene); irLight.parent=camera; irLight.intensity=0; irLight.diffuse=new BABYLON.Color3(0.4,0.6,0.4);
}
async function loadMoon(){
  try{
    const r=await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/sky/", "moon.glb", scene);
    const m=r.meshes.find(x=>x.name && x.name!=="__root__")||r.meshes[0]; if(m){ m.isPickable=false; m.applyFog=false; m.renderingGroupId=1; m.position.copyFromFloats(0,350,380); }
  }catch{}
}
async function loadItems(){
  try{
    const res=await BABYLON.SceneLoader.LoadAssetContainerAsync("", "./assets/models/items/exploration_objects.glb", scene);
    itemsGlb=res; // meshes available if needed for future visual items
  }catch(e){ console.warn("Items load failed", e); }
}
async function loadGhost(){
  const choice = ['ghost1.glb','ghost2.glb','ghost3.glb','ghost4.glb','ghost5.glb'][(Math.random()*5)|0];
  try{
    const r=await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/ghosts/", choice, scene);
    const g=r.meshes[0]||r.meshes.find(m=>m.name==="__root__"); if(!g) throw new Error("no meshes");
    g.isPickable=false; g.checkCollisions=false;
    const bb=g.getHierarchyBoundingVectors(true); const h=bb.max.y-bb.min.y; const s=(1.9/(h||1)); g.scaling.copyFromFloats(s,s,s);
    const p=randomPointInPolygonXZ(ghostPolygon); p.y=pickGroundHeightAt(p.x,p.z); g.position.copyFrom(p);
    ghost.mesh=g; ghost.roomCenter=p.clone(); ghost.profile = pickGhostProfile();
    if(moonShadows) moonShadows.addShadowCaster(g,true); if(flashShadows) flashShadows.addShadowCaster(g,true);
  }catch(e){
    const m=BABYLON.MeshBuilder.CreateBox("fallbackGhost",{size:1.2},scene);
    const mat=new BABYLON.StandardMaterial("fgMat",scene); mat.alpha=0.35; mat.emissiveColor=new BABYLON.Color3(0.6,0.6,1); m.material=mat; m.isPickable=false;
    const p=randomPointInPolygonXZ(ghostPolygon); p.y=pickGroundHeightAt(p.x,p.z); m.position.copyFrom(p);
    ghost.mesh=m; ghost.roomCenter=p.clone(); ghost.profile = pickGhostProfile();
  }
}
function pickGhostProfile(){ const keys=Object.keys(GHOST_PROFILES); return keys[(Math.random()*keys.length)|0]; }

function setWeather(state){
  weather.state=state; const el=document.getElementById('hud-weather'); if(el) el.textContent=state;
  weather.modSanityDrain=1; weather.modHuntChance=1; weather.modHuntPace=1;
  if(state==='Blood Moon'){ scene.imageProcessingConfiguration.exposure=0.55; scene.fogColor=new BABYLON.Color3(0.06,0.01,0.02); weather.modSanityDrain=1.25; weather.modHuntChance=1.4; weather.modHuntPace=1.2; }
  else { scene.imageProcessingConfiguration.exposure=0.8; scene.fogColor=new BABYLON.Color3(0.02,0.03,0.05); }
  if(state==='Rain' || state==='Blood Moon'){
    scheduleNextLightning();
    if(!weather.rainPS){
      const ps=new BABYLON.ParticleSystem("rain",2500,scene);
      ps.particleTexture=new BABYLON.Texture("./assets/images/nosignal.gif",scene);
      ps.minEmitBox=new BABYLON.Vector3(-80,50,-80); ps.maxEmitBox=new BABYLON.Vector3(80,50,80);
      ps.minSize=0.05; ps.maxSize=0.1; ps.minLifeTime=0.9; ps.maxLifeTime=1.4; ps.emitRate=1200;
      ps.direction1=new BABYLON.Vector3(0,-1.2,0); ps.direction2=new BABYLON.Vector3(0,-1.0,0); ps.gravity=new BABYLON.Vector3(0,-9.8,0); ps.disposeOnStop=false;
      weather.rainPS=ps;
    }
    weather.rainPS.start();
  } else { if(weather.rainPS) weather.rainPS.stop(); }
}

/* ————— Sanity + Hunt + Ghost Update ————— */
let huntClock=0, huntCooldown=22+Math.random()*18, flickerOn=false, flickerTimer=0;
function inVanZone(pos){ return BABYLON.Vector3.Distance(pos, vanZone.center) <= vanZone.radius; }
function sanityTick(dt){
  const nearGhost = ghost.mesh ? BABYLON.Vector3.Distance(ghost.mesh.position, camera.position) < 7 : false;
  const base=0.6/60, add=nearGhost?1.2/60:0;
  const drain=(base+add)*(inVanZone(camera.position)?0.4:1)*(weather.modSanityDrain||1);
  player.sanity=Math.max(0, player.sanity - drain);
  document.getElementById('hud-sanity').textContent=`${player.sanity|0}%`;
  document.getElementById('hud-room').textContent = inVanZone(camera.position) ? 'Van' : 'Grounds';

  if(!ghost.hunting && !inVanZone(camera.position) && player.sanity<=65){
    huntClock+=dt*(weather.modHuntPace||1);
    if(huntClock>=huntCooldown){ huntClock=0; huntCooldown=22+Math.random()*18; const baseChance=(player.sanity<40?0.85:0.55); if(Math.random()<baseChance*(weather.modHuntChance||1)) beginHunt(); }
  }
  if(ghost.hunting && (inVanZone(camera.position) || Math.random()<0.0015)) endHunt();
}
function beginHunt(){ ghost.hunting=true; document.getElementById('hud-hunt-state').textContent='HUNTING'; flickerOn=true; toast('⚠️ Hunt started!',1200); }
function endHunt(){ ghost.hunting=false; document.getElementById('hud-hunt-state').textContent='Calm'; flickerOn=false; toast('Hunt ended.',900); }
function flickerFlick(dt){
  flickerTimer+=dt; if(flickerTimer>0.08){ flickerTimer=0; houseLights.forEach(h=>{ if(!housePower) return; h.light.intensity=(Math.random()<0.65)? 0.2+Math.random()*0.9 : 0.0; }); }
}
function updateGhost(dt){
  if(!ghost.mesh) return;
  // wandering target
  const prof=GHOST_PROFILES[ghost.profile]||GHOST_PROFILES.spirit;
  const leash=prof.leash, roam=prof.roam;
  if(!ghost.target || BABYLON.Vector3.Distance(ghost.mesh.position, ghost.target)<1){
    if(isFinite(roam) && roam>0){
      // pick within roam around roomCenter
      const ang=Math.random()*Math.PI*2; const d=Math.random()*roam;
      const o=new BABYLON.Vector3(Math.cos(ang)*d,0,Math.sin(ang)*d); const c=ghost.roomCenter.add(o);
      c.y=pickGroundHeightAt(c.x,c.z); ghost.target=c;
    }else{
      const p=randomPointInPolygonXZ(ghostPolygon); p.y=pickGroundHeightAt(p.x,p.z); ghost.target=p;
    }
  }
  let targ = ghost.target;
  // leash for Goryo etc.
  if(isFinite(leash)){
    const d=BABYLON.Vector3.Distance(ghost.mesh.position, ghost.roomCenter);
    if(d>leash){ targ = ghost.roomCenter; }
  }
  const pos=ghost.mesh.position; const dir=targ.subtract(pos); dir.y=0; const len=dir.length(); if(len>0.001){ dir.normalize(); ghost.mesh.moveWithCollisions(dir.scale((ghost.hunting?ghost.speed:ghost.slowSpeed)*dt*60*0.022)); }
  // Align facing
  if(len>0.001){ ghost.mesh.rotationQuaternion=null; ghost.mesh.rotation.y = Math.atan2(dir.x,dir.z); }

  // salt trigger
  trySaltTriggerAt(ghost.mesh.position, dir.length()>0.001?dir: new BABYLON.Vector3(1,0,0));
}

/* ————— EMF / Use / Toss ————— */
function useActiveItem(){
  const it=inventory.slots[activeItemSlot]; if(!it) return;
  if(it==='Flashlight'){ flashOn=!flashOn; uvOn=false; irOn=false; syncHeldLights(); return; }
  if(it==='UV Light'){ uvOn=!uvOn; flashOn=false; irOn=false; syncHeldLights(); return; }
  if(it==='Camera'){ irOn=!irOn; flashOn=false; uvOn=false; refreshCameraOverlay(); syncHeldLights(); return; }
  if(it==='EMF'){ EMF.ensureAudio(); EMF.on=!EMF.on; toast(`EMF ${EMF.on?'on':'off'}`,800); return; }
  if(it==='Smudge'){ if(decChargeForActive()) toast("Air thickens—and clears.",900); return; }
  if(it==='Salt'){ /* Place via Place button */ toast("Aim and press Place to pour.",900); return; }
  if(it==='Notebook'){ openNotebook(); return; }
}
function tossActiveItem(){
  const it=inventory.slots[activeItemSlot]; if(!it || it==='Notebook') return;
  // spawn simple proxy mesh to represent tossed item
  const m=BABYLON.MeshBuilder.CreateBox("toss",{size:0.18},scene);
  const mat=new BABYLON.StandardMaterial("tossMat",scene); mat.diffuseColor=new BABYLON.Color3(0.8,0.8,0.85); m.material=mat; m.checkCollisions=true;
  const p=camera.position.add(camera.getForwardRay().direction.scale(0.7));
  const y=pickGroundHeightAt(p.x,p.z)+0.2;
  m.position.copyFromFloats(p.x,y,p.z);
  const vel=camera.getForwardRay().direction.scale(0.22); vel.y=0.16;
  // simple ballistic
  let t=0; const id=scene.onBeforeRenderObservable.add(()=>{
    const dt=engine.getDeltaTime()/1000; t+=dt; vel.y -= 9.8*dt*0.25; m.moveWithCollisions(vel.scale(60*dt*0.0167));
    const gy=pickGroundHeightAt(m.position.x,m.position.z); if(m.position.y<=gy+0.01 && t>0.12){ m.position.y=gy+0.01; scene.onBeforeRenderObservable.remove(id); }
  });
  // make it interactive for EMF
  ProxyItemSystem.list.push({mesh:m,lastNudge:performance.now()});
  // remove from hand
  inventory.slots[activeItemSlot]=null; inventory.slotCharges[activeItemSlot]=0; rebuildBelt();
}
function openNotebook(){ toast("Notebook (placeholder UI)",900); }

/* ————— HUD XYZ ————— */
function updateXYZ(){
  const box=document.getElementById('hud-xyz'); if(!box||!camera) return;
  box.style.display='block';
  document.getElementById('hud-x').textContent = camera.position.x.toFixed(2);
  document.getElementById('hud-y').textContent = camera.position.y.toFixed(2);
  document.getElementById('hud-z').textContent = camera.position.z.toFixed(2);
}

/* ————— Boot ————— */
async function boot(){
  engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true,disableWebGL2Support:false});
  try{ engine.setHardwareScalingLevel(1/(window.devicePixelRatio||1)); }catch{}
  scene=new BABYLON.Scene(engine); scene.environmentTexture=null; scene.collisionsEnabled=true; scene.gravity=new BABYLON.Vector3(0,-0.5,0);
  camera=new BABYLON.UniversalCamera("playerCam", new BABYLON.Vector3(43.657,3,-119.008), scene);
  camera.attachControl(canvas,true); camera.applyGravity=true; camera.checkCollisions=true; camera.ellipsoid=new BABYLON.Vector3(0.35,0.9,0.35); camera.ellipsoidOffset=new BABYLON.Vector3(0,0.4,0);
  camera.keysUp=[87]; camera.keysDown=[83]; camera.keysLeft=[65]; camera.keysRight=[68]; camera.minZ=0.1; camera.inertia=0; camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

  setupNightAtmosphere();
  await loadMap(); afterMapLoadedForShadows(); if(!adoptExistingGltfLights()) buildHouseLights();
  await loadItems(); await loadGhost(); await loadMoon(); buildUVCone();

  InputSystem.init(canvas); rebuildBelt(); ProxyItemSystem.scatter(24);

  scene.onBeforeRenderObservable.add(()=>{
    const dt=engine.getDeltaTime()/1000; const input=InputSystem.snapshot();
    handleMovementFromInput(input,dt); applyLookFromInput(input.lookDelta);

    for(const a of input.actions){
      switch(a){
        case 'use': useActiveItem(); break;
        case 'place': placeActiveItem(); break;
        case 'toss': tossActiveItem(); break;
        case 'openNotebook': openNotebook(); break;
        case 'toggleFlash': flashOn=!flashOn; uvOn=false; irOn=false; syncHeldLights(); break;
        case 'toggleUV': uvOn=!uvOn; flashOn=false; irOn=false; syncHeldLights(); break;
        case 'toggleIR': irOn=!irOn; flashOn=false; uvOn=false; refreshCameraOverlay(); syncHeldLights(); break;
        case 'slot1': case 'slot2': case 'slot3': case 'slot4': case 'slot5':
          selectSlot(parseInt(a.replace('slot',''),10)); break;
        case 'slotNext': activeItemSlot = activeItemSlot>=5?1:(activeItemSlot+1); rebuildBelt(); break;
        case 'slotPrev': activeItemSlot = activeItemSlot<=1?5:(activeItemSlot-1); rebuildBelt(); break;
      }
    }

    // Weather updates
    if(weather.state==='Rain' || weather.state==='Blood Moon'){
      weather.lightningTimer+=dt; if(weather.lightningTimer>weather.nextStrike){ lightningStrike(); scheduleNextLightning(); }
      if(weather.rainPS) weather.rainPS.emitRate = inVanZone(camera.position)?0:1800;
    }

    // Systems
    sanityTick(dt);
    if(flickerOn) flickerFlick(dt);
    updateGhost(dt);
    ProxyItemSystem.nudgeIfNearGhost(dt);
    uvFootprintsTick(dt);
    saltPreviewTick();
    EMF.tick(dt);
    updateXYZ();
  });

  engine.runRenderLoop(()=> scene.render());
  window.addEventListener('resize', ()=>engine.resize());

  toast("F=Flash, U=UV, I=IR, L=nearest light, P=power. Use/Place/Toss buttons below.",3000);

  // Light/power hotkeys
  window.addEventListener('keydown',e=>{
    if(e.repeat) return;
    if(e.key==='l'||e.key==='L') toggleNearestHouseLight();
    if(e.key==='p'||e.key==='P') setHousePower(!housePower);
  });
}

/* ————— Start Flow ————— */
let __started=false, __starting=false;
function requestPointerLock(){ const c=canvas; try{ c.requestPointerLock&&c.requestPointerLock(); }catch{} }
async function safeStart(){
  if(__started||__starting) return; __starting=true;
  if(!window.BABYLON||!BABYLON.Engine){ toast("Engine not ready. Check Babylon includes.",2200); __starting=false; return; }
  const scr=document.getElementById('title-screen'); const hud=document.getElementById('hud'); const btn=document.getElementById('start-button');
  try{
    if(btn){ btn.disabled=true; btn.textContent='Starting…'; }
    if(scr) scr.style.display='none'; if(hud) hud.style.display='block';
    requestPointerLock();
    await boot();
    const r=Math.random(); const w= r<0.40?'Clear': r<0.65?'Rain': r<0.85?'Snow':'Blood Moon';
    setWeather(w);
    toast(`Investigation started. Weather: ${w}.`,1600);
    __started=true;
  }catch(e){
    console.error("Startup error",e); if(hud) hud.style.display='none'; if(scr){ scr.style.display='flex'; if(btn){ btn.disabled=false; btn.textContent='Start Investigation'; } }
  }finally{ __starting=false; }
}
function bindStart(){
  const btn=document.getElementById('start-button'); const scr=document.getElementById('title-screen');
  if(btn && !btn.__wired){ btn.__wired=true; btn.addEventListener('click',e=>{e.stopPropagation(); safeStart();}); btn.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.code==='Space'){ e.preventDefault(); safeStart(); } }); }
  if(scr && !scr.__wired){ scr.__wired=true; scr.addEventListener('click',e=>{ if(e.target===scr) safeStart(); }); }
}
document.addEventListener('DOMContentLoaded',bindStart);
window.addEventListener('load',bindStart);
window.addEventListener('keydown',e=>{ const scr=document.getElementById('title-screen'); if(scr && scr.style.display!=='none' && (e.key==='Enter'||e.code==='Space')){ e.preventDefault(); safeStart(); }});
</script>
