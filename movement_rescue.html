<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Movement Rescue</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="./cdn/babylon.js"></script>
<script src="./cdn/earcut.min.js"></script>
<script src="./cdn/meshopt_decoder.js"></script>
<script src="./cdn/draco_decoder_gltf.js"></script>
<script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script>
<script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
<style>
  html,body{height:100%;margin:0;background:#0a0f14}
  #renderCanvas{width:100%;height:100%;display:block;outline:0}
  .hint{position:fixed;left:12px;bottom:12px;color:#9fe;opacity:.9;font:600 12px system-ui;
        background:#0b1220cc;padding:8px 10px;border-radius:8px}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div class="hint">Click canvas to lock mouse • WASD to move • Shift run • V toggle 3rd/1st person</div>
<script>
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true);
  window.ENGINE = engine;
  function createScene(){
    const scene = new BABYLON.Scene(engine);
    window.scene = scene;
    // Basic world
    const light = new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0,1,0), scene);
    light.intensity = 0.9;
    const ground = BABYLON.MeshBuilder.CreateGround('ground',{width:200, height:200}, scene);
    ground.checkCollisions = true;
    const gmat = new BABYLON.StandardMaterial('gmat', scene); gmat.diffuseColor = new BABYLON.Color3(0.12,0.12,0.12);
    ground.material = gmat;
    return scene;
  }
  window.createScene = createScene;
  const scene = createScene();
  engine.runRenderLoop(()=> scene.render());
  addEventListener('resize', ()=> engine.resize());
</script>
<script src="./movement_rig_clean.js"></script>
</body>
</html>
