<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DevTools Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; height:100%; font:14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:#0b0b0d; color:#cfefff; }
    header { padding:10px 12px; background:#0f1117; border-bottom:1px solid #1e2635; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    header h1 { margin:0; font-size:14px; color:#8dd9ff; letter-spacing:.3px; }
    header button, header select { background:#111827; color:#d1eaff; border:1px solid #1e2635; border-radius:8px; padding:6px 10px; cursor:pointer; }
    header button:hover { background:#162132; }
    main { display:grid; grid-template-columns:1fr; gap:10px; padding:10px; }
    .grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
    @media (max-width:700px){ .grid { grid-template-columns:1fr; } }
    .card { background:#0f1421; border:1px solid #1e2635; border-radius:10px; padding:10px; }
    .card h2 { margin:0 0 8px 0; font-size:13px; color:#98ecff; }
    .kv { display:grid; grid-template-columns:120px 1fr; gap:6px 8px; }
    .kv div.key { color:#86b4d4; opacity:.9; }
    .kv div.val { color:#e8fbff; }
    .mono { font-family:inherit; white-space:pre-wrap; }
    #log { height:200px; overflow:auto; background:#0b0f19; border:1px solid #1e2635; border-radius:8px; padding:8px; color:#cbdcf8; }
    footer { padding:8px 12px; border-top:1px solid #1e2635; color:#86b4d4; font-size:12px; opacity:.85; }
    .ok { color:#9ff5a0; } .warn { color:#ffd27f; } .bad { color:#ff8a8a; }
    .pill { display:inline-block; padding:2px 6px; border-radius:999px; background:#172033; border:1px solid #284063; color:#a8d6ff; font-size:12px; margin-left:4px; }
  </style>
</head>
<body>
  <header>
    <h1>DevTools Overlay <span id="status" class="pill">idle</span></h1>
    <button id="btnHandshake">Handshake</button>
    <button id="btnClearLog">Clear log</button>
  </header>

  <main>
    <div class="grid">
      <section class="card">
        <h2>Player</h2>
        <div class="kv">
          <div class="key">Room</div><div class="val" id="p-room">?</div>
          <div class="key">X</div><div class="val" id="p-x">0</div>
          <div class="key">Y</div><div class="val" id="p-y">0</div>
          <div class="key">Z</div><div class="val" id="p-z">0</div>
        </div>
      </section>

      <section class="card">
        <h2>Ghost</h2>
        <div class="kv">
          <div class="key">Hunting</div><div class="val" id="g-hunt">false</div>
          <div class="key">X</div><div class="val" id="g-x">0</div>
          <div class="key">Y</div><div class="val" id="g-y">0</div>
          <div class="key">Z</div><div class="val" id="g-z">0</div>
          <div class="key">Fast twin</div><div class="val" id="g-fast">—</div>
        </div>
      </section>

      <section class="card" style="grid-column:1 / -1;">
        <h2>Evidence</h2>
        <div id="evidence" class="mono">Awaiting events…</div>
      </section>

      <section class="card" style="grid-column:1 / -1;">
        <h2>Log</h2>
        <div id="log" class="mono"></div>
      </section>
    </div>
  </main>

  <footer>
    Overlay listens for <code>postMessage</code> from the game window. Use the “Open External Overlay” button in Dev Tools.
  </footer>

  <script>
    let lastHandshakeAt = 0;
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const evEl = document.getElementById('evidence');

    const $ = id => document.getElementById(id);
    const setText = (id, v) => $(id).textContent = v;

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = 'pill ' + (cls || '');
    }

    function log(line) {
      const ts = new Date().toLocaleTimeString();
      logEl.textContent += `[${ts}] ${line}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function tryHandshake() {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: 'overlay-hello', overlay: true }, '*');
        lastHandshakeAt = Date.now();
        setStatus('handshake→', 'warn');
        log('Sent handshake to opener.');
      } else {
        setStatus('no-opener', 'bad');
        log('No opener available (open this via the game UI).');
      }
    }

    // Buttons
    $('btnHandshake').addEventListener('click', tryHandshake);
    $('btnClearLog').addEventListener('click', () => { logEl.textContent = ''; });

    // Handle incoming messages from the game
    window.addEventListener('message', (ev) => {
      const d = ev.data || {};
      if (d.type === 'handshake') {
        setStatus('connected', 'ok');
        log('Handshake received from game.');
        return;
      }

      if (d.type === 'log') {
        log(d.text || '(empty log)');
        return;
      }

      if (d.type === 'xyz') {
        setText('p-room', d.room ?? '?');
        setText('p-x', d.x?.toFixed?.(2) ?? d.x ?? '0');
        setText('p-y', d.y?.toFixed?.(2) ?? d.y ?? '0');
        setText('p-z', d.z?.toFixed?.(2) ?? d.z ?? '0');
        setStatus('streaming', 'ok');
        return;
      }

      if (d.type === 'ghost') {
        setText('g-hunt', String(!!d.hunting));
        setText('g-x', d.x?.toFixed?.(2) ?? d.x ?? '0');
        setText('g-y', d.y?.toFixed?.(2) ?? d.y ?? '0');
        setText('g-z', d.z?.toFixed?.(2) ?? d.z ?? '0');
        if (d.fast) {
          const fx = d.fast.x?.toFixed?.(2) ?? d.fast.x;
          const fy = d.fast.y?.toFixed?.(2) ?? d.fast.y;
          const fz = d.fast.z?.toFixed?.(2) ?? d.fast.z;
          setText('g-fast', `(${fx}, ${fy}, ${fz})`);
        } else {
          setText('g-fast', '—');
        }
        setStatus('streaming', 'ok');
        return;
      }

      if (d.type === 'evidence') {
        const line = `• ${d.item} @ ${d.room} ${d.success ? '✓' : '×'}`;
        evEl.textContent = (evEl.textContent === 'Awaiting events…')
          ? line
          : (evEl.textContent + '\n' + line);
        setStatus('streaming', 'ok');
        return;
      }
    });

    // Auto-handshake shortly after load in case the opener is listening
    window.addEventListener('load', () => {
      setTimeout(tryHandshake, 300);
    });
  </script>
</body>
</html>
