.<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney — Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <meta name="author" content="Shark-Blades" />
  <meta name="description" content="Top-down Sims-style map builder for PhasmaPhoney using Babylon.js" />

  <!-- Babylon core -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/earcut.min.js"></script>
  <script src="./cdn/gui/babylon.gui.min.js"></script>

  <style>
    html, body { margin:0; height:100%; width:100%; background:#000; overflow:hidden; font-family:monospace; color:#0ff; }
    #renderCanvas { width:100vw; height:100vh; touch-action:none; display:block; background:#000; }

    /* Always bottom-centered so it won't collide with the top builder toolbar */
    #project-bar {
      position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
      z-index:12002; background:rgba(0,0,0,0.85);
      border:1px solid #066; border-radius:10px; padding:8px 10px; color:#9ff;
      display:flex; gap:6px; align-items:center; font:12px monospace;
      flex-wrap:wrap; pointer-events:auto;
      max-width: min(1200px, 96vw);
      justify-content:center;
      box-shadow:0 0 18px rgba(0,255,255,0.08);
    }
    .btn { border:1px solid #066; background:#111; color:#9ff; padding:4px 8px; border-radius:8px; cursor:pointer; }
    .btn:active{ transform:translateY(1px); }
    input, select { background:#000; color:#0ff; border:1px solid #066; border-radius:6px; padding:3px 6px; }

    #tool-legend {
      position:fixed; right:12px; top:12px; z-index:10;
      background:rgba(0,0,0,0.75); border:1px solid #066; border-radius:10px; padding:8px 10px;
      color:#9ff; font:12px/1.4 monospace; max-width:280px;
    }
  </style>
</head>

<body>
  <canvas id="renderCanvas"></canvas>

  <!-- Project / Grid / Export bar (bottom-centered) -->
  <div id="project-bar">
    <b style="color:#0ff">Projects</b>
    <label>Name <input id="proj-name" type="text" placeholder="MyLayout" style="width:160px"></label>
    <button id="proj-save" class="btn" title="Save (localStorage)">Save</button>
    <button id="proj-saveas" class="btn" title="Save As (prompt for name)">Save As</button>
    <select id="proj-list" title="Saved projects" style="min-width:160px"></select>
    <button id="proj-load" class="btn" title="Load selected project">Load</button>
    <button id="proj-del" class="btn" title="Delete selected project" style="color:#faa;border-color:#933;">Delete</button>
    <button id="proj-new" class="btn" title="Clear scene">New</button>
    <span style="margin:0 6px;border-left:1px solid #044;height:18px"></span>
    <label>Grid <input id="grid-snap" type="checkbox" checked></label>
    <label>Step <input id="grid-step" type="number" value="0.5" min="0.1" max="5" step="0.1" style="width:60px"></label>
    <label>Van <input id="van-toggle" type="checkbox" checked title="Include side storage room"></label>
    <span style="margin:0 6px;border-left:1px solid #044;height:18px"></span>
    <button id="proj-download" class="btn" title="Download Project JSON">Download</button>
    <label class="btn" style="padding:4px 8px; cursor:pointer;">
      Upload <input id="proj-upload" type="file" accept="application/json" style="display:none">
    </label>
    <button id="export-map" class="btn" title="Export Map Manifest (drop-in for map.js)">Export Map</button>
  </div>

  <div id="tool-legend">
    <div><b>BUILDER</b> is always ON (origin at 0,0,0)</div>
    <div>S / W / R / F / P = Select / Wall / Room / Floor / Place</div>
    <div>Q/E rotate · Del delete · C copy · Ctrl+Z undo</div>
    <div>Top-down view is locked; Mouse-wheel = zoom, WASD/Arrows = pan</div>
  </div>

  <!-- Minimal boot: engine + scene (locked orthographic top-down) -->
  <script>
    (function(){
      const canvas = document.getElementById('renderCanvas');
      const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
      const scene  = new BABYLON.Scene(engine);
      window.engine = engine;
      window.scene  = scene;

      const cam = new BABYLON.ArcRotateCamera('TopDownCam', 0, 0.0001, 50, new BABYLON.Vector3(0,0,0), scene);
      cam.mode = BABYLON.Camera.ORTHOGRAPHIC_CAMERA;
      cam.lowerAlphaLimit = cam.upperAlphaLimit = 0;
      cam.lowerBetaLimit  = cam.upperBetaLimit  = 0.0001;
      cam.useAutoRotationBehavior = false;
      cam.inputs.clear();
      cam.panningSensibility = 0;
      cam.attachControl(canvas, true);
      window.camera = cam;

      let orthoScale = 30;
      function updateOrtho(){
        const ratio = engine.getRenderWidth() / engine.getRenderHeight();
        cam.orthoLeft   = -orthoScale * ratio;
        cam.orthoRight  =  orthoScale * ratio;
        cam.orthoTop    =  orthoScale;
        cam.orthoBottom = -orthoScale;
      }
      updateOrtho();

      canvas.addEventListener('wheel', (e)=>{
        e.preventDefault();
        const delta = Math.sign(e.deltaY) * 2.0;
        orthoScale = Math.max(5, Math.min(150, orthoScale + delta));
        updateOrtho();
      }, { passive:false });

      const pan = { x:0, z:0 };
      window.addEventListener('keydown', (e)=>{
        if (e.repeat) return;
        if (e.key==='a' || e.key==='ArrowLeft')  pan.x = -1;
        if (e.key==='d' || e.key==='ArrowRight') pan.x =  1;
        if (e.key==='w' || e.key==='ArrowUp')    pan.z = -1;
        if (e.key==='s' || e.key==='ArrowDown')  pan.z =  1;
      });
      window.addEventListener('keyup', (e)=>{
        if (e.key==='a' || e.key==='ArrowLeft')  if (pan.x<0) pan.x = 0;
        if (e.key==='d' || e.key==='ArrowRight') if (pan.x>0) pan.x = 0;
        if (e.key==='w' || e.key==='ArrowUp')    if (pan.z<0) pan.z = 0;
        if (e.key==='s' || e.key==='ArrowDown')  if (pan.z>0) pan.z = 0;
      });

      scene.onBeforeRenderObservable.add(()=>{
        if (pan.x || pan.z){
          const speed = orthoScale * 0.02;
          cam.target.addInPlace(new BABYLON.Vector3(pan.x*speed, 0, pan.z*speed));
        }
      });

      const hemi = new BABYLON.HemisphericLight('boot_hemi', new BABYLON.Vector3(0,1,0), scene);
      hemi.intensity = 0.8;

      engine.runRenderLoop(function(){ scene.render(); });
      window.addEventListener('resize', function(){ engine.resize(); updateOrtho(); });
    })();
  </script>

  <!-- World base (no GLBs) -->
  <script src="./assets/index3/map.js?v=3.0"></script>

  <!-- Builder Tool (Sims-like) -->
  <script>
    window.BUILDER_OPTS = { gridSnap:true, gridStep:0.5 };
  </script>
  <script src="./assets/index3/builder_tool.js?v=1.0"></script>
<!-- drop this tag after your builder_tool.js (builder.html) or after map load (index3.html) -->
<script src="./assets/index3/ghost_ground_patch.js"></script>
  <!-- Always-on Builder + StartPad + Storage Room + Project Manager + Export Map -->
  <script>
    (function bootBuilder(){
      const v3 = (x,y,z)=> new BABYLON.Vector3(x,y,z);
      const C3 = BABYLON.Color3;

      function addStartPad(){
        const scene = window.scene;
        if (scene.getMeshByName('StartPad_Wood')) return;
        const size = 8;
        const pad  = BABYLON.MeshBuilder.CreateGround('StartPad_Wood', { width:size, height:size, subdivisions: 2 }, scene);
        pad.position = v3(0, 0.01, 0);
        pad.isPickable = true; pad.checkCollisions = true;
        const mat = new BABYLON.StandardMaterial('Mat_StartPad_Wood', scene);
        mat.diffuseColor  = new C3(0.55, 0.42, 0.2);
        mat.specularColor = new C3(0.1, 0.1, 0.1);
        pad.material = mat;
        pad.metadata = { builder:{ type:'floor', size:[size,size], floorIndex:0 } };
        try{
          if (typeof window.registerGroundRoots === 'function'){
            window.registerGroundRoots([/^StartPad_Wood$/, /^Ground_Main$/]);
          } else {
            window.GROUND_NAME_HINTS = [/^StartPad_Wood$/, /^Ground_Main$/];
          }
        }catch{}
        let sp = scene.getTransformNodeByName('Spawn_Player');
        if (!sp){ sp = new BABYLON.TransformNode('Spawn_Player', scene); sp.position = v3(0, 0.1, -size*0.25); }
      }

      function addVanRoom(){
        const scene = window.scene;
        if (scene.getMeshByName('Van_Floor')) return;

        const sizeX = 10, sizeZ = 6, h = 3, t = 0.18;
        const offsetX = (window.World?.size?.() || 80) * 0.35;
        const center = v3(+offsetX, 0, 0);

        const floor = BABYLON.MeshBuilder.CreateGround('Van_Floor', {width:sizeX, height:sizeZ}, scene);
        floor.position = center.add(v3(0,0.01,0));
        floor.checkCollisions = true; floor.isPickable = true;
        const fmat = new BABYLON.StandardMaterial('Mat_Van_Floor', scene);
        fmat.diffuseColor = new C3(0.12,0.12,0.12); fmat.specularColor = new C3(0.05,0.05,0.05);
        floor.material = fmat;
        floor.metadata = { builder:{ type:'floor', size:[sizeX,sizeZ], room:'Van', floorIndex:0 } };

        function wbox(name, L, pos, rotY){
          const wall = BABYLON.MeshBuilder.CreateBox(name, {width:L, depth:t, height:h}, scene);
          wall.position = pos.clone(); wall.rotation.y = rotY||0;
          wall.checkCollisions = true; wall.isPickable = true;
          const m = new BABYLON.StandardMaterial('Mat_'+name, scene);
          m.diffuseColor = new C3(0.8,0.82,0.86); m.specularColor = new C3(0.1,0.1,0.1);
          wall.material = m;
          wall.metadata = { builder:{ type:'wall', floorIndex:0, a:null, b:null, h:h, t:t }, isGhostBlocker:true };
          return wall;
        }
        wbox('Van_Wall_N', sizeX, center.add(v3(0, h/2, -sizeZ/2)), 0);
        wbox('Van_Wall_S', sizeX, center.add(v3(0, h/2,  sizeZ/2)), 0);
        const gap = 1.2, remain = (sizeZ - gap)/2;
        wbox('Van_Wall_W1', remain, center.add(v3(-sizeX/2, h/2, - (gap/2 + remain/2))), Math.PI/2);
        wbox('Van_Wall_W2', remain, center.add(v3(-sizeX/2, h/2,   (gap/2 + remain/2))), Math.PI/2);
        wbox('Van_Wall_E', sizeZ, center.add(v3( sizeX/2, h/2, 0)), Math.PI/2);

        function tool(name, local){
          const b = BABYLON.MeshBuilder.CreateBox('Van_Tool_'+name, {width:0.4, height:0.25, depth:0.25}, scene);
          b.position = center.add(local);
          b.checkCollisions = true; b.isPickable = true;
          const m = new BABYLON.StandardMaterial('Mat_Tool_'+name, scene);
          m.diffuseColor = new C3(0.55,0.42,0.2); m.specularColor = new C3(0.1,0.1,0.1);
          b.material = m;
          b.metadata = { builder:{ type:'prop', floorIndex:0, kind:'tool', tool:name }, storage:true };
          return b;
        }
        const lineZ = -sizeZ/2 + 0.8;
        const tools = ['EMF','SpiritBox','Book','UV','DOTS','Camera','Candle','Thermo'];
        tools.forEach((tName,i)=>{
          const x = -sizeX/2 + 1.0 + i*1.0;
          tool(tName, v3(x, 0.2, lineZ));
        });

        let sv = scene.getTransformNodeByName('Spawn_Van');
        if (!sv){ sv = new BABYLON.TransformNode('Spawn_Van', scene); sv.position = center.add(v3(-sizeX/2+1.0, 0.1, 0)); }
      }

      function clearBuilderScene(preserveVan){
        const s = window.scene;
        s.meshes.slice().forEach(m=>{
          if (m.name === 'Ground_Main') return;
          if (preserveVan && (m.name.startsWith('Van_') || m.metadata?.storage)) return;
          const t = m.metadata?.builder?.type;
          if (t==='floor' || t==='wall' || t==='prop' || m.name==='StartPad_Wood'){
            try{ m.dispose(false,true); }catch{}
          }
        });
        s.transformNodes?.slice()?.forEach?.(n=>{
          if (n.name==='Spawn_Player' || n.name==='Spawn_Van') return;
          if (n.metadata?.builder?.type === 'stairs'){
            try{ n.dispose(false,true); }catch{}
          }
        });
      }

      function applyJSON(obj){
        if (!obj) return;
        const s = window.scene;
        const v3 = (x,y,z)=> new BABYLON.Vector3(x,y,z);
        const C3 = BABYLON.Color3;

        function wallMat(){ const m=new BABYLON.StandardMaterial('load_wall',s); m.diffuseColor=new C3(0.85,0.88,0.92); m.specularColor=new C3(0.1,0.1,0.1); return m; }
        function floorMat(){ const m=new BABYLON.StandardMaterial('load_floor',s); m.diffuseColor=new C3(0.85,0.85,0.88); m.specularColor=new C3(0.1,0.1,0.1); return m; }
        function propMat(){ const m=new BABYLON.StandardMaterial('load_prop',s); m.diffuseColor=new C3(0.55,0.42,0.2);  m.specularColor=new C3(0.1,0.1,0.1); return m; }

        (obj.floors||[]).forEach(F=>{
          const m = BABYLON.MeshBuilder.CreateGround(F.name||('FLR_'+Date.now().toString(36)), {width:F.size?.[0]||2, height:F.size?.[1]||2}, s);
          m.position = BABYLON.Vector3.FromArray(F.pos||[0,0.01,0]);
          m.isPickable = true; m.checkCollisions = true;
          m.material = floorMat();
          m.metadata = { builder:{ type:'floor', size:F.size||[2,2], floorIndex:F.floorIndex|0 } };
        });
        (obj.walls||[]).forEach(W=>{
          const a = v3(W.a.x,W.a.y,W.a.z), b=v3(W.b.x,W.b.y,W.b.z);
          const L = BABYLON.Vector3.Distance(a,b);
          const h = W.h || (obj.meta?.floorHeight || 3.0);
          const t = W.t || 0.18;
          const wall = BABYLON.MeshBuilder.CreateBox(W.name||('WALL_'+Date.now().toString(36)), { width:L, depth:t, height:h }, s);
          wall.position.copyFrom(a.add(b).scale(0.5)); wall.position.y = (W.a?.y ?? 0) + h/2;
          wall.rotation.y = Math.atan2(b.x - a.x, b.z - a.z);
          wall.isPickable = true; wall.checkCollisions = true;
          wall.material = wallMat();
          wall.metadata = { builder:{ type:'wall', floorIndex: (W.floorIndex|0)||0, a:W.a, b:W.b, h:h, t:t }, isGhostBlocker:true };
        });
        (obj.props||[]).forEach(P=>{
          const b = BABYLON.MeshBuilder.CreateBox(P.name||('PROP_'+Date.now().toString(36)), {size:1}, s);
          b.position = BABYLON.Vector3.FromArray(P.pos||[0,0.5,0]);
          if (P.rot) b.rotation = BABYLON.Vector3.FromArray(P.rot);
          if (P.scl) b.scaling = BABYLON.Vector3.FromArray(P.scl);
          b.checkCollisions = true; b.isPickable = true;
          b.material = propMat();
          b.metadata = { builder:{ type:'prop', floorIndex: (P.floorIndex|0)??0 } };
        });

        if (obj.spawn){
          let sp = s.getTransformNodeByName('Spawn_Player') || new BABYLON.TransformNode('Spawn_Player', s);
          let sv = s.getTransformNodeByName('Spawn_Van')    || new BABYLON.TransformNode('Spawn_Van', s);
          if (obj.spawn.player){ sp.position = BABYLON.Vector3.FromArray(obj.spawn.player); }
          if (obj.spawn.van){    sv.position = BABYLON.Vector3.FromArray(obj.spawn.van); }
        }
      }

      function exportMapManifest(){
        const s = window.scene;
        const out = {
          pp_map_format: "v1",
          meta: { name: (document.getElementById('proj-name').value.trim()||'Untitled'), origin:[0,0,0], grid:{ snap: document.getElementById('grid-snap').checked, step: parseFloat(document.getElementById('grid-step').value)||0.5 } },
          ground: { size: window.World?.size?.() || 80 },
          spawn: {},
          floors: [],
          walls: [],
          props: [],
          barriers: []
        };

        const sp = s.getTransformNodeByName('Spawn_Player'); if (sp) out.spawn.player = [sp.position.x, sp.position.y, sp.position.z];
        const sv = s.getTransformNodeByName('Spawn_Van');    if (sv) out.spawn.van    = [sv.position.x, sv.position.y, sv.position.z];

        s.meshes.forEach(m=>{
          const tag = m.metadata?.builder?.type;
          if (!tag) return;
          if (tag==='floor'){
            const sz = m.metadata.builder.size || [m.getBoundingInfo().boundingBox.extendSizeWorld.x*2, m.getBoundingInfo().boundingBox.extendSizeWorld.z*2];
            out.floors.push({ name:m.name, pos:[m.position.x, m.position.y, m.position.z], size:sz, floorIndex: (m.metadata.builder.floorIndex|0)||0 });
          } else if (tag==='wall'){
            let a = m.metadata.builder.a, b = m.metadata.builder.b, h=m.metadata.builder.h, t=m.metadata.builder.t;
            if (!a || !b){
              const wm = m.getWorldMatrix();
              const half = (m.getBoundingInfo().boundingBox.extendSize.x)*m.scaling.x;
              const p1 = BABYLON.Vector3.TransformCoordinates(new BABYLON.Vector3(-half, 0, 0), wm);
              const p2 = BABYLON.Vector3.TransformCoordinates(new BABYLON.Vector3( half, 0, 0), wm);
              a = {x:p1.x,y:p1.y-(m.getBoundingInfo().boundingBox.extendSizeWorld.y),z:p1.z};
              b = {x:p2.x,y:p2.y-(m.getBoundingInfo().boundingBox.extendSizeWorld.y),z:p2.z};
              h = m.getBoundingInfo().boundingBox.extendSizeWorld.y*2;
              t = m.getBoundingInfo().boundingBox.extendSizeWorld.z*2;
            }
            out.walls.push({ name:m.name, a, b, h, t, floorIndex: (m.metadata.builder.floorIndex|0)||0 });
            if (m.metadata.isGhostBlocker) out.barriers.push({ a, b });
          } else if (tag==='prop'){
            out.props.push({
              name:m.name, kind:m.metadata.builder.kind||'prop',
              pos:[m.position.x, m.position.y, m.position.z],
              rot:[m.rotation.x||0, m.rotation.y||0, m.rotation.z||0],
              scl:[m.scaling.x||1, m.scaling.y||1, m.scaling.z||1],
              floorIndex: (m.metadata.builder.floorIndex|0)||0
            });
          }
        });

        return out;
      }

      const KEY = 'pp_builder_projects';
      function listProjects(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch{ return {}; } }
      function saveProjects(map){ try{ localStorage.setItem(KEY, JSON.stringify(map)); }catch{} }
      function refreshList(sel){
        const data = listProjects();
        sel.innerHTML = '';
        Object.keys(data).sort().forEach(name=>{
          const opt = document.createElement('option'); opt.value = name; opt.textContent = name;
          sel.appendChild(opt);
        });
      }

      const uiBoot = setInterval(()=>{
        if (!window.scene || !window.World || !window.Builder) return;
        clearInterval(uiBoot);

        try { Builder.enable(); } catch {}

        addStartPad();
        if (document.getElementById('van-toggle').checked) addVanRoom();

        const gchk = document.getElementById('grid-snap');
        const gstep= document.getElementById('grid-step');
        function applyGrid(){
          const on = !!gchk.checked; const step = parseFloat(gstep.value)||0.5;
          if (typeof Builder.setGridSnap === 'function'){ Builder.setGridSnap(on, step); }
          else if (typeof Builder.setGrid === 'function'){ Builder.setGrid({snap:on, step}); }
          window.BUILDER_OPTS = { gridSnap:on, gridStep:step };
        }
        gchk.onchange = applyGrid; gstep.onchange = applyGrid; applyGrid();

        const name = document.getElementById('proj-name');
        const saveBtn = document.getElementById('proj-save');
        const saveAsBtn = document.getElementById('proj-saveas');
        const list = document.getElementById('proj-list');
        const loadBtn = document.getElementById('proj-load');
        const delBtn = document.getElementById('proj-del');
        const newBtn = document.getElementById('proj-new');
        const dlBtn = document.getElementById('proj-download');
        const upInput = document.getElementById('proj-upload');
        const vanTgl = document.getElementById('van-toggle');
        const exportBtn = document.getElementById('export-map');

        refreshList(list);

        saveBtn.onclick = ()=>{
          let nm = name.value.trim();
          if (!nm){ nm = prompt('Project name?'); if (!nm) return; name.value = nm; }
          const data = listProjects();
          data[nm] = Builder.export();
          saveProjects(data);
          refreshList(list);
        };
        saveAsBtn.onclick = ()=>{
          const nm = prompt('Save As name?'); if (!nm) return;
          name.value = nm;
          const data = listProjects();
          data[nm] = Builder.export();
          saveProjects(data);
          refreshList(list);
          list.value = nm;
        };
        loadBtn.onclick = ()=>{
          const nm = list.value || name.value.trim();
          if (!nm) return;
          const data = listProjects(); const obj = data[nm]; if (!obj) return alert('No project named "'+nm+'"');
          clearBuilderScene(vanTgl.checked);
          if (vanTgl.checked) addVanRoom();
          applyJSON(obj);
          name.value = nm;
        };
        delBtn.onclick = ()=>{
          const nm = list.value || name.value.trim();
          if (!nm) return;
          const data = listProjects(); if (!data[nm]) return;
          if (!confirm('Delete "'+nm+'"?')) return;
          delete data[nm]; saveProjects(data); refreshList(list);
          if (name.value===nm) name.value='';
        };
        newBtn.onclick = ()=>{
          if (!confirm('Clear current build?')) return;
          clearBuilderScene(vanTgl.checked);
          addStartPad();
          if (vanTgl.checked) addVanRoom();
        };
        dlBtn.onclick = ()=>{
          const nm = (name.value.trim()||'builder_project');
          const a = document.createElement('a');
          a.download = nm+'.json';
          a.href = URL.createObjectURL(new Blob([JSON.stringify(Builder.export(), null, 2)], {type:'application/json'}));
          a.click();
          setTimeout(()=> URL.revokeObjectURL(a.href), 1000);
        };
        upInput.onchange = (e)=>{
          const file = e.target.files[0]; if (!file) return;
          const r = new FileReader();
          r.onload = ()=>{ try{ const obj = JSON.parse(r.result); clearBuilderScene(vanTgl.checked); if (vanTgl.checked) addVanRoom(); applyJSON(obj); }catch{ alert('Invalid JSON'); } };
          r.readAsText(file);
          e.target.value = '';
        };
        vanTgl.onchange = ()=>{
          if (vanTgl.checked){ addVanRoom(); }
          else {
            window.scene.meshes.slice().forEach(m=>{
              if (m.name.startsWith('Van_') || m.metadata?.storage) try{ m.dispose(false,true);}catch{}
            });
            const sv = window.scene.getTransformNodeByName('Spawn_Van'); if (sv) sv.dispose();
          }
        };
        exportBtn.onclick = ()=>{
          const manifest = exportMapManifest();
          const nm = (name.value.trim()||'map_manifest');
          const a = document.createElement('a');
          a.download = nm+'.json';
          a.href = URL.createObjectURL(new Blob([JSON.stringify(manifest, null, 2)], {type:'application/json'}));
          a.click();
          setTimeout(()=> URL.revokeObjectURL(a.href), 1000);
        };
      }, 150);
    })();
  </script>
