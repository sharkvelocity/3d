<!DOCTYPE html>

<head>

  <script src="./cdn/meshopt_decoder.js"></script>

  <script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script>

  <style>
    html, body { margin:0; height:100%; width:100%; background:#000; overflow:hidden; font-family:monospace; color:#0ff; touch-action:none; }
    #renderCanvas { width:100vw; height:100vh; display:block; background:#000; outline:none; }

    #loading-box{ position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(0,0,0,0.92); z-index:2147483000; color:#9ef; font-family:monospace; }
    #loading-logo{ width:240px; max-width:60vw; opacity:0.95; filter:drop-shadow(0 0 10px #0ff4); }
    #loading-text{ font-size:16px; letter-spacing:.3px; text-align:center; max-width:70vw; }
    #loading-bar{ width:64vw; max-width:720px; height:14px; border:1px solid #066; border-radius:10px; background:#071017; overflow:hidden; }
    #loading-fill{ height:100%; width:0%; background:linear-gradient(90deg,#19f,#0ff); transition:width .15s ease; }

    #title-screen{ position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:9999; }
    #title-logo{ max-width:60vw; max-height:35vh; object-fit:contain; }
    #start-button{ padding:14px 28px; font-size:22px; cursor:pointer; border:2px solid #0ff; color:#0ff; background:#111; }
    #map-wrap{ display:flex; gap:8px; align-items:center; color:#9ef; }
    #map-select{ background:#0b1518; color:#bff; border:1px solid #066; padding:8px; border-radius:8px; }

    #hud-bar{ position:fixed; top:10px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:6000; }
    .chip { padding:2px 6px; border:1px solid #066; border-radius:6px; color:#aff; font-size:12px; background:rgba(0,0,0,0.5); }
    .sanity-wrap{ display:flex; align-items:center; gap:6px; padding:0 6px; }
    #sanity-gauge{ width:170px; height:10px; border:1px solid #066; background:#061013; border-radius:8px; overflow:hidden; }
    #sanity-fill{ width:100%; height:100%; background:linear-gradient(90deg,#19f,#0ff); transition:width .25s ease; }

    #hud-xyz { position:fixed; top:36px; right:12px; background:rgba(0,0,0,0.5); border:1px solid #066; padding:6px 8px; color:#0ff; font:12px monospace; z-index:6000; }

    /* Belt */
    #belt{ position:fixed; left:50%; bottom:72px; transform:translateX(-50%); display:flex; gap:12px; z-index:6000; align-items:center; background:rgba(0,0,0,0.55); border:1px solid #066; padding:8px 10px; border-radius:10px; }
    .slot{ width:88px; height:64px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:1px solid #0aa; background:rgba(0,20,20,0.6); position:relative; cursor:pointer; user-select:none; }
    .slot .label{ font-size:12px; color:#adf; text-align:center; line-height:1.1; padding:6px; }
    .slot.active{ outline:2px solid #0ff; box-shadow:0 0 12px rgba(0,255,255,0.45) inset; }

    .hud-btn{ border:1px solid #333; background:#181818; color:#ddd; padding:6px 10px; border-radius:8px; cursor:pointer; }
    #action-bar { position:fixed; right:12px; bottom:18px; display:flex; gap:10px; z-index:6500; }

    .touch-half { position:fixed; top:20vh; bottom:12vh; width:50vw; z-index:7000; touch-action:none; }
    #touch-left { left:0; } #touch-right{ right:0; }
    #mobile-sprint{ position:fixed; left:14px; bottom:18px; z-index:6500; display:none; }
    #mobile-sprint button{ border:1px solid #066; background:#102; color:#9ef; padding:8px 12px; border-radius:10px; }

    #notebook-modal{ position:fixed; inset:0; background:rgba(0,0,0,0.88); color:#0ff; display:none; z-index:12000; padding:18px; overflow:auto; }

    #toast{ position:fixed; left:50%; top:16px; transform:translateX(-50%); background:rgba(0,0,0,0.7); border:1px solid #066; border-radius:8px; padding:8px 12px; color:#0ff; z-index:10001; display:none; max-width:70vw; text-align:center; }

    /* Belt icon clamp + leak guard */
    #belt img.item-icon { max-width:60px; max-height:60px; image-rendering:crisp-edges; }
    body > img[src*="/assets/icons/"] { display:none !important; position:absolute !important; left:-99999px !important; top:-99999px !important; }
    #belt img[src*="/assets/icons/"] { display:inline-block !important; position:static !important; left:auto !important; top:auto !important; }
  </style>

<body>
  <!-- Loading -->
  <div id="loading-box" aria-live="polite">
    <img src="logo.png" alt="Logo" id="loading-logo">
    <div id="loading-text">Initializing…</div>
    <div id="loading-bar"><div id="loading-fill" style="width:0%"></div></div>
  </div>

  <!-- Title / Start -->
  <div id="title-screen">
    <img id="title-logo" src="./logo.png" alt="PhasmaPhoney Logo" />
    <button id="start-button">Start Investigation</button>
    <div id="map-wrap">
      <span>Map:</span>
      <select id="map-select">
        <option value="-1">(loading maps...)</option>
      </select>
    </div>
  </div>

  <!-- Canvas -->
  <canvas id="renderCanvas" tabindex="0"></canvas>

  <!-- HUD -->
  <div id="hud-bar">
    <div class="chip">Weather: <span id="hud-weather">—</span></div>
    <div class="chip">Hunt: <span id="hud-hunt">Calm</span></div>
    <div class="chip">Room: <span id="hud-room">Van</span></div>
    <div class="chip sanity-wrap">Sanity:
      <div id="sanity-gauge"><div id="sanity-fill"></div></div>
      <span id="hud-sanity">100%</span>
    </div>
  </div>
  <div id="hud-xyz">XYZ: <span id="hud-x">0</span>, <span id="hud-y">0</span>, <span id="hud-z">0</span></div>

  <!-- Belt (3 empty slots at start; slot 4 = lighter when UI boots) -->

  <!-- Actions -->
  <div id="action-bar">
    <button id="btn-use" class="hud-btn">Use</button>
    <button id="btn-place" class="hud-btn">Place</button>
    <button id="btn-toss" class="hud-btn">Toss</button>
    <button id="btn-lighter" class="hud-btn">Lighter</button>
    <button id="btn-notebook" class="hud-btn">Notebook</button>
    <button id="btn-inspector" class="hud-btn">Inspector</button>
  </div>

  <!-- Mobile touch zones -->
  <div id="touch-left"  class="touch-half"></div>
  <div id="touch-right" class="touch-half"></div>
  <div id="mobile-sprint"><button id="btn-sprint">Sprint: OFF</button></div>

  <!-- Notebook -->
  <div id="notebook-modal">
    <h2>Evidence</h2>
    <div id="evidence-list"></div>
    <div id="possible-ghosts">Possible: —</div>
    <div id="notebook-controls">
      <button class="hud-btn" onclick="closeNotebook()">Close</button>
      <button class="hud-btn" onclick="resetEvidence()">Reset Evidence</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script src="./assets/dev/modular_bindings.js"></script>

  <!-- ===================== RUNTIME HELPERS ===================== -->

  <!-- Start button: dispatch pp:start; no audio until user intent -->
  <script>
  (function wireStart(){
    const btn = document.getElementById('start-button');
    if (!btn) return;
    btn.addEventListener('click', function onStart(){
      try { window.PP && PP.audio && PP.audio.init && PP.audio.init(); } catch(e){ console.warn('[audio.init] failed', e); }
      document.getElementById('title-screen')?.remove();
      window.dispatchEvent(new CustomEvent('pp:start'));  // Weather + Van inventory listen here
      try { document.getElementById('renderCanvas')?.requestPointerLock?.(); } catch {}
    }, { once:true });
  })();
  </script>

  <!-- Expose ENGINE/SCENE/camera globals ASAP -->
  <script>
  (function ensureGlobals(){
    function tryExport(){
      try {
        if (window.ENGINE && window.SCENE) { window.camera = window.SCENE.activeCamera || window.camera; return; }
        var eng = (BABYLON.EngineStore && BABYLON.EngineStore.LastCreatedEngine) || (BABYLON.Engine && BABYLON.Engine.LastCreatedEngine);
        var scn = (BABYLON.EngineStore && BABYLON.EngineStore.LastCreatedScene)  || (BABYLON.Engine && BABYLON.Engine.LastCreatedScene);
        if (eng && scn){
          window.ENGINE = eng;
          window.SCENE  = scn;
          window.camera = scn.activeCamera || window.camera;
          return;
        }
      } catch(e){ }
      setTimeout(tryExport, 50);
    }
    tryExport();
  })();
  </script>

  <!-- Pointer lock toggle (L to toggle; ESC unlock) -->
  <script>
  (function pointerLockFix(){
    const canvas = document.getElementById('renderCanvas');
    let desireLock = false;
    function lock(){ if (document.pointerLockElement !== canvas) canvas.requestPointerLock?.(); }
    function unlock(){ document.exitPointerLock?.(); }
    document.addEventListener('pointerlockchange', ()=>{ desireLock = (document.pointerLockElement === canvas); });
    canvas.addEventListener('click', ()=>{ if (desireLock) lock(); });
    window.addEventListener('keydown', (e)=>{
      if (e.code === 'KeyL'){ if (document.pointerLockElement) unlock(); else { desireLock = true; lock(); } }
      if (e.code === 'Escape') unlock();
    }, {capture:true});
    document.getElementById('start-button')?.addEventListener('click', ()=>{ desireLock=true; setTimeout(lock, 150); }, {once:true});
  })();
  </script>

  <!-- Belt/icon leak guard -->
  <script>
  (function guardIconLeaks(){
    const belt = () => document.getElementById('belt');
    const hide = (img) => { img.style.display='none'; img.style.position='absolute'; img.style.left='-99999px'; img.style.top='-99999px'; };
    document.querySelectorAll('img[src*="/assets/icons/"]').forEach(img=>{
      if (!belt() || !belt().contains(img)) hide(img); else img.classList.add('item-icon');
    });
    new MutationObserver(muts=>{
      for (const m of muts) for (const n of m.addedNodes){
        if (n && n.tagName==='IMG' && (n.src||'').includes('/assets/icons/')){
          if (!belt() || !belt().contains(n)) hide(n); else n.classList.add('item-icon');
        }
      }
    }).observe(document.documentElement, {childList:true, subtree:true});
  })();
  </script>

  <!-- Spawn & scale fix (uses index3 spawn if available) -->
  <script>
  (function spawnAndScaleFix(){
    const TARGET_HEIGHT = 1.75;
    const CAP_RADIUS    = 0.35;
    let applied = false;

    function S(){ return window.SCENE || BABYLON.Engine?.LastCreatedScene; }

    function groundYAt(x,z,approxY){
      const s=S(); if(!s) return null;
      const from = new BABYLON.Vector3(x, (approxY??2) + 6, z);
      const ray  = new BABYLON.Ray(from, new BABYLON.Vector3(0,-1,0), 50);
      const hit  = s.pickWithRay(ray, (m)=>{
        if (!m) return false;
        if (m.metadata?.isGround === true) return true;
        const n=(m.name||'').toLowerCase();
        return /(floor|ground|asphalt|concrete|tile|yard|cell|corridor|hall|street|pavement|stairs)/.test(n);
      });
      return (hit && hit.hit && hit.pickedPoint) ? hit.pickedPoint.y : null;
    }

    function scaleIfGiant(node){
      try{
        const bb = node.getBoundingInfo?.().boundingBox;
        if (!bb) return;
        const h = bb.maximumWorld.y - bb.minimumWorld.y;
        if (isFinite(h) && h>0.01){
          const sf = TARGET_HEIGHT / Math.min(h, 1000);
          if (sf>0 && sf<10) node.scaling.scaleInPlace(sf);
        }
      }catch{}
    }

    function resolveIndex3Spawn(){
      const c = window;
      return c.Index3Spawn ||
             c.PP_INDEX3_SPAWN ||
             c.PP?.index3?.spawn ||
             c.DEVTOOLS?.spawns?.[3] ||
             null;
    }

    function findBodyOrCamera(){
      const s=S(); if (!s) return null;
      return s.__playerBody || s.getMeshByName?.('player_capsule') || s.activeCamera || null;
    }

    function findSpawnAnchor(){
      const s=S(); if (!s) return null;
      const names = ['Index3','index3_spawn','PlayerSpawn','Spawn','Start','Van_Spawn','player_spawn','spawn_point'];
      for (const n of names){
        const t = s.getTransformNodeByName?.(n) || s.getNodeByName?.(n);
        if (t) return t;
      }
      return null;
    }

    function applyOnce(){
      if (applied) return;
      const s=S(); if (!s) return setTimeout(applyOnce, 120);

      const body   = findBodyOrCamera();
      const anchor = resolveIndex3Spawn() || findSpawnAnchor();

      if (!body) return setTimeout(applyOnce, 120);

      scaleIfGiant(body);

      let p = (anchor && anchor.getAbsolutePosition?.()) || body.position.clone();
      const gy = groundYAt(p.x, p.z, p.y);
      if (gy != null) { p.y = gy + CAP_RADIUS + 0.12; body.position.copyFrom(p); }
      else            { body.position.set(0, 1.8, 0); }

      applied = true;
      console.log('[spawnAndScaleFix] positioned at', body.position.asArray());
    }

    window.addEventListener('pp:start', ()=> setTimeout(applyOnce, 400), { once:true });
    const poll = setInterval(()=>{ const s=S(); if (s && (s.meshes?.length||0) > 20){ clearInterval(poll); applyOnce(); } }, 300);
  })();
  </script>

  <!-- Ensure ghost controller initializes -->
  <script>
  (function ensureGhost(){
    function go(){
      try{
        if (window.ghostCtrl){
          ghostCtrl.init?.();
          const st = ghostCtrl.getState?.();
          if (!st || !st.type) ghostCtrl.randomizeGhost?.();
        }
      }catch(e){}
    }
    window.addEventListener('pp:start', ()=> setTimeout(go, 800), { once:true });
  })();
  </script>

  <!-- HUD XYZ updater -->
  <script>
  (function hudXYZ(){
    const label = document.getElementById('hud-xyz');
    function S(){ return window.SCENE || BABYLON.Engine?.LastCreatedScene; }
    function src(){
      const s=S(); if (!s) return null;
      return s.__playerBody || s.getMeshByName?.('player_capsule') || s.activeCamera || null;
    }
    function loop(){
      const o = src();
      if (o && o.position){
        const p = o.position;
        label.innerHTML = `XYZ: <span id="hud-x">${p.x.toFixed(2)}</span>, <span id="hud-y">${p.y.toFixed(2)}</span>, <span id="hud-z">${p.z.toFixed(2)}</span>`;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>

  <!-- Dev tools panel handles -->
  <button id="devtools-toggle" class="hud-btn" style="display:none;">Dev Tools</button>
  <div id="devtools-panel" style="display:none;"></div>
</body>
