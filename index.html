<!DOCTYPE html>
<html lang="en">

  <style>
    html, body { margin:0; height:100%; width:100%; background:#000; overflow:hidden; font-family:monospace; color:#0ff; touch-action:none; }
    #renderCanvas { width:100vw; height:100vh; display:block; outline:none; image-rendering:pixelated; }
    #title-screen{ position:fixed; inset:0; display:flex; gap:16px; flex-direction:column; align-items:center; justify-content:center;
      background:radial-gradient(130% 100% at 50% 0%, #03131a 0%, #02080c 45%, #000 100%); z-index:5000; }
    #start-button{ padding:14px 28px; font-size:22px; cursor:pointer; border:2px solid #0ff; color:#0ff; background:#111; }
    #map-wrap{ display:flex; gap:8px; align-items:center; color:#9ef; }

    #hud-bar{ position:fixed; top:10px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:6000; }
    .chip { padding:2px 6px; border:1px solid #066; border-radius:6px; color:#aff; font-size:12px; background:rgba(0,0,0,0.5); }
    .sanity-wrap{ display:flex; align-items:center; gap:6px; padding:0 6px; }
    #sanity-gauge{ width:170px; height:10px; border:1px solid #066; background:#061013; border-radius:8px; overflow:hidden; }
    #sanity-fill{ width:100%; height:100%; background:linear-gradient(90deg,#19f,#0ff); transition:width .25s ease; }
    #hud-xyz { position:fixed; top:36px; right:12px; background:rgba(0,0,0,0.5); border:1px solid #066; padding:6px 8px; border-radius:8px; display:none; color:#bfe; z-index:6000; }
    #toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.65); border:1px solid #066; padding:10px 14px; color:#bff; border-radius:10px; z-index:7000; display:none; }
    #notebook{ position:fixed; left:12px; bottom:12px; background:rgba(0,0,0,0.6); border:1px solid #066; padding:10px; border-radius:10px; z-index:6200; width:340px; max-height:60vh; overflow:auto;}
    #notebook h3{ margin:4px 0 8px; color:#9ef; }

    #belt{ position:fixed; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:6200; }
    .slot{ width:66px; height:66px; border:1px solid #066; border-radius:8px; display:flex; align-items:center; justify-content:center;
           background:rgba(0,0,0,0.5); color:#aff; font-size:11px; }
    .slot.active{ outline:2px solid #0ff; }
    #mobile-bar{ position:fixed; right:10px; bottom:10px; display:flex; gap:8px; z-index:6200; }
    .btn{ border:1px solid #066; background:#0b1518; color:#bff; padding:8px 10px; border-radius:8px; font-size:12px; }
    #hunt-vignette{ position:fixed; inset:0; pointer-events:none; background:radial-gradient(80% 65% at 50% 50%, rgba(0,0,0,0) 55%, rgba(120,0,0,0.35) 80%, rgba(0,0,0,0.75) 100%);
      opacity:0; transition:opacity .25s ease; z-index:5800; }
    #dev-panel{ position:fixed; top:10px; left:10px; width:420px; max-height:80vh; overflow:auto;
      background:rgba(0,0,0,0.75); border:1px solid #0aa; border-radius:10px; padding:10px; z-index:8000; display:none; }
    #dev-panel h3{ margin:6px 0; color:#9ef; }
    #dev-panel pre{ white-space:pre-wrap; font-size:11px; color:#aff; }
    .dev-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
    .dev-btn{ border:1px solid #066; background:#00171d; color:#bff; padding:5px 8px; border-radius:6px; font-size:12px; cursor:pointer; }
    .tex-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:6px; }
    .tex-card{ border:1px solid #044; padding:6px; border-radius:6px; background:#000; }
    .tex-card a{ color:#8ff; word-break:break-all; font-size:11px; }
  </style>

<body>

<script>
/*** ===== GLOBALS & HELPERS ===== ***/
const canvas = document.getElementById('renderCanvas');
let engine, scene, camera, hemiLight, houseRoot, moonMesh;
let sunLight=null, moonLight=null;
let avatarRoot=null;
const settings = { invertY:false, thirdPerson:false };
const rng = Math.random;

const player = {
  sanity: 100, inside: false, room: 'Exterior',
  speedWalk: 1.6, speedRun: 3.0, stepUpMax: 0.8,
  hasFire: false, electronicsActive: false
};
const game = {
  started:false, breakerOn:true,
  hunt:{active:false, endsAt:0},
  time:0, lastEvent:0, nextEvent:8,
  ghost:null, ghostVisible:false, ghostRoom:'Living Room',
  mimicTarget:null, orbFake:false, footprints:[]
};
const weather = { state:'Clear' };
const EVIDENCE = ['EMF 5','Spirit Box','Ghost Writing','Freezing Temps','Fingerprints','DOTS','Ghost Orbs'];
const $ = sel => document.querySelector(sel);
function toast(msg, ms=1300){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t.__tid); t.__tid=setTimeout(()=>t.style.display='none', ms); }
function setHuntUI(active){ $('#hunt-vignette').style.opacity = active ? 1 : 0; $('#hud-hunt').textContent = active?'HUNT':'Calm'; }
</script>

<script>
/*** ===== MAP + LIGHTS + MOON ===== ***/
let MAP_FILES = [
  { file: "Abandoned_House.glb", title: "Abandoned House" },
  { file: "furnished_house.glb", title: "Furnished House" }
];
async function loadManifest(){
  try{
    const res = await fetch('./assets/models/map/maps.json', {cache:'no-store'});
    if(res.ok){ const j=await res.json(); if(Array.isArray(j)&&j.length) MAP_FILES=j; }
  }catch(e){}
  const sel = $('#map-select');
  if(sel){ sel.innerHTML = MAP_FILES.map((m,i)=>`<option value="${i}">${m.title||m.file}</option>`).join(''); sel.value='0'; }
  try{ applyWeather(determineWeather());
  try{ ensurePrecipitation(weather.state); }catch(e){} }catch(e){}
}
async function loadSelectedMap(){
  currentMapIdx = parseInt(document.getElementById('map-select')?.value||'0',10)||0;
  const idx = currentMapIdx;
  const file = MAP_FILES[idx]?.file || MAP_FILES[0].file;
  try{
    await BABYLON.SceneLoader.AppendAsync('./assets/models/map/', file, scene);
    houseRoot = scene.meshes.find(m=>!m.parent) || scene.meshes[0];
    for(const m of scene.meshes){ m.isPickable = true; m.checkCollisions = true; }
  }catch(e){ toast('Map failed to load: '+file, 2200); }
}
function setupSun(){
  sunLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.25,-1,0.2).normalize(), scene);
  sunLight.intensity = 1.1;
}
function setupMoon(){
  moonLight = new BABYLON.DirectionalLight("moon", new BABYLON.Vector3(0.2,-1,-0.1).normalize(), scene);
  moonLight.intensity = 0.35;
}
async function loadMoon(){
  const MOON_DIAM = 40;
  const MOON_DIR = new BABYLON.Vector3(0.25, 0.85, -0.2).normalize();
  const texSize = 256;
  const dt = new BABYLON.DynamicTexture("moonDynTex", {width:texSize, height:texSize}, scene, false);
  const ctx = dt.getContext();
  ctx.clearRect(0,0,texSize,texSize);
  const g = ctx.createRadialGradient(texSize/2, texSize/2, 4, texSize/2, texSize/2, texSize/2 - 2);
  g.addColorStop(0.00, "#ffffff");
  g.addColorStop(0.60, "#f2f2ff");
  g.addColorStop(1.00, "#dcdcf0");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(texSize/2, texSize/2, texSize/2-2, 0, Math.PI*2); ctx.fill();
  function crater(x,y,r,a){ ctx.fillStyle = "rgba(150,160,200,"+a+")"; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
  crater(160, 90, 22, 0.20); crater(90,140, 28, 0.18); crater(120,110, 16, 0.16); crater(70,80,14,0.12);
  dt.update();

  moonMesh = BABYLON.MeshBuilder.CreateDisc("moon", {radius: MOON_DIAM*0.5, tessellation: 64}, scene);
  moonMesh.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  const m = new BABYLON.StandardMaterial("moonMat", scene);
  m.disableLighting = true;
  m.emissiveTexture = dt;
  m.emissiveColor = new BABYLON.Color3(1,1,1);
  m.backFaceCulling = false;
  moonMesh.material = m;
  moonMesh.isPickable = false;
  moonMesh.applyFog = false;
  moonMesh.alwaysSelectAsActiveMesh = true;
  moonMesh.renderingGroupId = 0;

  const SKY_DIST = 800;
  scene.onBeforeRenderObservable.add(()=>{
    if (!camera || !moonMesh) return;
    const base = camera.position.add(MOON_DIR.scale(SKY_DIST));
    moonMesh.position.copyFrom(base);
  });
}
</script>
<script>

let currentMapIdx = 0;

const WEATHER_POOL = ['Clear','Mist','Fog','Rain','Snow'];
if (!window.__weatherLocked) {
  const params = new URLSearchParams(location.search);
  const wparam = (params.get('weather')||'').trim();
  const pick = wparam || WEATHER_POOL[Math.floor(Math.random()*WEATHER_POOL.length)];
  // Normalize capitalization
  const canon = (pick+'').toLowerCase();
  window.__weatherLocked = canon==='foggy' ? 'Fog' :
                           canon==='misty' ? 'Mist' :
                           canon==='rainy' ? 'Rain' :
                           canon==='snowy' ? 'Snow' :
                           canon==='clear' ? 'Clear' :
                           pick;
}

function determineWeather(){
  // Always return the locked value for this session
  return window.__weatherLocked || 'Clear';
}
function applyWeather(state){
  weather.state = state;
  const hud = document.getElementById('hud-weather');
  if(hud) hud.textContent = state;
  const s = (state||'').toLowerCase();
  if(s==='clear'){
    scene.fogDensity = 0.0045;
    scene.fogColor = new BABYLON.Color3(0.02,0.03,0.05);
    try{ ensurePrecipitation(state); }catch(e){}
}
 else if(s==='mist'){
    scene.fogDensity = 0.010;
    scene.fogColor = new BABYLON.Color3(0.05,0.08,0.10);
  } else if(s==='fog' || s==='foggy'){
    scene.fogDensity = 0.016;
    scene.fogColor = new BABYLON.Color3(0.06,0.09,0.11);
  } else if(s==='rain'){
    scene.fogDensity = 0.012;
    scene.fogColor = new BABYLON.Color3(0.04,0.06,0.09);
  } else if(s==='snow'){
    scene.fogDensity = 0.013;
    scene.fogColor = new BABYLON.Color3(0.08,0.10,0.13);
  } else {
    scene.fogDensity = 0.0065;
    scene.fogColor = new BABYLON.Color3(0.03,0.05,0.07);
  }
}


// ===== Precipitation (Snow/Rain) =====
let precipPS=null, precipEmitter=null, precipType='none', precipBaseRate=0;

function disposePrecip(){
  try{ precipPS?.stop(); }catch(e){}
  try{ precipPS?.dispose?.(); }catch(e){}
  precipPS=null; precipEmitter?.dispose?.(); precipEmitter=null; precipType='none'; precipBaseRate=0;
}

function createSnow(){
  precipEmitter = new BABYLON.TransformNode("precipEmitter", scene);
  const tex = new BABYLON.DynamicTexture("snowFlake", {width:32, height:32}, scene, false);
  const ctx = tex.getContext();
  ctx.clearRect(0,0,32,32);
  const g = ctx.createRadialGradient(16,16,2,16,16,14);
  g.addColorStop(0,"rgba(255,255,255,0.95)");
  g.addColorStop(0.6,"rgba(255,255,255,0.5)");
  g.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(16,16,14,0,Math.PI*2); ctx.fill(); tex.update();

  if (BABYLON.GPUParticleSystem && BABYLON.GPUParticleSystem.IsSupported){
    precipPS = new BABYLON.GPUParticleSystem("snow", {capacity: 6000}, scene);
  } else {
    precipPS = new BABYLON.ParticleSystem("snow", 6000, scene);
  }
  precipPS.particleTexture = tex;
  precipPS.emitter = precipEmitter;
  precipPS.minEmitBox = new BABYLON.Vector3(-10, 4, -10);
  precipPS.maxEmitBox = new BABYLON.Vector3( 10, 6,  10);
  precipPS.direction1 = new BABYLON.Vector3(-0.12, -0.9, 0.12);
  precipPS.direction2 = new BABYLON.Vector3( 0.12, -0.9,-0.12);
  precipPS.gravity = new BABYLON.Vector3(0, -0.12, 0);
  precipPS.minLifeTime = 3.0; precipPS.maxLifeTime = 5.0;
  precipPS.minSize = 0.06; precipPS.maxSize = 0.12;
  precipPS.emitRate = precipBaseRate = 800;
  precipPS.updateSpeed = 0.02;
  precipPS.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
  precipPS.start();
  precipType = 'snow';
}

// Tall streak texture for rain
function makeRainTexture(){
  const tex = new BABYLON.DynamicTexture("rainStreak", {width:32, height:128}, scene, false);
  const ctx = tex.getContext();
  ctx.clearRect(0,0,32,128);
  // thin vertical streak with soft edges
  const grad = ctx.createLinearGradient(0,0,0,128);
  grad.addColorStop(0.0,"rgba(255,255,255,0.0)");
  grad.addColorStop(0.15,"rgba(200,220,255,0.6)");
  grad.addColorStop(0.85,"rgba(200,220,255,0.6)");
  grad.addColorStop(1.0,"rgba(255,255,255,0.0)");
  ctx.fillStyle = grad;
  ctx.fillRect(14,0,4,128); // 4px wide line
  // slight glow
  ctx.fillStyle = "rgba(200,220,255,0.15)";
  ctx.fillRect(12,0,8,128);
  tex.update();
  return tex;
}

function createRain(){
  precipEmitter = new BABYLON.TransformNode("precipEmitter", scene);
  const tex = makeRainTexture();

  if (BABYLON.GPUParticleSystem && BABYLON.GPUParticleSystem.IsSupported){
    precipPS = new BABYLON.GPUParticleSystem("rain", {capacity: 12000}, scene);
  } else {
    precipPS = new BABYLON.ParticleSystem("rain", 12000, scene);
  }
  precipPS.particleTexture = tex;
  precipPS.emitter = precipEmitter;
  // Big box around camera
  precipPS.minEmitBox = new BABYLON.Vector3(-12, 5, -12);
  precipPS.maxEmitBox = new BABYLON.Vector3( 12, 7,  12);
  // Faster downward fall; slimmer streaks
  precipPS.direction1 = new BABYLON.Vector3(-0.12, -22.0, 0.08);
  precipPS.direction2 = new BABYLON.Vector3( 0.12, -26.0,-0.08);
  precipPS.gravity = new BABYLON.Vector3(0, -1.0, 0);
  // Shorter lifetime, smaller particles
  precipPS.minLifeTime = 0.45; precipPS.maxLifeTime = 0.75;
  precipPS.minSize = 0.18; precipPS.maxSize = 0.35;
  precipPS.emitRate = precipBaseRate = 1200;
  precipPS.updateSpeed = 0.015;
  precipPS.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
  precipPS.start();
  precipType = 'rain';
}

function ensurePrecipitation(state){
  const s = (state||'').toLowerCase();
  const want = (s==='snow') ? 'snow' : (s==='rain' ? 'rain' : 'none');
  if (want === precipType) return;
  disposePrecip();
  if (want === 'snow'){ createSnow(); }
  else if (want === 'rain'){ createRain(); }
}

function updatePrecipFollow(){
  if(!precipEmitter) return;
  // Keep the volume above and slightly ahead of the camera
  const forward = camera.getForwardRay().direction;
  const pos = camera.position.add(forward.scale(3)).add(new BABYLON.Vector3(0,4,0));
  precipEmitter.position.copyFrom(pos);
  if(precipPS){
    // Disable emission indoors
    const rate = player.inside ? 0 : precipBaseRate;
    if (precipPS.emitRate !== rate) precipPS.emitRate = rate;
  }
}
</script>

<script>
/*** ===== Evidence UI ===== ***/
const evState = Object.fromEntries(EVIDENCE.map(e=>[e,false]));
function buildEvidenceUI(){
  const wrap = $('#ev-list');
  wrap.innerHTML = EVIDENCE.map(e=>`<label class="ev"><input type="checkbox" data-ev="${e}"><span>${e}</span></label>`).join('');
  wrap.querySelectorAll('input').forEach(box=>{
    box.addEventListener('change', ()=>{ evState[box.dataset.ev]=box.checked; refreshSuggestions(); });
  });
}
function refreshSuggestions(){
  const picked = Object.keys(evState).filter(k=>evState[k]);
  const out = $('#ghost-suggestions');
  const candidates = GHOSTS.filter(g=> picked.every(p=>g.ev.includes(p)) && (picked.length<=3));
  out.innerHTML = candidates.map(g=>`<div class="badge">${g.name}</div>`).join('') || '<span class="badge">—</span>';
}
</script>

<script>
/*** ===== Items & Belt ===== ***/
const ITEMS = {
  flashlight: {id:'flashlight', name:'Flashlight', placeable:false, use(){ toggleFlash(true); }, stop(){ toggleFlash(false); }},
  uv:         {id:'uv', name:'UV Light', placeable:false, use(){ toggleUV(true); }, stop(){ toggleUV(false); }},
  book:       {id:'book', name:'Writing Book', placeable:true, place(){ placeStaticMesh('book', 0.35); }},
  dots:       {id:'dots', name:'DOTS', placeable:true, place(){ placeStaticMesh('dots', 0.3); }},
  salt:       {id:'salt', name:'Salt', placeable:true, place(){ sprinkleSalt(); }},
  crucifix:   {id:'crucifix', name:'Crucifix', placeable:true, place(){ placeStaticMesh('crucifix',0.25);} },
  smudge:     {id:'smudge', name:'Smudge', placeable:false, use(){ smudgeEffect(); }},
  camera:     {id:'camera', name:'Photo Camera', placeable:false, use(){ toast('Click'); }}
};
let BELT = [ITEMS.flashlight, ITEMS.uv, ITEMS.book];
let activeSlot = 0;

let flashLight=null, uvLight=null, lighterLight=null;
function ensureSpot(name, angle, exp){
  let s = scene.lights.find(l=>l.name===name);
  if(!s){ s = new BABYLON.SpotLight(name, camera.position, camera.getForwardRay().direction, angle, exp, scene); s.intensity=0; s.diffuse=new BABYLON.Color3(1,1,1); s.specular=new BABYLON.Color3(0.2,0.2,0.2); }
  return s;
}
function toggleFlash(on){
  flashLight = ensureSpot('flashSpot', BABYLON.Tools.ToRadians(30), 8);
  flashLight.intensity = on? 1.1 : 0;
  syncLightToCamera();
  player.electronicsActive = on || (uvLight?.intensity>0);
}
function toggleUV(on){
  uvLight = ensureSpot('uvSpot', BABYLON.Tools.ToRadians(32), 6);
  uvLight.diffuse = new BABYLON.Color3(0.7,0.2,0.9);
  uvLight.specular= new BABYLON.Color3(0.2,0,0.3);
  uvLight.intensity = on? 1.0 : 0;
  syncLightToCamera();
  player.electronicsActive = (flashLight?.intensity>0) || on;
}
function ensureLighter(on){
  if(!lighterLight){
    lighterLight = new BABYLON.PointLight('lighter', camera.position, scene);
    lighterLight.diffuse = new BABYLON.Color3(1.0,0.85,0.6);
    lighterLight.intensity=0; lighterLight.range=6;
  }
  lighterLight.intensity = on? 0.9 : 0;
  player.hasFire = !!on;
}
function syncLightToCamera(){
  const d = camera.getForwardRay().direction;
  if(flashLight){ flashLight.position.copyFrom(camera.position); flashLight.direction.copyFrom(d); }
  if(uvLight){ uvLight.position.copyFrom(camera.position); uvLight.direction.copyFrom(d); }
  if(lighterLight){ lighterLight.position.copyFrom(camera.position); }
}
function placeStaticMesh(kind, size=0.3){
  const m = BABYLON.MeshBuilder.CreateBox(kind+'_'+Math.random().toString(36).slice(2,7),{size}, scene);
  m.position = camera.position.add(camera.getForwardRay().direction.scale(1.0)).add(new BABYLON.Vector3(0,-0.6,0));
  m.checkCollisions = true; m.isPickable=true; toast(kind+' placed');
}
function sprinkleSalt(){
  for(let i=0;i<3;i++){
    const ang = (i-1)*0.25; const dir = camera.getForwardRay().direction.clone();
    const rot = BABYLON.Quaternion.FromEulerAngles(0, ang, 0);
    const v = BABYLON.Vector3.TransformCoordinates(dir, BABYLON.Matrix.FromQuaternion(rot));
    const p = camera.position.add(v.scale(1.1+i*0.15)).add(new BABYLON.Vector3(0,-0.8,0));
    const pile = BABYLON.MeshBuilder.CreateCylinder('salt',{diameter:0.18, height:0.03, tessellation:12}, scene);
    pile.position = p; pile.rotation.x = Math.PI/2; pile.isPickable=false;

function rayFromCamera(len=3){

}
function useActiveItem(){

}
function placeActiveItem(){ const it = BELT[activeSlot]; if(!it || !it.placeable){ toast('Not placeable'); return; } it.place(); }
function tossActiveItem(){

  const h = scene.onBeforeRenderObservable.add(()=>{
    const dt = engine.getDeltaTime()/1000; t+=dt; proxy.position = proxy.position.add(v); v.y += g*dt*0.016; if(t>1.6){ proxy.dispose(); scene.onBeforeRenderObservable.remove(h); }

}
function renderBelt(){ for(let i=0;i<3;i++){ const el = $('#slot'+i); el.textContent = BELT[i]?.name || '—'; el.classList.toggle('active', i===activeSlot); } }
function toggleLighter(){ const on = !(lighterLight && lighterLight.intensity>0); ensureLighter(on); toast(on?'Lighter lit':'Lighter off'); }

<script>
/*** ===== Particle Mist ===== ***/
let ghostMesh=null, mistPS=null, mistEmitter=null;
function initMistParticles(){
  if(mistPS) return;
  mistEmitter = new BABYLON.TransformNode("mistEmitter", scene);
  const dt = new BABYLON.DynamicTexture("mistTex", {width:64, height:64}, scene, false);
  const ctx = dt.getContext();
  const grd = ctx.createRadialGradient(32,32,2,32,32,32);

  grd.addColorStop(0.5,"rgba(255,255,255,0.35)");
  grd.addColorStop(1,"rgba(255,255,255,0)");

  if (BABYLON.GPUParticleSystem && BABYLON.GPUParticleSystem.IsSupported){ mistPS = new BABYLON.GPUParticleSystem("mistPS", {capacity: 2000}, scene); }
  else { mistPS = new BABYLON.ParticleSystem("mistPS", 2000, scene); }
  mistPS.emitter = mistEmitter; mistPS.particleTexture = dt;
  mistPS.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
  mistPS.minEmitBox = new BABYLON.Vector3(-0.4, 0.0, -0.4);
  mistPS.maxEmitBox = new BABYLON.Vector3(0.4, 1.2, 0.4);

<script>

  if(g.hantu && !game.breakerOn) s *= 0.9;
  if(g.thaye) s *= (1.2 - 0.08*Math.min(10, thayeAge));
  if(g.moroi) s *= (1.0 + (1.0 - player.sanity/100)*1.2);
  if(g.raiju && player.electronicsActive) s = Math.max(s, 2.5);
  if(g.jinn && game.breakerOn) s = Math.max(s, 2.5);

}
function ghostWantsEvent(){

function pickEventType(){ const g = game.ghost?.tags||{}; const types = ['singing','redFlicker','bulbPop','mist','footsteps']; if(g.oni){ const i=types.indexOf('mist'); if(i>=0) types.splice(i,1); } if(g.shade && player.inside){ const i=types.indexOf('singing'); if(i>=0) types.splice(i,1); } return types[Math.floor(rng()*types.length)]; }
function setGhostVisible(v, form='entity'){ game.ghostVisible=!!v; if(ghostMesh) ghostMesh.visibility = (form==='entity' && v) ? 1 : 0; if(form==='mist'){ mistShow(v); } else { mistShow(false); } }
function moveGhostToward(pos, speed, dt){ if(!ghostMesh) return; const dir = pos.subtract(ghostMesh.position); dir.y=0; const d=dir.length(); if(d<0.001) return; ghostMesh.position = ghostMesh.position.add(dir.normalize().scale(speed*dt)); }
function currentRoomName(){ player.inside = (Math.abs(camera.position.z) < 50); $('#hud-room').textContent = player.inside ? 'House' : 'Exterior'; return player.inside ? 'House' : 'Exterior'; }
function chanceHunt(){ if(game.hunt.active) return false; const g=game.ghost?.tags||{}; let p=0; if(player.inside){ p=Math.max(0,(60-player.sanity))*0.002; if(g.demon) p*=1.5; if(g.shade) p*=0.5; if(g.onryo && player.hasFire) p*=0.3; if(g.onryo && !player.hasFire) p*=1.2; if(g.yokai) p*=1.1; } return rng()<p; }
function startHunt(){ const now = game.time; game.hunt.active=true; game.hunt.endsAt = now + 30; setGhostVisible(true,'entity'); setHuntUI(true); toast('Hunt started!', 1000); }
function stopHunt(){ game.hunt.active=false; setHuntUI(false); setGhostVisible(false); toast('Hunt ended', 800); }
async function spawnGhost(){
  try{ const r = await BABYLON.SceneLoader.ImportMeshAsync('', './assets/models/ghosts/', 'ghost1.glb', scene); ghostMesh = r.meshes.find(m=>!m.parent) || r.meshes[0]; }

async function triggerEvent(){

    setGhostVisible(true,'entity'); const old = scene.clearColor.clone(); let t=0; const handle = scene.onBeforeRenderObservable.add(()=>{ t+=engine.getDeltaTime()/1000; const k=0.5+0.5*Math.sin(t*20); scene.clearColor=new BABYLON.Color4(0.05*k,0,0,1); if(t>2.2){ scene.onBeforeRenderObservable.remove(handle); scene.clearColor=old; setGhostVisible(false);} });

  } else if(type==='bulbPop'){

  } else if(type==='mist'){
    initMistParticles(); setGhostVisible(true,'mist'); let t=0; const handle = scene.onBeforeRenderObservable.add(()=>{ const dt=engine.getDeltaTime()/1000; t+=dt; const target=camera.position.add(new BABYLON.Vector3(Math.sin(t*3)*0.6,0,0)); moveGhostToward(target, 1.8, dt); if(mistEmitter && ghostMesh){ mistEmitter.position.copyFrom(ghostMesh.position); } if(t>3.0){ scene.onBeforeRenderObservable.remove(handle); setGhostVisible(false);} }); toast('Misty apparition', 900);
  } else if(type==='footsteps'){
    const pos = camera.position.clone().add(new BABYLON.Vector3(0,0,1)); const step = BABYLON.MeshBuilder.CreateDisc('uvstep',{radius:0.12, tessellation:24}, scene);

    const mat = new BABYLON.StandardMaterial('uvstepMat', scene); mat.emissiveColor = new BABYLON.Color3(0.7,0.2,0.9); mat.alpha = 0.0; step.material = mat; step.isPickable=false;

    const dir = camera.position.subtract(box.position).normalize().scale(4 + Math.random()*2); let t=0;
    const tick = ()=>{ t += engine.getDeltaTime()/1000; box.position = box.position.add(dir.scale(0.016)); dir.y -= 9.8*0.016; if(t>2){ box.dispose(); scene.onBeforeRenderObservable.removeCallback(tick); } };
    scene.onBeforeRenderObservable.add(tick);
  }
}
function updateGhost(dt){
  if(!game.ghost || !ghostMesh) return;
  if(game.ghost.tags.mimic){ if(game.time - (window.lastMimicSwitch||0) > 60){ game.mimicTarget = GHOSTS[Math.floor(rng()*GHOSTS.length)]; window.lastMimicSwitch = game.time; } }

<script>
/*** ===== Input, 3rd Person, Invert Y ===== ***/
let flyMode=false;
const InputSystem = (function(){
  const keys = new Set(); const move = {x:0, y:0, z:0}; let lookDelta={x:0,y:0}; let running=false;
  const keyMap = {
    'KeyW':'fw','KeyS':'bk','KeyA':'lt','KeyD':'rt',
    'ArrowUp':'fw','ArrowDown':'bk','ArrowLeft':'lt','ArrowRight':'rt',
    'ShiftLeft':'run','ShiftRight':'run',
    'Digit1':'slot0','Digit2':'slot1','Digit3':'slot2',
    'Backquote':'flyToggle','KeyN':'noclip','KeyV':'toggleThird','KeyI':'invertY',
    'KeyE':'use','KeyQ':'place','KeyG':'toss','KeyL':'lighter',
    'Space':'up','ControlLeft':'down','PageUp':'up','PageDown':'down'
  };
  function recomputeMove(){ const f=(keys.has('fw')?1:0)+(keys.has('bk')?-1:0); const r=(keys.has('rt')?1:0)+(keys.has('lt')?-1:0); const v=(keys.has('up')?1:0)+(keys.has('down')?-1:0); move.z=f; move.x=r; move.y=v; running=keys.has('run'); }
  function onKey(e,down){
    const tag=keyMap[e.code]; if(!tag) return; e.preventDefault();
    if(tag==='flyToggle' && down){ flyMode=!flyMode; if(camera){ camera.checkCollisions=!flyMode; camera.applyGravity=!flyMode; } toast('Fly: '+(flyMode?'ON':'OFF')); return; }
    if(tag==='noclip' && down){ const nc=!camera.checkCollisions; camera.checkCollisions=!nc; camera.applyGravity=!nc; toast('Noclip: '+(!nc?'OFF':'ON')); return; }
    if(tag==='lighter' && down){ toggleLighter(); return; }
    if(tag==='toggleThird' && down){ settings.thirdPerson=!settings.thirdPerson; if(avatarRoot){ avatarRoot.setEnabled(settings.thirdPerson); } toast('3rd person: '+(settings.thirdPerson?'ON':'OFF')); return; }
    if(tag==='invertY' && down){ settings.invertY=!settings.invertY; toast('Invert Y: '+(settings.invertY?'ON':'OFF')); return; }
    if(down) keys.add(tag); else keys.delete(tag); recomputeMove();
    if(tag.startsWith('slot') && down){ activeSlot = parseInt(tag.replace('slot',''),10); renderBelt(); }
    if(tag==='use' && down) useActiveItem(); if(tag==='place' && down) placeActiveItem(); if(tag==='toss' && down) tossActiveItem();
  }
  function onMouseMove(e){ lookDelta.x += e.movementX||0; lookDelta.y += e.movementY||0; }
  function snapshot(){ const ld=lookDelta; lookDelta={x:0,y:0}; return { moveVec:{...move}, lookDelta:ld, running }; }
  function init(){
    window.addEventListener('keydown', e=>onKey(e,true),  {passive:false});
    window.addEventListener('keyup',   e=>onKey(e,false), {passive:false});
    window.addEventListener('mousemove', onMouseMove, {passive:true});
    $('#btn-use')?.addEventListener('click', ()=>useActiveItem());
    $('#btn-place')?.addEventListener('click', ()=>placeActiveItem());
    $('#btn-toss')?.addEventListener('click', ()=>tossActiveItem());
  }
  return { init, snapshot };
})();
function ensureAvatar(){
  if(avatarRoot) return; avatarRoot = new BABYLON.TransformNode("avatarRoot", scene);
  const body = BABYLON.MeshBuilder.CreateCylinder("avatarBody",{height:1.6, diameter:0.48, tessellation:18}, scene); body.position = new BABYLON.Vector3(0,0.8,0);
  const head = BABYLON.MeshBuilder.CreateSphere("avatarHead",{diameter:0.36, segments:16}, scene); head.position = new BABYLON.Vector3(0,1.68,0);
  const mat = new BABYLON.StandardMaterial("avatarMat", scene); mat.diffuseColor = new BABYLON.Color3(0.85,0.9,1); mat.emissiveColor = new BABYLON.Color3(0.15,0.2,0.35);
  body.material = mat; head.material = mat; body.isPickable=false; head.isPickable=false; body.parent=avatarRoot; head.parent=avatarRoot; avatarRoot.setEnabled(false);
}
function applyLook(lookDelta){
  const sens=0.0028; const invert = settings.invertY ? -1 : 1;
  camera.rotation.y += lookDelta.x * sens;
  camera.rotation.x += lookDelta.y * sens * invert;
  camera.rotation.x = Math.max(-Math.PI/2+0.02, Math.min(Math.PI/2-0.02, camera.rotation.x));
}
function handleMovement(input, dt){
  const baseWalk = player.speedWalk; const speed = input.running ? player.speedRun : baseWalk;
  const fwd=camera.getForwardRay().direction.clone(); fwd.y=0; fwd.normalize(); const right = BABYLON.Vector3.Cross(fwd, BABYLON.Axis.Y).scale(-1);
  const desired = fwd.scale(input.moveVec.z).add(right.scale(input.moveVec.x)); const vert = input.moveVec.y||0; const wantsFly = flyMode || (vert!==0);
  if (flyMode){ camera.checkCollisions=false; camera.applyGravity=false; }
  const prevGravity=camera.applyGravity;
  if(!flyMode && wantsFly) camera.applyGravity=false;
  let next=camera.position.clone();
  if(desired.lengthSquared()>0) next=next.add(desired.normalize().scale(speed*dt));
  if(wantsFly) next=next.add(new BABYLON.Vector3(0,vert*speed*dt,0));
  if(!wantsFly && desired.lengthSquared()>0){
    const probe = next.add(new BABYLON.Vector3(0, player.stepUpMax, 0));
    const downRay = new BABYLON.Ray(probe, new BABYLON.Vector3(0,-1,0), player.stepUpMax+0.6);
    const hit = scene.pickWithRay(downRay, m=>m&&m.isPickable!==false);
    if(hit && hit.pickedPoint){ const y=hit.pickedPoint.y + 1.7; const dy=y - camera.position.y; camera.position = (dy<=player.stepUpMax) ? new BABYLON.Vector3(next.x, y, next.z) : next; }
    else { camera.position = next; }
  } else { camera.position = next; }
  syncLightToCamera(); if(!flyMode) camera.applyGravity = prevGravity;
}
</script>

<script>

  const meshes = scene.meshes.length, materials = scene.materials.length, textures = scene.textures.length;

  const m = hit.pickedMesh;
  let info = `Mesh: ${m.name}\nVerts: ${m.getTotalVertices?.()||'?'}\nSubMeshes: ${m.subMeshes?.length||0}`;
  const mat = m.material || (m.subMeshes?.[0]?.getMaterial() || null);
  if(mat){
    info += `\nMaterial: ${mat.name} (${mat.getClassName?.()||'Material'})`;
    const tex = [];
    ['diffuseTexture','albedoTexture','baseTexture','opacityTexture','emissiveTexture','normalTexture','metallicTexture','roughnessTexture','ambientTexture','reflectionTexture'].forEach(k=>{
      if(mat[k]) tex.push(`${k}: ${mat[k].name||mat[k].url||'(embedded)'}`);
    });
    if(tex.length) info += `\nTextures:\n - ${tex.join('\n - ')}`;
  }
  $('#dev-info').textContent = info;

    wrap.appendChild(card);

}
function attachDevUI(){

  $('#dev-refresh').addEventListener('click', refreshSceneStats);
  $('#dev-under-reticle').addEventListener('click', inspectUnderReticle);
  $('#dev-list-textures').addEventListener('click', listAllTextures);

<script>
/*** ===== Boot & Main Loop ===== ***/
async function boot(){
  engine = new BABYLON.Engine(canvas, true, {preserveDrawingBuffer:true, stencil:true});
  scene = new BABYLON.Scene(engine);
  scene.collisionsEnabled = true; scene.gravity = new BABYLON.Vector3(0,-0.9,0);
  scene.clearColor = new BABYLON.Color4(0.01,0.01,0.02,1);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2; scene.fogDensity = 0.0045; scene.fogColor = new BABYLON.Color3(0.02,0.03,0.05);

  camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0, 2, 24), scene);
  camera.attachControl(canvas, true);
  camera.checkCollisions = true; camera.applyGravity = true;
  camera.ellipsoid = new BABYLON.Vector3(0.35,0.9,0.35); camera.ellipsoidOffset = new BABYLON.Vector3(0,0.4,0);
  camera.minZ = 0.1; camera.inertia=0; camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

  hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene); hemiLight.intensity = 0.35;

  setupSun(); setupMoon();
  await loadSelectedMap();
  await loadMoon();
  applyWeather(determineWeather());
  try{ ensurePrecipitation(weather.state); }catch(e){}
  await spawnGhost();
  initMistParticles();

  camera.position = new BABYLON.Vector3(44.91, 1.17, -104.00);

  buildEvidenceUI(); InputSystem.init(); attachDevUI();
  canvas.focus(); if (canvas.requestPointerLock) canvas.requestPointerLock();

  pickGhost(); renderBelt();

  engine.runRenderLoop(()=>{
    const dt = engine.getDeltaTime()/1000; game.time += dt;
    const input = InputSystem.snapshot(); handleMovement(input, dt); applyLook(input.lookDelta);
    currentRoomName(); player.sanity = Math.max(0, player.sanity - (player.inside? 0.006 : 0.002)*dt*60);
    $('#hud-sanity').textContent = Math.round(player.sanity)+'%'; $('#sanity-fill').style.width = Math.round(player.sanity)+'%';
    $('#hud-xyz').style.display='block'; $('#hud-x').textContent=camera.position.x.toFixed(2); $('#hud-y').textContent=camera.position.y.toFixed(2); $('#hud-z').textContent=camera.position.z.toFixed(2);
    const uvOn = (uvLight && uvLight.intensity>0);
    for(const f of game.footprints){ if(!f.mesh || f.expireAt <= game.time){ if(f.mesh){ f.mesh.dispose(); f.mesh=null; } continue; } if(f.mesh.material) f.mesh.material.alpha = uvOn ? 0.85 : 0.0; }
    updateGhost(dt);
    updatePrecipFollow();
    if(settings.thirdPerson){ ensureAvatar(); avatarRoot.setEnabled(true); const fwd=camera.getForwardRay().direction.clone(); fwd.y=0; fwd.normalize(); const followDist=1.8; const ahead = camera.position.add(fwd.scale(followDist)); avatarRoot.position = new BABYLON.Vector3(ahead.x, camera.position.y-0.9, ahead.z); avatarRoot.rotation = new BABYLON.Vector3(0, camera.rotation.y, 0); }
    else { if(avatarRoot) avatarRoot.setEnabled(false); }
    if(!game.hunt.active){ if(game.time - game.lastEvent > game.nextEvent && player.inside && ghostWantsEvent()){ game.lastEvent = game.time; game.nextEvent = 6 + rng()*10; triggerEvent(); } if(chanceHunt()) startHunt(); }
    else if(game.time >= game.hunt.endsAt) stopHunt();
    scene.render();
  });
  window.addEventListener('resize', ()=>engine.resize());
}

let __started=false;
async function safeStart(){ if(__started) return; __started = true; $('#title-screen').style.display='none'; await boot(); try{ canvas.focus(); if (canvas.requestPointerLock) canvas.requestPointerLock(); }catch(e){} try{ BABYLON.Engine.audioEngine?.unlock?.(); }catch(e){} }
function startNow(e){ e?.preventDefault?.(); safeStart(); }
const startBtn = document.getElementById('start-button');
if(startBtn){
  startBtn.addEventListener('click',     startNow, {passive:false});
  startBtn.addEventListener('pointerup', startNow, {passive:false});
  startBtn.addEventListener('touchend',  startNow, {passive:false});
  startBtn.addEventListener('touchstart', startNow, {passive:false});
}
window.addEventListener('DOMContentLoaded', ()=>{ try{ loadManifest(); }catch(e){} });
document.addEventListener('keydown', (e)=>{ if(!__started && (e.key==='Enter'||e.code==='Space')){ e.preventDefault(); safeStart(); } }, {passive:false});
</script>
</body>
