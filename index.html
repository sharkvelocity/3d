<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Phasma-Phoney 3D</title>
<link rel="icon" href="favicon.ico"/>

<!-- Babylon core + loaders + gui + inspector + materials (local CDN per repo map) -->
<script src="cdn/babylon.js"></script>
<script src="cdn/loaders/babylon.glTF2FileLoader.min.js"></script>
<script src="cdn/gui/babylon.gui.min.js"></script>
<script src="cdn/inspector/babylon.inspector.bundle.js"></script>
<script src="cdn/materialsLibrary/babylonjs.materials.min.js"></script>

<!-- RecastJS (local) for navmesh -->
<script src="cdn/recast.js"></script>

<!-- Fonts (optional) -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet"/>

<style>
  :root {
    --ui-bg: rgba(0,0,0,.55);
    --ui-border: rgba(255,255,255,.2);
    --ui-text: #e9eef7;
    --accent: #68d5ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; color: var(--ui-text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Orbitron", sans-serif;
    overflow: hidden;
  }
  #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }

  /* HUD */
  #hud {
    position: absolute; top: 8px; left: 8px; z-index: 5;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.4;
    pointer-events: none; min-width: 220px;
  }
  #hud .row { display: flex; gap: 8px; justify-content: space-between; }
  #hud .label { opacity: .7; }
  #hud .value { color: #fff; }

  /* Panels */
  .panel {
    position: absolute; z-index: 10; background: var(--ui-bg);
    border: 1px solid var(--ui-border); border-radius: 10px; padding: 10px;
    backdrop-filter: blur(2px);
  }
  .hidden { display: none !important; }

  #inventory { bottom: 10px; left: 10px; }
  #notebook { bottom: 10px; left: 10px; transform: translateY(-135%); min-width: 260px; }
  #evidencePanel { bottom: 10px; left: 10px; transform: translateY(-70%); min-width: 260px; }

  .btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--ui-border);
    color: var(--ui-text); padding: 6px 10px; border-radius: 8px;
    cursor: pointer; margin: 3px 4px 0 0; font-size: 12px;
  }
  .btn:hover { border-color: rgba(255,255,255,0.35); }
  .btn.active { outline: 1px solid var(--accent); }

  #ghostGuessButton {
    position: absolute; bottom: 10px; right: 10px; z-index: 10;
  }

  /* Dev Mode */
  #devHint {
    position: absolute; top: 8px; right: 8px; z-index: 6;
    font-size: 11px; opacity: .5; pointer-events: none;
  }
  #devPanelRight {
    position: absolute; right: 10px; top: 52px; z-index: 20; width: 260px;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    border-radius: 10px; padding: 10px; display: none;
  }
  #devPanelRight .title { font-weight: 600; margin-bottom: 6px; color: #fff; }
  #devPanelRight .dev-group { margin-bottom: 10px; }
  #devPanelRight .desc { font-size: 11px; opacity: .75; margin-top: 6px; }
  #devUnlockOverlay {
    position: absolute; inset: 0; background: rgba(0,0,0,.65);
    display: none; z-index: 30; align-items: center; justify-content: center;
  }
  #devUnlockBox {
    background: #0e1116; border: 1px solid var(--ui-border);
    padding: 16px; border-radius: 10px; width: min(92%, 360px);
  }
  #devUnlockBox input {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--ui-border);
    background: rgba(255,255,255,.05); color: #fff; margin-top: 8px;
  }

  /* Ghost Guess modal */
  #ghostModal {
    position: absolute; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 25;
    align-items: center; justify-content: center;
  }
  #ghostModal .box {
    background: #0e1116; border: 1px solid var(--ui-border);
    padding: 12px; border-radius: 10px; width: min(92%, 480px);
  }
  #ghostGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 8px; }

  /* Mobile touch controls */
  #touchLeft, #touchRight {
    position: absolute; bottom: 12px; z-index: 12; opacity: .75;
    width: 46vw; height: 34vh; max-width: 420px; max-height: 320px;
    touch-action: none; border-radius: 12px; border: 1px dashed rgba(255,255,255,.15);
    display: none; /* only show on mobile */
  }
  #touchLeft { left: 8px; }
  #touchRight { right: 8px; }
  @media (hover:none) and (pointer:coarse) {
    #touchLeft, #touchRight { display: block; }
  }

  /* Dev pins */
  .dev-pin {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: #68d5ff; box-shadow: 0 0 10px #68d5ff; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="row"><span class="label">Room</span><span class="value" id="roomName">Outside</span></div>
  <div class="row"><span class="label">Sanity</span><span class="value" id="sanityDisplay">100%</span></div>
  <div class="row"><span class="label">Weather</span><span class="value" id="weatherDisplay">Clear</span></div>
  <div class="row"><span class="label">X/Z</span><span class="value"><span id="debugX">0.00</span> / <span id="debugZ">0.00</span></span></div>
</div>

<div id="devHint">Hold X+Y+Z 3s for Dev Mode</div>

<!-- Inventory (kept minimal for now) -->
<div id="inventory" class="panel">

  <div id="inventoryItems"></div>
</div>

<!-- Notebook / Evidence -->
<div id="notebook" class="panel hidden">
  <strong>Notebook</strong>
  <div id="evidenceList"></div>
  <div id="ghostSuggestion" style="margin-top:6px; font-size:12px; opacity:.8;"></div>
</div>

<div id="evidencePanel" class="panel hidden">
  <strong>Select Evidence</strong>
  <div id="evidenceOptions"></div>
</div>

<button id="ghostGuessButton" class="btn">Guess Ghost</button>

<!-- Ghost Guess Modal -->

    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong>Select the ghost</strong>
      <button id="ghostModalClose" class="btn">Close</button>
    </div>
    <div id="ghostGrid"></div>
  </div>
</div>

<!-- Dev Mode Unlock -->
<div id="devUnlockOverlay">
  <div id="devUnlockBox">
    <div style="font-weight:600;margin-bottom:6px;">Enter Developer Password</div>
    <div style="font-size:12px;opacity:.8;">(Hold X+Y+Z 3 seconds to summon this. Default: <em>devmode</em>)</div>
    <input id="devPwd" type="password" placeholder="password"/>
    <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
      <button id="devCancel" class="btn">Cancel</button>
      <button id="devSubmit" class="btn">Unlock</button>
    </div>
  </div>
</div>

<!-- Dev Panel (right) -->
<div id="devPanelRight">
  <div class="title">Developer Panel</div>
  <div class="dev-group">
    <button id="btnToggleLocation" class="btn dev-toggle">Location</button>
    <button id="btnFly" class="btn dev-toggle">Fly</button>
    <button id="btnShowGhost" class="btn dev-toggle">Show Ghost</button>
    <button id="btnPin" class="btn">Pin Location</button>
    <button id="btnDevLog" class="btn">Create Dev Log</button>
    <div class="desc">Toggles apply immediately while Dev Mode is active.</div>
  </div>
  <div class="dev-group">
    <button id="btnToggleNavMesh" class="btn dev-toggle">Show NavMesh</button>
    <button id="btnRampTool" class="btn">Ramp Tool</button>
    <button id="btnShowColliders" class="btn dev-toggle">Show Colliders</button>
    <button id="btnExportColliders" class="btn">Export Colliders</button>
    <label class="btn">Import Colliders
      <input id="inputImportColliders" type="file" accept="application/json" style="display:none">
    </label>
    <button id="btnBuildNavMesh" class="btn">Rebuild NavMesh</button>
  </div>
</div>

<!-- Mobile touch areas -->
<div id="touchLeft"></div>
<div id="touchRight"></div>

<script>
/* =========================
   Core scene boot
========================= */
let canvas, engine, scene;
let firstPersonCam, thirdPersonCam, activeCamera;
let player;
let flyMode = false;
let devMode = false;
let showLocation = false;

const START_POS = { x: 31.47, y: 1.6, z: 0.0 }; // van spot facing the house
const GRAVITY = new BABYLON.Vector3(0, -0.9, 0); // strong enough; no fall damage logic needed

// HUD elts
const hudRoom = document.getElementById("roomName");
const hudSanity = document.getElementById("sanityDisplay");
const hudWeather = document.getElementById("weatherDisplay");
const hudX = document.getElementById("debugX");
const hudZ = document.getElementById("debugZ");

// Dev unlock handling
let xyzDownTimer = null;
const KEY_HELD_MS = 3000;
const pressed = new Set();

const devOverlay = document.getElementById("devUnlockOverlay");
const devPwd = document.getElementById("devPwd");
const devCancel = document.getElementById("devCancel");
const devSubmit = document.getElementById("devSubmit");
const devPanel = document.getElementById("devPanelRight");

// Dev panel buttons
const btnToggleLocation = document.getElementById("btnToggleLocation");
const btnFly = document.getElementById("btnFly");
const btnShowGhost = document.getElementById("btnShowGhost");
const btnPin = document.getElementById("btnPin");
const btnDevLog = document.getElementById("btnDevLog");

// Nav/Ramp tool buttons (wired later)
const btnToggleNavMesh   = document.getElementById("btnToggleNavMesh");
const btnRampTool        = document.getElementById("btnRampTool");
const btnShowColliders   = document.getElementById("btnShowColliders");
const btnExportColliders = document.getElementById("btnExportColliders");
const inputImportColliders = document.getElementById("inputImportColliders");
const btnBuildNavMesh    = document.getElementById("btnBuildNavMesh");

// Ghost guess modal
const ghostGuessBtn = document.getElementById("ghostGuessButton");
const ghostModal = document.getElementById("ghostModal");
const ghostModalClose = document.getElementById("ghostModalClose");
const ghostGrid = document.getElementById("ghostGrid");

// Mobile touch
const touchLeft = document.getElementById("touchLeft");
const touchRight = document.getElementById("touchRight");

// Simple game state
let sanity = 100;
let weather = "Clear";
let currentRoom = "Outside";

// Ghost catalog (names only for guess UI)
const ghostProfiles = [
  "Spirit","Wraith","Phantom","Poltergeist","Banshee","Jinn","Mare","Revenant","Shade",
  "Demon","Yurei","Oni","Yokai","Hantu","Goryo","Myling","Onryo","The Twins","Raiju",
  "Obake","The Mimic","Moroi","Deogen","Thaye","Succubus"
];
let actualGhost = "Shade"; // placeholder – wire to your picker/AI later

window.addEventListener("DOMContentLoaded", async () => {
  canvas = document.getElementById("renderCanvas");
  engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0,0,0,1);
  scene.collisionsEnabled = true;
  scene.gravity = GRAVITY;

  // Lighting
  const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  hemi.intensity = 0.55;

  // Cameras
  setupCameras();

  // Player collider
  createPlayer();

  // Load map (house centered at origin)
  await BABYLON.SceneLoader.AppendAsync("./assets/models/map/", "Abandoned_House.glb", scene);
  // (Optional) freeze static meshes for perf:
  scene.meshes.forEach(m => { m.checkCollisions = true; m.isPickable = true; });

  // Position player at van
  player.position.set(START_POS.x, START_POS.y, START_POS.z);

  // Basic ground (optional safety plane if needed)
  const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 400, height: 400 }, scene);
  ground.position.y = 0;
  ground.checkCollisions = true;

  // Keyboard: camera toggle
  window.addEventListener("keydown", (e) => { if (e.key.toLowerCase() === "v") toggleCamera(); });

  // HUD updater
  scene.onBeforeRenderObservable.add(() => {
    hudX.textContent = player.position.x.toFixed(2);
    hudZ.textContent = player.position.z.toFixed(2);
    hudSanity.textContent = Math.max(0, Math.floor(sanity)) + "%";
    hudWeather.textContent = weather;
  });

  // Dev unlock watcher
  setupDevUnlock();

  // Ghost Guess UI
  wireGhostGuess();

  // Touch controls
  setupTouchControls();

  // Dev panel actions
  wireDevPanelBasics();

  // Navmesh + ramp tool (full feature block appended below)
  initCollidersAndNavTool();

  engine.runRenderLoop(()=> scene.render());
  window.addEventListener("resize", ()=> engine.resize());
});

/* ---------- Cameras ---------- */
function setupCameras(){
  firstPersonCam = new BABYLON.UniversalCamera("fpCam", new BABYLON.Vector3(START_POS.x, START_POS.y, START_POS.z), scene);
  firstPersonCam.minZ = 0.1;
  firstPersonCam.speed = 1.6;
  firstPersonCam.inertia = 0.7;

  thirdPersonCam = new BABYLON.ArcRotateCamera(
    "tpCam",
    BABYLON.Tools.ToRadians(90),
    BABYLON.Tools.ToRadians(75),
    6,
    new BABYLON.Vector3(START_POS.x, START_POS.y, START_POS.z),
    scene
  );
  thirdPersonCam.lowerRadiusLimit = 3;
  thirdPersonCam.upperRadiusLimit = 12;
  thirdPersonCam.inertia = 0.5;

  activeCamera = firstPersonCam;
  scene.activeCamera = activeCamera;
  activeCamera.attachControl(canvas, true);
}

function toggleCamera(){
  activeCamera.detachControl();
  activeCamera = (activeCamera === firstPersonCam) ? thirdPersonCam : firstPersonCam;
  scene.activeCamera = activeCamera;
  activeCamera.attachControl(canvas, true);
}

/* ---------- Player ---------- */
function createPlayer(){
  player = BABYLON.MeshBuilder.CreateCapsule("playerCollider", { height: 1.8, radius: 0.45 }, scene);
  player.isVisible = false;
  player.checkCollisions = true;
  player.ellipsoid = new BABYLON.Vector3(0.45, 0.9, 0.45);
  player.ellipsoidOffset = new BABYLON.Vector3(0, 0.9, 0);
  firstPersonCam.parent = player;
  thirdPersonCam.lockedTarget = player;

  // Basic WASD movement
  const input = {};
  scene.actionManager = new BABYLON.ActionManager(scene);
  scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, (e)=> input[e.sourceEvent.key.toLowerCase()] = true));
  scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, (e)=> input[e.sourceEvent.key.toLowerCase()] = false));

  scene.onBeforeRenderObservable.add(() => {
    const dt = engine.getDeltaTime() / 1000;
    let move = new BABYLON.Vector3(0,0,0);
    const cam = firstPersonCam; // movement basis
    const fwd = cam.getDirection(BABYLON.Axis.Z); fwd.y = 0; fwd.normalize();
    const right = cam.getDirection(BABYLON.Axis.X); right.y = 0; right.normalize();

    const speed = input["shift"] ? 3.2 : 1.6;
    if (input["w"]) move.addInPlace(fwd);
    if (input["s"]) move.subtractInPlace(fwd);
    if (input["a"]) move.subtractInPlace(right);
    if (input["d"]) move.addInPlace(right);
    if (flyMode) {
      if (input[" "]) move.y += 1;           // up
      if (input["control"]) move.y -= 1;     // down
    }

    if (move.lengthSquared() > 0) {
      move.normalize();
      const step = move.scale(speed * (flyMode ? 2.0 : 1.0));
      if (flyMode) {
        player.position.addInPlace(step.scale(dt * 7));
      } else {
        player.moveWithCollisions(step.scale(dt * 7));
      }
    }
  });
}

/* ---------- Dev Unlock ---------- */
function setupDevUnlock(){
  window.addEventListener("keydown", e=>{
    pressed.add(e.key.toLowerCase());
    if (pressed.has("x") && pressed.has("y") && pressed.has("z") && !xyzDownTimer){
      xyzDownTimer = setTimeout(()=> {
        devOverlay.style.display = "flex";
        devPwd.value = "";
      }, KEY_HELD_MS);
    }
  });
  window.addEventListener("keyup", e=>{
    pressed.delete(e.key.toLowerCase());
    if (xyzDownTimer && !(pressed.has("x") && pressed.has("y") && pressed.has("z"))){
      clearTimeout(xyzDownTimer); xyzDownTimer = null;
    }
  });

  devCancel.onclick = ()=> { devOverlay.style.display = "none"; };
  devSubmit.onclick = ()=>{
    if ((devPwd.value || "").toLowerCase() === "devmode"){
      devMode = true; devOverlay.style.display = "none";
      devPanel.style.display = "block";
    } else {
      alert("Wrong password.");
    }
  };
}

/* ---------- Dev Panel Basics ---------- */
function wireDevPanelBasics(){
  btnToggleLocation.onclick = ()=>{
    showLocation = !showLocation;
    btnToggleLocation.classList.toggle("active", showLocation);
    document.getElementById("hud").style.display = showLocation ? "block" : "block"; // HUD always on; button is for XY overlay
  };
  btnFly.onclick = ()=>{
    flyMode = !flyMode;
    btnFly.classList.toggle("active", flyMode);
    scene.gravity = flyMode ? new BABYLON.Vector3(0,0,0) : GRAVITY;
  };
  btnShowGhost.onclick = ()=>{
    btnShowGhost.classList.toggle("active");
    // hook up to your ghost mesh visibility here when ready
    console.log("Show Ghost toggled (stub).");
  };
  btnPin.onclick = ()=>{
    // Create a screen-space pin at current player location (dev-only visual)
    const pin = document.createElement("div"); pin.className = "dev-pin";
    document.body.appendChild(pin);
    // just park it near HUD for now; later: project world->screen
    pin.style.top = "48px"; pin.style.right = "12px";
    setTimeout(()=> pin.remove(), 6000);
  };
  btnDevLog.onclick = ()=>{
    const payload = {
      when: new Date().toISOString(),
      engineInfo: engine.getGlInfo ? engine.getGlInfo() : {},
      assets: "Assets loading report would go here if wired.",
      player: { x: player.position.x, y: player.position.y, z: player.position.z }
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `devlog_${Date.now()}.json`; a.click(); a.remove();
  };
}

/* ---------- Ghost Guess UI ---------- */
function wireGhostGuess(){
  ghostGuessBtn.onclick = ()=>{
    ghostModal.style.display = "flex";
    renderGhostGrid();
  };
  ghostModalClose.onclick = ()=> ghostModal.style.display = "none";
}
function renderGhostGrid(){
  ghostGrid.innerHTML = "";
  ghostProfiles.forEach(name=>{
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = name;
    b.onclick = ()=>{
      ghostModal.style.display = "none";
      if (name.toLowerCase() === (actualGhost||"").toLowerCase()){
        alert(`Correct — it was a ${name}.`);
      } else {
        alert(`Incorrect — answer was ${actualGhost}.`);
      }
    };
    ghostGrid.appendChild(b);
  });
}

/* ---------- Touch Controls (mobile) ---------- */
function setupTouchControls(){
  // Left area = virtual joystick
  let lActive=false, lx=0, ly=0, lStart=null;
  touchLeft.addEventListener("pointerdown", e=>{ lActive=true; lStart={x:e.clientX,y:e.clientY}; touchLeft.setPointerCapture(e.pointerId); });
  touchLeft.addEventListener("pointermove", e=>{
    if(!lActive||!lStart) return;
    lx = (e.clientX - lStart.x)/80; ly = (e.clientY - lStart.y)/80;
  });
  const stopL = e=>{ lActive=false; lStart=null; lx=ly=0; };
  touchLeft.addEventListener("pointerup", stopL); touchLeft.addEventListener("pointercancel", stopL);

  // Right area = look
  let rActive=false, rx=0, ry=0, rLast=null;
  touchRight.addEventListener("pointerdown", e=>{ rActive=true; rLast={x:e.clientX,y:e.clientY}; touchRight.setPointerCapture(e.pointerId); });
  touchRight.addEventListener("pointermove", e=>{
    if(!rActive||!rLast) return;
    const dx = (e.clientX - rLast.x) * 0.0025;
    const dy = (e.clientY - rLast.y) * 0.0025;
    rLast = {x:e.clientX,y:e.clientY};
    if (activeCamera===firstPersonCam){
      firstPersonCam.rotation.y += dx;
      firstPersonCam.rotation.x = BABYLON.Scalar.Clamp(firstPersonCam.rotation.x + dy, -Math.PI/2, Math.PI/2);
    } else {
      thirdPersonCam.alpha -= dx*2;
      thirdPersonCam.beta = BABYLON.Scalar.Clamp(thirdPersonCam.beta + dy*2, 0.2, Math.PI/2);
    }
  });
  const stopR = e=>{ rActive=false; rLast=null; };
  touchRight.addEventListener("pointerup", stopR); touchRight.addEventListener("pointercancel", stopR);

  // Apply left joystick to player each frame
  scene.onBeforeRenderObservable.add(()=>{
    if (!lActive) return;
    const cam = firstPersonCam;
    const fwd = cam.getDirection(BABYLON.Axis.Z); fwd.y=0; fwd.normalize();
    const right = cam.getDirection(BABYLON.Axis.X); right.y=0; right.normalize();
    const vec = right.scale(lx).add(fwd.scale(-ly)); // joystick usual y inverted
    if (vec.lengthSquared()>0){
      vec.normalize();
      const step = vec.scale(1.3);
      if (flyMode) player.position.addInPlace(step.scale(engine.getDeltaTime()/1000*7));
      else player.moveWithCollisions(step.scale(engine.getDeltaTime()/1000*7));
    }
  });
}

/* =========================================================
   Navmesh + Ramp Tool (colliders persist/export/import)
   ========================================================= */
let navPlugin = null, navDebugMesh = null;
const NAV_PARAMS = {
  cs: 0.12, ch: 0.12, walkableSlopeAngle: 45,
  walkableHeight: 1.8, walkableClimb: 0.45, walkableRadius: 0.35,
  maxEdgeLen: 12, maxSimplificationError: 1.3, minRegionArea: 4, mergeRegionArea: 20,
  maxVertsPerPoly: 6, detailSampleDist: 6, detailSampleMaxError: 1
};
let devShowNav=false, devShowCols=false;
let colliderDefs=[], colliderMeshes=[];
const COLLIDER_STORE_KEY="pp3d_colliders_v1";
let rampToolActive=false, rampFirstPoint=null;
let pointerObs=null;

// buttons already grabbed above

function v3ToObj(v){ return {x:+v.x,y:+v.y,z:+v.z}; }
function objToV3(o){ return new BABYLON.Vector3(o.x,o.y,o.z); }

function createRampMesh(def){
  const p1 = objToV3(def.p1), p2 = objToV3(def.p2);
  const up = def.height ?? 0.5, width = def.width ?? 1.4, thick = def.thickness ?? 0.2;
  const dirXZ = new BABYLON.Vector3(p2.x-p1.x,0,p2.z-p1.z);
  const flatLen = Math.max(0.001, dirXZ.length());
  const yaw = Math.atan2(dirXZ.x, dirXZ.z);
  const tilt = -Math.atan2(up, flatLen);
  const center = new BABYLON.Vector3((p1.x+p2.x)/2, (p1.y+p2.y)/2 + up/2, (p1.z+p2.z)/2);

  const box = BABYLON.MeshBuilder.CreateBox("devRamp", { width, height: thick, depth: flatLen }, scene);
  box.position.copyFrom(center);
  box.rotation.y = yaw; box.rotation.x = tilt;
  box.checkCollisions = true; box.isPickable = false;
  box.visibility = devShowCols ? 0.25 : 0.0;
  box.renderOutline = devShowCols; box.outlineColor = new BABYLON.Color3(0.2,0.8,1); box.outlineWidth = 0.02;
  colliderMeshes.push(box);
  return box;
}
function clearColliderMeshes(){ colliderMeshes.forEach(m=>m.dispose()); colliderMeshes.length=0; }
function rebuildAllColliders(){ clearColliderMeshes(); colliderDefs.forEach(def=>createRampMesh(def)); }
function exportColliders(){
  const blob = new Blob([JSON.stringify(colliderDefs,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`colliders_${Date.now()}.json`; a.click(); a.remove();
}
function importCollidersFromFile(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const arr=JSON.parse(r.result); if(Array.isArray(arr)){ colliderDefs=arr; localStorage.setItem(COLLIDER_STORE_KEY,JSON.stringify(colliderDefs)); rebuildAllColliders(); }
    }catch(e){ console.error("Bad colliders JSON", e); }
  };
  r.readAsText(file);
}

function enableRampTool(on){
  rampToolActive = !!on;
  btnRampTool.classList.toggle("active", rampToolActive);
  if (pointerObs){ scene.onPointerObservable.remove(pointerObs); pointerObs=null; rampFirstPoint=null; }
  if (!rampToolActive) return;

  pointerObs = scene.onPointerObservable.add((pi)=>{
    if (pi.type !== BABYLON.PointerEventTypes.POINTERDOWN) return;
    const pick = scene.pick(scene.pointerX, scene.pointerY, m=>m && m.isPickable!==false);
    if (!pick?.hit) return;
    if (!rampFirstPoint){
      rampFirstPoint = pick.pickedPoint.clone();
      const s = BABYLON.MeshBuilder.CreateSphere("rampP1",{diameter:0.2},scene);
      s.position.copyFrom(rampFirstPoint);
      const mat = new BABYLON.StandardMaterial("p1mat", scene); mat.emissiveColor = new BABYLON.Color3(0.2,0.8,1);
      s.material = mat; s.isPickable=false; setTimeout(()=>s.dispose(),900);
    } else {
      const p2 = pick.pickedPoint.clone();
      const def = { type:"ramp", p1:v3ToObj(rampFirstPoint), p2:v3ToObj(p2), height:0.5, width:1.4, thickness:0.2 };
      colliderDefs.push(def);
      localStorage.setItem(COLLIDER_STORE_KEY, JSON.stringify(colliderDefs));
      createRampMesh(def);
      rampFirstPoint = null;
      const h = prompt("Ramp rise (meters)?", "0.5");
      if (h!==null){ def.height = Math.max(0, parseFloat(h)||0.5); rebuildAllColliders(); localStorage.setItem(COLLIDER_STORE_KEY, JSON.stringify(colliderDefs)); }
    }
  });
}

async function ensureNav(){ if (!navPlugin && window.Recast) navPlugin = new BABYLON.RecastJSPlugin(); }
async function buildNavMesh(show=false){
  await ensureNav(); if (!navPlugin) { console.warn("RecastJS not available"); return; }
  const sources = scene.meshes.filter(m=> m && m.isEnabled() && !m.isDisposed());
  try{
    navPlugin.createNavMesh(sources, NAV_PARAMS);
    if (navDebugMesh){ navDebugMesh.dispose(); navDebugMesh=null; }
    if (show){
      navDebugMesh = navPlugin.createDebugNavMesh(scene);
      navDebugMesh.position.y += 0.02; navDebugMesh.isPickable=false;
    }
  }catch(e){ console.error("Nav build failed", e); }
}
function toggleNavDebug(on){
  devShowNav = !!on; btnToggleNavMesh.classList.toggle("active", devShowNav);
  if (!navPlugin) return;
  if (devShowNav){
    if (!navDebugMesh) navDebugMesh = navPlugin.createDebugNavMesh(scene);
    navDebugMesh.setEnabled(true); navDebugMesh.position.y = 0.02;
  } else if (navDebugMesh){ navDebugMesh.setEnabled(false); }
}

function initCollidersAndNavTool(){
  // Wire buttons
  btnRampTool?.addEventListener("click", ()=> enableRampTool(!rampToolActive));
  btnShowColliders?.addEventListener("click", ()=>{
    devShowCols = !devShowCols; btnShowColliders.classList.toggle("active", devShowCols);
    colliderMeshes.forEach(m=>{ m.visibility = devShowCols ? 0.25 : 0.0; m.renderOutline = devShowCols; });
  });
  btnExportColliders?.addEventListener("click", exportColliders);
  inputImportColliders?.addEventListener("change", e=>{
    const f=e.target.files?.[0]; if(f) importCollidersFromFile(f); inputImportColliders.value="";
  });
  btnBuildNavMesh?.addEventListener("click", ()=> buildNavMesh(devShowNav));
  btnToggleNavMesh?.addEventListener("click", ()=> toggleNavDebug(!devShowNav));

  // Restore colliders & initial hidden nav build after scene is ready
  const init = setInterval(async ()=>{
    if (!scene || scene.meshes.length===0) return;
    clearInterval(init);
    try{
      const saved = localStorage.getItem(COLLIDER_STORE_KEY);
      if (saved){ colliderDefs = JSON.parse(saved)||[]; rebuildAllColliders(); }
    }catch(e){}
    buildNavMesh(false);
  }, 250);
}
</script>
</body>
</html>
