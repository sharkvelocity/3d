<!-- ===================== RUNTIME HOOKS ===================== -->
<script>
(function wireStart(){
  const btn = document.getElementById('start-button');
  if (!btn) return;
  btn.addEventListener('click', async function onStart(){
    try { window.PP?.audio?.init?.(); } catch(e){ console.warn('[audio.init] failed', e); }

    document.getElementById('title-screen')?.remove();
    window.__PP_ALREADY_STARTED__ = true;
    window.dispatchEvent(new CustomEvent('pp:start'));

    const canvas = document.getElementById('renderCanvas');
    try { canvas?.requestPointerLock?.(); } catch {}
    try { canvas?.focus?.(); } catch {}

    // Wait for Babylon scene
    let scene = window.SCENE || BABYLON.EngineStore.LastCreatedScene;
    while(!scene) { await new Promise(r=>setTimeout(r,50)); scene = window.SCENE || BABYLON.EngineStore.LastCreatedScene; }

    // Enable collisions
    scene.collisionsEnabled = true;

    // Load Havok physics
    const havok = await HavokPhysics();
    scene.enablePhysics(new BABYLON.Vector3(0,-9.81,0), new BABYLON.HavokPlugin(true, havok));

    // Load map
    if (window.MAP_DEF?.file) {
      BABYLON.SceneLoader.ImportMesh("", "./assets/models/map/", window.MAP_DEF.file, scene, function(meshes){
        meshes.forEach(mesh=>{
          mesh.checkCollisions = true;
          mesh.isPickable = true;

          // Tag doors separately
          if(mesh.name.toLowerCase().includes("door")){
            mesh.isPickable = true; // keep doors interactive
          }
        });
      });
    }

    // Load doors separately if needed
    if(window.MAP_DEF?.doors?.length){
      window.MAP_DEF.doors.forEach(doorFile=>{
        BABYLON.SceneLoader.ImportMesh("", "./assets/models/", doorFile, scene, (meshes)=>{
          meshes.forEach(mesh=>{
            mesh.checkCollisions = true;
            mesh.isPickable = true;
            mesh.actionManager = new BABYLON.ActionManager(scene);
            mesh.actionManager.registerAction(
              new BABYLON.ExecuteCodeAction(
                BABYLON.ActionManager.OnPickTrigger,
                () => {
                  const open = mesh.rotation.y === 0;
                  mesh.rotate(BABYLON.Axis.Y, open ? Math.PI/2 : -mesh.rotation.y, BABYLON.Space.LOCAL);
                }
              )
            );
          });
        });
      });
    }

    // Spawn player
    if (window.PP?.rig?.body) {
      const sp = window.MAP_DEF?.spawn || {x:0, y:5, z:0};
      const offsetY = window.MAP_DEF.offset?.y || 0;
      window.PP.rig.body.position.set(sp.x, sp.y + offsetY, sp.z);
    }

    // Player collisions
    if (window.PP?.camera) {
      const cam = window.PP.camera;
      cam.checkCollisions = true;
      cam.applyGravity = true;
      cam.ellipsoid = new BABYLON.Vector3(0.5, 1, 0.5);
      cam.ellipsoidOffset = new BABYLON.Vector3(0, 1, 0);
    }

    // Kill barrier
    const killBarrier = BABYLON.MeshBuilder.CreateBox("killBarrier", {width:500, height:2, depth:500}, scene);
    killBarrier.position.set(0, -10, 0); // below map
    killBarrier.isVisible = false;
    killBarrier.checkCollisions = true;
    killBarrier.actionManager = new BABYLON.ActionManager(scene);
    killBarrier.actionManager.registerAction(
      new BABYLON.ExecuteCodeAction(
        {trigger: BABYLON.ActionManager.OnIntersectionEnterTrigger, parameter: window.PP?.rig?.body},
        () => {
          const van = window.MAP_DEF?.vanSpawn || {x:0, y:5, z:0};
          window.PP.rig.body.position.set(van.x, van.y, van.z);
        }
      )
    );

  }, { once:true });
})();
</script>
