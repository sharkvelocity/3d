<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Phasma‑Phoney 3D</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: black;
      font-family: monospace;
    }
    #renderCanvas { width: 100%; height: 100%; display: block; }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
      color: white;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 4px 10px;
      border-radius: 6px;
    }
    #touch-controls {
      position: absolute;
      left: 10px;
      bottom: 80px;
      z-index: 200;
    }
    #touch-controls button {
      width: 40px; height: 40px;
      margin: 2px;
      font-size: 20px;
    }
    #item-bar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 200;
    }
    .slot {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid #999;
      width: 60px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">Initializing Phasma‑Phoney 3D...</div>

  <!-- Touch D-Pad -->
  <div id="touch-controls">
    <div><button onclick="move('up')">↑</button></div>
    <div>
      <button onclick="move('left')">←</button>
      <button onclick="move('down')">↓</button>
      <button onclick="move('right')">→</button>
    </div>
  </div>

  <!-- Item Bar -->
  <div id="item-bar">
    <div class="slot" id="slot1">Empty</div>
    <div class="slot" id="slot2">Empty</div>
    <div class="slot" id="slot3">Empty</div>
    <div class="slot" id="slot4">Lighter</div>
    <div class="slot" id="slot5">Journal</div>
  </div>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    let scene, player, ghost;

    function move(dir) {
      const step = 0.5;
      if (!player) return;
      if (dir === "up") player.position.z -= step;
      if (dir === "down") player.position.z += step;
      if (dir === "left") player.position.x -= step;
      if (dir === "right") player.position.x += step;
    }

    async function createScene() {
      scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color3.Black();

      const camera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(0, 5, -10), scene);
      camera.setTarget(new BABYLON.Vector3(0, 2, 0));
      camera.attachControl(canvas, true);
      camera.minZ = 0.1;

      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
      light.intensity = 1.0;

      const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 200, height: 200 }, scene);
      const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
      groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.15, 0.1);
      ground.material = groundMat;

      // Prevent clipping below ground
      scene.onBeforeRenderObservable.add(() => {
        if (camera.position.y < 1) camera.position.y = 1;
      });

      return scene;
    }

    createScene().then(s => {
      document.getElementById("hud").textContent = "Scene loaded.";
      engine.runRenderLoop(() => {
        s.render();
      });
    });

    window.addEventListener("resize", () => engine.resize());
     // PLAYER SETUP
    const playerBox = BABYLON.MeshBuilder.CreateBox("player", { size: 1 }, scene);
    playerBox.position.y = 0.5;
    const playerMat = new BABYLON.StandardMaterial("playerMat", scene);
    playerMat.diffuseColor = new BABYLON.Color3.White();
    playerBox.material = playerMat;
    player = playerBox;

    // GHOST SETUP (INVISIBLE UNTIL EVENTS)
    const ghostBox = BABYLON.MeshBuilder.CreateSphere("ghost", { diameter: 1.5 }, scene);
    ghostBox.position = new BABYLON.Vector3(0, 0.75, 5);
    const ghostMat = new BABYLON.StandardMaterial("ghostMat", scene);
    ghostMat.diffuseColor = new BABYLON.Color3(1, 1, 1);
    ghostMat.alpha = 0; // invisible until active
    ghostBox.material = ghostMat;
    ghost = ghostBox;

    // ROOM ZONES (INVISIBLE)
    const roomZones = [
      { name: "Foyer", bounds: new BABYLON.Vector3(-10, 0, -10), size: 10 },
      { name: "Kitchen", bounds: new BABYLON.Vector3(10, 0, -10), size: 10 },
      { name: "Basement", bounds: new BABYLON.Vector3(-10, 0, 10), size: 10 },
      { name: "Garage", bounds: new BABYLON.Vector3(10, 0, 10), size: 10 }
    ];

    const zoneMeshes = [];
    roomZones.forEach(zone => {
      const z = BABYLON.MeshBuilder.CreateBox(zone.name, {
        width: zone.size,
        height: 4,
        depth: zone.size
      }, scene);
      z.position = zone.bounds;
      z.visibility = 0;
      zoneMeshes.push(z);
    });

    // GAME STATE
    let gameState = {
      ghostType: null,
      ghostRoom: null,
      ghostVisible: false,
      lastRoom: null,
      sanity: 100,
      turn: 0,
      evidenceFound: [],
      heldItems: ["EMF Reader", "Spirit Box", "Camera"],
      placedItems: [],
      ghostCooldown: 0
    };

    // GHOST TYPES (25 GHOSTS)
    const ghostProfiles = {
      Spirit:    { evidence: ["EMF 5", "Spirit Box", "Writing"], aggressive: false },
      Wraith:    { evidence: ["DOTS", "Spirit Box", "EMF 5"], aggressive: true },
      Phantom:   { evidence: ["Spirit Box", "Fingerprints", "DOTS"], aggressive: false },
      Poltergeist: { evidence: ["Spirit Box", "Writing", "Fingerprints"], aggressive: true },
      Banshee:   { evidence: ["Orbs", "DOTS", "Fingerprints"], aggressive: true },
      Jinn:      { evidence: ["EMF 5", "Freezing", "Fingerprints"], aggressive: true },
      Mare:      { evidence: ["Spirit Box", "Orbs", "Writing"], aggressive: true },
      Revenant:  { evidence: ["Writing", "Freezing", "Orbs"], aggressive: true },
      Shade:     { evidence: ["Writing", "Freezing", "EMF 5"], aggressive: false },
      Demon:     { evidence: ["Freezing", "Writing", "Fingerprints"], aggressive: true },
      Yurei:     { evidence: ["Freezing", "Orbs", "DOTS"], aggressive: true },
      Oni:       { evidence: ["EMF 5", "Freezing", "DOTS"], aggressive: true },
      Yokai:     { evidence: ["Spirit Box", "Orbs", "DOTS"], aggressive: false },
      Hantu:     { evidence: ["Fingerprints", "Freezing", "Orbs"], aggressive: true },
      Goryo:     { evidence: ["DOTS", "EMF 5", "Fingerprints"], aggressive: false },
      Myling:    { evidence: ["Writing", "EMF 5", "Fingerprints"], aggressive: true },
      Onryo:     { evidence: ["Freezing", "Spirit Box", "Orbs"], aggressive: true },
      Twins:     { evidence: ["EMF 5", "Freezing", "Spirit Box"], aggressive: true },
      Raiju:     { evidence: ["EMF 5", "Orbs", "DOTS"], aggressive: true },
      Obake:     { evidence: ["EMF 5", "Orbs", "Fingerprints"], aggressive: true },
      The Mimic: { evidence: ["Spirit Box", "Fingerprints", "Freezing"], aggressive: true }, // always shows fake orbs
      Moroi:     { evidence: ["Spirit Box", "Writing", "Freezing"], aggressive: true },
      Deogen:    { evidence: ["Spirit Box", "Writing", "DOTS"], aggressive: true },
      Thaye:     { evidence: ["Orbs", "Writing", "DOTS"], aggressive: true },
      Succubus:  { evidence: ["Writing", "Orbs", "Spirit Box"], aggressive: true }
    };

    // RANDOM GHOST SELECTION
    function randomGhost() {
      const keys = Object.keys(ghostProfiles);
      const pick = keys[Math.floor(Math.random() * keys.length)];
      gameState.ghostType = pick;
      console.log("Ghost Selected:", pick);
    }

    randomGhost();

    // TRACK PLAYER'S CURRENT ROOM
    function getPlayerRoom() {
      for (let i = 0; i < zoneMeshes.length; i++) {
        if (player.intersectsMesh(zoneMeshes[i], false)) {
          return roomZones[i].name;
        }
      }
      return null;
    }

    // GHOST ROOM SYSTEM
    function updateGhostRoom() {
      if (gameState.ghostType === "Goryo") return; // Goryo never moves
      if (Math.random() < 0.1) { // 10% chance per interval to change rooms
        const otherRooms = roomZones.filter(z => z.name !== gameState.ghostRoom);
        const newRoom = otherRooms[Math.floor(Math.random() * otherRooms.length)];
        gameState.ghostRoom = newRoom.name;
        ghost.position = newRoom.bounds.add(new BABYLON.Vector3(0, 0.75, 0));
        console.log("👻 Ghost moved to:", newRoom.name);
      }
    }

    // GHOST VISIBILITY + PROXIMITY CHECK
    function updateGhostVisibility() {
      const playerRoom = getPlayerRoom();
      if (playerRoom === gameState.ghostRoom && Math.random() < 0.3) {
        ghost.material.alpha = 0.6;
        gameState.ghostVisible = true;
      } else {
        ghost.material.alpha = 0;
        gameState.ghostVisible = false;
      }
    }

    // SANITY DRAIN BASED ON PROXIMITY
    function drainSanity() {
      let drain = 0.2;
      const inGhostRoom = getPlayerRoom() === gameState.ghostRoom;
      if (inGhostRoom) {
        drain += 0.5;
        if (gameState.ghostVisible) drain += 0.8;
      }
      gameState.sanity = Math.max(0, gameState.sanity - drain);
      document.getElementById("hud").innerText = `Sanity: ${Math.floor(gameState.sanity)}%`;
    }

    // GHOST MIMIC BEHAVIOR (Mimic picks another ghost's traits every 3–6 turns)
    let mimicTimer = Math.floor(Math.random() * 3) + 3;
    let mimicBehavior = null;

    function updateMimic() {
      if (gameState.ghostType !== "The Mimic") return;
      if (mimicTimer <= 0) {
        const nonMimics = Object.keys(ghostProfiles).filter(g => g !== "The Mimic");
        mimicBehavior = ghostProfiles[nonMimics[Math.floor(Math.random() * nonMimics.length)]];
        mimicTimer = Math.floor(Math.random() * 3) + 3;
        console.log("🌀 Mimic is mimicking:", mimicBehavior);
      } else {
        mimicTimer--;
      }
    }

    // CAMERA ORB DETECTION
    function detectOrbs() {
      if (!gameState.heldItems.includes("Camera")) return;
      const inGhostRoom = getPlayerRoom() === gameState.ghostRoom;
      const isMimic = gameState.ghostType === "The Mimic";
      if ((isMimic || ghostProfiles[gameState.ghostType].evidence.includes("Orbs")) && inGhostRoom) {
        if (Math.random() < 0.4) {
          logMessage("✨ You see ghost orbs on the camera.");
          gameState.evidenceFound.push("Orbs");
        }
      }
    }

    // TURN HANDLER
    function advanceTurn() {
      gameState.turn++;
      updateMimic();
      updateGhostRoom();
      updateGhostVisibility();
      drainSanity();
      detectOrbs();
      checkHunt();
    }

    // AUTO TURN ADVANCE INTERVAL
    setInterval(() => {
      advanceTurn();
    }, 7000); // every 7 seconds

    // INITIAL GHOST POSITION
    const initialRoom = roomZones[Math.floor(Math.random() * roomZones.length)];
    gameState.ghostRoom = initialRoom.name;
    ghost.position = initialRoom.bounds.add(new BABYLON.Vector3(0, 0.75, 0));

    // ============================
    // INVENTORY AND ITEM SYSTEM
    // ============================

    const allItems = ["Camera", "EMF Reader", "Thermometer", "Spirit Box", "Writing Book", "UV Flashlight", "Crucifix", "Smudge Stick"];
    const heldItems = []; // max 3 items
    const roomItems = {}; // { roomName: [item1, item2] }

    // INVENTORY SLOTS UI
    const slotContainer = document.createElement("div");
    slotContainer.style.position = "absolute";
    slotContainer.style.bottom = "10px";
    slotContainer.style.left = "50%";
    slotContainer.style.transform = "translateX(-50%)";
    slotContainer.style.display = "flex";
    slotContainer.style.gap = "8px";
    slotContainer.style.zIndex = 99;
    document.body.appendChild(slotContainer);

    for (let i = 0; i < 5; i++) {
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.style.width = "50px";
      slot.style.height = "50px";
      slot.style.border = "2px solid white";
      slot.style.background = "rgba(255,255,255,0.1)";
      slot.style.display = "flex";
      slot.style.alignItems = "center";
      slot.style.justifyContent = "center";
      slot.style.fontSize = "10px";
      slot.style.fontFamily = "monospace";
      slot.innerText = (i < 3) ? "—" : (i === 3 ? "Lighter" : "Notebook");
      slotContainer.appendChild(slot);
    }

    function refreshInventoryDisplay() {
      for (let i = 0; i < 3; i++) {
        slotContainer.children[i].innerText = heldItems[i] || "—";
      }
    }

    // PICK UP ITEM
    function pickUpItem(itemName) {
      if (heldItems.length >= 3) {
        logMessage("You can't carry more than 3 items.");
        return;
      }
      heldItems.push(itemName);
      refreshInventoryDisplay();
      logMessage(`Picked up: ${itemName}`);
    }

    // DROP ITEM
    function dropItem(itemName) {
      const room = getPlayerRoom();
      if (!room) {
        logMessage("You must be in a room to drop an item.");
        return;
      }
      heldItems.splice(heldItems.indexOf(itemName), 1);
      roomItems[room] = roomItems[room] || [];
      roomItems[room].push(itemName);
      logMessage(`Dropped ${itemName} in ${room}`);
      refreshInventoryDisplay();
    }

    // USE ITEM
    function useItem(itemName) {
      const ghost = ghostProfiles[gameState.ghostType];
      const isInGhostRoom = getPlayerRoom() === gameState.ghostRoom;

      if (itemName === "EMF Reader" && isInGhostRoom && Math.random() < 0.4) {
        logMessage("🔊 EMF spikes detected!");
        gameState.evidenceFound.push("EMF5");
      } else if (itemName === "Thermometer" && isInGhostRoom) {
        const temp = (ghost.evidence.includes("Freezing Temps")) ? -5 : 10 + Math.random() * 10;
        logMessage(`🌡️ Temperature: ${temp.toFixed(1)}°C`);
        if (temp < 0) gameState.evidenceFound.push("Freezing Temps");
      } else if (itemName === "Spirit Box" && isInGhostRoom && Math.random() < 0.3) {
        logMessage("📻 Spirit Box: *unintelligible voice*");
        gameState.evidenceFound.push("Spirit Box");
      } else if (itemName === "Writing Book" && isInGhostRoom && Math.random() < 0.3) {
        logMessage("📓 Ghost writing has appeared.");
        gameState.evidenceFound.push("Ghost Writing");
      } else if (itemName === "UV Flashlight" && isInGhostRoom && Math.random() < 0.3) {
        logMessage("🦶 You see fingerprints or footprints.");
        gameState.evidenceFound.push("Fingerprints");
      } else if (itemName === "Crucifix" && isInGhostRoom) {
        gameState.lastSmudgeOrCrucifixTurn = gameState.turn;
        logMessage("✝️ Crucifix placed. May block a future hunt.");
      } else if (itemName === "Smudge Stick" && isInGhostRoom) {
        gameState.lastSmudgeOrCrucifixTurn = gameState.turn;
        logMessage("💨 You smudged the room.");
        if (gameState.ghostType === "Yurei") {
          gameState.yureiStuckTurns = 5;
          logMessage("The ghost seems trapped...");
        }
        heldItems.splice(heldItems.indexOf("Smudge Stick"), 1); // consumed
        refreshInventoryDisplay();
      } else {
        logMessage("Nothing happens.");
      }
    }

    function logMessage(msg) {
      console.log("[LOG]", msg);
      const hud = document.getElementById("hud");
      hud.innerText = msg + "\n" + `Sanity: ${Math.floor(gameState.sanity)}%`;
    }

    // INITIAL EQUIPMENT
    pickUpItem("EMF Reader");
    pickUpItem("Thermometer");
    pickUpItem("Spirit Box");

    // ============================
    // GHOST BEHAVIOR AND HUNTS
    // ============================

    function advanceTurn() {
      gameState.turn++;
      updateSanity();

      if (shouldGhostRoam()) roamGhost();
      maybeTriggerHunt();
    }

    function updateSanity() {
      const inGhostRoom = getPlayerRoom() === gameState.ghostRoom;
      let drain = 2 + Math.random() * 4;

      if (inGhostRoom) drain += 5;
      if (isGhostNearby()) drain += 4;
      if (gameState.ghostType === "Demon") drain += 4;
      if (gameState.ghostType === "Yurei" && gameState.yureiStuckTurns > 0) {
        drain -= 4;
        gameState.yureiStuckTurns--;
      }

      gameState.sanity = Math.max(0, gameState.sanity - drain);
      logMessage(`Turn ${gameState.turn}. Sanity drained by ${drain.toFixed(1)}%.`);
    }

    function shouldGhostRoam() {
      if (gameState.ghostType === "Goryo") return false;
      return Math.random() < 0.1;
    }

    function roamGhost() {
      const roomNames = Object.keys(roomZones);
      let newRoom;
      do {
        newRoom = randomFromArray(roomNames);
      } while (newRoom === gameState.ghostRoom);
      gameState.ghostRoom = newRoom;
      logMessage(`The ghost has moved...`);
    }

    function maybeTriggerHunt() {
      if (gameState.sanity > 20) return;
      if (gameState.turn - gameState.lastHuntTurn < gameState.ghostCooldown) return;
      if (Math.random() < 0.4) {
        startHunt();
      }
    }

    function startHunt() {
      gameState.lastHuntTurn = gameState.turn;
      const crucifixProtected = gameState.turn - gameState.lastSmudgeOrCrucifixTurn <= 2;
      if (crucifixProtected) {
        logMessage("‼️ Crucifix prevented a hunt!");
        return;
      }

      logMessage("💀 The ghost is hunting!");
      showGhost();

      setTimeout(() => {
        const inSameRoom = getPlayerRoom() === gameState.ghostRoom;
        if (inSameRoom && Math.random() < 0.7) {
          logMessage("☠️ You were caught.");
          endGame(false);
        } else {
          logMessage("😰 You survived the hunt.");
        }
        hideGhost();
      }, 3000);
    }

    function showGhost() {
      if (!ghostEntity) return;
      ghostEntity.setEnabled(true);
      ghostEntity.material.alpha = 1;
    }

    function hideGhost() {
      if (!ghostEntity) return;
      ghostEntity.setEnabled(false);
    }

    function isGhostNearby() {
      return getPlayerRoom() === gameState.ghostRoom;
    }

    function endGame(success) {
      const message = success ? "✅ You correctly identified the ghost!" : "💀 You died!";
      logMessage(message + ` It was a ${gameState.ghostType}.`);
      engine.stopRenderLoop();
    }

    function getPlayerRoom() {
      for (const [room, box] of Object.entries(roomZones)) {
        if (box.intersectsPoint(player.position)) return room;
      }
      return null;
    }

    // Start periodic turn advancement (1 turn every ~15 seconds)
    setInterval(() => {
      if (!gameState.ghostType) return;
      advanceTurn();
    }, 15000);

    // ============================
    // GHOST GUESSING & GAME ENDING
    // ============================

    function openGuessMenu() {
      const guess = prompt("What ghost do you think it is?\n" + allGhosts.join(", "));
      if (!guess) return;
      if (guess.trim().toLowerCase() === gameState.ghostType.toLowerCase()) {
        endGame(true);
      } else {
        endGame(false);
      }
    }

    // ============================
    // TOUCH CONTROLLER OVERLAY
    // ============================

    const hud = document.getElementById("hud");
    hud.innerHTML += `
      <div id="touch-controls" style="position: absolute; bottom: 60px; left: 20px; z-index: 100;">
        <button onclick="movePlayer('up')" style="width:60px;height:60px;">⬆️</button><br>
        <button onclick="movePlayer('left')" style="width:60px;height:60px;">⬅️</button>
        <button onclick="movePlayer('down')" style="width:60px;height:60px;">⬇️</button>
        <button onclick="movePlayer('right')" style="width:60px;height:60px;">➡️</button>
      </div>
      <div id="item-bar" style="position:absolute;bottom:0;left:0;width:100%;display:flex;justify-content:center;gap:10px;z-index:100;">
        <div style="background:#222;padding:8px;border:1px solid #555;">1️⃣ ${gameState.items[0] || "-"}</div>
        <div style="background:#222;padding:8px;border:1px solid #555;">2️⃣ ${gameState.items[1] || "-"}</div>
        <div style="background:#222;padding:8px;border:1px solid #555;">3️⃣ ${gameState.items[2] || "-"}</div>
        <div style="background:#222;padding:8px;border:1px solid #555;">🔥 Lighter</div>
        <div style="background:#222;padding:8px;border:1px solid #555;">📓 Journal</div>
      </div>
      <button onclick="openGuessMenu()" style="position:absolute;top:10px;right:10px;z-index:100;">Guess Ghost</button>
    `;

    function movePlayer(direction) {
      const moveAmount = 1;
      switch (direction) {
        case "up": player.position.z -= moveAmount; break;
        case "down": player.position.z += moveAmount; break;
        case "left": player.position.x -= moveAmount; break;
        case "right": player.position.x += moveAmount; break;
      }
    }

    // ============================
    // SANITY BAR UI
    // ============================

    const sanityBar = document.createElement("div");
    Object.assign(sanityBar.style, {
      position: "absolute",
      top: "10px",
      left: "50%",
      transform: "translateX(-50%)",
      background: "#111",
      border: "1px solid #999",
      width: "200px",
      height: "20px",
      zIndex: 100
    });
    const sanityFill = document.createElement("div");
    Object.assign(sanityFill.style, {
      width: "100%",
      height: "100%",
      background: "lime"
    });
    sanityBar.appendChild(sanityFill);
    document.body.appendChild(sanityBar);

    function updateSanityBar() {
      sanityFill.style.width = gameState.sanity + "%";
      sanityFill.style.background = gameState.sanity < 20 ? "red" : gameState.sanity < 50 ? "orange" : "lime";
    }

    setInterval(updateSanityBar, 1000);

    // ============================
    // KEYBOARD SUPPORT
    // ============================

    window.addEventListener("keydown", e => {
      switch (e.key.toLowerCase()) {
        case "w": movePlayer("up"); break;
        case "s": movePlayer("down"); break;
        case "a": movePlayer("left"); break;
        case "d": movePlayer("right"); break;
        case "g": openGuessMenu(); break;
      }
    });

    // ============================
    // ITEM INTERACTION SYSTEM
    // ============================

    const itemEntities = {}; // roomName -> array of mesh items

    function placeItem(itemName) {
      if (!gameState.items.includes(itemName)) return;
      if (!gameState.currentRoom) return;

      const mesh = BABYLON.MeshBuilder.CreateBox(`${itemName}-${Date.now()}`, { size: 0.5 }, scene);
      mesh.position = new BABYLON.Vector3(player.position.x, 0.25, player.position.z);
      mesh.material = new BABYLON.StandardMaterial(`mat-${itemName}`, scene);
      mesh.material.diffuseColor = BABYLON.Color3.Random();
      mesh.metadata = { type: itemName };

      if (!itemEntities[gameState.currentRoom]) itemEntities[gameState.currentRoom] = [];
      itemEntities[gameState.currentRoom].push(mesh);

      // Remove from player
      const i = gameState.items.indexOf(itemName);
      if (i !== -1) gameState.items.splice(i, 1);
      refreshItemBar();
    }

    function pickupItemFromRoom() {
      const roomItems = itemEntities[gameState.currentRoom] || [];
      for (let i = 0; i < roomItems.length; i++) {
        const mesh = roomItems[i];
        const dist = BABYLON.Vector3.Distance(player.position, mesh.position);
        if (dist < 2) {
          if (gameState.items.length >= 3) return alert("Inventory full (3 items max). Drop one first.");
          gameState.items.push(mesh.metadata.type);
          mesh.dispose();
          roomItems.splice(i, 1);
          refreshItemBar();
          break;
        }
      }
    }

    function refreshItemBar() {
      const itemBar = document.getElementById("item-bar");
      itemBar.innerHTML = `
        <div style="background:#222;padding:8px;border:1px solid #555;">1️⃣ ${gameState.items[0] || "-"}</div>
        <div style="background:#222;padding:8px;border:1px solid #555;">2️⃣ ${gameState.items[1] || "-"}</div>
        <div style="background:#222;padding:8px;border:1px solid #555;">3️⃣ ${gameState.items[2] || "-"}</div>
        <div style="background:#222;padding:8px;border:1px solid #555;">🔥 Lighter</div>
        <div style="background:#222;padding:8px;border:1px solid #555;">📓 Journal</div>
      `;
    }

    window.addEventListener("keydown", e => {
      if (e.key === "e") pickupItemFromRoom();
      if (e.key === "1") useItemSlot(0);
      if (e.key === "2") useItemSlot(1);
      if (e.key === "3") useItemSlot(2);
    });

    function useItemSlot(slot) {
      const item = gameState.items[slot];
      if (!item) return;

      if (item === "Crucifix") {
        placeItem(item);
        gameState.activeItems.crucifix.push({ room: gameState.currentRoom, uses: 2 });
      } else if (item === "Smudge Stick") {
        if (gameState.ghostRoom === gameState.currentRoom) {
          gameState.smudgeCooldown = 5;
        }
        gameState.items.splice(slot, 1);
      } else if (item === "Camera") {
        checkForGhostOrb();
      } else {
        placeItem(item);
      }

      refreshItemBar();
    }

    function checkForGhostOrb() {
      if (gameState.ghostType === "Mimic" && gameState.currentRoom === gameState.ghostRoom) {
        alert("You spot ghost orbs through the camera...");
        if (!gameState.evidenceFound.includes("Ghost Orbs")) gameState.evidenceFound.push("Ghost Orbs");
      } else if (ghostProfiles[gameState.ghostType].evidence.includes("Ghost Orbs") &&
                 gameState.currentRoom === gameState.ghostRoom) {
        alert("You spot ghost orbs through the camera.");
        if (!gameState.evidenceFound.includes("Ghost Orbs")) gameState.evidenceFound.push("Ghost Orbs");
      } else {
        alert("No orbs detected.");
      }
    }

    function openJournal() {
      alert("Evidence found:\n" + gameState.evidenceFound.join(", "));
    }

    document.addEventListener("keydown", e => {
      if (e.key === "j") openJournal();
    });

    // ============================
    // GHOST EVENTS, ROAMING, HUNTS
    // ============================

    function randomGhostEvent() {
      const r = Math.random();
      const inGhostRoom = gameState.currentRoom === gameState.ghostRoom;

      // Sanity drain (passive)
      gameState.sanity -= inGhostRoom ? Math.random() * 3 + 2 : Math.random() * 2;

      // Smudge effect wears off
      if (gameState.smudgeCooldown > 0) gameState.smudgeCooldown--;

      // Roaming logic (Goryo exception)
      if (gameState.ghostType !== "Goryo" && Math.random() < 0.02) {
        const possibleRooms = gameState.roomList.filter(r => r !== gameState.ghostRoom);
        gameState.ghostRoom = randomFromArray(possibleRooms);
      }

      // Flicker ghost (chance)
      if (inGhostRoom && Math.random() < 0.2) {
        showGhost();
        setTimeout(hideGhost, 3000);
      }

      // Hunt trigger
      if (gameState.sanity < 20 && gameState.smudgeCooldown === 0) {
        if (Math.random() < 0.1 * ghostProfiles[gameState.ghostType].aggression) {
          startHunt();
        }
      }

      updateHUD();
    }

    function showGhost() {
      ghostMesh.visibility = 1;
    }

    function hideGhost() {
      ghostMesh.visibility = 0;
    }

    function startHunt() {
      ghostMesh.visibility = 1;
      hud.innerText = "⚠️ The ghost is hunting! Find safety!";
      setTimeout(() => {
        const crucifix = gameState.activeItems.crucifix.find(c => c.room === gameState.currentRoom);
        if (crucifix && crucifix.uses > 0) {
          crucifix.uses--;
          hud.innerText = "🙏 The crucifix saved you.";
        } else {
          endGame(false);
        }
        ghostMesh.visibility = 0;
      }, 4000);
    }

    function endGame(won) {
      engine.stopRenderLoop();
      const msg = won ? "✅ You correctly identified the ghost!" : "☠️ You died.";
      document.getElementById("hud").innerHTML = `${msg}<br><br><button onclick="location.reload()">Start New Game</button>`;
    }

    // ============================
    // GHOST GUESSING INTERFACE
    // ============================

    function showGuessPopup() {
      const modal = document.createElement("div");
      modal.style.position = "absolute";
      modal.style.top = "10%";
      modal.style.left = "10%";
      modal.style.width = "80%";
      modal.style.height = "80%";
      modal.style.background = "#000";
      modal.style.color = "#fff";
      modal.style.padding = "20px";
      modal.style.zIndex = "9999";
      modal.style.overflowY = "scroll";

      modal.innerHTML = `<h2>Which ghost do you think it is?</h2>`;

      Object.keys(ghostProfiles).forEach(ghost => {
        const btn = document.createElement("button");
        btn.textContent = ghost;
        btn.style.margin = "4px";
        btn.onclick = () => {
          if (ghost === gameState.ghostType) {
            endGame(true);
          } else {
            endGame(false);
          }
        };
        modal.appendChild(btn);
      });

      const closeBtn = document.createElement("button");
      closeBtn.innerText = "Cancel";
      closeBtn.style.display = "block";
      closeBtn.style.marginTop = "20px";
      closeBtn.onclick = () => modal.remove();

      modal.appendChild(closeBtn);
      document.body.appendChild(modal);
    }

    document.addEventListener("keydown", e => {
      if (e.key === "g") showGuessPopup();
    });

    // Call a ghost event every 10 seconds
    setInterval(randomGhostEvent, 10000);

  }); // End of createScene
  window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
