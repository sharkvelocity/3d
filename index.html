<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PhasmaPhoney — Build</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />

<!-- ========== Babylon core + loaders ========== -->
<script src="./cdn/babylon.js"></script>
<script src="./cdn/havok/HavokPhysics_umd.js"></script>
<script src="./cdn/earcut.min.js"></script>
<script src="./cdn/materialsLibrary/babylonjs.materials.min.js"></script>
<script src="./cdn/materialsLibrary/babylon.skyMaterial.min.js"></script>
<script src="./cdn/meshopt_decoder.js"></script>
<script src="./cdn/draco_decoder_gltf.js"></script>
<script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
<script src="./cdn/gui/babylon.gui.min.js"></script>
<script src="./cdn/inspector/babylon.inspector.bundle.js"></script>

<style>
html, body { margin:0; height:100%; width:100%; background:#000; overflow:hidden; font-family:monospace; color:#0ff; touch-action:none; }
#renderCanvas { width:100vw; height:100vh; display:block; background:#000; outline:none; }
#loading-box{ position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(0,0,0,0.92); z-index:2147483000; color:#9ef; }
#loading-logo{ width:240px; max-width:60vw; opacity:0.95; filter:drop-shadow(0 0 10px #0ff4); }
#loading-text{ font-size:16px; letter-spacing:.3px; text-align:center; max-width:70vw; }
#loading-bar{ width:64vw; max-width:720px; height:14px; border:1px solid #066; border-radius:10px; background:#071017; overflow:hidden; }
#loading-fill{ height:100%; width:0%; background:linear-gradient(90deg,#19f,#0ff); transition:width .15s ease; }

#title-screen{ position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:9999; }
#title-logo{ max-width:60vw; max-height:35vh; object-fit:contain; }
#start-button{ padding:14px 28px; font-size:22px; cursor:pointer; border:2px solid #0ff; color:#0ff; background:#111; }

#hud-overlay{ position:fixed; inset:0; pointer-events:none; z-index:6000; }
#hud-bar{ position:fixed; top:10px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:6000; }
.chip { padding:2px 6px; border:1px solid #066; border-radius:6px; color:#aff; font-size:12px; background:rgba(0,0,0,0.5); }
.sanity-wrap{ display:flex; align-items:center; gap:6px; padding:0 6px; }
#sanity-gauge{ width:170px; height:10px; border:1px solid #066; background:#061013; border-radius:8px; overflow:hidden; }
#sanity-fill{ width:100%; height:100%; background:linear-gradient(90deg,#19f,#0ff); transition:width .25s ease; }
#sanity-text{ margin-left:6px; }
#hud-xyz { position:fixed; top:36px; right:12px; background:rgba(0,0,0,0.5); border:1px solid #066; padding:6px 8px; color:#0ff; font:12px monospace; z-index:6000; }
#pause-menu {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 12000;
}
#pause-content {
  background: #111;
  padding: 24px 32px;
  border: 2px solid #0ff;
  border-radius: 12px;
  color: #0ff;
  display: flex;
  flex-direction: column;
  gap: 14px;
  text-align: center;
}
#pause-content h2 { margin: 0 0 12px; font-size: 26px; }
#pause-content button {
  padding: 10px 18px;
  font-size: 18px;
  border: 1px solid #0ff;
  background: #000;
  color: #0ff;
  cursor: pointer;
}
#pause-content button:hover {
  background: #033;
}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-box" aria-live="polite">
  <img src="logo.png" alt="Logo" id="loading-logo">
  <div id="loading-text">Initializing…</div>
  <div id="loading-bar"><div id="loading-fill"></div></div>
</div>

<!-- Title / Start -->
<div id="title-screen">
  <img id="title-logo" src="./logo.png" alt="PhasmaPhoney Logo" />
  <button id="start-button">Start Investigation</button>
  <div id="map-wrap">
    <span>Map:</span>
    <select id="map-select"><option value="-1">(loading maps...)</option></select>
  </div>
</div>

<!-- Canvas -->
<canvas id="renderCanvas" tabindex="0"></canvas>

<!-- HUD Overlay -->
<div id="hud-overlay">
  <div id="hud-bar">
    <div class="chip sanity-wrap">
      <span>Sanity:</span>
      <div id="sanity-gauge"><div id="sanity-fill"></div></div>
      <span id="sanity-text">100%</span>
    </div>
    <div class="chip">Weather: <span id="hud-weather">Clear</span></div>
    <div class="chip">Temp: <span id="hud-temp">20°C</span></div>
  </div>
  <div id="hud-xyz">XYZ: <span id="hud-pos">0,0,0</span></div>
</div>

<!-- ===================== SCRIPTS ===================== -->
<!-- Utilities (order matters) -->
<script src="./assets/dev/util/pointer_lock_manager.js"></script>
<script src="./assets/dev/util/pp_runtime.js"></script>
<script src="./assets/dev/util/modular_settings.js"></script>

<!-- Unified environment & audio. NOTE: this file is intentionally passive; it initializes audio after the first interaction / start event. -->
<script src="./assets/dev/util/env_and_sound.js"></script>

<script src="./assets/dev/util/moon.js"></script>

<script src="./assets/dev/modular_bindings.js"></script>
<script src="./assets/dev/util/minimap_northup_xyz.js"></script>
<script src="./assets/dev/util/reticle.js"></script>
<script src="./assets/dev/util/ghost_dev.js"></script>
<script src="./assets/dev/util/ghost_cam.js"></script>

<!-- Map generators / managers (must exist before bootstrap start) -->
<script src="./assets/models/map/map_generator.js"></script>
<script src="./assets/models/map/prohouse_generator.js"></script>
<script src="./assets/models/map/map_manager.js"></script>

<!-- Game core -->
<script src="./assets/dev/game/inventory_system.js"></script>
<script src="./assets/dev/ui/belt_manager.js"></script>
<script src="./assets/dev/ui/van_ui.js"></script>
<script src="./assets/dev/effects/effects_sanity_med.js"></script>

<!-- Tools / UI -->
<script src="./assets/dev/ui/notebook_ui.js"></script>
<script src="./assets/dev/tools/uv_prints.js"></script>
<script src="./assets/dev/tools/salt_system.js"></script>
<script src="./assets/dev/tools/spirit_box.js"></script>
<script src="./assets/dev/tools/dots_system.js"></script>

<!-- Bootstrap + patches (bootstrap wires start button and manifest) -->
<script src="./assets/dev/game/bootstrap.js"></script>
<script src="./assets/dev/merge_patch.js"></script>
<script src="./assets/dev/glue_patch.js"></script>

<!-- Small HUD bindings (keeps index small) -->
<script>
(function(){
  const sanityFill = document.getElementById("sanity-fill");
  const sanityText = document.getElementById("sanity-text");
  const hudPos = document.getElementById("hud-pos");
  const hudWeather = document.getElementById("hud-weather");
  const hudTemp = document.getElementById("hud-temp");

  window.updateSanity = function(value){
    const clamped = Math.max(0, Math.min(100, value));
    if(sanityFill) sanityFill.style.width = clamped+"%";
    if(sanityFill) sanityFill.style.background = clamped>50?"#0f0":(clamped>25?"#ff0":"#f00");
    if(sanityText) sanityText.textContent = clamped+"%";
  };

  window.updatePlayerPos = function(x,y,z){
    if(hudPos) hudPos.textContent = x.toFixed(1)+","+y.toFixed(1)+","+z.toFixed(1);
  };

  window.updateWeather = function(type,temp){
    if(hudWeather) hudWeather.textContent = type;
    if(hudTemp) hudTemp.textContent = (typeof temp === 'number' ? temp + "°C" : (temp || ""));
    // bridge to EnvAndSound / Weather if available
    if(window.EnvAndSound && typeof EnvAndSound.setWeather === 'function'){
      const mapState = (type === "Rain") ? "Rainstorm" : (type === "BloodMoon" ? "Bloodmoon" : (type === "Snow" ? "Snow" : "Clear"));
      try{ EnvAndSound.setWeather(mapState, { immediate:true }); }catch(e){ console.warn("EnvAndSound.setWeather failed",e); }
    } else if(window.Weather && typeof Weather.set === 'function'){
      try{ Weather.set(type, { immediate:true }); }catch(e){ console.warn("Weather.set failed",e); }
    }
  };
(function(){
  let isPaused = false;
  const pauseMenu = document.getElementById("pause-menu");
  const resumeBtn = document.getElementById("resume-btn");
  const quitBtn = document.getElementById("quit-btn");

  // toggle pause
  function setPaused(p){
    isPaused = p;
    if(isPaused){
      pauseMenu.style.display = "flex";
      if(window.scene && window.scene.getEngine){
        try{ window.scene.getEngine().stopRenderLoop(); }catch(e){}
      }
      // release mouse
      if(document.exitPointerLock) document.exitPointerLock();
    } else {
      pauseMenu.style.display = "none";
      if(window.scene && window.scene.getEngine){
        try{ window.scene.getEngine().runRenderLoop(()=>window.scene.render()); }catch(e){}
      }
      // re-lock mouse if player was using pointer lock
      const canvas = document.getElementById("renderCanvas");
      if(canvas && canvas.requestPointerLock) canvas.requestPointerLock();
    }
  }

  // key binding
  window.addEventListener("keydown", (ev)=>{
    if(ev.code === "Escape"){
      setPaused(!isPaused);
    }
  });

  // buttons
  resumeBtn.addEventListener("click", ()=>setPaused(false));
  quitBtn.addEventListener("click", ()=>{ 
    alert("Quit to main menu (implement redirect here)."); 
  });
})();
  // default display values
  setTimeout(()=>{ window.updateSanity(100); window.updateWeather("Clear",20); },0);
})();
</script>
<!-- Pause Menu -->
<div id="pause-menu">
  <div id="pause-content">
    <h2>Paused</h2>
    <button id="resume-btn">Resume</button>
    <button id="settings-btn">Settings</button>
    <button id="quit-btn">Quit</button>
  </div>
</div>

</body>
</html>
