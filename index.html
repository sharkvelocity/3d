<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phasma‑Phoney 3D</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: black;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #touch-controls {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 20;
    }
    #touch-controls button {
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 20px;
      margin: 2px;
      width: 50px; height: 50px;
      border: 1px solid white;
      border-radius: 6px;
    }
    #hud {
      position: absolute;
      top: 10px; left: 10px;
      color: white;
      font-family: monospace;
      font-size: 14px;
      background: rgba(0,0,0,0.4);
      padding: 8px;
      border-radius: 6px;
      z-index: 50;
    }
    #item-bar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 30;
    }
    .item-slot {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.15);
      border: 2px solid white;
      border-radius: 8px;
    }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">Sanity: 100%</div>
  <div id="item-bar">
    <div class="item-slot" id="slot1"></div>
    <div class="item-slot" id="slot2"></div>
    <div class="item-slot" id="slot3"></div>
    <div class="item-slot" id="slot4">🔥</div>
    <div class="item-slot" id="slot5">📓</div>
  </div>
  <div id="touch-controls">
    <button onclick="move('up')">↑</button><br>
    <button onclick="move('left')">←</button>
    <button onclick="move('down')">↓</button>
    <button onclick="move('right')">→</button>
  </div>
  <div id="inventory-bar">
  <div class="inv-slot" onclick="useItem(0)"></div>
  <div class="inv-slot" onclick="useItem(1)"></div>
  <div class="inv-slot" onclick="useItem(2)"></div>
  <div class="inv-slot" id="inv-lighter">Lighter</div>
  <div class="inv-slot" id="inv-journal">Notebook</div>
</div>

<style>
#inventory-bar {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; font-family: monospace;
  background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 6px;
}
.inv-slot {
  min-width: 60px; padding: 4px 8px; background: #222; color: white;
  border: 1px solid #888; cursor: pointer; text-align: center;
}
</style>

<script>
  let canvas = document.getElementById("renderCanvas");
  let engine = new BABYLON.Engine(canvas, true);
  let scene, camera, player, isThirdPerson = false;
  let ghostEntity, ghostRoom = "", ghostVisible = false;

  const ghostProfiles = {
    Spirit: { name: "Spirit", abilities: ["standard"], clues: [] },
    Wraith: { name: "Wraith", abilities: ["noFootsteps", "teleport"], clues: ["no salt footprints"] },
    Phantom: { name: "Phantom", abilities: ["drainSanityOnView", "disappearOnPhoto"], clues: ["disappears when photographed"] },
    Poltergeist: { name: "Poltergeist", abilities: ["objectThrow", "multiThrow"], clues: ["throws multiple items at once"] },
    Banshee: { name: "Banshee", abilities: ["targetSinglePlayer", "screamSound"], clues: ["parabolic mic reveals scream"] },
    Jinn: { name: "Jinn", abilities: ["powerBoost", "fastIfPlayerFar"], clues: ["hunts faster with power on"] },
    Mare: {
      name: "Mare", abilities: ["darkHunts", "lightSwitchFlip", "roamer"],
      clues: ["turns off lights", "switches to dark rooms"]
    },
    Revenant: { name: "Revenant", abilities: ["slowWhenHidden", "fastWhenSeen"], clues: ["slow when hiding"] },
    Shade: { name: "Shade", abilities: ["shy", "noHuntWhenPlayersNearby"], clues: ["never hunts when player is near"] },
    Demon: { name: "Demon", abilities: ["earlyHunt", "veryAggressive"], clues: ["hunts early regardless of sanity"] },
    Yurei: { name: "Yurei", abilities: ["sanityDrain", "roomLockAfterSmudge"], clues: ["room locked after smudge"] },
    Oni: { name: "Oni", abilities: ["visibleMore", "fastThrow"], clues: ["appears more often"] },
    Yokai: { name: "Yokai", abilities: ["voiceHuntTrigger"], clues: ["hunts when you talk nearby"] },
    Hantu: {
      name: "Hantu", abilities: ["noBreakerRestore", "coldRoamer"],
      clues: ["never uses breaker", "cold mist when roaming"]
    },
    Goryo: { name: "Goryo", abilities: ["onlyOnCam", "stationary"], clues: ["doesn’t roam"] },
    Myling: { name: "Myling", abilities: ["quietFootsteps", "parabolic"], clues: ["quieter while hunting"] },
    Onryo: {
      name: "Onryo", abilities: ["extinguishFire", "flameTriggerHunt"],
      clues: ["extinguishes flames repeatedly"]
    },
    Twins: { name: "Twins", abilities: ["dualEvents", "differentSpeed"], clues: ["events in different rooms"] },
    Raiju: { name: "Raiju", abilities: ["boostedByElectronics"], clues: ["hunts faster with electronics on"] },
    Obake: { name: "Obake", abilities: ["fingerprintChange"], clues: ["6-finger prints, smudged prints"] },
    TheMimic: { name: "The Mimic", abilities: ["mimicOthers", "fakeOrbs"], clues: ["orbs + 3 other evidence types"] },
    Moroi: { name: "Moroi", abilities: ["curseSanity", "slowsWithSmudge"], clues: ["sanity drops fast after talking"] },
    Deogen: { name: "Deogen", abilities: ["knowsLocation", "slowNearPlayer"], clues: ["can’t hide, slow near player"] },
    Thaye: { name: "Thaye", abilities: ["agesOverTime"], clues: ["more active early game, slows later"] },
    Succubus: { name: "Succubus", abilities: ["charm", "drainSanityNearPlayer"], clues: ["drains sanity close range"] }
  };

  let ghost = ghostProfiles["Mare"]; // randomized later

  window.addEventListener("DOMContentLoaded", function () {
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
    scene.fogDensity = 0.02;
    scene.fogColor = new BABYLON.Color3(0.03, 0.03, 0.03);

    // Camera
    camera = new BABYLON.UniversalCamera("playerCam", new BABYLON.Vector3(0, 2, -10), scene);
    camera.attachControl(canvas, true);
    camera.speed = 0.3;
    camera.ellipsoid = new BABYLON.Vector3(1, 1, 1);

    // Toggle third person
    window.addEventListener("keydown", (e) => {
      if (e.key === "v") toggleCamera();
    });

    function toggleCamera() {
      isThirdPerson = !isThirdPerson;
      if (isThirdPerson) {
        camera.position = new BABYLON.Vector3(0, 4, -6);
        camera.setTarget(player || new BABYLON.Vector3(0, 2, 0));
      } else {
        camera.position = new BABYLON.Vector3(0, 2, -10);
      }
    }

    // Lighting
    const hemiLight = new BABYLON.HemisphericLight("hLight", new BABYLON.Vector3(0, 1, 0), scene);
    hemiLight.intensity = 0.4;

    const flickerLight = new BABYLON.PointLight("ghostLight", new BABYLON.Vector3(0, 3, 0), scene);
    flickerLight.diffuse = new BABYLON.Color3(1, 0.8, 0.6);
    flickerLight.intensity = 0.8;

    // Flicker effect on interval
    setInterval(() => {
      if (Math.random() < 0.25 && ghostVisible) {
        flickerLight.intensity = Math.random();
      }
    }, 300);

    // Ground
    const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 50, height: 50}, scene);
    const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
    groundMat.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);
    ground.material = groundMat;

    // Room zone placeholder meshes
    const room1 = BABYLON.MeshBuilder.CreateBox("Room1", {width: 10, height: 5, depth: 10}, scene);
    room1.position = new BABYLON.Vector3(0, 2.5, 0);
    const room2 = BABYLON.MeshBuilder.CreateBox("Room2", {width: 10, height: 5, depth: 10}, scene);
    room2.position = new BABYLON.Vector3(15, 2.5, 0);

    // Ghost entity
    ghostEntity = BABYLON.MeshBuilder.CreateSphere("ghost", {diameter: 2}, scene);
    ghostEntity.position = new BABYLON.Vector3(0, 2.5, 0);
    ghostEntity.isVisible = false;

    engine.runRenderLoop(() => {
      scene.render();
    });
  });
</script>
<script>
  let ghostRoom = "Room1"; // initial ghost room
  let ghostTargetRoom = "Room1";
  let lastMimicTurn = 0;
  let mimicCooldown = getRandomInt(3, 6); // Mimic acts like a new ghost every 3–6 turns
  let currentTurn = 0;
  let ghostBehaviorGhost = ghost.name === "The Mimic" ? getRandomGhost() : ghost;

  function getRandomGhost() {
    const keys = Object.keys(ghostProfiles).filter(name => name !== "The Mimic");
    return ghostProfiles[keys[Math.floor(Math.random() * keys.length)]];
  }

  function switchGhostBehavior() {
    ghostBehaviorGhost = getRandomGhost();
    lastMimicTurn = currentTurn;
    mimicCooldown = getRandomInt(3, 6);
  }

  function moveGhostTo(roomName) {
    const target = scene.getMeshByName(roomName);
    if (target) {
      ghostEntity.position = target.position.add(new BABYLON.Vector3(0, 0, 0));
      ghostRoom = roomName;
    }
  }

  function maybeChangeRoom() {
    // Goryo cannot change rooms
    if (ghost.name === "Goryo") return;

    // 10% chance per turn
    if (Math.random() < 0.1) {
      const options = ["Room1", "Room2"].filter(r => r !== ghostRoom);
      ghostTargetRoom = options[Math.floor(Math.random() * options.length)];
      moveGhostTo(ghostTargetRoom);
    }
  }

  function maybeToggleGhostVisibility() {
    // 20% chance to appear/disappear
    if (Math.random() < 0.2) {
      ghostVisible = !ghostVisible;
      ghostEntity.isVisible = ghostVisible;
    }
  }

  function advanceTurn() {
    currentTurn++;

    // Mimic behavior check
    if (ghost.name === "The Mimic" && currentTurn - lastMimicTurn >= mimicCooldown) {
      switchGhostBehavior();
    }

    maybeChangeRoom();
    maybeToggleGhostVisibility();
    applySanityDrain();

    // Log turn result
    console.log(`Turn ${currentTurn}: ghost=${ghost.name}, room=${ghostRoom}, visible=${ghostVisible}`);
  }

  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
</script>
<script>
  let sanity = 100;
  let inGhostRoom = false;
  let nearGhost = false;
  let flamesNearby = 0; // 0–3
  let isInDarkRoom = false;
  let ghostCanHunt = false;

  function applySanityDrain() {
    // Base sanity drain
    let drain = getRandomInt(2, 5);

    if (inGhostRoom || nearGhost) drain += 5;
    if (ghost.name === "Yurei" && inGhostRoom) drain += 3;
    if (ghost.name === "Onryo" && flamesNearby === 0) drain += 3;
    if (ghost.name === "Mare" && isInDarkRoom) drain += 4;

    sanity -= drain;
    if (sanity < 0) sanity = 0;
    updateSanityUI();
  }

  function updateSanityUI() {
    const el = document.getElementById("sanity-bar");
    if (el) el.textContent = `Sanity: ${Math.floor(sanity)}%`;
  }

  function canTriggerHunt() {
    if (sanity > 20) return false;

    // Ghost cooldown logic (one hunt every 4–6 turns)
    if (ghost.lastHuntTurn !== undefined && currentTurn - ghost.lastHuntTurn < ghost.huntCooldown) return false;

    // Onryo logic
    if (ghost.name === "Onryo") {
      if (flamesNearby >= 3) return true;
      if (flamesNearby > 0) return false;
    }

    // Mare prefers darkness
    if (ghost.name === "Mare" && !isInDarkRoom) return false;

    // Hantu disables breaker more often (optional behavior can be expanded later)

    return true;
  }

  function triggerHunt() {
    if (!canTriggerHunt()) return;

    console.warn("🔥 Hunt triggered!");

    // Save turn + cooldown
    ghost.lastHuntTurn = currentTurn;
    ghost.huntCooldown = getRandomInt(4, 6);

    // Flicker lights
    flickerLights();

    // TODO: Implement death or escape mechanic
  }

  function flickerLights() {
    scene.lights.forEach(light => {
      if (Math.random() < 0.7) {
        light.setEnabled(false);
        setTimeout(() => light.setEnabled(true), 500 + Math.random() * 500);
      }
    });
  }

  function extinguishFlamesNearby() {
    if (ghost.name === "Onryo" && flamesNearby > 0) {
      // Onryo snuffs out flame quickly (within 20 sec of relight)
      setTimeout(() => {
        flamesNearby = 0;
        console.log("💨 Onryo extinguished flame");
      }, getRandomInt(3000, 8000));
    }
  }
</script>
<script>
  const inventory = [null, null, null]; // Player slots 1–3
  const lighter = "Lighter";
  const notebook = "Notebook";
  const placedItems = {}; // { roomName: [item, item...] }
  let currentRoom = "Foyer";
  let vanStorage = ["Candle", "Candle", "Smudge Stick", "Crucifix", "Camera"];

  function updateInventoryUI() {
    const slots = document.querySelectorAll(".inv-slot");
    for (let i = 0; i < 3; i++) {
      slots[i].textContent = inventory[i] || "-";
    }
    document.getElementById("inv-lighter").textContent = lighter;
    document.getElementById("inv-journal").textContent = notebook;
  }

  function pickUpItem(item) {
    const index = inventory.findIndex(x => x === null);
    if (index === -1) return log("Inventory full!");
    inventory[index] = item;
    removeFromRoom(item);
    updateInventoryUI();
  }

  function dropItem(index) {
    const item = inventory[index];
    if (!item) return;
    if (!placedItems[currentRoom]) placedItems[currentRoom] = [];
    placedItems[currentRoom].push(item);
    inventory[index] = null;
    updateInventoryUI();
    if (item === "Candle") {
      detectFlamesNearby();
    }
  }

  function removeFromRoom(item) {
    if (!placedItems[currentRoom]) return;
    const i = placedItems[currentRoom].indexOf(item);
    if (i !== -1) placedItems[currentRoom].splice(i, 1);
  }

  function swapVanItems() {
    // Simple example, rotates first inventory item with first van item
    const invItem = inventory.find(i => i !== null);
    if (!invItem || vanStorage.length === 0) return;
    const vanItem = vanStorage.shift();
    const index = inventory.findIndex(i => i !== null);
    vanStorage.push(invItem);
    inventory[index] = vanItem;
    updateInventoryUI();
  }

  function detectFlamesNearby() {
    let flames = 0;
    if (!placedItems[currentRoom]) return;
    for (let item of placedItems[currentRoom]) {
      if (item === "Candle") flames++;
    }
    flamesNearby = flames;
    extinguishFlamesNearby(); // Onryo
  }

  function useItem(index) {
    const item = inventory[index];
    if (!item) return;

    switch (item) {
      case "Smudge Stick":
        if (ghost.name === "Yurei") {
          ghost.stuckTurns = 5;
          log("Yurei is stuck here for 5 turns.");
        }
        inventory[index] = null;
        break;

      case "Camera":
        log("Photo taken.");
        break;

      case "Crucifix":
        dropItem(index); // Crucifix placed on floor
        break;

      default:
        log("Can't use this now.");
    }

    updateInventoryUI();
  }

  function log(msg) {
    console.log("🧭 " + msg);
  }
</script>
