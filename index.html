<script id="tweakpatch-js">
(function(){
  const log = (...a)=>console.log("[TweakPatch]",...a);

  // ------- Inspector super-topmost lifter
  const liftInspector = () => {
    const insp = document.querySelector(".babylonjsInspector, #inspector-host, .inspector");
    if (insp) {
      insp.style.zIndex = 2147483647;
      insp.style.pointerEvents = "auto";
    }
  };
  const mo = new MutationObserver(liftInspector);
  mo.observe(document.documentElement, {subtree:true, childList:true, attributes:true});
  liftInspector();

  // ------- HUD helpers
  const $ = sel => document.querySelector(sel);
  const hudPL = $("#hud-pl");
  const hudWASD = $("#hud-wasd");
  const hudSprint = $("#hud-sprint");
  const toast = $("#map-toast");

  const keys = { w:false, a:false, s:false, d:false, shift:false };

  const renderHud = () => {
    if (hudPL) hudPL.textContent = (document.pointerLockElement ? "yes" : "no");
    if (hudWASD) hudWASD.textContent = `${keys.w?'W':'-'}${keys.a?'A':'-'}${keys.s?'S':'-'}${keys.d?'D':'-'}`;
    if (hudSprint) hudSprint.textContent = keys.shift ? "on" : "off";
  };

  window.addEventListener("keydown", (e)=>{
    const k = e.key.toLowerCase();
    if (k==='w') keys.w=true;
    if (k==='a') keys.a=true;
    if (k==='s') keys.s=true;
    if (k==='d') keys.d=true;
    if (k==='shift') keys.shift=true;
    renderHud();
  }, true);
  window.addEventListener("keyup", (e)=>{
    const k = e.key.toLowerCase();
    if (k==='w') keys.w=false;
    if (k==='a') keys.a=false;
    if (k==='s') keys.s=false;
    if (k==='d') keys.d=false;
    if (k==='shift') keys.shift=false;
    renderHud();
  }, true);
  document.addEventListener("pointerlockchange", renderHud, true);
  renderHud();

  // ------- Pointer lock helper on canvas
  const tryPointerLock = () => {
    const canvas = document.querySelector("canvas, #renderCanvas, #gameCanvas");
    if (!canvas) return;
    const req = () => {
      if (!document.pointerLockElement) {
        canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock || canvas.webkitRequestPointerLock;
        try { canvas.requestPointerLock && canvas.requestPointerLock(); } catch(e){}
      }
    };
    canvas.addEventListener("click", req);
  };
  tryPointerLock();

  // ------- Map definition loader & spawn enforcement
  async function ensureMapDef(){
    // If MAP_DEF exists, we're good
    if (window.MAP_DEF && window.MAP_DEF.spawn) { return true; }

    // Try common candidates
    const candidates = [
      "./assets/models/map/furnished_house.js",
      "./assets/models/map/fully_furnished.config.js",
      "./assets/models/map/Abandoned_House.js",
      "./assets/models/map/abandoned_house.js",
      "./assets/models/map/furnished_house.config.js"
    ];

    for (const path of candidates){
      try {
        await import(path);
        if (window.MAP_DEF && window.MAP_DEF.spawn) {
          log("Loaded MAP_DEF from", path);
          return true;
        }
      } catch(e){
        // ignore 404s; try next
      }
    }

    // If still missing, toast loudly
    showToast("Map configuration not found. Expected MAP_DEF with spawn/file. Check assets/models/map/ paths.");
    return false;
  }

  function showToast(msg){
    if (!toast) return;
    toast.textContent = msg;
    toast.style.display = "block";
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toast.style.display = "none", 6500);
  }

  // Hook Babylon if available to enforce spawn after scene load
  function enforceSpawn(scene){
    try {
      if (!(window.MAP_DEF && MAP_DEF.spawn)) return;
      const sp = MAP_DEF.spawn;
      const cam = (scene && scene.activeCamera) || null;
      if (cam) {
        cam.position.x = sp.x ?? 0;
        cam.position.y = sp.y ?? 1.8;
        cam.position.z = sp.z ?? 0;
      }
      if (window.player && player.position){
        player.position.set(sp.x ?? 0, sp.y ?? 1.8, sp.z ?? 0);
      }
      log("Spawn enforced:", sp);
    } catch(e){
      log("Spawn enforcement error:", e);
    }
  }

  // Patch Babylon createScene if detectable
  (function hookScene(){
    if (!window.BABYLON){ return; }

    // If there's a global createScene, wrap it
    const g = window;
    const origCreate = g.createScene;
    if (typeof origCreate === "function"){
      g.createScene = async function(){
        await ensureMapDef();
        const sc = await origCreate.apply(this, arguments);
        try {
          sc.executeWhenReady(()=> enforceSpawn(sc));
        } catch{ enforceSpawn(sc); }
        return sc;
      };
      log("Wrapped createScene with spawn enforcement");
    } else {
      // Fallback: try after load
      window.addEventListener("load", async ()=>{
        await ensureMapDef();
        const engineScene = (g.scene || (g._scene && g._scene.scene));
        if (engineScene) enforceSpawn(engineScene);
      });
    }
  })();

  // Expose for debugging
  window.__TweakPatch = { ensureMapDef, enforceSpawn, showToast };
})();
</script>


<script id="tweakpatch-manifest">
(function(){
  const log = (...a)=>console.log("[ManifestPatch]",...a);
  const MAPS_JSON_PATH = "./assets/models/map/maps.json";
  const $ = (s)=>document.querySelector(s);

  // Normalize various manifest shapes into: [{name, config, glb}]
  async function loadMapsManifest(){
    try{
      const res = await fetch(MAPS_JSON_PATH, {cache:"no-cache"});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const data = await res.json();
      let list = [];

      if(Array.isArray(data)){
        // Could be array of strings or objects
        list = data.map((item)=>{
          if(typeof item === "string"){
            // Try to infer name + config from filename-ish
            const base = item.replace(/^\.?\/*/,"");
            const name = base.split("/").pop().replace(/\.(config\.)?js$/i,"").replace(/_/g," ").replace(/\b\w/g, c=>c.toUpperCase());
            return { name, config: "./assets/models/map/" + base, glb: null };
          } else if (item && typeof item === "object") {
            // Expect keys like {name, config, glb}
            const name = item.name || (item.config||item.path||item.file||"map").split("/").pop().replace(/\.(config\.)?js$/i,"");
            return {
              name,
              config: item.config || item.path || item.file || null,
              glb: item.glb || item.model || null
            };
          }
          return null;
        }).filter(Boolean);
      } else if (data && typeof data === "object"){
        // Maybe keyed object { "Abandoned House": {config:"...", glb:"..."} }
        list = Object.keys(data).map((k)=>{
          const v = data[k]||{};
          return { name: k, config: v.config || v.path || v.file || null, glb: v.glb || v.model || null };
        });
      }

      // Fallback: if empty, try to hardcode known files in repo
      if(!list.length){
        list = [
          { name:"Abandoned House", config:"./assets/models/map/Abandoned_House.js", glb:"./assets/models/map/Abandoned_House.glb" },
          { name:"Furnished House", config:"./assets/models/map/furnished_house.config.js", glb:"./assets/models/map/furnished_house.glb" },
        ];
      }

      // Normalize paths to start with ./ if they look relative
      list = list.map(m=>{
        const norm = {...m};
        if (typeof norm.config === "string" && !/^https?:\/\//i.test(norm.config)){
          if (!norm.config.startsWith("./") && !norm.config.startsWith("/")) norm.config = "./" + norm.config;
        }
        if (typeof norm.glb === "string" && !/^https?:\/\//i.test(norm.glb)){
          if (!norm.glb.startsWith("./") && !norm.glb.startsWith("/")) norm.glb = "./" + norm.glb;
        }
        return norm;
      });

      log("Loaded maps.json:", list);
      return list;
    }catch(e){
      console.warn("maps.json load failed:", e);
      // Fallback to known present files in your repo:
      const list = [
        { name:"Abandoned House", config:"./assets/models/map/Abandoned_House.js", glb:"./assets/models/map/Abandoned_House.glb" },
        { name:"Furnished House", config:"./assets/models/map/furnished_house.config.js", glb:"./assets/models/map/furnished_house.glb" },
      ];
      // Try to toast via TweakPatch if available
      if (window.__TweakPatch && __TweakPatch.showToast) __TweakPatch.showToast("maps.json missing; using fallback list.");
      return list;
    }
  }

  function getSelectedMapName(){
    const sel = $("#mapSelect") || $("#map-select") || $("select[name='map']");
    if (sel && sel.value) return sel.value;
    // Try data attr on start button
    const btn = document.getElementById("startBtn") || document.getElementById("start-investigation");
    if (btn && btn.dataset && btn.dataset.map) return btn.dataset.map;
    return null;
  }

  async function populateDropdown(list){
    let sel = $("#mapSelect") || $("#map-select") || $("select[name='map']");
    if (!sel){
      // Create one near the Start button if not present
      const btn = document.getElementById("startBtn") || document.getElementById("start-investigation");
      sel = document.createElement("select");
      sel.id = "mapSelect";
      sel.style.cssText = "position:relative; margin-top:12px;";
      if (btn && btn.parentElement) btn.parentElement.appendChild(sel);
      else document.body.appendChild(sel);
    }
    sel.innerHTML = "";
    for (const m of list){
      const opt = document.createElement("option");
      opt.value = m.name;
      opt.textContent = m.name;
      sel.appendChild(opt);
    }
  }

  function resolveConfigFor(name, list){
    if (!name && list.length) return list[0].config;
    const found = list.find(m=> (m.name||"").toLowerCase() === (name||"").toLowerCase());
    return found ? found.config : (list[0] ? list[0].config : null);
  }

  async function ensureMapDefFromManifest(){
    const list = await loadMapsManifest();
    try { await populateDropdown(list); } catch(e){}
    const chosen = getSelectedMapName();
    const cfg = resolveConfigFor(chosen, list);
    if (!cfg){
      if (window.__TweakPatch && __TweakPatch.showToast) __TweakPatch.showToast("No map config found in manifest.");
      return false;
    }
    try{
      await import(cfg);
      if (window.MAP_DEF && MAP_DEF.spawn){
        if (window.__TweakPatch && __TweakPatch.showToast) __TweakPatch.showToast("Loaded map: " + (chosen || MAP_DEF.title || "Map"));
        return true;
      }
    }catch(e){
      console.warn("import failed for", cfg, e);
    }
    if (window.__TweakPatch && __TweakPatch.showToast) __TweakPatch.showToast("Failed to load map config: " + cfg);
    return false;
  }

  // If previous TweakPatch exists, override its ensureMapDef to use manifest
  function patchEnsure(){
    if (window.__TweakPatch){
      window.__TweakPatch.ensureMapDef = ensureMapDefFromManifest;
    }
    // Also override any global helper used earlier
    window.ensureMapDef = ensureMapDefFromManifest;
  }

  // Run ASAP
  patchEnsure();
  // Try load early to populate UI
  document.addEventListener("DOMContentLoaded", ()=>{ ensureMapDefFromManifest(); }, {once:true});
})();
</script>


<script id="tweakpatch-manifest-hotfix">
(function(){
  const log = (...a)=>console.log("[ManifestHotfix]",...a);
  const fixRepoPath = (p)=>{
    if (typeof p !== "string") return p;
    // normalize ./assets/map/* -> ./assets/models/map/*
    return p.replace(/^\.\/assets\/map\//i, "./assets/models/map/");
  };
  const ensureGlbMapDef = async (entry)=>{
    // Accepts entry with .glb; tries sibling config, else synthesize MAP_DEF
    if (!entry) return false;
    const glb = fixRepoPath(entry.glb || entry.file || entry.model || entry.path || entry.config);
    if (!glb || !/\.glb(\?.*)?$/i.test(glb)) return false;

    // Try sibling config first
    const base = glb.replace(/\.glb(\?.*)?$/i, "");
    const candidates = [base + ".config.js", base + ".js"];
    for (const c of candidates){
      try {
        const cfg = fixRepoPath(c);
        await import(cfg);
        if (window.MAP_DEF && MAP_DEF.file) {
          log("Loaded sibling config:", cfg);
          return true;
        }
      } catch(e){ /* try next */ }
    }

    // Synthesize a minimal MAP_DEF
    window.MAP_DEF = {
      title: entry.name || "Map",
      file: glb,
      scale: 1.0,
      rotationY: 0,
      offset: {x:0,y:0,z:0},
      spawn: {x:-46.18,y:1.35,z:-105.50},
      exteriorMode: "exterior",
      exterior: []
    };
    log("Synthesized MAP_DEF from GLB:", MAP_DEF);
    if (window.__TweakPatch && __TweakPatch.showToast){
      __TweakPatch.showToast("Using GLB-only map (no config). Spawn set to origin.");
    }
    return true;
  };

  // Override resolver to handle bad/GLB configs & path rewrites
  function overrideResolver(){
    const oldEnsure = window.ensureMapDef || (window.__TweakPatch && __TweakPatch.ensureMapDef);
    async function ensure(){
      // Try original ensure if present
      if (typeof oldEnsure === "function"){
        try{
          const ok = await oldEnsure();
          if (ok) return true;
        }catch(e){ /* fall through */ }
      }
      // Pull last list cached by original patch if available
      const patch = window.__ManifestPatchCache;
      const list = patch && patch.list ? patch.list : null;

      // If we have a bad 'config' like a .glb or wrong path, try to fix
      if (list && list.length){
        // If a selected map exists, use it; else try each until success
        const sel = (function(){
          const s = document.querySelector("#mapSelect, #map-select, select[name='map']");
          return s ? s.value : null;
        })();
        const ordered = sel ?
          list.sort((a,b)=> (a.name===sel?-1:0) - (b.name===sel?-1:0)) :
          list;

        for (const entry of ordered){
          // Fix paths
          if (entry.config) entry.config = fixRepoPath(entry.config);
          if (entry.glb) entry.glb = fixRepoPath(entry.glb);

          try{
            if (entry.config && /\.js(\?.*)?$/i.test(entry.config)){
              await import(entry.config);
              if (window.MAP_DEF && MAP_DEF.file) {
                return true;
              }
            }
          } catch(e){
            // If config import fails, try GLB path-based synth
            const ok = await ensureGlbMapDef(entry);
            if (ok) return true;
          }
          // If no config given, try GLB synth
          if (!entry.config){
            const ok = await ensureGlbMapDef(entry);
            if (ok) return true;
          }
        }
      }
      return !!(window.MAP_DEF && MAP_DEF.file);
    }

    window.ensureMapDef = ensure;
    if (window.__TweakPatch) window.__TweakPatch.ensureMapDef = ensure;
  }

  // Cache manifest list when loaded by earlier patch
  (function hookManifestCache(){
    const orig = window.fetch;
    window.fetch = async function(){
      const res = await orig.apply(this, arguments);
      try {
        const url = String(arguments[0]);
        if (url.includes("/assets/models/map/maps.json")){
          const clone = res.clone();
          clone.json().then(data => {
            window.__ManifestPatchCache = window.__ManifestPatchCache || {};
            // Normalize to array of entries {name, config, glb}
            const arr = Array.isArray(data) ? data : Object.keys(data||{}).map(k => ({ name:k, ...(data[k]||{}) }));
            window.__ManifestPatchCache.list = arr;
          }).catch(()=>{});
        }
      } catch(e){}
      return res;
    };
  })();

  overrideResolver();
})();
</script>


<!-- ===== Back-to-Land Helper (non-destructive) =============================== -->
<script>
(function(){
  if (window.__BACK_TO_LAND) return;
  function toast(msg){
    try{ (window.__TweakPatch && __TweakPatch.showToast) ? __TweakPatch.showToast(msg) : console.log("[BackToLand]", msg); }catch(e){}
  }
  function sceneRef(){ return window.scene || (window.engine && engine.scenes && engine.scenes[0]) || null; }
  function camRef(sc){ return (sc && sc.activeCamera) || null; }
  function bboxOf(meshes){
    const b = {minX:Infinity,minY:Infinity,minZ:Infinity,maxX:-Infinity,maxY:-Infinity,maxZ:-Infinity};
    for(const m of meshes){
      if(!m || !m.getBoundingInfo) continue;
      const bi = m.getBoundingInfo(); if(!bi) continue;
      const bb = bi.boundingBox;
      const vmin = bb.minimumWorld, vmax = bb.maximumWorld;
      if(!vmin || !vmax) continue;
      b.minX = Math.min(b.minX, vmin.x); b.maxX = Math.max(b.maxX, vmax.x);
      b.minY = Math.min(b.minY, vmin.y); b.maxY = Math.max(b.maxY, vmax.y);
      b.minZ = Math.min(b.minZ, vmin.z); b.maxZ = Math.max(b.maxZ, vmax.z);
    }
    return b;
  }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  async function backToLand(opts={}){
    const sc = sceneRef();
    const cam = camRef(sc);
    if(!sc || !cam){ console.warn("[BackToLand] no scene/camera yet"); return false; }

    // Candidate meshes: prefer houseRoot if present
    const meshes = (window.houseRoot && window.houseRoot.getChildMeshes ? window.houseRoot.getChildMeshes(false) : sc.meshes) || sc.meshes;
    const bb = bboxOf(meshes);
    const cx = (bb.minX + bb.maxX)/2, cz = (bb.minZ + bb.maxZ)/2;
    // Start from above the whole scene
    const startY = (bb.maxY || cam.position.y || 10) + 200;
    const rayLen = Math.max(1000, (bb.maxY - bb.minY) + 400);

    function cast(x,z){
      const from = new BABYLON.Vector3(x, startY, z);
      const ray  = new BABYLON.Ray(from, new BABYLON.Vector3(0,-1,0), rayLen);
      const pick = sc.pickWithRay(ray, m => m && m.isPickable !== false);
      return pick && pick.hit ? pick.pickedPoint : null;
    }

    // Try center, then a small spiral search
    const offsets = [[0,0],[4,0],[-4,0],[0,4],[0,-4],[6,6],[-6,6],[6,-6],[-6,-6],[10,0],[0,10],[-10,0],[0,-10]];
    let hit = null;
    for(const [ox,oz] of offsets){
      hit = cast(cx+ox, cz+oz);
      if(hit) break;
    }
    if(!hit){
      toast("Couldn't find ground by raycast; using bbox floor.");
      hit = new BABYLON.Vector3(cx, bb.minY, cz);
    }

    // Place camera/player slightly above ground
    const y = hit.y + (opts.eye || 1.8);
    const pos = new BABYLON.Vector3(hit.x, y, hit.z);
    if (cam && cam.position && cam.position.copyFrom) cam.position.copyFrom(pos);
    if (window.player && player.position && player.position.copyFrom) player.position.copyFrom(pos);

    // Safety: enable collisions/gravity if available
    try {
      sc.gravity = sc.gravity || new BABYLON.Vector3(0,-9.81,0);
      sc.collisionsEnabled = true;
      if (cam && "applyGravity" in cam) cam.applyGravity = true;
      if (cam && "checkCollisions" in cam) cam.checkCollisions = true;
    } catch(e){}

    toast("Back on land ✔");
    return true;
  }

  window.backToLand = backToLand;
  window.__BACK_TO_LAND = true;

  // Hotkey: press "L" to snap to ground
  window.addEventListener("keydown", (e)=>{
    if((e.key||"").toLowerCase() === "l"){ backToLand(); }
  });

  // Auto-run once the scene & camera are alive
  function tryAuto(){
    const sc = sceneRef(), cam = camRef(sc);
    if (sc && cam){ backToLand(); return true; }
    return false;
  }
  let tries = 0;
  const iv = setInterval(()=>{ if (tryAuto() || ++tries > 40) clearInterval(iv); }, 500);
})();

<script id="glbviewer-script">
(function(){
  if (window.__GLB_VIEWER__) return;
  window.__GLB_VIEWER__ = true;

  const el = (id)=>document.getElementById(id);
  const overlay = el("gv-overlay");
  const modal   = el("gv-modal");
  const btn     = el("gv-btn");
  const urlIn   = el("gv-url");
  const loadBtn = el("gv-load-url");
  const fileIn  = el("gv-file");
  const closeBtn= el("gv-close");
  const canvas  = el("gv-canvas");
  const dropHint= el("gv-drop-hint");

  const DEFAULT_URL = "./assets/models/map/Abandoned_House.glb"; // change if you like

  let engine = null, scene = null, resizeObs = null, currentUrl = null, currentBlobUrl = null, shadowGen = null;

  function openViewer(){
    overlay.hidden = false;
    if (!engine){
      engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true });
      scene  = buildScene(engine);
      startRenderLoop();
      const u = (urlIn.value && urlIn.value.trim()) || DEFAULT_URL;
      loadModel(u);
    }
  }
  function closeViewer(){
    overlay.hidden = true;
    stopRenderLoop();
    if (scene){ scene.dispose(); scene = null; }
    if (engine){ engine.dispose(); engine = null; }
    if (currentBlobUrl){ URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
  }
  function startRenderLoop(){
    if (!engine || !scene) return;
    engine.runRenderLoop(()=>{ if (scene.activeCamera) scene.render(); });
    resizeObs = ()=>{ engine.resize(); };
    window.addEventListener("resize", resizeObs);
  }
  function stopRenderLoop(){
    window.removeEventListener("resize", resizeObs || (()=>{}));
    if (engine){ engine.stopRenderLoop(); }
  }

  function buildScene(engine){
    const sc = new BABYLON.Scene(engine);
    sc.useRightHandedSystem = false;
    sc.clearColor = new BABYLON.Color4(0,0,0,1);

    const cam = new BABYLON.ArcRotateCamera("gvCam", Math.PI/2, Math.PI/3, 8, BABYLON.Vector3.Zero(), sc);
    cam.attachControl(canvas, true);
    cam.wheelPrecision = 50;
    cam.panningSensibility = 800;
    cam.minZ = 0.02;

    new BABYLON.HemisphericLight("h", new BABYLON.Vector3(0.2, 1, -0.2), sc);
    const dir = new BABYLON.DirectionalLight("d", new BABYLON.Vector3(-0.4,-1,0.2), sc);
    shadowGen = new BABYLON.ShadowGenerator(2048, dir);
    shadowGen.useExponentialShadowMap = true;

    sc.createDefaultEnvironment({
      createGround:true, groundSize: 30, groundColor: BABYLON.Color3.FromHexString("#0b0f12"),
      skyboxSize: 60, enableGroundShadow:true
    });

    return sc;
  }

  async function loadModel(url){
    try{
      let src = url;
      if (url instanceof File){
        if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
        src = currentBlobUrl = URL.createObjectURL(url);
      }
      currentUrl = src;

      if (!scene) return;
      const before = [...scene.meshes];

      const result = await BABYLON.SceneLoader.ImportMeshAsync("", "", src, scene);

      const newMeshes = scene.meshes.filter(m => !before.includes(m));

      const bb = getSceneBounds(newMeshes);
      const center = new BABYLON.Vector3((bb.min.x+bb.max.x)/2, (bb.min.y+bb.max.y)/2, (bb.min.z+bb.max.z)/2);
      const size   = bb.max.subtract(bb.min);
      const radius = Math.max(size.x, size.y, size.z) * 0.6 + 0.01;
      const cam = scene.activeCamera;
      if (cam && cam.setTarget){
        cam.setTarget(center);
        if (cam.radius !== undefined) cam.radius = Math.max(3, radius);
        cam.lowerRadiusLimit = 0.1;
      }

      scene.meshes.forEach(m=>{ try{ m.receiveShadows = true; shadowGen?.addShadowCaster(m); }catch(e){} });

    }catch(e){
      console.error("[GLB Viewer] Failed to load model:", e);
      alert("Failed to load model.\nCheck the console for details.");
    }
  }

  function getSceneBounds(meshes){
    const inf = 1e9;
    const b = { min: new BABYLON.Vector3( inf, inf, inf), max: new BABYLON.Vector3(-inf,-inf,-inf) };
    const arr = meshes && meshes.length ? meshes : (scene ? scene.meshes : []);
    for (const m of arr){
      const bi = m.getBoundingInfo?.();
      if (!bi) continue;
      const bb = bi.boundingBox;
      const min = bb.minimumWorld, max = bb.maximumWorld;
      if (!min || !max) continue;
      b.min.x = Math.min(b.min.x, min.x); b.min.y = Math.min(b.min.y, min.y); b.min.z = Math.min(b.min.z, min.z);
      b.max.x = Math.max(b.max.x, max.x); b.max.y = Math.max(b.max.y, max.y); b.max.z = Math.max(b.max.z, max.z);
    }
    if (!isFinite(b.min.x)) { b.min.set(-1,-1,-1); b.max.set(1,1,1); }
    return b;
  }

  // --- UI hooks
  document.getElementById("gv-btn")?.addEventListener("click", openViewer);
  document.getElementById("gv-close")?.addEventListener("click", closeViewer);
  document.getElementById("gv-load-url")?.addEventListener("click", ()=>{
    const u = (document.getElementById("gv-url")?.value || "").trim() || DEFAULT_URL;
    loadModel(u);
  });
  document.getElementById("gv-file")?.addEventListener("change", (e)=>{
    const f = e.target.files && e.target.files[0]; if (f) loadModel(f);
  });

  ["dragenter","dragover"].forEach(t=>{
    document.getElementById("gv-modal")?.addEventListener(t, (ev)=>{ ev.preventDefault(); document.getElementById("gv-modal")?.classList.add("dragover"); });
  });
  ["dragleave","drop"].forEach(t=>{
    document.getElementById("gv-modal")?.addEventListener(t, (ev)=>{ ev.preventDefault(); document.getElementById("gv-modal")?.classList.remove("dragover"); });
  });
  document.getElementById("gv-modal")?.addEventListener("drop", (ev)=>{
    const f = ev.dataTransfer?.files?.[0];
    if (f) loadModel(f);
  });

  window.addEventListener("keydown", (e)=>{ if (!document.getElementById("gv-overlay")?.hidden && e.key === "Escape"){ closeViewer(); } });

  window.__openGlbViewer = openViewer;
  window.__loadGlb = loadModel;
})();
</script>

<script id="tp-script">
(function(){
  if (window.__TP__) return;

  const xi = el("tp-x"), yi = el("tp-y"), zi = el("tp-z");
  const cbG = el("tp-ground"), cbP = el("tp-player");
  const teleBtn = el("tp-tele"), closeBtn = el("tp-close");

  function sc(){ return window.scene || (window.engine && engine.scenes && engine.scenes[0]) || null; }
  function cam(){ const s=sc(); return s && s.activeCamera; }

  function toggle(){ box.hidden = !box.hidden; if (!box.hidden) xi?.focus(); }
  btn?.addEventListener("click", toggle);
  closeBtn?.addEventListener("click", toggle);
  window.addEventListener("keydown", (e)=>{ if ((e.key||"").toLowerCase()==="t") toggle(); });

  function parsed(v, fallback){ const n = parseFloat(v); return Number.isFinite(n) ? n : fallback; }

  function castDown(x, z, eye=1.8){
    const S = sc(); if (!S) return null;
    // estimate scene bounds
    const meshes = (window.houseRoot && houseRoot.getChildMeshes?.(false)) || S.meshes;
    let maxY=-1e9, minY=1e9;
    for(const m of meshes){
      const bi=m.getBoundingInfo?.(); if(!bi) continue;
      const bb=bi.boundingBox, vmin=bb.minimumWorld, vmax=bb.maximumWorld;
      if(!vmin||!vmax) continue;
      if (vmax.y>maxY) maxY=vmax.y;
      if (vmin.y<minY) minY=vmin.y;
    }
    const startY = (Number.isFinite(maxY)?maxY:10)+200;
    const rayLen  = Math.max(1000, (Number.isFinite(maxY)&&Number.isFinite(minY)? (maxY-minY):100)+400);
    const from = new BABYLON.Vector3(x, startY, z);
    const ray  = new BABYLON.Ray(from, new BABYLON.Vector3(0,-1,0), rayLen);
    const pick = S.pickWithRay(ray, m => m && m.isPickable !== false);
    if (pick && pick.hit) return pick.pickedPoint.y + eye;
    return null;
  }

  function teleportToXYZ(x, y, z, opts={}){
    const S = sc(); const C = cam();
    if (!S || !C) return false;
    let Y = y;
    if (opts.snapGround){
      const gy = castDown(x, z, opts.eye ?? 1.8);
      if (gy != null) Y = gy;
    }
    if (!Number.isFinite(x) || !Number.isFinite(z)) return false;
    if (!Number.isFinite(Y)) Y = (C.position?.y ?? 2);

    const pos = new BABYLON.Vector3(x, Y, z);
    C.position?.copyFrom?.(pos);
    if (opts.movePlayer && window.player?.position) player.position.copyFrom(pos);
    // ensure gravity/collisions
    try{
      S.gravity = S.gravity || new BABYLON.Vector3(0,-9.81,0);
      S.collisionsEnabled = true;
      if ("applyGravity" in C) C.applyGravity = true;
      if ("checkCollisions" in C) C.checkCollisions = true;
    }catch(e){}
    return true;
  }

  function submit(){
    const C = cam(); if(!C) return;
    const x = parsed(xi.value, C.position?.x ?? 0);
    const y = parsed(yi.value, C.position?.y ?? 2);
    const z = parsed(zi.value, C.position?.z ?? 0);
    const ok = teleportToXYZ(x, y, z, { snapGround: cbG.checked, movePlayer: cbP.checked, eye: 1.8 });
    if (!ok) alert("Teleport failed — check your numbers.");
  }

  [xi, yi, zi].forEach(inp => inp?.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); }));
  teleBtn?.addEventListener("click", submit);

  // expose API
  window.teleportToXYZ = (x,y,z,opts)=>teleportToXYZ(x,y,z,opts||{snapGround:true, movePlayer:true});
})();

<script id="inputfix-script">
(function(){
  if (window.__INPUT_FIX__) return; window.__INPUT_FIX__ = true;

  const selCanvas = ()=> document.querySelector("#renderCanvas, #gameCanvas, canvas");
  // Ensure canvas focusability + pointer lock on click
  function armCanvas(){
    const c = selCanvas(); if (!c) return;
    if (!c.hasAttribute("tabindex")) c.setAttribute("tabindex", "0");
    c.style.outline = "none";
    c.addEventListener("click", ()=>{
      try{ c.focus(); }catch(e){}
      if (c.requestPointerLock && !document.pointerLockElement){
        try{ c.requestPointerLock(); }catch(e){}
      }
    }, {capture:true});
  }

  // Robust keyboard hookup (capture-level to beat page scroll)
  const BLOCK_KEYS = new Set(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"," ","space","shift","control"]);
  window.__KEYS = window.__KEYS || Object.create(null);
  function keySet(k, down){
    window.__KEYS[k] = down;
    // Fire a custom event other systems can subscribe to
    document.dispatchEvent(new CustomEvent("pp-key", {detail:{key:k, down, state:window.__KEYS}}));
  }
  function onKey(e){
    const k = (e.key||"").toLowerCase();
    if (!k) return;
    keySet(k, e.type === "keydown");
    const pl = !!document.pointerLockElement;
    if (pl || BLOCK_KEYS.has(k)){
      // prevent the page from scrolling on arrows/space, etc.
      e.preventDefault?.();
      e.stopPropagation?.();
    }
  }
  // capture to ensure we see the event first
  window.addEventListener("keydown", onKey, true);
  window.addEventListener("keyup", onKey, true);
  // Also wire to canvas (some engines attach there)
  setInterval(armCanvas, 800);

  // Prevent scroll-jank
  try {
    document.body.style.overscrollBehavior = "none";
  } catch(e){}

  // -------- Overlay Dominance (mouse vs touch) --------
  function isMobile(){
    // signal true on touch-first or coarse-pointer environments
    const uaM = /Android|iPhone|iPad|iPod|IEMobile|Windows Phone/i.test(navigator.userAgent||"");
    const coarse = matchMedia && matchMedia("(pointer: coarse)").matches;
    const maxTouch = (navigator.maxTouchPoints||0) > 0;
    const uaData = navigator.userAgentData && navigator.userAgentData.mobile;
    return !!(uaM || coarse || maxTouch || uaData);
  }
  const TOUCH_SEL = ["#touchControls", "#joystick", ".touch-overlay", "#touchOverlay", ".on-screen-joystick"];
  const MOUSE_SEL = ["#mouseOverlay", ".mouse-overlay", "#mouse-controls"];
  function qsa(list){ const out=[]; list.forEach(s=> document.querySelectorAll(s).forEach(n=>out.push(n))); return out; }

  function applyOverlayMode(){
    const mobile = isMobile();
    const touch = qsa(TOUCH_SEL);
    const mouse = qsa(MOUSE_SEL);
    if (mobile){
      touch.forEach(n=>{ n.style.display=""; });
      mouse.forEach(n=>{ n.style.display="none"; });
    } else {
      // Non-mobile: mouse overlay is dominant; hide touch overlays
      touch.forEach(n=>{ n.style.display="none"; });
      mouse.forEach(n=>{ n.style.display=""; n.style.zIndex = "2147483500"; });
    }
  }
  applyOverlayMode();
  window.addEventListener("resize", applyOverlayMode);
  // Some SPA setups add overlays later; poll briefly
  let tries=0; const iv=setInterval(()=>{ applyOverlayMode(); if(++tries>20) clearInterval(iv); }, 500);

  // Helpful debug
  console.log("[InputFix] armed; canvas focus + pointer lock + overlay dominance ready.");
})();
</script>

<script>
/* === PhasmaPhoney Inline Patch (no external file) ===========================
   Features:
   - Force spawn to world coords  (47.52, 0.22, -105.28)

   - Anchor rain particles to follow player; sane particle params
   - Ambient/rain audio fallbacks if not already present
   - Minimal notebook overlay if yours is missing (saves to localStorage)
=============================================================================*/
(function(){
  const PATCH = {
    spawnWS: new BABYLON.Vector3(47.52, 0.22, -105.28),
    noCollideHints: ['grass','bush','plant','tree','leaf','foliage','hedge','shrub','vine','flower','weed','debris','paper','trash','wire','rope','fence_wire'],
    rainHints: ['rain','fx_rain','weather_rain']
  };
  function log(...a){ try{ console.log('[PhasmaPatch]', ...a);}catch(e){} }
  function onceReady(scene, fn){ if (scene.isReady()) fn(scene); else scene.executeWhenReady(()=>fn(scene)); }
  function playerNode(scene){
    if (window.player && window.player.position) return window.player;
    return scene.getMeshByName('player') || scene.getTransformNodeByName('player') ||
           scene.getMeshByName('avatar') || scene.getTransformNodeByName('avatar') || null;
  }
  function forceSpawn(scene){
    const p = playerNode(scene);
    if (!p) return log('No player node found; spawn skipped.');
    p.position.copyFrom(PATCH.spawnWS);

    const re = new RegExp('(' + PATCH.noCollideHints.map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')','i');
    let n=0;
    for (const m of scene.meshes){
      if (!m || m === scene.activeCamera) continue;
      if (re.test(m.name)){
        if (m.checkCollisions) { m.checkCollisions = false; n++; }
        m.isPickable = false;
        if (m.physicsImpostor) try{ m.physicsImpostor.dispose(); }catch(e){}
      }

      ps.isLocal = true;
      ps.updateSpeed = 0.02;
      ps.minSize = 0.05; ps.maxSize = 0.15;
      ps.minEmitPower = 4.0; ps.maxEmitPower = 7.0;

      if (ps.particleTexture) ps.particleTexture.hasAlpha = true;

      if (!anchor){ anchor = new BABYLON.TransformNode('__rainAnchor__', scene); anchor.setEnabled(false); }
      scene.onBeforeRenderObservable.add(()=>{
        const pos = p.getAbsolutePosition ? p.getAbsolutePosition() : p.position;

      }catch(e){}
    }
    const hasRainPS = (scene.particleSystems||[]).some(ps => PATCH.rainHints.some(h => (ps.name||'').toLowerCase().includes(h)));

    if (hasRainPS && !hasRainSnd){

        log('Rain fallback attached.');

    wrap.innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><strong style="font-size:12px;color:#9fd4ff">Investigator\\\'s Notes</strong><button id="nb-clear" style="margin-left:auto;background:#132033;border:1px solid #2a3a55;color:#cfe;padding:4px 8px;border-radius:6px;cursor:pointer">Clear</button></div><textarea id="nb-txt" style="width:100%;height:220px;background:#0a121b;color:#e6f1ff;border:1px solid #1b2a3d;border-radius:8px;padding:8px;resize:vertical"></textarea><div style="display:flex;gap:6px;margin-top:8px"><button id="nb-close" style="flex:1;background:#132033;border:1px solid #2a3a55;color:#cfe;padding:6px;border-radius:8px;cursor:pointer">Close</button><button id="nb-save" style="flex:1;background:#10311f;border:1px solid #1f4130;color:#b7ffd7;padding:6px;border-radius:8px;cursor:pointer">Save</button></div>';

    const t = wrap.querySelector('#nb-txt');
    const saved = localStorage.getItem('pp_notes_v1'); if (saved) t.value = saved;
    wrap.querySelector('#nb-save').onclick = ()=> localStorage.setItem('pp_notes_v1', t.value);
    wrap.querySelector('#nb-clear').onclick = ()=>{ t.value=''; localStorage.removeItem('pp_notes_v1'); };
    wrap.querySelector('#nb-close').onclick = ()=> wrap.style.display='none';

<!-- PATCH: WASD + Shift Run (player-aware + arcrotate follow) -->
<script>
(function(){
  var KEY = { W:87, A:65, S:83, D:68, SHIFT:16 };
  var st = { w:0, a:0, s:0, d:0, run:false };
  var WALK=1.6, RUN=3.0;

  addEventListener("keydown", function(e){ if(e.repeat) return;
    if(e.keyCode===KEY.W) st.w=1; else if(e.keyCode===KEY.S) st.s=1;
    else if(e.keyCode===KEY.A) st.a=1; else if(e.keyCode===KEY.D) st.d=1;
    else if(e.keyCode===KEY.SHIFT) st.run=true;
  }, {passive:true});
  addEventListener("keyup", function(e){
    if(e.keyCode===KEY.W) st.w=0; else if(e.keyCode===KEY.S) st.s=0;
    else if(e.keyCode===KEY.A) st.a=0; else if(e.keyCode===KEY.D) st.d=0;
    else if(e.keyCode===KEY.SHIFT) st.run=false;
  }, {passive:true});

  function S(){ return window.SCENE || window.scene || (window.ENGINE && ENGINE.scenes && ENGINE.scenes[0]) || null; }
  function C(s){ return window.camera || (s && s.activeCamera) || null; }
  function getPlayer(s){
    try{
      if (window.player) return window.player;
      if (s && s.getNodeByName){ var n = s.getNodeByName("player"); if(n) return n; }
      if (s && s.getTransformNodeByName){ var t=s.getTransformNodeByName("player"); if(t) return t; }
    }catch(_){}
    return null;
  }
  function isArc(cam){ return cam && cam.alpha!==undefined && cam.beta!==undefined && cam.radius!==undefined; }

  function v3(cam){
    try{
      var f = cam.getDirection(BABYLON.Axis.Z), r = cam.getDirection(BABYLON.Axis.X);
      f.y=0; r.y=0; f.normalize(); r.normalize();
      var v = f.scale((st.w?1:0)+(st.s?-1:0)).addInPlace(r.scale((st.d?1:0)+(st.a?-1:0)));
      if (v.lengthSquared()===0) return null;
      v.normalize(); return v;
    }catch(e){ return null; }
  }

  (function attach(){
    var s = S(); if(!s){ setTimeout(attach,120); return; }
    s.onBeforeRenderObservable.add(function(){
      var eng=(s.getEngine&&s.getEngine())||window.ENGINE;
      var dt=((eng&&eng.getDeltaTime)?eng.getDeltaTime():16.7)/1000;
      var cam=C(s); if(!cam) return;
      var v=v3(cam); if(!v) return;
      var sp=(st.run?RUN:WALK)*dt;
      var pl=getPlayer(s);

      if (pl){
        // Prefer moving the player mesh
        try{
          pl.checkCollisions = true;
          pl.ellipsoid = pl.ellipsoid || new BABYLON.Vector3(0.4,0.9,0.4);
          pl.ellipsoidOffset = pl.ellipsoidOffset || new BABYLON.Vector3(0,0.9,0);
          if (pl.moveWithCollisions) pl.moveWithCollisions(v.scale(sp));
          else if (pl.position && pl.position.addInPlace) pl.position.addInPlace(v.scale(sp));
        }catch(_){}
        // If using ArcRotate third-person, keep camera aimed at player
        if (isArc(cam) && pl.position){
          try { cam.target = pl.position; } catch(_){}
        }
      } else {
        // No player mesh -> move the camera (first-person / free)
        if (isArc(cam)){
          var d=v.scale(sp);
          try{
            cam.target = cam.target ? cam.target.add(d) : d;
            cam.position = cam.position ? cam.position.add(d) : cam.position;
          }catch(_){}
        } else if (cam.moveWithCollisions) {
          cam.moveWithCollisions(v.scale(sp));
        } else if (cam.cameraDirection) {
          cam.cameraDirection.addInPlace(v.scale(sp));
        } else if (cam.position && cam.position.addInPlace) {
          cam.position.addInPlace(v.scale(sp));
        }
      }
    });
  })();
})();
</script>



<!-- PATCH: Player Model + Third-Person Rig -->
<script>
(function(){
  function S(){ return window.SCENE || window.scene || (window.ENGINE && ENGINE.scenes && ENGINE.scenes[0]) || null; }
  function Canvas(){ var c=document.getElementById("renderCanvas")||document.getElementById("gameCanvas"); return c||document.querySelector("canvas")||null; }

  async function ensurePlayer(){
    var s=S(); if(!s) return null;
    // If already present
    if (window.player) return window.player;
    var n=null;
    try { if (s.getNodeByName) n = s.getNodeByName("player"); } catch(_){}
    if (n){ window.player = n; return n; }

    // Try to load a GLB (best-guess paths). All are optional.
    var paths = [
      ["./assets/models/player/", "player.glb"],
      ["./assets/models/", "player.glb"],
      ["./assets/", "player.glb"]
    ];
    for (var i=0;i<paths.length;i++){
      try{
        var r = await BABYLON.SceneLoader.ImportMeshAsync("", paths[i][0], paths[i][1], s);
        var mesh = r.meshes.find(m=>m && m.name && m.name!=="__root__") || r.meshes[0];
        if (mesh){
          mesh.name = "player";
          mesh.checkCollisions = true;
          mesh.ellipsoid = new BABYLON.Vector3(0.4,0.9,0.4);
          mesh.ellipsoidOffset = new BABYLON.Vector3(0,0.9,0);
          window.player = mesh;
          // If has skeleton, store for later
          try { window.playerSkeleton = r.skeletons && r.skeletons[0]; }catch(_){}
          return mesh;
        }
      }catch(e){ /* ignore and try next */ }
    }

    // Fallback placeholder
    try {
      var cap = BABYLON.MeshBuilder.CreateCapsule("player", {height:1.8, radius:0.4, tessellation:12}, s);
      cap.position = new BABYLON.Vector3(-46.18, 1.35, -105.50);
      cap.checkCollisions = true;
      cap.ellipsoid = new BABYLON.Vector3(0.4,0.9,0.4);
      cap.ellipsoidOffset = new BABYLON.Vector3(0,0.9,0);
      window.player = cap;
      return cap;
    } catch(e) {
      return null;
    }
  }

  function ensureThirdPersonCam(){
    var s=S(); if(!s) return null;
    var canvas = Canvas();
    // Reuse ArcRotate if active
    var arc = (s.activeCamera && s.activeCamera.alpha!==undefined) ? s.activeCamera : null;
    if (!arc){
      var alpha = -Math.PI/2, beta = 1.2, radius = 4.0;
      arc = new BABYLON.ArcRotateCamera("tpc", alpha, beta, radius, new BABYLON.Vector3(0,1,0), s);
      arc.attachControl(canvas, true);
      arc.lowerBetaLimit = 0.3; arc.upperBetaLimit = Math.PI/2.0;
      arc.lowerRadiusLimit = 2.2; arc.upperRadiusLimit = 8.0;
    }
    return arc;
  }

  // Keep third-person camera locked to player
  (function followLoop(){
    var s=S(); if(!s){ setTimeout(followLoop, 250); return; }
    s.onBeforeRenderObservable.add(function(){
      var pl = window.player;
      if (!pl || !pl.position) return;
      var cam = s.activeCamera;
      if (cam && cam.alpha!==undefined){ // ArcRotate
        try { cam.target = pl.position; } catch(_){}
      }
    });
  })();

  // Toggle view with 'V': first-person (use existing cam) <-> third-person (ArcRotate)
  (function setupToggle(){
    var s=S(); if(!s){ setTimeout(setupToggle, 250); return; }
    var firstCam = s.activeCamera;
    addEventListener("keydown", function(e){
      if ((e.key||"").toLowerCase()==="v".toLowerCase() || e.keyCode===86){
        var cam = s.activeCamera;
        if (cam && cam.alpha!==undefined){
          // Currently third-person -> switch back to first
          if (firstCam && firstCam !== cam){
            s.activeCamera = firstCam;
            try { firstCam.attachControl(Canvas(), true); }catch(_){}
          }
        } else {
          // Switch to third-person
          var arc = ensureThirdPersonCam();
          if (arc){ s.activeCamera = arc; try{ arc.attachControl(Canvas(), true); }catch(_){ } }
        }
      }
    });
  })();

  // Kick player load (lazy)
  (function waitAndLoad(){
    var s=S(); if(!s){ setTimeout(waitAndLoad, 250); return; }
    ensurePlayer();
  })();
})();
</script>

<script>

// Exterior rain (world anchored around MAP_DEF.exterior)
function exteriorRain(){
  const ext=(window.MAP_DEF && Array.isArray(window.MAP_DEF.exterior))?MAP_DEF.exterior:null;
  if(!ext || ext.length<3) return;
  const likelyLocal = Math.max(...ext.map(p=>Math.abs(p.x))) < 100 && Math.max(...ext.map(p=>Math.abs(p.z))) < 100;
  const poly = likelyLocal ? ext.map(p=>localToWorld(p, MAP_DEF)) : ext.map(p=>new BABYLON.Vector3(p.x,0,p.z));
  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
  for(const v of poly){ minX=Math.min(minX,v.x); maxX=Math.max(maxX,v.x); minZ=Math.min(minZ,v.z); maxZ=Math.max(maxZ,v.z); }
  function inside(px,pz){
    let ok=false; for(let i=0,j=poly.length-1;i<poly.length;j=i){
      const A=poly[i], B=poly[j];
      const hit=((A.z>pz)!=(B.z>pz)) && (px < (B.x-A.x)*(pz-A.z)/((B.z-A.z)||1e-9)+A.x);
      if(hit) ok=!ok;
    } return ok;
  }
  const tpl = new BABYLON.ParticleSystem("rain_template", 2000, scene);
  tpl.particleTexture = new BABYLON.Texture("./assets/textures/rain.png", scene, true, false);
  tpl.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
  tpl.isBillboardBased = true; tpl.updateSpeed=0.02;
  tpl.minSize=0.05; tpl.maxSize=0.15; tpl.minEmitPower=4; tpl.maxEmitPower=7;
  tpl.gravity = new BABYLON.Vector3(0,-9.81,0);
  const STEP=6, YTOP=14, EMIT=5, MAXR=60;
  const centers=[];
  for(let x=minX;x<=maxX;x+=STEP){ for(let z=minZ;z<=maxZ;z+=STEP){ if(inside(x,z)) centers.push(new BABYLON.Vector3(x,YTOP,z)); } }
  const emitters=[];
  for(const c of centers){
    const node=new BABYLON.TransformNode("rain_emitter",scene); node.position.copyFrom(c);
    const ps=tpl.clone("rain_ps",node); ps.isLocal=false; ps.emitter=node;
    ps.createBoxEmitter(new BABYLON.Vector3(-EMIT,0,-EMIT),new BABYLON.Vector3(EMIT,0,EMIT),new BABYLON.Vector3(0,-1,0),0,0);
    emitters.push({node,ps});
  }
  scene.onBeforeRenderObservable.add(()=>{
    const p=scene.activeCamera?.position||BABYLON.Vector3.Zero(); const r2=MAXR*MAXR;
    for(const e of emitters){
      const d2=BABYLON.Vector3.DistanceSquared(p,e.node.position);
      const on=d2<r2; if(on && !e.ps.isStarted()) e.ps.start(); else if(!on && e.ps.isStarted()) e.ps.stop();
    }
  });
}

// Helper from earlier
function toRad(d){ return d*Math.PI/180; }
function localToWorld(p, def){
  const s=(def?.scale ?? 1), yaw=toRad(def?.rotationY ?? 0);
  const cos=Math.cos(yaw), sin=Math.sin(yaw);
  const x=(p?.x??0)*s, y=(p?.y??0)*s, z=(p?.z??0)*s;
  const xr=x*cos - z*sin, zr=x*sin + z*cos;
  return new BABYLON.Vector3((def?.offset?.x??0)+xr, (def?.offset?.y??0)+y, (def?.offset?.z??0)+zr);
}

// Try to hook into your map-load complete
(function attachAfterLoad(){
  const s = window.scene || BABYLON.Engine?.LastCreatedScene;
  if (!s) return;
  // If your build exposes a promise or callback for map load, attach here.
  // Otherwise, run after a small timeout (best effort).
  setTimeout(()=>{ try{
    forceSpawn(); exteriorRain();
    const inv = PP.storage.loadInventory();
    if (!inv.slots.length) { if (window.openStorage) openStorage(); } else { buildBelt(inv.slots); scatterItems(inv.slots); }
  }catch(e){ console.warn('Merge patch post-load error', e); }}, 1500);
})();
</script>
