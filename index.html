<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Phasma-Phoney 3D</title>
  <link rel="icon" href="favicon.ico"/>

  <!-- Babylon core (local) -->
  <script src="cdn/babylon.js"></script>
  <script src="cdn/loaders/babylon.glTF2FileLoader.js"></script>
  <script src="cdn/gui/babylon.gui.min.js"></script>
  <script src="cdn/inspector/babylon.inspector.bundle.js"></script>
  <script src="cdn/materialsLibrary/babylonjs.materials.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet"/>

  <style>
    :root { --pad: 10px; }
    html, body { margin:0; padding:0; height:100%; background:#000; color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial; }
    canvas { width:100%; height:100%; display:block; touch-action:none; }
    #hud {
      position:absolute; top:0; left:0; padding:var(--pad);
      background:rgba(0,0,0,0.35); z-index:5; font-size:13px; line-height:1.4;
      pointer-events:none;
    }
    #inventory, #notebook, #evidencePanel {
      position:absolute; left:var(--pad); bottom:var(--pad);
      background:rgba(0,0,0,0.55); padding:var(--pad); border-radius:8px; z-index:10;
    }
    #notebook { bottom: calc(60px + var(--pad)); }
    #evidencePanel { left:auto; right:var(--pad); }
    #ghostGuessButton {
      position:absolute; right:var(--pad); bottom:var(--pad);
      padding:8px 14px; border:1px solid #fff; background:rgba(255,255,255,0.08);
      color:#fff; border-radius:6px; cursor:pointer; z-index:10;
    }
    .hidden { display:none !important; }
    .btn { cursor:pointer; margin:4px; padding:6px 10px; border:1px solid #999; background:rgba(255,255,255,0.06); border-radius:6px; color:#fff; }
    .btn.selected { border-color:#0ff; box-shadow: 0 0 0 1px #0ff inset; }
    #debugLabel { position:absolute; top:6px; right:10px; color:#0f0; font-size:12px; z-index:9; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div>Room: <span id="roomName">Outside</span></div>
    <div>Sanity: <span id="sanityDisplay">100%</span></div>
    <div>Weather: <span id="weatherDisplay">Clear</span></div>
    <div>Pos: X <span id="debugX">0</span>, Z <span id="debugZ">0</span></div>
  </div>

  <!-- Inventory -->
  <div id="inventory">
    <strong>Inventory</strong>
    <div id="inventoryItems"></div>
  </div>

  <!-- Notebook -->
  <div id="notebook" class="hidden">
    <strong>Notebook</strong>
    <div id="evidenceList"></div>
    <div id="ghostSuggestion" style="margin-top:6px; opacity:.85;"></div>
  </div>

  <!-- Evidence Panel -->
  <div id="evidencePanel" class="hidden">
    <strong>Select Evidence</strong>
    <div id="evidenceOptions" style="margin-top:6px;"></div>
  </div>

  <button id="ghostGuessButton">Guess Ghost</button>
  <div id="debugLabel"></div>

  <script>
    // === Engine / Scene ===
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true });
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0,0,0,1);

    // === Lighting ===
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
    hemi.intensity = 0.55;

    // === Camera ===
    const camera = new BABYLON.UniversalCamera("fpCam", new BABYLON.Vector3(0, 1.75, -5), scene);
    camera.attachControl(canvas, true);
    camera.speed = 0.5;
    camera.angularSensibility = 2400;

    // === Simple player collider ===
    const player = BABYLON.MeshBuilder.CreateBox("playerCollider", { width:0.8, height:1.8, depth:0.8 }, scene);
    player.isVisible = false;
    player.position.set(0, 0.9, -5);
    camera.parent = player;

    // collisions / gravity
    scene.collisionsEnabled = true;
    player.checkCollisions = true;
    scene.gravity = new BABYLON.Vector3(0, -0.4, 0);
    camera.applyGravity = true;
    camera.ellipsoid = new BABYLON.Vector3(0.4, 0.9, 0.4);

    // === Ground (in case the map isn’t ready yet) ===
    const ground = BABYLON.MeshBuilder.CreateGround("ground", { width:100, height:100 }, scene);
    ground.checkCollisions = true;

    // === Load Map (GLB) ===
    BABYLON.SceneLoader.AppendAsync("assets/models/map/", "Abandoned_House.glb", scene).then(() => {
      scene.meshes.forEach(m => { m.checkCollisions = true; m.isPickable = true; });
      console.log("Map loaded");
    }).catch(e => console.warn("Map load error:", e));

    // === Ghost loader (GLB) ===
    const GHOST_MODELS = [
      "assets/models/ghosts/ghost1.glb",
      "assets/models/ghosts/ghost2.glb",
      "assets/models/ghosts/ghost3.glb",
      "assets/models/ghosts/ghost4.glb"
    ];

    let ghostMesh = null;
    async function loadRandomGhost() {
      const pick = GHOST_MODELS[(Math.random() * GHOST_MODELS.length) | 0];
      const res = await BABYLON.SceneLoader.ImportMeshAsync("", "", pick, scene);
      // Try to find a non-empty root
      ghostMesh = res.meshes.find(m => m.getTotalVertices() > 0) || res.meshes[0];
      ghostMesh.position.copyFromFloats(2, 1.6, 2);
      ghostMesh.setEnabled(false); // hidden until events
      ghostMesh.isPickable = false;
      console.log("Ghost loaded:", pick);
    }
    loadRandomGhost();

    // === Audio (local assets) ===
    let ambientSound = null;
    let whisperSound = null;
    function loadSounds() {
      ambientSound = new BABYLON.Sound("ambient", "assets/audio/ambient.mp3", scene, null, { loop:true, autoplay:true, volume:0.35 });
      whisperSound = new BABYLON.Sound("whisper", "assets/audio/whisper.mp3", scene, null, { loop:false, autoplay:false, volume:0.9 });
    }
    loadSounds();

    // === Movement (WASD + shift) ===
    const input = { w:false, a:false, s:false, d:false, shift:false };
    window.addEventListener("keydown", e => { if (e.repeat) return; const k=e.key.toLowerCase(); if (k in input) input[k]=true; if (e.key==="Shift") input.shift = true; });
    window.addEventListener("keyup", e => { const k=e.key.toLowerCase(); if (k in input) input[k]=false; if (e.key==="Shift") input.shift = false; });

    scene.onBeforeRenderObservable.add(() => {
      const dt = engine.getDeltaTime() / 1000;
      const base = input.shift ? 3.2 : 1.8;

      // local axes
      const forward = camera.getDirection(BABYLON.Axis.Z);
      const right = camera.getDirection(BABYLON.Axis.X);

      let move = BABYLON.Vector3.Zero();
      if (input.w) move.addInPlace(forward);
      if (input.s) move.subtractInPlace(forward);
      if (input.a) move.subtractInPlace(right);
      if (input.d) move.addInPlace(right);
      if (move.lengthSquared() > 0) {
        move.normalize();
        move.y = 0; // keep grounded
        player.moveWithCollisions(move.scale(base * dt));
      }

      // HUD coords
      document.getElementById("debugX").textContent = player.position.x.toFixed(2);
      document.getElementById("debugZ").textContent = player.position.z.toFixed(2);
      document.getElementById("debugLabel").textContent = `X:${player.position.x.toFixed(2)} Z:${player.position.z.toFixed(2)}`;
    });

    // === HUD / Sanity tick ===
    let sanity = 100;
    let currentRoom = "Outside";
    function updateHUD() {
      document.getElementById("roomName").textContent = currentRoom;
      document.getElementById("sanityDisplay").textContent = `${Math.max(0, Math.round(sanity))}%`;
      document.getElementById("weatherDisplay").textContent = "Clear";
    }
    updateHUD();

    setInterval(() => {
      sanity = Math.max(0, sanity - (Math.random()*1.2 + 0.6)); // ~0.6–1.8 per tick
      updateHUD();
    }, 5000);

    // === Very simple room detection placeholder ===
    function detectRoom() {
      // You can replace this by bounding boxes of meshes named Room_*
      currentRoom = (player.position.z > 0) ? "Entrance" : "Outside";
    }
    scene.onBeforeRenderObservable.add(detectRoom);

    // === Inventory & Evidence UI ===
    const allItems = ["EMF Reader","Spirit Box","Thermometer","Ghost Writing Book","Camera","Crucifix","Smudge Stick","Candle","Salt","UV Flashlight","Photo Camera","Parabolic Mic"];
    let inventory = ["Lighter"];

    function setupInventoryOverlay() {
      const container = document.getElementById("inventoryItems");
      container.innerHTML = "";
      allItems.forEach(name => {
        const b = document.createElement("button");
        b.className = "btn";
        b.textContent = name;
        b.onclick = () => {
          if (inventory.includes(name)) {
            inventory = inventory.filter(i => i !== name);
          } else {
            const limited = inventory.filter(i => i !== "Lighter");
            if (limited.length >= 3) return alert("Max 3 items (besides Lighter).");
            inventory.push(name);
          }
          // toggle style
          b.classList.toggle("selected", inventory.includes(name));
        };
        container.appendChild(b);
      });
    }
    setupInventoryOverlay();

    const evidenceList = ["EMF5","Spirit Box","Freezing Temps","Ghost Writing","Fingerprints","Ghost Orbs","DOTS"];
    const selectedEvidence = new Set();

    function setupNotebookUI() {
      const opts = document.getElementById("evidenceOptions");
      const list = document.getElementById("evidenceList");
      opts.innerHTML = "";
      list.innerHTML = "";

      evidenceList.forEach(ev => {
        const b = document.createElement("button");
        b.className = "btn";
        b.textContent = ev;
        b.onclick = () => {
          if (selectedEvidence.has(ev)) selectedEvidence.delete(ev);
          else selectedEvidence.add(ev);
          b.classList.toggle("selected", selectedEvidence.has(ev));
          suggestGhosts();
        };
        opts.appendChild(b);
      });
    }
    setupNotebookUI();

    // Tiny ghost db (aligns with your text DB)
    const ghostDB = [
      { name:"Spirit", evidence:["EMF5","Spirit Box","Ghost Writing"] },
      { name:"Wraith", evidence:["EMF5","DOTS","Spirit Box"] },
      { name:"Phantom", evidence:["Spirit Box","Fingerprints","DOTS"] },
      { name:"Poltergeist", evidence:["Spirit Box","Ghost Writing","Fingerprints"] },
      { name:"Banshee", evidence:["Fingerprints","DOTS","Ghost Orbs"] },
      { name:"Shade", evidence:["EMF5","Ghost Writing","Freezing Temps"] },
      { name:"Revenant", evidence:["Freezing Temps","Ghost Writing","Ghost Orbs"] },
      { name:"Yurei", evidence:["Freezing Temps","Ghost Orbs","DOTS"] },
      { name:"Oni", evidence:["EMF5","DOTS","Freezing Temps"] }
    ];

    function suggestGhosts() {
      const matches = ghostDB.filter(g =>
        [...selectedEvidence].every(e => g.evidence.includes(e))
      );
      document.getElementById("ghostSuggestion").textContent =
        matches.length ? `Possible: ${matches.map(m=>m.name).join(", ")}` : "No matches yet.";
    }

    // Toggle notebook with N
    window.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "n") {
        document.getElementById("notebook").classList.toggle("hidden");
        document.getElementById("evidencePanel").classList.toggle("hidden");
      }
    });

    // Guess ghost
    document.getElementById("ghostGuessButton").addEventListener("click", () => {
      const guess = prompt("Guess the ghost (e.g., Spirit, Wraith, Shade):");
      if (!guess) return;
      alert(`You guessed: ${guess}. (Hook up to your round resolution when ready.)`);
    });

    // Render loop
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
