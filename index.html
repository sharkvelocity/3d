<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Local Babylon (from your repo) -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/loaders/babylon.glTF2FileLoader.min.js"></script>

  <style>
    :root{
      --cyan:#00ffff;
      --hud-bg:#0a0a0a;
      --hud-bd:#0ff4;
      --panel:#111;
      --panel-bd:#0ff6;
    }
    html, body {
      margin: 0; height: 100%; background:#000; color:#0ff; font-family: monospace;
      overflow: hidden;
    }

    /* Backgrounds / overlays */
    #bg-logo{
      position:fixed; inset:0; background:url("./logo.png") center/contain no-repeat;
      opacity:.08; z-index:0; pointer-events:none;
    }
    #flash-overlay{
      position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:200;
      transition:opacity .15s ease;
    }

    /* Main render canvas */
    #game-canvas{ position:fixed; inset:0; z-index:1; display:block; }

    /* ===== Title Screen ===== */
    #title-screen{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:#000; z-index:5000; padding:clamp(12px, 3vh, 48px);
    }
    #title-inner{
      width:min(900px,92vw); display:flex; flex-direction:column; align-items:center; gap:20px;
      text-align:center;
    }
    #title-logo{ max-width:80%; height:auto; opacity:.9; pointer-events:none; }
    #start-btn{
      padding:14px 40px; font:700 22px/1 monospace; color:#eef;
      background:#111; border:2px solid #0ff8; border-radius:10px; cursor:pointer;
      box-shadow:0 0 28px #0ff3, inset 0 0 8px #0ff3;
    }
    #start-btn:hover{ transform:translateY(-1px); }
    #start-btn:active{ transform:none; }

    /* ===== Loadout ===== */
    #loadout-screen{
      position:fixed; inset:0; display:none; background:#000; z-index:5000;
      overflow:auto; padding:24px;
    }
    .chip{ display:inline-flex; align-items:center; gap:6px; padding:6px 10px;
      border:1px solid #0ff6; border-radius:999px; background:#0a0a0a; margin:6px; cursor:pointer;
    }
    .chip input{ accent-color:#0ff; }

    /* ===== HUD (top-left bar) ===== */
    #hud{
      position:fixed; left:10px; top:10px; z-index:3000;
      background:var(--hud-bg); border:1px solid var(--hud-bd); border-radius:8px;
      padding:8px 10px; min-width:260px; max-width:60vw;
      box-shadow:0 0 12px #000c;
    }
    #hud .row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .hud-label{ color:#aff; opacity:.9; }
    #items-strip{ display:flex; align-items:center; gap:6px; margin-top:6px; }
    .item-thumb{ width:42px; height:42px; border:1px solid #0ff4; border-radius:6px; background:#020202;
      display:inline-flex; align-items:center; justify-content:center; overflow:hidden;
    }
    .item-thumb img{ width:100%; height:100%; object-fit:contain; image-rendering:auto; }

    /* ===== Log panel (compact) ===== */
    #log{
      position:fixed; left:10px; bottom:10px; width:min(420px, 60vw);
      height:200px; overflow:auto; padding:8px; z-index:3000;
      border:1px solid var(--hud-bd); border-radius:8px; background:#050505; color:#9ff;
      box-shadow:0 0 12px #000c;
    }
    #log b{ color:#0ff; }

    /* ===== Dev Panel ===== */
    #dev-panel{
      position:fixed; right:10px; top:10px; z-index:3000; display:none;
      background:var(--panel); border:1px solid var(--panel-bd); border-radius:8px; padding:8px;
      width:240px;
    }
    #dev-panel h4{ margin:4px 0 8px 0; color:#aff; }
    .dev-btn{
      width:100%; padding:8px; margin:6px 0; background:#111; color:#aff; border:1px solid #0ff7;
      border-radius:6px; cursor:pointer;
    }

    /* ===== Touch Joystick ===== */
    #joystick{
      position:fixed; left:14px; bottom:14px; width:120px; height:120px; z-index:2500; display:none;
    }
    .joy-base{
      position:absolute; inset:0; border-radius:50%; background:#0ff1; border:1px solid #0ff5;
    }
    .joy-knob{
      position:absolute; left:36px; top:36px; width:48px; height:48px; border-radius:50%;
      background:#0ff4; border:1px solid #0ff9; transform:translate(0,0);
    }

    /* Evidence & Modals */
    .modal{
      position:fixed; inset:0; background:#000a; z-index:5001; display:none;
      align-items:center; justify-content:center; padding:16px;
    }
    .card{
      background:#0c0c0c; border:1px solid #0ff6; border-radius:10px; padding:14px; max-width:520px;
      color:#cff;
    }
    .btn{ padding:8px 14px; border:1px solid #0ff6; background:#111; color:#cff; border-radius:6px; cursor:pointer; }

    /* Camera-only Orbs overlay (only visible while camera view is active) */
    #orbs-canvas{ position:fixed; inset:0; pointer-events:none; z-index:150; display:none; }
  </style>
</head>
<body>

  <!-- Background + Render + Overlays -->
  <div id="bg-logo"></div>
  <canvas id="game-canvas"></canvas>
  <canvas id="orbs-canvas"></canvas>
  <div id="flash-overlay"></div>

  <!-- ===== Title Screen ===== -->
  <div id="title-screen">
    <div id="title-inner">
      <button id="start-btn" onclick="openLoadout()">Start Investigation</button>
      <img id="title-logo" src="./logo.png" alt="PhasmaPhoney">
      <p style="color:#cfe;opacity:.85;margin:0">“Welcome back. Let’s hope your deduction is better than your taste in candles.”</p>
    </div>
  </div>

  <!-- ===== Loadout ===== -->
  <div id="loadout-screen">
    <h2 style="text-align:center;">Select your loadout (pick 3)</h2>
    <div id="loadout-list" style="text-align:center;margin:8px 0;"></div>
    <div style="text-align:center;margin-top:10px;">
      <button class="btn" onclick="confirmLoadout()">Confirm</button>
      <button class="btn" onclick="cancelLoadout()">Back</button>
    </div>
  </div>

  <!-- ===== HUD ===== -->
  <div id="hud" style="display:none;">
    <div class="row">
      <span class="hud-label">Turn:</span> <span id="hud-turn">0</span>
      <span class="hud-label">Sanity:</span> <span id="hud-sanity">100%</span>
      <span class="hud-label">Room:</span> <span id="hud-room">—</span>
    </div>
    <div id="items-strip"></div>
  </div>

  <!-- ===== Log ===== -->
  <div id="log" style="display:none;"></div>

  <!-- ===== Dev Panel (locked until enabled) ===== -->
  <div id="dev-panel">
    <h4>Developer Options</h4>
    <button class="dev-btn" onclick="devSpawnEMF()">Spawn EMF in front</button>
    <button class="dev-btn" onclick="centerCamera()">Recenter Camera to House</button>
    <button class="dev-btn" onclick="teleportToGhost()">Teleport to Ghost Room</button>
    <button class="dev-btn" onclick="revealGhost()">Reveal Ghost</button>
    <button class="dev-btn" onclick="giveAllItems()">Give All Items</button>
  </div>

  <!-- ===== Touch Joystick ===== -->
  <div id="joystick">
    <div class="joy-base"></div>
    <div class="joy-knob" id="joy-knob"></div>
  </div>

  <!-- ===== Developer Gate Modal ===== -->
  <div id="dev-gate" class="modal">
    <div class="card">
      <h3>Enable developer options?</h3>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="btn" onclick="askDevPassword()">Yes</button>
        <button class="btn" onclick="closeDevGate()">No</button>
      </div>
      <div id="dev-pass" style="display:none; margin-top:12px;">
        <input id="dev-pass-input" type="password" placeholder="password" style="width:100%; padding:8px; background:#111; color:#cff; border:1px solid #0ff6; border-radius:6px;">
        <div style="margin-top:8px; display:flex; gap:8px;">
          <button class="btn" onclick="submitDevPassword()">Unlock</button>
          <button class="btn" onclick="closeDevGate()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Use Item Modal ===== -->
  <div id="use-item" class="modal">
    <div class="card">
      <h3>Use an item</h3>
      <div id="use-item-list" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;"></div>
      <div style="text-align:right; margin-top:10px;">
        <button class="btn" onclick="closeUseItem()">Close</button>
      </div>
    </div>
  </div>

  <script>
  /***********************
   * Global constants
   ************************/
  const CANVAS = document.getElementById('game-canvas');
  let engine, scene, camera, houseRoot, houseBounds, light;

  const AUDIO = {
    spiritBox: new Audio('./assets/audio/spiritbox.mp3'),
    spiritBoxStatic: new Audio('./assets/audio/spiritBoxStatic.mp3'),
    emf: new Audio('./assets/audio/Radio.mp3'),
    whisper: new Audio('./assets/audio/whisper.mp3'),
    chill: new Audio('./assets/audio/ambient.mp3'),
    doorCreak1: new Audio('./assets/audio/doorCreak1.mp3'),
    doorCreak2: new Audio('./assets/audio/doorCreak2.mp3'),
    writing: new Audio('./assets/audio/GhostWriting1.mp3'),
    cameraClick: new Audio('./assets/audio/Photo_Camera_Photo_Camera_0.mp3'), // fallback if you have it
  };

  // Items available in the game and the mesh names inside exploration_objects.glb to render icons
  const ITEM_MESH_MAP = {
    "EMF": "EMF_Detector_EMF_Detector_0",
    "Spirit Box": "Cone.001_Spirit_Box_0",
    "Thermometer": "Thermometer_Thermometer_0",
    "D.O.T.S": "Voice_Recorder_Voice_Recorder_0", // re-using as a stand-in; replace if you add DOTS mesh
    "Ghost Writing Book": "Notebook? (use text icon if missing)",
    "UV Light": "Flashlight_Flashlight_0",
    "Camera": "Photo_Camera_Photo_Camera_0",
    "Flashlight": "Flashlight_Poquet_Flashlight_Poquet_0",
    "Thermal": "Thermal_Camera_Thermal_Camera_0",
    "Crucifix": null, "Salt": null, "Smudge": null // optional icons
  };

  const ALL_ITEMS = [
    "EMF", "Spirit Box", "Thermometer", "UV Light", "D.O.T.S", "Ghost Writing Book", "Camera", "Crucifix", "Salt", "Smudge", "Flashlight"
  ];

  const EVIDENCE = [
    "EMF Level 5", "Spirit Box", "Fingerprints", "Ghost Writing", "Freezing Temps", "D.O.T.S", "Orbs"
  ];

  // Ghosts + evidence (classic Phasmo-style)
  const GHOSTS = {
    spirit:        ["Spirit Box", "Ghost Writing", "EMF Level 5"],
    wraith:        ["Spirit Box", "D.O.T.S", "EMF Level 5"],
    poltergeist:   ["Spirit Box", "Ghost Writing", "Fingerprints"],
    banshee:       ["D.O.T.S", "Fingerprints", "Orbs"],
    jinn:          ["EMF Level 5", "Freezing Temps", "Fingerprints"],
    mare:          ["Spirit Box", "Ghost Writing", "Orbs"],
    revenant:      ["Ghost Writing", "Orbs", "Freezing Temps"],
    shade:         ["Ghost Writing", "Freezing Temps", "EMF Level 5"],
    demon:         ["Freezing Temps", "Ghost Writing", "Fingerprints"],
    yurei:         ["Freezing Temps", "D.O.T.S", "Orbs"],
    oni:           ["EMF Level 5", "Freezing Temps", "D.O.T.S"],
    yokai:         ["Spirit Box", "D.O.T.S", "Orbs"],
    hantu:         ["Freezing Temps", "Ghost Writing", "Fingerprints"],
    goryo:         ["EMF Level 5", "D.O.T.S", "Fingerprints"],
    myling:        ["Ghost Writing", "EMF Level 5", "Fingerprints"],
    onryo:         ["Freezing Temps", "Spirit Box", "Orbs"],
    "the twins":   ["Spirit Box", "Freezing Temps", "EMF Level 5"],
    raiju:         ["EMF Level 5", "D.O.T.S", "Orbs"],
    obake:         ["EMF Level 5", "Orbs", "Fingerprints"],
    "the mimic":   ["Spirit Box", "Freezing Temps", "Fingerprints"],
    moroi:         ["Freezing Temps", "Ghost Writing", "Spirit Box"],
    deogen:        ["Spirit Box", "Ghost Writing", "D.O.T.S"],
    thaye:         ["Ghost Writing", "Orbs", "D.O.T.S"],
    phantom:       ["Spirit Box", "D.O.T.S", "Fingerprints"],
    succubus:      ["Ghost Writing", "Orbs", "Spirit Box"]
  };

  // 3x3 conceptual map grid for HUD room name. Names must match your earlier layout
  const ROOM_GRID = [
    ["Van", "Foyer", "Kitchen"],
    ["Basement", "Living Room", "Bathroom"],
    ["Garage", "Bedroom", "Storage"]
  ];

  // Game state
  const game = {
    started:false, active:false, turn:0, sanity:100,
    inventory: [], // filled after loadout
    evidence: [],
    ghostKey: null,
    ghostEvidence: [],
    ghostRoomName: "Living Room",
    mimicForm: null, nextMimicShift: 0,
    cameraView:false,
    itemsMeshes: {}, // { itemName : {mesh, iconURL} }
    devUnlocked:false
  };

  /***********************
   * Utility
   ************************/
  function log(msg){
    const box = document.getElementById('log');
    box.style.display = 'block';
    const line = document.createElement('div');
    line.innerHTML = msg;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }
  function setHUD(){
    document.getElementById('hud').style.display = 'block';
    document.getElementById('hud-turn').textContent = game.turn;
    document.getElementById('hud-sanity').textContent = game.sanity + '%';
  }
  function setRoomName(name){ document.getElementById('hud-room').textContent = name; }

  function flash(){
    const f = document.getElementById('flash-overlay');
    f.style.opacity = .5;
    setTimeout(()=>{ f.style.opacity = 0; }, 80);
  }

  function randInt(a,b){ return Math.floor(a + Math.random()*(b-a+1)); }

  /***********************
   * Start / Loadout
   ************************/
  function openLoadout(){
    document.getElementById('title-screen').style.display = 'none';
    const L = document.getElementById('loadout-screen');
    L.style.display = 'block';

    const container = document.getElementById('loadout-list');
    container.innerHTML = '';
    ALL_ITEMS.forEach(name=>{
      const id = 'it_' + name.replace(/\W+/g,'');
      const chip = document.createElement('label');
      chip.className = 'chip';
      chip.innerHTML = `<input id="${id}" type="checkbox"> ${name}`;
      container.appendChild(chip);
    });
  }
  function cancelLoadout(){
    document.getElementById('loadout-screen').style.display = 'none';
    document.getElementById('title-screen').style.display = 'flex';
  }
  function confirmLoadout(){
    const picks = ALL_ITEMS.filter(n=>{
      const id='it_'+n.replace(/\W+/g,'');
      const el=document.getElementById(id);
      return el && el.checked;
    });
    if(picks.length>3){ alert('Pick at most 3.'); return; }
    if(picks.length<3){ alert('Pick 3 to start.'); return; }
    game.inventory = [...picks];
    document.getElementById('loadout-screen').style.display='none';
    startGame();
  }

  /***********************
   * Developer Gate
   ************************/
  window.addEventListener('load', ()=>{
    document.getElementById('dev-gate').style.display = 'flex';
  });
  function closeDevGate(){ document.getElementById('dev-gate').style.display = 'none'; }
  function askDevPassword(){
    document.getElementById('dev-pass').style.display='block';
  }
  function submitDevPassword(){
    const v = document.getElementById('dev-pass-input').value.trim();
    if(v==='devmode'){
      game.devUnlocked = true;
      document.getElementById('dev-panel').style.display='block';
      log('<b>System:</b> Developer options unlocked.');
      closeDevGate();
    }else{
      alert('Wrong password.');
    }
  }

  /***********************
   * Babylon scene setup
   ************************/
  async function startGame(){
    // boot rendering
    engine = new BABYLON.Engine(CANVAS, true, { preserveDrawingBuffer:true, stencil:true, antialias:true });
    scene = new BABYLON.Scene(engine);
    scene.createDefaultEnvironment({ createSkybox:false, createGround:false });

    // camera
    camera = new BABYLON.UniversalCamera('cam', new BABYLON.Vector3(0, 2, -5), scene);
    camera.attachControl(CANVAS, true);
    camera.speed = 0.2;
    camera.keysUp = [87];    // W
    camera.keysLeft = [65];  // A
    camera.keysDown = [83];  // S
    camera.keysRight = [68]; // D

    // light
    light = new BABYLON.HemisphericLight("l", new BABYLON.Vector3(0,1,0), scene);
    light.intensity = 0.9;

    setHUD();
    log('<b>System:</b> Loading map…');

    // load house
    houseRoot = await BABYLON.SceneLoader.ImportMeshAsync(
      "", "./assets/models/map/", "Abandoned_House.glb", scene
    ).then(res=>{
      const root = res.meshes[0];
      root.name = "HouseRoot";
      return root;
    });

    // compute center spawn from bounding info
    houseBounds = houseRoot.getHierarchyBoundingVectors(true);
    const center = houseBounds.min.add(houseBounds.max).scale(0.5);
    const size = houseBounds.max.subtract(houseBounds.min);
    camera.position = center.add(new BABYLON.Vector3(0, size.y*0.25, size.z*0.6));
    camera.setTarget(center);
    log('<b>System:</b> Map loaded.');

    // random ghost + ghost room (grid pick)
    const keys = Object.keys(GHOSTS);
    game.ghostKey = keys[Math.floor(Math.random()*keys.length)];
    game.ghostEvidence = [...GHOSTS[game.ghostKey]];
    if(game.ghostKey === "the mimic"){
      const pool = keys.filter(k=>k!=="the mimic");
      game.mimicForm = pool[Math.floor(Math.random()*pool.length)];
      game.ghostEvidence = [...GHOSTS[game.mimicForm]];
      game.nextMimicShift = 4 + randInt(0,3);
    }
    // choose random cell except Van
    const cells = [];
    for(let i=0;i<3;i++) for(let j=0;j<3;j++){
      if(!(i===0 && j===0)) cells.push(ROOM_GRID[i][j]);
    }
    game.ghostRoomName = cells[randInt(0, cells.length-1)];

    // item models to build HUD thumbnails
    await loadItemIcons();

    // UI
    refreshItemsStrip();
    document.getElementById('hud-room').textContent = "Kitchen"; // temp until first tick

    // touch joystick if mobile-ish
    if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
      setupJoystick();
      document.getElementById('joystick').style.display='block';
    }

    // main loop
    engine.runRenderLoop(()=>{
      scene.render();
      tick();
    });

    // resize
    window.addEventListener('resize', ()=>engine.resize());

    // Bind hotkeys
    window.addEventListener('keydown', (e)=>{
      if(e.key==='e'){ openUseItem(); }
      if(e.key==='c'){ toggleCameraView(); }
    });

    // show HUD & log start
    setHUD();
    setRoomName(getCurrentRoomName());
    log('<b>System:</b> Investigation started.');
  }

  async function loadItemIcons(){
    log('<b>System:</b> Loading item models (exploration_objects.glb)…');

    // Hidden mini-canvas + engine for thumbnails
    const iconCanvas = document.createElement('canvas');
    iconCanvas.width = 256; iconCanvas.height = 256; iconCanvas.style.display='none';
    document.body.appendChild(iconCanvas);
    const iconEngine = new BABYLON.Engine(iconCanvas, true);
    const iconScene = new BABYLON.Scene(iconEngine);
    const icLight = new BABYLON.HemisphericLight("icl", new BABYLON.Vector3(0,1,0), iconScene);
    icLight.intensity = 1.1;
    const icCam = new BABYLON.ArcRotateCamera("icCam", Math.PI/4, Math.PI/3, 3, BABYLON.Vector3.Zero(), iconScene);
    icCam.lowerRadiusLimit = icCam.upperRadiusLimit = 3;

    // load once
    const res = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/items/", "exploration_objects.glb", iconScene);
    const all = res.meshes;

    // For each requested item, find a mesh and make an icon shot
    for(const [item, meshName] of Object.entries(ITEM_MESH_MAP)){
      let mesh = null;
      if(meshName){
        mesh = all.find(m=>m.name===meshName);
      }
      if(mesh){
        // center
        mesh.setEnabled(true);
        mesh.position = BABYLON.Vector3.Zero();
        // compute bounding & frame
        const b = mesh.getHierarchyBoundingVectors(true);
        const size = b.max.subtract(b.min);
        const maxDim = Math.max(size.x, size.y, size.z);
        icCam.radius = Math.max(2.5, maxDim*1.8);

        // render once and grab dataURL
        iconEngine.beginFrame();
        iconScene.render();
        iconEngine.endFrame();

        const dataURL = iconCanvas.toDataURL('image/png');
        game.itemsMeshes[item] = { mesh, iconURL: dataURL };
        // hide mesh for next item render to avoid overlap
        mesh.setEnabled(false);
      }else{
        // fallback icon via text
        game.itemsMeshes[item] = { mesh:null, iconURL:null };
      }
    }

    iconEngine.dispose();
    iconCanvas.remove();
    log('<b>System:</b> Items loaded.');
  }

  /***********************
   * HUD items row
   ************************/
  function refreshItemsStrip(){
    const strip = document.getElementById('items-strip');
    strip.innerHTML = '';
    game.inventory.forEach(item=>{
      const it = document.createElement('div');
      it.className = 'item-thumb';
      if(game.itemsMeshes[item]?.iconURL){
        const img = document.createElement('img');
        img.src = game.itemsMeshes[item].iconURL;
        img.alt = item;
        it.title = item;
        it.appendChild(img);
      }else{
        it.textContent = item[0]; it.title=item;
      }
      strip.appendChild(it);
    });
  }

  /***********************
   * Movement + room detection
   ************************/
  function getCurrentRoomName(){
    // Partition the house bounding box into a 3x3 grid to label rooms for the HUD
    if(!houseBounds) return "Outside";
    const p = camera.position;
    const min = houseBounds.min, max = houseBounds.max;
    // If outside the bounds, return nearest label "Outside"
    if(p.x<min.x || p.x>max.x || p.z<min.z || p.z>max.z) return "Outside";

    const nx = (p.x - min.x) / (max.x - min.x); // 0..1
    const nz = (p.z - min.z) / (max.z - min.z); // 0..1

    const row = Math.min(2, Math.max(0, Math.floor(nz*3))); // z as rows
    const col = Math.min(2, Math.max(0, Math.floor(nx*3))); // x as cols
    return ROOM_GRID[row][col];
  }
  function centerCamera(){
    if(!houseBounds) return;
    const center = houseBounds.min.add(houseBounds.max).scale(0.5);
    const size = houseBounds.max.subtract(houseBounds.min);
    camera.position = center.add(new BABYLON.Vector3(0, size.y*0.25, size.z*0.6));
    camera.setTarget(center);
    log('<b>System:</b> Camera recentered to house center.');
  }

  // Simple per-frame tick to update HUD + mimic + random ambience
  let orbTick=0, lastRoom="—", mimicTick=0;
  function tick(){
    if(!scene) return;
    // HUD turn/sanity rarely changes here; we still update room live:
    const r = getCurrentRoomName();
    if(r!==lastRoom){
      setRoomName(r);
      lastRoom = r;
    }

    if(game.cameraView){
      // animate orbs overlay if evidence includes Orbs and player is in the ghost room
      renderOrbsOverlay(r === game.ghostRoomName && game.ghostEvidence.includes("Orbs"));
    }

    // mimic form change
    mimicTick++;
    if(game.ghostKey==="the mimic" && mimicTick> (game.nextMimicShift*60)){
      const pool=Object.keys(GHOSTS).filter(k=>k!=="the mimic");
      const pick = pool[randInt(0, pool.length-1)];
      game.mimicForm = pick; game.ghostEvidence = [...GHOSTS[pick]];
      game.nextMimicShift = 4 + randInt(0,3);
      mimicTick=0;
      log('<b>System:</b> Something feels… different.');
    }
  }

  /***********************
   * Orbs overlay (camera-only)
   ************************/
  const orbsCanvas = document.getElementById('orbs-canvas');
  const octx = orbsCanvas.getContext('2d');
  let orbParticles = [];
  function initOrbs(){
    orbsCanvas.width = window.innerWidth; orbsCanvas.height = window.innerHeight;
    orbParticles = Array.from({length:12}, ()=>({
      x:Math.random()*orbsCanvas.width, y:Math.random()*orbsCanvas.height,
      vx:(Math.random()-.5)*0.4, vy:(Math.random()-.5)*0.4, a:0
    }));
  }
  function renderOrbsOverlay(active){
    if(!active){ orbsCanvas.style.display='none'; return; }
    orbsCanvas.style.display='block';
    const w = orbsCanvas.width, h = orbsCanvas.height;
    octx.clearRect(0,0,w,h);
    orbParticles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>w) p.vx*=-1;
      if(p.y<0||p.y>h) p.vy*=-1;
      p.a = 0.3 + Math.random()*0.3;
      // Draw very subtle soft blobs (no explicit "orb" callouts)
      const g = octx.createRadialGradient(p.x,p.y,1,p.x,p.y,12);
      g.addColorStop(0, `rgba(255,255,255,${p.a})`);
      g.addColorStop(1, `rgba(255,255,255,0)`);
      octx.fillStyle=g;
      octx.beginPath(); octx.arc(p.x,p.y,12,0,Math.PI*2); octx.fill();
    });
  }
  window.addEventListener('resize', initOrbs);

  /***********************
   * Use items + evidence logic
   ************************/
  function openUseItem(){
    const list = document.getElementById('use-item-list');
    list.innerHTML = '';
    game.inventory.forEach(item=>{
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = item;
      b.onclick = ()=>{ closeUseItem(); useItem(item); };
      list.appendChild(b);
    });
    document.getElementById('use-item').style.display='flex';
  }
  function closeUseItem(){ document.getElementById('use-item').style.display='none'; }

  function useItem(item){
    const room = getCurrentRoomName();
    const inGhostRoom = (room === game.ghostRoomName);

    switch(item){
      case "EMF":
        AUDIO.emf.currentTime=0; AUDIO.emf.play();
        const max = inGhostRoom ? (game.ghostEvidence.includes("EMF Level 5")?5:4) : randInt(1,3);
        log(`<b>EMF:</b> ${max} detected.`);
        if(max===5 && !game.evidence.includes("EMF Level 5")){
          game.evidence.push("EMF Level 5"); log('<b>Evidence:</b> EMF Level 5');
        }
        advanceTurn();
        break;
      case "Spirit Box":
        if(inGhostRoom && game.ghostEvidence.includes("Spirit Box")){
          AUDIO.spiritBox.currentTime=0; AUDIO.spiritBox.play();
          log('<b>Spirit Box:</b> A voice responds… you can’t quite place the words.');
          if(!game.evidence.includes("Spirit Box")){
            game.evidence.push("Spirit Box"); log('<b>Evidence:</b> Spirit Box');
          }
        }else{
          AUDIO.spiritBoxStatic.currentTime=0; AUDIO.spiritBoxStatic.play();
          log('<b>Spirit Box:</b> Only static.');
        }
        advanceTurn();
        break;
      case "Thermometer":
        const t = inGhostRoom && game.ghostEvidence.includes("Freezing Temps") ? (-2 + Math.random()*-3) : (5 + Math.random()*10);
        log(`<b>Thermometer:</b> ${t.toFixed(1)}°C`);
        if(t<=0 && !game.evidence.includes("Freezing Temps")){
          game.evidence.push("Freezing Temps"); log('<b>Evidence:</b> Freezing Temps');
        }
        advanceTurn();
        break;
      case "Ghost Writing Book":
        if(inGhostRoom && game.ghostEvidence.includes("Ghost Writing")){
          AUDIO.writing.currentTime=0; AUDIO.writing.play();
          log('<b>Book:</b> You return to find new marks on the page.');
          if(!game.evidence.includes("Ghost Writing")){
            game.evidence.push("Ghost Writing"); log('<b>Evidence:</b> Ghost Writing');
          }
        }else{
          log('<b>Book:</b> You set it down. Nothing changes.');
        }
        advanceTurn();
        break;
      case "UV Light":
        if(inGhostRoom && game.ghostEvidence.includes("Fingerprints")){
          log('<b>UV:</b> A faint oily residue along the edge of a surface.');
          if(!game.evidence.includes("Fingerprints")){
            game.evidence.push("Fingerprints"); log('<b>Evidence:</b> Fingerprints');
          }
        }else{
          log('<b>UV:</b> No notable residue here.');
        }
        advanceTurn();
        break;
      case "D.O.T.S":
        if(inGhostRoom && game.ghostEvidence.includes("D.O.T.S")){
          log('<b>D.O.T.S:</b> Something glides through the grid, barely there.');
          if(!game.evidence.includes("D.O.T.S")){
            game.evidence.push("D.O.T.S"); log('<b>Evidence:</b> D.O.T.S');
          }
        }else{
          log('<b>D.O.T.S:</b> The pattern sits undisturbed.');
        }
        advanceTurn();
        break;
      case "Camera":
        toggleCameraView();
        break;
      default:
        log(`<b>${item}:</b> Not usable here.`);
    }
  }

  function toggleCameraView(){
    game.cameraView = !game.cameraView;
    if(game.cameraView){
      initOrbs();
      log('<b>Camera:</b> Viewfinder active.');
    }else{
      document.getElementById('orbs-canvas').style.display='none';
      log('<b>Camera:</b> Viewfinder closed.');
    }
  }

  function advanceTurn(){
    game.turn++; document.getElementById('hud-turn').textContent = game.turn;
    // sanity decay a little faster while in ghost room
    const inGhost = (getCurrentRoomName()===game.ghostRoomName);
    game.sanity = Math.max(0, game.sanity - (inGhost?3:1));
    document.getElementById('hud-sanity').textContent = game.sanity+'%';
  }

  /***********************
   * Dev tools
   ************************/
  function devSpawnEMF(){
    const dir = camera.getForwardRay().direction.scale(2);
    const pos = camera.position.add(dir);
    // Visual ping (small sphere)
    const s = BABYLON.MeshBuilder.CreateSphere('emfPing', {diameter:0.2}, scene);
    s.position = pos; s.material = new BABYLON.StandardMaterial('m', scene);
    s.material.emissiveColor = new BABYLON.Color3(0,1,1);
    setTimeout(()=>s.dispose(), 1200);
    AUDIO.emf.currentTime=0; AUDIO.emf.play();
    log('<b>System:</b> Spawned: EMF ping in front.');
  }
  function teleportToGhost(){
    // Move camera to the sector center of the ghost room
    if(!houseBounds) return;
    const min = houseBounds.min, max=houseBounds.max;
    // Find the ghost room cell in ROOM_GRID
    let gi=0, gj=0;
    for(let i=0;i<3;i++) for(let j=0;j<3;j++){
      if(ROOM_GRID[i][j]===game.ghostRoomName){ gi=i; gj=j; }
    }
    const cellMin = new BABYLON.Vector3(
      min.x + (max.x-min.x)*(gj/3),
      min.y,
      min.z + (max.z-min.z)*(gi/3)
    );
    const cellMax = new BABYLON.Vector3(
      min.x + (max.x-min.x)*((gj+1)/3),
      max.y,
      min.z + (max.z-min.z)*((gi+1)/3)
    );
    const center = cellMin.add(cellMax).scale(0.5);
    camera.position = new BABYLON.Vector3(center.x, center.y+1.8, center.z+1.5);
    camera.setTarget(center);
    log('<b>System:</b> Teleported to ' + game.ghostRoomName + '.');
  }
  function revealGhost(){
    log(`<b>System:</b> Ghost: ${game.ghostKey.toUpperCase()} | Evidence: ${game.ghostEvidence.join(', ')}`);
  }
  function giveAllItems(){
    game.inventory = [...ALL_ITEMS];
    refreshItemsStrip();
    log('<b>System:</b> All items granted.');
  }

  /***********************
   * Touch joystick
   ************************/
  function setupJoystick(){
    const joy = document.getElementById('joystick');
    const knob = document.getElementById('joy-knob');
    let dragging=false, sx=0, sy=0;

    const start = (e)=>{
      dragging=true;
      const t = e.touches? e.touches[0]: e;
      const rect = joy.getBoundingClientRect();
      sx = t.clientX - rect.left; sy = t.clientY - rect.top;
    };
    const move = (e)=>{
      if(!dragging) return;
      const t = e.touches? e.touches[0]: e;
      const rect = joy.getBoundingClientRect();
      const x = t.clientX - rect.left - 60; // center
      const y = t.clientY - rect.top - 60;
      const mag = Math.min(40, Math.hypot(x,y));
      const ang = Math.atan2(y,x);
      knob.style.transform = `translate(${Math.cos(ang)*mag}px, ${Math.sin(ang)*mag}px)`;
      // move camera
      camera.position.addInPlace(new BABYLON.Vector3(Math.cos(ang),0,Math.sin(ang)).scale(0.03));
    };
    const end = ()=>{
      dragging=false; knob.style.transform='translate(0,0)';
    };

    joy.addEventListener('mousedown', start);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    joy.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:true});
    window.addEventListener('touchend', end);
  }
  </script>
