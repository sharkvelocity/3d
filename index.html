<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PhasmaPhoney — Behaviour Profiles Build</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <meta name="author" content="Shark-Blades" />
  <meta name="description" content="3D ghost hunting prototype built with Babylon.js" />
  <meta name="keywords" content="PhasmaPhoney, Phasmophobia, ghost, hunting, game, HTML, Babylon.js" />

  <!-- Babylon core + loaders (local) -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/earcut.min.js"></script>
  <script src="./cdn/meshopt_decoder.js"></script>
  <script src="./cdn/draco_decoder_gltf.js"></script>
  <script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
  <script src="./cdn/gui/babylon.gui.min.js"></script>
  <script src="./cdn/inspector/babylon.inspector.bundle.js"></script>

  <style>
    html, body { margin:0; height:100%; width:100%; background:#000; overflow:hidden; font-family:system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial; color:#0ff; }
    #renderCanvas { width:100vw; height:100vh; touch-action:none; display:block; background:#000; }

    /* Title */
    #title-screen{ position:fixed; inset:0; background:rgba(0,0,0,0.9); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999;}
    #title-content{ text-align:center; max-width:90vw;}
    #title-logo{ max-width:56vw; max-height:34vh; object-fit:contain; margin-bottom:18px;}
    #start-button{ padding:14px 28px; font-size:20px; cursor:pointer; border:2px solid #0ff; color:#0ff; background:#111; box-shadow:0 0 14px rgba(0,255,255,0.25); border-radius:10px; }
    #start-button:active{ transform:translateY(1px); }

    /* HUD */
    #hud{ position:fixed; top:10px; left:10px; z-index:6000; background:rgba(0,0,0,0.5); border:1px solid #066; padding:8px 10px; border-radius:8px; min-width:280px; display:none; flex-direction:column; gap:6px; }
    #hud .row{ display:flex; gap:10px; align-items:center; justify-content:space-between; }
    #hud .label{ color:#9ff; font-size:12px; }
    #hud .value{ color:#0ff; font-weight:bold; font-family:monospace; }

    /* Action bar */
    #actions{ position:fixed; right:10px; bottom:12px; display:flex; flex-direction:column; gap:8px; z-index:6000; }
    .a-btn{ border:1px solid #0aa; background:#101515; color:#0ff; padding:8px 12px; border-radius:10px; cursor:pointer; }

    /* Touch zones: left = move, right = look (50% width each), 20% lower (anchor bottom with padding) */
    .touch-zone{ position:fixed; bottom:8%; top:42%; /* ~20% lower than mid */ z-index:5000; pointer-events:auto; }
    #zone-move{ left:0; width:50vw; }
    #zone-look{ right:0; width:50vw; }
    .touch-hint{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); opacity:0.18; color:#9ff; font-size:12px; }

    /* Toast */
    #toast{ position:fixed; left:50%; top:12px; transform:translateX(-50%); background:rgba(0,0,0,0.75); border:1px solid #066; border-radius:8px; padding:8px 12px; color:#0ff; z-index:10001; display:none; max-width:70vw; text-align:center; }
  </style>
</head>

<body>
  <!-- Title Screen -->
  <div id="title-screen">
    <div id="title-content">
      <img id="title-logo" src="./logo.png" alt="PhasmaPhoney Logo" />
      <div style="margin:8px 0 16px; color:#9ff;">“Welcome back. Keep the lights on and the sanity high.”</div>
      <button id="start-button">Start Investigation</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="row"><div class="label">Sanity</div><div class="value" id="hud-sanity">100%</div></div>
    <div class="row"><div class="label">Room</div><div class="value" id="hud-room">Van</div></div>
    <div class="row"><div class="label">XYZ</div><div class="value" id="hud-xyz">0.00, 0.00, 0.00</div></div>
    <div class="row"><div class="label">Ghost</div><div class="value" id="hud-ghost">-</div></div>
    <div class="row"><div class="label">Weather</div><div class="value" id="hud-weather">Clear</div></div>
  </div>

  <!-- Action Buttons -->
  <div id="actions" style="display:none;">
    <button id="btn-use" class="a-btn">Use</button>
    <button id="btn-place" class="a-btn">Place</button>
    <button id="btn-toss" class="a-btn">Toss</button>
    <button id="btn-notebook" class="a-btn">Notebook</button>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button id="btn-prev" class="a-btn">Prev</button>
      <button id="btn-next" class="a-btn">Next</button>
    </div>
  </div>

  <!-- Touch zones -->
  <div id="zone-move" class="touch-zone" aria-label="Move zone"><div class="touch-hint">MOVE</div></div>
  <div id="zone-look" class="touch-zone" aria-label="Look zone"><div class="touch-hint">LOOK</div></div>

  <div id="toast"></div>
  <canvas id="renderCanvas"></canvas>

<script>
/* ===========================================================
   TOAST + UTILS
   =========================================================== */
const toastEl = document.getElementById('toast');
function toast(msg, ms=1400){ toastEl.textContent=msg; toastEl.style.display='block'; setTimeout(()=>toastEl.style.display='none', ms); }
function $(q){ return document.querySelector(q); }

/* ===========================================================
   ENGINE / SCENE GLOBALS
   =========================================================== */
const canvas = document.getElementById('renderCanvas');
let engine, scene, camera;
let skybox, cloudMat, moonLight, moonShadows, hemiLight;

let player = { sanity: 100, room: 'Van' };
let weather = { state:'Clear', modSanityDrain:1.0, modHuntPace:1.0 };
let ghost = {
  mesh:null, meshFast:null, target:null, hunting:false,
  slowSpeed:0.9, speed:1.4, footAudible:18, stepInterval:0.55,
  home:null, roamRadius:12, roomLocked:false, stepVolume:0.38, huntSpeedMul:1.0
};
let currentGhostKey = null;
let favouriteRoom = { name:'Van', center: new BABYLON.Vector3(0,0,0) };

/* Polygon play area (fallback) */
const ghostPolygon = [
  new BABYLON.Vector3(-40, 0, -40),
  new BABYLON.Vector3( 40, 0, -40),
  new BABYLON.Vector3( 40, 0,  40),
  new BABYLON.Vector3(-40, 0,  40)
];

/* ===========================================================
   GHOST EVIDENCE + BEHAVIOURS
   =========================================================== */
const GHOSTS = {
  spirit:["Spirit Box","Ghost Writing","EMF Level 5"],
  wraith:["Spirit Box","D.O.T.S","EMF Level 5"],
  poltergeist:["Spirit Box","Ghost Writing","Fingerprints"],
  banshee:["D.O.T.S","Fingerprints","Orbs"],
  jinn:["EMF Level 5","Freezing Temps","Fingerprints"],
  mare:["Spirit Box","Ghost Writing","Orbs"],
  revenant:["Ghost Writing","Orbs","Freezing Temps"],
  shade:["Ghost Writing","Freezing Temps","EMF Level 5"],
  demon:["Freezing Temps","Ghost Writing","Fingerprints"],
  yurei:["Freezing Temps","D.O.T.S","Orbs"],
  oni:["EMF Level 5","Freezing Temps","D.O.T.S"],
  yokai:["Spirit Box","D.O.T.S","Orbs"],
  hantu:["Freezing Temps","Ghost Writing","Fingerprints"],
  goryo:["EMF Level 5","D.O.T.S","Fingerprints"],
  myling:["Ghost Writing","EMF Level 5","Fingerprints"],
  onryo:["Freezing Temps","Spirit Box","Orbs"],
  "the twins":["Spirit Box","Freezing Temps","EMF Level 5"],
  raiju:["EMF Level 5","D.O.T.S","Orbs"],
  obake:["EMF Level 5","Orbs","Fingerprints"],
  "the mimic":["Spirit Box","Freezing Temps","Fingerprints"],
  moroi:["Freezing Temps","Ghost Writing","Spirit Box"],
  deogen:["Spirit Box","Ghost Writing","D.O.T.S"],
  thaye:["Ghost Writing","Orbs","D.O.T.S"],
  phantom:["Spirit Box","D.O.T.S","Fingerprints"]
};

const GHOST_BEHAVIOUR = {
  spirit:{wanderRadius:8,lockFavouriteRoom:false,huntSanityMult:1.0,special:{}},
  wraith:{wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.0,special:{}},
  poltergeist:{wanderRadius:8,lockFavouriteRoom:false,huntSanityMult:1.0,special:{}},
  banshee:{wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.0,special:{prefersTarget:true}},
  jinn:{wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.0,special:{}},
  mare:{wanderRadius:8,lockFavouriteRoom:false,huntSanityMult:1.0,special:{dislikesLight:true}},
  revenant:{wanderRadius:12,lockFavouriteRoom:false,huntSanityMult:1.1,special:{fastOnLine:true}},
  shade:{wanderRadius:7,lockFavouriteRoom:false,huntSanityMult:0.95,special:{shy:true}},
  demon:{wanderRadius:12,lockFavouriteRoom:false,huntSanityMult:1.2,special:{earlyHunts:true}},
  yurei:{wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.05,special:{}},
  oni:{wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.05,special:{}},
  yokai:{wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.0,special:{voiceAgro:true}},
  hantu:{wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.0,special:{coldFast:true}},
  goryo:{wanderRadius:4,lockFavouriteRoom:true,huntSanityMult:1.0,special:{}},
  myling:{wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.0,special:{quietSteps:true}},
  onryo:{wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.0,special:{fireTrigger:true}},
  "the twins":{wanderRadius:12,lockFavouriteRoom:false,huntSanityMult:1.05,special:{twins:true}},
  raiju:{wanderRadius:12,lockFavouriteRoom:false,huntSanityMult:1.1,special:{fastNearElectronics:true}},
  obake:{wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.0,special:{}},
  "the mimic":{wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.0,special:{mimicOrbsInRoom:true}},
  moroi:{wanderRadius:12,lockFavouriteRoom:false,huntSanityMult:1.1,special:{curseBreath:true}},
  deogen:{wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.0,special:{knowsPlayer:true,slowClose:true}},
  thaye:{wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.0,special:{agesOverTime:true}},
  phantom:{wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.0,special:{}}
};
let activeBehaviour = null;

function getBehaviourFor(key){ return GHOST_BEHAVIOUR[(key||'').toLowerCase()] || {wanderRadius:10,lockFavouriteRoom:false,huntSanityMult:1.0,special:{}}; }

/* ===========================================================
   STARTUP FLOW
   =========================================================== */
document.getElementById('start-button').addEventListener('click', safeStart);
async function safeStart(){
  document.getElementById('title-screen').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('actions').style.display='flex';

  engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true, disableWebGL2Support:false });
  scene = new BABYLON.Scene(engine);
  scene.collisionsEnabled = true;
  scene.gravity = new BABYLON.Vector3(0, -0.5, 0);

  camera = new BABYLON.UniversalCamera("playerCam", new BABYLON.Vector3(0, 1.7, -6), scene);
  camera.attachControl(canvas, true);
  camera.applyGravity = true;
  camera.checkCollisions = true;
  camera.ellipsoid = new BABYLON.Vector3(0.35, 0.9, 0.35);
  camera.ellipsoidOffset = new BABYLON.Vector3(0, 0.4, 0);
  camera.minZ = 0.1; camera.inertia = 0;

  setupNightAtmosphere();

  // Load map
  await loadMap().catch(e=>console.warn("Map load failed:", e));

  // Seed favourite room at start point on ground
  favouriteRoom.center = camera.position.clone();
  favouriteRoom.center.y = pickGroundHeightAt(favouriteRoom.center.x, favouriteRoom.center.z);

  // Pick a ghost, apply behaviour
  const keys = Object.keys(GHOSTS);
  currentGhostKey = keys[Math.floor(Math.random()*keys.length)];
  activeBehaviour = getBehaviourFor(currentGhostKey);
  $('#hud-ghost').textContent = currentGhostKey.toUpperCase();

  // Myling foot radius damp
  if (activeBehaviour.special.quietSteps) ghost.footAudible = 8;

  await loadGhostMeshes(currentGhostKey).catch(()=>{});

  // Render + update
  scene.onBeforeRenderObservable.add(()=>{
    const dt = engine.getDeltaTime()/1000;
    updateGhost(dt);
    updateSanity(dt);
    updateHUD();
  });

  engine.runRenderLoop(()=> scene.render());
  window.addEventListener('resize', ()=> engine.resize());

  // Pointer lock on click for better mouse look
  canvas.addEventListener('click', ()=>{
    if (document.pointerLockElement !== canvas) canvas.requestPointerLock();
  });

  initTouchZones();
  initActionButtons();

  toast(`Ghost: ${currentGhostKey.toUpperCase()}`);
}

/* ===========================================================
   ATMOSPHERE
   =========================================================== */
function setupNightAtmosphere(){
  scene.clearColor = new BABYLON.Color4(0.01,0.01,0.02,1);
  hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  hemiLight.intensity = 0.15;

  moonLight = new BABYLON.DirectionalLight("moonLight", new BABYLON.Vector3(-0.2,-1,0.1), scene);
  moonLight.position = new BABYLON.Vector3(0,200,0);
  moonLight.intensity = 0.45;

  moonShadows = new BABYLON.ShadowGenerator(2048, moonLight);
  moonShadows.useBlurExponentialShadowMap = true;
  moonShadows.blurKernel = 16;
  moonShadows.bias = 0.001;

  cloudMat = new BABYLON.StandardMaterial("cloudSky", scene);
  cloudMat.backFaceCulling = false;
  cloudMat.disableLighting = true;
  cloudMat.diffuseTexture = new BABYLON.Texture("./assets/images/sky/clouds_night.jpg", scene);
  cloudMat.diffuseTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
  cloudMat.emissiveColor = new BABYLON.Color3(0.02,0.03,0.07);
  cloudMat.disableDepthWrite = true;

  skybox = BABYLON.MeshBuilder.CreateBox("skybox", { size: 1500 }, scene);
  skybox.material = cloudMat; skybox.infiniteDistance = true; skybox.isPickable = false;
}

/* ===========================================================
   MAP LOADING
   =========================================================== */
async function loadMap(){
  try{
    const res = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/map/", "Abandoned_House.glb", scene);
    const root = res.meshes[0] || res.meshes.find(m=>m.name==="__root__");
    res.meshes.forEach(m=>{ m.checkCollisions = true; m.receiveShadows = true; });
    moonShadows.addShadowCaster(root, true);
  }catch(e){
    // fallback ground
    const ground = BABYLON.MeshBuilder.CreateGround("fallbackGround", { width:200, height:200 }, scene);
    ground.checkCollisions = true;
    const gmat = new BABYLON.StandardMaterial("gmat", scene);
    gmat.diffuseColor = new BABYLON.Color3(0.06,0.08,0.12); gmat.specularColor = new BABYLON.Color3(0,0,0);
    ground.material = gmat;
  }
}

/* ===========================================================
   GHOST LOADING (GLB with fallback cube)
   =========================================================== */
async function loadGhostMeshes(key){
  const list = ["ghost1.glb","ghost2.glb","ghost3.glb","ghost4.glb","ghost5.glb"];
  const pick = list[Math.floor(Math.random()*list.length)];
  try{
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/ghosts/", pick, scene);
    ghost.mesh = r.meshes[0] || r.meshes.find(m=>m.name==="__root__");
    ghost.mesh.isPickable = false; ghost.mesh.checkCollisions = false;
    const bb = ghost.mesh.getHierarchyBoundingVectors(true);
    const height = bb.max.y - bb.min.y;
    const scale = (1.9 / (height || 1));
    ghost.mesh.scaling = new BABYLON.Vector3(scale, scale, scale);
    ghost.mesh.position = favouriteRoom.center.clone();
    ghost.mesh.position.y = pickGroundHeightAt(ghost.mesh.position.x, ghost.mesh.position.z);
    moonShadows.addShadowCaster(ghost.mesh, true);
  }catch(e){
    console.warn("Ghost glb load failed, using cube fallback:", e);
    const m = BABYLON.MeshBuilder.CreateBox("ghostCube",{size:1.0},scene);
    const mat = new BABYLON.StandardMaterial("gmat", scene);
    mat.alpha = 0.35; mat.emissiveColor = new BABYLON.Color3(0.6,0.9,1.0);
    m.material = mat; m.isPickable=false;
    ghost.mesh = m;
    ghost.mesh.position = favouriteRoom.center.clone();
    ghost.mesh.position.y = pickGroundHeightAt(ghost.mesh.position.x, ghost.mesh.position.z) + 0.5;
  }
  ghost.home = ghost.mesh.position.clone();
  const bhv = activeBehaviour || {};
  ghost.roamRadius = bhv.wanderRadius || 12;
  ghost.roomLocked = !!bhv.lockFavouriteRoom;
  ghost.huntSpeedMul = bhv.huntSanityMult || 1.0;
  ghost.stepVolume = (bhv.special && bhv.special.quietSteps) ? 0.22 : 0.38;

  // Mimic: pre-create orb anchor in favourite room
  if (bhv.special && bhv.special.mimicOrbsInRoom){
    setupMimicRoomOrbs(ghost.home);
  }
}

/* ===========================================================
   HELPERS
   =========================================================== */
function pickGroundHeightAt(x, z){
  const ray = new BABYLON.Ray(new BABYLON.Vector3(x, 80, z), new BABYLON.Vector3(0,-1,0), 200);
  const hit = scene.pickWithRay(ray, m=> m && m.isPickable !== false);
  if(hit.hit && hit.pickedPoint) return hit.pickedPoint.y;
  return 0.0;
}
function randomPointInCircleXZ(center, radius){
  const a = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random()) * radius;
  return new BABYLON.Vector3(center.x + Math.cos(a)*r, 0, center.z + Math.sin(a)*r);
}

/* ===========================================================
   MIMIC ORBS (visible only with Camera+IR; here we gate by key 'I')
   =========================================================== */
let mimicOrbs = null, irOn=false;
function setupMimicRoomOrbs(center){
  const ps = new BABYLON.ParticleSystem("mimicOrbs", 200, scene);
  ps.particleTexture = new BABYLON.Texture("./assets/images/particles/smoke.png", scene, true);
  ps.color1 = new BABYLON.Color4(1,1,1,0.8);
  ps.color2 = new BABYLON.Color4(1,1,1,0.2);
  ps.minSize = 0.02; ps.maxSize = 0.06;
  ps.minLifeTime = 0.8; ps.maxLifeTime = 1.6;
  ps.emitRate = 0;
  ps.direction1 = new BABYLON.Vector3(-0.05, 0.08, 0.05);
  ps.direction2 = new BABYLON.Vector3(0.05, 0.12, -0.05);
  ps.gravity = new BABYLON.Vector3(0,0,0);
  ps.updateSpeed = 0.02;
  ps.disposeOnStop = false;
  const anchor = new BABYLON.TransformNode("mimicOrbsAnchor", scene);
  anchor.position = center.clone().add(new BABYLON.Vector3(0,1.6,0));
  ps.emitter = anchor; ps.start();
  mimicOrbs = { ps, anchor };
}
function setIR(on){
  irOn = !!on;
  // Gate emission
  if (mimicOrbs){
    const isMimic = (currentGhostKey||'').toLowerCase()==='the mimic';
    const close = BABYLON.Vector3.Distance(camera.position, mimicOrbs.anchor.position) < 10;
    mimicOrbs.ps.emitRate = (on && isMimic && close) ? 220 : 0;
  }
}
window.addEventListener('keydown', (e)=>{
  if (e.key === 'i' || e.key === 'I'){ setIR(!irOn); toast(irOn?'IR ON':'IR OFF'); }
});

/* ===========================================================
   UPDATE LOOPS
   =========================================================== */
function updateHUD(){
  const p = camera?.position || new BABYLON.Vector3(0,0,0);
  $('#hud-xyz').textContent = `${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)}`;
  $('#hud-sanity').textContent = `${player.sanity|0}%`;
  $('#hud-room').textContent = inFavRoom(p) ? 'Ghost Room' : 'Grounds';
  $('#hud-weather').textContent = weather.state;
}
function updateSanity(dt){
  const nearGhost = ghost.mesh ? BABYLON.Vector3.Distance(ghost.mesh.position, camera.position) < 7 : false;
  const base = 0.6/60;
  const add = nearGhost ? 1.2/60 : 0;
  const drain = (base+add) * (weather.modSanityDrain||1);
  player.sanity = Math.max(0, player.sanity - drain*dt*60);
}
function inFavRoom(pos){
  const v = pos.subtract(favouriteRoom.center); v.y=0;
  return v.length() <= (activeBehaviour?.wanderRadius || 10) + 0.5;
}

let footTimer = 0;
function updateGhost(dt){
  if(!ghost.mesh) return;
  const bhv = activeBehaviour || {};

  // Select/refresh wander target
  if(!ghost.hunting){
    if(!ghost.target || BABYLON.Vector3.Distance(ghost.mesh.position, ghost.target) < 1.0){
      const raw = randomPointInCircleXZ(favouriteRoom.center, bhv.wanderRadius || 10);
      const clamped = clampToFavourite(raw);
      clamped.y = pickGroundHeightAt(clamped.x, clamped.z);
      ghost.target = clamped;
    }
  }

  // Move toward target (simple steering)
  const target = ghost.hunting ? camera.position : ghost.target;
  if (target){
    const pos = ghost.mesh.position;
    const dir = target.subtract(pos); dir.y = 0;
    const d = dir.length();
    if (d > 0.001){
      dir.normalize();
      const hasLOS = ghost.hunting && BABYLON.Vector3.Distance(ghost.mesh.position, camera.position) < 14;
      const electronicsActive = false; // plug into your electronics system later
      const raijuBoost = (bhv.special.fastNearElectronics && electronicsActive) ? 1.25 : 1.0;
      const hantuBoost = (bhv.special.coldFast && weather.state==='Snow') ? 1.18 : 1.0;
      const revBoost = (bhv.special.fastOnLine && hasLOS) ? 1.35 : 1.0;
      const paceMul = ghost.hunting ? (2.2 * (weather.modHuntPace||1) * (ghost.huntSpeedMul||1) * raijuBoost * hantuBoost * revBoost) : 1.2;
      ghost.mesh.moveWithCollisions(dir.scale((ghost.hunting?ghost.speed:ghost.slowSpeed) * dt * paceMul));
      // face direction
      const yaw = Math.atan2(dir.x, dir.z);
      ghost.mesh.rotation.y = yaw;
    }
  }

  // Clamp to favourite if room locked
  if (bhv.lockFavouriteRoom){
    ghost.mesh.position = biasTowardFavourite(ghost.mesh.position, bhv.wanderRadius||4);
  }

  // Footsteps (audibility)
  footTimer -= dt;
  if (footTimer <= 0){
    const dist = BABYLON.Vector3.Distance(ghost.mesh.position, camera.position);
    const audible = dist < ghost.footAudible;
    if (ghost.hunting && audible){
      // simple step cue via console; wire audio pool in your main build
      // console.log("ghost step");
    }
    footTimer = ghost.stepInterval + Math.random()*0.12;
  }
}

function clampToFavourite(target){
  const bhv = activeBehaviour || {};
  if (!favouriteRoom || !favouriteRoom.center) return target;
  const c = favouriteRoom.center;
  const v = target.subtract(c); v.y = 0;
  const r = bhv.wanderRadius || 10;
  if (v.length() <= r) return target;
  v.normalize();
  const clamped = c.add(v.scale(r));
  clamped.y = pickGroundHeightAt(clamped.x, clamped.z);
  return clamped;
}
function biasTowardFavourite(pos, r){
  const c = favouriteRoom.center; const v = pos.subtract(c); v.y = 0;
  const d = v.length();
  if (d <= r) return pos;
  v.normalize();
  const p = c.add(v.scale(r * 0.98));
  p.y = pickGroundHeightAt(p.x, p.z);
  return p;
}

/* ===========================================================
   INPUT: POINTER LOCK LOOK + TOUCH ZONES
   =========================================================== */
let lookYaw = 0, lookPitch = 0;
canvas.addEventListener('mousemove', (e)=>{
  if (document.pointerLockElement === canvas){
    const sens = 0.0026; // higher sensitivity for less travel
    lookYaw -= e.movementX * sens;
    lookPitch -= e.movementY * sens;
    lookPitch = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1, lookPitch));
    if (camera){ camera.rotation.y = lookYaw; camera.rotation.x = lookPitch; }
  }
});

function initTouchZones(){
  const move = document.getElementById('zone-move');
  const look = document.getElementById('zone-look');

  // Movement vector from left zone drag
  let mv = {x:0,z:0}, activeL=false, lastL=null;
  function onMoveTouch(e){
    if (!activeL) return;
    const t = e.changedTouches ? e.changedTouches[0] : e;
    const r = move.getBoundingClientRect();
    const nx = (t.clientX - (r.left + r.width*0.5)) / (r.width*0.5);
    const ny = (t.clientY - (r.top + r.height*0.5)) / (r.height*0.5);
    mv.x = Math.max(-1, Math.min(1, nx));
    mv.z = Math.max(-1, Math.min(1, -ny));
  }
  move.addEventListener('touchstart', (e)=>{ activeL=true; onMoveTouch(e); }, {passive:false});
  move.addEventListener('touchmove',  (e)=>{ onMoveTouch(e); e.preventDefault(); }, {passive:false});
  move.addEventListener('touchend',   ()=>{ activeL=false; mv.x=0; mv.z=0; }, {passive:false});

  // Apply movement each frame
  scene.onBeforeRenderObservable.add(()=>{
    if (!camera) return;
    const speed = 1.2 * (engine.getDeltaTime()/1000) * 6.0;
    if (mv.x!==0 || mv.z!==0){
      const fwd = camera.getForwardRay().direction; fwd.y=0; fwd.normalize();
      const right = BABYLON.Vector3.Cross(fwd, BABYLON.Axis.Y).scale(-1);
      const desired = fwd.scale(mv.z).add(right.scale(mv.x)).normalize();
      camera.cameraDirection = desired.scale(speed);
    } else {
      camera.cameraDirection = BABYLON.Vector3.Zero();
    }
  });

  // Look zone drag -> rotate camera; high sensitivity so small thumb motion works
  let activeR=false;
  function onLookTouch(e){
    if (!activeR) return;
    const t = e.changedTouches ? e.changedTouches[0] : e;
    const sens = 0.012; // mobile sens > mouse
    if (typeof onLookTouch._lastX==='number'){
      const dx = t.clientX - onLookTouch._lastX;
      const dy = t.clientY - onLookTouch._lastY;
      lookYaw   -= dx * sens;
      lookPitch -= dy * sens;
      lookPitch = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1, lookPitch));
      if (camera){ camera.rotation.y = lookYaw; camera.rotation.x = lookPitch; }
    }
    onLookTouch._lastX = t.clientX;
    onLookTouch._lastY = t.clientY;
  }
  look.addEventListener('touchstart', (e)=>{ activeR=true; onLookTouch._lastX=undefined; onLookTouch(e); }, {passive:false});
  look.addEventListener('touchmove',  (e)=>{ onLookTouch(e); e.preventDefault(); }, {passive:false});
  look.addEventListener('touchend',   ()=>{ activeR=false; onLookTouch._lastX=undefined; }, {passive:false});
}
