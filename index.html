<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);
let scene, camera, player, ghostEntity, roomZones = {};

async function createScene() {
  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color3.Black();

  // Camera & Light
  camera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(0, 2, -20), scene);
  camera.attachControl(canvas, true);
  camera.speed = 0.5;
  new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

  // Ground
  const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 200, height: 200 }, scene);
  const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
  groundMat.diffuseColor = new BABYLON.Color3(0.15, 0.1, 0.1);
  ground.material = groundMat;

  // Road
  const road = BABYLON.MeshBuilder.CreateBox("road", { width: 60, height: 0.1, depth: 10 }, scene);
  road.position = new BABYLON.Vector3(0, 0.05, -25);
  road.material = new BABYLON.StandardMaterial("roadMat", scene);
  road.material.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);

  // Sidewalk
  const sidewalk = BABYLON.MeshBuilder.CreateBox("sidewalk", { width: 6, height: 0.1, depth: 20 }, scene);
  sidewalk.position = new BABYLON.Vector3(0, 0.05, -12);
  sidewalk.material = new BABYLON.StandardMaterial("sidewalkMat", scene);
  sidewalk.material.diffuseColor = new BABYLON.Color3(0.6, 0.6, 0.6);

  // House
  const house = BABYLON.MeshBuilder.CreateBox("house", { width: 30, height: 10, depth: 30 }, scene);
  house.position = new BABYLON.Vector3(0, 5, 10);
  house.material = new BABYLON.StandardMaterial("houseMat", scene);
  house.material.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.2);
  house.material.alpha = 0.7;

  // Van
  const van = BABYLON.MeshBuilder.CreateBox("van", { width: 5, height: 3, depth: 10 }, scene);
  van.position = new BABYLON.Vector3(0, 1.5, -18);
  van.material = new BABYLON.StandardMaterial("vanMat", scene);
  van.material.diffuseColor = new BABYLON.Color3(0.8, 0.8, 1.0);

  // Room Zones (invisible boxes)
  const roomPositions = {
    "Foyer": [0, 5, 2],
    "Living Room": [-8, 5, 6],
    "Kitchen": [8, 5, 6],
    "Dining Room": [8, 5, 12],
    "Bathroom": [-8, 5, 12],
    "Master Bedroom": [0, 5, 18],
    "Kids Room": [-8, 5, 18],
    "Basement": [0, 2, 10],
    "Garage": [15, 5, 10]
  };

  for (let room in roomPositions) {
    const zone = BABYLON.MeshBuilder.CreateBox(room, { width: 6, height: 10, depth: 6 }, scene);
    zone.position = new BABYLON.Vector3(...roomPositions[room]);
    zone.isVisible = false;
    zone.isPickable = false;
    roomZones[room] = zone;
  }

  // Ghost Entity (starts invisible)
  ghostEntity = BABYLON.MeshBuilder.CreateSphere("ghost", { diameter: 1 }, scene);
  ghostEntity.position = new BABYLON.Vector3(0, 2, 10);
  const ghostMat = new BABYLON.StandardMaterial("ghostMat", scene);
  ghostMat.alpha = 0;
  ghostMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
  ghostEntity.material = ghostMat;

  return scene;
}
</script>

<script>
const player = {
  heldItems: [null, null, null], // 3 usable items
  lighter: true,
  journal: true,
  position: new BABYLON.Vector3(0, 2, -20),
};

function movePlayer(dir) {
  const speed = 1;
  const delta = {
    up: new BABYLON.Vector3(0, 0, speed),
    down: new BABYLON.Vector3(0, 0, -speed),
    left: new BABYLON.Vector3(-speed, 0, 0),
    right: new BABYLON.Vector3(speed, 0, 0)
  };
  const newPos = player.position.add(delta[dir]);
  player.position = newPos;
  camera.position = newPos;
  updateRoomDetection();
}

window.addEventListener("keydown", e => {
  if (e.key === "w") movePlayer("up");
  if (e.key === "s") movePlayer("down");
  if (e.key === "a") movePlayer("left");
  if (e.key === "d") movePlayer("right");
});

function updateInventoryHUD() {
  for (let i = 0; i < 3; i++) {
    document.getElementById("slot-" + (i + 1)).textContent = player.heldItems[i] || "Empty";
  }
}
</script>

<script>
const ghostProfiles = {
  Spirit:        { evidence: ["EMF5", "Spirit Box", "Ghost Writing"], behavior: {} },
  Wraith:        { evidence: ["EMF5", "Spirit Box", "D.O.T.S"], behavior: { floats: true } },
  Phantom:       { evidence: ["Spirit Box", "Fingerprints", "D.O.T.S"], behavior: { disappearsOnPhoto: true } },
  Poltergeist:   { evidence: ["Spirit Box", "Fingerprints", "Ghost Writing"], behavior: { throwsItems: true } },
  Banshee:       { evidence: ["Orbs", "Fingerprints", "D.O.T.S"], behavior: { prefersOneTarget: true } },
  // ... (Include all remaining 25 ghosts including Mimic and Succubus later)
};

let ghost = {
  name: "",
  evidence: [],
  currentRoom: "",
  visible: false,
  cooldown: 0,
};

function selectRandomGhost() {
  const keys = Object.keys(ghostProfiles);
  ghost.name = keys[Math.floor(Math.random() * keys.length)];
  ghost.evidence = ghostProfiles[ghost.name].evidence;
}

function randomlyChangeGhostRoom() {
  if (ghost.name === "Goryo") return; // Goryo never changes rooms
  if (Math.random() < 0.02) {
    ghost.currentRoom = getRandomRoom(); // Invisible zones only for now
  }
}

function ghostVisibilityLogic() {
  if (Math.random() < 0.1) {
    ghost.visible = !ghost.visible;
  }
}
</script>

<script>
let sanity = 100;

function drainSanity(base = 1) {
  let roomFactor = (playerRoom === ghost.currentRoom) ? 2 : 1;
  let ghostNearby = BABYLON.Vector3.Distance(player.position, ghostMesh.position) < 6;
  let multiplier = ghostNearby ? 2 : 1;
  sanity -= base * roomFactor * multiplier;
  sanity = Math.max(0, sanity);
  updateHUD();
}
</script>

<script>
function checkForEvidence(item) {
  const e = ghost.evidence;
  if (item === "EMF Reader" && e.includes("EMF5") && playerRoom === ghost.currentRoom && Math.random() < 0.5) {
    log("📶 EMF Level 5 detected!");
  } else if (item === "Spirit Box" && e.includes("Spirit Box") && playerRoom === ghost.currentRoom && Math.random() < 0.5) {
    log("📻 Spirit Box response heard.");
  } else if (item === "D.O.T.S" && e.includes("D.O.T.S") && playerRoom === ghost.currentRoom && ghost.visible) {
    log("💨 Fast movement through D.O.T.S!");
  } else if (item === "Ghost Writing Book" && e.includes("Ghost Writing") && playerRoom === ghost.currentRoom && Math.random() < 0.3) {
    log("📓 Ghost Writing appeared!");
  } else if (item === "UV Light" && e.includes("Fingerprints") && playerRoom === ghost.currentRoom && Math.random() < 0.4) {
    log("🖐️ Fingerprints visible on door.");
  } else if (item === "Video Camera" && e.includes("Orbs") && playerRoom === ghost.currentRoom && Math.random() < 0.6) {
    log("🔮 Ghost Orbs seen through camera.");
  }
}
</script>

<script>
let ghostMesh;

function addGhostMesh(scene) {
  ghostMesh = BABYLON.MeshBuilder.CreateSphere("ghost", { diameter: 1.5 }, scene);
  ghostMesh.material = new BABYLON.StandardMaterial("ghostMat", scene);
  ghostMesh.material.emissiveColor = new BABYLON.Color3(0.6, 0.6, 1);
  ghostMesh.visibility = 0;
  ghostMesh.position = new BABYLON.Vector3(0, 2, 10);
}
</script>

<script>
const roomZones = [
  { name: "Living Room", zone: new BABYLON.Vector3(0, 0, 10), radius: 6 },
  { name: "Basement", zone: new BABYLON.Vector3(-12, 0, 10), radius: 5 },
  { name: "Garage", zone: new BABYLON.Vector3(12, 0, 10), radius: 5 },
  { name: "Kitchen", zone: new BABYLON.Vector3(0, 0, 20), radius: 6 },
  { name: "Van", zone: new BABYLON.Vector3(0, 0, -18), radius: 4 }
];

let playerRoom = "Unknown";

function updatePlayerRoom() {
  for (let zone of roomZones) {
    if (BABYLON.Vector3.Distance(player.position, zone.zone) < zone.radius) {
      playerRoom = zone.name;
      return;
    }
  }
  playerRoom = "Outside";
}
</script>

<script>
let turnCount = 0;
let lastRoamTurn = 0;

function advanceTurn() {
  turnCount++;
  updatePlayerRoom();
  drainSanity();

  if (turnCount - lastRoamTurn > 4 + Math.floor(Math.random() * 4)) {
    randomlyChangeGhostRoom();
    lastRoamTurn = turnCount;
    log(`📍 You hear distant movement...`);
  }

  ghostVisibilityLogic();
  updateGhostVisibility();

  maybeTriggerHunt();
  updateHUD();
}
</script>

<script>
function updateGhostVisibility() {
  if (ghost.visible && playerRoom === ghost.currentRoom) {
    ghostMesh.visibility = 1;
    ghostMesh.position = roomZones.find(z => z.name === ghost.currentRoom)?.zone || ghostMesh.position;
  } else {
    ghostMesh.visibility = 0;
  }
}
</script>

<script>
let isHunting = false;
let huntCooldown = 0;

function maybeTriggerHunt() {
  if (isHunting || huntCooldown > 0 || sanity > 25) return;

  let ghostAggression = ghostProfiles[ghost.name]?.behavior?.aggressive ? 0.25 : 0.12;
  if (Math.random() < ghostAggression) {
    beginHunt();
  }
}

function beginHunt() {
  isHunting = true;
  huntCooldown = 6;
  log("💀 The air turns cold... the ghost is hunting!");

  ghostMesh.visibility = 1;
  ghostMesh.position = player.position.clone();
  
  setTimeout(() => {
    if (BABYLON.Vector3.Distance(player.position, ghostMesh.position) < 4) {
      log("☠️ You were caught by the ghost.");
      endGame(false);
    } else {
      log("🫣 You managed to hide just in time.");
    }
    isHunting = false;
    ghost.visible = false;
  }, 3000);
}

function reduceCooldowns() {
  if (huntCooldown > 0) huntCooldown--;
}
</script>

<script>

];

let heldItems = [];
let roomItems = {}; // { roomName: [itemNames] }

function addItemToInventory(item) {
  if (heldItems.length >= 3) return false;
  heldItems.push(item);
  updateItemBar();
  return true;
}

function dropItem(item) {
  heldItems = heldItems.filter(i => i !== item);
  if (!roomItems[playerRoom]) roomItems[playerRoom] = [];
  roomItems[playerRoom].push(item);
  updateItemBar();
}

function pickUpItem(item) {
  if (addItemToInventory(item)) {
    roomItems[playerRoom] = roomItems[playerRoom].filter(i => i !== item);
    log(`📦 Picked up ${item}`);
  } else {
    log("🧳 You can't carry more than 3 items.");
  }
}
</script>

}

function drainSanity() {
  let drain = sanityDrainBase;

  if (playerRoom === ghostRoom) drain += 2;
  if (isGhostNearPlayer()) drain += 3;

  sanity -= drain;
  sanity = Math.max(0, sanity);

}

  return ghost.isVisible && BABYLON.Vector3.Distance(ghost.position, player.position) < 5;
}

<script>

  if (ghostCooldown > 0) return;
  if (sanity > 25) return;

  const chance = ghostData.aggressive ? 0.2 : 0.05;
  if (Math.random() < chance) {
    triggerHunt();
  }
}

function triggerHunt() {
  ghostVisible = true;
  log("💀 The ghost starts hunting!");
  // Optional: Add flashing screen or red tint
  setTimeout(() => {
    if (playerRoom === ghostRoom && !hasCrucifixProtection()) {
      log("☠️ You were caught during the hunt!");
      endGame(false);
    } else {
      log("😮 You survived the hunt.");
    }
    ghostVisible = false;
    ghostCooldown = 4;

}

}

  if (playerRoom === ghostRoom) drain += 3;

  if (heldItems.includes("Cursed Mirror")) drain += 5;

  sanity -= drain;
  if (sanity < 0) sanity = 0;
  updateHUD();
}

function updateHUD() {
  document.getElementById("hud").innerText = `

}

<script>
function advanceTurn() {
  turnCount++;
  drainSanity();
  handleGhostRoam();
  maybeShowGhost();
  spawnOrbs();
  maybeTriggerHunt();
  updateHUD();

  if (sanity <= 0) {
    log("💀 You lost all sanity.");
    endGame(false);
  }
}

function maybeShowGhost() {
  const appearChance = playerRoom === ghostRoom ? 0.3 : 0.05;
  ghostVisible = Math.random() < appearChance;
}

function maybeTriggerHunt() {
  if (sanity < 30 && Math.random() < 0.2) {
    if (heldItems.includes("Crucifix")) {
      log("✝️ Crucifix repelled the ghost!");
      removeItem("Crucifix");
      return;
    } else if (heldItems.includes("Smudge Stick")) {
      log("💨 You used a Smudge Stick to repel the ghost.");
      removeItem("Smudge Stick");
      return;
    } else {
      log("‼️ The ghost hunts you!");
      endGame(false);
    }
  }
}

function removeItem(name) {
  const index = heldItems.indexOf(name);
  if (index !== -1) heldItems.splice(index, 1);
}
</script>

let ghostRoom = "Kitchen";
let gameGhost = "";

let ghostVisible = false;

function initializeGame() {
  gameGhost = allGhostNames[Math.floor(Math.random() * allGhostNames.length)];
  ghostRoom = allRooms[Math.floor(Math.random() * allRooms.length)];
  heldItems = ["Camera", "Thermometer", "EMF Reader"];
  updateHUD();
  log("🎮 Investigation Started.");
}

<script>
const placedItems = {}; // room -> array
const vanItems = ["Crucifix", "Spirit Box", "Ghost Writing Book", "Smudge Stick"];
let heldItems = [];

function placeItem(item) {
  if (!placedItems[playerRoom]) placedItems[playerRoom] = [];
  placedItems[playerRoom].push(item);
  heldItems = heldItems.filter(i => i !== item);
  log(`📦 Placed ${item} in ${playerRoom}`);
}

function pickupItem(item) {
  if (heldItems.length >= 3) {
    log("❌ Cannot carry more than 3 items.");
    return;
  }
  if (placedItems[playerRoom]) {
    const index = placedItems[playerRoom].indexOf(item);
    if (index !== -1) {
      placedItems[playerRoom].splice(index, 1);
      heldItems.push(item);
      log(`🎒 Picked up ${item}`);
    }
  }
}

function swapFromVan(item) {
  if (heldItems.length >= 3) {
    log("❌ Inventory full.");
    return;
  }
  const index = vanItems.indexOf(item);
  if (index !== -1) {
    heldItems.push(item);
    vanItems.splice(index, 1);
    log(`🚐 Took ${item} from van`);
  }
}
</script>

<script>
function log(msg) {
  const hud = document.getElementById("hud");
  hud.innerText += "\n" + msg;
}
</script>
