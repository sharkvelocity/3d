<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Shark-Blades" />
  <meta name="description" content="Turn-based/BabylonJS ghost hunting prototype" />

  <!-- Babylon core + loaders (use your local CDN copies) -->
  <script src="./cdn/cannon.js"></script>
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/loaders/babylon.glTFFileLoader.min.js"></script>
  <script src="./cdn/gui/babylon.gui.min.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background:#000; color:#0ff; font-family: monospace; overflow: hidden;
    }
    #renderCanvas { width:100vw; height:100vh; touch-action:none; display:block; }

    /* Title screen */
    #title {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; background:rgba(0,0,0,0.9);
      z-index: 2000;
    }
    #title .logo {
      width:min(80vw, 520px); height:min(40vh, 240px);
      background:url("./logo.png") center/contain no-repeat;
      opacity:.2; pointer-events:none; margin-bottom:24px;
    }
    #title button {
      font-family:inherit; font-size:22px; padding:12px 28px;
      background:#111; color:#eee; border:2px solid #666; cursor:pointer;
    }
    #title p { color:#9ff; opacity:.9; margin-top:14px; }

    /* HUD: top-left */
    #hud {
      position:fixed; top:10px; left:10px; display:flex; flex-direction:column;
      gap:6px; z-index:1000; pointer-events:none;
    }
    .chip {
      background:rgba(0,0,0,0.6); border:1px solid #0ff; color:#0ff;
      padding:6px 10px; border-radius:6px; width: fit-content;
      pointer-events:auto;
    }
    #log {
      position:fixed; left:10px; bottom:14px; width: min(560px, 60vw);
      max-height: 35vh; overflow:auto; background:rgba(0,0,0,0.5);
      border:1px solid #0ff; padding:8px; border-radius:6px; z-index:999;
    }
    #log b { color:#9ff; }
    /* Item belt bottom-center */
    #belt {
      position:fixed; left:50%; bottom:8px; transform:translateX(-50%);
      display:flex; gap:8px; padding:8px; background:rgba(0,0,0,0.45);
      border:1px solid #0ff; border-radius:10px; z-index:1100;
    }
    .slot {
      width:64px; height:64px; border:1px solid #0ff; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,12,12,0.5); color:#0ff; position:relative; cursor:pointer;
    }
    .slot .num {
      position:absolute; top:2px; left:6px; font-size:12px; color:#7ff;
      opacity:.9;
    }
    .slot.active { outline:2px solid #fff; }
    .slot img { max-width:70%; max-height:70%; opacity:.9; }
    /* Right-hand overlay item (small model render) */
    #handItem {
      position:fixed; right:16px; bottom:110px; width:220px; height:180px;
      border:1px solid #0ff; border-radius:8px; background:rgba(0,0,0,0.4);
      display:none; z-index: 900;
    }
    /* Dev modal (ESC) */
    #devModal {
      position:fixed; inset:0; background:rgba(0,0,0,0.75);
      display:none; align-items:center; justify-content:center; z-index:3000;
    }
    #devCard {
      background:#111; color:#0ff; border:1px solid #0ff; border-radius:10px;
      width:min(520px, 92vw); padding:18px;
    }
    #devCard h3 { margin:0 0 10px 0; }
    #devCard input[type="password"]{
      width:100%; padding:8px; background:#000; color:#0ff;
      border:1px solid #0ff; border-radius:6px; margin:10px 0 12px 0;
    }
    #devControls { display:none; gap:8px; flex-wrap:wrap; margin-top:8px; }
    #devControls button, #devCard button {
      background:#000; color:#0ff; border:1px solid #0ff; padding:8px 10px;
      border-radius:6px; cursor:pointer;
    }

    /* Simple touch move buttons (only shown on touch) */
    #touchPad {
      position:fixed; right:10px; bottom:10px; display:none; flex-direction:column; gap:6px; z-index:1200;
    }
    #touchPad .row { display:flex; gap:6px; justify-content:center; }
    #touchPad button {
      width:48px; height:48px; border-radius:8px; border:1px solid #0ff; background:rgba(0,0,0,0.45); color:#0ff;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <!-- Title -->
  <div id="title">
    <div class="logo" aria-hidden="true"></div>
    <button id="startBtn">Start Investigation</button>
    <p>“Welcome back. Let’s hope your deduction is better than your taste in candles.”</p>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="chip" id="sanityChip">Sanity: <b id="sanityVal">100%</b></div>
    <div class="chip" id="roomChip">Room: <b id="roomVal">Van</b></div>
    <div class="chip">Turn: <b id="turnVal">0</b></div>
  </div>

  <!-- Item belt -->
  <div id="belt">
    <div class="slot" data-slot="1"><span class="num">1</span><span class="label">—</span></div>
    <div class="slot" data-slot="2"><span class="num">2</span><span class="label">—</span></div>
    <div class="slot" data-slot="3"><span class="num">3</span><span class="label">—</span></div>
    <div class="slot" data-slot="4"><span class="num">4</span><span class="label">Lighter</span></div>
    <div class="slot" data-slot="5"><span class="num">5</span><span class="label">Notebook</span></div>
  </div>

  <!-- Right-hand overlay miniature item render (separate mini-engine) -->
  <canvas id="handItem"></canvas>

  <!-- Text Log -->
  <div id="log"></div>

  <!-- Dev Modal (ESC to open) -->
  <div id="devModal">
    <div id="devCard">
      <h3>Developer Options</h3>
      <div id="devGate">
        <p>Enable developer mode?</p>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="devYes">Yes</button>
          <button id="devNo">No</button>
        </div>
        <div id="devPwdWrap" style="display:none;">
          <p>Enter password:</p>
          <input id="devPwd" type="password" placeholder="••••••••" />
          <button id="devPwdBtn">Unlock</button>
        </div>
      </div>

      <div id="devControls">
        <button id="tpGhostBtn">Teleport to Ghost</button>
        <button id="godBtn">Toggle God Mode</button>
        <button id="pingBtn">Ping XYZ (log location)</button>
        <button id="closeDev">Close</button>
        <p style="margin:8px 0 0;color:#7ff;">PageUp/PageDown fly only when Dev Mode is enabled.</p>
      </div>
    </div>
  </div>

  <!-- Touch controls -->
  <div id="touchPad">
    <div class="row"><button data-dir="w">W</button></div>
    <div class="row">
      <button data-dir="a">A</button>
      <button data-dir="s">S</button>
      <button data-dir="d">D</button>
    </div>
    <div class="row"><button id="useBtn">Use</button></div>
  </div>

<script>
/* =======================
   Small utility logging
======================= */
const logDiv = document.getElementById('log');
function logLine(msg){
  const line = document.createElement('div');
  line.innerHTML = msg;
  logDiv.appendChild(line);
  logDiv.scrollTop = logDiv.scrollHeight;
}

/* =======================
   Game/runtime state
======================= */
const state = {
  engine: null, scene: null, camera: null, light: null,
  handEngine: null, handScene: null, handCamera: null, handLight: null,
  itemsGLB: "./assets/models/items/exploration_objects.glb",
  houseGLB: "./assets/models/map/Abandoned_House.glb",
  ghostGLBs: [
    "./assets/models/ghosts/ghost1.glb",
    "./assets/models/ghosts/ghost2.glb",
    "./assets/models/ghosts/ghost3.glb",
    "./assets/models/ghosts/ghost4.glb",
  ],
  player: {
    pos: new BABYLON.Vector3(37.8045, 0.2, -95.0355), // VAN midpoint spawn (between first two PINGs)
    speed: 0.12,
    sanity: 100,
    turn: 0,
    godMode: false,
    inDev: false,
    currentRoom: "Van",
  },
  barrier: {
    // Your polygon (clockwise) and its bounding rectangle:
    poly: [
      new BABYLON.Vector3(18.404, 0, -96.040),
      new BABYLON.Vector3(57.205, 0, -94.031),
      new BABYLON.Vector3(62.145, 0, -105.142),
      new BABYLON.Vector3(61.872, 0, -149.928),
      new BABYLON.Vector3(18.660, 0, -149.900)
    ],
    bounds: { minX: 18.404, maxX: 62.145, minZ: -149.928, maxZ: -94.031 }
  },
  ghost: {
    mesh: null,
    target: null,
    speed: 0.05
  },
  // Item belt (slots 1..5) — 4=Lighter, 5=Notebook
  belt: {
    slot1: null, // set after items load
    slot2: null,
    slot3: null,
    slot4: "Lighter",
    slot5: "Notebook",
    active: 1,
    meshes: {} // name -> mesh clone (for hand render)
  },
  input: {
    forward: false, back: false, left: false, right: false,
    up: false, down: false // dev fly only
  }
};

/* =======================
   Geometry helpers
======================= */
function clampToBounds(vec){
  const b = state.barrier.bounds;
  vec.x = Math.max(b.minX, Math.min(b.maxX, vec.x));
  vec.z = Math.max(b.minZ, Math.min(b.maxZ, vec.z));
  return vec;
}

// Point-in-polygon (X,Z)
function pointInPolygon(x, z, poly){
  let inside = false;
  for (let i=0,j=poly.length-1; i<poly.length; j=i++){
    const xi = poly[i].x, zi = poly[i].z;
    const xj = poly[j].x, zj = poly[j].z;
    const intersect = ((zi > z) !== (zj > z)) &&
                      (x < (xj - xi) * (z - zi) / (zj - zi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function randomPointInBounds(){
  const b = state.barrier.bounds;
  let x, z;
  // Try a handful of samples until one is inside polygon; fallback to bounds
  for (let i=0; i<16; i++){
    x = b.minX + Math.random()*(b.maxX - b.minX);
    z = b.minZ + Math.random()*(b.maxZ - b.minZ);
    if (pointInPolygon(x, z, state.barrier.poly)) return new BABYLON.Vector3(x, 0.2, z);
  }
  return new BABYLON.Vector3(
    b.minX + Math.random()*(b.maxX - b.minX),
    0.2,
    b.minZ + Math.random()*(b.maxZ - b.minZ)
  );
}

/* =======================
   Engine/Scene setup
======================= */
const canvas = document.getElementById("renderCanvas");
state.engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true, disableWebGL2Support: false });

function createScene(){
  const scene = new BABYLON.Scene(state.engine);
  scene.clearColor = new BABYLON.Color4(0,0,0,1);

  // Physics + gravity + collisions
  const gravity = new BABYLON.Vector3(0, -9.81, 0);
  const cannon = new BABYLON.CannonJSPlugin(true, 10, CANNON);
  scene.enablePhysics(gravity, cannon);
  scene.collisionsEnabled = true;

  // Camera
  const cam = new BABYLON.UniversalCamera("cam", state.player.pos.clone(), scene);
  cam.minZ = 0.1;
  cam.attachControl(canvas, true);
  cam.applyGravity = true;
  cam.checkCollisions = true;
  cam.ellipsoid = new BABYLON.Vector3(0.5, 0.9, 0.5);
  cam.ellipsoidOffset = new BABYLON.Vector3(0, 0.9, 0);

  // WASD
  cam.keysUp = [87];    // W
  cam.keysDown = [83];  // S
  cam.keysLeft = [65];  // A
  cam.keysRight = [68]; // D
  cam.speed = 0.45;

  // Lights
  const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  hemi.intensity = 0.7;

  // Safety fallback ground (invisible, large enough under the house area)
  const fallbackGround = BABYLON.MeshBuilder.CreateGround("safetyGround",
    { width: 80, height: 80, subdivisions: 2 }, scene);
  fallbackGround.position = new BABYLON.Vector3(40, -0.5, -122);
  fallbackGround.checkCollisions = true;
  fallbackGround.isVisible = false;
  fallbackGround.physicsImpostor = new BABYLON.PhysicsImpostor(
    fallbackGround, BABYLON.PhysicsImpostor.BoxImpostor,
    { mass: 0, friction: 0.9, restitution: 0 }, scene
  );

  state.scene = scene;
  state.camera = cam;
  state.light = hemi;

  return scene;
}

/* =======================
   Hand (right overlay) mini renderer
======================= */
const handCanvas = document.getElementById("handItem");
function createHandScene(){
  state.handEngine = new BABYLON.Engine(handCanvas, true);
  const scene = new BABYLON.Scene(state.handEngine);
  scene.clearColor = new BABYLON.Color4(0,0,0,0);
  const cam = new BABYLON.ArcRotateCamera("hcam", Math.PI/2, Math.PI/2.5, 2.2, new BABYLON.Vector3(0,0,0), scene);
  cam.attachControl(handCanvas, false);
  cam.lowerRadiusLimit = 1.6; cam.upperRadiusLimit = 3.2;
  const l = new BABYLON.HemisphericLight("hl", new BABYLON.Vector3(0, 1, 0), scene);
  l.intensity = 0.9;
  state.handScene = scene; state.handCamera = cam; state.handLight = l;
  state.handEngine.runRenderLoop(() => scene.render());
}

/* =======================
   Load world + items + ghost
======================= */
async function loadMapAndItems(){
  const scene = state.scene;

  // Import House
  logLine("<b>Loading map…</b>");
  await BABYLON.SceneLoader.ImportMeshAsync("", state.houseGLB.substring(0, state.houseGLB.lastIndexOf("/") + 1), state.houseGLB.split("/").pop(), scene);

  // Enable collisions for all imported meshes; add static impostors for stability
  scene.meshes.forEach(m => {
    if (m && m.name !== "safetyGround") {
      m.checkCollisions = true;
      if (!m.physicsImpostor && m.getTotalVertices() > 0) {
        try {
          m.physicsImpostor = new BABYLON.PhysicsImpostor(
            m, BABYLON.PhysicsImpostor.MeshImpostor,
            { mass: 0, friction: 0.9, restitution: 0 }, scene
          );
        } catch(e){
          // fallback if mesh impostor fails
          m.physicsImpostor = new BABYLON.PhysicsImpostor(
            m, BABYLON.PhysicsImpostor.BoxImpostor,
            { mass: 0, friction: 0.9, restitution: 0 }, scene
          );
        }
      }
    }
  });
  logLine("<b>Map loaded.</b>");

  // Load Items GLB (so we can clone for belt/hand view)
  logLine("<b>Loading item models (exploration_objects.glb)…</b>");
  const res = await BABYLON.SceneLoader.ImportMeshAsync("", state.itemsGLB.substring(0, state.itemsGLB.lastIndexOf("/") + 1), state.itemsGLB.split("/").pop(), scene);
  const itemRoot = res.meshes[0]; // __root__
  // Index item meshes by an easy label; adjust these names to match your GLB
  const candidates = {};
  res.meshes.forEach(m => {
    candidates[m.name] = m;
  });

  // Map commonly used items to a source mesh (update mappings to your GLB names)
  const itemMap = {
    "EMF": candidates["EMF_Detector_EMF_Detector_0"] || null,
    "Spirit Box": candidates["Cone.001_Spirit_Box_0"] || null,
    "Thermometer": candidates["Thermometer_Thermometer_0"] || null,
    "Camera": candidates["Photo_Camera_Photo_Camera_0"] || null,
    "Flashlight": candidates["Flashlight_Flashlight_0"] || candidates["Flashlight_Poquet_Flashlight_Poquet_0"] || null,
    "Voice Recorder": candidates["Voice_Recorder_Voice_Recorder_0"] || null,
    "Thermal Camera": candidates["Thermal_Camera_Thermal_Camera_0"] || null
  };

  // Hide source item meshes; we’ll clone when needed
  Object.values(itemMap).forEach(m => { if (m) m.setEnabled(false); });

  // Place some defaults into belt 1..3 (editable)
  state.belt.slot1 = "EMF";
  state.belt.slot2 = "Thermometer";
  state.belt.slot3 = "Spirit Box";

  // Keep map for hand renderer clones
  state.belt.meshes = itemMap;

  logLine("<b>Items loaded.</b>");

  await ensureGhostSpawn();
}

/* =======================
   Ghost spawn + wander
======================= */
async function ensureGhostSpawn(){
  if (state.ghost.mesh) return;
  const scene = state.scene;
  const choice = state.ghostGLBs[Math.floor(Math.random()*state.ghostGLBs.length)];
  const basePath = choice.substring(0, choice.lastIndexOf("/") + 1);
  const fileName = choice.split("/").pop();
  const imp = await BABYLON.SceneLoader.ImportMeshAsync("", basePath, fileName, scene);
  // Merge into single transform (first non-root)
  let ghost = null;
  for (const m of imp.meshes){
    if (m.name !== "__root__"){
      ghost = m; break;
    }
  }
  if (!ghost) ghost = imp.meshes[0];
  ghost.name = "GHOST";
  ghost.alwaysSelectAsActiveMesh = true;
  ghost.isPickable = false;
  ghost.checkCollisions = false;
  ghost.position = randomPointInBounds();
  ghost.position.y = 0.2; // ground-ish
  state.ghost.mesh = ghost;
  logLine(`<b>Ghost spawned</b> @ x:${ghost.position.x.toFixed(3)} y:${ghost.position.y.toFixed(3)} z:${ghost.position.z.toFixed(3)}`);

  // set initial target
  state.ghost.target = randomPointInBounds();

  // simple wander loop
  state.scene.onBeforeRenderObservable.add(() => {
    if (!state.ghost.mesh) return;
    const g = state.ghost.mesh;
    const t = state.ghost.target;
    if (!t) return;
    const dir = t.subtract(g.position);
    const dist = dir.length();
    if (dist < 0.25) {
      state.ghost.target = randomPointInBounds();
    } else {
      const step = dir.normalize().scale(state.ghost.speed);
      g.position.addInPlace(step);
      g.position.y = 0.2; // keep grounded
    }
  });
}

/* =======================
   UI wiring (HUD, belt, hand)
======================= */
const sanityVal = document.getElementById("sanityVal");
const roomVal = document.getElementById("roomVal");
const turnVal = document.getElementById("turnVal");

function refreshHUD(){
  sanityVal.textContent = `${state.player.sanity}%`;
  roomVal.textContent = state.player.currentRoom;
  turnVal.textContent = state.player.turn;
}

function populateBelt(){
  // Put labels (or mini icons if you add them)
  const beltDiv = document.getElementById("belt");
  const findSlotDiv = (n) => beltDiv.querySelector(`.slot[data-slot="${n}"]`);

  function setSlot(n, name){
    const div = findSlotDiv(n);
    const label = div.querySelector(".label");
    label.textContent = name || "—";
    if (parseInt(div.dataset.slot,10) === state.belt.active) div.classList.add("active");
    else div.classList.remove("active");
  }
  setSlot(1, state.belt.slot1);
  setSlot(2, state.belt.slot2);
  setSlot(3, state.belt.slot3);
  setSlot(4, "Lighter");
  setSlot(5, "Notebook");

  // Click to select (no auto-use)
  beltDiv.querySelectorAll(".slot").forEach(div => {
    div.onclick = () => {
      const slot = parseInt(div.dataset.slot, 10);
      setActiveSlot(slot);
    };
  });
}

function setActiveSlot(slot){
  if (slot < 1 || slot > 5) return;
  state.belt.active = slot;
  // update visual
  document.querySelectorAll('#belt .slot').forEach(s => s.classList.remove('active'));
  document.querySelector(`#belt .slot[data-slot="${slot}"]`).classList.add('active');
  // show right-hand mini render if item has a model
  const itemName = getActiveItemName();
  showHandItem(itemName);
}

function getActiveItemName(){
  if (state.belt.active === 1) return state.belt.slot1;
  if (state.belt.active === 2) return state.belt.slot2;
  if (state.belt.active === 3) return state.belt.slot3;
  if (state.belt.active === 4) return "Lighter";
  if (state.belt.active === 5) return "Notebook";
  return null;
}

let handCurrentMesh = null;
function showHandItem(itemName){
  const hand = document.getElementById("handItem");
  if (!itemName || !state.belt.meshes[itemName]){
    // special cases (notebook/lighter) – no model? just hide
    if (itemName === "Notebook" || itemName === "Lighter"){
      hand.style.display = "none";
      return;
    }
    hand.style.display = "none";
    return;
  }
  hand.style.display = "block";
  // Clear previous
  if (handCurrentMesh){
    handCurrentMesh.dispose();
    handCurrentMesh = null;
  }
  // clone into the hand scene
  const src = state.belt.meshes[itemName];
  handCurrentMesh = src.clone("hand_"+itemName, null, true);
  state.handScene.addMesh(handCurrentMesh);
  handCurrentMesh.setEnabled(true);
  // center it
  handCurrentMesh.position.set(0,0,0);
  handCurrentMesh.rotationQuaternion = null;
  handCurrentMesh.rotation.set(0, Math.PI*0.2, 0);
  // scale heuristics
  const b = handCurrentMesh.getBoundingInfo().boundingBox;
  const size = b.maximum.subtract(b.minimum);
  const maxSide = Math.max(size.x, size.y, size.z);
  const s = 1.0 / (maxSide || 1.0) * 1.2;
  handCurrentMesh.scaling.set(s,s,s);
}

/* =======================
   Input (WASD + numeric slots + touch)
======================= */
function bindInputs(){
  window.addEventListener('keydown', (e) => {
    if (e.code === "Escape") {
      // open dev modal
      document.getElementById("devModal").style.display = "flex";
      return;
    }
    if (["Digit1","Digit2","Digit3","Digit4","Digit5"].includes(e.code)){
      const slot = parseInt(e.code.replace("Digit",""), 10);
      setActiveSlot(slot);
    }
    if (state.player.inDev){
      if (e.code === "PageUp") state.input.up = true;
      if (e.code === "PageDown") state.input.down = true;
    }
  });
  window.addEventListener('keyup', (e) => {
    if (state.player.inDev){
      if (e.code === "PageUp") state.input.up = false;
      if (e.code === "PageDown") state.input.down = false;
    }
  });

  // Touch controls (show if touch-capable)
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0){
    document.getElementById("touchPad").style.display = "flex";
    const press = (dir, on) => {
      if (dir === 'w') state.scene.onBeforeRenderObservable.addOnce(() => state.camera._keys.push(87));
      if (dir === 's') state.scene.onBeforeRenderObservable.addOnce(() => state.camera._keys.push(83));
      if (dir === 'a') state.scene.onBeforeRenderObservable.addOnce(() => state.camera._keys.push(65));
      if (dir === 'd') state.scene.onBeforeRenderObservable.addOnce(() => state.camera._keys.push(68));
    };
    document.querySelectorAll('#touchPad button[data-dir]').forEach(b => {
      b.addEventListener('click', () => press(b.dataset.dir, true));
    });
    document.getElementById("useBtn").addEventListener('click', useActiveItem);
  }

  // Mouse/key “use” – bind to E
  window.addEventListener('keydown', (e) => {
    if (e.code === "KeyE") useActiveItem();
  });
}

function useActiveItem(){
  const item = getActiveItemName();
  if (!item) return;
  // This is where you wire evidence logic by item
  if (item === "EMF"){
    logLine("<b>EMF</b> crackles faintly… (demo)");
  } else if (item === "Thermometer"){
    logLine("<b>Thermometer</b> hums softly.");
  } else if (item === "Spirit Box"){
    logLine("Static hisses through the <b>spirit box</b>…");
  } else if (item === "Lighter"){
    logLine("<b>Lighter</b> flickers.");
  } else if (item === "Notebook"){
    logLine("<b>Notebook</b> opened (journal UI TBD).");
  }
}

/* =======================
   Dev modal
======================= */
(function devModalInit(){
  const modal = document.getElementById("devModal");
  const devGate = document.getElementById("devGate");
  const devControls = document.getElementById("devControls");
  const devYes = document.getElementById("devYes");
  const devNo = document.getElementById("devNo");
  const pwdWrap = document.getElementById("devPwdWrap");
  const pwdInput = document.getElementById("devPwd");
  const pwdBtn = document.getElementById("devPwdBtn");
  const closeDev = document.getElementById("closeDev");
  const tpGhostBtn = document.getElementById("tpGhostBtn");
  const godBtn = document.getElementById("godBtn");
  const pingBtn = document.getElementById("pingBtn");

  devYes.onclick = () => { pwdWrap.style.display = "block"; };
  devNo.onclick = () => { modal.style.display = "none"; };

  pwdBtn.onclick = () => {
    const v = pwdInput.value.trim();
    if (v === "devmode"){
      state.player.inDev = true;
      devGate.style.display = "none";
      devControls.style.display = "flex";
      logLine("<b>Developer Mode enabled.</b>");
    } else {
      logLine("<b>Incorrect password.</b>");
    }
  };

  closeDev.onclick = () => { modal.style.display = "none"; };

  tpGhostBtn.onclick = () => {
    if (!state.ghost.mesh) { logLine("Ghost not present."); return; }
    // Teleport camera near ghost
    const g = state.ghost.mesh.position;
    state.camera.position.copyFrom(new BABYLON.Vector3(g.x, 1.4, g.z + 1.5));
    logLine(`<b>Teleported near ghost</b> @ x:${g.x.toFixed(3)} y:${g.y.toFixed(3)} z:${g.z.toFixed(3)}`);
  };
  godBtn.onclick = () => {
    state.player.godMode = !state.player.godMode;
    logLine(`<b>God Mode:</b> ${state.player.godMode ? "ON" : "OFF"}`);
  };
  pingBtn.onclick = () => {
    const p = state.camera.position;
    logLine(`PING @ x:${p.x.toFixed(3)} y:${p.y.toFixed(3)} z:${p.z.toFixed(3)}`);
  };
})();

/* =======================
   Start flow
======================= */
document.getElementById("startBtn").onclick = async () => {
  document.getElementById("title").style.display = "none";
  // Build scenes
  const scene = createScene();
  createHandScene();

  // Keep camera within outer bounds each frame; enable dev vertical fly only in dev mode
  scene.onBeforeRenderObservable.add(() => {
    // Clamp X/Z to barrier rectangle (simple guard)
    clampToBounds(state.camera.position);

    // Dev fly vertical
    if (state.player.inDev) {
      if (state.input.up) state.camera.position.y += 0.15;
      if (state.input.down) state.camera.position.y -= 0.15;
    }
  });

  await loadMapAndItems();
  populateBelt();
  setActiveSlot(1);
  refreshHUD();

  logLine(`<b>Investigation started.</b>`);
};

/* =======================
   Render loop + resize
======================= */
state.engine.runRenderLoop(() => {
  if (state.scene) state.scene.render();
});
window.addEventListener("resize", () => {
  state.engine.resize();
  if (state.handEngine) state.handEngine.resize();
});
</script>
