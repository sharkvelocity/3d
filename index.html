    #hud-xyz { position:fixed; top:36px; right:12px; background:rgba(0,0,0,0.5); border:1px solid #066; padding:6px 8px; border-radius:8px; display:none; color:#bfe; z-index:6000; }
    #toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.65); border:1px solid #066; padding:10px 14px; color:#bff; border-radius:10px; z-index:7000; display:none; }

    /* Evidence/Notebook */
    #notebook{ position:fixed; left:12px; bottom:12px; background:rgba(0,0,0,0.6); border:1px solid #066; padding:10px; border-radius:10px; z-index:6200; width:340px; max-height:60vh; overflow:auto;}
    #notebook h3{ margin:4px 0 8px; color:#9ef; }
    #ev-list, #ghost-suggestions{ display:grid; grid-template-columns: repeat(2, 1fr); gap:6px; }
    .ev{ display:flex; gap:6px; align-items:center; }

    .badge{ border:1px solid #066; padding:2px 6px; border-radius:6px; background:rgba(0,0,0,0.4); color:#aff; font-size:12px; }

    /* Item Belt + Mobile */
    #belt{ position:fixed; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:6200; }
    .slot{ width:66px; height:66px; border:1px solid #066; border-radius:8px; display:flex; align-items:center; justify-content:center;
           background:rgba(0,0,0,0.5); color:#aff; font-size:11px; }
    .slot.active{ outline:2px solid #0ff; }
    #mobile-bar{ position:fixed; right:10px; bottom:10px; display:flex; gap:8px; z-index:6200; }

    #dev-panel{ position:fixed; top:10px; left:10px; width:420px; max-height:80vh; overflow:auto;

    .dev-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
    .dev-btn{ border:1px solid #066; background:#00171d; color:#bff; padding:5px 8px; border-radius:6px; font-size:12px; cursor:pointer; }

    .tex-card{ border:1px solid #044; padding:6px; border-radius:6px; background:#000; }
    .tex-card a{ color:#8ff; word-break:break-all; font-size:11px; }

<script>
/*** ==========================================================
    GLOBALS
    ========================================================== ***/
const canvas = document.getElementById('renderCanvas');
let engine, scene, camera, hemiLight, houseRoot, moonMesh;
let sunLight=null, moonLight=null;

const rng = Math.random;
let flyMode = false; // persistent fly toggle

// --- Player ---
const player = {
  sanity: 100,
  inside: false,
  room: 'Exterior',
  speedWalk: 1.6,
  speedRun: 3.0,
  stepUpMax: 0.8,
  hasFire: false, // candle/lighter lit
  electronicsActive: false // flash/uv/dots on
};

// --- Game state ---
const game = {
  started: false,
  breakerOn: true,
  hunt: { active:false, endsAt:0 },
  time: 0,
  lastEvent: 0,
  nextEvent: 8,
  ghost: null,
  ghostVisible: false,
  ghostRoom: 'Living Room',
  mimicTarget: null,
  orbFake: false,
  footprints: [] // {pos, expireAt, mesh}
};

// --- Weather ---
const weather = { state:'Clear' };

// --- Evidence types ---
const EVIDENCE = ['EMF 5','Spirit Box','Ghost Writing','Freezing Temps','Fingerprints','DOTS','Ghost Orbs'];

// --- Simple UI helpers ---
const $ = sel => document.querySelector(sel);
function toast(msg, ms=1300){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t.__tid); t.__tid=setTimeout(()=>t.style.display='none', ms); }
function setHuntUI(active){ $('#hunt-vignette').style.opacity = active ? 1 : 0; $('#hud-hunt').textContent = active?'HUNT':'Calm'; }
</script>

<script>
/*** ==========================================================
    MAP MANIFEST + SKY + BASIC LIGHTS
    ========================================================== ***/
let MAP_FILES = [
  { file: "Abandoned_House.glb", title: "Abandoned House" },
  { file: "furnished_house.glb", title: "Furnished House" }
];

async function loadManifest(){
  try{
    const res = await fetch('./assets/models/map/maps.json', {cache:'no-store'});
    if(res.ok){ const j=await res.json(); if(Array.isArray(j)&&j.length) MAP_FILES=j; }
  }catch(e){}
  const sel = $('#map-select');
  sel.innerHTML = MAP_FILES.map((m,i)=>`<option value="${i}">${m.title||m.file}</option>`).join('');
  sel.value="0";
}

async function loadSelectedMap(){
  const idx = parseInt($('#map-select')?.value||'0',10)||0;
  const file = MAP_FILES[idx]?.file || MAP_FILES[0].file;
  try{
    await BABYLON.SceneLoader.AppendAsync('./assets/models/map/', file, scene);
    houseRoot = scene.meshes.find(m=>!m.parent) || scene.meshes[0];
    for(const m of scene.meshes){ m.isPickable = true; m.checkCollisions = true; }
  }catch(e){
    toast('Map failed to load: '+file, 2200);
  }
}

function setupSun(){
  sunLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.25,-1,0.2).normalize(), scene);
  sunLight.intensity = 1.1;
}
function setupMoon(){
  moonLight = new BABYLON.DirectionalLight("moon", new BABYLON.Vector3(0.2,-1,-0.1).normalize(), scene);
  moonLight.intensity = 0.35;
}
async function loadMoon(){
  const MOON_DIAM = 28, MOON_POS = new BABYLON.Vector3(0,220,200);
  function mat(){ const m=new BABYLON.StandardMaterial('moonMat',scene); m.disableLighting=true; m.emissiveColor=new BABYLON.Color3(1,1,1); m.backFaceCulling=false; return m; }
  try{
    const r = await BABYLON.SceneLoader.ImportMeshAsync('', './assets/models/sky/', 'moon.glb', scene);
    moonMesh = r.meshes.find(m=>m.name && !m.parent) || r.meshes[0];
  }catch(e){ moonMesh = BABYLON.MeshBuilder.CreateDisc('moon',{radius:MOON_DIAM*0.5, tessellation:48}, scene); moonMesh.rotation.x = Math.PI/2; }
  moonMesh.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  moonMesh.scaling.setAll(MOON_DIAM); moonMesh.position.copyFrom(MOON_POS); moonMesh.material = mat(); moonMesh.isPickable=false; moonMesh.applyFog=false;
}
</script>

<script>
/*** ==========================================================
    EVIDENCE UI + SUGGESTIONS
    ========================================================== ***/
const evState = Object.fromEntries(EVIDENCE.map(e=>[e,false]));
function buildEvidenceUI(){
  const wrap = $('#ev-list');
  wrap.innerHTML = EVIDENCE.map(e=>`<label class="ev"><input type="checkbox" data-ev="${e}"><span>${e}</span></label>`).join('');
  wrap.querySelectorAll('input').forEach(box=>{
    box.addEventListener('change', ()=>{ evState[box.dataset.ev]=box.checked; refreshSuggestions(); });
  });
}
function refreshSuggestions(){
  const picked = Object.keys(evState).filter(k=>evState[k]);
  const out = $('#ghost-suggestions');
  const candidates = GHOSTS.filter(g=> picked.every(p=>g.ev.includes(p)) && (picked.length<=3));
  out.innerHTML = candidates.map(g=>`<div class="badge">${g.name}</div>`).join('') || '<span class="badge">—</span>';
}
</script>

<script>
/*** ==========================================================
    ITEMS + 3-SLOT BELT + LIGHT CONES + WORLD PLACEMENT
    ========================================================== ***/
const ITEMS = {
  flashlight: {id:'flashlight', name:'Flashlight', placeable:false, use(){ toggleFlash(true); }, stop(){ toggleFlash(false); }},
  uv:         {id:'uv', name:'UV Light', placeable:false, use(){ toggleUV(true); }, stop(){ toggleUV(false); }},
  book:       {id:'book', name:'Writing Book', placeable:true, place(){ placeStaticMesh('book', 0.35); }},
  dots:       {id:'dots', name:'DOTS', placeable:true, place(){ placeStaticMesh('dots', 0.3); }},
  salt:       {id:'salt', name:'Salt', placeable:true, place(){ sprinkleSalt(); }},
  crucifix:   {id:'crucifix', name:'Crucifix', placeable:true, place(){ placeStaticMesh('crucifix',0.25);} },
  smudge:     {id:'smudge', name:'Smudge', placeable:false, use(){ smudgeEffect(); }},
  camera:     {id:'camera', name:'Photo Camera', placeable:false, use(){ toast('Click'); }}
};
let BELT = [ITEMS.flashlight, ITEMS.uv, ITEMS.book];
let activeSlot = 0;

// Lights
let flashLight=null, uvLight=null, lighterLight=null;
function ensureSpot(name, angle, exp){
  let s = scene.lights.find(l=>l.name===name);
  if(!s){
    s = new BABYLON.SpotLight(name, camera.position, camera.getForwardRay().direction, angle, exp, scene);
    s.intensity=0; s.diffuse=new BABYLON.Color3(1,1,1); s.specular=new BABYLON.Color3(0.2,0.2,0.2);
  }
  return s;
}
function toggleFlash(on){
  flashLight = ensureSpot('flashSpot', BABYLON.Tools.ToRadians(30), 8);
  flashLight.intensity = on? 1.1 : 0;
  syncLightToCamera();
  player.electronicsActive = on || (uvLight?.intensity>0);
}
function toggleUV(on){
  uvLight = ensureSpot('uvSpot', BABYLON.Tools.ToRadians(32), 6);
  uvLight.diffuse = new BABYLON.Color3(0.7,0.2,0.9);
  uvLight.specular= new BABYLON.Color3(0.2,0,0.3);
  uvLight.intensity = on? 1.0 : 0;
  syncLightToCamera();
  player.electronicsActive = (flashLight?.intensity>0) || on;
}
function ensureLighter(on){
  if(!lighterLight){
    lighterLight = new BABYLON.PointLight('lighter', camera.position, scene);
    lighterLight.diffuse = new BABYLON.Color3(1.0,0.85,0.6);
    lighterLight.intensity=0;
    lighterLight.range=6;
  }
  lighterLight.intensity = on? 0.9 : 0;
  player.hasFire = !!on;
}
function syncLightToCamera(){
  const d = camera.getForwardRay().direction;
  if(flashLight){ flashLight.position.copyFrom(camera.position); flashLight.direction.copyFrom(d); }
  if(uvLight){ uvLight.position.copyFrom(camera.position); uvLight.direction.copyFrom(d); }
  if(lighterLight){ lighterLight.position.copyFrom(camera.position); }
}

// Placeable helpers
function placeStaticMesh(kind, size=0.3){
  const m = BABYLON.MeshBuilder.CreateBox(kind+'_'+Math.random().toString(36).slice(2,7),{size}, scene);
  m.position = camera.position.add(camera.getForwardRay().direction.scale(1.0)).add(new BABYLON.Vector3(0,-0.6,0));
  m.checkCollisions = true; m.isPickable=true;
  toast(kind+' placed');
}
function sprinkleSalt(){
  // Drop 3 small piles in an arc in front of player
  for(let i=0;i<3;i++){
    const ang = (i-1)*0.25;
    const dir = camera.getForwardRay().direction.clone();
    const rot = BABYLON.Quaternion.FromEulerAngles(0, ang, 0);
    const v = BABYLON.Vector3.TransformCoordinates(dir, BABYLON.Matrix.FromQuaternion(rot));
    const p = camera.position.add(v.scale(1.1+i*0.15)).add(new BABYLON.Vector3(0,-0.8,0));
    const pile = BABYLON.MeshBuilder.CreateCylinder('salt',{diameter:0.18, height:0.03, tessellation:12}, scene);
    pile.position = p; pile.rotation.x = Math.PI/2; pile.isPickable=false;
    pile.material = new BABYLON.StandardMaterial('saltMat', scene);
    pile.material.diffuseColor = new BABYLON.Color3(1,1,1);
  }
  toast('Salt sprinkled');
}

// Reticle-first interaction
function rayFromCamera(len=3){
  const ray = new BABYLON.Ray(camera.position, camera.getForwardRay().direction, len);
  return scene.pickWithRay(ray, m=>m && m.isPickable!==false);
}

function useActiveItem(){
  const it = BELT[activeSlot];
  if(!it) return;
  // Reticle priority: if looking at an item that can be "used" in world, do that first (stub)
  const hit = rayFromCamera(2.0);
  if(hit && hit.pickedMesh && hit.pickedMesh.name.startsWith('door')){ toast('Door toggled'); return; }
  // Else use item
  if(it.use) it.use();
}

function placeActiveItem(){
  const it = BELT[activeSlot];
  if(!it || !it.placeable) { toast('Not placeable'); return; }
  it.place();
}

function tossActiveItem(){
  const it = BELT[activeSlot];
  if(!it){ toast('Empty slot'); return; }
  // create a small proxy mesh and throw forward
  const proxy = BABYLON.MeshBuilder.CreateSphere('toss',{diameter:0.18}, scene);
  proxy.position = camera.position.add(new BABYLON.Vector3(0, -0.2, 0));
  let v = camera.getForwardRay().direction.scale(0.32);
  let g = -9.8;
  let t=0; const h = scene.onBeforeRenderObservable.add(()=>{
    const dt = engine.getDeltaTime()/1000; t+=dt;
    proxy.position = proxy.position.add(v);
    v.y += g*dt*0.016;
    if(t>1.6){ proxy.dispose(); scene.onBeforeRenderObservable.remove(h); }
  });
  toast('Tossed '+it.name);
}

// Belt UI
function renderBelt(){
  for(let i=0;i<3;i++){
    const el = $('#slot'+i);
    el.textContent = BELT[i]?.name || '—';
    el.classList.toggle('active', i===activeSlot);
  }
}

// Notebook/Lighter hotkeys
function toggleLighter(){ const on = !(lighterLight && lighterLight.intensity>0); ensureLighter(on); toast(on?'Lighter lit':'Lighter off'); }
</script>

<script>
/*** ==========================================================
    GHOSTS: ENTITY + AI + EVENTS + HUNTS (unchanged core)
    ========================================================== ***/
let ghostMesh=null, mistMesh=null;
let lastMimicSwitch=0, thayeAge=0;

async function spawnGhost(){
  try{
    const r = await BABYLON.SceneLoader.ImportMeshAsync('', './assets/models/ghosts/', 'ghost1.glb', scene);
    ghostMesh = r.meshes.find(m=>!m.parent) || r.meshes[0];
  }catch(e){
    ghostMesh = BABYLON.MeshBuilder.CreateSphere('ghost', {diameter:0.6}, scene);
  }
  ghostMesh.isPickable=false; ghostMesh.visibility=0; ghostMesh.alwaysSelectAsActiveMesh=true;
  const m = new BABYLON.StandardMaterial('ghostMat', scene);
  m.diffuseColor = new BABYLON.Color3(0.9,0.9,1); m.alpha=0.8; m.emissiveColor=new BABYLON.Color3(0.1,0.1,0.2);
  ghostMesh.material = m;
  ghostMesh.position = new BABYLON.Vector3(0,1.2,0);
}

async function ensureMist(){
  if(mistMesh) return;
  try{
    const r = await BABYLON.SceneLoader.ImportMeshAsync('', './assets/models/ghosts/', 'mist.glb', scene);
    mistMesh = r.meshes.find(m=>!m.parent) || r.meshes[0];
  }catch(e){
    mistMesh = BABYLON.MeshBuilder.CreateSphere('mist',{diameter:0.8}, scene);
  }
  mistMesh.isPickable=false; mistMesh.visibility=0; mistMesh.material = new BABYLON.StandardMaterial('mistMat', scene);
  mistMesh.material.alpha = 0.5; mistMesh.material.diffuseColor = new BABYLON.Color3(0.7,0.9,1.0);
}

function pickGhost(){
  const g = structuredClone(GHOSTS[Math.floor(rng()*GHOSTS.length)]);
  game.ghost = g;
  game.orbFake = !!g.tags.orbsFake;
  game.mimicTarget = g.tags.mimic ? GHOSTS[Math.floor(rng()*GHOSTS.length)] : null;
  toast('Ghost: '+g.name, 1400);
}

function ghostBaseSpeed(){
  const g = game.ghost?.tags||{};
  let s = 1.7;
  if(g.revenant && !game.hunt.active) s = 1.0;
  if(g.mare && !game.breakerOn) s *= 1.05;
  if(g.hantu && !game.breakerOn) s *= 0.9;
  if(g.thaye) s *= (1.2 - 0.08*Math.min(10, thayeAge));
  if(g.moroi) s *= (1.0 + (1.0 - player.sanity/100)*1.2);
  if(g.raiju && player.electronicsActive) s = Math.max(s, 2.5);
  if(g.jinn && game.breakerOn) s = Math.max(s, 2.5);
  return Math.min(s, 3.71);
}

function ghostWantsEvent(){
  const g = game.ghost?.tags||{};
  let p = 0.06;
  if(g.oni) p *= 1.35;
  if(g.shade) p *= 0.45;
  if(g.polter) p *= 1.25;
  if(g.mare && game.breakerOn) p *= 0.8;
  if(player.sanity<60) p *= 1.2;
  if(player.sanity<35) p *= 1.35;
  return rng() < p;
}

function pickEventType(){
  const g = game.ghost?.tags||{};
  const types = ['singing','redFlicker','bulbPop','mist','footsteps'];
  if(g.oni){ const i = types.indexOf('mist'); if(i>=0) types.splice(i,1); }
  if(g.shade && player.inside){ const i = types.indexOf('singing'); if(i>=0) types.splice(i,1); }
  return types[Math.floor(rng()*types.length)];
}

function setGhostVisible(v, form='entity'){
  game.ghostVisible = !!v;
  if(ghostMesh) ghostMesh.visibility = v && form==='entity' ? 1 : 0;
  if(mistMesh)  mistMesh.visibility  = v && form==='mist'   ? 0.7 : 0;
}

function moveGhostToward(pos, speed, dt){
  if(!ghostMesh) return;
  const dir = pos.subtract(ghostMesh.position);
  dir.y = 0;
  const d = dir.length();
  if(d<0.001) return;
  ghostMesh.position = ghostMesh.position.add(dir.normalize().scale(speed*dt));
}

function currentRoomName(){
  player.inside = (Math.abs(camera.position.z) < 50);
  $('#hud-room').textContent = player.inside ? 'House' : 'Exterior';
  return player.inside ? 'House' : 'Exterior';
}

function chanceHunt(){
  if(game.hunt.active) return false;
  const g = game.ghost?.tags||{};
  let p = 0;
  if(player.inside){
    p = Math.max(0, (60 - player.sanity)) * 0.002;
    if(g.demon) p *= 1.5;
    if(g.shade) p *= 0.5;
    if(g.onryo && player.hasFire) p *= 0.3;
    if(g.onryo && !player.hasFire) p *= 1.2;
    if(g.yokai) p *= 1.1;
  }
  return rng() < p;
}

function startHunt(){
  const now = game.time;
  game.hunt.active = true;
  game.hunt.endsAt = now + 30;
  setGhostVisible(true,'entity');
  setHuntUI(true);
  toast('Hunt started!', 1000);
}
function stopHunt(){
  game.hunt.active = false;
  setHuntUI(false);
  setGhostVisible(false);
  toast('Hunt ended', 800);
}

async function triggerEvent(){
  const type = pickEventType();
  const g = game.ghost?.tags||{};
  await ensureMist();

  if(type==='singing' || type==='redFlicker'){
    setGhostVisible(true,'entity');
    const old = scene.clearColor.clone();
    let t=0; const handle = scene.onBeforeRenderObservable.add(()=>{
      t += engine.getDeltaTime()/1000;
      const k = 0.5+0.5*Math.sin(t*20);
      scene.clearColor = new BABYLON.Color4(0.05*k,0,0,1);
      if(t>2.2){ scene.onBeforeRenderObservable.remove(handle); scene.clearColor=old; setGhostVisible(false); }
    });
    toast('Singing event', 1000);
  }
  else if(type==='bulbPop'){
    const old = scene.clearColor.clone();
    scene.clearColor = new BABYLON.Color4(0.8,0.8,0.8,1);
    setTimeout(()=>scene.clearColor=old, 120);
    toast('Bulb shattered', 900);
  }
  else if(type==='mist'){
    setGhostVisible(true,'mist');
    let t=0; const handle = scene.onBeforeRenderObservable.add(()=>{
      t += engine.getDeltaTime()/1000;
      const p = camera.position.add(new BABYLON.Vector3(Math.sin(t*3)*0.6,0,0));
      moveGhostToward(p, 1.8, engine.getDeltaTime()/1000);
      if(t>3.0){ scene.onBeforeRenderObservable.remove(handle); setGhostVisible(false); }
    });
    toast('Misty apparition', 900);
  }
  else if(type==='footsteps'){
    // UV footprints: visible with UV light, expire in 60s
    const pos = camera.position.clone().add(new BABYLON.Vector3(0,0,1));
    const step = BABYLON.MeshBuilder.CreateDisc('uvstep',{radius:0.12, tessellation:24}, scene);
    step.position = pos.add(new BABYLON.Vector3((Math.random()-0.5)*0.4, -0.85, (Math.random()-0.5)*0.4));
    const mat = new BABYLON.StandardMaterial('uvstepMat', scene);
    mat.emissiveColor = new BABYLON.Color3(0.7,0.2,0.9);
    mat.alpha = 0.0; // hidden unless UV is on
    step.material = mat; step.isPickable=false;
    game.footprints.push({pos:step.position.clone(), expireAt: game.time+60, mesh:step});
    toast('Footsteps (UV evidence)', 1200);
  }

  // Poltergeist throws
  if(g.polter){
    const box = BABYLON.MeshBuilder.CreateBox('throw',{size:0.2}, scene);
    box.position = ghostMesh ? ghostMesh.position.add(new BABYLON.Vector3(0,1,0)) : camera.position.add(new BABYLON.Vector3(0,1,-1));
    const dir = camera.position.subtract(box.position).normalize().scale(4 + Math.random()*2);
    let t=0; scene.onBeforeRenderObservable.add(function tick(){
      t += engine.getDeltaTime()/1000;
      box.position = box.position.add(dir.scale(0.016));
      dir.y -= 9.8*0.016;
      if(t>2){ box.dispose(); scene.onBeforeRenderObservable.removeCallback(tick); }
    });
  }
}

function updateGhost(dt){
  if(!game.ghost || !ghostMesh) return;
  if(game.ghost.tags.mimic){
    if(game.time - (window.lastMimicSwitch||0) > 60){
      game.mimicTarget = GHOSTS[Math.floor(rng()*GHOSTS.length)];
      window.lastMimicSwitch = game.time;
    }
  }
  if(game.ghostVisible){
    const speed = ghostBaseSpeed();
    // Wraith avoids salt: if near a 'salt' mesh, it won't step through (simple steer)
    if(game.ghost.tags.wraith){
      const salts = scene.meshes.filter(m=>m.name.startsWith('salt'));
      for(const s of salts){
        if(BABYLON.Vector3.Distance(s.position, ghostMesh.position) < 1.1){
          return; // skip moving this frame
        }
      }
    }
    moveGhostToward(camera.position, speed, dt);
  }
}
</script>

<script>
/*** ==========================================================
    PLAYER / INPUT / MOVEMENT (with ` Fly and Noclip)
    ========================================================== ***/
const InputSystem = (function(){
  const keys = new Set();
  const move = {x:0, y:0, z:0};
  let lookDelta = {x:0, y:0};
  let running=false;
  let _analogScale=1.0;

  const keyMap = {
    'KeyW':'fw','KeyS':'bk','KeyA':'lt','KeyD':'rt',
    'ArrowUp':'fw','ArrowDown':'bk','ArrowLeft':'lt','ArrowRight':'rt',
    'ShiftLeft':'run','ShiftRight':'run',
    'Digit1':'slot0','Digit2':'slot1','Digit3':'slot2',
    'Backquote':'flyToggle','KeyN':'noclip',
    'KeyE':'use','KeyQ':'place','KeyG':'toss','KeyL':'lighter',
    'Space':'up','ControlLeft':'down','PageUp':'up','PageDown':'down'
  };

  function recomputeMove(){
    const f=(keys.has('fw')?1:0)+(keys.has('bk')?-1:0);
    const r=(keys.has('rt')?1:0)+(keys.has('lt')?-1:0);
    const v=(keys.has('up')?1:0)+(keys.has('down')?-1:0);
    move.z=f; move.x=r; move.y=v; running=keys.has('run');
  }

  function onKey(e,down){
    const tag=keyMap[e.code]; if(!tag) return;
    e.preventDefault();
    if(tag==='flyToggle' && down){ flyMode=!flyMode; if(camera){ camera.checkCollisions=!flyMode; camera.applyGravity=!flyMode; } toast('Fly: '+(flyMode?'ON':'OFF')); return; }
    if(tag==='noclip' && down){ const nc = !camera.checkCollisions; camera.checkCollisions=!nc; camera.applyGravity=!nc; toast('Noclip: '+(!nc?'OFF':'ON')); return; }
    if(tag==='lighter' && down){ toggleLighter(); return; }
    if(down) keys.add(tag); else keys.delete(tag);
    recomputeMove();

    if(tag.startsWith('slot') && down){ activeSlot = parseInt(tag.replace('slot',''),10); renderBelt(); }
    if(tag==='use' && down) useActiveItem();
    if(tag==='place' && down) placeActiveItem();
    if(tag==='toss' && down) tossActiveItem();
  }

  function onMouseMove(e){ lookDelta.x += e.movementX||0; lookDelta.y += e.movementY||0; }

  function snapshot(){ const ld=lookDelta; lookDelta={x:0,y:0}; return { moveVec:{...move}, lookDelta:ld, running, analog:_analogScale }; }

  function init(){
    window.addEventListener('keydown', e=>onKey(e,true),  {passive:false});
    window.addEventListener('keyup',   e=>onKey(e,false), {passive:false});
    window.addEventListener('mousemove', onMouseMove, {passive:true});

    // mobile buttons
    $('#btn-use')?.addEventListener('click', ()=>useActiveItem());
    $('#btn-place')?.addEventListener('click', ()=>placeActiveItem());
    $('#btn-toss')?.addEventListener('click', ()=>tossActiveItem());
  }
  return { init, snapshot };
})();

function applyLook(lookDelta){
  const sens=0.0028;
  camera.rotation.y += lookDelta.x * sens;
  camera.rotation.x -= lookDelta.y * sens;
  camera.rotation.x = Math.max(-Math.PI/2+0.02, Math.min(Math.PI/2-0.02, camera.rotation.x));
}

function handleMovement(input, dt){
  const baseWalk = player.speedWalk * (input.analog||1);
  const speed = input.running ? player.speedRun : baseWalk;

  const fwd=camera.getForwardRay().direction.clone(); fwd.y=0; fwd.normalize();
  const right = BABYLON.Vector3.Cross(fwd, BABYLON.Axis.Y).scale(-1);
  const desired = fwd.scale(input.moveVec.z).add(right.scale(input.moveVec.x));

  const vert = input.moveVec.y||0;
  const wantsFly = flyMode || (vert!==0);
  if (flyMode){ camera.checkCollisions=false; camera.applyGravity=false; }
  const prevGravity=camera.applyGravity;
  if(!flyMode && wantsFly) camera.applyGravity=false;

  let next=camera.position.clone();
  if(desired.lengthSquared()>0) next=next.add(desired.normalize().scale(speed*dt));
  if(wantsFly) next=next.add(new BABYLON.Vector3(0,vert*speed*dt,0));

  if(!wantsFly && desired.lengthSquared()>0){
    const probe = next.add(new BABYLON.Vector3(0, player.stepUpMax, 0));
    const downRay = new BABYLON.Ray(probe, new BABYLON.Vector3(0,-1,0), player.stepUpMax+0.6);
    const hit = scene.pickWithRay(downRay, m=>m&&m.isPickable!==false);
    if(hit && hit.pickedPoint){
      const y=hit.pickedPoint.y + 1.7;
      const dy=y - camera.position.y;
      camera.position = (dy<=player.stepUpMax) ? new BABYLON.Vector3(next.x, y, next.z) : next;
    } else { camera.position = next; }
  } else { camera.position = next; }

  syncLightToCamera();
  if(!flyMode) camera.applyGravity = prevGravity;
}
</script>

<script>
/*** ==========================================================
    DEV TOOLS: GLB Mesh/Material/Texture Browser (F9)
    ========================================================== ***/
let devOpen=false;
function toggleDev(){ devOpen=!devOpen; $('#dev-panel').style.display = devOpen?'block':'none'; if(devOpen) refreshSceneStats(); }
function refreshSceneStats(){
  const meshes = scene.meshes.length, materials = scene.materials.length, textures = scene.textures.length;
  const gl = engine.getGlInfo?.() || {};
  $('#dev-info').textContent =
`Meshes: ${meshes}
Materials: ${materials}
Textures: ${textures}
Renderer: ${gl.renderer||'?'}
Vendor: ${gl.vendor||'?'}
Version: ${gl.version||'?'}`;
  $('#dev-textures').innerHTML='';
}
function inspectUnderReticle(){
  const hit = rayFromCamera(8);
  if(!hit || !hit.pickedMesh){ $('#dev-info').textContent='No mesh under reticle'; return; }
  const m = hit.pickedMesh;
  let info = `Mesh: ${m.name}\nVerts: ${m.getTotalVertices?.()||'?'}\nSubMeshes: ${m.subMeshes?.length||0}`;
  const mat = m.material || (m.subMeshes?.[0]?.getMaterial() || null);
  if(mat){
    info += `\nMaterial: ${mat.name} (${mat.getClassName?.()||'Material'})`;
    const tex = [];
    ['diffuseTexture','albedoTexture','baseTexture','opacityTexture','emissiveTexture','normalTexture','metallicTexture','roughnessTexture','ambientTexture','reflectionTexture'].forEach(k=>{
      if(mat[k]) tex.push(`${k}: ${mat[k].name||mat[k].url||'(embedded)'}`);
    });
    if(tex.length) info += `\nTextures:\n - ${tex.join('\n - ')}`;
  }
  $('#dev-info').textContent = info;
}
function listAllTextures(){
  const wrap = $('#dev-textures'); wrap.innerHTML='';
  for(const t of scene.textures){
    const card = document.createElement('div'); card.className='tex-card';
    const name = t.name || t.url || '(embedded)';
    const p = document.createElement('div'); p.textContent = name;
    card.appendChild(p);

    // Build a downloadable link if possible (for data/HTTP URLs)
    let href = null;
    if(typeof t.url === 'string'){
      href = t.url;
    } else if (t._texture && t._texture.url) {
      href = t._texture.url;
    }
    if(href){
      const a = document.createElement('a'); a.href = href; a.textContent='open'; a.target='_blank';
      card.appendChild(a);
    } else {
      const i = document.createElement('div'); i.textContent='(embedded / runtime-only)'; card.appendChild(i);
    }
    wrap.appendChild(card);
  }
}

function attachDevUI(){
  window.addEventListener('keydown', (e)=>{
    if(e.code==='F9'){ e.preventDefault(); toggleDev(); }
  }, {passive:false});
  $('#dev-refresh').addEventListener('click', refreshSceneStats);
  $('#dev-under-reticle').addEventListener('click', inspectUnderReticle);
  $('#dev-list-textures').addEventListener('click', listAllTextures);
}
</script>

<script>
/*** ==========================================================
    BOOT + MAIN LOOP
    ========================================================== ***/
async function boot(){
  engine = new BABYLON.Engine(canvas, true, {preserveDrawingBuffer:true, stencil:true});
  scene = new BABYLON.Scene(engine);
  scene.collisionsEnabled = true;
  scene.gravity = new BABYLON.Vector3(0,-0.9,0);
  scene.clearColor = new BABYLON.Color4(0.01,0.01,0.02,1);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.0045;
  scene.fogColor = new BABYLON.Color3(0.02,0.03,0.05);

  camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0, 2, 24), scene);
  camera.attachControl(canvas, true);
  camera.checkCollisions = true; camera.applyGravity = true;
  camera.ellipsoid = new BABYLON.Vector3(0.35,0.9,0.35);
  camera.ellipsoidOffset = new BABYLON.Vector3(0,0.4,0);
  camera.minZ = 0.1; camera.inertia=0;
  camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

  hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  hemiLight.intensity = 0.35;

  setupSun(); setupMoon();
  await loadSelectedMap();
  await loadMoon();
  await spawnGhost();
  await ensureMist();

  // Place player
  camera.position = new BABYLON.Vector3(44.91, 1.17, -104.00);

  buildEvidenceUI();
  InputSystem.init();
  attachDevUI();
  canvas.focus(); if (canvas.requestPointerLock) canvas.requestPointerLock();

  // Pick ghost
  pickGhost();
  renderBelt();

  engine.runRenderLoop(()=>{
    const dt = engine.getDeltaTime()/1000;
    game.time += dt;
    const input = InputSystem.snapshot();
    handleMovement(input, dt);
    applyLook(input.lookDelta);

    // Room & sanity
    currentRoomName();
    player.sanity = Math.max(0, player.sanity - (player.inside? 0.006 : 0.002)*dt*60);
    $('#hud-sanity').textContent = Math.round(player.sanity)+'%';
    $('#sanity-fill').style.width = Math.round(player.sanity)+'%';
    $('#hud-xyz').style.display='block';
    $('#hud-x').textContent=camera.position.x.toFixed(2);
    $('#hud-y').textContent=camera.position.y.toFixed(2);
    $('#hud-z').textContent=camera.position.z.toFixed(2);

    // UV footprints visibility tied to UV light
    const uvOn = (uvLight && uvLight.intensity>0);
    for(const f of game.footprints){
      if(!f.mesh || f.expireAt <= game.time){ if(f.mesh){ f.mesh.dispose(); f.mesh=null; } continue; }
      if(f.mesh.material) f.mesh.material.alpha = uvOn ? 0.85 : 0.0;
    }

    // Ghost AI / visibility
    updateGhost(dt);

    // Random events (when not hunting)
    if(!game.hunt.active){
      if(game.time - game.lastEvent > game.nextEvent && player.inside && ghostWantsEvent()){
        game.lastEvent = game.time;
        game.nextEvent = 6 + rng()*10;
        triggerEvent();
      }
      if(chanceHunt()) startHunt();
    } else {
      if(game.time >= game.hunt.endsAt) stopHunt();
    }

    scene.render();
  });
  window.addEventListener('resize', ()=>engine.resize());
}

let __started=false;
async function safeStart(){
  if(__started) return;
  __started = true;
  $('#title-screen').style.display='none';
  await boot();
  try{ canvas.focus(); if (canvas.requestPointerLock) canvas.requestPointerLock(); } catch(e){}
  try{ BABYLON.Engine.audioEngine?.unlock?.(); } catch(e){}
}
function startNow(e){ e?.preventDefault?.(); safeStart(); }
const startBtn = document.getElementById('start-button');
if(startBtn){
  startBtn.addEventListener('click',     startNow, {passive:false});
  startBtn.addEventListener('pointerup', startNow, {passive:false});
  startBtn.addEventListener('touchend',  startNow, {passive:false});
  startBtn.addEventListener('touchstart', startNow, {passive:false});
}
window.addEventListener("DOMContentLoaded", () => loadManifest());
document.addEventListener('keydown', (e)=>{
  if(!__started && (e.key==='Enter'||e.code==='Space')){ e.preventDefault(); safeStart(); }
}, {passive:false});
</script>
