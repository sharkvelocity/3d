<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Shark-Blades" />
  <meta name="description" content="Turn-based ghost hunting strategy game based on Phasmophobia." />
  <meta name="keywords" content="PhasmaPhoney, Phasmophobia, ghost, hunting, game, HTML" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: monospace;
      color: #0ff;
    }
    #renderCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #000;
    }
    /* START UI */
    #start-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0,0,0,0.9);
      z-index: 10;
    }
    #start-btn {
      padding: 14px 36px;
      border: 2px solid #0ff;
      background: #111;
      color: #0ff;
      font-size: 20px;
      cursor: pointer;
    }
    #logo {
      max-width: 70vw;
      opacity: .3;
      margin-bottom: 18px;
    }
    /* HUD */
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }
    .pill {
      background: rgba(0,0,0,0.6);
      border: 1px solid #0ff;
      padding: 6px 10px;
      pointer-events: auto;
    }
    #log {
      position: fixed;
      bottom: 10px;
      left: 10px;
      width: min(520px, 90vw);
      max-height: 40vh;
      overflow: auto;
      background: rgba(0,0,0,.6);
      border: 1px solid #0ff;
      padding: 8px;
      z-index: 5;
      font-size: 12px;
      line-height: 1.35;
    }
    #log b { color: #7ff; }
    footer {
      position: fixed;
      bottom: 8px;
      right: 10px;
      font-size: 11px;
      opacity: 0.7;
      z-index: 5;
    }
  </style>
</head>
<body>

  <!-- Babylon canvas -->
  <canvas id="renderCanvas"></canvas>

  <!-- Start overlay -->
  <div id="start-screen">
    <img id="logo" src="./assets/images/community_image_1405512458.jpg" alt="PhasmaPhoney logo" />
    <button id="start-btn">Start Investigation</button>
    <p style="margin-top:10px;opacity:.8;">Deo: “Welcome back. Try not to die.”</p>
  </div>

  <!-- HUD -->
  <div id="hud" style="display:none;">
    <div class="pill">Turn: <span id="turn">0</span></div>
    <div class="pill">Sanity: <span id="sanity">100</span>%</div>
    <div class="pill">Room: <span id="room">Van</span></div>
    <div class="pill"><button id="spawn-test" style="background:#000;border:1px solid #0ff;color:#0ff;cursor:pointer;">Spawn EMF (demo)</button></div>
  </div>

  <!-- Log -->
  <div id="log" style="display:none;"></div>

  <footer>Shark-Blades — Phasma-Phoney Prototype Web Build</footer>

  <!-- Babylon core + loaders (from your /cdn folder) -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
  <!-- optional: inspector for debugging -->
  <!-- <script src="./cdn/inspector/babylon.inspector.bundle.js"></script> -->

  <script>
    // ======= Minimal game state (wire up as needed) =======
    const game = {
      started: false,
      active: false,
      turn: 0,
      sanity: 100,
      ghost: null,
      ghostRoom: null,
      inventory: ['EMF','Notebook','Lighter'],
      roomNameMap: [
        ['Van','Foyer','Kitchen'],
        ['Basement','Living Room','Bathroom'],
        ['Garage','Bedroom','Storage']
      ],
      position: [0,0] // grid position if you keep it
    };

    // ======= DOM helpers =======
    const $ = (s)=>document.querySelector(s);
    const logEl = $('#log');
    function log(msg, from='ADA') {
      if (!logEl) return;
      const line = document.createElement('div');
      line.innerHTML = `<b>${from}:</b> ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }
    function setHUD({turn, sanity, room}) {
      if (turn!=null) $('#turn').textContent = String(turn);
      if (sanity!=null) $('#sanity').textContent = String(sanity);
      if (room!=null) $('#room').textContent = room;
    }

    // ======= Babylon bootstrapping =======
    let engine, scene, camera, light;
    let mapRoot = null;

    // Items container & registry
    let itemsContainer = null;            // AssetContainer for exploration_objects.glb
    const itemPrefabByName = new Map();   // name -> node (original)
    const itemListCache = [];             // for quick listing

    async function createEngineScene() {
      const canvas = document.getElementById('renderCanvas');
      engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true, antialias: true });
      scene  = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0,0,0,1);

      // Camera
      camera = new BABYLON.UniversalCamera('cam', new BABYLON.Vector3(0, 1.6, -4), scene);
      camera.attachControl(canvas, true);
      camera.speed = 0.25;
      camera.minZ = 0.05;

      // Light
      light = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0,1,0), scene);
      light.intensity = 0.7;

      // Subtle fog for mood
      scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
      scene.fogDensity = 0.015;
      scene.fogColor = new BABYLON.Color3(0.02, 0.02, 0.03);

      // Optional: enable Inspector with Shift+I
      window.addEventListener('keydown', (e)=>{
        if ((e.key === 'I' || e.key === 'i') && e.shiftKey) scene.debugLayer.isVisible() ? scene.debugLayer.hide() : scene.debugLayer.show();
      });

      // Resize
      window.addEventListener('resize', () => engine.resize());
    }

    async function loadMap() {
      // Append map scene into current scene
      // Path per your repo: ./assets/models/map/Abandoned_House.glb
      log('Loading map…');
      await BABYLON.SceneLoader.AppendAsync('./assets/models/map/', 'Abandoned_House.glb', scene);
      // After append, we can find a root by name or by picking the largest root.
      mapRoot = scene.meshes.find(m => m.name === 'Abandoned_House' || (m.parent === null && m.getTotalVertices() > 0)) || null;
      log('Map loaded.');
    }

    async function loadItemsContainer() {
      // Load into an AssetContainer so we can instantiate multiple copies easily
      // exploration_objects.glb path from your repo map
      log('Loading item models (exploration_objects.glb)…');
      itemsContainer = await BABYLON.SceneLoader.LoadAssetContainerAsync(
        './assets/models/items/',
        'exploration_objects.glb',
        scene
      );
      // Register nodes by name for quick access
      itemsContainer.meshes.forEach(node => {
        if (node?.name && node.getTotalVertices && node.getTotalVertices() > 0) {
          itemPrefabByName.set(node.name, node);
          itemListCache.push(node.name);
        }
      });
      log(`Items loaded. Found meshes: ${itemListCache.join(', ') || '(none)'} `);
    }

    // List available item names (from GLB)
    function getAvailableItemNames() {
      return [...itemListCache];
    }

    // Spawn an instance of itemName at position (Vector3). Returns the root of the instance.
    function spawnItem(itemName, position = new BABYLON.Vector3(0,1,0)) {
      // Try exact match first
      let template = itemPrefabByName.get(itemName);

      // If not exact, try a "contains" search (so "EMF" can match "EMF_Meter" etc.)
      if (!template) {
        const key = [...itemPrefabByName.keys()].find(k => k.toLowerCase().includes(itemName.toLowerCase()));
        if (key) template = itemPrefabByName.get(key);
      }

      if (!template) {
        log(`No mesh named like "${itemName}" found in exploration_objects.glb.`, 'SYS');
        return null;
      }

      // Make a fresh container instance so materials, animations, etc. are preserved
      const inst = itemsContainer.instantiateModelsToScene((n)=>`${n}_${performance.now().toFixed(0)}`);
      // Place near camera by default
      inst.rootNodes.forEach(root => {
        root.position = position.clone();
      });

      // Try to find the node by name inside the instantiated set
      let chosen = inst.rootNodes.find(n => n.name.toLowerCase().includes(template.name.toLowerCase()));
      if (!chosen) chosen = inst.rootNodes[0];

      // Optional: a small glow/emissive tweak for visibility
      chosen.getChildMeshes().forEach(m=>{
        if (m.material && m.material.emissiveColor) {
          m.material.emissiveColor = m.material.emissiveColor.add(new BABYLON.Color3(0.05,0.1,0.1));
        }
      });

      return chosen;
    }

    // ======= Game flow =======
    async function startGame() {
      $('#start-screen').style.display = 'none';
      $('#hud').style.display = '';
      $('#log').style.display = '';

      await createEngineScene();
      await loadMap();
      await loadItemsContainer();

      // Randomize a starting room label (purely cosmetic unless you bind to actual nodes)
      const flatRooms = game.roomNameMap.flat();
      game.ghostRoom = flatRooms[Math.floor(Math.random() * flatRooms.length)];
      setHUD({room: game.ghostRoom});

      // Place camera at a reasonable spawn (tweak as needed; depends on Abandoned_House.glb origin)
      camera.setTarget(BABYLON.Vector3.Zero());
      camera.position = new BABYLON.Vector3(0, 1.7, -5);

      log('Investigation started.');
      engine.runRenderLoop(() => scene.render());
    }

    // ======= Hook UI =======
    document.getElementById('start-btn').addEventListener('click', startGame);

    // Demo button: try to spawn an EMF model ~2 meters in front of camera
    document.getElementById('spawn-test').addEventListener('click', ()=>{
      if (!scene) return;
      const forward = camera.getDirection(BABYLON.Axis.Z);
      const pos = camera.position.add(forward.scale(2));
      const spawned = spawnItem('EMF', pos);
      if (spawned) {
        log(`Spawned: ${spawned.name}`);
      }
    });

    // Expose to window for your other scripts (items logic, etc.)
    window.Phasma = {
      getAvailableItemNames,
      spawnItem,
      scene: ()=>scene,
      camera: ()=>camera,
      game
    };
  </script>
</body>
</html>
