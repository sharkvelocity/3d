  let canvas = document.getElementById("renderCanvas");

  async function createScene() {
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color3.Black();
    scene.ambientColor = new BABYLON.Color3(0.2, 0.2, 0.2);
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.01;
    scene.fogColor = new BABYLON.Color3(0, 0, 0);

    // Create hemispheric light (soft ambient)
    const light = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
    light.intensity = 0.5;

    // Directional light for shadows
    const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
    dirLight.position = new BABYLON.Vector3(10, 20, 10);
    dirLight.intensity = 0.8;
    shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
    shadowGenerator.useBlurExponentialShadowMap = true;
    shadowGenerator.blurKernel = 32;

    // Create skybox (optional starry dark night)
    const skybox = BABYLON.MeshBuilder.CreateBox("skyBox", { size: 1000.0 }, scene);
    const skyMat = new BABYLON.StandardMaterial("skyBox", scene);
    skyMat.backFaceCulling = false;
    skyMat.disableLighting = true;
    skyMat.diffuseColor = new BABYLON.Color3.Black();
    skyMat.specularColor = new BABYLON.Color3.Black();
    skyMat.emissiveTexture = new BABYLON.Texture("https://assets.babylonjs.com/environments/night.jpg", scene);
    skyMat.emissiveTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
    skybox.material = skyMat;

    // Load the Abandoned House model
    await BABYLON.SceneLoader.AppendAsync("", "Abandoned_House.glb", scene);
    house = scene.meshes.find(m => m.name.includes("House") || m.name.includes("Root"));

    if (house) {
      house.receiveShadows = true;
      house.getChildMeshes().forEach(m => {
        m.receiveShadows = true;
        shadowGenerator.addShadowCaster(m);
      });
    }
const inventory = [];
let heldItem = null;
let orbCameraActive = false;
async function loadItemMesh(name, file, scale = 1) {
  const result = await BABYLON.SceneLoader.ImportMeshAsync("", "models/items/", file, scene);
  const mesh = result.meshes[0];
  mesh.name = name;
  mesh.scaling.scaleInPlace(scale);
  mesh.setEnabled(false); // Hide until picked
  return mesh;
}
function equipItem(mesh) {
  heldItem = mesh;
  mesh.setEnabled(true);
  mesh.parent = camera;
  mesh.position.set(0.3, -0.3, 0.6);
  mesh.rotation.set(0, Math.PI, 0);
}

function dropHeldItem() {
  if (!heldItem) return;
  heldItem.setEnabled(true);
  heldItem.setParent(null);
  heldItem.position = camera.position.add(camera.getForwardRay().direction.scale(1));
  inventory.push(heldItem);
  heldItem = null;
}

async function setupItems() {
  const items = {
    emf: await loadItemMesh("EMF", "emf.glb", 0.5),
    spiritBox: await loadItemMesh("SpiritBox", "spiritbox.glb", 0.5),
    flashlight: await loadItemMesh("Flashlight", "flashlight.glb", 0.4),
    candle: await loadItemMesh("Candle", "candle.glb", 0.5),
    camera: await loadItemMesh("Camera", "camera.glb", 0.5)
  };
  inventory.push(items.emf, items.spiritBox, items.flashlight);
  equipItem(items.emf);
}
function toggleCandle(mesh) {
  if (!mesh.light) {
    mesh.light = new BABYLON.PointLight("flame", mesh.position, scene);
    mesh.light.intensity = 1.0;
    mesh.light.range = 2;
    mesh.material.emissiveColor = new BABYLON.Color3(1, 0.6, 0.2);
  } else {
    mesh.light.dispose();
    delete mesh.light;
    mesh.material.emissiveColor = BABYLON.Color3.Black();
  }
}
function toggleCameraView() {
  orbCameraActive = !orbCameraActive;
  if (orbCameraActive) {

function playSpiritBox() {

  const ghostInRoom = isPlayerInGhostRoom();

window.addEventListener("keydown", (e) => {

    case "e": if (heldItem?.name === "Camera") toggleCameraView(); break;
    case "x": dropHeldItem(); break;

});

<script>
const activeGhost = ghostProfiles[Math.floor(Math.random() * ghostProfiles.length)];
let mimicTarget = null;
let mimicCounter = 0;
function updateGhostBehavior(playerRoom, currentTurn, sanity) {
  // Goryo logic
  if (activeGhost.behavior.noWander) return;

  // Mimic behavior swap
  if (activeGhost.name === "The Mimic") {
    mimicCounter--;
    if (mimicCounter <= 0) {
      const otherGhosts = ghostProfiles.filter(g => g.name !== "The Mimic");
      mimicTarget = otherGhosts[Math.floor(Math.random() * otherGhosts.length)];
      mimicCounter = 3 + Math.floor(Math.random() * 4); // 3–6 turns
    }
  }

  // Onryo fire logic
  if (activeGhost.behavior.flameHunter) {
    if (countLitFlames() >= 3) {
      triggerHunt();
    } else if (wasRelitCandleLitWithin(20)) {
      extinguishFlame();
      triggerHunt();
    }
  }

  // Mare lighting logic
  if (activeGhost.behavior.turnsOffLights && roomHasLight(playerRoom)) {
    maybeTurnOffLight(playerRoom);
  }

  // Yurei smudge lock
  if (activeGhost.name === "Yurei" && smudgeTurnsRemaining > 0) {
    smudgeTurnsRemaining--;
    return;
  }

  // Roaming logic
  if (Math.random() < 0.2 && ghostCanRoam()) {
    changeGhostRoom();
  }

  // Hunt logic
  if (sanity < 50 && Math.random() < 0.1) {
    triggerHunt();
  }
}

let currentCamera, fpCamera, tpCamera, cameraMode = "first";
let mobileJoystick = null;
let ambientSound;

function setAmbientWeatherSound(weather = "rain") {
  if (ambientSound) ambientSound.stop();

  const file = weather === "rain" ? "rainstorm.mp3" : "clearWeather.mp3";
  ambientSound = new BABYLON.Sound("ambient", `sounds/${file}`, scene, null, {
    loop: true,
    autoplay: true,
    volume: 0.4
  });
}

function setupPlayerAndCamera(scene, canvas) {
  // === First-Person Camera (default) ===
  fpCamera = new BABYLON.UniversalCamera("fpCamera", new BABYLON.Vector3(0, 1.8, -10), scene);
  fpCamera.attachControl(canvas, true);
  fpCamera.applyGravity = true;
  fpCamera.ellipsoid = new BABYLON.Vector3(0.5, 1, 0.5);
  fpCamera.checkCollisions = true;
  fpCamera.speed = 0.25;

  // === Third-Person Camera ===
  tpCamera = new BABYLON.FollowCamera("tpCamera", new BABYLON.Vector3(0, 5, -10), scene);
  tpCamera.lockedTarget = fpCamera; // Follows player body
  tpCamera.radius = 6;
  tpCamera.heightOffset = 3;
  tpCamera.rotationOffset = 180;
  tpCamera.cameraAcceleration = 0.05;
  tpCamera.maxCameraSpeed = 10;

  currentCamera = fpCamera;
  scene.activeCamera = currentCamera;
  currentCamera.attachControl(canvas, true);

  // === Movement Keys ===
  const inputMap = {};
  scene.actionManager = new BABYLON.ActionManager(scene);
  scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, evt => inputMap[evt.sourceEvent.key.toLowerCase()] = true));
  scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, evt => inputMap[evt.sourceEvent.key.toLowerCase()] = false));

  scene.onBeforeRenderObservable.add(() => {
    let direction = new BABYLON.Vector3.Zero();
    const forward = currentCamera.getDirection(BABYLON.Axis.Z);
    const right = currentCamera.getDirection(BABYLON.Axis.X);

    if (inputMap["w"]) direction.addInPlace(forward);
    if (inputMap["s"]) direction.subtractInPlace(forward);
    if (inputMap["a"]) direction.subtractInPlace(right);
    if (inputMap["d"]) direction.addInPlace(right);

    direction.y = 0;
    direction.normalize();
    direction.scaleInPlace(currentCamera.speed);

    currentCamera.cameraDirection.addInPlace(direction);
  });

  // === Toggle Camera (First/Third) ===
  window.addEventListener('keydown', e => {
    if (e.key === 'v') {
      currentCamera.detachControl(canvas);
      cameraMode = cameraMode === "first" ? "third" : "first";
      currentCamera = (cameraMode === "first") ? fpCamera : tpCamera;
      scene.activeCamera = currentCamera;
      currentCamera.attachControl(canvas, true);
    }
  });

  // === Mobile Joystick (optional) ===
  if (BABYLON.GUI) {
    mobileJoystick = createMobileJoystick(scene);
  }
}

function createMobileJoystick(scene) {
  // TODO: Add GUI touch joystick later
  return null;
}

const allEvidence = ["EMF", "Spirit Box", "Fingerprints", "Orbs", "Writing", "Freezing", "D.O.T.S"];

let foundEvidence = new Set();
let eliminatedEvidence = new Set();



function toggleEliminated(evi) {
  if (eliminatedEvidence.has(evi)) {
    eliminatedEvidence.delete(evi);
  } else {
    eliminatedEvidence.add(evi);
    foundEvidence.delete(evi);
  }
  updateEvidenceUI();
  updateGhostSuggestions();
}

function updateEvidenceUI() {
  allEvidence.forEach(evi => {
    const btn = document.getElementById("evi-" + evi);
    if (!btn) return;
    btn.classList.remove("found", "eliminated");
    if (foundEvidence.has(evi)) {
      btn.classList.add("found");
    } else if (eliminatedEvidence.has(evi)) {
      btn.classList.add("eliminated");
    }
  });
}

function updateGhostSuggestions() {
  const matches = ghostProfiles.filter(g => {
    return Array.from(foundEvidence).every(evi => g.evidence.includes(evi)) &&
           Array.from(eliminatedEvidence).every(evi => !g.evidence.includes(evi));
  });

  const container = document.getElementById("ghost-suggestions");
  if (!container) return;

  container.innerHTML = "";
  matches.forEach(g => {
    const div = document.createElement("div");
    div.className = "ghost-match";
    div.textContent = g.name;
    container.appendChild(div);
  });
}
