<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney — Items + Random Ghost Spawn + Flicker Profiles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <meta name="author" content="Shark-Blades" />
  <meta name="description" content="3D ghost hunting prototype built with Babylon.js" />

  <!-- Babylon core + loaders (LOCAL) -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/earcut.min.js"></script>
  <script src="./cdn/meshopt_decoder.js"></script>
  <script src="./cdn/draco_decoder_gltf.js"></script>
  <script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script>
  <script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
  <script src="./cdn/gui/babylon.gui.min.js"></script>
  <!-- Optional Inspector (button toggles it) -->
  <script src="./cdn/inspector/babylon.inspector.bundle.js"></script>

  <style>
    html, body { margin:0; height:100%; width:100%; background:#000; overflow:hidden; font-family:monospace; color:#0ff; }
    #renderCanvas { width:100vw; height:100vh; touch-action:none; display:block; background:#000; }

    /* Title screen */
    #title-screen{ position:fixed; inset:0; background:rgba(0,0,0,0.88);
      display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999;}
    #title-content{ text-align:center; max-width:90vw;}
    #title-logo{ max-width:60vw; max-height:35vh; object-fit:contain; margin-bottom:24px;}
    #start-button{ padding:14px 28px; font-size:22px; cursor:pointer; border:2px solid #0ff; color:#0ff; background:#111; box-shadow:0 0 14px rgba(0,255,255,0.25); }
    #start-button:active{ transform:translateY(1px); }

    /* HUD (left) */
    #hud{ position:fixed; top:10px; left:10px; z-index:6000; background:rgba(0,0,0,0.5); border:1px solid #066;
      padding:8px 10px; border-radius:6px; min-width:260px; display:none; flex-direction:column; gap:6px; pointer-events:none; }
    #hud .row{ display:flex; gap:10px; align-items:center; justify-content:space-between; }
    #hud .label{ color:#9ff; }
    #hud .value{ color:#0ff; font-weight:bold; }
    #weather{ font-size:12px; color:#aff; opacity:0.9; }
    #hud-hunt { font-size:12px; color:#faa; opacity:0.95; }

    /* HUD (right) XYZ */
    #hud-xyz { position:fixed; top:10px; right:12px; background:rgba(0,0,0,0.5); border:1px solid #066; padding:6px 8px; color:#0ff; font:12px monospace; z-index:6000; display:none; }

    /* Toast */
    #toast{ position:fixed; left:50%; top:16px; transform:translateX(-50%); background:rgba(0,0,0,0.7); border:1px solid #066;
      border-radius:8px; padding:8px 12px; color:#0ff; z-index:10001; display:none; max-width:70vw; text-align:center; }

    /* Action bar & Belt */
    .hud-btn{ border:1px solid #333; background:#181818; color:#ddd; padding:6px 10px; border-radius:8px; cursor:pointer; }
    .hud-btn:active{ transform:translateY(1px); }
    #action-bar { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); display:flex; gap:10px; z-index:6500; }
    #belt{ position:fixed; left:50%; bottom:72px; transform:translateX(-50%); display:flex; gap:12px; z-index:6000; align-items:center;
      background:rgba(0,0,0,0.55); border:1px solid #066; padding:8px 10px; border-radius:10px; }
    .slot{ width:72px; height:72px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:1px solid #0aa;
      background:rgba(0,20,20,0.6); position:relative; cursor:pointer; user-select:none; }
    .slot .key{ position:absolute; top:2px; left:4px; font-size:11px; color:#9ff; opacity:0.9; }
    .slot .label{ font-size:12px; color:#adf; text-align:center; line-height:1.1; padding:4px; }
    .slot.active{ outline:2px solid #0ff; box-shadow:0 0 12px rgba(0,255,255,0.45) inset; }

    /* Touch halves overlay — full width split, lowered 20% from top */
    .touch-half { position:fixed; top:20%; bottom:0; width:50vw; z-index:5000; }
    #touch-left { left:0; }
    #touch-right{ right:0; }

    /* Flash overlay for lightning & ghost flicker pop */
    #flash-overlay{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:10000; transition:opacity 120ms ease-out; }
  </style>
</head>
<body>
  <!-- Title -->
  <div id="title-screen">
    <div id="title-content">
      <img id="title-logo" src="./logo.png" alt="PhasmaPhoney Logo" />
      <div style="margin:8px 0 16px; color:#9ff;">“Welcome back. Keep the lights on and the sanity high.”</div>
      <button id="start-button">Start Investigation</button>
    </div>
  </div>

  <!-- Canvas -->
  <canvas id="renderCanvas"></canvas>

  <!-- HUD left -->
  <div id="hud">
    <div class="row"><div class="label">Sanity</div><div class="value" id="hud-sanity">100%</div></div>
    <div class="row"><div class="label">Room</div><div class="value" id="hud-room">Van</div></div>
    <div id="weather">Weather: <span id="hud-weather">Clear</span></div>
    <div id="hud-hunt">Hunt: <span id="hud-hunt-state">Calm</span></div>
  </div>

  <!-- HUD right: XYZ -->
  <div id="hud-xyz">XYZ: <span id="hud-x">0</span>, <span id="hud-y">0</span>, <span id="hud-z">0</span></div>

  <!-- Action Bar -->
  <div id="action-bar">
    <button id="btn-use" class="hud-btn">Use</button>
    <button id="btn-place" class="hud-btn">Place</button>
    <button id="btn-toss" class="hud-btn">Toss</button>
    <button id="btn-slot-prev" class="hud-btn">◀</button>
    <button id="btn-slot-next" class="hud-btn">▶</button>
    <button id="btn-notebook" class="hud-btn">Notebook</button>
    <button id="btn-inspector" class="hud-btn">Inspector</button>
  </div>

  <!-- Belt (Item Bar) -->
  <div id="belt"></div>

  <!-- Touch halves (invisible) -->
  <div id="touch-left"  class="touch-half"></div>
  <div id="touch-right" class="touch-half"></div>

  <!-- Flash for lightning & optional ghost pop -->
  <div id="flash-overlay"></div>

  <!-- Toast -->
  <div id="toast"></div>

<script>
/* ============================================================
   GLOBALS & MINIMUM STUBS
   ============================================================ */
const canvas = document.getElementById('renderCanvas');
let engine, scene, camera;
let hemiLight = null;
let houseLights = []; let housePower = true;
let houseRoot = null;

let player = { sanity:100, room:'Van', speedWalk:0.9, speedRun:1.8, running:false, god:false };
let controls = { forward:false, back:false, left:false, right:false };

const weather = { state:'Clear', rainPS:null, snowPS:null, lightningTimer:0, nextStrike: 5 };
function scheduleNextLightning(){ weather.lightningTimer=0; weather.nextStrike = 3 + Math.random()*10; }
function lightningStrike(){ const overlay=document.getElementById('flash-overlay'); overlay.style.opacity='0.6'; setTimeout(()=>overlay.style.opacity='0', 120); }
function toast(msg, ms=1500){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none', ms); }
function inVanZone(pos){ return false; } // replace with your real van zone if needed

/* ============================================================
   ITEMS / BELT
   ============================================================ */
const INVENTORY = [
  { id:'flash',  name:'Flashlight'   },
  { id:'uv',     name:'UV Light'     },
  { id:'emf',    name:'EMF Reader'   },
  { id:'salt',   name:'Salt'         },
  { id:'camera', name:'Photo Camera' }
];
let activeItemSlot = 1;

function rebuildBelt(){
  const belt = document.getElementById('belt');
  if(!belt) return;
  belt.innerHTML = '';
  for(let i=0;i<INVENTORY.length;i++){
    const slot = document.createElement('div');
    slot.className = 'slot' + (i+1===activeItemSlot?' active':'');
    slot.title = INVENTORY[i].name;
    const key = document.createElement('div'); key.className='key'; key.textContent = (i+1);
    const label = document.createElement('div'); label.className='label'; label.textContent = INVENTORY[i].name;
    slot.appendChild(key); slot.appendChild(label);
    slot.onclick = ()=>{ activeItemSlot = i+1; rebuildBelt(); };
    belt.appendChild(slot);
  }
}
function selectSlot(n){ if(n>=1 && n<=INVENTORY.length){ activeItemSlot=n; rebuildBelt(); } }

function useActiveItem(){
  const item = INVENTORY[activeItemSlot-1];
  if(!item) return;
  toast(`Use: ${item.name}`, 700);
}
function placeActiveItem(){
  const item = INVENTORY[activeItemSlot-1];
  if(!item) return;
  toast(`Place: ${item.name}`, 700);
}
function tossActiveItem(){
  const item = INVENTORY[activeItemSlot-1];
  if(!item) return;
  toast(`Toss: ${item.name}`, 700);
}

/* ============================================================
   Input System (WASD + pointer-lock mouse + touch halves)
   ============================================================ */
const InputSystem = (()=>{
  let move = {x:0,z:0}, running=false;
  let lookDelta = {x:0,y:0};
  let actionsQueue = [];
  let pointerLocked = false;

  const keys = new Set();
  const keyMap = {
    'KeyW':'fw','ArrowUp':'fw', 'KeyS':'bk','ArrowDown':'bk',
    'KeyA':'lt','ArrowLeft':'lt','KeyD':'rt','ArrowRight':'rt',
    'ShiftLeft':'run','ShiftRight':'run',
    'Digit1':'slot1','Digit2':'slot2','Digit3':'slot3','Digit4':'slot4','Digit5':'slot5',
    'KeyN':'openNotebook',
    'KeyF':'toggleFlash','KeyU':'toggleUV','KeyI':'toggleIR',
    'KeyQ':'slotPrev','KeyE':'slotNext'
  };

  function recomputeMove(){
    const f = (keys.has('fw')?1:0) + (keys.has('bk')?-1:0);
    const r = (keys.has('rt')?1:0) + (keys.has('lt')?-1:0);
    move.z = f; move.x = r;
    running = keys.has('run');
  }
  function onKey(e,down){
    const tag = keyMap[e.code];
    if(tag){
      if(down) keys.add(tag); else keys.delete(tag);
      recomputeMove();
      if(down && /^slot(Prev|Next|[1-5])|openNotebook|toggle(F|U|IR)$/.test(tag)) actionsQueue.push(tag);
    }
  }

  function bindPointerLock(canvas){
    function pl(){ try{ canvas.requestPointerLock && canvas.requestPointerLock(); }catch{} }
    canvas.addEventListener('click', pl);
    document.addEventListener('pointerlockchange', ()=>{ pointerLocked=document.pointerLockElement===canvas; });
    document.addEventListener('mousemove', (e)=>{
      if(!pointerLocked) return;
      lookDelta.x += e.movementX||0;
      lookDelta.y += e.movementY||0;
    });
  }

  // Touch halves: left=move, right=look (each 50% width), start at 20% screen height
  function bindTouchHalves(){
    const left  = document.getElementById('touch-left');
    const right = document.getElementById('touch-right');
    let leftId=null, rightId=null;
    let lastRight = null;

    left.addEventListener('touchstart', e=>{
      for(const t of e.changedTouches) if(leftId===null){ leftId=t.identifier; break; }
    }, {passive:false});
    right.addEventListener('touchstart', e=>{
      for(const t of e.changedTouches) if(rightId===null){ rightId=t.identifier; lastRight={x:t.clientX,y:t.clientY}; break; }
    }, {passive:false});

    function norm(v,dead=10){ return Math.abs(v)<dead?0:v; }

    window.addEventListener('touchmove', e=>{
      for(const t of e.changedTouches){
        if(t.identifier===leftId){
          const cx = t.clientX, cy = t.clientY;
          const midX = window.innerWidth*0.25; // center of left half
          const refY = window.innerHeight*0.70; // comfort vertical center
          const vx = norm(cx - midX);
          const vy = norm(cy - refY);
          move.x = Math.sign(vx);
          move.z = vy<0 ? 1 : (vy>0 ? -1 : 0);
        } else if(t.identifier===rightId){
          if(lastRight){
            lookDelta.x += (t.clientX - lastRight.x);
            lookDelta.y += (t.clientY - lastRight.y);
          }
          lastRight = {x:t.clientX, y:t.clientY};
        }
      }
    }, {passive:false});

    window.addEventListener('touchend', e=>{
      for(const t of e.changedTouches){
        if(t.identifier===leftId){ leftId=null; move.x=0; move.z=0; }
        if(t.identifier===rightId){ rightId=null; lastRight=null; }
      }
    }, {passive:false});
  }

  function bindUIButtons(){
    const push = a=>actionsQueue.push(a);
    const byId = id=>document.getElementById(id);
    [
      ['btn-use','use'],['btn-place','place'],['btn-toss','toss'],
      ['btn-slot-prev','slotPrev'],['btn-slot-next','slotNext'],
      ['btn-notebook','openNotebook']
    ].forEach(([id,a])=>{ const el=byId(id); if(el) el.onclick=()=>push(a); });

    // Inspector toggle
    const insp = byId('btn-inspector');
    if (insp){
      insp.onclick = ()=>{
        try{
          if (!scene) return;
          if (scene.debugLayer.isVisible()) scene.debugLayer.hide();
          else scene.debugLayer.show({ overlay:true });
        }catch(e){ console.warn('Inspector load failed', e); }
      };
    }
  }

  return {
    init(canvas){
      document.addEventListener('keydown', e=>onKey(e,true));
      document.addEventListener('keyup',   e=>onKey(e,false));
      bindPointerLock(canvas);
      bindTouchHalves();
      bindUIButtons();
    },
    snapshot(){
      const out = {
        moveVec: { x: move.x, z: move.z },
        running,
        lookDelta: { x: lookDelta.x, y: lookDelta.y },
        actions: actionsQueue.splice(0)
      };
      lookDelta.x = 0; lookDelta.y = 0;
      return out;
    }
  };
})();

/* ============================================================
   Movement & Look helpers (invert Y for look)
   ============================================================ */
function handleMovementFromInput(input, dt){
  if(!window.camera || !window.scene) return;
  const speedWalk = (window.player?.speedWalk) || 0.9;
  const speedRun  = (window.player?.speedRun)  || 1.8;
  const speed = input.running ? speedRun : speedWalk;

  const fwd = camera.getForwardRay().direction.clone(); fwd.y = 0; fwd.normalize();
  const right = BABYLON.Vector3.Cross(fwd, BABYLON.Axis.Y).scale(-1);
  const desired = fwd.scale(input.moveVec.z).add(right.scale(input.moveVec.x));
  if (desired.lengthSquared()>0){
    const v = desired.normalize().scale(speed * dt * 60 * 0.0167);
    camera.cameraDirection = v;
  } else {
    camera.cameraDirection = BABYLON.Vector3.Zero();
  }
}
function applyLookFromInput(lookDelta){
  if(!window.camera) return;
  const sens = 0.0022;     // higher = less hand travel needed
  camera.rotation.y += lookDelta.x * sens;
  const invertY = -1;      // invert up/down as requested
  const minPitch = -Math.PI/2 + 0.15;
  const maxPitch =  Math.PI/2 - 0.15;
  const pitch = (camera.rotation.x || 0) + (invertY * lookDelta.y * sens * 0.8);
  camera.rotation.x = Math.min(maxPitch, Math.max(minPitch, pitch));
}

/* ============================================================
   Simple belt action routing for input actions
   ============================================================ */
function wireActionButtons(){ /* InputSystem already wires DOM buttons */ }
</script>

<script>
/* ============================================================
   Procedural RAIN (no external texture) + Weather
   ============================================================ */
let __rainDynTex = null;
function makeRainTexture(scene){
  if (__rainDynTex) return __rainDynTex;
  // a 2x32 vertical streak, soft gradient
  const w=2, h=32;
  const dt = new BABYLON.DynamicTexture("rainDynTex", {width:w, height:h}, scene, false);
  const ctx = dt.getContext();
  ctx.clearRect(0,0,w,h);
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0.00, "rgba(255,255,255,0.00)");
  g.addColorStop(0.20, "rgba(255,255,255,0.40)");
  g.addColorStop(0.50, "rgba(255,255,255,0.85)");
  g.addColorStop(0.80, "rgba(255,255,255,0.40)");
  g.addColorStop(1.00, "rgba(255,255,255,0.00)");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);
  dt.update(false);
  __rainDynTex = dt;
  return dt;
}
function ensureRainPS(scene){
  if (weather.rainPS) return weather.rainPS;
  const ps = new BABYLON.ParticleSystem("rain", 3500, scene);
  ps.particleTexture = makeRainTexture(scene);
  ps.minEmitBox = new BABYLON.Vector3(-90, 55, -90);
  ps.maxEmitBox = new BABYLON.Vector3( 90, 55,  90);
  ps.minSize = 0.8; ps.maxSize = 1.2;
  ps.minLifeTime = 0.6; ps.maxLifeTime = 1.0;
  ps.direction1 = new BABYLON.Vector3(-0.2, -1.6, 0.1);
  ps.direction2 = new BABYLON.Vector3( 0.2, -1.4,-0.1);
  ps.gravity = new BABYLON.Vector3(0, -9.8, 0);
  ps.emitRate = 1800;
  ps.updateSpeed = 0.015;
  ps.color1 = new BABYLON.Color4(0.95, 0.98, 1.00, 0.85);
  ps.color2 = new BABYLON.Color4(0.95, 0.98, 1.00, 0.55);
  ps.colorDead = new BABYLON.Color4(1,1,1,0.0);
  ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
  ps.disposeOnStop = false;
  weather.rainPS = ps;
  return ps;
}
function setWeather(state){
  weather.state = state;
  const label = document.getElementById('hud-weather');
  if (label) label.textContent = state;

  if (weather.rainPS) weather.rainPS.stop();
  if (weather.snowPS) weather.snowPS.stop();

  if (state === 'Clear'){
    applyNightPalette?.();
    return;
  }
  if (state === 'Snow'){
    applyNightPalette?.();
    if (!weather.snowPS){
      const ps = new BABYLON.ParticleSystem("snow", 2200, scene);
      const snowTex = new BABYLON.DynamicTexture("snowTex",{width:8,height:8},scene,false);
      const ctx = snowTex.getContext(); ctx.clearRect(0,0,8,8);
      ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(4,4,3,0,Math.PI*2); ctx.fill(); snowTex.update(false);
      ps.particleTexture = snowTex;
      ps.minEmitBox = new BABYLON.Vector3(-80, 42, -80);
      ps.maxEmitBox = new BABYLON.Vector3( 80, 42,  80);
      ps.minSize = 0.06; ps.maxSize = 0.14;
      ps.minLifeTime = 2.0; ps.maxLifeTime = 3.6;
      ps.emitRate = 1100;
      ps.direction1 = new BABYLON.Vector3(-0.15, -0.7, 0.1);
      ps.direction2 = new BABYLON.Vector3( 0.15, -0.9,-0.1);
      ps.gravity = new BABYLON.Vector3(0,-0.2,0);
      ps.updateSpeed = 0.02;
      ps.color1 = new BABYLON.Color4(1,1,1,0.95);
      ps.color2 = new BABYLON.Color4(1,1,1,0.70);
      ps.disposeOnStop = false;
      weather.snowPS = ps;
    }
    weather.snowPS.start();
    return;
  }
  if (state === 'Rain' || state === 'Blood Moon'){
    if (state === 'Blood Moon'){ applyBloodMoonPalette?.(); applyMoonTintForWeather?.(); }
    else { applyNightPalette?.(); }
    const ps = ensureRainPS(scene);
    ps.start();
    scheduleNextLightning();
    return;
  }
}

/* Night/BloodMoon palettes + moon tint */
function applyNightPalette(){
  scene.clearColor = new BABYLON.Color4(0.01,0.01,0.02,1);
  scene.ambientColor = new BABYLON.Color3(0.02,0.02,0.05);
  scene.imageProcessingConfiguration.exposure = 0.8;
  scene.imageProcessingConfiguration.contrast = 1.15;
  scene.environmentIntensity = 0.25;
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.0045;
  scene.fogColor = new BABYLON.Color3(0.02,0.03,0.05);
}
function applyBloodMoonPalette(){
  scene.clearColor = new BABYLON.Color4(0.02,0,0.02,1);
  scene.ambientColor = new BABYLON.Color3(0.04,0.01,0.02);
  scene.imageProcessingConfiguration.exposure = 0.5;
  scene.imageProcessingConfiguration.contrast = 1.2;
  scene.environmentIntensity = 0.25;
  scene.fogDensity = 0.005;
  scene.fogColor = new BABYLON.Color3(0.06,0.01,0.02);
}
function applyMoonTintForWeather(){
  const node = scene.getMeshByName("MoonMesh");
  if (!node) return;
  const mat = node.material;
  if (weather.state === 'Blood Moon'){
    if (mat && mat.emissiveColor) mat.emissiveColor = new BABYLON.Color3(0.9, 0.16, 0.16);
  } else {
    if (mat && mat.emissiveColor) mat.emissiveColor = new BABYLON.Color3(1,1,1);
  }
}
</script>

<script>
/* ============================================================
   LOADERS: Map, Moon, Ghost (random spawn + visibility control)
   ============================================================ */
async function loadMap(){
  try{
    const result = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/map/", "Abandoned_House.glb", scene);
    houseRoot = result.meshes[0] || result.meshes.find(m=>m.name==="__root__");
    result.meshes.forEach(m=>{ m.checkCollisions = true; m.isPickable = true; m.receiveShadows = true; });
  }catch(e){
    console.warn("Map load failed, using ground fallback", e);
    const ground = BABYLON.MeshBuilder.CreateGround("fallbackGround", { width:160, height:160 }, scene);
    ground.position.y = 0; ground.checkCollisions = true;
    const gmat = new BABYLON.StandardMaterial("gmat", scene);
    gmat.diffuseColor = new BABYLON.Color3(0.06,0.08,0.12); gmat.specularColor = new BABYLON.Color3(0,0,0);
    ground.material = gmat;
  }
}
function afterMapLoadedForShadows(){ (scene.meshes||[]).forEach(m=> m && (m.receiveShadows = true)); }
function adoptExistingGltfLights(){ return 0; }
function buildHouseLights(){
  const p=new BABYLON.PointLight("houseLight_0", new BABYLON.Vector3(0,4,0), scene);
  p.intensity=0.0; p.range=14; houseLights.push({light:p, mesh:null});
}

async function loadMoon(){
  try{
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/sky/", "moon.glb", scene);
    const moonMesh = r.meshes.find(m=>m.name && m.name!=="__root__") || r.meshes[0];
    if(moonMesh){
      moonMesh.name = "MoonMesh";
      moonMesh.isPickable=false; moonMesh.applyFog=false; moonMesh.renderingGroupId=1;
      const mat = moonMesh.material || new BABYLON.StandardMaterial("moonMat", scene);
      mat.disableLighting = true; mat.emissiveColor = new BABYLON.Color3(1,1,1); moonMesh.material = mat;
      moonMesh.position = new BABYLON.Vector3(0, 350, 380);
      scene.onBeforeRenderObservable.add(()=>{
        const t = performance.now()*0.00002;
        moonMesh.position.x = Math.cos(t)*380;
        moonMesh.position.z = Math.sin(t)*380;
        moonMesh.position.y = 340 + Math.sin(t*1.7)*10;
      });
    }
  }catch(e){ console.warn("Moon load failed", e); }
}

/* ---------------- Ghost data & flicker profile ---------------- */
const GHOST_TYPES = ['Phantom', 'Oni', 'Wraith', 'Spirit', 'Revenant'];
let currentGhostType = null;

function randomPointInHouse(){
  if (!houseRoot){
    return new BABYLON.Vector3(43.657, 1.2, -119.008);
  }
  const bb = houseRoot.getHierarchyBoundingVectors(true);
  const x = BABYLON.Scalar.Lerp(bb.min.x+2, bb.max.x-2, Math.random());
  const z = BABYLON.Scalar.Lerp(bb.min.z+2, bb.max.z-2, Math.random());
  // Try to drop to the nearest pick under a high Y
  const ray = new BABYLON.Ray(new BABYLON.Vector3(x, (bb.max.y||8)+4, z), new BABYLON.Vector3(0,-1,0), 40);
  const hit = scene.pickWithRay(ray, m=>m && m.isPickable!==false);
  const y = hit?.pickedPoint ? (hit.pickedPoint.y+0.05) : 1.2;
  return new BABYLON.Vector3(x, y, z);
}

function makeGhostVisibilityController(mesh){
  if(!mesh) return null;
  // A tiny state machine that sets mesh.visibility (or material alpha) based on pattern
  let t=0, on=false, next=0;
  let alphaWhenOn = 0.85;
  return {
    reset(){ t=0; on=false; next=0; },
    setSolid(v){ alphaWhenOn = v; },
    tick(dt, mode, profile){
      // mode: 'idle' | 'event' | 'hunt'
      // profile: 'Phantom' | 'Oni' | 'Default'
      t += dt;
      // idle -> invisible
      if (mode==='idle'){
        apply(0);
        return;
      }
      if (t>=next){
        // schedule next burst segment
        // "a couple of fast flickers followed by one slightly slower"
        const fast = (Math.random()*0.08)+0.05; // 50–130ms
        const slow = (Math.random()*0.22)+0.28; // 280–500ms
        // Phantom: less visible, often fully invisible ~1s
        // Oni: appears more solid, less flicker; longer visible periods
        let onDur, offDur;
        if (profile==='Phantom'){
          onDur  = fast * 0.6;
          offDur = 1.0 + Math.random()*0.6; // roughly ~1s invisible between flashes
        } else if (profile==='Oni'){
          onDur  = 0.30 + Math.random()*0.25; // 0.30–0.55s solid
          offDur = 0.70; // spread about every 0.7–1.0s (see next assignment)
          // add variety
          if (Math.random()<0.5) offDur = 1.0;
        } else {
          onDur  = fast;     // fast
          offDur = slow;     // then slower
        }
        on = true; next = t + onDur;
        apply(alphaWhenOn);
        // After onDur, go off for offDur
        setTimeout(()=>{ on=false; apply(0); }, onDur*1000);
        setTimeout(()=>{ /* allow next segment */ }, (onDur+offDur)*1000);
        next += offDur; // schedule next on-segment after offDur
      } else {
        apply(on ? alphaWhenOn : 0);
      }

      function apply(a){
        if (!mesh) return;
        if (mesh.material && 'alpha' in mesh.material){
          mesh.material.alpha = a;
        } else {
          mesh.visibility = a;
        }
      }
    }
  };
}

async function loadGhost(){
  currentGhostType = GHOST_TYPES[(Math.random()*GHOST_TYPES.length)|0];
  try{
    const list = ["ghost1.glb","ghost2.glb","ghost3.glb","ghost4.glb","ghost5.glb"];
    const pick = list[(Math.random()*list.length)|0];
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/ghosts/", pick, scene);
    const g = r.meshes[0] || r.meshes.find(m=>m.name==="__root__");
    if(g){
      g.isPickable=false; g.checkCollisions=false;
      const bb = g.getHierarchyBoundingVectors(true);
      const height = bb.max.y - bb.min.y;
      const scale = (1.9 / (height || 1));
      g.scaling = new BABYLON.Vector3(scale, scale, scale);
      g.position = randomPointInHouse();
      // Material ensure alpha channel
      if (!g.material){
        g.material = new BABYLON.StandardMaterial("ghostMat", scene);
        g.material.emissiveColor = new BABYLON.Color3(0.6,0.7,1.0);
      }
      if (g.material){ g.material.alpha = 0.0; }

      const vis = makeGhostVisibilityController(g);
      window.ghost = {
        mesh:g,
        visible:false,
        mode:'idle', // 'idle' | 'event' | 'hunt'
        flicker: vis,
        stepInterval:0.55,
        footAudible:18
      };
      // Phantom less visible; Oni more solid
      if (currentGhostType==='Phantom') vis.setSolid(0.45);
      else if (currentGhostType==='Oni') vis.setSolid(0.95);
      return;
    }
  }catch(e){
    console.warn("Ghost GLB failed, using cube fallback", e);
  }
  // Fallback translucent cube ghost
  const m = BABYLON.MeshBuilder.CreateBox("fallbackGhost",{size:1.2},scene);
  const mat = new BABYLON.StandardMaterial("fgMat", scene);
  mat.alpha=0.0; // invisible initially
  mat.emissiveColor=new BABYLON.Color3(0.6,0.6,1);
  m.material=mat; m.isPickable=false;
  m.position = randomPointInHouse();
  const vis = makeGhostVisibilityController(m);
  if (currentGhostType==='Phantom') vis.setSolid(0.45);
  else if (currentGhostType==='Oni') vis.setSolid(0.95);
  window.ghost = { mesh:m, visible:false, mode:'idle', flicker:vis, stepInterval:0.55, footAudible:18 };
}
</script>

<script>
/* ============================================================
   BOOT + MAIN LOOP (includes belt rebuild + ghost state)
   ============================================================ */
async function boot(){
  engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true, disableWebGL2Support:false });
  try{ engine.setHardwareScalingLevel(1 / (window.devicePixelRatio||1)); }catch{}
  scene = new BABYLON.Scene(engine);
  scene.environmentTexture = null;
  scene.collisionsEnabled = true;
  scene.gravity = new BABYLON.Vector3(0, -0.5, 0);

  // Camera
  camera = new BABYLON.UniversalCamera("playerCam", new BABYLON.Vector3(43.657, 3, -119.008), scene);
  camera.attachControl(canvas, true);
  camera.applyGravity = true;
  camera.checkCollisions = true;
  camera.ellipsoid = new BABYLON.Vector3(0.35, 0.9, 0.35);
  camera.ellipsoidOffset = new BABYLON.Vector3(0, 0.4, 0);
  camera.keysUp = [87]; camera.keysDown = [83]; camera.keysLeft = [65]; camera.keysRight = [68];
  camera.minZ = 0.1; camera.inertia = 0;
  camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

  // Atmosphere
  applyNightPalette();
  hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  hemiLight.intensity = 0.06;

  // Content
  await loadMap().catch(()=>{});
  afterMapLoadedForShadows();
  if (!adoptExistingGltfLights()) buildHouseLights();
  await loadGhost().catch(()=>{});
  await loadMoon().catch(()=>{});

  // UI / Input
  InputSystem.init(canvas);
  document.getElementById("hud").style.display="block";
  rebuildBelt();

  toast("WASD to move • Pointer-Lock look • Inspector button for tools", 2600);

  // Simple ghost behavior timers: random events, and hunts (placeholder triggers)
  let eventTimer = 0, nextEvent = 8 + Math.random()*10;
  let huntTimer  = 0, nextHunt  = 45 + Math.random()*30;

  scene.onBeforeRenderObservable.add(()=>{
    const dt = engine.getDeltaTime()/1000;

    const input = InputSystem.snapshot();

    // Movement & look
    handleMovementFromInput(input, dt);
    applyLookFromInput(input.lookDelta);

    // Item actions
    for (const a of input.actions){
      switch(a){
        case 'use': useActiveItem(); break;
        case 'place': placeActiveItem(); break;
        case 'toss': tossActiveItem(); break;
        case 'openNotebook': toast("Notebook (placeholder)", 800); break;
        case 'toggleFlash': /* not implemented here */ break;
        case 'toggleUV':    /* not implemented here */ break;
        case 'toggleIR':    /* not implemented here */ break;
        case 'slot1': case 'slot2': case 'slot3': case 'slot4': case 'slot5':
          selectSlot(parseInt(a.replace('slot',''),10)); break;
        case 'slotNext': activeItemSlot = activeItemSlot>=5 ? 1 : (activeItemSlot+1); rebuildBelt(); break;
        case 'slotPrev': activeItemSlot = activeItemSlot<=1 ? 5 : (activeItemSlot-1); rebuildBelt(); break;
      }
    }

    // HUD
    document.getElementById('hud-sanity').textContent = `${player.sanity|0}%`;
    if (camera){
      const xyz = document.getElementById('hud-xyz');
      xyz.style.display='block';
      document.getElementById('hud-x').textContent = camera.position.x.toFixed(2);
      document.getElementById('hud-y').textContent = camera.position.y.toFixed(2);
      document.getElementById('hud-z').textContent = camera.position.z.toFixed(2);
    }

    // Weather loop
    if (weather.state==='Rain' || weather.state==='Blood Moon'){
      weather.lightningTimer += dt;
      if(weather.lightningTimer > weather.nextStrike){ lightningStrike(); scheduleNextLightning(); }
      if (weather.rainPS){ weather.rainPS.emitRate = inVanZone(camera.position) ? 0 : 1800; }
    }

    // ---- Ghost behavior ----
    if (window.ghost && ghost.mesh){
      // random mild wandering inside bounds
      if (houseRoot){
        if (!ghost._wanderDir || Math.random()<0.01){
          const angle = Math.random()*Math.PI*2;
          const speed = 0.25; // m/s walk
          ghost._wanderDir = new BABYLON.Vector3(Math.cos(angle)*speed, 0, Math.sin(angle)*speed);
        }
        const pos = ghost.mesh.position;
        const step = ghost._wanderDir.scale(dt);
        const bb = houseRoot.getHierarchyBoundingVectors(true);
        const next = pos.add(step);
        if (next.x>bb.min.x+1 && next.x<bb.max.x-1 && next.z>bb.min.z+1 && next.z<bb.max.z-1){
          ghost.mesh.position = next;
        } else {
          ghost._wanderDir = null; // pick new
        }
      }

      // state timers
      eventTimer += dt; huntTimer += dt;
      if (ghost.mode!=='hunt' && eventTimer>nextEvent){
        ghost.mode = 'event';
        eventTimer = 0; nextEvent = 10 + Math.random()*12;
      }
      if (huntTimer>nextHunt){
        ghost.mode = 'hunt';
        huntTimer = 0; nextHunt = 55 + Math.random()*40;
        document.getElementById('hud-hunt-state').textContent = 'HUNTING';
      }

      // auto-fallout of states
      if (ghost.mode==='event'){
        ghost._eventDur = (ghost._eventDur||0) + dt;
        if (ghost._eventDur>4.0){ ghost._eventDur=0; ghost.mode='idle'; }
      } else if (ghost.mode==='hunt'){
        ghost._huntDur = (ghost._huntDur||0) + dt;
        if (ghost._huntDur>8.0){ ghost._huntDur=0; ghost.mode='idle'; document.getElementById('hud-hunt-state').textContent='Calm'; }
      }

      // visibility flicker controller
      const profile = (currentGhostType==='Phantom')?'Phantom':(currentGhostType==='Oni')?'Oni':'Default';
      const mode = ghost.mode||'idle';
      ghost.flicker && ghost.flicker.tick(dt, mode, profile);
    }
  });

  engine.runRenderLoop(()=> scene.render());
  window.addEventListener('resize', ()=> engine.resize());
}
</script>

<script>
/* ============================================================
   START FLOW (robust binding)
   ============================================================ */
let __started=false, __starting=false;

async function safeStart(){
  if(__started || __starting) return;
  __starting = true;
  if(!window.BABYLON || !BABYLON.Engine){ toast("Engine not ready. Check Babylon includes.", 2200); __starting=false; return; }

  const screen = document.getElementById('title-screen');
  const btn    = document.getElementById('start-button');

  try{
    if(btn){ btn.disabled = true; btn.textContent = 'Starting…'; }
    if(screen) screen.style.display='none';

    await boot();

    // Pick initial weather
    const r = Math.random();
    const w = r < 0.40 ? 'Clear' : r < 0.65 ? 'Rain' : r < 0.85 ? 'Snow' : 'Blood Moon';
    setWeather(w);
    toast(`Investigation started. Weather: ${w}.`, 1600);

    __started = true;
  }catch(err){
    console.error('[Start] error', err);
    if(screen){ screen.style.display='flex'; if(btn){ btn.disabled=false; btn.textContent='Start Investigation'; } }
  }finally{
    __starting = false;
  }
}
function bindStartControls(){
  const btn    = document.getElementById('start-button');
  const screen = document.getElementById('title-screen');
  if(btn && !btn.__wired){
    btn.__wired = true;
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); safeStart(); });
    btn.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.code==='Space'){ e.preventDefault(); safeStart(); }});
  }
  if(screen && !screen.__wired){
    screen.__wired = true;
    screen.addEventListener('click', (e)=>{ if(e.target===screen) safeStart(); });
  }
}
document.addEventListener('DOMContentLoaded', bindStartControls);
window.addEventListener('load', bindStartControls);
window.addEventListener('keydown', (e)=>{
  const screen=document.getElementById('title-screen');
  if(!screen || screen.style.display==='none') return;
  if(e.key==='Enter' || e.code==='Space'){ e.preventDefault(); safeStart(); }
});
</script>
