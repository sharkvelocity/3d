<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phasma-Phoney 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Babylon CDN -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background-color: black; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #loadingScreen {
      position: absolute; width: 100%; height: 100%;
      background: radial-gradient(#000000, #111111); color: white;
      font-family: 'Courier New', monospace;
      display: flex; align-items: center; justify-content: center;
      z-index: 99;
    }
    #touchControls {
      position: absolute; bottom: 15px; left: 15px;
      display: flex; flex-direction: column; gap: 5px; z-index: 20;
    }
    .touchBtn {
      width: 50px; height: 50px;
      background: rgba(255,255,255,0.1); color: white;
      border: 1px solid white; border-radius: 8px;
      text-align: center; line-height: 50px; font-weight: bold;
      user-select: none;
    }
    #hud {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      font-family: monospace; color: white; z-index: 10;
      text-shadow: 1px 1px 2px black;
    }
    #coords {
      position: absolute; top: 10px; right: 10px;
      color: lime; font-family: monospace; font-size: 12px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="loadingScreen">Booting Phasma‑Phoney...</div>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">Room: -- | Temp: -- | Sanity: 100%</div>
  <div id="coords">X: 0, Z: 0</div>
  <div id="touchControls">
    <div class="touchBtn" id="btnUp">↑</div>
    <div style="display: flex; gap: 5px;">
      <div class="touchBtn" id="btnLeft">←</div>
      <div class="touchBtn" id="btnDown">↓</div>
      <div class="touchBtn" id="btnRight">→</div>
    </div>
  </div>

<script>
/* ================================
   PART 2: GLOBAL VARS & CONSTANTS
================================== */
let canvas = document.getElementById("renderCanvas");
let engine = new BABYLON.Engine(canvas, true);
let scene, camera, playerMesh;
let ghostMesh, ghostProfile;
let currentRoom = "Outside";
let sanity = 100;
let isHunting = false;
let isChasing = false;
let ghostSpeed = 1.7;
let ghostTarget = null;
let mimicTarget = null;
let activeItems = [];
let inventory = [];
let roomZones = {};
let ghostModelId = 0;
let ghostLastSeenPlayerTime = 0;
let ghostModelOptions = ["ghost1.glb", "ghost2.glb", "ghost3.glb"];
let ghostState = "wandering";
let lastGhostRoam = 0;
let ghostRoom = null;
let ghostVisible = false;
let huntTimer = null;
let ghostBlinkInterval = 0;
let ghostNextMimicTime = Date.now() + (Math.random() * 90000 + 30000);
let ghostStartTime = Date.now();
let mimicProfile = null;
let thayeAge = 0;
let thayeLastCheck = Date.now();
let smudgeCooldownEnd = 0;
let crucifixBlock = false;
let lastSmudgeUse = 0;
let fuseBoxOn = true;
let bloodMoon = false;
let lastMistEvent = 0;
let touchedElectronics = false;
let currentTemperature = 10;
let tempTimer = 0;
let huntSanityThreshold = 50;
let lightSources = [];
let flameObjects = [];
let radioCooldown = 0;
let flashlightOn = true;
let isDead = false;
let lastDoorTouch = 0;
let ghostInLOS = false;
let eventActive = false;
let lastInteractionTime = 0;

/* ================================
   PART 3: SCENE INITIALIZATION
================================== */
scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);
let light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
light.intensity = 0.8;

/* ================================
   PART 4: LOAD HAUNTED HOUSE GLB
================================== */
BABYLON.SceneLoader.AppendAsync("/models/", "Abandoned_House.glb", scene).then(() => {
  scene.meshes.forEach(mesh => {
    mesh.checkCollisions = true;
    mesh.isPickable = true;
    mesh.freezeWorldMatrix();
  });
  document.getElementById("loadingScreen").style.display = "none";
  setupCameraAndPlayer();
});
</script>
<script>
/* ================================
   PART 5: SETUP CAMERA & CONTROLS
================================== */
function setupCameraAndPlayer() {
  camera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(0, 2, 0), scene);
  camera.attachControl(canvas, true);
  camera.speed = 1.6;
  camera.inertia = 0.1;
  camera.angularSensibility = 5000;
  camera.applyGravity = true;
  camera.ellipsoid = new BABYLON.Vector3(0.5, 1, 0.5);
  camera.checkCollisions = true;

  scene.gravity = new BABYLON.Vector3(0, -0.25, 0);
  scene.collisionsEnabled = true;
  camera.keysUp.push(87);    // W
  camera.keysDown.push(83);  // S
  camera.keysLeft.push(65);  // A
  camera.keysRight.push(68); // D

  window.addEventListener("keydown", e => {
    if (e.code === "ShiftLeft") camera.speed = 3;
  });
  window.addEventListener("keyup", e => {
    if (e.code === "ShiftLeft") camera.speed = 1.6;
  });

  createPlayerMesh();
}

/* ================================
   PART 6: SETUP PLAYER MESH
================================== */
function createPlayerMesh() {
  playerMesh = BABYLON.MeshBuilder.CreateBox("player", {height: 3, width: 1, depth: 1}, scene);
  playerMesh.isVisible = false;
  playerMesh.checkCollisions = true;
  playerMesh.ellipsoid = new BABYLON.Vector3(0.5, 1.5, 0.5);
  playerMesh.position = new BABYLON.Vector3(0, 2, 0);
  playerMesh.parent = camera;
}

/* ================================
   PART 7: INVENTORY + UI ELEMENTS
================================== */
let inventorySlots = 3;
let notebookOpen = false;
inventory = ["Camera", "Spirit Box", "EMF Reader"];
const lighter = "Lighter";
const notebookBtn = document.createElement("button");
notebookBtn.innerText = "📖";
notebookBtn.style.position = "absolute";
notebookBtn.style.bottom = "10px";
notebookBtn.style.right = "10px";
notebookBtn.style.zIndex = "50";
notebookBtn.onclick = () => {
  notebookOpen = !notebookOpen;
  alert("Notebook toggled! (Insert actual UI here)");
};
document.body.appendChild(notebookBtn);

/* ================================
   PART 8: DEBUG TOOLS & FLY MODE
================================== */
let flyMode = false;
window.addEventListener("keydown", e => {
  if (e.key === "`") {
    flyMode = !flyMode;
    camera.applyGravity = !flyMode;
    camera.checkCollisions = !flyMode;
    console.log("Fly mode:", flyMode ? "ON" : "OFF");
  }
});

// Coordinate display
scene.registerBeforeRender(() => {
  const pos = camera.position;
  document.getElementById("coords").innerText = `X: ${pos.x.toFixed(1)}, Z: ${pos.z.toFixed(1)}`;
});
</script>
<script>
/* ================================
   PART 9: HUD & ROOM DETECTION
================================== */
function detectRoom() {
  let foundRoom = "Unknown";
  for (let mesh of scene.meshes) {
    if (mesh.name.startsWith("Room") && mesh.getBoundingInfo().boundingBox.intersectsPoint(camera.position)) {
      foundRoom = mesh.name;
      break;
    }
  }
  document.getElementById("room").innerText = `Room: ${foundRoom}`;
}

/* ================================
   PART 10: GHOST SPAWNING & VISIBILITY
================================== */
let ghostMesh, ghostModelID = 1, blinkVisible = false, lastBlink = 0;

function spawnGhost() {
  ghostMesh = BABYLON.MeshBuilder.CreateBox("ghost", {size: 1}, scene);
  ghostMesh.position = new BABYLON.Vector3(5, 1, 5);
  ghostMesh.material = new BABYLON.StandardMaterial("ghostMat", scene);
  ghostMesh.material.diffuseColor = new BABYLON.Color3(1, 1, 1);
  ghostMesh.isVisible = false;

  ghostModelID = Math.floor(Math.random() * 3) + 1; // ghost1, ghost2, ghost3
  ghostProfile = pickRandomGhost();
}

/* ================================
   PART 11: GHOST AI – WANDER → CHASE
================================== */
let ghostState = "wandering";
let ghostTarget = null;
let ghostWaypoint = null;
let ghostSpeed = 1.7;

function updateGhostAI() {
  const playerPos = camera.position;
  const ghostPos = ghostMesh.position;
  const dist = BABYLON.Vector3.Distance(playerPos, ghostPos);
  const direction = playerPos.subtract(ghostPos).normalize();

  if (ghostState === "wandering") {
    if (dist < 10 && hasLineOfSight(ghostPos, playerPos)) {
      ghostState = "chasing";
      ghostWaypoint = playerPos.clone();
    } else {
      wanderGhost();
    }
  } else if (ghostState === "chasing") {
    ghostMesh.moveWithCollisions(direction.scale(ghostSpeed / 60));
    if (dist < 1.5) {
      ghostWaypoint = playerPos.clone(); // Refresh waypoint
    } else if (!hasLineOfSight(ghostPos, playerPos)) {
      ghostState = "searching";
    }
  } else if (ghostState === "searching") {
    // Try ghostWaypoint
    const toWaypoint = ghostWaypoint.subtract(ghostPos);
    ghostMesh.moveWithCollisions(toWaypoint.normalize().scale(ghostSpeed / 60));
    if (BABYLON.Vector3.Distance(ghostMesh.position, ghostWaypoint) < 1) {
      ghostState = "wandering";
    }
  }
}

/* ================================
   PART 12: GHOST PROFILES + RULES
================================== */
const ghostProfiles = {
  "Spirit": {
    evidence: ["EMF 5", "Spirit Box", "Ghost Writing"],
    speed: 1.7,
    huntSanity: 50,
    special: "Smudging prevents hunts for 3 minutes."
  },
  "Wraith": {
    evidence: ["EMF 5", "Spirit Box", "DOTS"],
    speed: 1.7,
    huntSanity: 50,
    special: "Teleports to player. Avoids salt. Cannot step in salt."
  },
  "Phantom": {
    evidence: ["Spirit Box", "Fingerprints", "DOTS"],
    speed: 1.7,
    huntSanity: 50,
    special: "Invisible longer during hunt. Photo during event makes it disappear. Drains sanity near it during events."
  },
  "Poltergeist": {
    evidence: ["Spirit Box", "Fingerprints", "Ghost Writing"],
    speed: 1.7,
    huntSanity: 50,
    special: "Throws many objects rapidly. High polter activity."
  },
  "Banshee": {
    evidence: ["Fingerprints", "Ghost Orb", "DOTS"],
    speed: 1.7,
    huntSanity: 50,
    special: "Targets only one player until that player dies or leaves."
  },
  "Jinn": {
    evidence: ["EMF 5", "Fingerprints", "Freezing Temps"],
    speed: 2.5,
    huntSanity: 50,
    special: "Fast with line of sight and breaker on. Cannot turn off breaker."
  },
  "Mare": {
    evidence: ["Spirit Box", "Ghost Orb", "Ghost Writing"],
    speed: 1.7,
    huntSanity: 60,
    special: "More active in dark. Can turn off lights. Hunts sooner in darkness."
  },
  "Revenant": {
    evidence: ["Ghost Orb", "Ghost Writing", "Freezing Temps"],
    speed: 3.0,
    searchSpeed: 1.0,
    huntSanity: 50,
    special: "Extremely fast when chasing. Slows drastically if player is hidden."
  },
  "Shade": {
    evidence: ["EMF 5", "Ghost Writing", "Freezing Temps"],
    speed: 1.7,
    huntSanity: 35,
    special: "Won't hunt if player is in same room. Low ghost event rate. Appears as shadow often."
  },
  "Demon": {
    evidence: ["Fingerprints", "Ghost Writing", "Freezing Temps"],
    speed: 1.7,
    huntSanity: 70,
    special: "Hunts very early. Interaction and hunt frequency is high. Smudge prevents hunts only for 1 minute."
  },
  "Yurei": {
    evidence: ["Ghost Orb", "Freezing Temps", "DOTS"],
    speed: 1.7,
    huntSanity: 50,
    special: "15% sanity drain ability. Smudge locks ghost in room for 90s. Interacts heavily with doors."
  },
  "Oni": {
    evidence: ["EMF 5", "Freezing Temps", "DOTS"],
    speed: 1.7,
    huntSanity: 50,
    special: "More visible (longer blink). No mist events. Frequent physical interactions."
  },
  "Hantu": {
    evidence: ["Fingerprints", "Ghost Orb", "Freezing Temps"],
    speed: { warm: 1.4, cold: 2.5 },
    huntSanity: 50,
    special: "Moves faster in colder rooms. Visible breath when breaker is off. Slowed by fire."
  },
  "Yokai": {
    evidence: ["Spirit Box", "Ghost Orb", "DOTS"],
    speed: 1.7,
    huntSanity: 80,
    special: "During hunt, only detects electronics in 2.5m. Can't hear outside that range."
  },
  "Goryo": {
    evidence: ["EMF 5", "Fingerprints", "DOTS"],
    speed: 1.7,
    huntSanity: 50,
    special: "Only shows DOTS on camera. Never changes ghost room."
  },
  "Myling": {
    evidence: ["EMF 5", "Fingerprints", "Ghost Writing"],
    speed: 1.7,
    huntSanity: 50,
    special: "Footsteps quieter during hunt. More frequent sound events."
  },
  "Onryo": {
    evidence: ["Spirit Box", "Ghost Orb", "Freezing Temps"],
    speed: 1.7,
    huntSanity: 60,
    special: "Each flame blown out increases chance to hunt. Hunts after 3 extinguishes. Avoids fire."
  },
  "The Twins": {
    evidence: ["EMF 5", "Spirit Box", "Freezing Temps"],
    speed: { main: 1.5, decoy: 1.9 },
    huntSanity: 50,
    special: "Dual interactions. Hunt can start from either twin. One faster, one slower."
  },
  "Raiju": {
    evidence: ["EMF 5", "Ghost Orb", "DOTS"],
    speed: { base: 1.7, nearElectronics: 2.5 },
    huntSanity: { withElectronics: 65, without: 50 },
    special: "Faster near electronics. Disrupts from 15m. Speed increase persists briefly."
  },
  "Obake": {
    evidence: ["EMF 5", "Fingerprints", "Ghost Orb"],
    speed: 1.7,
    huntSanity: 50,
    special: "Rarely leaves six-finger prints. Can shapeshift models every 15s during hunt for 1s."
  },
  "The Mimic": {
    evidence: ["Spirit Box", "Fingerprints", "Freezing Temps", "Ghost Orb (fake)"],
    speed: 1.7,
    huntSanity: 50,
    special: "Mimics other ghosts every 30–120s. Always shows fake Ghost Orbs. Copies other ghost abilities/weaknesses."
  },
  "Moroi": {
    evidence: ["Spirit Box", "Ghost Writing", "Freezing Temps"],
    speed: { min: 1.7, max: 3.71 },
    huntSanity: 50,
    special: "Curses you via Spirit Box. Speed scales with sanity. Smudge stuns for 7.5s."
  },
  "Deogen": {
    evidence: ["Spirit Box", "Ghost Writing", "DOTS"],
    speed: { far: 3.0, near: 0.4 },
    huntSanity: 40,
    special: "Always knows player location. Fast at distance, slows drastically when close."
  },
  "Thaye": {
    evidence: ["Ghost Orb", "Ghost Writing", "DOTS"],
    speed: { young: 2.7, old: 1.0 },
    huntSanity: { young: 75, old: 15 },
    special: "Ages over time if near players. Activity, hunt rate, and speed decrease as it ages (up to 10 stages)."
  },
  "Succubus": {
    evidence: ["Ghost Orb", "DOTS", "Ghost Writing"],
    speed: 2.0,
    huntSanity: 60,
    special: "Drains extra sanity during ghost events. Tries to isolate players. Flirty voice lines. Rare mist effects."
  }
};

function pickRandomGhost() {
  return ghostProfiles[Math.floor(Math.random() * ghostProfiles.length)];
}

function hasLineOfSight(start, end) {
  const ray = new BABYLON.Ray(start, end.subtract(start).normalize(), 30);
  const hit = scene.pickWithRay(ray, mesh => mesh.name !== "player" && !mesh.isPickable === false);
  return !hit.hit;
}
</script>
<script>
/* ================================
   PART 13: HUNT LOGIC & SANITY SYSTEM
================================== */
let sanity = 100;
let lastSanityDrop = Date.now();
let huntActive = false;
let lastHuntTime = 0;
let smudgeCooldown = 0;
let crucifixUsed = false;

function updateSanity() {
  if (Date.now() - lastSanityDrop > 5000 && !huntActive) {
    sanity -= Math.random() * 2 + 1;
    sanity = Math.max(0, sanity);
    document.getElementById("sanity").innerText = `Sanity: ${Math.round(sanity)}%`;
    lastSanityDrop = Date.now();
  }
}

function tryStartHunt() {
  if (huntActive || Date.now() - lastHuntTime < 30000) return;
  if (sanity < 50 && Math.random() < 0.005) {
    if (crucifixUsed) {
      crucifixUsed = false;
      log("Crucifix prevented a hunt.");
      return;
    }
    startHunt();
  }
}

function startHunt() {
  log("The ghost is hunting!");
  huntActive = true;
  lastHuntTime = Date.now();
  ghostState = "chasing";
  setTimeout(() => {
    huntActive = false;
    log("The ghost stopped hunting.");
    ghostState = "wandering";
  }, 30000);
}

function useSmudge() {
  if (Date.now() < smudgeCooldown) return;
  smudgeCooldown = Date.now() + 90000;
  if (huntActive) {
    ghostState = "wandering";
    huntActive = false;
    log("You used a Smudge Stick. The ghost is repelled.");
  } else {
    log("Smudge Stick used. Ghost weakened temporarily.");
  }
}

function useCrucifix() {
  crucifixUsed = true;
  log("Crucifix placed.");
}

/* ================================
   PART 14: SOUND SYSTEM
================================== */
const ambient = new Audio('/audio/ambient.mp3');
ambient.loop = true;
ambient.volume = 0.3;
ambient.play();

const whisper = new Audio('/audio/whisper.mp3');
const heartbeat = new Audio('/audio/heartbeat.mp3');
heartbeat.loop = true;

function playWhisper() {
  whisper.volume = 0.5;
  whisper.play();
}

function playHeartbeat() {
  heartbeat.volume = 0.6;
  heartbeat.play();
}

function stopHeartbeat() {
  heartbeat.pause();
  heartbeat.currentTime = 0;
}

function triggerGhostInteraction() {
  if (Math.random() < 0.02) playWhisper();
}

/* ================================
   PART 15: RENDER LOOP & DOM INIT
================================== */
engine.runRenderLoop(() => {
  detectRoom();
  updateSanity();
  tryStartHunt();
  updateGhostAI();
  if (ghostProfile.name === "Phantom" || ghostProfile.blinkLess) {
    let now = Date.now();
    if (now - lastBlink > 2000) {
      blinkVisible = !blinkVisible;
      ghostMesh.setEnabled(blinkVisible);
      lastBlink = now;
    }
  } else {
    ghostMesh.setEnabled(true);
  }

  scene.render();
});

window.addEventListener("resize", () => {
  engine.resize();
});

document.getElementById("loadingOverlay").style.display = "none";
log("Investigation started.");
</script>
</body>
</html>
