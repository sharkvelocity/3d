<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Phasma-Phoney 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./favicon.ico" />

  <!-- Babylon core + loaders + GUI + materials + inspector (from your local /cdn) -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script>
  <script src="./cdn/gui/babylon.gui.min.js"></script>
  <script src="./cdn/materialsLibrary/babylonjs.materials.js"></script>
  <script src="./cdn/inspector/babylon.inspector.bundle.js"></script>

  <!-- RecastJS (navmesh) from your /cdn -->
  <script src="./cdn/recast.js"></script>

  <style>
    html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #renderCanvas { width:100%; height:100%; touch-action:none; display:block; }

    /* HUD */
    #hud { position:fixed; top:10px; left:10px; color:#fff; font-size:13px; background:rgba(0,0,0,0.35); padding:8px 10px; border-radius:6px; z-index:20; }
    #hud.hidden { display:none; }

    /* Dev unlock hint (shown only after dev mode enabled) */
    #devPanel { position:fixed; top:10px; right:10px; width:280px; max-height:90vh; overflow:auto; background:rgba(0,0,0,0.55); border:1px solid #666; border-radius:8px; padding:10px; color:#fff; z-index:30; display:none; }
    #devPanel h3 { margin:6px 0 8px; font-size:15px; font-weight:700; }
    #devPanel button, #devPanel .row > button { display:block; width:100%; margin:6px 0; padding:8px; background:rgba(255,255,255,0.08); border:1px solid #888; color:#fff; border-radius:6px; cursor:pointer; }
    #devPanel button:active { transform: translateY(1px); }
    #devPanel .row { display:flex; gap:8px; }
    #devPanel .row > button { width:50%; }

    /* Touch pads for mobile (left-move, right-look) */
    .touchpad {
      position:fixed; bottom:16px; width:40%; height:36%;
      background:rgba(255,255,255,0.05); border:1px dashed rgba(255,255,255,0.15);
      border-radius:12px; z-index:15;
      user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    }
    #movePad { left:12px; }
    #lookPad { right:12px; }

    /* Simple pin marker */
    .pin-label {
      position:absolute; color:#0f0; font-size:12px; text-shadow:0 0 4px #000;
      transform: translate(-50%, -120%);
      pointer-events:none;
    }

    /* Dev-mode unlock overlay */
    #unlockNote { position:fixed; bottom:10px; left:10px; color:#bbb; font-size:12px; background:rgba(0,0,0,0.35); padding:6px 8px; border-radius:6px; z-index:12; }
    #unlockNote strong { color:#fff; }

    /* Misc */
    .hide { display:none !important; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    Room: <span id="hudRoom">Outside</span><br/>
    Sanity: <span id="hudSanity">100%</span><br/>
    Weather: <span id="hudWeather">Clear</span><br/>
    Loc: X=<span id="hudX">0</span> Y=<span id="hudY">0</span> Z=<span id="hudZ">0</span>
  </div>

  <!-- Dev unlock hint (only text until unlocked) -->
  <div id="unlockNote">
    Hold <strong>X + Y + Z</strong> for 3 seconds to open developer mode.
  </div>

  <!-- Dev Panel -->
  <div id="devPanel">
    <h3>Developer Mode</h3>
    <div class="row">
      <button id="btnToggleLocation">Toggle Location HUD</button>
      <button id="btnFly">Fly (Hover) On/Off</button>
    </div>
    <div class="row">
      <button id="btnShowGhost">Show/Hide Ghost</button>
      <button id="btnShowNavMesh">Show/Hide NavMesh</button>
    </div>
    <div class="row">
      <button id="btnAddRamp">Add Ramp @ Camera</button>
      <button id="btnAddBarrier">Add Barrier Box @ Camera</button>
    </div>
    <div class="row">
      <button id="btnRebuildNav">Rebuild NavMesh</button>
      <button id="btnPin">Pin Location</button>
    </div>
    <button id="btnDevLog">Create Dev Log</button>
    <small>Tip: barriers/ramps are invisible colliders (navmesh respects them after rebuild).</small>
  </div>

  <!-- Mobile touch pads -->
  <div id="movePad" class="touchpad hide"></div>
  <div id="lookPad" class="touchpad hide"></div>

<script>
(() => {
  // --------------- Core Babylon Setup ---------------
  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true });
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0,0,0,1);
  scene.collisionsEnabled = true;
  scene.gravity = new BABYLON.Vector3(0, -0.5, 0); // a bit floaty

  // Lighting (soft hemi + subtle directional for rim)
  const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  hemi.intensity = 0.7;
  const dir = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-0.5,-1,0.2), scene);
  dir.intensity = 0.2;

  // --------------- Camera & Controls ---------------
  const VAN_SPAWN = new BABYLON.Vector3(31.47, 1.7, 0.0); // first-person at van
  const camera = new BABYLON.UniversalCamera("fp", VAN_SPAWN.clone(), scene);
  camera.minZ = 0.1;
  camera.speed = 0.45;
  camera.angularSensibility = 1800; // lower = faster mouse
  camera.inertia = 0.7;
  camera.checkCollisions = true;
  camera.applyGravity = true;
  camera.ellipsoid = new BABYLON.Vector3(0.4, 0.9, 0.4);
  camera.ellipsoidOffset = new BABYLON.Vector3(0, 0.9, 0);

  camera.attachControl(canvas, true);

  // Pointer lock for desktop
  canvas.addEventListener("click", () => {
    if (document.pointerLockElement !== canvas) canvas.requestPointerLock?.();
  });

  // --------------- Mobile Touch Controls ---------------
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const movePad = document.getElementById("movePad");
  const lookPad = document.getElementById("lookPad");
  if (isMobile) {
    movePad.classList.remove("hide");
    lookPad.classList.remove("hide");
  }

  let moveVec = new BABYLON.Vector3(0,0,0);
  let lookDelta = new BABYLON.Vector2(0,0);

  function bindTouchpad(pad, onDelta) {
    let active = false, startX=0, startY=0;
    pad.addEventListener("pointerdown", (e) => { active=true; startX=e.clientX; startY=e.clientY; pad.setPointerCapture(e.pointerId); });
    pad.addEventListener("pointermove", (e) => {
      if (!active) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      onDelta(dx, dy);
    });
    pad.addEventListener("pointerup", (e) => { active=false; onDelta(0,0,true); pad.releasePointerCapture(e.pointerId); });
    pad.addEventListener("pointercancel", () => { active=false; onDelta(0,0,true); });
  }

  // Left pad: movement
  bindTouchpad(movePad, (dx, dy, reset) => {
    if (reset) { moveVec.set(0,0,0); return; }
    const mag = Math.min(1, Math.hypot(dx, dy)/80);
    const ang = Math.atan2(dy, dx);
    const forward = Math.cos(ang);
    const strafe = Math.sin(ang);
    moveVec.x = strafe * mag;
    moveVec.z = forward * mag;
  });

  // Right pad: look (yaw/pitch)
  bindTouchpad(lookPad, (dx, dy, reset) => {
    if (reset) { lookDelta.set(0,0); return; }
    camera.cameraRotation.y += -dx * 0.002;
    camera.cameraRotation.x += -dy * 0.002;
  });

  // WASD (desktop)
  const keyState = {};
  window.addEventListener("keydown", (e)=> keyState[e.key.toLowerCase()] = true);
  window.addEventListener("keyup", (e)=> keyState[e.key.toLowerCase()] = false);

  scene.onBeforeRenderObservable.add(() => {
    // Desktop movement
    const fwd = camera.getDirection(BABYLON.Axis.Z);
    const right = camera.getDirection(BABYLON.Axis.X);
    let desired = new BABYLON.Vector3(0,0,0);

    if (keyState["w"]) desired.addInPlace(fwd);
    if (keyState["s"]) desired.subtractInPlace(fwd);
    if (keyState["a"]) desired.subtractInPlace(right);
    if (keyState["d"]) desired.addInPlace(right);

    // Mobile movement contribution
    if (moveVec.length() > 0) {
      const f = camera.getDirection(BABYLON.Axis.Z).scale(moveVec.z);
      const r = camera.getDirection(BABYLON.Axis.X).scale(moveVec.x);
      desired.addInPlace(f).addInPlace(r);
    }

    if (!flyMode && desired.length() > 0) {
      desired.normalize();
      camera.moveWithCollisions(desired.scale(camera.speed));
    } else if (flyMode && desired.length() > 0) {
      desired.normalize();
      camera.position.addInPlace(desired.scale(camera.speed));
    }

    // HUD
    if (showLocationHUD) {
      hudX.textContent = camera.position.x.toFixed(2);
      hudY.textContent = camera.position.y.toFixed(2);
      hudZ.textContent = camera.position.z.toFixed(2);
    }
  });

  // --------------- World / Model Load ---------------
  const devLog = [];
  function logDev(msg) {
    const line = `[${new Date().toISOString()}] ${msg}`;
    console.log(line);
    devLog.push(line);
  }

  const solidColliders = [];   // barriers & ramps
  let houseMeshes = [];
  let navPlugin = null;
  let navMeshDebug = null;

  async function loadHouse() {
    try {
      const result = await BABYLON.SceneLoader.AppendAsync("./assets/models/map/", "Abandoned_House.glb", scene);
      // AppendAsync adds meshes to scene; gather them:
      houseMeshes = scene.meshes.filter(m => m.name && m !== null);
      houseMeshes.forEach(m => { m.checkCollisions = true; m.isPickable = true; });

      // Centering around origin if needed (optional):
      // (We honor your spawn coords; house assumed already centered in GLB.)

      logDev(`House loaded: ${houseMeshes.length} meshes`);
    } catch (e) {
      logDev(`ERROR loading house GLB: ${e?.message||e}`);
    }
  }

  // Ground (in case GLB lacks one outside)
  const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 400, height: 400}, scene);
  ground.position.y = 0;
  ground.checkCollisions = true;
  ground.isPickable = false;
  const gmat = new BABYLON.StandardMaterial("gmat", scene);
  gmat.diffuseColor = new BABYLON.Color3(0.05,0.05,0.06);
  ground.material = gmat;

  // --------------- Recast / NavMesh ---------------
  async function buildNavMesh() {
    if (!window.Recast) {
      logDev("ERROR: RecastJS not found (cdn/recast.js).");
      return;
    }
    if (navMeshDebug) { navMeshDebug.dispose(); navMeshDebug = null; }
    navPlugin = new BABYLON.RecastJSPlugin();

    const inputMeshes = [...houseMeshes, ...solidColliders];
    if (!inputMeshes.length) { logDev("No meshes available for NavMesh."); return; }

    // Typical tuned params for interior levels
    const nmParams = {
      cs: 0.2, ch: 0.2, walkableSlopeAngle: 45, walkableHeight: 2,
      walkableClimb: 0.6, walkableRadius: 0.4, maxEdgeLen: 12,
      maxSimplificationError: 1.3, minRegionArea: 8, mergeRegionArea: 20,
      maxVertsPerPoly: 6, detailSampleDist: 6, detailSampleMaxError: 1
    };

    navPlugin.createNavMesh(inputMeshes, nmParams);
    navMeshDebug = navPlugin.createDebugNavMesh(scene);
    navMeshDebug.isVisible = showNavMesh;
    logDev("NavMesh rebuilt.");
  }

  function closestNavPoint(pos) {
    return navPlugin ? navPlugin.getClosestPoint(pos) : pos.clone();
  }

  function computePath(from, to) {
    return navPlugin ? navPlugin.computePath(closestNavPoint(from), closestNavPoint(to)) : [];
  }

  // --------------- Ghost Agent ---------------
  let ghostMesh = BABYLON.MeshBuilder.CreateSphere("ghost", {diameter: 0.8}, scene);
  ghostMesh.isVisible = false;
  ghostMesh.position = VAN_SPAWN.add(new BABYLON.Vector3(0, 0.5, 5));
  const ghostMat = new BABYLON.StandardMaterial("ghostMat", scene);
  ghostMat.emissiveColor = new BABYLON.Color3(0.8, 0.9, 1.0);
  ghostMat.alpha = 0.6;
  ghostMesh.material = ghostMat;

  let ghostEnabled = false;
  let showNavMesh = false;
  let flyMode = false;
  let showLocationHUD = true;

  // Roaming path
  let path = [];
  let pathIndex = 0;
  const GHOST_SPEED = 0.05;

  function randomNavTarget() {
    // Random point near camera within radius; project to closest nav point.
    const r = 25;
    const rand = new BABYLON.Vector3(
      camera.position.x + (Math.random()*2-1)*r,
      camera.position.y,
      camera.position.z + (Math.random()*2-1)*r
    );
    return closestNavPoint(rand);
  }

  function requestNewPath() {
    if (!navPlugin) return;
    const from = ghostMesh.position.clone();
    const to = randomNavTarget();
    path = computePath(from, to);
    pathIndex = 0;
    logDev(`Ghost path len: ${path.length}`);
  }

  scene.onBeforeRenderObservable.add(() => {
    if (!ghostEnabled || !ghostMesh.isVisible || !navPlugin) return;
    if (!path || path.length < 2) { requestNewPath(); return; }

    const target = path[pathIndex];
    if (!target) { requestNewPath(); return; }

    const dir = target.subtract(ghostMesh.position);
    const dist = dir.length();
    if (dist < 0.2) {
      pathIndex++;
      if (pathIndex >= path.length) requestNewPath();
      return;
    }
    dir.normalize();
    ghostMesh.position.addInPlace(dir.scale(GHOST_SPEED));
  });

  // --------------- Dev Tools: Barriers & Ramps ---------------
  function addBarrierBoxAtCamera() {
    const pos = camera.position.clone();
    // Width/Depth/Height tuned; you can adjust later.
    const box = BABYLON.MeshBuilder.CreateBox(`barrier_${solidColliders.length}`, { width: 4, depth: 0.4, height: 4 }, scene);
    box.position = new BABYLON.Vector3(pos.x + 4, 2, pos.z); // place 4m in front
    box.checkCollisions = true;
    box.isPickable = false;
    box.visibility = 0.0; // invisible
    solidColliders.push(box);
    logDev(`Barrier added at ${box.position.toString()}`);
  }

  function addRampAtCamera() {
    const pos = camera.position.clone();
    // Create a shallow ramp
    const ramp = BABYLON.MeshBuilder.CreateBox(`ramp_${solidColliders.length}`, { width: 2.5, depth: 5, height: 0.2 }, scene);
    ramp.position = new BABYLON.Vector3(pos.x + 3, pos.y + 0.3, pos.z);
    ramp.rotation.x = BABYLON.Tools.ToRadians(12); // incline
    ramp.checkCollisions = true;
    ramp.isPickable = true;
    ramp.visibility = 0.1; // faintly visible to you for placement
    solidColliders.push(ramp);
    logDev(`Ramp added at ${ramp.position.toString()}`);
  }

  // --------------- Pins (Dev Only) ---------------
  const pins = [];
  function pinLocation() {
    const pos = camera.position.clone();
    const pin = BABYLON.MeshBuilder.CreateSphere(`pin_${pins.length}`, {diameter:0.25}, scene);
    pin.position = pos;
    const mat = new BABYLON.StandardMaterial(`pinMat_${pins.length}`, scene);
    mat.emissiveColor = new BABYLON.Color3(0.1,1,0.1);
    pin.material = mat;

    // 2D label
    const label = document.createElement("div");
    label.className = "pin-label";
    label.textContent = `(${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)})`;
    document.body.appendChild(label);

    pins.push({ mesh: pin, label });

    // Sync 2D label screen position
    scene.onBeforeRenderObservable.add(() => {
      const proj = BABYLON.Vector3.Project(
        pin.position, BABYLON.Matrix.IdentityReadOnly, scene.getTransformMatrix(), camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight())
      );
      label.style.left = `${proj.x}px`;
      label.style.top  = `${proj.y}px`;
      label.style.display = devEnabled ? "block" : "none";
    });

    logDev(`Pin at ${pos.toString()}`);
  }

  // --------------- Dev Mode Unlock ---------------
  let devEnabled = false;
  const hud = document.getElementById("hud");
  const unlockNote = document.getElementById("unlockNote");
  const devPanel = document.getElementById("devPanel");

  const hudRoom = document.getElementById("hudRoom");
  const hudSanity = document.getElementById("hudSanity");
  const hudWeather = document.getElementById("hudWeather");
  const hudX = document.getElementById("hudX");
  const hudY = document.getElementById("hudY");
  const hudZ = document.getElementById("hudZ");

  let xyzDown = { x:false, y:false, z:false };
  let xyzTimer = null;

  function resetXYZ() { xyzDown = {x:false, y:false, z:false}; if (xyzTimer) { clearTimeout(xyzTimer); xyzTimer=null; } }

  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (k === "x" || k === "y" || k === "z") {
      xyzDown[k] = true;
      if (xyzDown.x && xyzDown.y && xyzDown.z && !xyzTimer) {
        xyzTimer = setTimeout(() => {
          const pwd = prompt("Enter developer mode password:");
          if (pwd === "devmode") {
            devEnabled = true;
            devPanel.style.display = "block";
            unlockNote.style.display = "none";
            logDev("Developer Mode ENABLED.");
          } else {
            logDev("Developer Mode password incorrect.");
          }
          resetXYZ();
        }, 3000);
      }
    }
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    if (k === "x" || k === "y" || k === "z") {
      xyzDown[k] = false;
      if (xyzTimer) { clearTimeout(xyzTimer); xyzTimer=null; }
    }
  });

  // --------------- Dev Panel Actions ---------------
  document.getElementById("btnToggleLocation").onclick = () => {
    showLocationHUD = !showLocationHUD;
    hud.classList.toggle("hidden", !showLocationHUD);
  };
  document.getElementById("btnFly").onclick = () => {
    flyMode = !flyMode;
    if (flyMode) {
      camera.applyGravity = false;
      camera.checkCollisions = false;
    } else {
      camera.applyGravity = true;
      camera.checkCollisions = true;
    }
    logDev(`Fly mode: ${flyMode}`);
  };
  document.getElementById("btnShowGhost").onclick = () => {
    ghostEnabled = !ghostEnabled;
    ghostMesh.isVisible = ghostEnabled;
    logDev(`Ghost visibility: ${ghostEnabled}`);
  };
  document.getElementById("btnShowNavMesh").onclick = () => {
    showNavMesh = !showNavMesh;
    if (navMeshDebug) navMeshDebug.isVisible = showNavMesh;
  };
  document.getElementById("btnAddRamp").onclick = addRampAtCamera;
  document.getElementById("btnAddBarrier").onclick = addBarrierBoxAtCamera;
  document.getElementById("btnRebuildNav").onclick = buildNavMesh;
  document.getElementById("btnPin").onclick = pinLocation;
  document.getElementById("btnDevLog").onclick = () => {
    const blob = new Blob([devLog.join("\n")], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `phasma_devlog_${Date.now()}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  // --------------- Room name / sanity / weather (simple demo) ---------------
  let sanity = 100;
  let weather = "Clear";
  setInterval(() => {
    sanity = Math.max(0, sanity - 0.25);
    hudSanity.textContent = `${Math.round(sanity)}%`;
    hudWeather.textContent = weather;
  }, 2000);

  // --------------- Start ---------------
  (async function init(){
    await loadHouse();
    await buildNavMesh();     // initial navmesh from house only
    logDev("Init complete. Player at van.");
  })();

  engine.runRenderLoop(() => scene.render());
  window.addEventListener("resize", () => engine.resize());
})();
</script>
</body>
</html>
