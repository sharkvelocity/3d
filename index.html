<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ===================== BOOT LOGGER ===================== -->
  <script>
  (function () {
    if (window.BOOTLOG) return; 
    const t0 = performance.timeOrigin || Date.now();
    const pad = (n)=> (n<10?'0':'')+n;
    function nowIso(){
      const d = new Date();
      return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' +
             pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + '.' +
             String(d.getMilliseconds()).padStart(3,'0');
    }
    function relms(){ return +(performance.now().toFixed(3)); }

    const entries = [];
    function push(type, detail){
      entries.push({ ts: nowIso(), rel_ms: relms(), type, detail });
    }

    const API = {
      mark(label, extra){ push('mark', { label, ...(extra||{}) }); },
      add(type, detail){ push(type, detail); },
      all(){ return entries.slice(); },
      text(){
        return entries.map(e => `[${e.ts} +${e.rel_ms.toFixed(3)}ms] ${e.type} ${JSON.stringify(e.detail||{})}`).join('\n');
      },
      json(){ return JSON.stringify(entries, null, 2); },
      download(fmt){
        const ext = (fmt==='json'?'json':'txt');
        const data = (ext==='json' ? API.json() : API.text());
        const blob = new Blob([data], { type: (ext==='json'?'application/json':'text/plain') });
        const a = document.createElement('a');
        const d = new Date();
        const fn = `bootlog-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.${ext}`;
        a.href = URL.createObjectURL(blob);
        a.download = fn;
        document.body.appendChild(a);
        a.click();
        setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 0);
      }
    };

    window.BOOTLOG = API;
    window.markBoot = API.mark;
    API.mark('page-parse-start', { url: location.href });

    ['log','warn','error'].forEach(kind=>{
      const orig = console[kind].bind(console);
      console[kind] = function(...args){
        try{ API.add('console:'+kind, { args: args.map(String) }); } catch(_){}
        return orig(...args);
      };
    });

    window.addEventListener('error', (e)=> {
      API.add('window:error', {
        message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno,
        stack: (e.error && e.error.stack) || null
      });
    }, true);

    window.addEventListener('unhandledrejection', (e)=>{
      API.add('window:unhandledrejection', { reason: (e.reason && (e.reason.stack||e.reason.message)) || String(e.reason) });
    }, true);

    document.addEventListener('DOMContentLoaded', ()=> API.mark('DOMContentLoaded'));
    window.addEventListener('load', ()=>{
      API.mark('window-load');
      try {
        const res = (performance.getEntriesByType && performance.getEntriesByType('resource')) || [];
        API.add('perf:resources', res.map(r => ({
          name:r.name, initiatorType:r.initiatorType, transferSize:r.transferSize,
          duration: +r.duration.toFixed(2)
        })));
      } catch(_){}
    });

    Array.from(document.scripts || []).forEach(scr => {
      if (!scr.src) return;
      const src = scr.src;
      const onLoad = ()=> API.add('script:load', { src });
      const onErr  = ()=> API.add('script:error', { src });
      scr.addEventListener('load',  onLoad, { once:true });
      scr.addEventListener('error', onErr,  { once:true });
      API.add('script:seen', { src });
    });

    (function pollBabylon(){
      let seen = { BABYLON:false, engine:false, scene:false, camera:false };
      function tick(){
        if (!seen.BABYLON && window.BABYLON){
          seen.BABYLON = true;
          BOOTLOG.mark('BABYLON-present', { version: window.BABYLON?.Engine?.Version || null });
        }
        const eng = window.ENGINE || window.__ENGINE || window.BABYLON?.Engine?.LastCreatedEngine || null;
        const scn = window.SCENE || window.__SCENE || window.BABYLON?.EngineStore?.LastCreatedScene || null;
        const cam = window.camera || window.__camera || scn?.activeCamera || null;

        if (!seen.engine && eng){ seen.engine = true; BOOTLOG.mark('engine-created'); }
        if (!seen.scene  && scn){ seen.scene  = true; BOOTLOG.mark('scene-created'); }
        if (!seen.camera && cam){ seen.camera = true; BOOTLOG.mark('camera-ready'); }

        if (seen.BABYLON && seen.engine && seen.scene && seen.camera) return;
        setTimeout(tick, 50);
      }
      tick();
    })();

    ['pp:start','pp:stage','pp:van:inventory-updated','pp:van:loadout-changed','pp:item:used','pp:item:placed','pp:headgear:flashlight']
      .forEach(evName=>{
        window.addEventListener(evName, (e)=> {
          let d = e?.detail; try{ d = JSON.parse(JSON.stringify(d||{})); }catch(_){}
          API.add('event:'+evName, d);
        });
      });

    function addButton(){
      const btn = document.createElement('button');
      btn.textContent = 'Download Boot Log';
      Object.assign(btn.style, {
        position:'fixed', top:'8px', left:'8px', zIndex:2147483647,
        padding:'6px 10px', font:'12px monospace',
        border:'1px solid #066', borderRadius:'8px',
        background:'#0b1518', color:'#9ef', cursor:'pointer', opacity:'0.85'
      });
      btn.title = 'Click to download boot log (.txt). Hold Shift for JSON.';
      btn.addEventListener('click', (e)=> { BOOTLOG.download(e.shiftKey ? 'json' : 'txt'); });
      document.addEventListener('keydown', (e)=>{
        if (e.ctrlKey && e.shiftKey && (e.key === 'L' || e.key === 'l')) { e.preventDefault(); BOOTLOG.download('txt'); }
      });
      document.body.appendChild(btn);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', addButton);
    } else { addButton(); }
  })();
  </script>

  <style>
    html, body { margin:0; height:100%; width:100%; background:#000; overflow:hidden; font-family:monospace; color:#0ff; touch-action:none; }
    #renderCanvas { width:100vw; height:100vh; display:block; background:#000; outline:none; image-rendering:auto; }

    #loading-box{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(0,0,0,0.92); z-index:2147483000; color:#9ef; }

    #loading-text{ font-size:16px; letter-spacing:.3px; text-align:center; max-width:70vw; }
    #loading-bar{ width:64vw; max-width:720px; height:14px; border:1px solid #066; border-radius:10px; background:#071017; overflow:hidden; }
    #loading-fill{ height:100%; width:0%; background:linear-gradient(90deg,#19f,#0ff); transition:width .15s ease; }

    /* HUD / Belt / Action */
    #hud-bar{ position:fixed; top:10px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:6000; }
    .chip { padding:2px 6px; border:1px solid #066; border-radius:6px; color:#aff; font-size:12px; background:rgba(0,0,0,0.5); }
    .sanity-wrap{ display:flex; align-items:center; gap:6px; padding:0 6px; }
    #sanity-gauge{ width:170px; height:10px; border:1px solid #066; background:#061013; border-radius:8px; overflow:hidden; }
    #sanity-fill{ width:100%; height:100%; background:linear-gradient(90deg,#19f,#0ff); transition:width .25s ease; }
    #hud-xyz { position:fixed; top:36px; right:12px; background:rgba(0,0,0,0.5); border:1px solid #066; padding:6px 8px; color:#0ff; font:12px monospace; z-index:6000; }
    #belt{ position:fixed; left:50%; bottom:72px; transform:translateX(-50%); display:none; gap:12px; z-index:6000; align-items:center; background:rgba(0,0,0,0.55); border:1px solid #066; padding:8px 10px; border-radius:10px; }
    .slot{ width:88px; height:64px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:1px solid #0aa; background:rgba(0,20,20,0.6); position:relative; cursor:pointer; user-select:none; }
    .slot .label{ font-size:12px; color:#adf; text-align:center; line-height:1.1; padding:6px; }
    .slot.active{ outline:2px solid #0ff; box-shadow:0 0 12px rgba(0,255,255,0.45) inset; }
    .hud-btn{ border:1px solid #333; background:#181818; color:#ddd; padding:6px 10px; border-radius:8px; cursor:pointer; }

  <!-- ===================== START BUTTON HOOK ===================== -->
  <script>
  (function wireStart(){
    const btn = document.getElementById('start-button');
    if (!btn) return;
    btn.addEventListener('click', function onStart(){
      try { window.PP?.audio?.init?.(); } catch(e){ console.warn('[audio.init] failed', e); }
      document.getElementById('title-screen')?.remove();
      window.__PP_ALREADY_STARTED__ = true;
      window.dispatchEvent(new CustomEvent('pp:start'));

      const c = document.getElementById('renderCanvas');
      try { c?.requestPointerLock?.(); } catch {}
      try { c?.focus?.(); } catch {}
    }, { once:true });
  })();

  // Dev panel toggle via Esc
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      const panel = document.getElementById('devtools-panel');
      if(panel) panel.style.display = panel.style.display==='none'?'block':'none';
    }
  });
  </script>
