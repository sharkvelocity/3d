    // First-person camera
    firstPersonCam = new BABYLON.UniversalCamera("fpCam", playerSpawnPoint.clone(), scene);

  function createPlayer() {
    player = BABYLON.MeshBuilder.CreateCapsule("player", { height: 2 }, scene);
    player.position = playerSpawnPoint.clone();
    player.ellipsoid = new BABYLON.Vector3(0.5, 1, 0.5);
    player.checkCollisions = true;
    player.applyGravity = true;

    scene.gravity = new BABYLON.Vector3(0, -0.15, 0);
    scene.collisionsEnabled = true;

    firstPersonCam.parent = player;
    thirdPersonCam.lockedTarget = player;

    scene.onBeforeRenderObservable.add(() => {
      updatePlayerMovement();
      updateDebugCoordinates();
    });
  }

  function updatePlayerMovement() {
    let inputMap = {};
    scene.actionManager = new BABYLON.ActionManager(scene);
    scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(
      BABYLON.ActionManager.OnKeyDownTrigger,
      (e) => inputMap[e.sourceEvent.key] = true
    ));
    scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(
      BABYLON.ActionManager.OnKeyUpTrigger,
      (e) => inputMap[e.sourceEvent.key] = false
    ));

    let moveSpeed = 0.1;
    let sprintSpeed = 0.2;

    scene.onBeforeRenderObservable.add(() => {
      let fwd = firstPersonCam.getDirection(BABYLON.Axis.Z).scale(1);
      let right = firstPersonCam.getDirection(BABYLON.Axis.X).scale(1);
      let direction = BABYLON.Vector3.Zero();

      if (inputMap["w"]) direction.addInPlace(fwd);
      if (inputMap["s"]) direction.subtractInPlace(fwd);
      if (inputMap["a"]) direction.subtractInPlace(right);
      if (inputMap["d"]) direction.addInPlace(right);

      direction.normalize();

      let speed = inputMap["Shift"] ? sprintSpeed : moveSpeed;
      player.moveWithCollisions(direction.scale(speed));
    });
  }

isHunting = false;
let huntStartTime = 0;
let huntDuration = 30000; // default 30s
let huntCooldown = 90000;
let lastHuntTime = 0;

function startHunt() {
  if (isHunting || Date.now() - lastHuntTime < huntCooldown) return;
  if (!ghostProfile || sanity > 50) return;

  // Certain ghosts can hunt early
  if (sanity > 20 && !["Demon", "Yurei", "Thaye"].includes(ghostProfile.name)) return;

  // Shade can't hunt in same room
  if (ghostProfile.name === "Shade" && currentRoom === ghostRoom) return;

  isHunting = true;
  huntStartTime = Date.now();
  lastHuntTime = Date.now();
  ghostMesh.setEnabled(true);
  ghostMesh.position = getNearbySpawnPoint(); // choose near player or ghost room
  playHuntVisualsAndAudio();
}

function endHunt() {
  isHunting = false;
  ghostMesh.setEnabled(false);
  stopHuntVisualsAndAudio();
}

function updateHunt() {
  if (!isHunting) return;

  const now = Date.now();
  if (now - huntStartTime > huntDuration) {
    endHunt();
    return;
  }

  if (checkLineOfSight(player, ghostMesh)) {
    if (playerIsCrouching && behindCover()) return;
    if (!hasCrucifixProtection()) {
      killPlayer();
    } else {
      useCrucifix();
      endHunt();
    }
  }
}

function checkLineOfSight(player, ghost) {
  const direction = ghost.position.subtract(player.position).normalize();
  const ray = new BABYLON.Ray(ghost.position, direction, 30);
  const hit = scene.pickWithRay(ray, m => m.name === "playerCollider");
  return hit.hit;
}

function killPlayer() {
  console.log("Player was killed.");
  endHunt();
  // trigger death screen / game over here
}

scene.onBeforeRenderObservable.add(() => {

function getGhostSpeed() {
  if (!ghostProfile) return 1.7;

  let baseSpeed = 1.7;

  const dist = BABYLON.Vector3.Distance(player.position, ghostMesh.position);

  switch (ghostProfile.name) {
    case "Revenant":
      return checkLineOfSight(ghostMesh, player) ? 3.0 : 1.0;
    case "Moroi":
      return 1.6 + ((100 - sanity) / 100) * 2.1; // up to ~3.7
    case "Thaye":
      return getThayeSpeedTier();
    case "Jinn":
      if (checkLineOfSight(ghostMesh, player) && dist > 3) return 2.5;
      break;
    case "Raiju":
      if (isNearElectronics()) return 2.5;
      break;
    case "Hantu":
      return getTemperatureBasedSpeed();
    case "Deogen":
      return dist < 2 ? 0.5 : 3.0;
    case "The Twins":
      return Math.random() < 0.5 ? 1.45 : 1.95;
  }

  if (checkLineOfSight(ghostMesh, player)) {
    baseSpeed *= 1.15;
  }

  return baseSpeed;
}

let thayeDecayTier = 0;
let thayeDecayStart = Date.now();

function getThayeSpeedTier() {
  const tierDuration = 60000; // 1 min per tier
  const elapsed = Date.now() - thayeDecayStart;
  const tier = Math.min(10, Math.floor(elapsed / tierDuration));
  return 1.7 * (1 - tier * 0.08); // drops up to 80%
}

function triggerGhostInteraction() {
  if (!ghostProfile || isHunting) return;
  const inSameRoom = currentRoom === ghostRoom;
  const now = Date.now();

  // Shade never interacts when player is in room
  if (ghostProfile.name === "Shade" && inSameRoom) return;

  const roll = Math.random();

  if (roll < 0.05) {
    // 5% chance of throw event
    playRandomInteractionSound();
    console.log("Ghost threw something.");
  } else if (roll < 0.10) {
    // 5% chance of door touch
    playRandomInteractionSound();
    console.log("Ghost touched a door.");
  } else if (roll < (inSameRoom ? 0.25 : 0.05)) {
    // Radio more likely in ghost room
    if (ghostProfile.name !== "Shade") {
      new BABYLON.Sound("radio", "/audio/radio.mp3", scene, null, { autoplay: true });
      console.log("Radio turned on.");
    }
  }
}

  const timeSince = now - lastBlink;

  // Deogen: always visible
  if (ghostProfile.name === "Deogen") {
    ghostMesh.setEnabled(true);
    return;
  }

  // Oni: less blinking
  const interval = ghostProfile.name === "Oni" ? 4000 : 2000;

  if (timeSince > interval) {
    blinkVisible = !blinkVisible;
    ghostMesh.setEnabled(blinkVisible);
    lastBlink = now;
  }
}

scene.onBeforeRenderObservable.add(() => {
  updateGhostVisibility();
});
let smudgeCooldownEnd = 0;
let crucifixPlaced = null;
let flamesExtinguished = 0;

function useSmudgeStick() {
  if (isHunting) {
    ghostMesh.setEnabled(false);
    isHunting = false;
    lastHuntTime = Date.now();

    const duration = ghostProfile.name === "Moroi" ? 7500 : 5000;
    console.log(`Ghost stunned for ${duration}ms`);
    setTimeout(() => {
      ghostMesh.setEnabled(true);
    }, duration);
  } else {
    let delay = 90000;
    if (ghostProfile.name === "Spirit") delay = 180000;
    if (ghostProfile.name === "Demon") delay = 60000;

    smudgeCooldownEnd = Date.now() + delay;
    console.log(`${ghostProfile.name} can't hunt for ${delay / 1000}s`);
  }
}

function canGhostHuntNow() {
  return Date.now() > smudgeCooldownEnd;
}

function hasCrucifixProtection() {
  const dist = BABYLON.Vector3.Distance(player.position, ghostMesh.position);
  const holding = playerInventory.includes("Crucifix");
  const onGround = crucifixPlaced && dist < 3;

  return holding || onGround;
}

function useCrucifix() {
  if (playerInventory.includes("Crucifix")) {
    playerInventory = playerInventory.filter(i => i !== "Crucifix");
  } else {
    crucifixPlaced = null;
  }
  console.log("Crucifix used to stop hunt.");
}

function dropCrucifixAt(position) {
  crucifixPlaced = position.clone();
}

function extinguishFlame() {
  flamesExtinguished++;
  if (ghostProfile.name === "Onryo" && flamesExtinguished >= 3) {
    startHunt();
    flamesExtinguished = 0;
  }
}
sanity = 100;
let lastSanityTick = Date.now();

function updateSanity() {
  const now = Date.now();
  const elapsed = now - lastSanityTick;

  if (elapsed >= 5000) {
    lastSanityTick = now;

    // Base passive decay
    let decay = 1 + Math.random(); // ~1–2% every 5 seconds

    // Additional decay if near ghost
    const distToGhost = ghostMesh ? BABYLON.Vector3.Distance(player.position, ghostMesh.position) : 999;
    if (isHunting && distToGhost < 6) {
      decay += 3;
    }

    // Ghost-specific sanity effects
    if (ghostProfile.name === "Yurei") {
      decay *= 1.2; // stronger sanity drain
    } else if (ghostProfile.name === "Thaye") {
      decay *= 0.8; // weak drain after aging
    }

    sanity -= decay;
    sanity = Math.max(0, sanity);
    updateHUD();

    if (sanity <= 0 && !isHunting) {
      startHunt();
    }
  }
}

// Call continuously
scene.onBeforeRenderObservable.add(updateSanity);
flyMode = false;
let debugLabel = document.createElement("div");
debugLabel.id = "debug-label";
debugLabel.style.position = "absolute";
debugLabel.style.top = "5px";
debugLabel.style.right = "10px";
debugLabel.style.color = "#0f0";
debugLabel.style.fontSize = "14px";
debugLabel.style.zIndex = "999";
document.body.appendChild(debugLabel);

scene.onBeforeRenderObservable.add(() => {
  const pos = player.position;
  debugLabel.innerText = `X: ${pos.x.toFixed(2)} Y: ${pos.z.toFixed(2)}${flyMode ? " (FLY MODE)" : ""}`;
});

window.addEventListener("keydown", (e) => {
  if (e.key === "`") {
    flyMode = !flyMode;
    player.physicsImpostor.dispose();

    if (flyMode) {
      player.physicsImpostor = null;
    } else {
      player.physicsImpostor = new BABYLON.PhysicsImpostor(player, BABYLON.PhysicsImpostor.BoxImpostor, { mass: 1, restitution: 0 }, scene);
    }
  }
});

// Override movement to support fly mode
scene.onBeforeRenderObservable.add(() => {
  if (!flyMode) return;

  const delta = engine.getDeltaTime() / 1000;
  const moveSpeed = 5;
  const dir = getCameraForwardVector();
  const input = getActiveInput(); // helper you already have

  if (input.forward) player.position.addInPlace(dir.scale(moveSpeed * delta));
  if (input.backward) player.position.addInPlace(dir.scale(-moveSpeed * delta));
  if (input.left) player.position.addInPlace(dir.cross(BABYLON.Axis.Y).scale(-moveSpeed * delta));
  if (input.right) player.position.addInPlace(dir.cross(BABYLON.Axis.Y).scale(moveSpeed * delta));
});
window.addEventListener("DOMContentLoaded", async () => {
  const canvas = document.getElementById("renderCanvas");
  engine = new BABYLON.Engine(canvas, true);
  scene = new BABYLON.Scene(engine);

  await setupScene();      // Part 4
  setupCamera();           // Part 5
  setupPlayer();           // Part 6
  setupInventoryUI();      // Part 7
  setupNotebook();         // Part 8
  setupHUD();              // Part 10
  loadGhost();             // Part 11
  registerGhostAI();       // Part 13
  setupRoomDetection();    // Part 9
  setupSoundSystem();      // Part 16

  engine.runRenderLoop(() => {
    scene.render();
  });

  window.addEventListener("resize", () => {
    engine.resize();
  });

  console.log("Initialized");
});
  </script>
