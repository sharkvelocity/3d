<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PhasmaPhoney — 3D Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="author" content="Shark‑Blades"/>

<!-- ====== Styles ====== -->
<style>
  html, body { width:100%; height:100%; margin:0; padding:0; background:#000; overflow:hidden; }
  #renderCanvas { width:100%; height:100%; touch-action:none; display:block; background:#000; }
  /* HUD: top-left */
  #hud {
    position:fixed; top:10px; left:10px; z-index:30; color:#0ff; font: 12px/1.2 monospace;
    border:2px solid #0ff; border-radius:8px; padding:8px 10px; backdrop-filter: blur(2px);
    background: rgba(0,0,0,.65); width:205px;
  }
  #hud h3 { margin:0 0 6px 0; font:700 13px monospace; color:#8ff; }
  #hud .row { display:flex; justify-content:space-between; gap:8px; }
  #hud .row + .row { margin-top:4px; }
  #hud .mini { color:#7ff; }
  #hud .value { color:#8ff; }

  /* STORAGE button (appears only in van zone) */
  #storageBtn {
    position:fixed; right:22px; top:40%; transform:translateY(-50%);
    border:2px solid #0ff; color:#0ff; background:rgba(0,0,0,.6);
    padding:10px 16px; border-radius:6px; cursor:pointer; z-index:30; display:none;
  }
  #storagePanel {
    position:fixed; right:22px; top:50%; transform:translateY(-50%);
    border:2px solid #0ff; color:#0ff; background:rgba(0,0,0,.8);
    padding:10px; border-radius:8px; z-index:31; display:none; width:260px; max-height:70vh; overflow:auto;
  }
  #storagePanel h4 { margin:6px 0 10px 0; font:700 13px monospace; }
  #storagePanel button { margin:3px 2px; padding:6px 8px; font: 12px monospace;
    color:#0ff; background:#111; border:1px solid #066; border-radius:5px; cursor:pointer; }

  /* Items bar bottom center */
  #itemsBar {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:30;
    display:flex; gap:14px; align-items:flex-end;
  }
  .slot {
    width:92px; height:58px; border:2px solid #0ff; border-radius:10px; background:rgba(0,10,10,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center; color:#8ff; font:11px monospace;
    box-shadow:0 0 10px rgba(0,255,255,.15) inset; position:relative; cursor:pointer;
    transition:transform .08s ease;
  }
  .slot:active { transform:scale(.98); }
  .slot .num { position:absolute; top:-10px; left:10px; font:11px monospace; color:#0ff; background:#000; padding:0 6px; border-radius:8px; border:1px solid #044; }
  .slot.active { outline:2px solid #9ff; box-shadow:0 0 12px rgba(0,255,255,.45) inset; }
  .slot .thumb { width:100%; height:36px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .slot .label { font-size:11px; opacity:.9; }
  /* “in-hand” model marker (small overlay at right side) */
  #handOverlay {
    position:fixed; right:24px; bottom:130px; width:140px; height:140px; pointer-events:none; z-index:20;
    border:2px dashed rgba(0,255,255,.25); border-radius:12px; display:none;
  }

  /* On‑screen mobile controls (simple) */
  #touchPad {
    position:fixed; left:20px; bottom:22px; width:140px; height:140px; border-radius:50%;
    border:2px solid rgba(0,255,255,.35); display:none; z-index:25;
  }
  #touchKnob {
    position:absolute; left:50%; top:50%; width:54px; height:54px; border-radius:50%;
    background:rgba(0,255,255,.15); border:2px solid #0ff; transform:translate(-50%,-50%);
  }
  #actionPad {
    position:fixed; right:22px; bottom:26px; display:none; flex-direction:column; gap:12px; z-index:25;
  }
  .actBtn {
    min-width:84px; border:2px solid #0ff; background:rgba(0,0,0,.6); color:#0ff; border-radius:8px; padding:8px 10px; font:13px monospace;
  }

  /* Developer options (ESC -> password) */
  #devAsk, #devPanel {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:40;
    background:rgba(0,0,0,.6);
  }
  .modal {
    min-width:320px; max-width:520px; color:#0ff; font:13px monospace; padding:16px; border:2px solid #0ff; border-radius:10px; background:#111;
  }
  .modal h3 { margin:0 0 10px 0; }
  .modal input, .modal button { font:13px monospace; padding:6px 9px; border-radius:5px; border:1px solid #066; background:#000; color:#8ff; }
  .modal button { cursor:pointer; }
  #devOpts { display:flex; flex-direction:column; gap:8px; }
  #devOpts button { text-align:left; }

  /* Notebook (ghost info + evidence UI) */
  #notebook {
    position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; z-index:33; align-items:center; justify-content:center;
  }
  #nbPage {
    width:90vw; max-width:1100px; height:74vh; min-height:460px; background:#0a0a0a; border:2px solid #0ff; border-radius:12px;
    display:grid; grid-template-columns: 1.3fr .9fr; gap:14px; padding:14px; color:#9ff; font:13px monospace;
    box-shadow: 0 0 60px rgba(0,255,255,.15) inset, 0 0 20px rgba(0,255,255,.35);
  }
  #nbGhosts, #nbEvidence { border:1px solid #044; border-radius:10px; padding:10px; overflow:auto; background:#030808; }
  #nbGhosts h4, #nbEvidence h4 { margin:0 0 10px 0; }
  #nbGhosts .gRow { display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-bottom:1px dashed #044; }
  #nbGhosts .gRow:last-child { border-bottom:none; }
  .pill { padding:2px 6px; border:1px solid #066; border-radius:12px; color:#8ff; margin-left:4px; }
  .evList { display:flex; flex-wrap:wrap; gap:8px; }
  .ev {
    padding:4px 8px; border:1px solid #066; border-radius:999px; background:#020b0b; cursor:pointer; user-select:none;
  }
  .ev.on { background:#042; border-color:#0d8; color:#aff; }
  #nbFooter { grid-column: 1 / -1; text-align:right; }
  #nbFooter button { border:1px solid #066; padding:6px 10px; background:#000; color:#8ff; border-radius:6px; }

  /* Mini-log bottom-left (dev + system messages) */
  #log {
    position:fixed; left:10px; bottom:10px; width:420px; max-height:40vh; overflow:auto;
    font:12px monospace; color:#8ff; border:1px dashed #044; background:rgba(0,0,0,.55);
    padding:6px 8px; border-radius:8px;
  }
  #flashOverlay { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:10; transition: opacity .15s ease; }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<!-- HUD -->
<div id="hud">
  <h3>Status</h3>
  <div class="row"><span class="mini">Weather</span><span id="weatherVal" class="value">Clear</span></div>
  <div class="row"><span class="mini">Room</span><span id="roomVal" class="value">—</span></div>

<button id="storageBtn">STORAGE</button>

<div id="itemsBar">

<!-- Simple mobile controls -->

<div id="actionPad">

<!-- Developer prompt -->
<div id="devAsk">
  <div class="modal">
    <h3>Enable Developer Options?</h3>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="Dev.cancel()">No</button>
      <button onclick="Dev.promptPass()">Yes</button>
    </div>

</div>
<div id="devPanel">
  <div class="modal">
    <h3>Developer Options</h3>

<!-- Notebook -->
<div id="notebook">
  <div id="nbPage">
    <div id="nbGhosts">
      <h4>Ghosts</h4>
      <div id="ghostList"></div>
    </div>
    <div id="nbEvidence">
      <h4>Evidence</h4>
      <div class="evList" id="evList"></div>
      <div style="margin-top:10px;color:#7ff;">Select found evidence; the possible ghosts list will tighten.</div>
    </div>
    <div id="nbFooter">
      <button onclick="UI.closeNotebook()">Close (Esc)</button>
    </div>
  </div>
</div>

<div id="log"></div>
<div id="flashOverlay"></div>

<!-- ========= BabylonJS (local repo paths) ========= -->
<script src="./cdn/earcut.min.js"></script>
<script src="./cdn/babylon.js"></script>
<script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script>

<script>
/* =============================================================================
   GLOBALS & GAME STATE
============================================================================= */
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true, doNotHandleContextLost:true });

/** Scene, camera, lights */
let scene, camera, light, skybox;
let rainPS = null;
let lightningTimer = 0;
let orbPS = null; // (declare ONCE) orbs particle system for “ghostly orbs” effect (cosmetic)

/** Assets */
const MAP_URL   = "./assets/models/map/Abandoned_House.glb";
const GHOST_URLS= [
  "./assets/models/ghosts/ghost1.glb",
  "./assets/models/ghosts/ghost2.glb",
  "./assets/models/ghosts/ghost3.glb",
  "./assets/models/ghosts/ghost4.glb",
  "./assets/models/ghosts/ghost5.glb"
];
const ITEMS_URL = "./assets/models/items/exploration_objects.glb";

/** Audio */
const SFX = {
  ambient:        "./assets/audio/ambient.mp3",
  rain:           "./assets/audio/rainstorm.mp3",
  doorOpen:       "./assets/audio/doorCreak1.mp3",
  doorClose:      "./assets/audio/doorCreak2.mp3",
  doorSlam:       "./assets/audio/doorSlam1.mp3",
  spiritBox:      "./assets/audio/spiritbox.mp3",
  sbStatic:       "./assets/audio/spiritBoxStatic.mp3",
  whisper:        "./assets/audio/whisper.mp3",
  writing:        "./assets/audio/GhostWriting1.mp3",
  radio:          "./assets/audio/Radio.mp3",
  death:          "./assets/audio/gameKilled.mp3",
  notebookOpen:   "./assets/audio/notebook_open.mp3"
};

const AUDIO = {}; // populated on load

/** Van zone (storage prompt) — tight AABB around PINGs (x≈45–52, z≈-105..-104) */
const VAN_ZONE = { minX:45.2, maxX:52.0, minZ:-105.4, maxZ:-103.9 };

/** Spawn polygon (barrier area) — clockwise list */
const SPAWN_POLY = [
  new BABYLON.Vector3(18.404, 0, -96.040),
  new BABYLON.Vector3(57.205, 0, -94.031),
  new BABYLON.Vector3(62.145, 0, -105.142),
  new BABYLON.Vector3(61.872, 0, -149.928),
  new BABYLON.Vector3(18.660, 0, -149.900),
];

/** Player */
const player = {
  speedWalk: 4.2,
  speedRun:  7.5,
  running: false,
  gravity: new BABYLON.Vector3(0, -0.55, 0),
  sanity: 100,
  room: "Outside",
  canInteract: null,
  godMode: false
};

/** Items & slots (1..3 configurable | 4=Lighter | 5=Notebook) */
const ITEM_DEFS = {
  emf:        { label: "EMF",       meshName: "EMF_Detector_EMF_Detector_0",   rot: new BABYLON.Vector3(0,Math.PI,0), scale:.7 },
  spiritBox:  { label: "Spirit Box",meshName: "Cone.001_Spirit_Box_0",         rot: new BABYLON.Vector3(0,0,0),      scale:1.1 },
  thermo:     { label: "Thermometer",meshName:"Thermometer_Thermometer_0",     rot: new BABYLON.Vector3(0,Math.PI/2,0), scale:1.1 },
  camera:     { label: "Photo Cam", meshName: "Photo_Camera_Photo_Camera_0",   rot: new BABYLON.Vector3(0,Math.PI,0),  scale:1.0 },
  flashlight: { label: "Flashlight",meshName: "Flashlight_Flashlight_0",       rot: new BABYLON.Vector3(0,Math.PI,0),  scale:1.0 },
  thermal:    { label: "Thermal Cam",meshName:"Thermal_Camera_Thermal_Camera_0",rot: new BABYLON.Vector3(0,Math.PI,0),  scale:0.9 },
  recorder:   { label: "Recorder",  meshName: "Voice_Recorder_Voice_Recorder_0",rot: new BABYLON.Vector3(0,Math.PI,0), scale:1.1 }
};

const SLOTS = { 1:null, 2:null, 3:null, 4:"lighter", 5:"notebook" };
let itemsRoot = null;                // root container of loaded item meshes
const inHand = { slot:4, mesh:null } // what we “hold” (tiny overlay mesh)

const EVIDENCE_TYPES = [
  "EMF Level 5", "Spirit Box", "Fingerprints",
  "Ghost Writing", "Freezing Temps", "D.O.T.S", "Orbs"
];

/** Ghost catalog (names + evidence types only) */
const GHOSTS = {
  spirit:      { evidence:["Spirit Box","Ghost Writing","EMF Level 5"] },
  wraith:      { evidence:["Spirit Box","D.O.T.S","EMF Level 5"] },
  poltergeist: { evidence:["Spirit Box","Ghost Writing","Fingerprints"] },
  banshee:     { evidence:["D.O.T.S","Fingerprints","Orbs"] },
  jinn:        { evidence:["EMF Level 5","Freezing Temps","Fingerprints"] },
  mare:        { evidence:["Spirit Box","Ghost Writing","Orbs"] },
  revenant:    { evidence:["Ghost Writing","Orbs","Freezing Temps"] },
  shade:       { evidence:["Ghost Writing","Freezing Temps","EMF Level 5"] },
  demon:       { evidence:["Freezing Temps","Ghost Writing","Fingerprints"] },
  yurei:       { evidence:["Freezing Temps","D.O.T.S","Orbs"] },
  oni:         { evidence:["EMF Level 5","Freezing Temps","D.O.T.S"] },
  yokai:       { evidence:["Spirit Box","D.O.T.S","Orbs"] },
  hantu:       { evidence:["Freezing Temps","Ghost Writing","Fingerprints"] },
  goryo:       { evidence:["EMF Level 5","D.O.T.S","Fingerprints"] },
  myling:      { evidence:["Ghost Writing","EMF Level 5","Fingerprints"] },
  onryo:       { evidence:["Freezing Temps","Spirit Box","Orbs"] },
  "the twins": { evidence:["Spirit Box","Freezing Temps","EMF Level 5"] },
  raiju:       { evidence:["EMF Level 5","D.O.T.S","Orbs"] },
  obake:       { evidence:["EMF Level 5","Orbs","Fingerprints"] },
  "the mimic": { evidence:["Spirit Box","Freezing Temps","Fingerprints"] },
  moroi:       { evidence:["Freezing Temps","Ghost Writing","Spirit Box"] },
  deogen:      { evidence:["Spirit Box","Ghost Writing","D.O.T.S"] },
  thaye:       { evidence:["Ghost Writing","Orbs","D.O.T.S"] },
  phantom:     { evidence:["Spirit Box","D.O.T.S","Fingerprints"] },
  succubus:    { evidence:["Ghost Writing","Orbs","Spirit Box"] }
};

/** Evidence state */
const Evidence = {
  found: new Set(),
  toggle(type) { if(this.found.has(type)) this.found.delete(type); else this.found.add(type); UI.refreshGhostList(); }
};

/** Ghost runtime */
const ghost = {
  name: null,
  node: null,
  anim: { idle:null, walk:null },
  target: null,
  speed: 1.6,
  room: "Outside"
};

/** Doors discovered */
const DOORS = []; // {mesh, openRot, closedRot, isOpen}

/** Developer */
const Dev = {
  active:false,
  asking:false,
  close(){ document.getElementById('devPanel').style.display='none'; },
  cancel(){ document.getElementById('devAsk').style.display='none'; },
  promptPass(){
    const p=document.getElementById('devAuth'); const o=document.getElementById('devOpts');
    p.style.display='block'; o.style.display='none';
  },
  tryEnable(){
    const v = document.getElementById('devPass').value.trim();
    if(v==='devmode'){ this.active=true; log("Developer mode enabled."); const p=document.getElementById('devAuth'); const o=document.getElementById('devOpts'); p.style.display='none'; o.style.display='flex'; }
    else { log("Wrong password."); }
  },
  showAsk(){ this.asking=true; document.getElementById('devAsk').style.display='flex'; },
  showPanel(){
    this.asking=false;
    const p=document.getElementById('devAuth'); const o=document.getElementById('devOpts');
    document.getElementById('devPanel').style.display='flex';
    p.style.display=this.active?'none':'block';
    o.style.display=this.active?'flex':'none';
  },
  teleportToGhost(){ if(ghost.node){ camera.position.copyFrom(ghost.node.position.clone().add(new BABYLON.Vector3(0,1.6,2))); } },
  toggleGod(){ player.godMode=!player.godMode; log("God Mode: "+(player.godMode?"ON":"OFF")); },
  pingXYZ(){
    const p = camera.position; log(`PING @ x:${p.x.toFixed(3)} y:${p.y.toFixed(3)} z:${p.z.toFixed(3)}`);
  },
  recenterToHouse(){ camera.position = new BABYLON.Vector3(40, 2.1, -120); },
  spawnEMFinFront(){
    if(!itemsRoot) return;
    const def=ITEM_DEFS.emf;
    const src = itemsRoot.getChildMeshes(false, m=>m.name===def.meshName)[0];
    if(!src) return;
    const n = src.clone("EMF_"+Date.now());
    n.rotation = def.rot.clone(); n.scaling = new BABYLON.Vector3(def.scale,def.scale,def.scale);
    const dir = camera.getForwardRay(2.2).direction.scale(2.2);
    n.position = camera.position.add(dir).addInPlace(new BABYLON.Vector3(0,-.8,0));
    log("Dev: Spawned EMF.");
  },
  revealGhost(){ if(ghost.name) log("Ghost: "+ghost.name.toUpperCase()+" | Evidence: "+GHOSTS[ghost.name].evidence.join(", ")); }
};

/* =============================================================================
   UTILITIES
============================================================================= */
const logBox = document.getElementById('log');
function log(msg){ const d=document.createElement('div'); d.textContent=msg; logBox.appendChild(d); logBox.scrollTop=logBox.scrollHeight; }
function insideAABB(pos, aabb){ return (pos.x>=aabb.minX && pos.x<=aabb.maxX && pos.z>=aabb.minZ && pos.z<=aabb.maxZ); }
function pointInPolyXZ(p, poly){ // p: Vector3
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x, zi=poly[i].z;
    const xj=poly[j].x, zj=poly[j].z;
    const intersect = ((zi>p.z)!=(zj>p.z)) && (p.x < (xj - xi)*(p.z - zi)/(zj - zi) + xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function randomPointInPoly(poly){
  // simple bbox rejection
  let minX=Infinity,minZ=Infinity,maxX=-Infinity,maxZ=-Infinity;
  poly.forEach(v=>{minX=Math.min(minX,v.x); minZ=Math.min(minZ,v.z); maxX=Math.max(maxX,v.x); maxZ=Math.max(maxZ,v.z);});
  for(let k=0;k<500;k++){
    const x=minX+Math.random()*(maxX-minX);
    const z=minZ+Math.random()*(maxZ-minZ);
    const p=new BABYLON.Vector3(x,0,z);
    if(pointInPolyXZ(p,poly)) return p;
  }
  return poly[0].clone();
}
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

/* =============================================================================
   UI MODULE
============================================================================= */
const hudWeather = document.getElementById('weatherVal');
const hudRoom    = document.getElementById('roomVal');
const hudSanity  = document.getElementById('sanityVal');
const storageBtn = document.getElementById('storageBtn');
const storagePanel=document.getElementById('storagePanel');
const storageItems=document.getElementById('storageItems');

const UI = {
  updateHUD(){ hudSanity.textContent = Math.round(player.sanity)+"%"; hudRoom.textContent = player.room; },
  setWeather(w){ hudWeather.textContent = w; },

  /* Storage */
  openStorage(){
    // simple: list of items we can move to slots 1..3
    storageItems.innerHTML="";
    Object.entries(ITEM_DEFS).forEach(([key,def])=>{
      // prevent lighter/notebook duplication in slots 4/5
      if(key==="flashlight") return; // (flashlight is separate example; leave in DEF if you want it listed)
      const b=document.createElement('button');
      b.textContent = "Add to slot …  ("+def.label+")";
      b.onclick=()=>{
        const s = prompt("Slot number (1..3):","1");
        const n = Number(s);
        if([1,2,3].includes(n)){ SLOTS[n]=key; UI.refreshSlots(); }
      };
      storageItems.appendChild(b);
    });
    const close=document.createElement('button');
    close.textContent="Close"; close.style.marginTop="8px"; close.onclick=()=>UI.closeStorage();
    storageItems.appendChild(close);
    storagePanel.style.display='block';
  },
  closeStorage(){ storagePanel.style.display='none'; },
  maybeShowStorage(){
    const show = insideAABB(camera.position, VAN_ZONE);
    storageBtn.style.display = show ? 'block':'none';
  },

  refreshSlots(){
    for(let i=1;i<=5;i++){
      const lab = document.getElementById('slotLabel'+i);
      const th  = document.getElementById('slotThumb'+i);
      const key = SLOTS[i];
      if(i===4){ lab.textContent="Lighter"; th.textContent="—"; continue; }
      if(i===5){ lab.textContent="Notebook"; th.textContent="—"; continue; }
      if(!key){ lab.textContent="Empty"; th.textContent="—"; continue; }
      lab.textContent = ITEM_DEFS[key].label;
      th.textContent  = key;
    }
    // keep selection bounds
    if(![1,2,3,4,5].includes(inHand.slot)) inHand.slot=4;
    UI.selectSlot(inHand.slot);
    UI.updateHandMesh();
  },

  selectSlot(n){
    // allowed 1..5 (4 lighter, 5 notebook)
    inHand.slot = clamp(n,1,5);
    document.querySelectorAll('.slot').forEach(s=>s.classList.remove('active'));
    const sEl = document.querySelector(`.slot[data-slot="${inHand.slot}"]`);
    if(sEl) sEl.classList.add('active');
    UI.updateHandMesh();
  },

  updateHandMesh(){
    // destroy previous overlay mesh
    if(inHand.mesh){ inHand.mesh.dispose(); inHand.mesh=null; }
    const overlay = document.getElementById('handOverlay');

    // Notebook: show UI
    if(inHand.slot===5){
      overlay.style.display='none';
      return;
    }

    // Lighter or item
    if(inHand.slot===4){
      // simple placeholder box (we could clone lighter if present in GLB)
      overlay.style.display='block';
      return;
    }

    const key = SLOTS[inHand.slot];
    if(!key || !itemsRoot){ overlay.style.display='none'; return; }

    const def = ITEM_DEFS[key];
    const src = itemsRoot.getChildMeshes(false, m=>m.name===def.meshName)[0];
    if(!src){ overlay.style.display='none'; return; }

    const n = src.clone("hand_"+key+"_"+Date.now());
    // make very small & pinned to screen (layer mask trick)
    n.isPickable=false;
    n.alwaysSelectAsActiveMesh=true;
    n.scaling.set(def.scale*.25, def.scale*.25, def.scale*.25);
    n.rotation = def.rot.clone().addInPlace(new BABYLON.Vector3(-.2,.3,0));

    // Attach to utility layer (right-side overlay): just keep it near camera every frame
    inHand.mesh = n;
    overlay.style.display='block';
  },

  /* Notebook building */
  buildNotebook(){
    const gList = document.getElementById('ghostList');
    const evWrap= document.getElementById('evList');
    gList.innerHTML=""; evWrap.innerHTML="";
    // ghost list
    Object.entries(GHOSTS).forEach(([name,prof])=>{
      const row=document.createElement('div'); row.className='gRow';
      const span=document.createElement('span'); span.textContent=name.toUpperCase();
      const tags=document.createElement('div');
      prof.evidence.forEach(e=>{
        const p=document.createElement('span'); p.className='pill'; p.textContent=e; tags.appendChild(p);
      });
      row.appendChild(span); row.appendChild(tags); gList.appendChild(row);
    });
    // evidence pills
    EVIDENCE_TYPES.forEach(type=>{
      const b=document.createElement('div'); b.className='ev'; b.textContent=type;
      b.onclick=()=>{ b.classList.toggle('on'); Evidence.toggle(type); };
      evWrap.appendChild(b);
    });
  },
  refreshGhostList(){
    const chosen = Array.from(Evidence.found);
    const gList = document.getElementById('ghostList');
    const rows = gList.querySelectorAll('.gRow');
    let i=0;
    Object.entries(GHOSTS).forEach(([name,prof])=>{
      const show = chosen.every(ev=>prof.evidence.includes(ev));
      rows[i].style.opacity = show? '1.0' : '0.35';
      rows[i].style.filter  = show? 'none' : 'grayscale(70%)';
      i++;
    });
  },
  openNotebook(){
    AUDIO.notebookOpen && AUDIO.notebookOpen.play();
    document.getElementById('notebook').style.display='flex';
  },
  closeNotebook(){ document.getElementById('notebook').style.display='none'; }
};

/* =============================================================================
   SCENE CREATION
============================================================================= */
async function createScene(){
  scene = new BABYLON.Scene(engine);
  scene.useRightHandedSystem = false;
  scene.gravity = player.gravity.clone();
  scene.collisionsEnabled = true;

  camera = new BABYLON.FreeCamera("cam", new BABYLON.Vector3(49, 1.9, -104.7), scene); // spawn near van (between given PINGs)
  camera.setTarget(new BABYLON.Vector3(50,-.1,-110));
  camera.attachControl(canvas, true);
  camera.minZ = 0.05;
  camera.checkCollisions = true;
  camera.applyGravity = true;
  camera.ellipsoid = new BABYLON.Vector3(0.35, 0.9, 0.35);
  camera.ellipsoidOffset = new BABYLON.Vector3(0, 0.9, 0);
  camera.speed = player.speedWalk;

  // step-up helper (approximate): ray down each frame to keep feet on walkable (mitigates curb/step)
  scene.onBeforeRenderObservable.add(()=>{
    const ray = new BABYLON.Ray(camera.position.add(new BABYLON.Vector3(0,0.5,0)), new BABYLON.Vector3(0,-1,0), 1.4);
    const hit = scene.pickWithRay(ray, m=>m.checkCollisions===true);
    if(hit && hit.hit){
      const targetY = hit.pickedPoint.y + 1.7; // camera eye
      const dy = targetY - camera.position.y;
      if(dy>0 && dy<0.35){ camera.position.y += dy; } // step up small ledges
    }
  });

  light = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  light.intensity = .78;
  const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-0.6,-1,0.2), scene);
  dirLight.position = new BABYLON.Vector3(60, 50, -120);
  dirLight.intensity = 0.5;

  // Skybox
  const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
  skyMat.backFaceCulling = false; skyMat.disableLighting = true;
  skyMat.emissiveColor = new BABYLON.Color3(.02,.02,.045);
  skybox = BABYLON.Mesh.CreateBox("skyBox", 1200, scene);
  skybox.material = skyMat;
  skybox.isPickable=false;

  // Map
  await BABYLON.SceneLoader.AppendAsync("", MAP_URL, scene);
  log("Map loaded.");

  // Enable collisions on floors, disable on obvious debris/transparents (heuristic by name)
  scene.meshes.forEach(m=>{
    if(m.name.toLowerCase().includes("floor") || m.name.toLowerCase().includes("ground") || m.name.toLowerCase().includes("terrain")){
      m.checkCollisions = true;
    }else if(m.material && m.material.alpha < .95){
      m.checkCollisions = false; // transparent -> ghost-through
    }else if(/trash|debris|paper|bottle|can|bag|rubbish|leaf/i.test(m.name)){
      m.checkCollisions = false; // small clutter off
    }
  });

  // Doors discover (by name best-effort)
  scene.meshes.filter(m=>/door/i.test(m.name)).forEach(m=>{
    // unify pivot to hinge if exists; fallback pivot: left edge of bounding info
    m.computeWorldMatrix(true);
    const bi = m.getBoundingInfo().boundingBox;
    const hinge = new BABYLON.Vector3(bi.minimumWorld.x, bi.centerWorld.y, bi.centerWorld.z);
    m.setPivotPoint( m.worldToLocal(hinge) );
    m.checkCollisions = false; // must be traversable when open
    let dObj = { mesh:m, isOpen:false, closedRot:m.rotationQuaternion? m.rotationQuaternion.clone():BABYLON.Quaternion.FromEulerAngles(m.rotation.x,m.rotation.y,m.rotation.z) };
    dObj.openRot = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Y, Math.PI/2).multiply(dObj.closedRot);
    DOORS.push(dObj);
  });

  // Items pack (GLB)
  itemsRoot = await loadItemsPack();
  log("Items loaded.");

  // Ghost
  await spawnGhost();

  // Weather
  setupWeather();

  // Evidence orbs (subtle, camera-only cosmetic; can be toggled if you want)
  createOrbsSystem();

  // Audio
  await loadAudio();

  // Notebook UI
  UI.buildNotebook();
  UI.refreshSlots();
  UI.updateHUD();

  // Touch UI?
  if(isMobile()){
    document.getElementById('touchPad').style.display='block';
    document.getElementById('actionPad').style.display='flex';
    setupTouchControls();
  }

  return scene;
}

/* ----- Items pack loader ----- */
async function loadItemsPack(){
  const container = await BABYLON.SceneLoader.LoadAssetContainerAsync("", ITEMS_URL, scene);
  const root = new BABYLON.TransformNode("itemsRoot", scene);
  container.meshes.forEach(m=>{
    if(m.parent==null) m.setParent(root);
    m.isVisible=false; m.isPickable=false; m.checkCollisions=false;
    // Fix orientation issues from source: ensure Y-up, Z-forward (Babylon default)
    // Many FBX->GLB end up rotated; re-orient canonical here:
    m.rotationQuaternion = null;
  });
  container.addAllToScene();
  return root;
}

/* ----- Ghost spawn & simple AI ----- */
async function spawnGhost(){
  ghost.name = Object.keys(GHOSTS)[ Math.floor(Math.random()*Object.keys(GHOSTS).length) ];
  const url = GHOST_URLS[ Math.floor(Math.random()*GHOST_URLS.length) ];
  const ctn = await BABYLON.SceneLoader.LoadAssetContainerAsync("", url, scene);
  ctn.addAllToScene();
  const root = new BABYLON.TransformNode("ghostRoot", scene);
  ctn.meshes.forEach(m=>{
    if(m.parent==null) m.setParent(root);
    m.isPickable=false; m.checkCollisions=false; // ghosts pass through
  });

  // Normalize orientation (upright), scale human-ish
  root.scaling.set(0.85,0.85,0.85);
  root.rotation = new BABYLON.Vector3(0, Math.PI, 0); // face forward
  const spawnP = randomPointInPoly(SPAWN_POLY);
  root.position = new BABYLON.Vector3(spawnP.x, 0.05, spawnP.z);

  // Try animations: pick groups by name heuristics
  const idle = ctn.animationGroups.find(a=>/idle/i.test(a.name)) || ctn.animationGroups[0] || null;
  const walk = ctn.animationGroups.find(a=>/walk|run|move/i.test(a.name)) || null;
  if(idle){ idle.start(true, 1.0, idle.from, idle.to, false); }
  if(walk){ walk.stop(); }

  ghost.node = root;
  ghost.anim.idle = idle;
  ghost.anim.walk = walk;
  log("Ghost spawned: "+ghost.name.toUpperCase());

  // Simple wandering AI within polygon
  scene.onBeforeRenderObservable.add(()=>{
    if(!ghost.node) return;
    if(!ghost.target || BABYLON.Vector3.Distance(ghost.node.position, ghost.target)<0.8){
      // pick new target
      const t = randomPointInPoly(SPAWN_POLY);
      // keep y ground near 0
      ghost.target = new BABYLON.Vector3(t.x, 0.05, t.z);
      // switch anim
      if(ghost.anim.walk){ ghost.anim.idle && ghost.anim.idle.stop(); ghost.anim.walk.start(true); }
    }else{
      const dir = ghost.target.subtract(ghost.node.position);
      const d = dir.length();
      if(d>0.001){
        dir.normalize();
        ghost.node.position.addInPlace(dir.scale(ghost.speed * engine.getDeltaTime()/1000));
        // face direction (Yaw)
        ghost.node.rotation.y = Math.atan2(dir.x, dir.z);
      }
    }
  });
}

/* ----- Weather & lightning ----- */
function setupWeather(){
  const raining = Math.random()<0.5;
  UI.setWeather(raining? "Rain":"Clear");
  if(raining){
    // rain particle
    const rain = new BABYLON.ParticleSystem("rain", 3000, scene);
    rain.particleTexture = new BABYLON.Texture("./assets/images/nosignal.gif", scene); // lightweight placeholder
    rain.emitter = new BABYLON.Vector3(40, 30, -120);
    rain.minEmitBox = new BABYLON.Vector3(-80,0,-80);
    rain.maxEmitBox = new BABYLON.Vector3( 80,0, 80);
    rain.color1 = new BABYLON.Color4(0.8,0.9,1,0.55);
    rain.color2 = new BABYLON.Color4(0.7,0.9,1,0.35);
    rain.minSize = 0.04; rain.maxSize=0.08;
    rain.minLifeTime=1.2; rain.maxLifeTime=1.8;
    rain.emitRate=2500;
    rain.gravity = new BABYLON.Vector3(0, -9.5, 0);
    rain.direction1 = new BABYLON.Vector3(0, -1, 0.3);
    rain.direction2 = new BABYLON.Vector3(0, -1, -0.3);
    rain.start(); rainPS = rain;

    // ambient rain audio
    AUDIO.rain && AUDIO.rain.play();

    // lightning flashes now and then
    scene.onBeforeRenderObservable.add(()=>{
      lightningTimer += engine.getDeltaTime();
      if(lightningTimer>4000 + Math.random()*8000){
        lightningTimer=0;
        flashLightning();
      }
    });
  } else {
    AUDIO.ambient && AUDIO.ambient.play();
  }
}

function flashLightning(){
  const fl = document.getElementById('flashOverlay');
  fl.style.opacity='0.0';
  setTimeout(()=>{ fl.style.opacity='0.45'; }, 20);
  setTimeout(()=>{ fl.style.opacity='0.0'; }, 160);
  // thunder sound? (optional)
}

/* ----- Cosmetic orbs (camera-space particle drift) ----- */
function createOrbsSystem(){
  const sys = new BABYLON.ParticleSystem("orbs", 160, scene);
  sys.particleTexture = new BABYLON.Texture("./assets/images/nosignal.gif", scene);
  sys.emitter = camera;
  sys.minEmitBox = new BABYLON.Vector3(-2, -1, 2);
  sys.maxEmitBox = new BABYLON.Vector3( 2,  1, 6);
  sys.color1 = new BABYLON.Color4(1,1,1,.25);
  sys.color2 = new BABYLON.Color4(1,1,1,.05);
  sys.minSize=0.03; sys.maxSize=.12;
  sys.emitRate=120;
  sys.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  sys.updateSpeed = 0.01;
  sys.start();
  orbPS = sys; // <-- single global assignment
}

/* ----- Audio ----- */
async function loadAudio(){
  for(const [k,v] of Object.entries(SFX)){
    try {
      const s = new BABYLON.Sound(k, v, scene, null, { autoplay:false, loop:(k==='ambient'||k==='rain'), volume: k==='rain'?0.2: (k==='ambient'?0.15:0.7) });
      AUDIO[k]=s;
    } catch(e){}
  }
}

/* =============================================================================
   INPUT & INTERACTIONS
============================================================================= */
let keys = {};
window.addEventListener('keydown', (ev)=>{
  keys[ev.code]=true;

  // Dev toggles
  if(ev.code==='Escape'){
    if(Dev.active || !Dev.asking){ Dev.showPanel(); } else { Dev.showAsk(); }
  }
  // Number keys for slots
  if(/^Digit[1-5]$/.test(ev.code)){
    const n = parseInt(ev.code.slice(-1),10);
    UI.selectSlot(n);
  }
  // Notebook open
  if(ev.code==='KeyN'){ UI.openNotebook(); }

  // PageUp/PageDown flight ONLY in dev
  if(Dev.active && (ev.code==='PageUp' || ev.code==='PageDown')){
    camera.position.y += (ev.code==='PageUp'? +1.0 : -1.0);
  }
});
window.addEventListener('keyup', (ev)=>{ keys[ev.code]=false; });

sceneInputLoop();
function sceneInputLoop(){
  scene && scene.onBeforeRenderObservable.add(()=>{
    // WASD
    const dt = engine.getDeltaTime()/1000;
    const fwd = camera.getDirection(BABYLON.Axis.Z); fwd.y=0; fwd.normalize();
    const right= camera.getDirection(BABYLON.Axis.X); right.y=0; right.normalize();
    const run  = keys['ShiftLeft'] || keys['ShiftRight'] || player.running;
    camera.speed = run ? player.speedRun : player.speedWalk;

    let vec = BABYLON.Vector3.Zero();
    if(keys['KeyW']) vec.addInPlace(fwd);
    if(keys['KeyS']) vec.addInPlace(fwd.scale(-1));
    if(keys['KeyA']) vec.addInPlace(right.scale(-1));
    if(keys['KeyD']) vec.addInPlace(right);
    if(vec.lengthSquared()>0){
      vec.normalize();
      camera.cameraDirection.addInPlace(vec.scale(camera.speed * dt));
    }

    // Interact (E) -> door within reach
    if(keys['KeyE']){
      tryInteract();
      keys['KeyE']=false;
    }

    // USE item only on key E via UI; mouse click no longer consumes
    // In-hand overlay follows camera
    if(inHand.mesh){
      const aim = camera.getForwardRay(1.0).direction.scale(0.6);
      inHand.mesh.position = camera.position.add(new BABYLON.Vector3(.28,-.35,0)).addInPlace(aim);
      inHand.mesh.rotation.y = camera.rotation.y + .3;
    }

    // Van storage button visibility
    UI.maybeShowStorage();
  });
}

function tryInteract(){
  // open/close nearest door
  let best=null, bestDist=1.7;
  DOORS.forEach(d=>{
    const dst = BABYLON.Vector3.Distance(camera.position, d.mesh.getAbsolutePosition());
    if(dst<bestDist){ best=d; bestDist=dst; }
  });
  if(best){
    const d = best;
    d.isOpen=!d.isOpen;
    const target = d.isOpen? d.openRot : d.closedRot;
    BABYLON.Animation.CreateAndStartAnimation("doorSwing","rotationQuaternion",60,
      30, d.mesh.rotationQuaternion || BABYLON.Quaternion.Identity(), target, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT, null, d.mesh);
    (d.isOpen? AUDIO.doorOpen : AUDIO.doorClose)?.play();
  }
}

/* =============================================================================
   BOOT
============================================================================= */
(async function boot(){
  await createScene();
  engine.runRenderLoop(()=>{ scene && scene.render(); });
})();
window.addEventListener('resize', ()=>engine.resize());

/* =============================================================================
   MOBILE CONTROLS (simple virtual stick)
============================================================================= */
function isMobile(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent); }
function setupTouchControls(){
  const pad = document.getElementById('touchPad');
  const knob= document.getElementById('touchKnob');
  let active=false, start=null;

  function setKnob(x,y){
    const r=60; // radius
    const dx=x - pad.offsetLeft - 70;
    const dy=y - pad.offsetTop  - 70;
    const d = Math.hypot(dx,dy);
    const cl = d>r ? r/d : 1;
    knob.style.left = (70 + dx*cl) + "px";
    knob.style.top  = (70 + dy*cl) + "px";
    // map to WASD
    const nx = (dx/r);
    const ny = (dy/r);
    keys['KeyW']=ny<-0.25; keys['KeyS']=ny>0.25;
    keys['KeyA']=nx<-0.25; keys['KeyD']=nx>0.25;
  }
  pad.addEventListener('pointerdown', e=>{ active=true; setKnob(e.clientX,e.clientY); });
  window.addEventListener('pointermove', e=>{ if(active) setKnob(e.clientX,e.clientY); });
  window.addEventListener('pointerup',   ()=>{ active=false; knob.style.left="50%"; knob.style.top="50%"; keys['KeyW']=keys['KeyA']=keys['KeyS']=keys['KeyD']=false; });

  // buttons
  document.getElementById('btnRun').onpointerdown=()=>{ player.running=true; };
  document.getElementById('btnRun').onpointerup=()=>{ player.running=false; };
  document.getElementById('btnUse').onclick=()=>{ tryInteractOrUse(); };
  document.getElementById('btnSel1').onclick=()=>UI.selectSlot(1);
  document.getElementById('btnSel2').onclick=()=>UI.selectSlot(2);
  document.getElementById('btnSel3').onclick=()=>UI.selectSlot(3);
}
function tryInteractOrUse(){
  // first prefer door interaction if close
  let nearDoor=false;
  DOORS.forEach(d=>{ if(BABYLON.Vector3.Distance(camera.position, d.mesh.getAbsolutePosition())<1.6) nearDoor=true; });
  if(nearDoor){ tryInteract(); return; }

  // else “use” item by slot (no auto-consume). Put your item logic hooks here.
  if(inHand.slot===4){ log("Lighter toggled."); return; }
  if(inHand.slot===5){ UI.openNotebook(); return; }
  const key = SLOTS[inHand.slot];
  if(!key){ log("Empty slot."); return; }
  if(key==='emf'){ log("EMF: sweeping..."); AUDIO.radio?.play(); }
  if(key==='spiritBox'){ AUDIO.spiritBox?.play(); log("Spirit Box: you hear static..."); }
  if(key==='thermo'){ log("Thermometer: °C reading stabilized."); }
}

document.getElementById('storageBtn').onclick = ()=>UI.openStorage();

document.getElementById('devAsk').addEventListener('click',(e)=>{ if(e.target.id==='devAsk') Dev.cancel(); });
document.getElementById('devPanel').addEventListener('click',(e)=>{ if(e.target.id==='devPanel') Dev.close(); });
