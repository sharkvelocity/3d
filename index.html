<script>
let canvas = document.getElementById("renderCanvas");
let engine = new BABYLON.Engine(canvas, true);
let scene, camera, playerMesh, ghostEntity, isThirdPerson = false;

let roomMeshes = {}; // e.g. { "Kitchen": mesh, "Basement": mesh }
let ghostRoom = "", ghostVisible = false;

window.addEventListener("DOMContentLoaded", () => {
  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
  scene.fogDensity = 0.015;
  scene.fogColor = new BABYLON.Color3(0.05, 0.05, 0.05);

  // Ambient Light
  const hemiLight = new BABYLON.HemisphericLight("hLight", new BABYLON.Vector3(0, 1, 0), scene);
  hemiLight.intensity = 0.5;

  // Player Camera
  camera = new BABYLON.UniversalCamera("playerCam", new BABYLON.Vector3(0, 2, -10), scene);
  camera.attachControl(canvas, true);
  camera.speed = 0.3;
  camera.ellipsoid = new BABYLON.Vector3(1, 1, 1);

  window.addEventListener("keydown", (e) => {
    if (e.key === "v") toggleCamera();
  });

  function toggleCamera() {
    isThirdPerson = !isThirdPerson;
    if (isThirdPerson && playerMesh) {
      camera.lockedTarget = playerMesh;
      camera.radius = 8;
    } else {
      camera.lockedTarget = null;
      camera.position = playerMesh ? playerMesh.position.add(new BABYLON.Vector3(0, 2, -6)) : camera.position;
    }
  }

  // Load GLB model
  BABYLON.SceneLoader.ImportMeshAsync(null, "./", "Abandoned_House.glb", scene).then(result => {
    const root = result.meshes[0];

    // Identify rooms by name and store references
    result.meshes.forEach(mesh => {
      if (mesh.name.includes("Room") || mesh.name.includes("room") || mesh.name.match(/(Foyer|Kitchen|Basement|Bedroom|Garage|Living|Bathroom|Dining)/i)) {
        roomMeshes[mesh.name] = mesh;
      }
    });

    console.log("🏠 Rooms found:", Object.keys(roomMeshes));

    // Place ghost in random room
    const roomNames = Object.keys(roomMeshes);
    ghostRoom = roomNames[Math.floor(Math.random() * roomNames.length)];
    const ghostMesh = roomMeshes[ghostRoom];

    ghostEntity = BABYLON.MeshBuilder.CreateSphere("ghost", { diameter: 1.5 }, scene);
    ghostEntity.position = ghostMesh.getAbsolutePosition().add(new BABYLON.Vector3(0, 2, 0));
    ghostEntity.isVisible = false;

    // Player mesh
    playerMesh = BABYLON.MeshBuilder.CreateBox("player", { size: 1 }, scene);
    playerMesh.position = new BABYLON.Vector3(0, 1, -12); // Outside front door
    playerMesh.visibility = 0; // invisible box, camera represents view

    // Attach camera to player
    camera.position = playerMesh.position.add(new BABYLON.Vector3(0, 2, -6));

    engine.runRenderLoop(() => {
      scene.render();
    });
  });
});
</script>

<script>
  
// === Ghost State & Behavior ===
let ghostProfile = {
  name: "Mare",
  evidence: ["Spirit Box", "Ghost Writing", "Freezing Temps"],
  behavior: {
    neverTurnOnLights: true,
    prefersDarkRooms: true,
    aggressiveInDark: true,
    roomShiftable: true,
  },
};

let playerSanity = 100;
let lastRoomSwitch = Date.now();
let lastGhostVisible = 0;
let isHunting = false;
let ghostCooldown = 0;

// === Sanity Drain System ===
scene.onBeforeRenderObservable.add(() => {
  if (!playerMesh || !ghostEntity) return;

  const dist = BABYLON.Vector3.Distance(playerMesh.position, ghostEntity.position);
  const nearGhost = dist < 6;

  // In ghost room or nearby
  if (nearGhost) {
    playerSanity -= 0.01 * (1 + Math.random()); // drain faster if closer
  } else {
    playerSanity -= 0.002; // passive drain
  }

  // Clamp
  if (playerSanity < 0) playerSanity = 0;

  // === Ghost Visibility: Flicker in/out ===
  if (Date.now() - lastGhostVisible > 4000 + Math.random() * 8000) {
    const visibleNow = Math.random() < 0.3; // 30% chance to appear
    ghostEntity.isVisible = visibleNow;
    lastGhostVisible = Date.now();
  }

  // === Ghost Roaming (except Goryo) ===
  if (ghostProfile.name !== "Goryo" && Date.now() - lastRoomSwitch > 10000 + Math.random() * 20000) {
    const roomNames = Object.keys(roomMeshes).filter(name => name !== ghostRoom);
    const newRoom = roomNames[Math.floor(Math.random() * roomNames.length)];
    ghostRoom = newRoom;
    const newPos = roomMeshes[ghostRoom].getAbsolutePosition().add(new BABYLON.Vector3(0, 2, 0));
    ghostEntity.position = newPos;
    lastRoomSwitch = Date.now();
  }

  // === Hunt Trigger ===
  if (!isHunting && playerSanity < 20 && Date.now() > ghostCooldown) {
    const chance = Math.random();
    if (chance < 0.015 || (nearGhost && chance < 0.05)) {
      startHunt();
    }
  }
});

// === Hunt Logic ===
function startHunt() {
  isHunting = true;
  ghostEntity.isVisible = true;
  console.log("👻 HUNT STARTED");

  scene.fogDensity = 0.03;
  let redLight = new BABYLON.PointLight("red", ghostEntity.position, scene);
  redLight.diffuse = new BABYLON.Color3(1, 0, 0);
  redLight.intensity = 2;

  setTimeout(() => {
    endHunt(redLight);
  }, 5000 + Math.random() * 3000);
}

function endHunt(light) {
  isHunting = false;
  ghostCooldown = Date.now() + 20000; // 20s cooldown
  scene.fogDensity = 0.015;
  ghostEntity.isVisible = false;
  light.dispose();
  console.log("👻 Hunt ended");
}
</script>
<script>
// === Inventory Data ===
let playerInventory = ["Crucifix", "Camera", "Smudge Stick"]; // example
const maxCarry = 3;
const placedItems = {}; // { roomName: [itemName, ...] }

function updateInventoryUI() {
  for (let i = 0; i < 3; i++) {
    const slot = document.getElementById(`slot-${i + 1}`);
    slot.textContent = playerInventory[i] || "-";
  }
}
updateInventoryUI();

// === Pickup / Drop Items ===
function pickupItem(itemName) {
  if (playerInventory.length >= maxCarry) {
    console.log("Inventory full");
    return;
  }
  playerInventory.push(itemName);
  updateInventoryUI();
}

function dropItem(itemName) {
  const idx = playerInventory.indexOf(itemName);
  if (idx !== -1) {
    playerInventory.splice(idx, 1);
    updateInventoryUI();
    const room = getCurrentRoomName();
    if (!placedItems[room]) placedItems[room] = [];
    placedItems[room].push(itemName);
    console.log(`Placed ${itemName} in ${room}`);
  }
}

// === Get Room From Position ===
function getCurrentRoomName() {
  for (let room in roomMeshes) {
    const mesh = roomMeshes[room];
    const dist = BABYLON.Vector3.Distance(playerMesh.position, mesh.getAbsolutePosition());
    if (dist < 8) return room;
  }
  return "Unknown";
}

// === Key Events for Placing Items (1–3 = use/drop)
scene.onKeyboardObservable.add(kb => {
  if (kb.type === BABYLON.KeyboardEventTypes.KEYUP) {
    if (kb.event.code === "Digit1") dropItem(playerInventory[0]);
    if (kb.event.code === "Digit2") dropItem(playerInventory[1]);
    if (kb.event.code === "Digit3") dropItem(playerInventory[2]);
  }
}
);
</script>
<script>
// === CAMERA TOGGLE ===
let usingFirstPerson = true;
const toggleBtn = document.getElementById("toggleViewBtn");

toggleBtn.onclick = () => {
  usingFirstPerson = !usingFirstPerson;
  if (usingFirstPerson) {
    camera.lockedTarget = playerMesh;
    camera.radius = 0;
    camera.alpha = 0;
    camera.beta = Math.PI / 2;
  } else {
    camera.lockedTarget = playerMesh;
    camera.radius = 6;
    camera.alpha = Math.PI / 2;
    camera.beta = Math.PI / 3;
  }
};

// === TOUCH CONTROLS ===
function handleDirection(dir) {
  const move = new BABYLON.Vector3(0, 0, 0);
  const speed = 0.3;
  if (dir === "up") move.z = -speed;
  if (dir === "down") move.z = speed;
  if (dir === "left") move.x = -speed;
  if (dir === "right") move.x = speed;
  playerMesh.moveWithCollisions(move);
}

document.querySelectorAll(".touch-button").forEach(btn => {
  btn.addEventListener("touchstart", e => {
    const dir = btn.dataset.dir;
    handleDirection(dir);
  });
});

// === Enable touch UI if mobile ===
if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
  document.getElementById("touch-controls").style.display = "flex";
}
</script>
<script>
// === GHOST SETUP ===
let ghostMesh;
let ghostRoom = null;
let currentGhost = null;
let ghostVisible = false;
let turnsSinceGhostRoam = 0;
let ghostRoamCooldown = 5;

function setupGhostEntity(scene) {
  ghostMesh = BABYLON.MeshBuilder.CreateSphere("ghost", { diameter: 2 }, scene);
  ghostMesh.visibility = 0;
  ghostMesh.position = new BABYLON.Vector3(0, 1, 0);
  ghostMesh.isPickable = false;
  ghostMesh.material = new BABYLON.StandardMaterial("ghostMat", scene);
  ghostMesh.material.emissiveColor = new BABYLON.Color3(1, 0, 1); // purple glow

  // Set ghost room initially
  ghostRoom = getRandomRoom();
  currentGhost = getRandomGhostProfile(); // pulled from full ghost list
}

// === RANDOM ROAMING ===
function maybeRoamGhost() {
  if (currentGhost.name === "Goryo") return;

  turnsSinceGhostRoam++;
  if (turnsSinceGhostRoam >= ghostRoamCooldown && Math.random() < 0.4) {
    ghostRoom = getRandomRoom();
    console.log("👻 Ghost roamed to new room.");
    turnsSinceGhostRoam = 0;
    ghostRoamCooldown = 4 + Math.floor(Math.random() * 4); // 4–7
  }
}

// === GHOST VISIBILITY LOGIC ===
function updateGhostAppearance(playerPosition) {
  const distance = BABYLON.Vector3.Distance(playerPosition, ghostMesh.position);
  ghostVisible = distance < 4 && Math.random() < 0.1;
  ghostMesh.visibility = ghostVisible ? 1 : 0;
}

// === SANITY SYSTEM ===
let sanity = 100;

function updateSanity(playerPosition) {
  let loss = 0.05;
  if (isPlayerInRoom(ghostRoom)) loss += 0.15;
  if (ghostVisible) loss += 0.3;

  sanity -= loss;
  sanity = Math.max(sanity, 0);
  document.getElementById("hud-sanity").innerText = `Sanity: ${Math.floor(sanity)}%`;

  // Trigger hunt threshold
  if (sanity <= 20) maybeTriggerHunt();
}

// === PLACEHOLDER FUNCTIONS ===
function getRandomRoom() {
  const roomKeys = Object.keys(roomZones);
  return roomKeys[Math.floor(Math.random() * roomKeys.length)];
}

function isPlayerInRoom(roomName) {
  if (!roomZones[roomName]) return false;
  return roomZones[roomName].intersectsMesh(playerMesh, false);
}
</script>
<script>
// === HUNT SYSTEM ===
let isHunting = false;
let huntCooldown = 0;
let huntDuration = 0;
let huntTimer = 0;

function maybeTriggerHunt() {
  if (isHunting || huntCooldown > 0) return;
  const ghostAggression = currentGhost.aggression || 1;
  const baseChance = 0.1 + (1 - sanity / 100) * 0.3;
  const huntChance = baseChance * ghostAggression;

  if (Math.random() < huntChance) {
    startHunt();
  }
}

function startHunt() {
  console.log("⚠️ Hunt started!");
  isHunting = true;
  huntDuration = 6 + Math.floor(Math.random() * 6);
  huntTimer = 0;
  huntCooldown = currentGhost.huntCooldown || 10;
  playHeartbeat();
  beginRedFlicker();

  // Move ghost near player
  ghostMesh.position = playerMesh.position.add(new BABYLON.Vector3(0, 0, -2));
  ghostVisible = true;
  ghostMesh.visibility = 1;
}

function updateHunt() {
  if (!isHunting) return;

  huntTimer++;
  if (huntTimer >= huntDuration) {
    endHunt();
  } else {
    // Ghost chases player
    const direction = playerMesh.position.subtract(ghostMesh.position).normalize();
    ghostMesh.position.addInPlace(direction.scale(0.1));
    if (BABYLON.Vector3.Distance(ghostMesh.position, playerMesh.position) < 1.2) {
      console.log("💀 Player caught!");
      killPlayer();
    }
  }
}

function endHunt() {
  console.log("✅ Hunt ended");
  isHunting = false;
  ghostMesh.visibility = 0;
  stopHeartbeat();
  stopRedFlicker();
}

function killPlayer() {
  alert("You were killed by the ghost!");
  location.reload();
}

// === RED FLICKER VISUAL ===
let redOverlay = null;

function beginRedFlicker() {
  if (!redOverlay) {
    redOverlay = new BABYLON.GUI.Rectangle();
    redOverlay.width = "100%";
    redOverlay.height = "100%";
    redOverlay.background = "rgba(255,0,0,0.2)";
    redOverlay.thickness = 0;
    uiTexture.addControl(redOverlay);
  }

  let flicker = () => {
    if (!isHunting) return;
    redOverlay.alpha = Math.random() * 0.6;
    setTimeout(flicker, 100 + Math.random() * 100);
  };
  flicker();
}

function stopRedFlicker() {
  if (redOverlay) redOverlay.alpha = 0;
}

// === HEARTBEAT AUDIO ===
let heartbeat = new Audio("heartbeat.mp3");

function playHeartbeat() {
  heartbeat.loop = true;
  heartbeat.play();
}

function stopHeartbeat() {
  heartbeat.pause();
  heartbeat.currentTime = 0;
}

// === ITEM DEFENSE LOGIC ===
function useCrucifix() {
  if (isHunting && isPlayerInRoom(ghostRoom)) {
    console.log("🕇 Crucifix blocked the hunt!");
    endHunt();
    huntCooldown += 10;
    removeItem("Crucifix");
  }
}

function useSmudgeStick() {
  if (isHunting && BABYLON.Vector3.Distance(ghostMesh.position, playerMesh.position) < 5) {
    console.log("💨 Smudge stick used to repel ghost!");
    endHunt();
    huntCooldown += 8;
    removeItem("Smudge Stick");

    if (currentGhost.name === "Yurei") {
      console.log("Yurei trapped in room!");
      ghostRoom = getCurrentRoom();
    }
  }
}

// === ONRYO FLAME LOGIC ===
function onryoFlameBehavior() {
  if (currentGhost.name !== "Onryo") return;
  const flames = getNearbyFlames();
  if (flames >= 3 && !isHunting) startHunt();
  extinguishNearbyFlames();
}

function extinguishNearbyFlames() {

  // Placeholder for extinguish visuals
}

  if (currentGhost.name !== "Mare") return;
  if (roomIsDark(room) && Math.random() < 0.5) {
    console.log("💡 Mare turned lights off.");

  if (Math.random() < 0.2) {
    const flame = flameSources.find(f => f.lit);
    if (flame) {
      flame.flame.isVisible = false;
      flame.lit = false;
      lastFlameExtinguishTime = performance.now();
      logToPlayer("👻 A sudden chill... the flame goes out.");
    }
  }
}
