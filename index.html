<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney — index.html (Merged + Lighting/Framing Fix)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#000000" />

  <!-- Babylon core + loaders (local to your repo) -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/earcut.min.js"></script>
  <script src="./cdn/meshopt_decoder.js"></script>
  <script src="./cdn/draco_decoder_gltf.js"></script>
  <script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script>
  <script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
  <script src="./cdn/gui/babylon.gui.min.js"></script>
  <script src="./cdn/inspector/babylon.inspector.bundle.js"></script>

  <style>
    :root {
      --hud: #66f2ff;
      --hud-dim: #0d2a2e;
      --btn: #111;
      --btn-on: #1e1e1e;
      --txt: #d2faff;
      --accent: #11d8ff;
    }
    html,body { margin:0; height:100%; background:#000; color:#eafcff; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji"; }
    #renderCanvas { width:100vw; height:100vh; touch-action:none; display:block; background:#000; }

    /* Title / Start */
    #titleScreen {
      position:fixed; inset:0; background:radial-gradient(ellipse at 50% 40%, #081014, #000 60%);
      display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; z-index:10;
    }
    .card { background:#0a0f12; border:1px solid #16333a; box-shadow:0 0 0 1px #07181c inset, 0 10px 30px rgba(0,0,0,.4); border-radius:12px; padding:16px 20px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    label { font-size:13px; opacity:.9; }
    select, button, input[type="range"] {
      background:#0a1416; color:var(--txt); border:1px solid #16333a; border-radius:10px; padding:8px 10px; outline:none;
    }
    button { cursor:pointer; font-weight:600 }
    button:hover { border-color:#22e0ff }
    #startBtn { background:linear-gradient(180deg, #0d3a42, #0b2429); border-color:#1ec6de }
    #startBtn:active { transform:translateY(1px) }

    /* HUD */
    #hud { position:fixed; top:10px; left:12px; display:flex; gap:10px; z-index:5; }
    .hudpill { background:var(--hud-dim); border:1px solid #0f3338; color:var(--hud); padding:6px 10px; border-radius:10px; min-width:110px; font-size:12px; }
    .hudpill b { color:var(--txt); }
    #sanityWrap { min-width:200px; }
    #sanityBar { height:8px; background:#072025; border:1px solid #0f3338; border-radius:12px; overflow:hidden; margin-top:6px; }
    #sanityFill { height:100%; width:100%; background:linear-gradient(90deg,#00ffe9,#11aaff); }

    /* Mobile touch zones + quick buttons */
    #touchL, #touchR { position:fixed; inset:0; pointer-events:none; }
    #touchL::before, #touchR::before { content:""; }
    #touchL { left:0; width:40%; pointer-events:auto; }
    #touchR { right:0; width:60%; pointer-events:auto; }
    #quickbar {
      position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
      display:flex; gap:8px; z-index:5;
    }
    .qbtn { background:#111; color:#ddd; border:1px solid #2b2b2b; border-radius:8px; padding:6px 10px; font-size:12px; }
    .qbtn:active { transform:translateY(1px) }

    /* Debug XYZ */
    #hud-xyz { position:fixed; top:8px; right:12px; background:#071216cc; border:1px solid #0f3338; border-radius:10px; padding:8px 10px; font:12px/1.3 monospace; z-index:5; display:none }
    #hud-xyz b { color:#a8f6ff }

    /* Inspector button */
    #openInspector { position:fixed; bottom:10px; right:10px; z-index:6; background:#0d1117; color:#92f0ff; border:1px solid #1f3740; border-radius:10px; padding:8px 10px; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div id="titleScreen">
    <div class="card">
      <div class="row" style="justify-content:space-between; align-items:flex-end;">
        <div>
          <h2 style="margin:0 0 6px 0; color:#9ef8ff;">PhasmaPhoney</h2>
          <div class="row">
            <label for="mapSelect">Map:</label>
            <select id="mapSelect"></select>
            <button id="reloadMaps">↻</button>
          </div>
        </div>
        <div>
          <button id="startBtn">Start Investigation</button>
        </div>
      </div>
    </div>
  </div>

  <div id="hud">
    <div class="hudpill"><b>Weather:</b> <span id="hud-weather">—</span></div>
    <div class="hudpill"><b>Hunt:</b> <span id="hud-hunt">Calm</span></div>
    <div class="hudpill"><b>Room:</b> <span id="hud-room">Van</span></div>
    <div class="hudpill" id="sanityWrap"><b>Sanity:</b>
      <div id="sanityBar"><div id="sanityFill"></div></div>
      <span id="sanityPct">100%</span>
    </div>
  </div>

  <div id="hud-xyz">X:<b id="hud-x">0</b> Y:<b id="hud-y">0</b> Z:<b id="hud-z">0</b></div>

  <div id="touchL"></div>
  <div id="touchR"></div>
  <div id="quickbar">
    <button class="qbtn" id="btnUse">Use</button>
    <button class="qbtn" id="btnPlace">Place</button>
    <button class="qbtn" id="btnToss">Toss</button>
    <button class="qbtn" id="btnLighter">Lighter</button>
    <button class="qbtn" id="btnNotebook">Notebook</button>
    <button id="openInspector">Inspector</button>
  </div>

  <script>
  // =========================================================
  // Core engine + scene
  // =========================================================
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true, disableWebGL2Support:false });

  let scene, camera, player;
  let sanity = 100;
  let ghostTimersStarted = false;

  function createScene(){
    scene = new BABYLON.Scene(engine);
    scene.useRightHandedSystem = false;
    scene.autoClear = true;
    scene.clearColor = new BABYLON.Color4(0,0,0,1);

    // Camera (first-person style)
    camera = new BABYLON.UniversalCamera("fps", new BABYLON.Vector3(0, 1.7, -5), scene);
    camera.speed = 0.22;
    camera.angularSensibility = 3800;
    camera.minZ = 0.1;
    camera.attachControl(canvas, true);

    // Simple ground to avoid falling forever if map missing
    const ground = BABYLON.MeshBuilder.CreateGround("safetyGround", {width:200, height:200}, scene);
    const gmat = new BABYLON.StandardMaterial("gmat", scene);
    gmat.diffuseColor = new BABYLON.Color3(0.05,0.08,0.09);
    ground.material = gmat;

    ensureLighting(scene);

    // Debug XYZ
    scene.onBeforeRenderObservable.add(() => {
      const p = camera.position;
      if (xyzEnabled) {
        document.getElementById('hud-xyz').style.display = 'block';
        document.getElementById('hud-x').textContent = p.x.toFixed(2);
        document.getElementById('hud-y').textContent = p.y.toFixed(2);
        document.getElementById('hud-z').textContent = p.z.toFixed(2);
      }
    });

    return scene;
  }

  // =========================================================
  // Helpers: Lighting + Camera Framing (patches)
  // =========================================================
  function ensureLighting(scene){
    if (!scene.lights || scene.lights.length === 0){
      const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
      hemi.intensity = 0.9;
      const fill = new BABYLON.DirectionalLight("fill", new BABYLON.Vector3(-0.5,-1,-0.5), scene);
      fill.intensity = 0.25;
    }
    if (!scene.environmentTexture){
      scene.createDefaultEnvironment({ createGround:false, createSkybox:true, skyboxSize:1000 });
      scene.environmentIntensity = 0.9;
    }
  }

  async function focusAndNormalize(scene){
    const ext = scene.getWorldExtends();
    const size = ext.max.subtract(ext.min);
    const center = ext.min.add(size.scale(0.5));

    const diag = size.length();
    if (diag > 0){
      const targetDiag = 40;
      const s = targetDiag / diag;
      if (s < 0.25 || s > 4){
        const roots = scene.meshes.filter(m => !m.parent && m.name !== "skyBox");
        roots.forEach(r => r.scaling = r.scaling.scale(s));
      }
    }

    const ext2 = scene.getWorldExtends();
    const size2 = ext2.max.subtract(ext2.min);
    const center2 = ext2.min.add(size2.scale(0.5));

    // Move the camera to see the whole map
    camera.setTarget(center2);
    camera.position = center2.add(new BABYLON.Vector3(-Math.max(size2.x,size2.z)*1.6, Math.max(8, size2.y*0.6), -Math.max(size2.x,size2.z)*1.6));
    camera.minZ = 0.1;

    // Move player to center at eye height
    if (player && player.position){
      player.position.copyFrom(center2.add(new BABYLON.Vector3(0, 1.7, 0)));
    } else {
      // Use camera as player pos baseline
      camera.position = center2.add(new BABYLON.Vector3(0, 1.7, -5));
    }
  }

  // =========================================================
  // Map manifest loading
  // =========================================================
  const mapSelect = document.getElementById('mapSelect');
  const reloadMaps = document.getElementById('reloadMaps');

  async function loadManifest(){
    let list = [];
    try {
      const res = await fetch('./assets/models/map/maps.json', { cache:'no-store' });
      if (!res.ok) throw new Error('HTTP '+res.status);
      list = await res.json();
    } catch (e){
      // Fallback
      list = [
        { title:"Abandoned House", file:"Abandoned_House.glb" },
        { title:"Small Test Room", file:"Small_Test.glb" }
      ];
      console.warn('[maps.json] fallback used →', e.message || e);
    }
    list.sort((a,b)=>a.title.localeCompare(b.title));
    mapSelect.innerHTML = list.map(m=>`<option value="${m.file}">${m.title}</option>`).join('');
    return list;
  }

  // =========================================================
  // Boot / Start
  // =========================================================
  const startBtn = document.getElementById('startBtn');
  const titleScreen = document.getElementById('titleScreen');

  function bindStart(el){
    const go = (ev)=>{ ev.preventDefault(); safeStart(); };
    el.addEventListener('click', go);
    el.addEventListener('pointerup', go);
    el.addEventListener('touchend', go, {passive:false});
    el.addEventListener('touchstart', e => e.preventDefault(), {passive:false});
    window.addEventListener('keydown', (e)=>{
      if (e.code === 'Enter' || e.code === 'Space') safeStart();
    });
  }

  async function safeStart(){
    titleScreen.style.display = 'none';
    await boot();
  }

  async function boot(){
    if (!scene) createScene();
    ensureLighting(scene);

    const file = mapSelect.value || 'Abandoned_House.glb';
    try{
      await BABYLON.SceneLoader.AppendAsync('./assets/models/map/', file, scene);
      ensureLighting(scene);
      await focusAndNormalize(scene);
      console.log('[MapLoaded] meshes:', scene.meshes.length, 'lights:', scene.lights.length, 'activeCamera:', scene.activeCamera && scene.activeCamera.name);
    }catch(err){
      console.error('Map load failed:', err);
    }

    // Start render loop
    engine.runRenderLoop(()=> scene && scene.render());
    window.addEventListener('resize', ()=> engine.resize());
  }

  // =========================================================
  // Touch controls (simple)
  // =========================================================
  const touchL = document.getElementById('touchL');
  const touchR = document.getElementById('touchR');
  let lTouchId = null, rTouchId = null;
  let moveVec = new BABYLON.Vector2(0,0), lookVec = new BABYLON.Vector2(0,0);
  let xyzEnabled = true;

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  function touchStart(e){
    for (const t of e.changedTouches || [e]){
      const x = t.clientX, w = window.innerWidth;
      if (x < w*0.4 && lTouchId===null){ lTouchId=t.identifier||0; }
      else if (x >= w*0.4 && rTouchId===null){ rTouchId=t.identifier||0; }
    }
  }
  function touchMove(e){
    for (const t of e.changedTouches || [e]){
      const id = t.identifier||0;
      if (id===lTouchId){ moveVec.x = clamp((t.movementX||0)/20, -1, 1); moveVec.y = clamp((t.movementY||0)/20, -1, 1); }
      if (id===rTouchId){ lookVec.x = (t.movementX||0); lookVec.y = (t.movementY||0); }
    }
  }
  function touchEnd(e){
    for (const t of e.changedTouches || [e]){
      const id = t.identifier||0;
      if (id===lTouchId){ lTouchId=null; moveVec.x=0; moveVec.y=0; }
      if (id===rTouchId){ rTouchId=null; lookVec.x=0; lookVec.y=0; }
    }
  }
  touchL.addEventListener('touchstart', touchStart, {passive:false});
  touchL.addEventListener('touchmove', touchMove, {passive:false});
  touchL.addEventListener('touchend', touchEnd);
  touchR.addEventListener('touchstart', touchStart, {passive:false});
  touchR.addEventListener('touchmove', touchMove, {passive:false});
  touchR.addEventListener('touchend', touchEnd);

  // Apply movement/looking each frame
  engine.onEndFrameObservable.add(()=>{
    if (!scene || !camera) return;
    // Look
    camera.cameraRotation.y -= lookVec.x / 5000;
    camera.cameraRotation.x -= lookVec.y / 5000;
  });

  // Basic WASD
  window.addEventListener('keydown', (e)=>{
    if (e.key.toLowerCase()==='i'){ xyzEnabled = !xyzEnabled; document.getElementById('hud-xyz').style.display = xyzEnabled?'block':'none'; }
  });

  // Inspector toggle
  document.getElementById('openInspector').addEventListener('click', ()=> scene && scene.debugLayer.show({embedMode:true}) );

  // Init
  bindStart(startBtn);
  reloadMaps.addEventListener('click', loadManifest);
  loadManifest();
  </script>
</body>
</html>
