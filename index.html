<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney — 3D Prototype (index2)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <meta name="author" content="Shark-Blades" />
  <meta name="description" content="3D ghost hunting prototype built with Babylon.js" />

  <!-- Babylon core + loaders (LOCAL) -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/earcut.min.js"></script>
  <script src="./cdn/meshopt_decoder.js"></script>
  <script src="./cdn/draco_decoder_gltf.js"></script>
  <script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script>
  <script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
  <script src="./cdn/gui/babylon.gui.min.js"></script>

  <style>
    html, body { margin:0; height:100%; width:100%; background:#000; overflow:hidden; font-family:system-ui, -apple-system, Segoe UI, Roboto, monospace; color:#0ff; }
    #renderCanvas { width:100vw; height:100vh; touch-action:none; display:block; background:#000; }

    #flash-overlay{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:10000; transition:opacity 120ms ease-out; }

    /* Title */
    #title-screen{ position:fixed; inset:0; background:rgba(0,0,0,0.9); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999;}
    #title-content{ text-align:center; max-width:90vw;}
    #title-logo{ max-width:60vw; max-height:35vh; object-fit:contain; margin-bottom:24px;}
    #start-button{ padding:14px 28px; font-size:22px; cursor:pointer; border:2px solid #0ff; color:#0ff; background:#111; box-shadow:0 0 14px rgba(0,255,255,0.25); border-radius:10px; }
    #start-button:active{ transform:translateY(1px); }

    /* HUD */
    #hud{ position:fixed; top:10px; left:10px; z-index:6000; background:rgba(0,0,0,0.5); border:1px solid #066; padding:8px 10px; border-radius:6px; min-width:260px; display:none; flex-direction:column; gap:6px; pointer-events:none; }
    #hud .row{ display:flex; gap:10px; align-items:center; justify-content:space-between; }
    #hud .label{ color:#9ff; }
    #hud .value{ color:#0ff; font-weight:bold; }
    #hud-hunt { font-size:12px; color:#faa; opacity:0.95; }

    /* Action bar */
    #actions{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:6000; display:flex; gap:10px; pointer-events:auto; }
    .hud-btn{ border:1px solid #0aa; background:#111; color:#0ff; padding:10px 14px; border-radius:10px; cursor:pointer; box-shadow:0 0 10px rgba(0,255,255,0.2); }
    .hud-btn:active{ transform:translateY(1px); }
    #activeItem{ text-align:center; margin-top:6px; color:#8ff; }

    /* Notebook FAB */
    #notebook-button{ position:fixed; left:12px; top:12px; z-index:6000; display:none; padding:10px 16px; border:2px solid #0ff; color:#0ff; background:#111; border-radius:8px; cursor:pointer; box-shadow:0 0 10px rgba(0,255,255,0.2); pointer-events:auto;}
    #storage-button{ position:fixed; right:12px; top:12px; z-index:6000; display:none; padding:10px 16px; border:2px solid #0ff; color:#0ff; background:#111; border-radius:8px; cursor:pointer; box-shadow:0 0 10px rgba(0,255,255,0.2); pointer-events:auto;}

    /* Touch halves (centered vertical 1/3 each) */
    #touch-left, #touch-right{ position:fixed; top:33%; bottom:33%; width:50%; z-index:5000; }
    #touch-left{ left:0; }
    #touch-right{ right:0; }
    @media (pointer: coarse){
      #touch-left, #touch-right{ background:rgba(0,0,0,0.05); }
    }

    /* Toast */
    #toast{ position:fixed; left:50%; top:16px; transform:translateX(-50%); background:rgba(0,0,0,0.7); border:1px solid #066; border-radius:8px; padding:8px 12px; color:#0ff; z-index:10001; display:none; max-width:70vw; text-align:center; }
  </style>
</head>
<body>
  <div id="flash-overlay"></div>
  <canvas id="renderCanvas"></canvas>

  <!-- Title screen -->
  <div id="title-screen">
    <div id="title-content">
      <img id="title-logo" src="./logo.jpg" alt="PhasmaPhoney Logo" />
      <div style="margin:8px 0 16px; color:#9ff;">“Welcome back. Keep the lights on and the sanity high.”</div>
      <button id="start-button">Start Investigation</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="row"><div class="label">Item</div><div class="value" id="hud-item">EMF</div></div>
    <div class="row"><div class="label">Weather</div><div class="value" id="hud-weather">Clear</div></div>
    <div id="hud-hunt">Hunt: Calm</div>
    <div id="activeItem"></div>
  </div>

  <!-- Action bar -->
  <div id="actions">
    <button id="use-btn"   class="hud-btn">Use</button>
    <button id="place-btn" class="hud-btn">Place</button>
    <button id="toss-btn"  class="hud-btn">Toss</button>
  </div>

  <!-- Touch control halves -->
  <div id="touch-left"></div>
  <div id="touch-right"></div>

  <button id="notebook-button">Notebook</button>
  <button id="storage-button">Storage</button>
  <div id="toast"></div>

<script>
// ===========================================================
// Fully wired systems (local-lib build) — integrates with an
// existing ghost mesh if present in the loaded scene.
// ===========================================================
const canvas = document.getElementById('renderCanvas');
const flashOverlay = document.getElementById('flash-overlay');

let engine, scene, camera, ground;
let uvLight=null, uvOn=false;

const Input = {
  moveVec: new BABYLON.Vector3(0,0,0),
  lookVec: new BABYLON.Vector2(0,0),
  running:false,
  actions:{ use:false, place:false, toss:false }
};

const Items = ['EMF','UV Light','Salt'];
let heldIndex=0, heldItem=Items[heldIndex];
function setHUDItem(){ const el=document.getElementById('hud-item'); if(el) el.textContent = heldItem; document.getElementById('activeItem').textContent = heldItem; }
setHUDItem();

// keyboard helpers
window.addEventListener('keydown', (e)=>{
  if(e.repeat) return;
  if(e.key==='q'){ heldIndex=(heldIndex+Items.length-1)%Items.length; heldItem=Items[heldIndex]; setHUDItem(); }
  if(e.key==='e'){ heldIndex=(heldIndex+1)%Items.length; heldItem=Items[heldIndex]; setHUDItem(); }
  if(e.key==='Shift') Input.running=true;
  if(e.key===' ') Input.actions.use=true;
});
window.addEventListener('keyup', (e)=>{ if(e.key==='Shift') Input.running=false; });

// Touch halves
(function setupTouchHalves(){
  const left=document.getElementById('touch-left');
  const right=document.getElementById('touch-right');
  let leftId=null, rightId=null;

  function norm(el, x, y){
    const r = el.getBoundingClientRect();
    const nx = ((x - r.left)/r.width)*2 - 1;
    const ny = ((y - r.top )/r.height)*2 - 1;
    return {nx, ny};
  }

  // LEFT => move
  left.addEventListener('touchstart', e=>{ if(leftId!==null) return; leftId=e.changedTouches[0].identifier; }, {passive:false});
  left.addEventListener('touchmove', e=>{
    const t=[...e.changedTouches].find(t=>t.identifier===leftId); if(!t) return;
    const {nx,ny}=norm(left,t.clientX,t.clientY);
    Input.moveVec.x = nx;  // strafe
    Input.moveVec.z = -ny; // forward/back
  }, {passive:false});
  left.addEventListener('touchend', e=>{ const gone=[...e.changedTouches].find(t=>t.identifier===leftId); if(gone){ leftId=null; Input.moveVec.set(0,0,0);} }, {passive:false});

  // RIGHT => look
  right.addEventListener('touchstart', e=>{ if(rightId!==null) return; rightId=e.changedTouches[0].identifier; }, {passive:false});
  right.addEventListener('touchmove', e=>{
    const t=[...e.changedTouches].find(t=>t.identifier===rightId); if(!t) return;
    const {nx,ny}=norm(right,t.clientX,t.clientY);
    Input.lookVec.set(nx, ny);
  }, {passive:false});
  right.addEventListener('touchend', e=>{ const gone=[...e.changedTouches].find(t=>t.identifier===rightId); if(gone){ rightId=null; Input.lookVec.set(0,0);} }, {passive:false});
})();

// Buttons
document.getElementById('use-btn').onclick   = ()=> Input.actions.use  = true;
document.getElementById('place-btn').onclick = ()=> Input.actions.place = true;
document.getElementById('toss-btn').onclick  = ()=> Input.actions.toss = true;

// Toast
function toast(msg, ms=1100){
  const t=document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(()=> t.style.display='none', ms);
}

// Hotspots for EMF
const INTERACT = { HOT_RADIUS:0.61, HOT_TTL_MS:10000, spots:[] };
function markInteractionAt(pos, tag='generic'){ INTERACT.spots.push({ pos: pos.clone(), tag, expiresAt: performance.now()+INTERACT.HOT_TTL_MS }); }
function pruneSpots(){ const now=performance.now(); INTERACT.spots = INTERACT.spots.filter(s=> now < s.expiresAt); }
function nearestSpotDist(p){ pruneSpots(); let best=Infinity; for(const s of INTERACT.spots){ const d=BABYLON.Vector3.Distance(p, s.pos); if(d<best) best=d; } return best; }

// Proxy items (for toss)
const ProxyItemSystem = (()=>{
  function mat(name){ const m=new BABYLON.StandardMaterial(name, scene); m.diffuseColor=new BABYLON.Color3(0.22,0.24,0.28); return m; }
  function create(kind, pos, yaw){
    const mesh = kind==='Book' || kind==='EMF' || kind==='UV Light'
      ? BABYLON.MeshBuilder.CreateBox('book',{width:0.15,height:0.02,depth:0.22},scene)
      : BABYLON.MeshBuilder.CreateCylinder('cup',{diameterTop:0.08,diameterBottom:0.09,height:0.1,tessellation:18},scene);
    mesh.material = mat('m_'+kind);
    mesh.position = pos.clone();
    mesh.rotation.y = yaw || 0;
    return mesh;
  }
  return { create };
})();

// Weather
const Weather = (()=>{
  let rain=null, ltTimer=0, next=3+Math.random()*10;
  function enableRain(){
    if(rain) return;
    rain = new BABYLON.ParticleSystem('rain', 2400, scene);
    rain.particleTexture = new BABYLON.Texture('./assets/images/nosignal.gif', scene);
    rain.minEmitBox = new BABYLON.Vector3(-30, 30, -30);
    rain.maxEmitBox = new BABYLON.Vector3( 30, 30,  30);
    rain.minSize=0.05; rain.maxSize=0.1;
    rain.minLifeTime=0.6; rain.maxLifeTime=1.0;
    rain.direction1 = new BABYLON.Vector3(0,-1.2,0);
    rain.direction2 = new BABYLON.Vector3(0,-1.0,0);
    rain.emitRate=2200; rain.gravity=new BABYLON.Vector3(0,-9.8,0);
    rain.start();
  }
  function bloodMoonTint(){
    scene.clearColor = new BABYLON.Color4(0.15,0.01,0.01,1);
    scene.fogColor   = new BABYLON.Color3(0.06,0.01,0.02);
  }
  function flash(){ flashOverlay.style.opacity='0.65'; setTimeout(()=> flashOverlay.style.opacity='0', 120); }
  function tick(dt){ if(!rain) return; ltTimer+=dt; if(ltTimer>=next){ ltTimer=0; next=3+Math.random()*10; flash(); } }
  return { set(state){ if(state==='Rain'){ enableRain(); } if(state==='Blood Moon'){ bloodMoonTint(); enableRain(); } }, tick };
})();

// Salt system
const SaltSystem = (()=>{
  let preview=null, charges=3, strips=[];
  function ensurePreview(){
    if(preview) return preview;
    preview = BABYLON.MeshBuilder.CreateBox('saltPreview', {width:0.7,height:0.02,depth:0.12}, scene);
    const m=new BABYLON.StandardMaterial('saltPrevMat', scene);
    m.diffuseColor=new BABYLON.Color3(0.95,0.95,1); m.alpha=0.35;
    preview.material = m; preview.isPickable=false;
    return preview;
  }
  function updatePreview(){
    if(heldItem!=='Salt'){ if(preview) preview.isVisible=false; return; }
    const hit = rayGroundCenter(); if(!hit){ if(preview) preview.isVisible=false; return; }
    ensurePreview();
    preview.position = hit.add(new BABYLON.Vector3(0,0.01,0));
    preview.rotation = new BABYLON.Vector3(0, camera.rotation.y, 0);
    preview.isVisible=true;
  }
  function place(){
    if(heldItem!=='Salt') return;
    if(charges<=0){ toast('Salt is empty'); return; }
    const hit = rayGroundCenter(); if(!hit){ toast('Aim at ground'); return; }
    const s = BABYLON.MeshBuilder.CreateBox('saltStrip', {width:0.7,height:0.02,depth:0.12}, scene);
    const m=new BABYLON.StandardMaterial('saltMat', scene);
    m.diffuseColor=new BABYLON.Color3(0.95,0.95,1); s.material=m;
    s.position = hit.add(new BABYLON.Vector3(0,0.01,0));
    s.rotation = new BABYLON.Vector3(0, camera.rotation.y, 0);
    s.metadata = { isSalt:true, t:performance.now() };
    strips.push(s);
    charges--; markInteractionAt(s.position, 'saltPlaced');
    toast(`Salt placed (${3-charges}/3)`);
  }
  function getStrips(){ return strips; }
  return { updatePreview, place, getStrips };
})();

// UV footprints
const UVFootprints = (()=>{
  const prints=[]; // {mesh, born}
  function spawnTrail(startPos, dir){
    for(let i=0;i<5;i++){
      const p=BABYLON.MeshBuilder.CreatePlane('uvfoot',{size:0.22},scene);
      p.rotation.x=Math.PI/2; p.position = startPos.add(dir.scale(i*0.28));
      const m=new BABYLON.StandardMaterial('uvfootMat',scene);
      m.diffuseColor=new BABYLON.Color3(0.6,0.1,0.95); m.alpha=0;
      p.material=m; prints.push({mesh:p, born:performance.now()});
    }
  }
  function update(){
    const now=performance.now();
    let beamDir=null, beamPos=null;
    if(uvOn && uvLight){ beamDir = uvLight.getDirection(BABYLON.Axis.Z); beamPos = uvLight.getAbsolutePosition(); }
    for(const f of prints){
      const age=now-f.born; if(age>60000){ f.mesh.dispose(); continue; }
      if(uvOn && beamDir && beamPos){
        const to=f.mesh.position.subtract(beamPos); const dist=to.length();
        if(dist<10){ to.normalize(); const d=BABYLON.Vector3.Dot(to, beamDir); f.mesh.material.alpha=(d>0.95)?1:0; }
        else f.mesh.material.alpha=0;
      } else f.mesh.material.alpha=0;
    }
    for(let i=prints.length-1;i>=0;i--){ if(prints[i].mesh.isDisposed()) prints.splice(i,1); }
  }
  return { spawnTrail, update };
})();

// EMF
const EMF = { on:false, level:0, nextBeepAt:0, _tone:null };
const EMF_CFG = { nearDist:1.6, farDist:6.0 };
function levelFromGhostDistance(d){ const n=1-BABYLON.Scalar.Clamp((d-EMF_CFG.nearDist)/(EMF_CFG.farDist-EMF_CFG.nearDist),0,1); return Math.round(n*5); }
function levelFromSpotDistance(d){ if(d>INTERACT.HOT_RADIUS) return 0; if(d<=INTERACT.HOT_RADIUS*0.33) return 4; if(d<=INTERACT.HOT_RADIUS*0.66) return 3; return 2; }
function emfTick(ghostMesh){
  if(!EMF.on){ if(EMF._tone){EMF._tone.pause(); EMF._tone=null;} EMF.level=0; return; }
  let base=0;
  if(ghostMesh){ const dg=BABYLON.Vector3.Distance(ghostMesh.position,camera.position); base=levelFromGhostDistance(dg); if(dg<EMF_CFG.nearDist+0.6 && Math.random()<0.2) base=5; }
  const hot=levelFromSpotDistance(nearestSpotDist(camera.position));
  const lvl=Math.max(base, hot); EMF.level=lvl;
  const now=performance.now();
  if(lvl>=2){
    if(lvl===5){
      if(!EMF._tone){ const s=new Audio('./assets/audio/emf_beep.mp3'); s.loop=true; s.volume=0.5; s.play().catch(()=>{}); EMF._tone=s; }
    }else{
      let gap=1200; if(lvl===3) gap=700; if(lvl===4) gap=350;
      if(now>=EMF.nextBeepAt){ const s=new Audio('./assets/audio/emf_beep.mp3'); s.volume=0.4; s.play().catch(()=>{}); EMF.nextBeepAt=now+gap; }
      if(EMF._tone){ EMF._tone.pause(); EMF._tone=null; }
    }
  }else{ if(EMF._tone){ EMF._tone.pause(); EMF._tone=null; } }
}

// Toggle UV
function toggleUV(){
  uvOn=!uvOn;
  if(uvOn){
    if(!uvLight){
      uvLight = new BABYLON.SpotLight('uvLight', new BABYLON.Vector3(0,0,0), new BABYLON.Vector3(0,0,1), Math.PI/3, 8, scene);
      uvLight.parent = camera; uvLight.intensity=1.8; uvLight.range=12;
      uvLight.diffuse = new BABYLON.Color3(0.6,0.3,0.9); uvLight.specular = new BABYLON.Color3(0,0,0);
    }else{ uvLight.setEnabled(true); uvLight.intensity=1.8; }
  }else{ if(uvLight){ uvLight.intensity=0; uvLight.setEnabled(false); } }
  toast(uvOn?'UV on':'UV off');
}

// Actions
function onUse(){
  if(heldItem==='EMF'){ EMF.on=!EMF.on; toast(EMF.on?'EMF on':'EMF off'); return; }
  if(heldItem==='UV Light'){ toggleUV(); return; }
  if(heldItem==='Salt'){ toast('Use does nothing for salt. Tap Place.'); return; }
}
function onPlace(){ if(heldItem==='Salt'){ SaltSystem.place(); return; } toast('Nothing to place.'); }
function onToss(){
  const ahead = camera.position.add(camera.getForwardRay().direction.scale(0.9));
  const m = ProxyItemSystem.create(heldItem, ahead, camera.rotation.y);
  markInteractionAt(m.position, 'thrown');
  const vel = camera.getForwardRay().direction.scale(4.5).add(new BABYLON.Vector3(0,3.5,0));
  let life=0;
  const token = scene.onBeforeRenderObservable.add(()=>{
    const dt=engine.getDeltaTime()/1000; life+=dt;
    m.position.addInPlace(vel.scale(dt)); vel.y -= 9.8*dt;
    const gy=(ground?.position?.y ?? 0)+0.02;
    if(m.position.y<=gy){ m.position.y=gy; scene.onBeforeRenderObservable.remove(token); markInteractionAt(m.position,'landed'); }
    if(life>5){ scene.onBeforeRenderObservable.remove(token); }
  });
}

// Helpers
function rayGroundCenter(){
  const pick = scene.pick(scene.pointerX || innerWidth/2, scene.pointerY || innerHeight/2, m=>m && m.isPickable!==false);
  if(pick?.hit && pick.pickedPoint) return pick.pickedPoint.clone();
  return null;
}
function applyInput(dt){
  camera.rotation.y += Input.lookVec.x * 0.045;
  const minPitch = -Math.PI/2 + 0.15, maxPitch = Math.PI/2 - 0.15;
  camera.rotation.x = Math.min(maxPitch, Math.max(minPitch, camera.rotation.x + (-Input.lookVec.y * 0.045)));
  let mv = Input.moveVec.clone();
  if(mv.lengthSquared()>1e-3){
    mv.normalize();
    const speed = (Input.running?3.4:1.8);
    const fwd = camera.getForwardRay().direction; fwd.y=0; fwd.normalize();
    const right = BABYLON.Vector3.Cross(fwd, BABYLON.Axis.Y).scale(-1);
    const desired = fwd.scale(mv.z).add(right.scale(mv.x)).normalize().scale(speed*dt);
    camera.position.addInPlace(desired);
    if(ground) camera.position.y = ground.position.y + 1.7;
  }
}

// Ghost detection (use existing ghost if present)
function findGhostMesh(){
  const cands = scene.meshes.filter(m=> (m.name||'').toLowerCase().includes('ghost'));
  // Prefer non-root visible meshes
  return cands.find(m=>m.isVisible!==false && !/^__?root__?$/i.test(m.name||'')) || cands[0] || null;
}

// Boot
async function boot(){
  engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true });
  scene  = new BABYLON.Scene(engine);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2; scene.fogDensity = 0.0045;
  scene.clearColor = new BABYLON.Color4(0.01,0.01,0.02,1);

  // Camera
  camera = new BABYLON.UniversalCamera('cam', new BABYLON.Vector3(0,1.7,6), scene);
  camera.minZ = 0.1;

  // Ground fallback
  ground = BABYLON.MeshBuilder.CreateGround('ground', { width:80, height:80 }, scene);
  const gmat = new BABYLON.StandardMaterial('gmat', scene);
  gmat.diffuseColor = new BABYLON.Color3(0.06,0.08,0.12); gmat.specularColor = new BABYLON.Color3(0,0,0);
  ground.material = gmat;

  // Optional: try load your map & ghosts safely (won't crash if missing)
  try{
    await BABYLON.SceneLoader.ImportMeshAsync('', './assets/models/map/', 'Abandoned_House.glb', scene);
  }catch(e){ console.warn('Map not loaded (optional):', e?.message||e); }
  try{
    // if your pipeline spawns ghosts automatically, nothing to do;
    // otherwise attempt to import one ghost file as a fallback test:
    // await BABYLON.SceneLoader.ImportMeshAsync('', './assets/models/ghosts/', 'ghost1.glb', scene);
  }catch(e){ console.warn('Ghost not loaded (optional):', e?.message||e); }

  // Weather
  const r=Math.random(); const wx = r<0.45?'Clear': r<0.80?'Rain':'Blood Moon';
  Weather.set(wx); const hw=document.getElementById('hud-weather'); if(hw) hw.textContent=wx;

  // Render loop
  engine.runRenderLoop(()=>{
    const dt = engine.getDeltaTime()/1000;
    const ghost = findGhostMesh();

    SaltSystem.updatePreview();
    applyInput(dt);
    UVFootprints.update();
    emfTick(ghost);
    Weather.tick(dt);

    // When ghost passes through salt, leave footprints trail
    if(ghost){
      const strips = SaltSystem.getStrips();
      for(const s of strips){
        const dx=Math.abs(ghost.position.x - s.position.x);
        const dz=Math.abs(ghost.position.z - s.position.z);
        if(dx<0.6 && dz<0.6){
          const dir = ghost.forward ? ghost.forward : ghost.getDirection(BABYLON.Axis.Z) || new BABYLON.Vector3(1,0,0);
          const d2 = new BABYLON.Vector3(dir.x,0,dir.z); if(d2.lengthSquared()<0.0001) d2.copyFromFloats(1,0,0); else d2.normalize();
          UVFootprints.spawnTrail(ghost.position.clone(), d2);
          markInteractionAt(s.position, 'salt');
        }
      }
    }

    scene.render();

    // consume one-shot actions
    if(Input.actions.use){ onUse(); Input.actions.use=false; }
    if(Input.actions.place){ onPlace(); Input.actions.place=false; }
    if(Input.actions.toss){ onToss(); Input.actions.toss=false; }
  });

  window.addEventListener('resize', ()=> engine.resize());
}

// Start flow
async function safeStart(){
  const title=document.getElementById('title-screen'); if(title) title.style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('storage-button').style.display='block';
  document.getElementById('notebook-button').style.display='block';
  await boot();
}
document.getElementById('start-button').addEventListener('click', safeStart);
</script>
</body>
</html>
