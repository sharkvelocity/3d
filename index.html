<html lang="en">

<title>PhasmaPhoney — Web Build</title>

<script src="./cdn/babylon.js"></script>

<style>
  :root{
    --hud-bg:#000a; --hud-fg:#0ff; --btn:#111; --btn-br:#0ff; --accent:#0ff;
    --van-btn:#111a; --van-br:#0ff8;
  }
  html,body{margin:0;padding:0;height:100%;width:100%;background:#000;color:#eee;overflow:hidden;font-family:system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;}
  canvas#render-canvas{position:fixed;inset:0;background:#000;}
  /* Start overlay */
  #startOverlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:#000; z-index:99999;
  }
  #startOverlay img{max-width:min(70vw,800px); height:auto; opacity:.2; pointer-events:none; margin-bottom:24px;}
  #startBtn{
    position:relative; z-index:100000; padding:14px 28px; font-size:22px; letter-spacing:.5px;
    background:#111; color:#eee; border:2px solid #666; border-radius:6px; cursor:pointer;
  }
  #startBtn:active{transform:translateY(1px)}
  /* HUD (top-left) */
  #hud{
    position:fixed; top:10px; left:10px; z-index:1000; background:var(--hud-bg); color:var(--hud-fg);
    border:1px solid var(--btn-br); border-radius:8px; padding:8px 10px; min-width:240px; pointer-events:none;
  }
  #hud h3{margin:0 0 6px 0; font-weight:600; font-size:14px; color:#7ff;}
  .row{display:flex; align-items:center; gap:8px; margin:3px 0;}
  .lab{opacity:.8; font-size:12px; min-width:88px;}
  .val{font-family:monospace; font-size:13px;}
  /* Items bar (bottom center) */
  #itemsBar{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    display:flex; gap:8px; z-index:1000; background:#0008; padding:8px 10px; border:1px solid #0ff6; border-radius:12px;
  }
  .slot{
    width:66px; height:66px; border:2px solid #0ff4; border-radius:8px; display:flex; align-items:center; justify-content:center;
    background:#050505; color:#0ff; position:relative; cursor:pointer; user-select:none;
  }
  .slot.active{outline:2px solid #0ff; box-shadow:0 0 14px #0ff7 inset}
  .slot .n{position:absolute; top:2px; left:4px; font-size:11px; opacity:.7;}
  .slot .lbl{font-size:11px; text-align:center; padding:3px; line-height:1.1}
  /* Use/Interact buttons for touch */
  #touchButtons{
    position:fixed; right:10px; bottom:12px; display:flex; gap:8px; z-index:1000;
  }
  .tbtn{
    padding:10px 12px; background:#0b0b0b; color:#0ff; border:1px solid #0ff6; border-radius:8px; font-size:14px;
  }
  /* Storage button (van zone only) */
  #storageBtn{
    position:fixed; right:14px; top:40%; transform:translateY(-50%);
    z-index:1000; display:none; padding:10px 12px; background:var(--van-btn); color:#8ff; border:1px solid var(--van-br); border-radius:8px;
  }
  /* Notebook overlay (slot 5) */
  #notebook{
    position:fixed; inset:8% 6%; z-index:2000; display:none; background:#111f; backdrop-filter:blur(2px);
    border:1px solid #0ff5; border-radius:10px; color:#0ff; padding:12px; overflow:auto;
  }
  #nbTabs{display:flex; gap:6px; margin-bottom:8px;}
  .tabBtn{padding:8px 10px; border:1px solid #0ff5; background:#000; color:#0ff; border-radius:6px; cursor:pointer;}
  .tabBtn.active{background:#013; box-shadow:0 0 6px #0ff8 inset}
  .nbPage{display:none;}
  .nbPage.active{display:block;}
  /* Dev modal (ESC to open) */
  #devModal{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:100000;
    background:#000b;
  }
  #devCard{
    min-width:320px; max-width:92vw; background:#111; color:#0ff; border:1px solid #0ff5; border-radius:10px; padding:12px;
  }
  #devCard h3{margin:0 0 8px 0;}
  #devTools{display:none; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .devBtn{padding:8px 10px; border:1px solid #0ff6; border-radius:8px; background:#000; color:#7ff;}
  #devLog{margin-top:10px; max-height:20vh; overflow:auto; background:#000; border:1px solid #0ff2; padding:8px; border-radius:8px; font-family:monospace; font-size:12px;}
  /* Flash (lightning) */
  #flash{position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:999;}
  /* Interact prompt */
  #prompt{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:#0008; color:#0ff;
    border:1px solid #0ff5; border-radius:8px; padding:6px 10px; z-index:1000; display:none; font-size:14px;
  }
  /* Small right-hand active item preview anchor (for 3D mesh attached to camera) */
  #activePreviewLbl{
    position:fixed; right:12px; top:12px; z-index:900; color:#0ff; background:#0006; padding:4px 8px; border:1px solid #0ff4; border-radius:6px;
  }
</style>
</head>

<!-- Touch buttons -->

  <button class="tbtn" id="btnRun">RUN</button>
  <button class="tbtn" id="btnUse">USE (E)</button>

</div>

<!-- Storage (van zone only) -->
<button id="storageBtn">STORAGE</button>

<!-- Notebook (Evidence + Ghost selection inside) -->
<div id="notebook" aria-modal="true" role="dialog">
  <div id="nbTabs">
    <button class="tabBtn active" data-tab="pageEvidence">Evidence</button>
    <button class="tabBtn" data-tab="pageGhosts">Ghosts</button>
    <button class="tabBtn" data-tab="pageNotes">Notes</button>
    <button class="tabBtn" id="nbClose" style="margin-left:auto;">Close (5)</button>

    <div id="evidenceList" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px;"></div>
    <hr style="border-color:#0ff2"/>
    <div id="matchArea">
      <strong>Possible ghosts:</strong> <span id="matchList">All</span>
    </div>
  </div>

  <div id="pageGhosts" class="nbPage">
    <h3>Ghosts</h3>
    <div id="ghostList" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:6px;"></div>
    <div style="margin-top:10px;"><button class="tabBtn" id="btnSubmitGuess">Submit Guess</button></div>
  </div>

  <div id="pageNotes" class="nbPage">
    <h3>Investigation Notes</h3>
    <textarea id="notes" style="width:100%;height:30vh;background:#000;color:#0ff;border:1px solid #0ff6;border-radius:6px;"></textarea>
  </div>
</div>

<!-- Flash (lightning) -->
<div id="flash"></div>

<!-- Interact prompt -->
<div id="prompt">Press E to open</div>

<!-- Right-hand small label for active item (3D mesh will be anchored to camera) -->
<div id="activePreviewLbl" style="display:none;">Active: <span id="activePreviewName"></span></div>

<!-- Dev modal (ESC to open) -->
<div id="devModal">
  <div id="devCard">
    <h3>Developer Options</h3>
    <div id="devAuth">
      <p>Enable developer mode?</p>

        <button class="devBtn" id="devNo">No</button>

        <button class="devBtn" id="devPwdOk" style="display:none;">OK</button>

    <div id="devTools">

      <button class="devBtn" id="devGod">God Mode: OFF</button>

<script>
/* ==========================================================
   CONFIG + DATA
   ========================================================== */
const CANVAS = document.getElementById('render-canvas');
const engine = new BABYLON.Engine(CANVAS, true, { preserveDrawingBuffer:true, stencil:true });

const EVIDENCE_TYPES = [
  "EMF Level 5", "Spirit Box", "Fingerprints", "Ghost Writing", "Freezing Temps", "D.O.T.S", "Orbs"
];

// Ghost DB (name + evidence)
const GHOSTS = {
  spirit:        ["Spirit Box","Ghost Writing","EMF Level 5"],
  wraith:        ["Spirit Box","D.O.T.S","EMF Level 5"],
  poltergeist:   ["Spirit Box","Ghost Writing","Fingerprints"],
  banshee:       ["D.O.T.S","Fingerprints","Orbs"],
  jinn:          ["EMF Level 5","Freezing Temps","Fingerprints"],
  mare:          ["Spirit Box","Ghost Writing","Orbs"],
  revenant:      ["Ghost Writing","Orbs","Freezing Temps"],
  shade:         ["Ghost Writing","Freezing Temps","EMF Level 5"],
  demon:         ["Freezing Temps","Ghost Writing","Fingerprints"],
  yurei:         ["Freezing Temps","D.O.T.S","Orbs"],
  oni:           ["EMF Level 5","Freezing Temps","D.O.T.S"],
  yokai:         ["Spirit Box","D.O.T.S","Orbs"],
  hantu:         ["Freezing Temps","Ghost Writing","Fingerprints"],
  goryo:         ["EMF Level 5","D.O.T.S","Fingerprints"],
  myling:        ["Ghost Writing","EMF Level 5","Fingerprints"],
  onryo:         ["Freezing Temps","Spirit Box","Orbs"],
  "the twins":   ["Spirit Box","Freezing Temps","EMF Level 5"],
  raiju:         ["EMF Level 5","D.O.T.S","Orbs"],
  obake:         ["EMF Level 5","Orbs","Fingerprints"],
  "the mimic":   ["Spirit Box","Freezing Temps","Fingerprints"],
  moroi:         ["Freezing Temps","Ghost Writing","Spirit Box"],
  deogen:        ["Spirit Box","Ghost Writing","D.O.T.S"],
  thaye:         ["Ghost Writing","Orbs","D.O.T.S"],
  phantom:       ["Spirit Box","D.O.T.S","Fingerprints"],
  succubus:      ["Ghost Writing","Orbs","Spirit Box"]
};

const ITEM_SLOTS = { 1:null, 2:null, 3:null, 4:"Lighter", 5:"Notebook" };
// Items pool selectable from van storage
const ALL_ITEMS = ["EMF","Spirit Box","Thermometer","UV Light","D.O.T.S","Camera","Ghost Writing Book","Salt","Smudge","Motion Sensor"];

// Mesh resolver hints for ./assets/models/items/exploration_objects.glb
const ITEM_MESH_HINTS = {
  "EMF": "EMF_Detector",
  "Spirit Box": "Spirit_Box",
  "Thermometer": "Thermometer",
  "UV Light": "Flashlight_Poquet",   // If you add a real UV model later, update this
  "D.O.T.S": "Voice_Recorder",       // Placeholder if DOTS model isn't present
  "Camera": "Photo_Camera_",
  "Ghost Writing Book": null,
  "Salt": null,
  "Smudge": null,
  "Motion Sensor": null,
  "Lighter": null,
  "Notebook": null
};

// Barrier polygon (playable outdoor area from user pings)
const BARRIER = [
  new BABYLON.Vector3(18.404, -0.016, -96.040),
  new BABYLON.Vector3(57.205, -0.718, -94.031),
  new BABYLON.Vector3(62.145, -0.651, -105.142),
  new BABYLON.Vector3(61.872,  1.165, -149.928),
  new BABYLON.Vector3(18.660,  1.165, -149.900)
];

// Spawn / van zone (between first two pings)
const VAN_SPAWN = new BABYLON.Vector3((18.404+57.205)/2, 8, (-96.040-94.031)/2); // y=8 raycast down to floor
const VAN_ZONE_BB = { // axis-aligned volume to show STORAGE button
  minX: Math.min(18.404,57.205)-4, maxX: Math.max(18.404,57.205)+4,
  minZ: Math.min(-96.040,-94.031)-6, maxZ: Math.max(-96.040,-94.031)+6
};

// Weather profiles
const WEATHER = {
  clear: { name: "Clear", sfx: "./assets/audio/clearWeather.mp3", rain:false },
  rain:  { name: "Rain",  sfx: "./assets/audio/rainstorm.mp3",   rain:true }
};

// Globals
let scene, camera, house, itemsPack, ghostNode, ghostAI, ghostEvidence, ghostName;
let activeSlot = 1, activeMeshClone = null;
let sanity = 100;
let weather, sfx = {}, orbsPS = null;
let devMode = false, devFly = false, devGod = false;

// UI elements
const hudWeather = document.getElementById('hudWeather');
const hudRoom    = document.getElementById('hudRoom');
const hudSanity  = document.getElementById('hudSanity');
const storageBtn = document.getElementById('storageBtn');
const notebook   = document.getElementById('notebook');
const matchList  = document.getElementById('matchList');
const evidenceList = document.getElementById('evidenceList');
const ghostList  = document.getElementById('ghostList');
const nbTabs     = document.querySelectorAll('.tabBtn[data-tab]');
const nbPages    = document.querySelectorAll('.nbPage');
const flashEl    = document.getElementById('flash');
const promptEl   = document.getElementById('prompt');
const previewLbl = document.getElementById('activePreviewLbl');
const previewName= document.getElementById('activePreviewName');
const devModal   = document.getElementById('devModal');
const devYes     = document.getElementById('devYes');
const devNo      = document.getElementById('devNo');
const devPwd     = document.getElementById('devPwd');
const devPwdOk   = document.getElementById('devPwdOk');
const devTools   = document.getElementById('devTools');
const devLog     = document.getElementById('devLog');
const devTpGhost = document.getElementById('devTpGhost');
const devTpVan   = document.getElementById('devTpVan');
const devGodBtn  = document.getElementById('devGod');
const devFlyBtn  = document.getElementById('devFly');
const devPingBtn = document.getElementById('devPing');
const devInsBtn  = document.getElementById('devInspector');

let evidenceFound = new Set(); // selected/found evidence

/* ==========================================================
   INIT
   ========================================================== */
function pointInPolyXZ(p, poly){
  // even-odd rule on XZ plane
  let inside = false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x, zi=poly[i].z;
    const xj=poly[j].x, zj=poly[j].z;
    const intersect = ((zi>p.z)!==(zj>p.z)) && (p.x < (xj - xi)*(p.z - zi)/(zj - zi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function randomPointInBarrier(){
  // sample AABB bounding box until inside polygon
  let minX=+Infinity,maxX=-Infinity,minZ=+Infinity,maxZ=-Infinity;
  BARRIER.forEach(v=>{minX=Math.min(minX,v.x);maxX=Math.max(maxX,v.x);minZ=Math.min(minZ,v.z);maxZ=Math.max(maxZ,v.z);});
  for(let k=0;k<5000;k++){
    const x = minX + Math.random()*(maxX-minX);
    const z = minZ + Math.random()*(maxZ-minZ);
    const p = new BABYLON.Vector3(x, 10, z);
    if (pointInPolyXZ(p,BARRIER)) return p;
  }
  return VAN_SPAWN.clone();
}

async function createScene(){
  scene = new BABYLON.Scene(engine);
  scene.collisionsEnabled = true;
  scene.gravity = new BABYLON.Vector3(0, -0.098, 0);

  // Camera (FPS style)
  camera = new BABYLON.UniversalCamera("cam", VAN_SPAWN.clone(), scene);
  camera.minZ = 0.05;
  camera.speed = 0.35;            // walk
  camera.angularSensibility = 6000;
  camera.inertia = 0.7;
  camera.checkCollisions = true;
  camera.applyGravity = true;
  camera.ellipsoid = new BABYLON.Vector3(0.45, 0.9, 0.45);
  camera.ellipsoidOffset = new BABYLON.Vector3(0, 0.8, 0);
  camera.attachControl(CANVAS, true);

  // Lighting
  const hemi = new BABYLON.HemisphericLight("h", new BABYLON.Vector3(0,1,0), scene);
  hemi.intensity = .75;
  const dir = new BABYLON.DirectionalLight("d", new BABYLON.Vector3(-0.5,-1,-0.3), scene);
  dir.position = new BABYLON.Vector3(30,60,30);
  dir.intensity = 0.5;

  // Ambient sky color (helps under shadows)
  scene.clearColor = new BABYLON.Color4(0.01,0.01,0.015,1);

  // Load house
  const r1 = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/map/", "Abandoned_House.glb", scene);
  house = new BABYLON.TransformNode("houseRoot", scene);
  r1.meshes.forEach(m=>{ if(m!==scene.meshes[0]) m.setParent(house); });
  // Collisions setup
  setupEnvironmentCollisions(scene);

  // Project player down to floor at VAN_SPAWN
  placeOnGround(camera.position);

  // Load items pack
  const r2 = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/items/", "exploration_objects.glb", scene);
  itemsPack = new BABYLON.TransformNode("itemsRoot", scene);
  r2.meshes.forEach(m=>{ if(m!==scene.meshes[0]) m.setParent(itemsPack); m.setEnabled(false); m.isPickable=false; m.checkCollisions=false; m.alwaysSelectAsActiveMesh=false; });

  // Weather
  setupWeather();

  // Audio SFX
  sfx = {
    doorCreak1: new BABYLON.Sound("doorCreak1","./assets/audio/doorCreak1.mp3",scene,null,{volume:0.6}),
    doorCreak2: new BABYLON.Sound("doorCreak2","./assets/audio/doorCreak2.mp3",scene,null,{volume:0.6}),
    doorSlam1:  new BABYLON.Sound("doorSlam1","./assets/audio/doorSlam1.mp3",scene,null,{volume:0.6}),
    whisper:    new BABYLON.Sound("whisper","./assets/audio/whisper.mp3",scene,null,{volume:0.5}),
    spiritbox:  new BABYLON.Sound("spiritbox","./assets/audio/spiritbox.mp3",scene),
    sbStatic:   new BABYLON.Sound("sbstatic","./assets/audio/spiritBoxStatic.mp3",scene,null,{loop:true,volume:0.15}),
    write:      new BABYLON.Sound("write","./assets/audio/GhostWriting1.mp3",scene,null,{volume:0.7}),
    rain:       new BABYLON.Sound("rain","./assets/audio/rainstorm.mp3",scene,null,{loop:true, volume:0.35}),
    clear:      new BABYLON.Sound("clear","./assets/audio/clearWeather.mp3",scene,null,{loop:true, volume:0.25})
  };
  if(weather.rain){ sfx.rain.play(); } else { sfx.clear.play(); }

  // Orbs particle system (disabled by default; only shown when Camera active)
  orbsPS = new BABYLON.ParticleSystem("orbs", 200, scene);
  orbsPS.particleTexture = new BABYLON.Texture("./assets/images/nosignal.gif", scene); // reusing as placeholder
  orbsPS.minSize = 0.02; orbsPS.maxSize = 0.04; orbsPS.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
  orbsPS.minLifeTime = 0.8; orbsPS.maxLifeTime = 1.6;
  orbsPS.emitRate = 0; // off
  orbsPS.gravity = new BABYLON.Vector3(0,0,0);
  orbsPS.direction1 = new BABYLON.Vector3(-0.1,0, -0.1);
  orbsPS.direction2 = new BABYLON.Vector3(0.1,0, 0.1);

  // Doors (generic finder + interaction volumes)
  setupDoors();

  // Ghost
  await spawnGhost();

  // Notebook pages
  buildNotebook();

  // Items bar logic
  wireItemsBar();

  // Controls
  wireInput();

  // Game loop tick: update room, storage button visibility, orbs follow ghost when Camera active, ghost AI
  scene.onBeforeRenderObservable.add(()=>{
    updateTopHUD();
    updateStorageButton();
    updateActivePreviewMesh();
    if(activeItemName()==="Camera"){
      // Place orbs near ghost only when camera selected
      if(ghostNode){
        orbsPS.emitRate = 50;
        orbsPS.emitter = ghostNode.position.clone().add(new BABYLON.Vector3(0,1.4,0));
      }
    } else {
      orbsPS.emitRate = 0;
    }
  });

  return scene;
}

function setupEnvironmentCollisions(scene){
  // Enable collisions broadly; then selectively disable on non-walkable / transparent / debris / roof
  scene.meshes.forEach(m=>{
    if(!m || m === scene.meshes[0]) return;
    m.checkCollisions = true;
    const n = (m.name||"").toLowerCase();
    if (n.includes("glass") || n.includes("foliage") || n.includes("tree") || n.includes("bush")
        || n.includes("debris") || n.includes("trash") || n.includes("roof") || n.includes("wire")
        || n.includes("fence") || n.includes("chain") || n.includes("prop") || n.includes("transparent")){
      m.checkCollisions = false; // walk through random garbage / transparent obstacles
    }
    // Doors start collidable off (we handle push volumes)
    if (n.includes("door")){
      m.checkCollisions = false;
      m.isPickable = true;
    }
    // Floors/Walls/Stairs strongly collidable
    if (n.includes("floor") || n.includes("wall") || n.includes("stair") || n.includes("ground")){
      m.checkCollisions = true;
    }
  });
}

function placeOnGround(pos){
  // Raycast down to find walkable surface
  const ray = new BABYLON.Ray(pos.add(new BABYLON.Vector3(0,20,0)), new BABYLON.Vector3(0,-1,0), 200);
  const hit = scene.pickWithRay(ray, (m)=>m.checkCollisions===true);
  if(hit && hit.pickedPoint){
    pos.copyFrom(hit.pickedPoint.add(new BABYLON.Vector3(0,1.6,0)));
  }else{
    pos.y = 2;
  }
}

/* ==========================================================
   DOORS (generic)
   ========================================================== */
const doors = []; // {mesh, open:false, pivot, angle}
function setupDoors(){
  // Find likely door meshes
  scene.meshes.forEach(m=>{
    if(!m || m===scene.meshes[0]) return;
    const n=(m.name||"").toLowerCase();
    if(n.includes("door")){
      // Create pivot node for rotation
      const pivot = new BABYLON.TransformNode("p_"+m.name, scene);
      pivot.position = m.getAbsolutePosition();
      pivot.rotation = new BABYLON.Vector3(0,0,0);
      m.setParent(pivot);
      m.checkCollisions = false; // we toggle if needed
      doors.push({mesh:m, pivot, open:false, angle:0});
    }
  });
}

function doorNearPlayer(){
  const p = camera.position;
  let best = null, bestD=2.0;
  doors.forEach(d=>{
    const dpos = d.pivot.getAbsolutePosition();
    const dist = BABYLON.Vector3.Distance(p,dpos);
    if(dist<bestD) { bestD=dist; best=d; }
  });
  return best;
}
function updateDoorPrompt(){
  const d = doorNearPlayer();
  if(d){ promptEl.style.display="block"; } else { promptEl.style.display="none"; }
}
function toggleDoor(d){
  d.open = !d.open;
  // rotate around Y ± ~100deg
  const target = d.open ? (Math.PI/2) : 0;
  const start = d.angle;
  const dur = 200;
  const t0 = performance.now();
  (function anim(){
    const t = (performance.now()-t0)/dur;
    if(t>=1){ d.angle=target; d.pivot.rotation.y=target; return;}
    d.angle = BABYLON.Scalar.Lerp(start,target,t);
    d.pivot.rotation.y = d.angle;
    requestAnimationFrame(anim);
  })();
  // audio
  (Math.random()<0.25 ? sfx.doorSlam1 : (Math.random()<0.5 ? sfx.doorCreak1 : sfx.doorCreak2)).play();
}

/* ==========================================================
   GHOST
   ========================================================== */
async function spawnGhost(){
  ghostName = pick(Object.keys(GHOSTS));
  ghostEvidence = new Set(GHOSTS[ghostName]);

  const which = "ghost" + (1 + (Math.random()*5|0)) + ".glb";
  const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/ghosts/", which, scene);
  const root = new BABYLON.TransformNode("ghostRoot", scene);
  r.meshes.forEach(m=>{ if(m!==scene.meshes[0]) m.setParent(root); m.checkCollisions=false; m.isPickable=false;});
  // Upright/orient fix: make it stand and face +Z
  root.rotation = new BABYLON.Vector3(0, Math.PI, 0);
  // Position somewhere inside barrier
  root.position = randomPointInBarrier(); placeOnGround(root.position);

  // Animations
  const groups = r.animationGroups||[];
  const idle = groups.find(g=>/idle/i.test(g.name)) || null;
  const walk = groups.find(g=>/walk/i.test(g.name)) || null;
  if(idle) idle.start(true, 1.0, idle.from, idle.to, true);

  ghostNode = root;
  ghostAI = {
    state:"idle", idle, walk, nextMove: performance.now()+1500,
    speed: 0.05
  };

  // Orbs emitter default near ghost; enabled only when camera selected
  if(orbsPS) { orbsPS.start(); }
}

function pick(a){ return a[(Math.random()*a.length)|0]; }

function updateGhostAI(dt){
  if(!ghostNode) return;
  const now = performance.now();
  if(now>ghostAI.nextMove){
    ghostAI.nextMove = now + 2500 + Math.random()*2500;
    // new random target inside barrier
    ghostAI.target = randomPointInBarrier(); placeOnGround(ghostAI.target);
    // swap to walk anim
    if(ghostAI.walk && ghostAI.idle){ ghostAI.idle.stop(); ghostAI.walk.start(true,1.0,ghostAI.walk.from,ghostAI.walk.to,true); }
    ghostAI.state = "walk";
  }
  if(ghostAI.state==="walk" && ghostAI.target){
    const p = ghostNode.position;
    const to = ghostAI.target.subtract(p);
    const dist = to.length();
    if(dist<0.2){
      // reached; go idle
      if(ghostAI.walk && ghostAI.idle){ ghostAI.walk.stop(); ghostAI.idle.start(true,1.0,ghostAI.idle.from,ghostAI.idle.to,true); }
      ghostAI.state="idle";
    }else{
      to.normalize();
      // face movement
      const yaw = Math.atan2(to.x, to.z);
      ghostNode.rotation.y = yaw;
      ghostNode.position.addInPlace(to.scale(ghostAI.speed * dt*0.06));
    }
  }
}

/* ==========================================================
   NOTEBOOK (Evidence + Ghost Guess)
   ========================================================== */
function buildNotebook(){
  // Evidence checkboxes (read-only here; adding happens via using tools; but enable manual check for testing)
  evidenceList.textContent = "";
  EVIDENCE_TYPES.forEach(ev=>{
    const id = "ev_"+ev.replace(/\s+/g,'_');
    const w = document.createElement('label');
    w.style.display="flex"; w.style.alignItems="center"; w.style.gap="8px";
    const cb = document.createElement('input');
    cb.type='checkbox'; cb.id=id; cb.checked = false;
    cb.addEventListener('change', ()=>{
      if(cb.checked) evidenceFound.add(ev); else evidenceFound.delete(ev);
      refreshMatches();
    });
    const sp = document.createElement('span'); sp.textContent = ev;
    w.append(cb, sp);
    evidenceList.appendChild(w);
  });

  // Ghost list
  ghostList.textContent = "";
  Object.keys(GHOSTS).forEach(name=>{
    const btn = document.createElement('button');
    btn.className = 'tabBtn';
    btn.textContent = name.toUpperCase();
    btn.onclick = ()=>{ document.querySelectorAll('#ghostList .tabBtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); ghostGuess=name; };
    ghostList.appendChild(btn);
  });
  document.getElementById('btnSubmitGuess').onclick = ()=>{
    if(!ghostGuess){ logMsg("Select a ghost first."); return; }
    if(ghostGuess===ghostName){
      logMsg("✅ Correct! Ghost was "+ghostName.toUpperCase()+".");
    }else{
      logMsg("❌ Incorrect. Ghost was "+ghostName.toUpperCase()+".");
    }
  };

  // Tabs
  nbTabs.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      nbTabs.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      nbPages.forEach(pg=>pg.classList.remove('active'));
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });
  document.getElementById('nbClose').onclick = ()=>toggleNotebook(false);

  refreshMatches();
}
function refreshMatches(){
  // Filter ghosts that contain all found evidence
  const found = Array.from(evidenceFound);
  const candidates = Object.entries(GHOSTS).filter(([n,evs])=>{
    return found.every(f=>evs.includes(f));
  }).map(([n])=>n.toUpperCase());
  matchList.textContent = candidates.length? candidates.join(", ") : "None";
}
function toggleNotebook(show){
  notebook.style.display = show? "block":"none";
}

function activeItemName(){

function setSlotLabel(slot, name){

function setActivePreviewMesh(itemName){

/* ==========================================================
   EVIDENCE LOGIC — use items with E (or touch USE)
   Rules:
   - EMF: near ghost → chance to get "EMF Level 5"
   - Thermometer: in ghost vicinity → chance to get "Freezing Temps"
   - Spirit Box: near ghost & random → "Spirit Box" (audio)
   - UV Light: after door interaction or random touch event → "Fingerprints" (chance)
   - D.O.T.S: if placed (press E to place sensor here), sometimes triggers → "D.O.T.S"
   - Camera: orbs only visible when camera selected; press E to capture → "Orbs" if orbs active near ghost
   - Ghost Writing Book: press E to place; random timer in ghost area → "Ghost Writing"
   ========================================================== */
const placedDOTS = []; // positions
let placedBook = null;

function addEvidence(ev){
  if(!EVIDENCE_TYPES.includes(ev)) return;
  evidenceFound.add(ev);
  // check corresponding checkbox
  const id = "ev_"+ev.replace(/\s+/g,'_');
  const cb = document.getElementById(id);
  if(cb && !cb.checked){ cb.checked=true; }
  refreshMatches();
  logMsg("Evidence: "+ev);
}

function nearGhost(radius=4.0){
  if(!ghostNode) return false;
  return BABYLON.Vector3.Distance(ghostNode.position, camera.position) <= radius;
}

function useActiveItem(){
  const name = activeItemName();
  if(!name){ logMsg("No item in active slot."); return; }
  switch(name){
    case "EMF":{
      if(nearGhost(4) && Math.random()<0.6){ addEvidence("EMF Level 5"); }
      else { logMsg("EMF crackles, but nothing conclusive."); }
    } break;
    case "Thermometer":{
      if(nearGhost(5) && Math.random()<0.55){ addEvidence("Freezing Temps"); }
      else { logMsg("The air feels cooler, but not freezing."); }
    } break;
    case "Spirit Box":{
      if(nearGhost(4) && Math.random()<0.5){
        sfx.spiritbox.play(); setTimeout(()=>sfx.whisper.play(), 400);
        addEvidence("Spirit Box");
      }else{
        sfx.spiritbox.play(); logMsg("Static and whispers, no clear response.");
      }
    } break;
    case "UV Light":{
      if(Math.random()<0.4){ addEvidence("Fingerprints"); }
      else { logMsg("No visible prints right now."); }
    } break;
    case "D.O.T.S":{
      // Place a sensor at current spot
      const pos = camera.position.clone();
      placedDOTS.push(pos);
      logMsg("Placed D.O.T.S sensor.");
    } break;
    case "Camera":{
      // If orbsPS is emitting (near ghost), chance to record "Orbs"
      if(orbsPS && orbsPS.emitRate>0 && nearGhost(6) && Math.random()<0.7){
        addEvidence("Orbs");
        logMsg("Captured a strange anomaly on camera.");
      }else{
        logMsg("Photo taken. Nothing unusual.");
      }
    } break;
    case "Ghost Writing Book":{
      if(!placedBook){
        placedBook = { pos: camera.position.clone(), time: performance.now()+ (3000 + Math.random()*5000) };
        logMsg("Placed the writing book.");
      }else{
        logMsg("Book already placed.");
      }
    } break;
    case "Salt":{
      logMsg("Poured a line of salt.");
    } break;
    case "Smudge":{
      logMsg("Burned a smudge stick. The air feels lighter.");
    } break;
    case "Motion Sensor":{
      logMsg("Mounted a motion sensor.");
    } break;
    case "Lighter":{
      logMsg("Lighter flicks on.");
    } break;
    case "Notebook":{
      toggleNotebook(true);
    } break;
    default:
      logMsg("Used "+name+".");
  }
}

/* Periodic evidence pass: D.O.T.S trigger near ghost; ghost writing completion */
function evidenceTick(){
  // D.O.T.S
  if(placedDOTS.length && ghostNode){
    const triggered = placedDOTS.some(p => BABYLON.Vector3.Distance(p, ghostNode.position)<4.0);
    if(triggered && Math.random()<0.12){ addEvidence("D.O.T.S"); }
  }
  // Writing
  if(placedBook){
    if(performance.now() >= placedBook.time && ghostNode && BABYLON.Vector3.Distance(placedBook.pos, ghostNode.position)<5){
      addEvidence("Ghost Writing");
      sfx.write.play();
      placedBook=null;
    }
  }
}

/* ==========================================================
   INPUT
   ========================================================== */
let _running = false;
function wireInput(){
  // Keyboard
  window.addEventListener('keydown', (e)=>{
    if(e.code==="ShiftLeft" || e.code==="ShiftRight"){
      _running = true; camera.speed = 0.9;
    }
    // Slots 1..5
    if(e.code==="Digit1") selectSlot(1);
    if(e.code==="Digit2") selectSlot(2);
    if(e.code==="Digit3") selectSlot(3);
    if(e.code==="Digit4") selectSlot(4);
    if(e.code==="Digit5") { selectSlot(5); toggleNotebook(true); }
    // Use item
    if(e.code==="KeyE"){ useActiveItem(); tryInteract(); }
    // ESC → Dev modal
    if(e.code==="Escape"){ openDevModal(); }
    // Fly (only when dev + enabled)
    if(devMode && devFly){
      if(e.code==="PageUp"){ camera.position.y += 0.5; }
      if(e.code==="PageDown"){ camera.position.y -= 0.5; }
    }
  });
  window.addEventListener('keyup', (e)=>{
    if(e.code==="ShiftLeft" || e.code==="ShiftRight"){
      _running = false; camera.speed = 0.35;
    }
  });

  // Each frame:
  scene.onBeforeRenderObservable.add(()=>{
    updateDoorPrompt();
  });

  // Evidence background checks
  setInterval(evidenceTick, 750);
}

function tryInteract(){
  // door
  const d = doorNearPlayer();
  if(d){ toggleDoor(d); }
}

function updateTopHUD(){
  hudSanity.textContent = sanity|0;
  const room = currentRoomName();
  hudRoom.textContent = room;

function currentRoomName(){
  // Divide BARRIER AABB into grid areas; placeholder names
  let minX=+Infinity,maxX=-Infinity,minZ=+Infinity,maxZ=-Infinity;
  BARRIER.forEach(v=>{minX=Math.min(minX,v.x);maxX=Math.max(maxX,v.x);minZ=Math.min(minZ,v.z);maxZ=Math.max(maxZ,v.z);});
  const nx=3, nz=3;
  const cw=(maxX-minX)/nx, ch=(maxZ-minZ)/nz;
  const x=camera.position.x, z=camera.position.z;
  const ix=Math.max(0,Math.min(nx-1, Math.floor((x-minX)/cw)));
  const iz=Math.max(0,Math.min(nz-1, Math.floor((z-minZ)/ch)));
  const names = [
    ["Van","Foyer","Kitchen"],
    ["Basement","Living Room","Bathroom"],
    ["Garage","Bedroom","Storage"]
  ];
  return names[iz][ix];
}

}
