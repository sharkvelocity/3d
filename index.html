<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney — Web Build</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="Shark-Blades" />
  <meta name="description" content="3D ghost-hunting prototype built on Babylon.js" />

  <!-- Inline styles -->
  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; font-family:system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Helvetica, Arial, sans-serif; color:#0ff; }
    #renderCanvas { width:100vw; height:100vh; touch-action:none; display:block; }
    /* HUD: top-left */
    #hud {
      position:fixed; top:10px; left:10px; z-index:20; color:#0ff; background:rgba(0,0,0,.45);
      border:1px solid #0ff; border-radius:8px; padding:8px 10px; min-width:260px; backdrop-filter: blur(3px);
      box-shadow:0 0 10px rgba(0,255,255,.25) inset;
    }
    #hud .row { display:flex; align-items:center; gap:8px; margin:4px 0; flex-wrap:wrap; }
    .badge { padding:2px 6px; border:1px solid #0ff; border-radius:6px; }
    .meter { position:relative; height:8px; background:#033; border:1px solid #0ff; border-radius:4px; width:160px; }
    .meter>span { display:block; height:100%; background:#0ff; width:100%; }
    /* Weather */
    #weather { font-size:.9rem; opacity:.9; }

    /* Items belt (bottom-center) */
    #belt {
      position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
      display:flex; gap:10px; z-index:22; background:rgba(0,0,0,.5); padding:8px 10px;
      border:1px solid #0ff; border-radius:12px; backdrop-filter: blur(3px);
    }
    .slot {
      width:72px; height:72px; border:1px dashed #0aa; border-radius:8px; display:flex; align-items:center; justify-content:center; position:relative;
      color:#0ff; font-size:.8rem; user-select:none;
    }
    .slot.active { outline:2px solid #0ff; box-shadow:0 0 10px #0ff inset; }
    .slot .key {
      position:absolute; top:-8px; left:-8px; width:20px; height:20px; display:grid; place-items:center;
      color:#021; background:#0ff; border-radius:50%; font-weight:700; font-size:.7rem; border:1px solid #033;
    }
    .slot .label { position:absolute; bottom:-18px; left:50%; transform:translateX(-50%); font-size:.7rem; color:#7ff; }

    /* Active hand prop (small, right side) */
    #hand {
      position:fixed; right:18px; bottom:108px; width:160px; height:120px; z-index:21;
      pointer-events:none; opacity:.9; display:flex; align-items:center; justify-content:center;
      border-radius:10px; border:1px solid rgba(0,255,255,.2); background:linear-gradient(180deg, rgba(0,0,0,.0), rgba(0,0,0,.5));
    }
    #hand .hint { position:absolute; bottom:6px; right:8px; font-size:.75rem; color:#8ff; opacity:.8; }

    /* Storage button (van zone only) */
    #storageBtn {
      position:fixed; right:18px; top:18px; z-index:25;
      background:#111; color:#0ff; border:1px solid #0ff; border-radius:8px; padding:10px 14px; cursor:pointer;
      display:none;
    }

    /* Developer options */
    #devPrompt, #devPanel {
      position:fixed; inset:0; display:none; z-index:40; align-items:center; justify-content:center; background:rgba(0,0,0,.6);
    }
    .modal {
      width:min(560px, 92vw); background:#0a0f10; border:1px solid #0ff; box-shadow:0 0 18px rgba(0,255,255,.25);
      border-radius:12px; padding:16px; color:#9ef; font-family:monospace;
    }
    .modal h3 { margin:0 0 8px 0; color:#0ff; }
    .modal .row { margin:8px 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .modal input[type="password"] { background:#000; border:1px solid #0ff; color:#0ff; padding:6px 8px; border-radius:6px; width:220px; }
    .modal button { background:#000; color:#0ff; border:1px solid #0ff; border-radius:8px; padding:8px 12px; cursor:pointer; }
    .modal .log { background:#000; border:1px solid #044; min-height:100px; padding:8px; border-radius:6px; color:#aff; font-size:.85rem; overflow:auto; max-height:38vh; }

    /* Start screen */
    #start {
      position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; gap:18px;
      align-items:center; justify-content:center; background:linear-gradient(180deg, rgba(0,0,0,.65), rgba(0,0,0,.85));
      pointer-events:auto;
    }
    #start .logo {
      width:min(560px, 80vw); height:180px; background:url("./logo.jpg") center/contain no-repeat; filter:drop-shadow(0 0 8px rgba(0,255,255,.2));
    }
    #start button {
      padding:14px 26px; font-size:20px; border-radius:10px; border:1px solid #0ff; color:#0ff; background:#111; cursor:pointer; z-index:51;
    }

    /* Onscreen stick (touch) */
    #stick {
      position:fixed; left:16px; bottom:16px; width:120px; height:120px; border-radius:50%; border:1px solid #066; background:rgba(0,0,0,.3);
      display:none; z-index:26;
    }
    #stick .dot {
      position:absolute; width:48px; height:48px; border-radius:50%; border:1px solid #0ff; background:#001e1e; left:36px; top:36px;
    }

    /* Flash overlay (lightning) */
    #flash { position:fixed; inset:0; background:white; opacity:0; pointer-events:none; z-index:30; transition:opacity 120ms linear; }

    /* Debug toast bottom-left */
    #toast {
      position:fixed; left:10px; bottom:10px; background:rgba(0,0,0,.55); border:1px solid #044; color:#9ef; padding:6px 10px; border-radius:8px; font-family:monospace; font-size:.85rem; z-index:24; max-width:50vw;
    }
  </style>
</head>
<body>
<button id="devOpenBtn" class="btn" style="position:fixed;top:10px;right:10px;z-index:55;opacity:.6;">DEV</button>

  <canvas id="renderCanvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="row" id="weather">Weather: —</div>
    <div class="row">Room: <span id="roomName" class="badge">—</span></div>
    <div class="row" style="gap:10px;">
      Sanity:
      <div class="meter"><span id="sanityFill" style="width:100%"></span></div>
      <span id="sanityPct">100%</span>
    </div>
  </div>

  <!-- Items belt -->
  <div id="belt"></div>

  <!-- Hand prop viewport -->
  <div id="hand"><span class="hint">1-5 slots • Click/Tap to use</span></div>

  <!-- Storage button (visible only in van zone) -->
  <button id="storageBtn">STORAGE</button>

  <!-- Dev prompt (ESC) -->
  <div id="devPrompt">
    <div class="modal" style="max-height:90vh; overflow:auto;">
      <h3>Enable Developer Options?</h3>
      <div class="row">
        <button id="devYes">Yes</button>
        <button id="devNo">No</button>
      </div>
      <div id="devPwRow" class="row" style="display:none;">
        <label>Password:&nbsp;<input id="devPw" type="password" placeholder="••••••"></label>
        <button id="devPwOk">Enable</button>
        <div id="devPwMsg" style="color:#f88;"></div>
      </div>
    </div>
  </div>

  <!-- Dev panel -->
  <div id="devPanel">
    <div class="modal">
      <h3>Developer Options</h3>
      <div class="row">
        <button id="teleGhost">Teleport to Ghost</button>
        <button id="toggleGod">God Mode: OFF</button>
        <button id="pingHere">Ping XYZ</button>
        <button id="closeDev">Close</button>
      </div>
      <div class="row" style="gap:12px;">
        <button id="flyPg" title="Enable PageUp/PageDown fly only in dev">Toggle Fly: OFF</button>
        <span style="opacity:.8;">(PageUp/PageDown move vertically while ON)</span>
      </div>
      <div class="log" id="devLog"></div>
    </div>
  </div>

  <!-- Start overlay -->
  <div id="start">
    <div class="logo" aria-label="PhasmaPhoney"></div>
    <button id="startBtn">Start Investigation</button>
  </div>

  <!-- Touch stick -->
  <div id="stick"><div class="dot"></div></div>

  <!-- Lightning flash -->
  <div id="flash"></div>

  <!-- Debug toast -->
  <div id="toast" style="display:none;"></div>

  <!-- Babylon and loaders -->
  <script src="./cdn/babylon.js"></script>

  <script>
    (function(){
      function showOverlay(msg){
        var d=document.createElement('div');
        d.id='babylonDiag';
        d.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.86);color:#0ff;font:14px/1.4 monospace;padding:16px;overflow:auto;';
        d.innerHTML='<div style="max-width:900px;margin:0 auto;"><h2 style="margin:0 0 8px 0;color:#0ff;">Babylon Loader Diagnostic</h2><pre style="white-space:pre-wrap">'+msg+'</pre><button id="babylonDiagClose" style="margin-top:10px;background:#001;border:1px solid #0ff;color:#0ff;padding:6px 10px;border-radius:8px;cursor:pointer;">Close</button></div>';
        document.body.appendChild(d);
        document.getElementById('babylonDiagClose').onclick=function(){ d.remove(); };
      }
      // Surface uncaught errors
      window.addEventListener('error', function(e){
        try{
          var m='Uncaught error: '+(e.message||'')+'\nSource: '+(e.filename||'')+':'+(e.lineno||'')+':'+(e.colno||'')+
                (e.error && e.error.stack ? '\n\nStack:\n'+e.error.stack : '');
          if(!document.getElementById('babylonDiag')) showOverlay(m);
        }catch(_){}
      });

      function ok(){ return !!(window.BABYLON && BABYLON.Engine); }

      function tryFallback(){
        var tag = document.querySelector('script[src$="cdn/babylon.js"],script[src$="cdn/babylon.js?"]') ||
                  document.querySelector('script[src*="babylon.js"]');
        if(!tag){ showOverlay('Could not find <script src="./cdn/babylon.js"> tag in DOM.'); return; }
        var alt='./cdn/babylon.max.js';
        var s=document.createElement('script');
        s.src=alt; s.onload=function(){
          if(ok()){ console.log('[Babylon] Fallback loaded:', alt); }
          else { showOverlay('Tried fallback '+alt+' but BABYLON is still undefined. Check /cdn path or file names.'); }
        };
        s.onerror=function(){
          showOverlay('Failed to load '+alt+' too. Verify files exist.'); 
        };
        console.warn('[Babylon] Primary failed, trying fallback:', alt);
        tag.insertAdjacentElement('afterend', s);
      }

      // Early check a tick after current scripts
      setTimeout(function(){
        if(ok()) return;
        // If primary didn't set BABYLON, fallback
        tryFallback();
        // Re-check after a moment
        setTimeout(function(){
          if(!ok()){
            showOverlay('BABYLON is undefined after trying fallbacks.\n' +
              'Checked: ./cdn/babylon.js then ./cdn/babylon.max.js\n' +
              'Make sure your /cdn folder is next to index.html and names match case exactly.');
          }
        }, 800);
      }, 50);
    })();
  </script>

  <script src="./cdn/earcut.min.js"></script>
  <script src="./cdn/meshopt_decoder.js"></script>
  <script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
  <script src="./cdn/gui/babylon.gui.min.js"></script>

  <script>
    /***************
     * UTILITIES
     ***************/
    const $ = (id)=>document.getElementById(id);
    function toast(msg, ms=1800){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms); }
    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
    const deg = (r)=>r*180/Math.PI; const rad = (d)=>d*Math.PI/180;

    /***************
     * CORE STATE
     ***************/
    const game = {
      scene:null, engine:null, camera:null,
      playerCapsule:null, handPivot:null,
      ghost:null, ghostPivot:null, ghostAnim:{ idle:null, walk:null, state:'idle' },
      activeIndex:0, // 0..4 => 1..5 keys
      items: [ 'EMF', 'Spirit Box', 'Thermometer', 'Lighter', 'Notebook' ], // 4=Lighter, 5=Notebook reserved
      have: new Set(['EMF','Spirit Box','Thermometer','Lighter','Notebook']),
      sanity:100,
      running:false, flyDev:false, god:false,
      inVan:false, weather:'Clear',
      beltslots:[], handModel:null,
      house:null, floors:[], doors:[], vanZone:{ center:new BABYLON.Vector3(38.0,0.2,-98.0), radius:8.0 },
      boundary:[ // user-provided PING loop (rough wall perimeter)
        new BABYLON.Vector3(18.404, -0.016, -96.040),
        new BABYLON.Vector3(57.205, -0.718, -94.031),
        new BABYLON.Vector3(62.145, -0.651, -105.142),
        new BABYLON.Vector3(61.872,  1.165, -149.928),
        new BABYLON.Vector3(18.660,  1.165, -149.900),
        new BABYLON.Vector3(18.404, -0.016, -96.040)
      ],
      spawnPointA: new BABYLON.Vector3(38.0, 0.3, -98.0), // Van area — safe spawn
      ghostArea: null, // computed from boundary
      lastGroundY: 0,
      keys:{}, touch:{active:false, dx:0, dy:0},
      useCooldown:false
    };

    /***************
     * EVIDENCE / GHOSTS
     ***************/
    const evidenceTypes = ["EMF Level 5","Spirit Box","Fingerprints","Ghost Writing","Freezing Temps","D.O.T.S","Orbs"];
    const ghostProfiles = {
      spirit:{ evidence:["Spirit Box","Ghost Writing","EMF Level 5"] },
      wraith:{ evidence:["Spirit Box","D.O.T.S","EMF Level 5"] },
      poltergeist:{ evidence:["Spirit Box","Ghost Writing","Fingerprints"] },
      banshee:{ evidence:["D.O.TS","Fingerprints","Orbs"] },
      jinn:{ evidence:["EMF Level 5","Freezing Temps","Fingerprints"] },
      mare:{ evidence:["Spirit Box","Ghost Writing","Orbs"] },
      revenant:{ evidence:["Ghost Writing","Orbs","Freezing Temps"] },
      shade:{ evidence:["Ghost Writing","Freezing Temps","EMF Level 5"] },
      demon:{ evidence:["Freezing Temps","Ghost Writing","Fingerprints"] },
      yurei:{ evidence:["Freezing Temps","D.O.T.S","Orbs"] },
      oni:{ evidence:["EMF Level 5","Freezing Temps","D.O.T.S"] },
      yokai:{ evidence:["Spirit Box","D.O.T.S","Orbs"] },
      hantu:{ evidence:["Freezing Temps","Ghost Writing","Fingerprints"] },
      goryo:{ evidence:["EMF Level 5","D.O.T.S","Fingerprints"] },
      myling:{ evidence:["Ghost Writing","EMF Level 5","Fingerprints"] },
      onryo:{ evidence:["Freezing Temps","Spirit Box","Orbs"] },
      "the twins":{ evidence:["Spirit Box","Freezing Temps","EMF Level 5"] },
      raiju:{ evidence:["EMF Level 5","D.O.T.S","Orbs"] },
      obake:{ evidence:["EMF Level 5","Orbs","Fingerprints"] },
      "the mimic":{ evidence:["Spirit Box","Freezing Temps","Fingerprints"] },
      moroi:{ evidence:["Freezing Temps","Ghost Writing","Spirit Box"] },
      deogen:{ evidence:["Spirit Box","Ghost Writing","D.O.T.S"] },
      thaye:{ evidence:["Ghost Writing","Orbs","D.O.T.S"] },
      phantom:{ evidence:["Spirit Box","D.O.T.S","Fingerprints"] },
      succubus:{ evidence:["Ghost Writing","Orbs","Spirit Box"] }
    };
Object.freeze(ghostProfiles);
if (Object.keys(ghostProfiles).length !== 25) { throw new Error('Ghost profile count mismatch: expected 25'); }


    /***************
     * ENGINE / SCENE
     ***************/
    const canvas = $('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true, antialias:true });
    game.engine = engine;
    const scene = new BABYLON.Scene(engine);
    game.scene = scene;
    scene.collisionsEnabled = true;
    scene.gravity = new BABYLON.Vector3(0, -0.18, 0);

    // Camera
    const camera = new BABYLON.FreeCamera("playerCam", new BABYLON.Vector3(0, 1.6, 0), scene);
    camera.minZ = 0.05;
    camera.maxZ = 10000;
    camera.attachControl(canvas, true);
    camera.inertia = 0.6;
    camera.angularSensibility = 2500; // slower look on mouse
    camera.checkCollisions = true;
    camera.applyGravity = true;
    camera.ellipsoid = new BABYLON.Vector3(0.4, 0.9, 0.4);
    game.camera = camera;

    // Player capsule (invisible controller mesh)
    const playerCapsule = BABYLON.MeshBuilder.CreateCapsule("playerCapsule", { height:1.8, radius:0.4, tessellation:12 }, scene);
    playerCapsule.isVisible = false;
    playerCapsule.isPickable = false; // IMPORTANT: prevent self-hit by ground ray
    playerCapsule.checkCollisions = true;
    playerCapsule.ellipsoid = new BABYLON.Vector3(0.4, 0.9, 0.4);
    playerCapsule.ellipsoidOffset = new BABYLON.Vector3(0, 0.9, 0);
    game.playerCapsule = playerCapsule;

    // Player "hand" pivot for HUD model (unparented to camera; we'll render to a layer)
    const handPivot = new BABYLON.TransformNode("handPivot", scene);
    game.handPivot = handPivot;

    // Lights
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
    hemi.intensity = 0.7;

    // Night directional (moon) + lightning point flash
    const moon = new BABYLON.DirectionalLight("moon", new BABYLON.Vector3(-0.6,-1,-0.2), scene);
    moon.intensity = 0.35;
    const lightning = new BABYLON.PointLight("flashPoint", new BABYLON.Vector3(40, 40, -120), scene);
    lightning.intensity = 0.0;

    // UI wiring
    const belt = $('belt'); const hand = $('hand'); const storageBtn = $('storageBtn'); const devOpenBtn = $('devOpenBtn');
    const sanityFill = $('sanityFill'); const sanityPct = $('sanityPct'); const roomNameEl = $('roomName');

    // Safety ground (in case map isn't ready yet)
    const safetyGround = BABYLON.MeshBuilder.CreateGround("safety", { width:400, height:400 }, scene);
    safetyGround.position.y = -0.05; // a little lower so real floor wins
    safetyGround.checkCollisions = true;
    safetyGround.isPickable = true;

    /***************
     * START UI / INPUT
     ***************/
    $('startBtn').onclick = async () => {
      $('start').style.display = 'none';
      await startGame();
    };

    // Dev prompt via ESC
    window.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape'){
        if(!dev.enabled && $('devPrompt').style.display!=='flex'){ $('devPrompt').style.display='flex'; }
        else if(dev.enabled){ $('devPanel').style.display = ($('devPanel').style.display==='flex'?'none':'flex'); }
      }
      // Slots 1..5
      if(typeof e.key==='string' && e.key>='1' && e.key<='5'){ selectSlot(parseInt(e.key)-1); }
      // run
      if(e.key==='Shift'){ game.running = true; }
      // open door
      const __kr = (typeof e.key==='string'? e.key : (typeof e.code==='string'? e.code : ''));
      const __kl = String(__kr).toLowerCase();
      if(__kl==='e'){ tryToggleNearestDoor(); }
      // dev fly vertical
      if(game.flyDev){
        if(e.key==='PageUp'){ playerCapsule.position.y += 0.3; }
        if(e.key==='PageDown'){ playerCapsule.position.y -= 0.3; }
      }
    });
    window.addEventListener('keyup', (e)=>{ if(e && e.key==='Shift'){ game.running=false; } });

    // Onscreen stick (touch)
    const stick = $('stick'); const dot = stick.querySelector('.dot');
    function enableTouchStick(){
      stick.style.display='block';
      stick.addEventListener('touchstart', (ev)=>{ ev.preventDefault(); game.touch.active=true; }, {passive:false});
      stick.addEventListener('touchend',   (ev)=>{ ev.preventDefault(); game.touch.active=false; game.touch.dx=0; game.touch.dy=0; dot.style.left='36px'; dot.style.top='36px'; }, {passive:false});
      stick.addEventListener('touchmove',  (ev)=>{
        ev.preventDefault();
        const t = ev.touches[0]; const rect = stick.getBoundingClientRect();
        const cx = rect.left + rect.width/2; const cy = rect.top + rect.height/2;
        let dx = (t.clientX - cx); let dy = (t.clientY - cy);
        const m = Math.hypot(dx, dy); const r = 42; // radius for knob
        if(m>r){ dx = dx/m*r; dy = dy/m*r; }
        dot.style.left = (36 + dx) + 'px'; dot.style.top = (36 + dy) + 'px';
        game.touch.dx = dx / r; game.touch.dy = dy / r;
      }, {passive:false});
      // tap to use
      canvas.addEventListener('touchend', (ev)=>{
        // Short tap on right half triggers use
        const w=window.innerWidth; if(ev.changedTouches && ev.changedTouches[0].clientX > w*0.6){ useActiveItem(); }
      });
    }
    if(('ontouchstart' in window)) enableTouchStick();

    // Keyboard movement
    window.addEventListener('keydown',(e)=>{ const k=String(e.key||'').toLowerCase(); if(!k||k==='unidentified'||k==='process') return; game.keys[k]=true; });
    window.addEventListener('keyup',(e)=>{ const k=String(e.key||'').toLowerCase(); if(!k) return; game.keys[k]=false; });

    canvas.addEventListener('pointerdown', ()=>{ useActiveItem(); });

    /***************
     * DEV PANEL
     ***************/
    const dev = {
      enabled:false,
      log:(s)=>{ const el=$('devLog'); el.textContent += s+'\n'; el.scrollTop = el.scrollHeight; }
    };
    $('devYes').onclick = ()=>{ $('devPwRow').style.display='flex'; };
    $('devNo').onclick  = ()=>{ $('devPrompt').style.display='none'; };
    $('devPwOk').onclick = ()=>{
      const ok = ($('devPw').value.trim()==='devmode');
      if(ok){ dev.enabled=true; $('devPrompt').style.display='none'; $('devPanel').style.display='flex'; toast('Developer options enabled'); }
      else { $('devPwMsg').textContent = 'Wrong password.'; }
    };
    $('closeDev').onclick = ()=> $('devPanel').style.display='none';
    $('teleGhost').onclick = ()=>{
      if(game.ghostPivot){ playerCapsule.position.copyFrom(game.ghostPivot.position).addInPlace(new BABYLON.Vector3(0,0.1, -1.8)); syncCameraToCapsule(); dev.log(`Teleport to ghost @ ${vecStr(game.ghostPivot.position)}`); }
    };
    $('toggleGod').onclick = (e)=>{
      game.god = !game.god; e.target.textContent = 'God Mode: ' + (game.god?'ON':'OFF'); dev.log('God mode ' + (game.god?'ENABLED':'DISABLED'));
    };
    $('pingHere').onclick = ()=> { dev.log('PING @ ' + vecStr(playerCapsule.position)); };
    $('flyPg').onclick = (e)=>{ game.flyDev = !game.flyDev; e.target.textContent = 'Toggle Fly: ' + (game.flyDev?'ON':'OFF'); };

    function vecStr(v){ return `x:${v.x.toFixed(3)} y:${v.y.toFixed(3)} z:${v.z.toFixed(3)}`; }

    /***************
     * WEATHER / LIGHTNING
     ***************/
    function setWeather(kind){
      game.weather = kind;
      $('weather').textContent = 'Weather: ' + kind;
    }
    function randomWeather(){ // Choose Clear or Rain
      const r = Math.random(); return (r<0.6)?'Clear':'Rain';
    }
    function lightningFlash(){ if(window.__lightning_guard) return;
      if(game.weather!=='Rain') return;
      if(Math.random()<0.1){
        const flash = $('flash');
        lightning.intensity = 8 + Math.random()*10;
        flash.style.opacity = .5 + Math.random()*.4;
        setTimeout(()=>{ lightning.intensity = 0; flash.style.opacity = 0; }, 120 + Math.random()*200);
      }
    }
    setInterval(lightningFlash, 1200);

    /***************
     * STORAGE BUTTON (van zone)
     ***************/
    storageBtn.onclick = ()=>{
      toast('Storage opened (prototype). Pick/Trade items here.');
      // TODO: implement actual inventory exchange UI
    };

    /***************
     * MODELS
     ***************/
    async function loadHouse(){
      const result = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/map/", "Abandoned_House.glb", scene);
      const root = result.meshes[0];
      root.name = "Abandoned_House";
      game.house = root;

      // Make house meshes collidable except obviously transparent decorations
      result.meshes.forEach(m=>{
        if(m === root) return;
        // Heuristic: disable collisions for transparent materials / obvious small props
        const mat = m.material;
        const transparent = !!mat && (mat.alpha < .8 || mat.transparencyMode>0);
        const isSmall = (m.getBoundingInfo?.().boundingBox.extendSizeWorld.length() || 1) < 0.2;
        if(transparent || isSmall || /glass|leaf|foliage|trash|paper|cloth/i.test(m.name)){
          m.checkCollisions = false;
        } else {
          m.checkCollisions = true;
        }
        m.isPickable = true;
        // Floors detection (rough: horizontal & large)
        const info = m.getBoundingInfo?.();
        if(info){
          const e = info.boundingBox.extendSizeWorld;
          const flat = (e.y < 0.2 && (e.x>1.5 || e.z>1.5));
          if(flat){ game.floors.push(m); }
        }
        // Door guess by name
        if(/door/i.test(m.name)){
          game.doors.push(m);
          // Allow opening: start closed, collisions on
          m.metadata = { open:false, baseRotY:m.rotation?.y||0 };
        }
      });

      // If no detected floors, keep safety ground
      if(game.floors.length===0){
        toast('Warning: no floor meshes detected; safety ground remains active.');
      } else {
        // Keep safety ground but lower it a bit more as fallback
        safetyGround.position.y = -0.2;
      }
    }

    // Items/hand models from exploration_objects.glb
    const itemModelMap = {
      'EMF': 'EMF_Detector_EMF_Detector_0',
      'Spirit Box': 'Cone.001_Spirit_Box_0',
      'Thermometer': 'Thermometer_Thermometer_0',
      'Photo Camera': 'Photo_Camera_Photo_Camera_0',
      'Flashlight': 'Flashlight_Flashlight_0',
      'Thermal Camera': 'Thermal_Camera_Thermal_Camera_0',
      'Voice Recorder': 'Voice_Recorder_Voice_Recorder_0'
    };
    let itemLibraryRoot=null;

    async function loadItems(){
      const res = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/items/", "exploration_objects.glb", scene);
      itemLibraryRoot = res.meshes[0];
      itemLibraryRoot.setEnabled(false);
      res.meshes.forEach(m=>{ m.isPickable=false; m.checkCollisions=false; });

      // Prepare belt slots
      rebuildBelt();
      // Set default hand model
      updateHandModel();
    }

    function rebuildBelt(){
      belt.innerHTML='';
      const labels = ['EMF','Spirit Box','Thermometer','Lighter','Notebook'];
      game.beltslots = [];
      for(let i=0;i<5;i++){
        const el = document.createElement('div');
        el.className = 'slot' + (i===game.activeIndex?' active':'');
        el.innerHTML = `<div class="key">${i+1}</div><div class="label">${labels[i]}</div>`;
        el.onclick = ()=>selectSlot(i);
        belt.appendChild(el); game.beltslots.push(el);
      }
    }
    function selectSlot(i){
      game.activeIndex = clamp(i,0,4);
      game.beltslots.forEach((el,idx)=>{ if(idx===game.activeIndex) el.classList.add('active'); else el.classList.remove('active'); });
      updateHandModel();
    }

    function findItemMesh(name){
      if(!itemLibraryRoot) return null;
      const targetName = itemModelMap[name] || null;
      if(!targetName) return null;
      const mesh = scene.getMeshByName(targetName) || scene.getTransformNodeByName(targetName);
      return mesh||null;
    }

    function updateHandModel(){
      if(game.handModel){ game.handModel.setEnabled(false); game.handModel = null; }
      const labels = ['EMF','Spirit Box','Thermometer','Lighter','Notebook'];
      const name = labels[game.activeIndex];
      if(name==='Notebook'){ hand.style.opacity=.85; hand.querySelector('.hint').textContent='Notebook (5): open/close'; return; }
      const src = findItemMesh(name==='Lighter'?'Flashlight':name);
      if(!src){ hand.style.opacity=.2; return; }
      const node = src.clone(name+'_hand');
      node.setEnabled(true);
      node.position = new BABYLON.Vector3(0,0,0);
      // Place in a corner overlay using a utility layer renderer
      if(!game.handLayer){
        game.handLayer = new BABYLON.UtilityLayerRenderer(scene, false);
        game.handLayer.utilityLayerScene.autoClear = true;
        game.handLayer.utilityLayerScene.clearColor = new BABYLON.Color4(0,0,0,0);
      }
      // Parent to a tiny camera in utility scene to render on a dynamic texture -> but simpler:
      // We'll just keep it in main scene near camera and exclude from collisions
      node.parent = game.camera;
      node.position = new BABYLON.Vector3(0.4, -0.35, 0.8);
      node.scaling = new BABYLON.Vector3(0.4,0.4,0.4);
      // Upright fix (items sometimes imported sideways/upside-down)
      node.rotation = new BABYLON.Vector3(rad(-90), 0, 0); // Z-up to Y-up
      // For flashlight as "lighter", a bit smaller
      if(name==='Lighter'){ node.scaling.scaleInPlace(0.7); }
      game.handModel = node;
    }

    /***************
     * GHOST
     ***************/
    function randomPointInBoundary(){
      // Simple polygon bounding box sampling until inside
      const pts = game.boundary;
      let minX=Infinity, maxX=-Infinity, minZ=Infinity, maxZ=-Infinity, y=pts[0].y;
      pts.forEach(p=>{ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minZ=Math.min(minZ,p.z); maxZ=Math.max(maxZ,p.z); });
      for(let tries=0; tries<200; tries++){
        const x = minX + Math.random()*(maxX-minX);
        const z = minZ + Math.random()*(maxZ-minZ);
        if(pointInPolyXZ(x,z, pts)) return new BABYLON.Vector3(x, y, z);
      }
      return new BABYLON.Vector3( (minX+maxX)/2, y, (minZ+maxZ)/2 );
    }
    function pointInPolyXZ(x,z, poly){
      // ray casting in XZ
      let inside=false;
      for(let i=0,j=poly.length-1;i<poly.length;j=i++){
        const xi=poly[i].x, zi=poly[i].z;
        const xj=poly[j].x, zj=poly[j].z;
        const intersect = ((zi>z)!==(zj>z)) && (x < (xj - xi) * (z - zi) / (zj - zi) + xi);
        if(intersect) inside = !inside;
      }
      return inside;
    }

    async function spawnGhost(){
      // Load one of the ghost GLBs at random scale fix
      const pool = ['ghost1.glb','ghost2.glb','ghost3.glb','ghost4.glb','ghost5.glb'].filter(fn=>{
        return !!fn; // as per repo
      });
      const file = pool[Math.floor(Math.random()*pool.length)];
      const res = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/ghosts/", file, scene);
      const root = res.meshes[0];
      root.name = "GhostRoot";
      // Pivot for movement
      const pivot = new BABYLON.TransformNode("GhostPivot", scene);
      root.parent = pivot;

      // Correct orientation & scale (sideways fix)
      pivot.rotation = BABYLON.Vector3.Zero();
      root.rotation = new BABYLON.Vector3(0, rad(180), 0); // face forward – adjust as needed
      const binfo = root.getBoundingInfo();
      const size = binfo ? binfo.boundingBox.extendSizeWorld : new BABYLON.Vector3(0.5,0.5,0.5);
      const tallest = Math.max(1, size.y*2);
      const scale = 1.7 / tallest; // normalize to ~1.7m tall
      root.scaling = new BABYLON.Vector3(scale, scale, scale);

      pivot.position = randomPointInBoundary();
      game.ghost = root;
      game.ghostPivot = pivot;

      // Walk/idle basic animation state (if clips exist)
      let idle = null, walk = null;
      if(res.animationGroups && res.animationGroups.length){
        // pick 1st as idle, 2nd as walk if present
        idle = res.animationGroups[0]||null;
        walk = res.animationGroups[1]||null;
        if(idle){ idle.start(true); }
      }
      game.ghostAnim.idle = idle; game.ghostAnim.walk = walk; game.ghostAnim.state = 'idle';
    }

    function setGhostAnim(state){
      if(game.ghostAnim.state===state) return;
      game.ghostAnim.state = state;
      if(game.ghostAnim.idle) game.ghostAnim.idle.stop();
      if(game.ghostAnim.walk) game.ghostAnim.walk.stop();
      if(state==='walk' && game.ghostAnim.walk) game.ghostAnim.walk.start(true);
      if(state==='idle' && game.ghostAnim.idle) game.ghostAnim.idle.start(true);
    }

    /***************
     * MOVEMENT & GROUND SNAP — FIXED
     ***************/
    function inputVector(){
      // WASD + touch stick
      let x=0, z=0;
      if(game.keys['w']) z += 1;
      if(game.keys['s']) z -= 1;
      if(game.keys['a']) x -= 1;
      if(game.keys['d']) x += 1;
      // touch
      if(game.touch.active){
        z += game.touch.dy; x += game.touch.dx;
      }
      // normalize
      const len = Math.hypot(x,z);
      if(len>1e-3){ x/=len; z/=len; }
      return {x,z};
    }

    function movePlayer(dt){
      const speed = (game.running? 3.2 : 1.8); // m/s
      const move = inputVector();
      if(move.x===0 && move.z===0) return;

      // camera forward (on ground plane)
      const forward = game.camera.getDirection(BABYLON.Axis.Z);
      const right = game.camera.getDirection(BABYLON.Axis.X);
      const dir = new BABYLON.Vector3(
        right.x*move.x + forward.x*move.z,
        0,
        right.z*move.x + forward.z*move.z
      ).normalize();

      const step = dir.scale(speed * dt);
      playerCapsule.moveWithCollisions(step);
      syncCameraToCapsule();
    }

    function syncCameraToCapsule(){
      const off = new BABYLON.Vector3(0, 0.7, 0);
      camera.position.copyFrom(playerCapsule.position.add(off));
    }

    // *** CRITICAL FIX: below-only, multi-pick ground snap (prevents "falling up") ***
    function snapToGround(){
      // Cast a short ray from just above player downward.
      const origin = playerCapsule.position.add(new BABYLON.Vector3(0, 0.5, 0));
      const ray = new BABYLON.Ray(origin, new BABYLON.Vector3(0,-1,0), 6.0);

      // Multi-pick to choose best candidate beneath us. Ignore self.
      const hits = scene.multiPickWithRay(ray, (m) => m !== playerCapsule && m.checkCollisions === true);

      if (!hits || !hits.length) return;

      const curY = playerCapsule.position.y;
      let best = null; let bestDy = Infinity;

      for (const h of hits){
        if (!h.hit || !h.pickedPoint) continue;
        const y = h.pickedPoint.y;
        // Only consider surfaces at/below our current position (ignore ceilings/beams above)
        if (y <= curY + 0.01){
          const dy = origin.y - y;
          if (dy >= 0 && dy < bestDy){ best = h; bestDy = dy; }
        }
      }

      if (!best) return;

      const desiredY = best.pickedPoint.y + playerCapsule.ellipsoidOffset.y;
      // Only lift if actually below ground (avoid being pulled up to ceiling)
      if (curY < desiredY - 0.05){
        playerCapsule.position.y = desiredY;
      }
      // Save last ground Y for minor step up continuity
      game.lastGroundY = best.pickedPoint.y;
    }

    // Ghost ground keep (same fix idea)
    function snapGhostToGround(){
      if(!game.ghostPivot) return;
      const pivot = game.ghostPivot;
      const origin = pivot.position.add(new BABYLON.Vector3(0, 2, 0));
      const ray = new BABYLON.Ray(origin, new BABYLON.Vector3(0,-1,0), 8.0);
      const hits = scene.multiPickWithRay(ray, (m)=> m !== game.ghost && m.checkCollisions===true);
      if(!hits || !hits.length) return;
      const curY = pivot.position.y;
      let best=null, bestDy = Infinity;
      for(const h of hits){
        if(!h.hit || !h.pickedPoint) continue;
        const y = h.pickedPoint.y;
        if(y <= curY + 0.01){
          const dy = origin.y - y;
          if(dy>=0 && dy<bestDy){ best=h; bestDy=dy; }
        }
      }
      if(best){
        const newY = best.pickedPoint.y + 0.05;
        if(curY < newY - 0.03) pivot.position.y = newY;
      }
    }

    /***************
     * DOORS (open on E)
     ***************/
    function tryToggleNearestDoor(){
      if(!game.doors.length) return;
      const me = playerCapsule.position;
      let nearest = null, dist2 = 4.0; // within ~2m
      game.doors.forEach(d=>{
        const p = d.getAbsolutePosition();
        const dx=p.x-me.x, dy=p.y-me.y, dz=p.z-me.z;
        const d2 = dx*dx+dy*dy+dz*dz;
        if(d2 < dist2 && d.isEnabled()){
          nearest = d; dist2 = d2;
        }
      });
      if(!nearest) { toast('No door nearby.'); return; }
      const md = nearest.metadata || (nearest.metadata={open:false, baseRotY:nearest.rotation?.y||0});
      md.open = !md.open;
      nearest.rotation.y = md.baseRotY + (md.open ? rad(90) : 0);
      nearest.checkCollisions = !md.open; // when open: walk through
      toast(md.open ? 'Door opened' : 'Door closed');
    }

    /***************
     * VAN ZONE / STORAGE
     ***************/
    function updateVanZoneButton(){
      const me = playerCapsule.position;
      const d = BABYLON.Vector3.Distance(me, game.vanZone.center);
      const inside = d <= game.vanZone.radius;
      if(inside && !game.inVan){
        game.inVan = true; storageBtn.style.display='block';
      } else if(!inside && game.inVan){
        game.inVan = false; storageBtn.style.display='none';
      }
    }

    /***************
     * ITEMS USE
     ***************/
    function activeNameByIndex(i){
      const labels = ['EMF','Spirit Box','Thermometer','Lighter','Notebook'];
      return labels[i];
    }

    function useActiveItem(){
      if(game.useCooldown) return;
      game.useCooldown = true; setTimeout(()=>game.useCooldown=false, 250); // small debounce

      const name = activeNameByIndex(game.activeIndex);
      if(name==='Notebook'){
        toast('Notebook opened (evidence UI placeholder).');
        // TODO: show overlay with ghosts/evidence selection like 2D version
        return;
      }
      if(name==='Lighter'){
        toast('Flick lighter (placeholder).');
        // TODO: simple point-light flick near hand
        return;
      }
      if(name==='EMF'){
        // EMF check near ghost
        const near = game.ghostPivot ? BABYLON.Vector3.Distance(playerCapsule.position, game.ghostPivot.position) < 3.2 : false;
        toast(near ? 'EMF spikes! (close)' : 'EMF baseline.');
        return;
      }
      if(name==='Spirit Box'){
        // simple random whisper if in same room as ghost
        const near = game.ghostPivot ? BABYLON.Vector3.Distance(playerCapsule.position, game.ghostPivot.position) < 2.5 : false;
        toast(near ? '…a faint response comes through.' : 'Static…');
        return;
      }
      if(name==='Thermometer'){
        // colder near ghost
        const near = game.ghostPivot ? BABYLON.Vector3.Distance(playerCapsule.position, game.ghostPivot.position) < 3.5 : false;
        const t = (near? (Math.random()*2+0.0) : (Math.random()*8+8.0)).toFixed(1);
        toast(`Temp: ${t}°C`);
        return;
      }
    }

    /***************
     * ROOM NAME (stub)
     ***************/
    function updateRoomName(){
      // If house provides named rooms, pick by proximity. Placeholder: van / house
      const me = playerCapsule.position;
      const dVan = BABYLON.Vector3.Distance(me, game.vanZone.center);
      roomNameEl.textContent = dVan<=game.vanZone.radius ? 'Van' : 'House';
    }

    /***************
     * GAME LOOP
     ***************/
    async function startGame(){
      setWeather(randomWeather());

      // Spawn / position player (center of van area)
      playerCapsule.position.copyFrom(game.spawnPointA);
      syncCameraToCapsule();

      // Load content
      await loadHouse();
      await loadItems();
      await spawnGhost();

      // Scene ready
      toast('Investigation started. WASD to move, Shift to run, E to open doors. ESC: Dev panel.');

      // Render loop
      let last = performance.now();
      engine.runRenderLoop(()=>{
        const now = performance.now(); const dt = (now-last)/1000; last = now;

        // Movement
        movePlayer(dt);

        // Snap to ground (FIXED)
        snapToGround();

        // Ghost behavior: simple wander
        if(game.ghostPivot){
          // Move ghost toward player randomly / slowly
          const me = playerCapsule.position;
          const gp = game.ghostPivot.position;
          const toMe = me.subtract(gp); toMe.y=0;
          const dist = toMe.length();
          let v = new BABYLON.Vector3(0,0,0);
          if(dist>4){
            v = toMe.normalize().scale(0.8*dt);
            game.ghostPivot.position.addInPlace(v);
            // face direction
            if(v.length()>1e-4){
              const yaw = Math.atan2(v.x, v.z);
              game.ghostPivot.rotation.y = yaw;
              setGhostAnim('walk');
            }
          } else {
            setGhostAnim('idle');
          }
          // Keep ghost on ground
          snapGhostToGround();
        }

        // Sanity drain slowly (if not god)
        if(!game.god){
          game.sanity = clamp(game.sanity - 0.0025, 0, 100);
          sanityFill.style.width = `${game.sanity.toFixed(0)}%`;
          sanityPct.textContent = `${game.sanity.toFixed(0)}%`;
        }

        updateVanZoneButton();
        updateRoomName();

        scene.render();
      });
    }

    /***************
     * RESIZE
     ***************/
    window.addEventListener('resize', ()=> engine.resize());

  </script>

    (function(){
      function hydrateStartAndDev(){
        try{
          // Loadout build
          if (typeof buildLoadoutChooser === 'function') {
            var box = document.getElementById('loadoutBox');
            if (box && box.children.length === 0) buildLoadoutChooser();
          }
          // Wire Start button if not already
          var btn = document.getElementById('startBtn');
          if (btn && !btn.__wired){
            btn.addEventListener('click', async ()=>{
              document.getElementById('start').style.display='none';
              const map = document.getElementById('preMap').value;
              window.game.spawnChoice = document.getElementById('preSpawn').value;
              window.game.weather = document.getElementById('preWeather').value;
              window.game.loadout = (function(){
                const out=[]; const all=['EMF','Spirit Box','Thermometer','Lighter','Notebook','Photo Camera','Flashlight','Thermal Camera','Voice Recorder'];
                all.forEach(n=>{ var c=document.getElementById('ld_'+n.replace(/\W+/g,'_')); if(c && c.checked) out.push(n); });
                return out.slice(0,5).length? out.slice(0,5) : ['EMF','Spirit Box','Thermometer','Notebook'];
              })();
              await startGame(map);

      }
      // Add "Fix UI" quick button
      var fix = document.createElement('button');
      fix.textContent = 'Fix UI'; fix.title='Rehydrate panels';
      fix.style.cssText='position:fixed;left:10px;bottom:10px;z-index:56;background:#111;color:#0ff;border:1px solid #0ff;border-radius:8px;padding:6px 10px;opacity:.65;';

      hydrateStartAndDev();
      setTimeout(hydrateStartAndDev, 400);
      document.addEventListener('DOMContentLoaded', hydrateStartAndDev);
    })();

          var visible = getComputedStyle(st).display !== 'none';
          if(!visible) return;
          var k = (typeof ev.key==='string'?ev.key:(typeof ev.code==='string'?ev.code:''));
          if(k==='Enter' || k===' ' || k==='Spacebar'){
            ev.preventDefault();
            var btn=document.getElementById('startBtn');
            if(btn){ btn.click(); }
          }
        }catch(_){}
      });
    })();
  </script>

</body>
