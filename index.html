<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney — 3D Prototype (with Loadout + Dual Joysticks)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="author" content="Shark-Blades" />
  <meta name="description" content="3D ghost hunting prototype built with Babylon.js" />
  <meta name="keywords" content="PhasmaPhoney, Phasmophobia, ghost, hunting, game, HTML, Babylon.js" />
  <!-- Babylon core + loaders (local to repo) -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/earcut.min.js"></script>
  <script src="./cdn/meshopt_decoder.js"></script>
  <script src="./cdn/draco_decoder_gltf.js"></script>
  <script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script>
  <script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
  <script src="./cdn/gui/babylon.gui.min.js"></script>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; font-family:monospace; color:#0ff; }
    #renderCanvas { width:100%; height:100%; touch-action:none; display:block; background:#000; }
    #title-screen{ position:fixed; inset:0; background:rgba(0,0,0,0.9); display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:1000; }
    #start-button{ padding:14px 28px; font-size:20px; border:2px solid #0ff; background:#111; color:#0ff; border-radius:10px; cursor:pointer; }
    #hud{ position:fixed; top:10px; left:10px; z-index:600; background:rgba(0,0,0,0.6); padding:8px; border-radius:6px; border:1px solid #066; display:none; }
    #storage-modal{ display:none; position:fixed; inset:0; z-index:1200; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; }
    #storage-card{ background:#111; border:1px solid #0ff; border-radius:8px; padding:12px; color:#0ff; width:80%; max-width:600px; }
    #joysticks{ position:fixed; inset:0; pointer-events:none; }
    .joystick{ position:absolute; width:120px; height:120px; border-radius:50%; background:rgba(0,255,255,0.1); border:2px solid #0ff; pointer-events:auto; touch-action:none; }
    #joy-left{ bottom:20px; left:20px; }
    #joy-right{ bottom:20px; right:20px; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <!-- Title -->
  <div id="title-screen">
    <h1 style="color:#0ff;">PhasmaPhoney</h1>
    <button id="start-button">Start Investigation</button>
  </div>
  <!-- HUD -->
  <div id="hud">
    <div>Sanity: <span id="hud-sanity">100%</span></div>
    <div>Room: <span id="hud-room">Van</span></div>
  </div>
  <!-- Storage -->
  <div id="storage-modal">
    <div id="storage-card">
      <h2>Choose Your Loadout</h2>
      <div id="storage-grid"></div>
      <button id="storage-confirm">Confirm</button>
    </div>
  </div>
  <!-- Joysticks -->
  <div id="joysticks">
    <div id="joy-left" class="joystick"></div>
    <div id="joy-right" class="joystick"></div>
  </div>
<script>
window.addEventListener('DOMContentLoaded',()=>{
  const canvas=document.getElementById('renderCanvas');
  const engine=new BABYLON.Engine(canvas,true);
  const scene=new BABYLON.Scene(engine);
  const camera=new BABYLON.UniversalCamera('cam',new BABYLON.Vector3(0,2,-5),scene);
  camera.attachControl(canvas,true);
  new BABYLON.HemisphericLight('light',new BABYLON.Vector3(0,1,0),scene);
  BABYLON.MeshBuilder.CreateGround('ground',{width:50,height:50},scene);
  BABYLON.MeshBuilder.CreateBox('box',{size:2},scene).position.y=1;
  engine.runRenderLoop(()=>scene.render());

  document.getElementById('start-button').onclick=()=>{
    document.getElementById('title-screen').style.display='none';
    document.getElementById('hud').style.display='block';
    document.getElementById('storage-modal').style.display='flex';
  };
  document.getElementById('storage-confirm').onclick=()=>{
    document.getElementById('storage-modal').style.display='none';
  };

  // Simple joystick stub logic
  function joystick(id,cb){
    const joy=document.getElementById(id);
    let active=false,startX=0,startY=0;
    joy.addEventListener('pointerdown',e=>{active=true;startX=e.clientX;startY=e.clientY;});
    window.addEventListener('pointerup',()=>{active=false;cb(0,0);});
    window.addEventListener('pointermove',e=>{
      if(!active) return;
      const dx=e.clientX-startX,dy=e.clientY-startY;
      cb(dx/60,dy/60);
    });
  }
  joystick('joy-left',(x,y)=>{ camera.position.addInPlace(new BABYLON.Vector3(x*0.1,0,y*0.1)); });
  joystick('joy-right',(x,y)=>{ camera.rotation.y-=x*0.02; camera.rotation.x-=y*0.02; });
});
</script>
</body>
</html>
