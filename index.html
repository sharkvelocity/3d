<script>
// === GLOBAL VARIABLES & CONSTANTS ===
let scene, engine, currentCamera;
let fpCamera, tpCamera;
let cameraMode = "first";

const canvas = document.getElementById("renderCanvas");

// Evidence tracking
const allEvidence = ["EMF", "Spirit Box", "Fingerprints", "Orbs", "Writing", "Freezing", "D.O.T.S"];
let foundEvidence = new Set();
let eliminatedEvidence = new Set();

// Inventory
let heldItems = ["Flashlight", "Spirit Box", "Camera"];
let currentHeldIndex = 0;

// Sound
let ambientSound;
let spiritBoxSound = null;
let flashlightMesh = null;
let flashlightOn = false;
let spiritBoxActive = false;
let usingCamera = false;
</script>
<script>
// === SCENE & MODEL LOAD ===
window.addEventListener("DOMContentLoaded", async () => {
  engine = new BABYLON.Engine(canvas, true);
  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color3.Black();
  scene.collisionsEnabled = true;
  scene.gravity = new BABYLON.Vector3(0, -0.2, 0);

  // Ambient light
  const ambient = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);
  ambient.intensity = 0.5;

  // Load haunted house model
  await BABYLON.SceneLoader.AppendAsync("models/", "Abandoned_House.glb", scene);
  scene.meshes.forEach(mesh => {
    mesh.checkCollisions = true;
    mesh.isPickable = true;
    mesh.freezeWorldMatrix(); // Boost performance
  });

  setupPlayerAndCameras(scene, canvas);
  engine.runRenderLoop(() => {
    if (scene && scene.activeCamera) scene.render();
  });

  window.addEventListener("resize", () => engine.resize());
});
</script>
<script>
// === CAMERA SETUP & SWITCHING ===
let fpCamera, tpCamera, currentCamera;
let cameraMode = "first";

function setupPlayerAndCameras(scene, canvas) {
  // === First-Person Camera ===
  fpCamera = new BABYLON.UniversalCamera("fpCamera", new BABYLON.Vector3(0, 1.8, -2), scene);
  fpCamera.applyGravity = true;
  fpCamera.checkCollisions = true;
  fpCamera.ellipsoid = new BABYLON.Vector3(0.5, 1, 0.5);
  fpCamera.speed = 0.15;
  fpCamera.attachControl(canvas, true);

  // === Third-Person Camera ===
  tpCamera = new BABYLON.FollowCamera("tpCamera", fpCamera.position.clone().add(new BABYLON.Vector3(0, 5, -10)), scene);
  tpCamera.lockedTarget = fpCamera;
  tpCamera.radius = 6;
  tpCamera.heightOffset = 3;
  tpCamera.rotationOffset = 180;
  tpCamera.cameraAcceleration = 0.05;
  tpCamera.maxCameraSpeed = 10;

  // Set default camera
  currentCamera = fpCamera;
  scene.activeCamera = currentCamera;
  currentCamera.attachControl(canvas, true);
}

function toggleCameraView() {
  if (!scene) return;

  if (scene.activeCamera === fpCamera) {
    scene.activeCamera.detachControl(canvas);
    scene.activeCamera = tpCamera;
    scene.activeCamera.attachControl(canvas, true);
  } else {
    scene.activeCamera.detachControl(canvas);
    scene.activeCamera = fpCamera;
    scene.activeCamera.attachControl(canvas, true);
  }
}
</script>
<script>
// === PLAYER SETUP & MOVEMENT ===
function setupControls(scene) {
  scene.gravity = new BABYLON.Vector3(0, -0.2, 0);
  scene.collisionsEnabled = true;

  // Make all meshes collide unless excluded
  scene.meshes.forEach(mesh => {
    if (mesh.name !== "player" && !mesh.name.includes("NoCollision")) {
      mesh.checkCollisions = true;
    }
  });

  // Key controls
  window.addEventListener("keydown", (e) => {
    if (e.key === "v") toggleCameraView(); // V to switch views
    if (e.key === "q") cycleHeldItem();    // Q to cycle items
    if (e.key === "e") {
      const item = getHeldItem();
      if (item === "Flashlight") toggleFlashlight();
      if (item === "Spirit Box") toggleSpiritBox();
      if (item === "Camera") toggleCameraView();
    }
  });
}
</script>
<script>
// === INVENTORY & ITEM HANDLING ===
let heldItems = ["Flashlight", "Spirit Box", "Camera"];
let currentHeldIndex = 0;

function getHeldItem() {
  return heldItems[currentHeldIndex];
}

function cycleHeldItem() {
  currentHeldIndex = (currentHeldIndex + 1) % heldItems.length;
  updateHUDInventory();
}

function updateHUDInventory() {
  const slot = document.getElementById("hud-item-slot");
  if (slot) slot.innerText = getHeldItem();
}

// === FLASHLIGHT LOGIC ===
let flashlightMesh = null;
let flashlightOn = false;

function toggleFlashlight() {
  flashlightOn = !flashlightOn;
  if (flashlightMesh) {
    flashlightMesh.setEnabled(flashlightOn);
  }
}

// === SPIRIT BOX LOGIC ===
let spiritBoxSound = null;
let spiritBoxActive = false;

function toggleSpiritBox() {
  spiritBoxActive = !spiritBoxActive;
  if (spiritBoxActive) {
    spiritBoxSound = new BABYLON.Sound("spiritBox", "sounds/radioStatic.mp3", scene, null, {
      loop: true,
      autoplay: true,
      volume: 0.5
    });
  } else if (spiritBoxSound) {
    spiritBoxSound.stop();
    spiritBoxSound.dispose();
    spiritBoxSound = null;
  }
}

// === IR CAMERA VIEW ===
let usingCamera = false;
function toggleCameraView() {
  usingCamera = !usingCamera;
  const overlay = document.getElementById("camera-overlay");
  if (overlay) overlay.style.display = usingCamera ? "block" : "none";
}

// === CANDLE TOGGLE LOGIC ===
function toggleCandle(candleMesh) {
  const isLit = candleMesh.metadata?.isLit;
  if (isLit) {
    candleMesh.metadata.isLit = false;
    candleMesh.getChildMeshes().forEach(m => m.isVisible = false);
    playSound("candleExtinguish", candleMesh.position);
  } else {
    candleMesh.metadata = { ...candleMesh.metadata, isLit: true };
    candleMesh.getChildMeshes().forEach(m => m.isVisible = true);
    playSound("candleIgnite", candleMesh.position);
  }
}
</script>
<script>
// === EVIDENCE SYSTEM ===
const allEvidence = [
  "EMF Level 5", "Spirit Box", "Ghost Writing", "Freezing Temps",
  "Ghost Orbs", "DOTS Projector", "Fingerprints"
];

let foundEvidence = [];
let eliminatedEvidence = [];

function toggleEvidence(type, evidence) {
  if (type === "found") {
    const index = foundEvidence.indexOf(evidence);
    if (index >= 0) {
      foundEvidence.splice(index, 1);
    } else {
      if (!eliminatedEvidence.includes(evidence)) foundEvidence.push(evidence);
    }
  } else if (type === "eliminated") {
    const index = eliminatedEvidence.indexOf(evidence);
    if (index >= 0) {
      eliminatedEvidence.splice(index, 1);
    } else {
      if (!foundEvidence.includes(evidence)) eliminatedEvidence.push(evidence);
    }
  }
  updateEvidenceUI();
  updateGhostSuggestions();
}

function updateEvidenceUI() {
  allEvidence.forEach(e => {
    const foundBtn = document.querySelector(`[data-evidence="${e}"][data-type="found"]`);
    const eliminatedBtn = document.querySelector(`[data-evidence="${e}"][data-type="eliminated"]`);

    if (foundBtn) foundBtn.classList.toggle("active", foundEvidence.includes(e));
    if (eliminatedBtn) eliminatedBtn.classList.toggle("active", eliminatedEvidence.includes(e));
  });
}

function updateGhostSuggestions() {
  const possible = ghostProfiles.filter(g => {
    const ev = g.evidence;
    return foundEvidence.every(e => ev.includes(e)) &&
           eliminatedEvidence.every(e => !ev.includes(e));
  });

  const suggestionDiv = document.getElementById("ghost-suggestions");
  if (suggestionDiv) {
    suggestionDiv.innerHTML = possible.map(g => `<div>${g.name}</div>`).join("");
  }
}
</script>
<script>
// === GHOST AI & BEHAVIOR ===
let ghostEntity, ghostProfile, ghostRoom = null;
let lastRoamTime = 0;
let lastMimicChange = 0;
let currentMimicTarget = null;
let huntCooldown = 0;

function setupGhostAI() {
  ghostProfile = pickRandomGhost();
  if (ghostProfile.name === "The Mimic") {
    currentMimicTarget = pickRandomGhost("The Mimic");
  }
  assignGhostRoom();
  spawnGhostMesh();
}

function pickRandomGhost(excludeName = null) {
  const options = ghostProfiles.filter(g => g.name !== excludeName);
  return options[Math.floor(Math.random() * options.length)];
}

function assignGhostRoom() {
  const rooms = Object.keys(roomZones);
  ghostRoom = rooms[Math.floor(Math.random() * rooms.length)];
  state.ghostRoom = ghostRoom;
}

function spawnGhostMesh() {
  ghostEntity = BABYLON.MeshBuilder.CreateSphere("ghost", { diameter: 1 }, scene);
  ghostEntity.material = new BABYLON.StandardMaterial("ghostMat", scene);
  ghostEntity.material.alpha = 0.4;
  ghostEntity.isVisible = false;
}

function updateGhostAI(deltaTime) {
  if (!ghostProfile || !ghostRoom) return;

  // === Mimic Target Swap Every 30–60 Seconds ===
  if (ghostProfile.name === "The Mimic") {
    const now = performance.now();
    if (now - lastMimicChange > 30000 + Math.random() * 30000) {
      currentMimicTarget = pickRandomGhost("The Mimic");
      lastMimicChange = now;
    }
  }

  // === Ghost Roaming Logic (except Goryo) ===
  const now = performance.now();
  if (now - lastRoamTime > 20000 + Math.random() * 15000) {
    if (ghostProfile.name !== "Goryo") {
      const rooms = Object.keys(roomZones);
      ghostRoom = rooms[Math.floor(Math.random() * rooms.length)];
      state.ghostRoom = ghostRoom;
    }
    lastRoamTime = now;
  }

  // === Hunting Logic ===
  if (huntCooldown > 0) {
    huntCooldown -= deltaTime;
  } else if (state.sanity < 25 && Math.random() < getHuntChance()) {
    startHunt();
    huntCooldown = getHuntCooldown(); // seconds
  }
}

function getHuntChance() {
  switch (ghostProfile.aggression || "average") {
    case "high": return 0.03;
    case "low": return 0.01;
    default: return 0.02;
  }
}

function getHuntCooldown() {
  switch (ghostProfile.name) {
    case "Demon": return 10;
    case "Revenant": return 20;
    default: return 30;
  }
}

function startHunt() {
  fadeScreenRed();
  playHeartbeat();
  ghostEntity.position = player.position.clone();
  ghostEntity.isVisible = true;

  // Check crucifix defense
  if (playerHasItem("Crucifix") && isInGhostRoom()) {
    useItem("Crucifix");
    logToGame("The crucifix burned in your hand. The hunt was prevented.");
    ghostEntity.isVisible = false;
    return;
  }

  // Check smudge stick defense
  if (playerHasItem("Smudge Stick")) {
    useItem("Smudge Stick");
    logToGame("The smudge stick drove the ghost away temporarily.");
    ghostEntity.isVisible = false;
    return;
  }

  // You die
  logToGame("You were caught by the ghost...");
  fadeToBlack();
  stopGame();
}

function isInGhostRoom() {
  return state.room === state.ghostRoom;
}
</script>

<script>
// === UTILITY FUNCTIONS & SCENE TOOLS ===

// Get distance between two vectors
function distance(a, b) {
  return BABYLON.Vector3.Distance(a, b);
}

// Check if two meshes are within a given radius
function isNear(mesh1, mesh2, radius = 3) {
  return distance(mesh1.position, mesh2.position) <= radius;
}

// Get random float between min and max
function randomFloat(min, max) {
  return Math.random() * (max - min) + min;
}

// Get random integer between min and max
function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Choose random element from array
function randomFromArray(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// Get the room name from a mesh (if tagged)
function getRoomFromMesh(mesh) {
  return mesh && mesh.metadata && mesh.metadata.roomName ? mesh.metadata.roomName : null;
}

// Fade screen to black then back in
function fadeScreen(duration = 1500) {
  const fade = document.getElementById("fade-screen");
  fade.style.transition = `opacity ${duration / 1000}s`;
  fade.style.opacity = 1;
  setTimeout(() => {
    fade.style.opacity = 0;
  }, duration);
}

// Clamp a value between min and max
function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

// Check if a mesh has collision (basic proxy)
function meshHasCollider(mesh) {
  return mesh.checkCollisions === true;
}

// Format evidence string into short tag
function formatEvidence(evidence) {
  return evidence.replace("Projector", "").replace("Temps", "Temp").replace(" ", "");
}

// Converts a mesh name into simplified room tag
function normalizeRoomName(name) {
  return name.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
}

// Line of sight check (simple raycast)
function hasLineOfSight(fromMesh, toMesh, scene) {
  const direction = toMesh.position.subtract(fromMesh.position).normalize();
  const length = distance(fromMesh.position, toMesh.position);
  const ray = new BABYLON.Ray(fromMesh.position, direction, length);
  const hit = scene.pickWithRay(ray);
  return hit && hit.pickedMesh === toMesh;
}
</script>
<script>
// === NOTEBOOK & SETTINGS PANEL LOGIC ===

const notebookBtn = document.getElementById("notebookBtn");
const notebookPanel = document.getElementById("notebook");
const closeNotebookBtn = document.getElementById("closeNotebookBtn");
const evidenceList = document.getElementById("evidence-list");
const ghostSuggestionList = document.getElementById("ghost-suggestions");
const guessSelect = document.getElementById("ghost-select");
const guessBtn = document.getElementById("submit-guess");
const gameOverlay = document.getElementById("game-overlay");

// Toggle notebook visibility
notebookBtn.addEventListener("click", () => {
  notebookPanel.style.display = "block";
  updateNotebook();
});
closeNotebookBtn.addEventListener("click", () => {
  notebookPanel.style.display = "none";
});

// Render current evidence list and suggestions
function updateNotebook() {
  evidenceList.innerHTML = "";
  ghostSuggestionList.innerHTML = "";

  allEvidenceTypes.forEach(ev => {
    const row = document.createElement("div");
    row.className = "evidence-row";
    const name = document.createElement("span");
    name.textContent = ev;

    const found = document.createElement("input");
    found.type = "checkbox";
    found.checked = foundEvidence.includes(ev);
    found.addEventListener("change", () => {
      toggleEvidence(ev, "found");
      updateNotebook();
    });

    const eliminated = document.createElement("input");
    eliminated.type = "checkbox";
    eliminated.checked = eliminatedEvidence.includes(ev);
    eliminated.addEventListener("change", () => {
      toggleEvidence(ev, "eliminated");
      updateNotebook();
    });

    row.appendChild(name);
    row.appendChild(found);
    row.appendChild(eliminated);
    evidenceList.appendChild(row);
  });

  const suggestions = getGhostSuggestions();
  ghostSuggestionList.textContent = suggestions.join(", ") || "None";

  guessSelect.innerHTML = `<option value="">-- Select Ghost --</option>`;
  suggestions.forEach(g => {
    const opt = document.createElement("option");
    opt.value = g;
    opt.textContent = g;
    guessSelect.appendChild(opt);
  });
}

// Handle ghost guessing
guessBtn.addEventListener("click", () => {
  const guess = guessSelect.value;
  if (guess) {
    checkGhostGuess(guess);
    notebookPanel.style.display = "none";
  }
});
</script>
<script>
// === ROOM DETECTION VIA MESH ZONES ===

// Returns the room name based on mesh name prefix or bounding zone
function getRoomFromPosition(position) {
  const meshes = scene.meshes;
  for (let i = 0; i < meshes.length; i++) {
    const mesh = meshes[i];
    if (mesh.name.startsWith("Room") && mesh.getBoundingInfo().boundingBox.containsPoint(position)) {
      return mesh.name;
    }
  }
  return "Outside";
}

// Updates player's current room name and HUD
function updatePlayerRoom() {
  const room = getRoomFromPosition(player.position);
  currentRoom = room;
  updateHUD();
}

// Gets ghost's current room
function getGhostRoom() {
  return ghostEntity ? getRoomFromPosition(ghostEntity.position) : "Unknown";
}

// Used to determine if player and ghost are in same space
function isPlayerInGhostRoom() {
  return currentRoom === getGhostRoom();
}
</script>
<script>
// === PART 17: HUNT TRIGGER VISUALS & DEATH LOGIC ===

let huntActive = false;
let huntStartTime = 0;
let huntCooldown = 15000;
let huntOverlay, heartbeatSound, deathScreen;

function setupHuntOverlay() {
  huntOverlay = document.createElement("div");
  huntOverlay.id = "hunt-overlay";
  huntOverlay.style.cssText = `
    position: absolute; top:0; left:0; width:100%; height:100%;
    background: rgba(255,0,0,0.2); pointer-events:none; display:none;
    z-index: 9999;
  `;
  document.body.appendChild(huntOverlay);

  deathScreen = document.createElement("div");
  deathScreen.id = "death-screen";
  deathScreen.innerText = "YOU DIED";
  deathScreen.style.cssText = `
    position: absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size: 5em; color: white; background: black; padding: 20px;
    z-index: 10000; display: none;
  `;
  document.body.appendChild(deathScreen);
}

function triggerHunt() {
  if (huntActive || Date.now() - huntStartTime < huntCooldown) return;
  huntActive = true;
  huntStartTime = Date.now();
  huntOverlay.style.display = "block";
  heartbeatSound?.play();

  setTimeout(() => {
    if (isPlayerInGhostRoom()) {
      deathScreen.style.display = "block";
    }
    huntOverlay.style.display = "none";
    huntActive = false;
  }, 5000);
}

function attemptHuntTrigger() {
  const threshold = 20;
  if (playerSanity < threshold && Math.random() < 0.1) {
    triggerHunt();
  }
}
</script>
<script>
// === PART 18: VOICE UI, CAMERA OVERLAY, AND FADE CONTROLS ===

// === ADA Voice Toggle ===
let voiceEnabled = true;
const synth = window.speechSynthesis;
function speak(text) {
  if (!voiceEnabled) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.pitch = 1.0;
  utter.rate = 1.0;
  utter.voice = synth.getVoices().find(v => v.name.includes("Female") || v.name.includes("Jenny")) || synth.getVoices()[0];
  synth.speak(utter);
}

function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  speak(`Voice ${voiceEnabled ? "enabled" : "disabled"}`);
}

// === IR Camera Overlay ===
const cameraOverlay = document.createElement("div");
cameraOverlay.id = "camera-overlay";
cameraOverlay.style.cssText = `
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(255,255,255,0.05);
  pointer-events:none; display:none;
  z-index: 9000;
`;
document.body.appendChild(cameraOverlay);

function toggleCameraOverlay(show) {
  cameraOverlay.style.display = show ? "block" : "none";
}

// === Screen Fade ===
function fadeScreen(color = "black", duration = 1000) {
  const overlay = document.createElement("div");
  overlay.style.cssText = `
    position:absolute;top:0;left:0;width:100%;height:100%;
    background:${color};z-index:9999;pointer-events:none;opacity:0;
    transition:opacity ${duration / 1000}s;
  `;
  document.body.appendChild(overlay);
  requestAnimationFrame(() => (overlay.style.opacity = 1));
  setTimeout(() => overlay.remove(), duration);
}
</script>
