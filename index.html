<script>
/*** ==========================================================
    UTILITIES
    ========================================================== ***/
function toast(msg, ms=1500){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', ms);
}
function pointInPolyXZ(p, poly){
  if(!poly || !poly.length) return false;
  let inside = false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x, zi=poly[i].z, xj=poly[j].x, zj=poly[j].z;
    const intersect = ((zi>p.z)!==(zj>p.z)) && (p.x < (xj-xi)*(p.z-zi)/(((zj-zi)||1e-9)) + xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
</script>

<script>
/*** ==========================================================
    LOADER (progress + labels)
    ========================================================== ***/
const Loader = (() => {
  const box  = () => document.getElementById('loading-box');
  const text = () => document.getElementById('loading-text');
  const fill = () => document.getElementById('loading-fill');

  let totalWeight = 0;
  let progressed  = 0;
  let queue = [];

  function show(){ if(box()) box().style.display='flex'; }
  function hide(){ if(box()) box().style.display='none'; }
  function label(s){ if(text()) text.textContent = s; }
  function pct(){ return totalWeight ? Math.max(0, Math.min(100, (progressed/totalWeight)*100)) : 0; }
  function draw(){ const el = fill(); if(el) el.style.width = pct().toFixed(1) + '%'; }

  function addStep(label, fnOrPromise, weight=1){
    queue.push({label, run: fnOrPromise, weight});
    totalWeight += weight;
  }

  async function run(){
    // Loader is shown by safeStart(), not here.
    for(const step of queue){
      label(step.label); try{__dbg.show(step.label);}catch(_){}
      draw();
      try{
        if (typeof step.run === 'function') {
          const maybe = step.run();
          if (maybe && typeof maybe.then === 'function') await maybe;
        } else if (step.run && typeof step.run.then === 'function') {
          await step.run;
        }
      } catch(e){
        console.warn('Loader step failed:', step.label, e);
        label(step.label + ' — failed, continuing…');
        await new Promise(r=>setTimeout(r, 250));
      }
      progressed += step.weight;
      draw();
    }
    label('Finalizing…');
    progressed = totalWeight; draw();
    await new Promise(r=>setTimeout(r, 150));
    hide();
  }

  async function wrap(labelText, weight, fn){
    addStep(labelText, async ()=>{ await fn(); }, weight);
  }

  return { addStep, run, wrap, show, hide, label, draw };
})();
</script>

<script>
/*** ==========================================================
    INSPECTOR TOP-MOST ENSURER
    ========================================================== ***/
/** Ensure Babylon Inspector stays above everything on the page */
(function setupInspectorTopmost(){
  let host = document.getElementById('inspector-topmost-host');
  if(!host){
    host = document.createElement('div');
    host.id = 'inspector-topmost-host';
    document.body.appendChild(host);
  }

  function elevateInspectorHost(){
    const nodes = Array.from(document.querySelectorAll(
      'iframe[id*="inspector"],iframe[src*="inspector"],div[id*="inspector"],div[class*="inspector"]'
    ));
    nodes.forEach(el => {
      try {
        el.style.zIndex = '2147483647';
        el.style.position = 'fixed';
      } catch(_) {}
    });
  }

  const mo = new MutationObserver(() => elevateInspectorHost());
  mo.observe(document.documentElement, { childList:true, subtree:true });
  window.__elevateInspectorHost = elevateInspectorHost;
})();
</script>

<script>
/*** ==========================================================
    SIMPLE AUDIO HELPERS
    ========================================================== ***/
const WeatherAudio = (()=>{
  let sceneRef=null, current=null;
  const tracks={ clear:null, rain:null, snow:null, drone:null };

  function ensure(scene){
    if(sceneRef) return;
    sceneRef = scene;
    tracks.clear = new BABYLON.Sound("clear","./assets/audio/clearWeather.mp3",sceneRef,null,{ loop:true, autoplay:false, volume:0.45 });
    tracks.rain  = new BABYLON.Sound("rain","./assets/audio/rainstorm.mp3",sceneRef,null, { loop:true, autoplay:false, volume:0.55 });
    tracks.snow  = new BABYLON.Sound("snow","./assets/audio/ambient.mp3",sceneRef,null,    { loop:true, autoplay:false, volume:0.28 });
    tracks.drone = new BABYLON.Sound("drone","./assets/audio/ambient.mp3",sceneRef,null,   { loop:true, autoplay:false, volume:0.18 });
  }

  function fadeTo(target){
    if(!sceneRef) return;
    if(current===target) return;

    const want={ clear:(target==='Clear'||target==='Sunset'), rain:(target==='Rain'||target==='Blood Moon'), snow:target==='Snow', drone:target==='Blood Moon' };
    for(const k of Object.keys(tracks)){
      const snd = tracks[k];
      if(!snd) continue;
      const tgt = (k==='clear'&&want.clear)?0.45:
                  (k==='rain' &&want.rain )?0.55:
                  (k==='snow' &&want.snow )?0.28:
                  (k==='drone'&&want.drone)?0.18:0.0;
      if(tgt>0){ if(!snd.isPlaying) { try{snd.setVolume(0); snd.play(); } catch(e){}} }
      const start = snd.getVolume();
      let i=0, steps=18, stepMs=40;
      const id=setInterval(()=>{
        i++; const a=i/steps; const ease=(x)=>x<.5?2*x*x:-1+(4-2*x)*x;
        snd.setVolume(start + (tgt-start)*ease(a));
        if(i>=steps){ clearInterval(id); if(tgt===0 && snd.isPlaying) try{snd.stop(); } catch(e){}}
      }, stepMs);
    }
    current=target;
  }
  return { init:(s)=>ensure(s), set:(state)=>{ try{BABYLON.Engine.audioEngine?.unlock?.();} catch(e){}fadeTo(state);} };
})();
</script>

<script>
/*** ==========================================================
    BELT UI + HELD LIGHTS
    ========================================================== ***/
function itemById(id){ return ALL_ITEMS.find(x=>x.id===id); }

function rebuildBelt(){
  const el=document.getElementById('belt'); el.innerHTML='';
  belt.forEach((id,i)=>{
    const d=document.createElement('div'); d.className='slot'+(i===activeSlot?' active':'');
    const item=itemById(id);
    d.innerHTML = `<div class="label">${item?.name||id}</div>`;
    d.onclick=()=>{ activeSlot=i; rebuildBelt(); };
    d.oncontextmenu=(e)=>{ e.preventDefault(); cycleSlot(i); };
    el.appendChild(d);
  });
}
function cycleSlot(i){
  const idx = ALL_ITEMS.findIndex(x=>x.id===belt[i]);
  let j=(idx+1)%ALL_ITEMS.length;
  for(let k=0;k<ALL_ITEMS.length;k++){
    const cand = ALL_ITEMS[j].id;
    if(!belt.includes(cand)){ belt[i]=cand; break; }
    j=(j+1)%ALL_ITEMS.length;
  }
  rebuildBelt();
}
function activeItem(){ return itemById(belt[activeSlot]); }

// Held lights
function ensureHeldFlash(){
  if(!held.light){
    held.light = new BABYLON.SpotLight("handFlash", new BABYLON.Vector3(0,1.6,0), new BABYLON.Vector3(0,0,1), Math.PI/6, 12, scene);
    held.light.intensity = 0; held.light.range = 28;
  }
  return held.light;
}
function ensureHeldUV(){
  if(!held.uvLight){
    held.uvLight = new BABYLON.SpotLight("handUV", new BABYLON.Vector3(0,1.6,0), new BABYLON.Vector3(0,0,1), Math.PI/7.5, 10, scene);
    held.uvLight.diffuse = new BABYLON.Color3(0.7,0.35,1.0);
    held.uvLight.specular = new BABYLON.Color3(0.25,0.15,0.5);
    held.uvLight.intensity = 0; held.uvLight.range = 18;
  }
  return held.uvLight;
}
function ensureHeldLighter(){
  if(!held.lighter){
    held.lighter = new BABYLON.PointLight("handLighter", new BABYLON.Vector3(0,1.6,0), scene);
    held.lighter.intensity = 0; held.lighter.range = 6;
  }
  return held.lighter;
}
function toggleFlash(){ const l=ensureHeldFlash(); l.intensity = (l.intensity>0?0:2.2); toast(l.intensity>0?'Flashlight ON':'Flashlight OFF'); }
function toggleUV(){ const u=ensureHeldUV(); u.intensity = (u.intensity>0?0:1.3); toast(u.intensity>0?'UV ON':'UV OFF'); }
function toggleLighter(){ lighterOn=!lighterOn; const li=ensureHeldLighter(); li.intensity = (lighterOn) ? 0.85 : 0; toast(lighterOn?'Lighter ON':'Lighter OFF'); }

// ===== SALT System =====
const SALT_LINES = [];
let saltCharges = 6;
function _aimPointOnGround(maxDist=3.5){
  const origin = camera.position.clone();
  const dir = camera.getForwardRay().direction.clone();
  const ray = new BABYLON.Ray(origin, dir, maxDist);
  const pick = scene.pickWithRay(ray, m=>m && m.isPickable!==false);
  if(pick && pick.hit) return pick.pickedPoint;
  const ahead = origin.add(dir.scale(Math.min(maxDist, 3.5)));
  ahead.y = 0.02; return ahead;
}
function placeSalt(){
  if(saltCharges<=0){ toast('Out of salt'); return; }
  const center = _aimPointOnGround(3.8);
  const yaw = Math.atan2(camera.getForwardRay().direction.z, camera.getForwardRay().direction.x);
  const half = 0.6;
  const a = new BABYLON.Vector3(center.x - Math.cos(yaw)*half, 0.01, center.z - Math.sin(yaw)*half);
  const b = new BABYLON.Vector3(center.x + Math.cos(yaw)*half, 0.01, center.z + Math.sin(yaw)*half);
  const path = [a, b];
  const mesh = BABYLON.MeshBuilder.CreateTube("salt_line", {path, radius:0.05, tessellation:4}, scene);
  const mat = new BABYLON.StandardMaterial("salt_mat", scene);
  mat.diffuseColor = new BABYLON.Color3(0.95,0.95,0.95);
  mat.specularColor = new BABYLON.Color3(0.2,0.2,0.2);
  mat.emissiveColor = new BABYLON.Color3(0.05,0.05,0.05);
  mat.alpha = 0.9;
  mesh.material = mat;
  SALT_LINES.push({mesh, a, b, disturbed:false, mat});
  saltCharges--;
  try{ mesh.receiveShadows = true; if(sunShadows) sunShadows.addShadowCaster(mesh, true); if(moonShadows) moonShadows.addShadowCaster(mesh, true); }catch(e){}
  toast('Salt line placed ('+saltCharges+' left)');
}
function _pointToSegmentDistance(p, a, b){
  const ap = p.subtract(a);
  const ab = b.subtract(a);
  const ab2 = ab.x*ab.x + ab.z*ab.z + 1e-9;
  const t = Math.max(0, Math.min(1, (ap.x*ab.x + ap.z*ab.z) / ab2));
  const proj = new BABYLON.Vector3(a.x + ab.x*t, p.y, a.z + ab.z*t);
  const dx = p.x - proj.x, dz = p.z - proj.z;
  return Math.sqrt(dx*dx + dz*dz);
}
</script>

<script>
/*** ==========================================================
    UV FOOTPRINTS
    ========================================================== ***/
function spawnUVFootprints(origin, count=2, step=0.35){
  for(let i=0;i<count;i++){
    const quad = BABYLON.MeshBuilder.CreatePlane("uv_foot_"+i, {size:0.18}, scene);
    quad.rotation.x = Math.PI/2;
    quad.position = new BABYLON.Vector3(origin.x + (Math.random()-0.5)*0.3 + i*step*0.6, origin.y+0.02, origin.z + (Math.random()-0.5)*0.3 + i*step);
    quad.isPickable=false;
    const m = new BABYLON.StandardMaterial("uv_mat_"+Math.random(), scene);
    m.diffuseColor = new BABYLON.Color3(0.6,0.3,1.0);
    m.emissiveColor = new BABYLON.Color3(0.2,0.1,0.6);
    m.specularColor = new BABYLON.Color3(0,0,0);
    m.alpha = 0.0;
    quad.material = m;
    let t=0; const fadeIn = scene.onBeforeRenderObservable.add(()=>{
      t += engine.getDeltaTime()/1000; m.alpha = Math.min(0.9, t*3);
      if(m.alpha>=0.9) scene.onBeforeRenderObservable.remove(fadeIn);
    });
    setTimeout(()=>{
      let f=1;
      const h = scene.onBeforeRenderObservable.add(()=>{
        f -= engine.getDeltaTime()/3; m.alpha = Math.max(0, f*0.9);
        if(m.alpha<=0){ scene.onBeforeRenderObservable.remove(h); try{quad.dispose(); } catch(e){}}
      });
    }, 60000);
  }
}
</script>

<script>
/*** ==========================================================
    INPUT (KBD/Touch) + PICKUP + NOCLIP + MOUSE LOOK
    ========================================================== ***/
const InputSystem = (()=>{
  let move={x:0,y:0,z:0}, running=false, lookDelta={x:0,y:0};
  const keys = new Set();
  let isTouchMode=false;
  let _tapSprint=false;
  let _analogScale=1.0;

  // Normalize keys from both e.code and e.key
  function mapKey(e){
    const k = (e.key||'').toLowerCase();
    const c = e.code||'';
    if (c==='KeyW' || k==='w' || c==='ArrowUp')    return 'fw';
    if (c==='KeyS' || k==='s' || c==='ArrowDown')  return 'bk';
    if (c==='KeyA' || k==='a' || c==='ArrowLeft')  return 'lt';
    if (c==='KeyD' || k==='d' || c==='ArrowRight') return 'rt';
    if (c==='ShiftLeft'||c==='ShiftRight' || k==='shift') return 'run';
    if (c==='PageUp' || k===' ')  return 'up';
    if (c==='PageDown' || k==='control') return 'down';
    if (c==='Digit1' || k==='1') return 'slot0';
    if (c==='Digit2' || k==='2') return 'slot1';
    if (c==='Digit3' || k==='3') return 'slot2';
    if (c==='KeyE' || k==='e')   return 'pickup';
    if (c==='KeyG' || k==='g')   return 'drop';
    if (c==='KeyN' || k==='n')   return 'noclip';
    return '';
  }

  function recomputeMove(){
    const f=(keys.has('fw')?1:0)+(keys.has('bk')?-1:0);
    const r=(keys.has('rt')?1:0)+(keys.has('lt')?-1:0);
    const v=(keys.has('up')?1:0)+(keys.has('down')?-1:0);
    move.z=f; move.x=r; move.y=v; running=keys.has('run') || _tapSprint;
  }

  function onKey(e,down){
    const tag = mapKey(e);
    if(!tag) return; // don’t block unrelated keys
    e.preventDefault(); // only block when we actually handle it
    if(down) keys.add(tag); else keys.delete(tag);

    if(tag==='noclip' && down && window.camera){
      const noclipNow = !(camera.checkCollisions);
      camera.checkCollisions = !noclipNow;
      camera.applyGravity   = !noclipNow;
      toast(noclipNow ? 'Noclip: ON' : 'Noclip: OFF');
    }
    if(tag.startsWith('slot') && down){
      const idx = Number(tag.slice(-1));
      if(idx>=0 && idx<3){ activeSlot=idx; rebuildBelt(); }
    }
    if(tag==='pickup' && down) tryPickup();
    if(tag==='drop'   && down) tryDrop();
    recomputeMove();
  }

  // Desktop mouse look via Pointer Lock
  function bindMouseLook(){
    const c = document.getElementById('renderCanvas');
    if(!c) return;
    function onMove(e){
      if (document.pointerLockElement !== c) return;
      lookDelta.x += e.movementX||0;
      lookDelta.y += e.movementY||0;
    }
    c.addEventListener('mousemove', onMove);
    // click to lock
    c.addEventListener('mousedown', ()=>{ if(document.pointerLockElement!==c) c.requestPointerLock?.(); });
    // escape unlock → small hint
    document.addEventListener('pointerlockchange', ()=>{
      if(document.pointerLockElement!==c) toast('Pointer unlocked (click canvas to lock)');
    });
  }

  // Touch halves
  function bindTouchHalves(){
    const left=document.getElementById('touch-left'), right=document.getElementById('touch-right');
    if(!left||!right) return;
    let leftId=null, leftCenter=null, rightId=null, lastRight=null;
    const DEAD=14, MAX=110;
    const norm=(v)=> Math.abs(v)<DEAD?0:v;
    const clampv=(v,m)=> Math.max(-m, Math.min(m, v));

    const onStart = ()=>{ isTouchMode=true; };
    left.addEventListener('touchstart', e=>{ onStart(); for(const t of e.changedTouches){ if(leftId===null){ leftId=t.identifier; leftCenter={x:t.clientX,y:t.clientY}; break; } } e.preventDefault(); },{passive:false});
    right.addEventListener('touchstart', e=>{ onStart(); for(const t of e.changedTouches){ if(rightId===null){ rightId=t.identifier; lastRight={x:t.clientX,y:t.clientY}; break; } } e.preventDefault(); },{passive:false});

    window.addEventListener('touchmove', e=>{
      for(const t of e.changedTouches){
        if(t.identifier===leftId && leftCenter){
          const dx=clampv(t.clientX-leftCenter.x,MAX), dy=clampv(t.clientY-leftCenter.y,MAX);
          const nx=norm(dx)/MAX, ny=norm(dy)/MAX;
          _analogScale = Math.min(1, Math.hypot(nx,ny));
          move.x = Math.sign(nx);
          move.z = ny<0 ? 1 : (ny>0 ? -1 : 0);
          e.preventDefault();
        } else if(t.identifier===rightId){
          if(lastRight){ lookDelta.x += (t.clientX-lastRight.x); lookDelta.y += (t.clientY-lastRight.y); }
          lastRight={x:t.clientX,y:t.clientY}; e.preventDefault();
        }
      }
    },{passive:false});
    window.addEventListener('touchend', e=>{
      for(const t of e.changedTouches){
        if(t.identifier===leftId){ leftId=null; leftCenter=null; move.x=0; move.z=0; _analogScale=1.0; }
        if(t.identifier===rightId){ rightId=null; lastRight=null; }
      }
      e.preventDefault();
    },{passive:false});

    const sprintWrap = document.getElementById('mobile-sprint');
    const sprintBtn  = document.getElementById('btn-sprint');
    if(sprintWrap && sprintBtn){
      sprintWrap.style.display='block';
      sprintBtn.onclick = ()=>{ _tapSprint=!_tapSprint; sprintBtn.textContent = 'Sprint: ' + (_tapSprint?'ON':'OFF'); };
    }
  }

  return {
    init(){
      document.addEventListener('keydown', e=>onKey(e,true), {passive:false});
      document.addEventListener('keyup',   e=>onKey(e,false), {passive:false});
      bindMouseLook();
      bindTouchHalves();
    },
    snapshot(){
      const out={ moveVec:{...move}, running, lookDelta:{...lookDelta}, analog:_analogScale };
      lookDelta.x=0; lookDelta.y=0; return out;
    },
    isTouch: ()=>isTouchMode
  };
})();
</script>

<script>
/*** ==========================================================
    PLAYER MODEL (Visible Body in First Person)
    ========================================================== ***/
const PlayerRig = (()=>{
  let root = null;
  let meshRoot = null;
  let loaded = false;
  let headHidden = false;
  let scaleApplied = false;

  const CONFIG = {
    modelDir: "./assets/models/player/",
    modelFile: "main_player.glb",
    bodyYOffset: 1.70,
    bodyForward: 0.06,
    minScale: 0.6,
    maxScale: 1.6
  };

  function _hideHeadIfFound(node) {
    if (!node) return;
    const name = (node.name||"").toLowerCase();
    const looksLikeHead = name.includes("head") || name.includes("mixamorig:head") || name.includes("bone_head");
    if (looksLikeHead && node.getClassName && node.getClassName()!=="TransformNode") {
      try { node.isVisible = false; headHidden = true; } catch(_){}
    }
    if (node.getChildren) node.getChildren().forEach(_hideHeadIfFound);
  }

  function _tuneMaterials(node) {
    if (!node || !node.material) return;
    try {
      node.material.backFaceCulling = true;
      if (node.material.albedoTexture) node.material.albedoTexture.hasAlpha = false;
      if (node.material.opacityTexture) node.material.opacityTexture.getAlphaFromRGB = false;
    } catch(_){}
  }

  function _fitScaleToHuman(meshes) {
    try {
      const m0 = meshes.find(m=> m.getClassName && m.getClassName()!=="TransformNode");
      if (!m0) return;
      const bi = m0.getBoundingInfo();
      const height = (bi.boundingBox.maximumWorld.y - bi.boundingBox.minimumWorld.y) || 1.7;
      const want = 1.7 / height;
      const clamped = Math.max(CONFIG.minScale, Math.min(CONFIG.maxScale, want));
      root.scaling = new BABYLON.Vector3(clamped, clamped, clamped);
      scaleApplied = true;
    } catch(_){}
  }

  async function load() {
    if (loaded) return;
    root = new BABYLON.TransformNode("playerRoot", scene);
    try {
      const r = await BABYLON.SceneLoader.ImportMeshAsync("", CONFIG.modelDir, CONFIG.modelFile, scene);
      meshRoot = r.meshes.find(m => (m.name||"") !== "__root__") || r.meshes[0];
      r.meshes.forEach(m=>{
        try {
          m.isPickable = false;
          m.checkCollisions = false;
          m.parent = root;
          _tuneMaterials(m);
        } catch(_){}
      });
      try { r.meshes.forEach(m => m.receiveShadows = false); } catch(_){}
      _fitScaleToHuman(r.meshes);
      _hideHeadIfFound(root);
      if (!headHidden) {
        try {
          const tallest = r.meshes
            .filter(m=>m.getBoundingInfo)
            .sort((a,b)=>b.getBoundingInfo().boundingBox.maximumWorld.y - a.getBoundingInfo().boundingBox.maximumWorld.y)[0];
          if (tallest && (tallest.name||"").toLowerCase().includes("head")) { tallest.isVisible = false; headHidden = true; }
        } catch(_){}
      }
      loaded = true;
    } catch (e) {
      console.warn("Player model load failed, creating capsule proxy.", e);
      const capsule = BABYLON.MeshBuilder.CreateCapsule("fp_capsule", {height:1.7, radius:0.25, tessellation:10}, scene);
      const m = new BABYLON.StandardMaterial("fp_capsule_mat", scene);
      m.diffuseColor = new BABYLON.Color3(0.75,0.75,0.8);
      m.emissiveColor = new BABYLON.Color3(0.05,0.08,0.1);
      capsule.material = m;
      capsule.isPickable = false; capsule.checkCollisions = false;
      root = capsule; meshRoot = capsule; loaded = true; headHidden = true;
    }
  }

  function update() {
    if (!loaded || !camera || !root) return;
    const fwd = camera.getForwardRay().direction.clone(); fwd.y = 0; fwd.normalize();
    const yaw = Math.atan2(fwd.z, fwd.x);
    const bodyPos = camera.position
      .add(fwd.scale(CONFIG.bodyForward))
      .add(new BABYLON.Vector3(0, -CONFIG.bodyYOffset, 0));
    root.position.copyFrom(bodyPos);
    root.rotation.y = yaw;
    if (!scaleApplied) try { root.scaling = root.scaling || new BABYLON.Vector3(1,1,1); } catch(_){}
  }

  return { load, update };
})();
</script>

<script>
/*** ==========================================================
    MOVEMENT + LOOK
    ========================================================== ***/
window.handleMovement = function(input, dt){
  if(!window.camera) return;

  const baseWalk = player.speedWalk * (input.analog||1);
  const speed = input.running ? player.speedRun : baseWalk;

  const fwd = camera.getForwardRay().direction.clone(); fwd.y=0; fwd.normalize();
  const right = BABYLON.Vector3.Cross(fwd, BABYLON.Axis.Y).scale(-1);
  const desired = fwd.scale(input.moveVec.z).add(right.scale(input.moveVec.x));

  const vert = input.moveVec.y || 0;
  const wantsFly = vert !== 0;

  const prevGravity = camera.applyGravity;
  if (wantsFly) camera.applyGravity = false;

  let next = camera.position.clone();
  if (desired.lengthSquared() > 0) next = next.add(desired.normalize().scale(speed * dt));
  if (wantsFly) next = next.add(new BABYLON.Vector3(0, vert * speed * dt, 0));

  if (!wantsFly && desired.lengthSquared() > 0) {
    const probe = next.add(new BABYLON.Vector3(0, player.stepUpMax, 0));
    const downRay = new BABYLON.Ray(probe, new BABYLON.Vector3(0,-1,0), player.stepUpMax+0.6);
    const hit = scene.pickWithRay(downRay, m=>m && m.isPickable!==false);
    if(hit && hit.pickedPoint){
      const y = hit.pickedPoint.y + 1.7;
      const dy = y - camera.position.y;
      camera.position = (dy<=player.stepUpMax) ? new BABYLON.Vector3(next.x, y, next.z) : next;
    } else {
      camera.position = next;
    }
  } else {
    camera.position = next;
  }
  camera.applyGravity = prevGravity;
};

window.applyLook = function(lookDelta){
  if(!window.camera) return;
  const sens = 0.0025;
  camera.rotation.y += (lookDelta.x || 0) * sens;
  const minPitch = -Math.PI/2 + 0.15;
  const maxPitch =  Math.PI/2 - 0.15;
  const next = (camera.rotation.x || 0) + ((lookDelta.y || 0) * sens * 0.85);
  camera.rotation.x = Math.max(minPitch, Math.min(maxPitch, next));
};
</script>

<script>
/*** ==========================================================
    WEATHER, SUN, MOON + SHADOWS
    ========================================================== ***/
const LAYERS = { EXTERIOR: 0x10000000, INTERIOR: 0x20000000, ALL: 0x0fffffff };

function setupSun(){
  if(sunLight) return;
  sunLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.35,-1,0.25).normalize(), scene);
  sunLight.intensity = 1.1;
  sunLight.position = new BABYLON.Vector3(60,80,-60);
  sunLight.shadowMinZ = 1; sunLight.shadowMaxZ = 250;
  sunShadows = new BABYLON.ShadowGenerator(2048, sunLight);
  sunShadows.usePercentageCloserFiltering = true;
  sunShadows.filteringQuality = BABYLON.ShadowGenerator.QUALITY_HIGH;
}
function setupMoon(){
  if(moonLight) return;
  moonLight = new BABYLON.DirectionalLight("moonDir", new BABYLON.Vector3(1,-0.8,-0.6).normalize(), scene);
  moonLight.intensity = 0.45;
  moonLight.position = new BABYLON.Vector3(-120,140,100);
  moonLight.shadowMinZ = 1; moonLight.shadowMaxZ = 250;
  moonShadows = new BABYLON.ShadowGenerator(1024, moonLight);
  moonShadows.usePoissonSampling = true;
}
function markShadowable(meshes){
  try{
    meshes.forEach(m=>{
      if(m && m.getClassName && m.getClassName()!=="TransformNode"){
        m.receiveShadows = true;
        if(sunShadows) sunShadows.addShadowCaster(m, true);
        if(moonShadows) moonShadows.addShadowCaster(m, true);
      }
    });
  }catch(e){}
}
/* Simple rain/snow particle systems so setWeather() has valid refs */
function ensureRain(){

  ps.emitter = new BABYLON.Vector3(0, 30, 0);

  ps.maxEmitBox = new BABYLON.Vector3(25, 0, 25);
  ps.minSize = 0.05; ps.maxSize = 0.1;
  ps.minLifeTime = 0.6; ps.maxLifeTime = 1.2;
  ps.emitRate = 4500;
  ps.gravity = new BABYLON.Vector3(0, -9.5, 0);
  ps.direction1 = new BABYLON.Vector3(0, -1, 0);
  ps.direction2 = new BABYLON.Vector3(0, -1, 0);
  weather.rainPS = ps; return ps;
}
function ensureSnow(){
  if(weather.snowPS) return weather.snowPS;
  const ps = new BABYLON.ParticleSystem("snow", 1500, scene);
  ps.particleTexture = new BABYLON.Texture("./assets/images/particles/snow.png", scene, false, false);
  ps.emitter = new BABYLON.Vector3(0, 20, 0);
  ps.minEmitBox = new BABYLON.Vector3(-20, 0, -20);
  ps.maxEmitBox = new BABYLON.Vector3(20, 0, 20);
  ps.minSize = 0.08; ps.maxSize = 0.18;
  ps.minLifeTime = 2.0; ps.maxLifeTime = 3.5;
  ps.emitRate = 1200;
  ps.gravity = new BABYLON.Vector3(0, -1.0, 0);
  ps.direction1 = new BABYLON.Vector3(-0.3, -1, -0.2);
  ps.direction2 = new BABYLON.Vector3(0.3, -1, 0.2);
  weather.snowPS = ps; return ps;
}

function setWeather(state){
  weather.state=state;
  const hw=document.getElementById('hud-weather'); if(hw) hw.textContent=state;
  WeatherAudio.set(state);

  if(hemiLight) hemiLight.dispose();
  setupSun(); setupMoon();
  if(weather.rainPS) weather.rainPS.stop();
  if(weather.snowPS) weather.snowPS.stop();

  if(state==='Clear'){
    scene.fogDensity = 0.0045;
    sunLight.intensity = 0.9;
    moonLight.intensity = 0.35;
  } else if(state==='Sunset'){
    scene.fogDensity = 0.0022;
    sunLight.direction = new BABYLON.Vector3(-0.18,-1,0.12).normalize();
    sunLight.intensity = 1.45;
    sunLight.diffuse = new BABYLON.Color3(1.0,0.86,0.58);
    sunLight.specular = new BABYLON.Color3(1.0,0.9,0.8);
    moonLight.intensity = 0.25;
    scene.clearColor = new BABYLON.Color4(0.10,0.06,0.05,1);
  } else if(state==='Snow'){
    ensureSnow().start(); scene.fogDensity=0.0032; sunLight.intensity=0.8; moonLight.intensity=0.35;
  } else if(state==='Rain'){
    ensureRain().start(); scheduleNextLightning(); scene.fogDensity=0.0048;
  } else if(state==='Blood Moon'){
    ensureRain().start(); scheduleNextLightning(); scene.fogDensity=0.006; moonLight.intensity=0.6;
  }

  try{ markShadowable(scene.meshes||[]); } catch(e){}
}

/*** Static, visible moon (no orbit) ***/
async function loadMoon(){
  const MOON_DIAM = 18;
  const MOON_POS   = new BABYLON.Vector3(0, 120, 160);

  function makeMat(){
    const mat = new BABYLON.StandardMaterial("moonMatVisible", scene);
    mat.disableLighting = true;
    mat.emissiveColor   = new BABYLON.Color3(1,1,1);
    mat.diffuseColor    = new BABYLON.Color3(1,1,1);
    mat.specularColor   = new BABYLON.Color3(0,0,0);
    mat.backFaceCulling = false;
    return mat;
  }

  try{
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/sky/", "moon.glb", scene);
    moonMesh = r.meshes.find(m=>m.name && m.name!=="__root__") || r.meshes[0];
  }catch(e){
    console.warn("Moon GLB missing; creating disc fallback.");
    moonMesh = BABYLON.MeshBuilder.CreateDisc("MoonMesh",{radius:MOON_DIAM*0.5, tessellation:48}, scene);
  }

  moonMesh.material = makeMat();
  moonMesh.isPickable = false;
  moonMesh.applyFog   = false;
  moonMesh.renderingGroupId = 2;
  moonMesh.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  moonMesh.scaling.setAll(MOON_DIAM);
  moonMesh.position.copyFrom(MOON_POS);

  if (moonLight){
    const dir = moonMesh.position.subtract(BABYLON.Vector3.Zero()).normalize().scale(-1);
    moonLight.direction = dir;
    moonLight.intensity = Math.max(moonLight.intensity, 0.45);
  }
}
</script>

<script>
/*** ==========================================================
    MAP SELECTOR + MAP DEF LOADER (smart fallbacks)
    ========================================================== ***/
let MAP_FILES = [];
let CURRENT_MAP = null;

async function loadManifest() {
  try {
    const res = await fetch("./assets/models/map/maps.json", { cache: "no-store" });
    const json = await res.json();
    MAP_FILES = Array.isArray(json) ? json : (json.maps || []);
    MAP_FILES.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  } catch(e) {
    console.warn("maps.json missing or invalid; using fallback.", e);
    MAP_FILES = [
      { file:"Abandoned_House.glb", title:"Abandoned House", def:"Abandoned_House.js" },
      { file:"furnished_house.glb", title:"Furnished House", def:"furnished_house.config.js" }
    ];
  }
  populateMapSelector();
}

function populateMapSelector(){
  const sel = document.getElementById('map-select'); if(!sel) return;
  if (!MAP_FILES.length) { sel.innerHTML = `<option value="-1">(no maps found)</option>`; return; }
  sel.innerHTML = MAP_FILES.map((m,i)=>`<option value="${i}">${m.title||m.file}</option>`).join('');
  sel.value = "0";
  sel.addEventListener('change', ()=>{ try{window.CURRENT_MAP = getSelectedMap(); } catch(e){} });
}

function getSelectedMap(){
  const sel = document.getElementById('map-select');
  const idx = Math.max(0, Math.min(MAP_FILES.length-1, parseInt(sel?.value||"0",10) || 0));
  return MAP_FILES[idx];
}

function loadScriptOnce(src){
  return new Promise((resolve)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve(true);
    s.onerror = ()=>resolve(false);
    document.head.appendChild(s);
  });
}

/* Try explicit def, then inferred names, then the exact fallbacks requested */
async function loadMatchingMapDef(mapFile, explicitDef){
  const baseNoExt = (mapFile||'').replace(/\.[^.]+$/,'');
  const candidates = [];

  if (explicitDef) candidates.push(explicitDef);

  // Inferred
  candidates.push(baseNoExt + ".js");
  candidates.push(baseNoExt + ".config.js");

  // Special-case exact names requested
  const low = (mapFile||'').toLowerCase();
  if (low.includes('abandoned')) candidates.push("Abandoned_House.js");
  if (low.includes('furnished')){
    candidates.push("furnished_house.config.js");
    candidates.push("fully_furnished.config.js");
  }

  const tried = new Set(), ordered = candidates.filter(c=>{ if(tried.has(c)) return false; tried.add(c); return true; });

  let loadedAny = false;
  for (const name of ordered){
    const ok = await loadScriptOnce(`./assets/models/map/${name}`);
    if (ok && window.MAP_DEF) { loadedAny = true; break; }
  }
  if (!loadedAny) {
    console.warn("No map def loaded for", mapFile, "— spawn will use fallback.");
    window.MAP_DEF = undefined;
  }
}

window.loadSelectedMap = async function(){
  const map = (window.CURRENT_MAP = getSelectedMap());
  const mapFile = map?.file || "Abandoned_House.glb";

  Loader.label('Loading map definition…');
  await loadMatchingMapDef(mapFile, map?.def);

  Loader.label('Importing map meshes…');
  try{

  }
};

function postInitUI(){
  rebuildBelt();
  InputSystem.init();

  scene.onBeforeRenderObservable.add(()=>{
    const dt = engine.getDeltaTime()/1000;
    const input = InputSystem.snapshot();

    // Sprint stamina gating (3s sprint, 5s cooldown)
    const moving = !!(input.moveVec.x || input.moveVec.y || input.moveVec.z);
    let canRun = (player.sprintCDLeft <= 0 && player.sprintLeft > 0);
    let wantsRun = input.running && canRun;
    if (wantsRun && moving) {
      player.sprintLeft -= dt;
      if (player.sprintLeft <= 0) { player.sprintLeft = 0; player.sprintCDLeft = player.sprintCD; wantsRun = false; }
    } else {
      if (player.sprintCDLeft > 0) {
        player.sprintCDLeft = Math.max(0, player.sprintCDLeft - dt);
        if (player.sprintCDLeft === 0) player.sprintLeft = player.sprintMax;
      } else {
        player.sprintLeft = Math.min(player.sprintMax, player.sprintLeft + dt);
      }
    }
    input.running = wantsRun;

    if (typeof window.handleMovement === 'function') window.handleMovement(input, dt);
    const isMoving = Math.abs(input.moveVec.x) + Math.abs(input.moveVec.z) > 0.01;
    Footsteps.tick(isMoving, input.running);
    if (typeof window.applyLook === 'function') window.applyLook(input.lookDelta);
    PlayerRig.update();
    try{ CameraRig.update(dt); }catch(_){ }

    // Lightweight ghost event sampler
    ghost.eventTimer += dt;
    if(ghost.eventTimer >= ghost.nextEvent){
      ghost.eventTimer = 0;
      ghost.nextEvent = 8 + Math.random()*12;
      const r = Math.random();
      if(r < 0.30) { GhostAudio.doorCreak(); }
      else if(r < 0.55) { GhostAudio.whisper(); }
      else if(r < 0.82) { GhostAudio.doorSlam(); }
      else { GhostAudio.toss(); }

      try{
        const d = BABYLON.Vector3.Distance(camera.position, ghost.position||BABYLON.Vector3.Zero());
        if(d < 6.0) EMFAudio.extend(10 + Math.random()*5);
      }catch(_){}
    }

    try{ disturbSaltAt(camera.position.clone()); }catch(e){}

    player.inside = true; // placeholder until room volumes wired
    document.getElementById('hud-sanity').textContent = Math.round(player.sanity)+'%';
    document.getElementById('sanity-fill').style.width = Math.round(player.sanity)+'%';

    const xyz=document.getElementById('hud-xyz'); xyz.style.display='block';
    document.getElementById('hud-x').textContent = camera.position.x.toFixed(2);
    document.getElementById('hud-y').textContent = camera.position.y.toFixed(2);
    document.getElementById('hud-z').textContent = camera.position.z.toFixed(2);
  });

  // Inspector button (ensure topmost lift right after showing)
  document.getElementById('btn-inspector').onclick = ()=>{
    try{
      scene.debugLayer.show({ embedMode:false });
      setTimeout(()=>window.__elevateInspectorHost?.(), 0);
      setTimeout(()=>window.__elevateInspectorHost?.(), 250);
    }catch(e){
      toast('Inspector not available');
    }
  };

  document.getElementById('btn-use').onclick = useActiveItem;
  document.getElementById('btn-place').onclick = placeActiveItem;
  document.getElementById('btn-toss').onclick = tossActiveItem;
  document.getElementById('btn-lighter').onclick = toggleLighter;
  document.getElementById('btn-notebook').onclick = ()=>document.getElementById('notebook-modal').style.display='block';
}

  engine.runRenderLoop(()=>scene.render());
  window.addEventListener('resize', ()=>engine.resize());
}

<script>
const EMFAudio = (()=>{
  let ctx=null, osc=null, gain=null, running=false;
  let emf5Until = 0;
  const MAX_EXTEND_MS = 120000;
  function ensure(){
    try{
      ctx = BABYLON.Engine.audioEngine?.audioContext || ctx;
      if(!ctx) return false;
      if(!gain){ gain = ctx.createGain(); gain.gain.value = 0; gain.connect(ctx.destination); }
      if(!osc){ osc = ctx.createOscillator(); osc.type='square'; osc.frequency.value=1150; osc.connect(gain); try{osc.start();}catch(_){}} 
      return true;
    }catch(_){ return false; }
  }
  function now(){ return (typeof performance!=='undefined'?performance.now():Date.now()); }
  function _set(v){ try{ gain && gain.gain.setTargetAtTime(v, ctx.currentTime, 0.005);}catch(_){ } }
  function spike(){
    if(!ensure()) return;
    const pattern=[1,0,1,0,1,0], dur=0.12, gap=0.12; let t=0;
    pattern.forEach(on=>{ setTimeout(()=>_set(on?0.18:0.0), Math.round(t*1000)); t += on?dur:gap; });
    setTimeout(()=>_set(0.0), Math.round(t*1000)+20);
  }
  function startEMF5(seconds){
    if(!ensure()) return;
    const add = Math.max(0.5, seconds||10+Math.random()*5);
    const stopAt = now() + add*1000;
    emf5Until = Math.min(now()+MAX_EXTEND_MS, Math.max(emf5Until, stopAt));
    running=true; _set(0.22);
  }
  function extend(seconds){
    if(emf5Until<=now()) return;
    const add = Math.max(1.0, seconds||10+Math.random()*5);
    emf5Until = Math.min(now()+MAX_EXTEND_MS, emf5Until + add*1000);
  }
  function update(){
    if(emf5Until > now()){ if(!running){ running=true; _set(0.22);} }
    else if(running){ running=false; _set(0.0); }
  }
  (function poll(){ if(window.scene&&window.engine){ scene.onBeforeRenderObservable.add(()=>{ try{ update(); }catch(_){ } }); } else setTimeout(poll,120); })();
  return { spike, startEMF5, extend };
})();
</script>

<script>

<script>
/*** Minimal ghost wander + events, with Shade suppression and radio chance ***/
(function setupGhostLoop(){
  function ensureGhostFields(){
    ghost.position = ghost.position || new BABYLON.Vector3(0,0,0);
    ghost.roomCenter = ghost.roomCenter || new BABYLON.Vector3(2,0,2);
  }
  function assignGhostRoomFromCenter(){
    try{
      if(!window.MAP_DEF || !Array.isArray(MAP_DEF.rooms) || !ghost || !ghost.roomCenter) return;
      for(const r of MAP_DEF.rooms){ if(pointInPolyXZ(ghost.roomCenter, r.poly)){ ghost.roomName=r.name; break; } }
    }catch(_){}
  }
  function currentRoom(){ try{ return currentRoomName?currentRoomName():''; }catch(_){ return ''; } }
  function isPlayerInGhostRoom(){
    try{ return !!ghost.roomName && currentRoom()===ghost.roomName; }catch(_){ return false; }
  }
  function isShadeAndPlayerInRoom(){ return ((ghost?.type||'').toLowerCase()==='shade') && isPlayerInGhostRoom(); }

  ensureGhostFields(); assignGhostRoomFromCenter();
  let t=0, next = 10+Math.random()*15, radioCooldown=0;
  let wanderTarget = ghost.roomCenter.clone();

  scene.onBeforeRenderObservable.add(()=>{
    const dt = engine.getDeltaTime()/1000;
    t += dt; if(radioCooldown>0) radioCooldown -= dt;

    // simple wander near roomCenter
    if(Math.random()<0.01){ wanderTarget = ghost.roomCenter.add(new BABYLON.Vector3((Math.random()-0.5)*4,0,(Math.random()-0.5)*4)); }
    const dir = wanderTarget.subtract(ghost.position); dir.y=0; const L = dir.length(); if(L>0.01){ ghost.position = ghost.position.add(dir.normalize().scale(Math.min(L, dt*0.6))); }
    try{ ghost.nearPlayer = BABYLON.Vector3.Distance(camera.position, ghost.position) < 5.0; }catch(_){}

    if(t>=next){
      t=0; next = 10 + Math.random()*15;
      if(isShadeAndPlayerInRoom()){
        // Shade: suppress noisy events when player is present
        return;
      }
      const r = Math.random();
      if(r<0.25) GhostAudio.whisper();
      else if(r<0.55) GhostAudio.doorCreak();
      else if(r<0.80) GhostAudio.doorSlam();
      else GhostAudio.toss();

      try{
        const d = BABYLON.Vector3.Distance(camera.position, ghost.position||BABYLON.Vector3.Zero());
        if(d<6.0) EMFAudio.extend(10 + Math.random()*5);
        // radio more likely when player is in ghost room
        const inRoom = isPlayerInGhostRoom();
        const radioChance = inRoom ? 0.45 : 0.12;
        if(radioCooldown<=0 && Math.random()<radioChance){ RadioAudio.playOnce(); radioCooldown = 20 + Math.random()*20; }
      }catch(_){}
    }
  });
})();
</script>

<script>

    }catch(_){}
  }
  return { write(){ ensure(); try{ writeClip && writeClip.play(); }catch(_){} }, toss(){ ensure(); try{ tossClip && tossClip.play(); }catch(_){ } } };
})();
let BOOK_PLACED=false, BOOK_POS=null, BOOK_WRITTEN=false;
function dropWritingBook(){
  BOOK_PLACED=true; BOOK_WRITTEN=false;
  try{ BOOK_POS = _aimPointOnGround(3.8) || camera.position.clone(); }catch(_){ BOOK_POS = camera.position.clone(); }

// Book check loop with Shade block
(function bookLoop(){
  let timer=0, nextCheck = 6 + Math.random()*10;
  scene.onBeforeRenderObservable.add(()=>{
    const dt = engine.getDeltaTime()/1000; timer += dt;
    if(!BOOK_PLACED || !BOOK_POS) return;
    if(timer < nextCheck) return;
    timer = 0; nextCheck = 8 + Math.random()*14;
    const shadeBlock = ((ghost?.type||'').toLowerCase()==='shade') && (function(){ try{ return currentRoomName && ghost.roomName && currentRoomName()===ghost.roomName; }catch(_){ return false; } })();

<script>
const DOTS = { projectors:[], monitorPlane:null, tripod:null, monitorText:null };
function _makeDotsGrid(node){
  const countX=10,countZ=10,spacing=0.25,size=0.03;
  for(let ix=0; ix<countX; ix++){
    for(let iz=0; iz<countZ; iz++){
      const s = BABYLON.MeshBuilder.CreateSphere('dot',{diameter:size,segments:4},scene);
      s.material = new BABYLON.StandardMaterial('dotMat',scene);
      s.material.emissiveColor = new BABYLON.Color3(0,1,0);
      s.material.disableLighting = true;
      s.isPickable=false; s.parent=node;
      s.position = new BABYLON.Vector3((ix-(countX/2))*spacing,0.9,(iz-(countZ/2))*spacing);
    }
  }
}
function placeDotsProjector(){
  const p = _aimPointOnGround(4.0);
  const n = new BABYLON.TransformNode('DOTS_Projector', scene);
  n.position = new BABYLON.Vector3(p.x,0,p.z);
  _makeDotsGrid(n);
  DOTS.projectors.push({node:n, radius:2.6});
  toast('DOTS projector placed');
}
function ensureVanMonitor(){
  if(DOTS.monitorPlane) return;
  const plane = BABYLON.MeshBuilder.CreatePlane('vanMonitor',{width:2.2,height:1.3},scene);
  plane.position = new BABYLON.Vector3(0,1.6,22.8);
  plane.rotation.y = Math.PI;
  const mat = new BABYLON.StandardMaterial('vanMonitorMat', scene);
  mat.emissiveColor = new BABYLON.Color3(0.1,0.9,0.1);
  mat.diffuseColor = new BABYLON.Color3(0,0,0);
  mat.specularColor = new BABYLON.Color3(0,0,0);
  plane.material = mat;
  DOTS.monitorPlane=plane;
  const dyn = new BABYLON.DynamicTexture('vanMonitorDT', {width:1024,height:512}, scene, true);
  mat.emissiveTexture = dyn;
  const ctx=dyn.getContext();
  DOTS.monitorText = (msg)=>{ ctx.fillStyle='black'; ctx.fillRect(0,0,1024,512); ctx.fillStyle='#00ff88'; ctx.font='36px monospace'; ctx.fillText(msg,40,80); dyn.update(); };
  DOTS.monitorText('Camera: offline');
}
function placeVideoCam(){
  ensureVanMonitor();
  const p = _aimPointOnGround(4.0);
  DOTS.tripod = new BABYLON.TransformNode('TripodCam',scene);
  DOTS.tripod.position = new BABYLON.Vector3(p.x,1.4,p.z);
  const pole = BABYLON.MeshBuilder.CreateCylinder('tripodPole',{height:1.4,diameter:0.06},scene);
  const head = BABYLON.MeshBuilder.CreateBox('tripodHead',{size:0.12},scene);
  pole.parent=DOTS.tripod; head.parent=DOTS.tripod;
  pole.position = new BABYLON.Vector3(0,-0.7,0);
  head.position = new BABYLON.Vector3(0,0,0);
  const m = new BABYLON.StandardMaterial('tripodMat',scene);
  m.emissiveColor = new BABYLON.Color3(0.05,0.2,0.2);
  pole.material = m; head.material = m;
  DOTS.monitorText('Camera: online');
}
function _ghostInsideAnyDots(){
  if(!DOTS.projectors.length) return null;
  for(const p of DOTS.projectors){
    try{
      const d = BABYLON.Vector3.Distance(ghost.position||BABYLON.Vector3.Zero(), p.node.position);
      if(d < p.radius) return p;
    }catch(_){}
  }
  return null;
}
function _showDotsApparition(atPos, onlyOnMonitor=false){
  const plane = BABYLON.MeshBuilder.CreatePlane('dotsSil',{size:1.5},scene);
  plane.position = new BABYLON.Vector3(atPos.x,1.2,atPos.z);
  plane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_Y;
  const mat = new BABYLON.StandardMaterial('dotsSilMat',scene);
  mat.diffuseColor = new BABYLON.Color3(0,1,0);
  mat.emissiveColor = new BABYLON.Color3(0,1,0);
  mat.alpha = 0.0; plane.material=mat;
  if(onlyOnMonitor){
    plane.isVisible=false; ensureVanMonitor(); DOTS.monitorText('Camera: DOTS detected'); setTimeout(()=>DOTS.monitorText('Camera: online'), 2000);
  } else {
    let t=0; const h=scene.onBeforeRenderObservable.add(()=>{ t+=engine.getDeltaTime()/1000; mat.alpha = t<0.2? t*4.5 : Math.max(0,1.0-(t-0.2)*1.2); if(t>1.2){ scene.onBeforeRenderObservable.remove(h); try{plane.dispose();}catch(_){}} });
  }
}
function updateDOTS(){
  const hit = _ghostInsideAnyDots(); if(!hit) return;
  if(!(ghostHasEvidence('dots'))) return;
  const isGoryo = ((ghost?.type||'').toLowerCase()==='goryo');
  const hasCamInRoom = !!DOTS.tripod && BABYLON.Vector3.Distance(DOTS.tripod.position, hit.node.position) < 6.5;
  if(isGoryo){ if(hasCamInRoom){ _showDotsApparition(ghost.position, true);} }
  else { _showDotsApparition(ghost.position, false); }
}
(function hookDotsLoop(){ function tick(){ try{ updateDOTS(); }catch(_){ } requestAnimationFrame(tick);} requestAnimationFrame(tick);} )();
</script>

<script>
const SpiritBoxAudio = (()=>{
  let active=false, loop=null, voice=null, lastSpeakAt=0;
  function ensure(){
    try{
      if(!loop){ loop = new BABYLON.Sound('spiritboxLoop','./assets/audio/spiritbox.mp3',scene,null,{loop:true,autoplay:false,volume:0.45}); }
      if(!voice){ voice = new BABYLON.Sound('spiritboxWhisper','./assets/audio/whisper.mp3',scene,null,{loop:false,autoplay:false,volume:0.9}); }
    }catch(_){}
  }
  function on(){ ensure(); active=true; try{ if(loop&&!loop.isPlaying) loop.play(); }catch(_){ } }
  function off(){ active=false; try{ loop&&loop.stop(); }catch(_){ } try{ voice&&voice.stop(); }catch(_){ } }
  function toggle(){ active?off():on(); }
  function isOn(){ return !!active; }
  function speak(){
    if(!active || !ghostHasEvidence('spiritbox')) return;
    const now = performance.now?performance.now():Date.now();
    if(now - lastSpeakAt < 1500) return;
    lastSpeakAt = now;
    try{ if(loop && !loop.isPlaying) loop.play(); }catch(_){}
    try{ voice && voice.play(); }catch(_){}
  }
  return { on, off, toggle, isOn, speak };
})();
const SpiritBoxQuestions = (()=>{
  const wrap = ()=>document.getElementById('sbox-questions');
  function show(){ const el=wrap(); if(el) el.style.display='block'; }
  function hide(){ const el=wrap(); if(el) el.style.display='none'; }
  function isNearGhost(){ try{ return BABYLON.Vector3.Distance(camera.position, (ghost?.position||BABYLON.Vector3.Zero())) < 5.5; }catch(_){ return false; } }
  function ask(q){
    if(!SpiritBoxAudio.isOn()) return;
    if(ghostHasEvidence('spiritbox') && isNearGhost() && Math.random()<0.20){ SpiritBoxAudio.speak(); toast('Spirit Box: "'+q+'"'); }
    else toast('...static... "'+q+'"');
  }
  function bind(){ const el=wrap(); if(!el) return; el.querySelectorAll('.sbox-q').forEach(btn=>btn.addEventListener('click',()=>ask(btn.textContent||'Question'))); }
  setTimeout(bind,0);
  return { show, hide, ask };
})();
// periodic 1% chance near ghost while ON
(function periodicSpiritSpeech(){
  function tick(){
    try{
      if(SpiritBoxAudio.isOn() && ghostHasEvidence('spiritbox') && ghost && camera){
        const d = BABYLON.Vector3.Distance(camera.position, ghost.position||BABYLON.Vector3.Zero());
        if(d<5.5 && Math.random()<0.01){ SpiritBoxAudio.speak(); }
      }
    }catch(_){}
    setTimeout(tick, 850);
  }
  setTimeout(tick, 1200);
})();
</script>

  const gt = (ghost?.type||'').toLowerCase();
  if(gt==='obake' && Math.random()<0.30) return false;
  return true;
}
