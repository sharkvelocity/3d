<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phasma-Phoney 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #renderCanvas { width:100%; height:100%; touch-action:none; display:none; }
    #menu, #devPanel { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; background:#000; color:#fff; font-family:monospace; }
    #menu button, #devPanel button { margin:10px; padding:10px 20px; font-size:16px; }
    #devOptions { display:none; margin-top:20px; }
    #developerLog { position:absolute; right:0; top:0; width:300px; height:100%; background:rgba(0,0,0,0.8); color:#0f0; font-size:12px; overflow:auto; display:none; padding:5px; }
  </style>
</head>
<body>
  <!-- Start Menu -->
  <div id="menu">
    <h1>Phasma-Phoney 3D</h1>
    <button id="startBtn">Start Investigation</button>
    <button id="devBtn">Enable Developer Listen</button>
  </div>

  <!-- Developer Listen Panel -->
  <div id="devPanel" style="display:none;">
    <h2>Developer Listen Options</h2>
    <div id="devOptions">
      <button id="ghostLogBtn">Toggle Ghost Tracking Log</button>
      <button id="evidenceLogBtn">Toggle Evidence Log</button>
      <button id="startMapBtn">Start Map</button>
      <button id="pinBtn" disabled>Pin Location</button>
      <button id="confirmMapBtn" disabled>Confirm Map</button>
    </div>
    <button onclick="document.getElementById('devPanel').style.display='none'">Close</button>
  </div>

  <!-- Game canvas -->
  <canvas id="renderCanvas"></canvas>

  <!-- Developer Log Output -->
  <div id="developerLog"></div>

  <script src="https://sharkvelocity.github.io/cdn/babylon.max.js"></script>
  <script src="https://sharkvelocity.github.io/cdn/gui/babylon.gui.min.js"></script>
  <script>
    const startBtn = document.getElementById("startBtn");
    const menu = document.getElementById("menu");
    const canvas = document.getElementById("renderCanvas");
    const devBtn = document.getElementById("devBtn");
    const devPanel = document.getElementById("devPanel");
    const devOptions = document.getElementById("devOptions");
    const devLog = document.getElementById("developerLog");

    // Developer Listen State
    let ghostLogEnabled = false;
    let evidenceLogEnabled = false;
    let mapping = false;
    let pins = [];

    function logDev(message) {
      if (devLog.style.display !== "block") devLog.style.display = "block";
      devLog.innerHTML += message + "<br>";
      devLog.scrollTop = devLog.scrollHeight;
    }

    // Dev Listen Buttons
    document.getElementById("ghostLogBtn").onclick = () => {
      ghostLogEnabled = !ghostLogEnabled;
      logDev("Ghost Tracking Log " + (ghostLogEnabled ? "ENABLED" : "DISABLED"));
    };
    document.getElementById("evidenceLogBtn").onclick = () => {
      evidenceLogEnabled = !evidenceLogEnabled;
      logDev("Evidence Log " + (evidenceLogEnabled ? "ENABLED" : "DISABLED"));
    };
    document.getElementById("startMapBtn").onclick = () => {
      mapping = true; pins = [];
      document.getElementById("pinBtn").disabled = false;
      document.getElementById("confirmMapBtn").disabled = false;
      logDev("Mapping started...");
    };
    document.getElementById("pinBtn").onclick = () => {
      let xyz = {x:Math.random()*10, y:0, z:Math.random()*10}; // replace with real player pos
      pins.push(xyz);
      logDev("Pinned location: "+JSON.stringify(xyz));
    };
    document.getElementById("confirmMapBtn").onclick = () => {
      if (pins.length === 0) { logDev("No pins placed."); return; }
      const roomName = prompt("Name this room (choose recognized room): LivingRoom, Kitchen, Basement");
      logDev("Mapped Room: "+roomName+" with "+pins.length+" pins: "+JSON.stringify(pins));
      mapping=false; pins=[]; 
      document.getElementById("pinBtn").disabled = true;
      document.getElementById("confirmMapBtn").disabled = true;
    };

    devBtn.onclick = () => {
      devPanel.style.display = "flex";
      devOptions.style.display = "block";
    };

    // Game Startup
    let engine, scene;
    async function startInvestigation() {
      menu.style.display = "none";
      canvas.style.display = "block";
      engine = new BABYLON.Engine(canvas, true);
      scene = new BABYLON.Scene(engine);
      const camera = new BABYLON.ArcRotateCamera("camera", Math.PI/2, Math.PI/4, 10, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(1,1,0), scene);
      const sphere = BABYLON.MeshBuilder.CreateSphere("sphere", {diameter:2}, scene);

      engine.runRenderLoop(() => {
        scene.render();
      });

      logDev("Investigation started.");
    }

    startBtn.onclick = () => {
      try { startInvestigation(); }
      catch (e) { console.error(e); alert("Error starting game. Check console."); }
    };

    window.addEventListener("resize", () => {
      if (engine) engine.resize();
    });
  </script>
</body>
</html>
