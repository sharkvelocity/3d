<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney — Full Build</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />

  <!-- Babylon core + loaders -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/earcut.min.js"></script>
  <script src="./cdn/meshopt_decoder.js"></script>
  <script src="./cdn/draco_decoder_gltf.js"></script>
  <script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script>
  <script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
  <script src="./cdn/gui/babylon.gui.min.js"></script>
  <script src="./cdn/inspector/babylon.inspector.bundle.js"></script>
<script src="./assets/dev/map_select.js"></script>
  <style>
    html, body { margin:0; height:100%; width:100%; background:#000; overflow:hidden; font-family:monospace; color:#0ff; touch-action:none; }
    #renderCanvas { width:100vw; height:100vh; display:block; background:#000; outline:none; }

    #loading-box{ position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(0,0,0,0.92); z-index:2147483000; color:#9ef; font-family:monospace; }
    #loading-logo{ width:240px; max-width:60vw; opacity:0.95; filter:drop-shadow(0 0 10px #0ff4); }
    #loading-text{ font-size:16px; letter-spacing:.3px; text-align:center; max-width:70vw; }
    #loading-bar{ width:64vw; max-width:720px; height:14px; border:1px solid #066; border-radius:10px; background:#071017; overflow:hidden; }
    #loading-fill{ height:100%; width:0%; background:linear-gradient(90deg,#19f,#0ff); transition:width .15s ease; }

    #title-screen{ position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:9999; }
    #title-logo{ max-width:60vw; max-height:35vh; object-fit:contain; }
    #start-button{ padding:14px 28px; font-size:22px; cursor:pointer; border:2px solid #0ff; color:#0ff; background:#111; }
    #map-wrap{ display:flex; gap:8px; align-items:center; color:#9ef; }
    #map-select{ background:#0b1518; color:#bff; border:1px solid #066; padding:8px; border-radius:8px; }

    #hud-bar{ position:fixed; top:10px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:6000; }
    .chip { padding:2px 6px; border:1px solid #066; border-radius:6px; color:#aff; font-size:12px; background:rgba(0,0,0,0.5); }
    .sanity-wrap{ display:flex; align-items:center; gap:6px; padding:0 6px; }
    #sanity-gauge{ width:170px; height:10px; border:1px solid #066; background:#061013; border-radius:8px; overflow:hidden; }
    #sanity-fill{ width:100%; height:100%; background:linear-gradient(90deg,#19f,#0ff); transition:width .25s ease; }
    #hud-xyz { position:fixed; top:36px; right:12px; background:rgba(0,0,0,0.5); border:1px solid #066; padding:6px 8px; color:#0ff; font:12px monospace; z-index:6000; display:none; }

    #belt{ position:fixed; left:50%; bottom:72px; transform:translateX(-50%); display:flex; gap:12px; z-index:6000; align-items:center; background:rgba(0,0,0,0.55); border:1px solid #066; padding:8px 10px; border-radius:10px; }
    .slot{ width:88px; height:64px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:1px solid #0aa; background:rgba(0,20,20,0.6); position:relative; cursor:pointer; user-select:none; }
    .slot .label{ font-size:12px; color:#adf; text-align:center; line-height:1.1; padding:6px; }
    .slot.active{ outline:2px solid #0ff; box-shadow:0 0 12px rgba(0,255,255,0.45) inset; }

    .hud-btn{ border:1px solid #333; background:#181818; color:#ddd; padding:6px 10px; border-radius:8px; cursor:pointer; }
    #action-bar { position:fixed; right:12px; bottom:18px; display:flex; gap:10px; z-index:6500; }

    .touch-half { position:fixed; top:20vh; bottom:12vh; width:50vw; z-index:7000; touch-action:none; }
    #touch-left { left:0; } #touch-right{ right:0; }
    #mobile-sprint{ position:fixed; left:14px; bottom:18px; z-index:6500; display:none; }
    #mobile-sprint button{ border:1px solid #066; background:#102; color:#9ef; padding:8px 12px; border-radius:10px; }

    #notebook-modal{ position:fixed; inset:0; background:rgba(0,0,0,0.88); color:#0ff; display:none; z-index:12000; padding:18px; overflow:auto; }

    #toast{ position:fixed; left:50%; top:16px; transform:translateX(-50%); background:rgba(0,0,0,0.7); border:1px solid #066; border-radius:8px; padding:8px 12px; color:#0ff; z-index:10001; display:none; max-width:70vw; text-align:center; }
  </style>
</head>
<body>
  <div id="loading-box" aria-live="polite">
    <img src="logo.png" alt="Logo" id="loading-logo">
    <div id="loading-text">Initializing…</div>
    <div id="loading-bar"><div id="loading-fill" style="width:0%"></div></div>
  </div>

  <div id="title-screen">
    <img id="title-logo" src="./logo.png" alt="PhasmaPhoney Logo" />
    <button id="start-button">Start Investigation</button>
    <div id="map-wrap">
      <span>Map:</span>
      <select id="map-select">
        <option value="-1">(loading maps...)</option>
      </select>
    </div>
  </div>

  <canvas id="renderCanvas" tabindex="0"></canvas>

  <div id="hud-bar">
    <div class="chip">Weather: <span id="hud-weather">—</span></div>
    <div class="chip">Hunt: <span id="hud-hunt">Calm</span></div>
    <div class="chip">Room: <span id="hud-room">Van</span></div>
    <div class="chip sanity-wrap">Sanity:
      <div id="sanity-gauge"><div id="sanity-fill"></div></div>
      <span id="hud-sanity">100%</span>
    </div>
  </div>
  <div id="hud-xyz">XYZ: <span id="hud-x">0</span>, <span id="hud-y">0</span>, <span id="hud-z">0</span></div>

  <div id="belt"></div>

  <div id="action-bar">
    <button id="btn-use" class="hud-btn">Use</button>
    <button id="btn-place" class="hud-btn">Place</button>
    <button id="btn-toss" class="hud-btn">Toss</button>
    <button id="btn-lighter" class="hud-btn">Lighter</button>
    <button id="btn-notebook" class="hud-btn">Notebook</button>
    <button id="btn-inspector" class="hud-btn">Inspector</button>
  </div>

  <div id="touch-left"  class="touch-half"></div>
  <div id="touch-right" class="touch-half"></div>

  <div id="mobile-sprint"><button id="btn-sprint">Sprint: OFF</button></div>

  <div id="notebook-modal">
    <h2>Evidence</h2>
    <div id="evidence-list"></div>
    <div id="possible-ghosts">Possible: —</div>
    <div id="notebook-controls">
      <button class="hud-btn" onclick="closeNotebook()">Close</button>
      <button class="hud-btn" onclick="resetEvidence()">Reset Evidence</button>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Player & world systems -->
  <script src="./assets/dev/movement_rig_clean.js"></script>
  <script src="./assets/dev/spawn_fix.js"></script>
  <script src="./assets/dev/moon.js"></script>
  <script src="./assets/dev/minimap_northup_xyz.js"></script>
  <script src="./assets/dev/sound_engine.js"></script>
  <script src="./assets/dev/devtools.js"></script>
  <script src="./assets/dev/merge_patch.js"></script>

  <!-- Ghost data & logic -->
  <script src="./assets/dev/ghost_db.js"></script>
  <script src="./assets/dev/ghost_logic.js"></script>

  <!-- Evidence & interaction systems -->
  <script src="./assets/dev/uv_prints.js"></script>
  <script src="./assets/dev/salt_system.js"></script>
  <script src="./assets/dev/spirit_box.js"></script>
  <script src="./assets/dev/dots_system.js"></script>
  <script src="./assets/dev/writing_book.js"></script>
<script src="./assets/dev/start_button_fix.js"></script>

</body>
</html>
