        }catch(e){ /* fall through */ }
      }
      // Pull last list cached by original patch if available
      const patch = window.__ManifestPatchCache;

      // If we have a bad 'config' like a .glb or wrong path, try to fix

        const sel = (function(){
          const s = document.querySelector("#mapSelect, #map-select, select[name='map']");

        })();
        const ordered = sel ?

          list;

        for (const entry of ordered){
          // Fix paths
          if (entry.config) entry.config = fixRepoPath(entry.config);
          if (entry.glb) entry.glb = fixRepoPath(entry.glb);

          try{
            if (entry.config && /\.js(\?.*)?$/i.test(entry.config)){
              await import(entry.config);
              if (window.MAP_DEF && MAP_DEF.file) {
                return true;
              }
            }
          } catch(e){
            // If config import fails, try GLB path-based synth
            const ok = await ensureGlbMapDef(entry);
            if (ok) return true;
          }
          // If no config given, try GLB synth
          if (!entry.config){
            const ok = await ensureGlbMapDef(entry);
            if (ok) return true;
          }
        }
      }
      return !!(window.MAP_DEF && MAP_DEF.file);
    }

    window.ensureMapDef = ensure;
    if (window.__TweakPatch) window.__TweakPatch.ensureMapDef = ensure;
  }

  // Cache manifest list when loaded by earlier patch
  (function hookManifestCache(){
    const orig = window.fetch;
    window.fetch = async function(){
      const res = await orig.apply(this, arguments);
      try {
        const url = String(arguments[0]);
        if (url.includes("/assets/models/map/maps.json")){
          const clone = res.clone();
          clone.json().then(data => {
            window.__ManifestPatchCache = window.__ManifestPatchCache || {};
            // Normalize to array of entries {name, config, glb}
            const arr = Array.isArray(data) ? data : Object.keys(data||{}).map(k => ({ name:k, ...(data[k]||{}) }));
            window.__ManifestPatchCache.list = arr;
          }).catch(()=>{});
        }
      } catch(e){}
      return res;
    };
  })();

<!-- ===== Back-to-Land Helper (non-destructive) =============================== -->
<script>
(function(){
  if (window.__BACK_TO_LAND) return;
  function toast(msg){
    try{ (window.__TweakPatch && __TweakPatch.showToast) ? __TweakPatch.showToast(msg) : console.log("[BackToLand]", msg); }catch(e){}
  }
  function sceneRef(){ return window.scene || (window.engine && engine.scenes && engine.scenes[0]) || null; }
  function camRef(sc){ return (sc && sc.activeCamera) || null; }
  function bboxOf(meshes){
    const b = {minX:Infinity,minY:Infinity,minZ:Infinity,maxX:-Infinity,maxY:-Infinity,maxZ:-Infinity};
    for(const m of meshes){
      if(!m || !m.getBoundingInfo) continue;
      const bi = m.getBoundingInfo(); if(!bi) continue;
      const bb = bi.boundingBox;
      const vmin = bb.minimumWorld, vmax = bb.maximumWorld;
      if(!vmin || !vmax) continue;
      b.minX = Math.min(b.minX, vmin.x); b.maxX = Math.max(b.maxX, vmax.x);
      b.minY = Math.min(b.minY, vmin.y); b.maxY = Math.max(b.maxY, vmax.y);
      b.minZ = Math.min(b.minZ, vmin.z); b.maxZ = Math.max(b.maxZ, vmax.z);
    }
    return b;
  }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  async function backToLand(opts={}){
    const sc = sceneRef();
    const cam = camRef(sc);
    if(!sc || !cam){ console.warn("[BackToLand] no scene/camera yet"); return false; }

    // Candidate meshes: prefer houseRoot if present
    const meshes = (window.houseRoot && window.houseRoot.getChildMeshes ? window.houseRoot.getChildMeshes(false) : sc.meshes) || sc.meshes;
    const bb = bboxOf(meshes);
    const cx = (bb.minX + bb.maxX)/2, cz = (bb.minZ + bb.maxZ)/2;
    // Start from above the whole scene
    const startY = (bb.maxY || cam.position.y || 10) + 200;
    const rayLen = Math.max(1000, (bb.maxY - bb.minY) + 400);

    function cast(x,z){
      const from = new BABYLON.Vector3(x, startY, z);
      const ray  = new BABYLON.Ray(from, new BABYLON.Vector3(0,-1,0), rayLen);
      const pick = sc.pickWithRay(ray, m => m && m.isPickable !== false);
      return pick && pick.hit ? pick.pickedPoint : null;
    }

    // Try center, then a small spiral search
    const offsets = [[0,0],[4,0],[-4,0],[0,4],[0,-4],[6,6],[-6,6],[6,-6],[-6,-6],[10,0],[0,10],[-10,0],[0,-10]];
    let hit = null;
    for(const [ox,oz] of offsets){
      hit = cast(cx+ox, cz+oz);
      if(hit) break;
    }
    if(!hit){
      toast("Couldn't find ground by raycast; using bbox floor.");
      hit = new BABYLON.Vector3(cx, bb.minY, cz);
    }

    // Place camera/player slightly above ground
    const y = hit.y + (opts.eye || 1.8);
    const pos = new BABYLON.Vector3(hit.x, y, hit.z);
    if (cam && cam.position && cam.position.copyFrom) cam.position.copyFrom(pos);
    if (window.player && player.position && player.position.copyFrom) player.position.copyFrom(pos);

    // Safety: enable collisions/gravity if available
    try {
      sc.gravity = sc.gravity || new BABYLON.Vector3(0,-9.81,0);
      sc.collisionsEnabled = true;
      if (cam && "applyGravity" in cam) cam.applyGravity = true;
      if (cam && "checkCollisions" in cam) cam.checkCollisions = true;
    } catch(e){}

    toast("Back on land ✔");
    return true;
  }

  window.backToLand = backToLand;
  window.__BACK_TO_LAND = true;

  // Hotkey: press "L" to snap to ground
  window.addEventListener("keydown", (e)=>{
    if((e.key||"").toLowerCase() === "l"){ backToLand(); }
  });

  // Auto-run once the scene & camera are alive
  function tryAuto(){
    const sc = sceneRef(), cam = camRef(sc);
    if (sc && cam){ backToLand(); return true; }
    return false;
  }
  let tries = 0;
  const iv = setInterval(()=>{ if (tryAuto() || ++tries > 40) clearInterval(iv); }, 500);
})();
</script>

<script id="tp-script">
(function(){
  if (window.__TP__) return;
  window.__TP__ = true;

  const el = (id)=>document.getElementById(id);
  const btn = el("tp-btn"), box = el("tp-box");
  const xi = el("tp-x"), yi = el("tp-y"), zi = el("tp-z");
  const cbG = el("tp-ground"), cbP = el("tp-player");
  const teleBtn = el("tp-tele"), closeBtn = el("tp-close");

  function sc(){ return window.scene || (window.engine && engine.scenes && engine.scenes[0]) || null; }
  function cam(){ const s=sc(); return s && s.activeCamera; }

  function toggle(){ box.hidden = !box.hidden; if (!box.hidden) xi?.focus(); }
  btn?.addEventListener("click", toggle);
  closeBtn?.addEventListener("click", toggle);
  window.addEventListener("keydown", (e)=>{ if ((e.key||"").toLowerCase()==="t") toggle(); });

  function parsed(v, fallback){ const n = parseFloat(v); return Number.isFinite(n) ? n : fallback; }

  function castDown(x, z, eye=1.8){
    const S = sc(); if (!S) return null;
    // estimate scene bounds
    const meshes = (window.houseRoot && houseRoot.getChildMeshes?.(false)) || S.meshes;
    let maxY=-1e9, minY=1e9;
    for(const m of meshes){
      const bi=m.getBoundingInfo?.(); if(!bi) continue;
      const bb=bi.boundingBox, vmin=bb.minimumWorld, vmax=bb.maximumWorld;
      if(!vmin||!vmax) continue;
      if (vmax.y>maxY) maxY=vmax.y;
      if (vmin.y<minY) minY=vmin.y;
    }
    const startY = (Number.isFinite(maxY)?maxY:10)+200;
    const rayLen  = Math.max(1000, (Number.isFinite(maxY)&&Number.isFinite(minY)? (maxY-minY):100)+400);
    const from = new BABYLON.Vector3(x, startY, z);
    const ray  = new BABYLON.Ray(from, new BABYLON.Vector3(0,-1,0), rayLen);
    const pick = S.pickWithRay(ray, m => m && m.isPickable !== false);
    if (pick && pick.hit) return pick.pickedPoint.y + eye;
    return null;
  }

  function teleportToXYZ(x, y, z, opts={}){
    const S = sc(); const C = cam();
    if (!S || !C) return false;
    let Y = y;
    if (opts.snapGround){
      const gy = castDown(x, z, opts.eye ?? 1.8);
      if (gy != null) Y = gy;
    }
    if (!Number.isFinite(x) || !Number.isFinite(z)) return false;
    if (!Number.isFinite(Y)) Y = (C.position?.y ?? 2);

    const pos = new BABYLON.Vector3(x, Y, z);
    C.position?.copyFrom?.(pos);
    if (opts.movePlayer && window.player?.position) player.position.copyFrom(pos);
    // ensure gravity/collisions
    try{
      S.gravity = S.gravity || new BABYLON.Vector3(0,-9.81,0);
      S.collisionsEnabled = true;
      if ("applyGravity" in C) C.applyGravity = true;
      if ("checkCollisions" in C) C.checkCollisions = true;
    }catch(e){}
    return true;
  }

  function submit(){
    const C = cam(); if(!C) return;
    const x = parsed(xi.value, C.position?.x ?? 0);
    const y = parsed(yi.value, C.position?.y ?? 2);
    const z = parsed(zi.value, C.position?.z ?? 0);
    const ok = teleportToXYZ(x, y, z, { snapGround: cbG.checked, movePlayer: cbP.checked, eye: 1.8 });
    if (!ok) alert("Teleport failed — check your numbers.");
  }

  [xi, yi, zi].forEach(inp => inp?.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); }));
  teleBtn?.addEventListener("click", submit);

  // expose API
  window.teleportToXYZ = (x,y,z,opts)=>teleportToXYZ(x,y,z,opts||{snapGround:true, movePlayer:true});
})();
</script>

<!-- =================== Input/Overlay Fix (keyboard focus + overlay dominance) =================== -->
<script id="inputfix-script">
(function(){
  if (window.__INPUT_FIX__) return; window.__INPUT_FIX__ = true;

  const selCanvas = ()=> document.querySelector("#renderCanvas, #gameCanvas, canvas");
  // Ensure canvas focusability + pointer lock on click
  function armCanvas(){
    const c = selCanvas(); if (!c) return;
    if (!c.hasAttribute("tabindex")) c.setAttribute("tabindex", "0");
    c.style.outline = "none";
    c.addEventListener("click", ()=>{
      try{ c.focus(); }catch(e){}
      if (c.requestPointerLock && !document.pointerLockElement){
        try{ c.requestPointerLock(); }catch(e){}
      }
    }, {capture:true});
  }

  // Robust keyboard hookup (capture-level to beat page scroll)
  const BLOCK_KEYS = new Set(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"," ","space","shift","control"]);
  window.__KEYS = window.__KEYS || Object.create(null);
  function keySet(k, down){
    window.__KEYS[k] = down;
    // Fire a custom event other systems can subscribe to
    document.dispatchEvent(new CustomEvent("pp-key", {detail:{key:k, down, state:window.__KEYS}}));
  }
  function onKey(e){
    const k = (e.key||"").toLowerCase();
    if (!k) return;
    keySet(k, e.type === "keydown");
    const pl = !!document.pointerLockElement;
    if (pl || BLOCK_KEYS.has(k)){
      // prevent the page from scrolling on arrows/space, etc.
      e.preventDefault?.();
      e.stopPropagation?.();
    }
  }
  // capture to ensure we see the event first
  window.addEventListener("keydown", onKey, true);
  window.addEventListener("keyup", onKey, true);
  // Also wire to canvas (some engines attach there)
  setInterval(armCanvas, 800);

  // Prevent scroll-jank
  try {
    document.body.style.overscrollBehavior = "none";
  } catch(e){}

  // -------- Overlay Dominance (mouse vs touch) --------
  function isMobile(){
    // signal true on touch-first or coarse-pointer environments
    const uaM = /Android|iPhone|iPad|iPod|IEMobile|Windows Phone/i.test(navigator.userAgent||"");
    const coarse = matchMedia && matchMedia("(pointer: coarse)").matches;
    const maxTouch = (navigator.maxTouchPoints||0) > 0;
    const uaData = navigator.userAgentData && navigator.userAgentData.mobile;
    return !!(uaM || coarse || maxTouch || uaData);
  }
  const TOUCH_SEL = ["#touchControls", "#joystick", ".touch-overlay", "#touchOverlay", ".on-screen-joystick"];
  const MOUSE_SEL = ["#mouseOverlay", ".mouse-overlay", "#mouse-controls"];
  function qsa(list){ const out=[]; list.forEach(s=> document.querySelectorAll(s).forEach(n=>out.push(n))); return out; }

  function applyOverlayMode(){
    const mobile = isMobile();
    const touch = qsa(TOUCH_SEL);
    const mouse = qsa(MOUSE_SEL);
    if (mobile){
      touch.forEach(n=>{ n.style.display=""; });
      mouse.forEach(n=>{ n.style.display="none"; });
    } else {
      // Non-mobile: mouse overlay is dominant; hide touch overlays
      touch.forEach(n=>{ n.style.display="none"; });
      mouse.forEach(n=>{ n.style.display=""; n.style.zIndex = "2147483500"; });
    }
  }
  applyOverlayMode();
  window.addEventListener("resize", applyOverlayMode);
  // Some SPA setups add overlays later; poll briefly
  let tries=0; const iv=setInterval(()=>{ applyOverlayMode(); if(++tries>20) clearInterval(iv); }, 500);

  // Helpful debug
  console.log("[InputFix] armed; canvas focus + pointer lock + overlay dominance ready.");
})();
</script>

<script>
/* === PhasmaPhoney Inline Patch (no external file) ===========================
   Features:
   - Force spawn to world coords  (47.52, 0.22, -105.28)
   - Disable collisions for foliage / junk (walk-through)
   - Anchor rain particles to follow player; sane particle params
   - Ambient/rain audio fallbacks if not already present
   - Minimal notebook overlay if yours is missing (saves to localStorage)
=============================================================================*/
(function(){
  const PATCH = {
    spawnWS: new BABYLON.Vector3(47.52, 0.22, -105.28),
    noCollideHints: ['grass','bush','plant','tree','leaf','foliage','hedge','shrub','vine','flower','weed','debris','paper','trash','wire','rope','fence_wire'],
    rainHints: ['rain','fx_rain','weather_rain']
  };
  function log(...a){ try{ console.log('[PhasmaPatch]', ...a);}catch(e){} }
  function onceReady(scene, fn){ if (scene.isReady()) fn(scene); else scene.executeWhenReady(()=>fn(scene)); }
  function playerNode(scene){
    if (window.player && window.player.position) return window.player;
    return scene.getMeshByName('player') || scene.getTransformNodeByName('player') ||
           scene.getMeshByName('avatar') || scene.getTransformNodeByName('avatar') || null;
  }
  function forceSpawn(scene){
    const p = playerNode(scene);
    if (!p) return log('No player node found; spawn skipped.');
    p.position.copyFrom(PATCH.spawnWS);
    if (scene.activeCamera?.setTarget) scene.activeCamera.setTarget(PATCH.spawnWS);
    log('Spawn set to', PATCH.spawnWS.toString());
  }
  function makeFoliageGhost(scene){
    const re = new RegExp('(' + PATCH.noCollideHints.map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')','i');
    let n=0;
    for (const m of scene.meshes){
      if (!m || m === scene.activeCamera) continue;
      if (re.test(m.name)){
        if (m.checkCollisions) { m.checkCollisions = false; n++; }
        m.isPickable = false;
        if (m.physicsImpostor) try{ m.physicsImpostor.dispose(); }catch(e){}
      }
    }
    log('Disabled collisions on ~'+n+' foliage/junk meshes');
  }
  function tuneRain(scene){
    const list = (scene.particleSystems||[]).filter(ps=>{
      const n=(ps.name||'')+'|'+(ps.id||''); return PATCH.rainHints.some(h=>n.toLowerCase().includes(h));
    });
    for (const ps of list){
      ps.renderingGroupId = 1;
      ps.isBillboardBased = true;
      ps.isLocal = true;
      ps.updateSpeed = 0.02;
      ps.minSize = 0.05; ps.maxSize = 0.15;
      ps.minEmitPower = 4.0; ps.maxEmitPower = 7.0;
      ps.gravity = new BABYLON.Vector3(0,-9.81,0);
      if (ps.particleTexture) ps.particleTexture.hasAlpha = true;
    }
    const p = playerNode(scene);
    if (p && list.length){
      let anchor = scene.getTransformNodeByName('__rainAnchor__');
      if (!anchor){ anchor = new BABYLON.TransformNode('__rainAnchor__', scene); anchor.setEnabled(false); }
      scene.onBeforeRenderObservable.add(()=>{
        const pos = p.getAbsolutePosition ? p.getAbsolutePosition() : p.position;
        anchor.position.copyFrom(pos); anchor.position.y += 8;
      });
      for (const ps of list){ ps.emitter = anchor; }
      log('Rain anchored to player.');
    }
  }
  function ensureAmbient(scene){
    const hasAmb = (scene.soundTracks||[]).some(tr => (tr.soundCollection||[]).some(s => /ambient|wind|outside/i.test(s.name||'')));
    if (!hasAmb){
      try{
        const s = new BABYLON.Sound('ambient_default','./audio/ambient_outside.mp3', scene, null, {loop:true, autoplay:true, volume:0.25});
        s.attachToMesh(playerNode(scene) || null);
        log('Ambient fallback attached.');
      }catch(e){}
    }
    const hasRainPS = (scene.particleSystems||[]).some(ps => PATCH.rainHints.some(h => (ps.name||'').toLowerCase().includes(h)));
    const hasRainSnd = (scene.soundTracks||[]).some(tr => (tr.soundCollection||[]).some(s => /rain/i.test(s.name||'')));
    if (hasRainPS && !hasRainSnd){
      try{
        const r = new BABYLON.Sound('rain_loop','./audio/rain_loop.mp3', scene, null, {loop:true, autoplay:true, volume:0.35});
        r.attachToMesh(playerNode(scene) || null);
        log('Rain fallback attached.');
      }catch(e){}
    }
  }
  function minimalNotebook(){
    if (document.getElementById('notebook') || document.querySelector('[data-role="notebook"]')) return;

    wrap.innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><strong style="font-size:12px;color:#9fd4ff">Investigator\\\'s Notes</strong><button id="nb-clear" style="margin-left:auto;background:#132033;border:1px solid #2a3a55;color:#cfe;padding:4px 8px;border-radius:6px;cursor:pointer">Clear</button></div><textarea id="nb-txt" style="width:100%;height:220px;background:#0a121b;color:#e6f1ff;border:1px solid #1b2a3d;border-radius:8px;padding:8px;resize:vertical"></textarea><div style="display:flex;gap:6px;margin-top:8px"><button id="nb-close" style="flex:1;background:#132033;border:1px solid #2a3a55;color:#cfe;padding:6px;border-radius:8px;cursor:pointer">Close</button><button id="nb-save" style="flex:1;background:#10311f;border:1px solid #1f4130;color:#b7ffd7;padding:6px;border-radius:8px;cursor:pointer">Save</button></div>';

    wrap.querySelector('#nb-clear').onclick = ()=>{ t.value=''; localStorage.removeItem('pp_notes_v1'); };

    btn.id='nb-toggle'; btn.textContent='Notebook';
    btn.style.cssText='position:fixed;right:12px;top:24px;padding:8px 10px;border-radius:8px;background:#152033;color:#cfe;border:1px solid #2a3a55;cursor:pointer;z-index:2000';
    btn.onclick = ()=> wrap.style.display = (wrap.style.display==='none'?'block':'none');

  function apply(scene){
    try{ forceSpawn(scene); }catch(e){ log(e); }
    try{ makeFoliageGhost(scene); }catch(e){ log(e); }
    try{ tuneRain(scene); }catch(e){ log(e); }
    try{ ensureAmbient(scene); }catch(e){ log(e); }
    try{ minimalNotebook(scene); }catch(e){ log(e); }
  }
  function tryAttach(){
    const scene = window.scene || (BABYLON?.Engine?.LastCreatedScene);
    if (scene){ onceReady(scene, s=>apply(s)); return true; }
    return false;
  }
  if (!tryAttach()){
    const iv = setInterval(()=>{ if (tryAttach()) clearInterval(iv); }, 200);
    setTimeout(()=>clearInterval(iv), 15000);
  }
  log('Inline patch loaded');
})();

<!-- PATCH: Spawn Enforcer -->
<script>
(function(){
  var SPAWN = new BABYLON.Vector3(-46.18, 1.35, -105.50);
  var start = (typeof performance!=="undefined" ? performance.now() : Date.now());
  function force(){
    var s = window.SCENE || window.scene || (window.ENGINE && ENGINE && ENGINE.scenes && ENGINE.scenes[0]) || null;
    var cam = window.camera || (s && s.activeCamera) || null;
    if (!s || !cam) return false;
    try{
      if (cam.position && cam.position.copyFrom) cam.position.copyFrom(SPAWN);
      else if (cam.setPosition) cam.setPosition(SPAWN);
      if (cam.setTarget) { try { cam.setTarget(cam.position.add(new BABYLON.Vector3(0,1,2))); } catch(_){} }
    }catch(e){}
    return true;
  }
  (function loop(){
    var now = (typeof performance!=="undefined" ? performance.now() : Date.now());
    var elapsed = (now - start)/1000;
    if (elapsed < 5){ if (!force()) {} setTimeout(loop, 150); }
    else { force(); }
  })();
})();
</script>
<!-- PATCH: Global engine/scene aliases -->
<script>
(function(){
  function tick(){
    try{
      if (!window.ENGINE && window.BABYLON && BABYLON.Engine && BABYLON.Engine.Instances && BABYLON.Engine.Instances[0]) {
        window.ENGINE = BABYLON.Engine.Instances[0];
      }
      if (!window.SCENE) {
        if (window.scene && window.scene.getEngine) window.SCENE = window.scene;
        else if (window.ENGINE && ENGINE.scenes && ENGINE.scenes[0]) window.SCENE = ENGINE.scenes[0];
      }
      if (window.ENGINE && window.SCENE) return true;
    } catch(e) {}
    return false;
  }
  if (!tick()){
    const id=setInterval(()=>{ if (tick()) clearInterval(id); }, 200);
    setTimeout(()=>{ try{clearInterval(id);}catch(e){} }, 12000);
  }
})();
</script>

<!-- PATCH: WASD + Shift Run (player-aware + arcrotate follow) -->
<script>
(function(){
  var KEY = { W:87, A:65, S:83, D:68, SHIFT:16 };
  var st = { w:0, a:0, s:0, d:0, run:false };
  var WALK=1.6, RUN=3.0;

  addEventListener("keydown", function(e){ if(e.repeat) return;
    if(e.keyCode===KEY.W) st.w=1; else if(e.keyCode===KEY.S) st.s=1;
    else if(e.keyCode===KEY.A) st.a=1; else if(e.keyCode===KEY.D) st.d=1;
    else if(e.keyCode===KEY.SHIFT) st.run=true;
  }, {passive:true});
  addEventListener("keyup", function(e){
    if(e.keyCode===KEY.W) st.w=0; else if(e.keyCode===KEY.S) st.s=0;
    else if(e.keyCode===KEY.A) st.a=0; else if(e.keyCode===KEY.D) st.d=0;
    else if(e.keyCode===KEY.SHIFT) st.run=false;
  }, {passive:true});

  function S(){ return window.SCENE || window.scene || (window.ENGINE && ENGINE.scenes && ENGINE.scenes[0]) || null; }
  function C(s){ return window.camera || (s && s.activeCamera) || null; }
  function getPlayer(s){
    try{
      if (window.player) return window.player;
      if (s && s.getNodeByName){ var n = s.getNodeByName("player"); if(n) return n; }
      if (s && s.getTransformNodeByName){ var t=s.getTransformNodeByName("player"); if(t) return t; }
    }catch(_){}
    return null;
  }
  function isArc(cam){ return cam && cam.alpha!==undefined && cam.beta!==undefined && cam.radius!==undefined; }

  function v3(cam){
    try{
      var f = cam.getDirection(BABYLON.Axis.Z), r = cam.getDirection(BABYLON.Axis.X);
      f.y=0; r.y=0; f.normalize(); r.normalize();
      var v = f.scale((st.w?1:0)+(st.s?-1:0)).addInPlace(r.scale((st.d?1:0)+(st.a?-1:0)));
      if (v.lengthSquared()===0) return null;
      v.normalize(); return v;
    }catch(e){ return null; }
  }

  (function attach(){
    var s = S(); if(!s){ setTimeout(attach,120); return; }
    s.onBeforeRenderObservable.add(function(){
      var eng=(s.getEngine&&s.getEngine())||window.ENGINE;
      var dt=((eng&&eng.getDeltaTime)?eng.getDeltaTime():16.7)/1000;
      var cam=C(s); if(!cam) return;
      var v=v3(cam); if(!v) return;
      var sp=(st.run?RUN:WALK)*dt;
      var pl=getPlayer(s);

      if (pl){
        // Prefer moving the player mesh
        try{
          pl.checkCollisions = true;
          pl.ellipsoid = pl.ellipsoid || new BABYLON.Vector3(0.4,0.9,0.4);
          pl.ellipsoidOffset = pl.ellipsoidOffset || new BABYLON.Vector3(0,0.9,0);
          if (pl.moveWithCollisions) pl.moveWithCollisions(v.scale(sp));
          else if (pl.position && pl.position.addInPlace) pl.position.addInPlace(v.scale(sp));
        }catch(_){}
        // If using ArcRotate third-person, keep camera aimed at player
        if (isArc(cam) && pl.position){
          try { cam.target = pl.position; } catch(_){}
        }
      } else {
        // No player mesh -> move the camera (first-person / free)
        if (isArc(cam)){
          var d=v.scale(sp);
          try{
            cam.target = cam.target ? cam.target.add(d) : d;
            cam.position = cam.position ? cam.position.add(d) : cam.position;
          }catch(_){}
        } else if (cam.moveWithCollisions) {
          cam.moveWithCollisions(v.scale(sp));
        } else if (cam.cameraDirection) {
          cam.cameraDirection.addInPlace(v.scale(sp));
        } else if (cam.position && cam.position.addInPlace) {
          cam.position.addInPlace(v.scale(sp));
        }
      }
    });
  })();
})();
</script>
<!-- PATCH: Player Model + Third-Person Rig -->
<script>
(function(){
  function S(){ return window.SCENE || window.scene || (window.ENGINE && ENGINE.scenes && ENGINE.scenes[0]) || null; }
  function Canvas(){ var c=document.getElementById("renderCanvas")||document.getElementById("gameCanvas"); return c||document.querySelector("canvas")||null; }

  async function ensurePlayer(){
    var s=S(); if(!s) return null;
    // If already present
    if (window.player) return window.player;
    var n=null;
    try { if (s.getNodeByName) n = s.getNodeByName("player"); } catch(_){}
    if (n){ window.player = n; return n; }

    // Try to load a GLB (best-guess paths). All are optional.
    var paths = [
      ["./assets/models/player/", "player.glb"],
    ];
    for (var i=0;i<paths.length;i++){
      try{
        var r = await BABYLON.SceneLoader.ImportMeshAsync("", paths[i][0], paths[i][1], s);
        var mesh = r.meshes.find(m=>m && m.name && m.name!=="__root__") || r.meshes[0];
        if (mesh){
          mesh.name = "player";
          mesh.checkCollisions = true;
          mesh.ellipsoid = new BABYLON.Vector3(0.4,0.9,0.4);
          mesh.ellipsoidOffset = new BABYLON.Vector3(0,0.9,0);
          window.player = mesh;
          // If has skeleton, store for later
          try { window.playerSkeleton = r.skeletons && r.skeletons[0]; }catch(_){}
          return mesh;
        }
      }catch(e){ /* ignore and try next */ }
    }

    // Fallback placeholder
    try {
      var cap = BABYLON.MeshBuilder.CreateCapsule("player", {height:1.8, radius:0.4, tessellation:12}, s);
      cap.position = new BABYLON.Vector3(-46.18, 1.35, -105.50);
      cap.checkCollisions = true;
      cap.ellipsoid = new BABYLON.Vector3(0.4,0.9,0.4);
      cap.ellipsoidOffset = new BABYLON.Vector3(0,0.9,0);
      window.player = cap;
      return cap;
    } catch(e) {
      return null;
    }
  }

  function ensureThirdPersonCam(){
    var s=S(); if(!s) return null;
    var canvas = Canvas();
    // Reuse ArcRotate if active
    var arc = (s.activeCamera && s.activeCamera.alpha!==undefined) ? s.activeCamera : null;
    if (!arc){
      var alpha = -Math.PI/2, beta = 1.2, radius = 4.0;
      arc = new BABYLON.ArcRotateCamera("tpc", alpha, beta, radius, new BABYLON.Vector3(0,1,0), s);
      arc.attachControl(canvas, true);
      arc.lowerBetaLimit = 0.3; arc.upperBetaLimit = Math.PI/2.0;
      arc.lowerRadiusLimit = 2.2; arc.upperRadiusLimit = 8.0;
    }
    return arc;
  }

  // Keep third-person camera locked to player
  (function followLoop(){
    var s=S(); if(!s){ setTimeout(followLoop, 250); return; }
    s.onBeforeRenderObservable.add(function(){
      var pl = window.player;
      if (!pl || !pl.position) return;
      var cam = s.activeCamera;
      if (cam && cam.alpha!==undefined){ // ArcRotate
        try { cam.target = pl.position; } catch(_){}
      }
    });
  })();

  // Toggle view with 'V': first-person (use existing cam) <-> third-person (ArcRotate)
  (function setupToggle(){
    var s=S(); if(!s){ setTimeout(setupToggle, 250); return; }
    var firstCam = s.activeCamera;
    addEventListener("keydown", function(e){
      if ((e.key||"").toLowerCase()==="v".toLowerCase() || e.keyCode===86){
        var cam = s.activeCamera;
        if (cam && cam.alpha!==undefined){
          // Currently third-person -> switch back to first
          if (firstCam && firstCam !== cam){
            s.activeCamera = firstCam;
            try { firstCam.attachControl(Canvas(), true); }catch(_){}
          }
        } else {
          // Switch to third-person
          var arc = ensureThirdPersonCam();
          if (arc){ s.activeCamera = arc; try{ arc.attachControl(Canvas(), true); }catch(_){ } }
        }
      }
    });
  })();

  // Kick player load (lazy)
  (function waitAndLoad(){
    var s=S(); if(!s){ setTimeout(waitAndLoad, 250); return; }
    ensurePlayer();
  })();
})();
</script>

<script>
document.addEventListener("DOMContentLoaded", ()=> {
  const sanityFill = document.getElementById("sanity-fill");
  const sanityText = document.getElementById("sanity-text");
  const hudPos = document.getElementById("hud-pos");
  const hudWeather = document.getElementById("hud-weather");
  const hudTemp = document.getElementById("hud-temp");

  window.updateSanity = (v)=>{
    const clamped = Math.max(0, Math.min(100, v));
    if(sanityFill) sanityFill.style.width = clamped+"%";
    if(sanityFill) sanityFill.style.background = clamped>50?"#0f0":(clamped>25?"#ff0":"#f00");
    if(sanityText) sanityText.textContent = clamped+"%";
  };
  window.updatePlayerPos = (x,y,z)=>{
    if(hudPos) hudPos.textContent = x.toFixed(1)+","+y.toFixed(1)+","+z.toFixed(1);
  };
  window.updateWeather = (type,temp)=>{
    if(hudWeather) hudWeather.textContent = type;
    if(hudTemp) hudTemp.textContent = (typeof temp==='number'?temp+"°C":(temp||""));
  };

  // Pause Menu
  let isPaused = false;
  const pauseMenu = document.getElementById("pause-menu");
  const resumeBtn = document.getElementById("resume-btn");
  const quitBtn = document.getElementById("quit-btn");
  const canvas = document.getElementById("renderCanvas");

  function setPaused(p){
    isPaused = p;
    if(!pauseMenu) return;
    pauseMenu.style.display = isPaused?"flex":"none";
    if(window.scene && window.scene.getEngine){
      try{
        if(isPaused) window.scene.getEngine().stopRenderLoop();
        else window.scene.getEngine().runRenderLoop(()=>window.scene.render());
      }catch(e){}
    }
    if(canvas){
      if(isPaused && document.exitPointerLock) document.exitPointerLock();
      else if(!isPaused && canvas.requestPointerLock) canvas.requestPointerLock();
    }
  }

  window.addEventListener("keydown", ev=>{ if(ev.code==="Escape") setPaused(!isPaused); });
  if(resumeBtn) resumeBtn.addEventListener("click", ()=>setPaused(false));
  if(quitBtn) quitBtn.addEventListener("click", ()=>alert("Quit to main menu"));

  setTimeout(()=>{ window.updateSanity(100); window.updateWeather("Clear",20); },0);
});
</script>
