<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phasma-Phoney 3D</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: black;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #fade-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 1s;
    }
    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 20;
      font-size: 14px;
    }
    #notebookUI, #guess-panel {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px;
      border-radius: 6px;
      display: none;
      z-index: 20;
    }
    #evidence-panel button {
      margin: 2px;
    }
    .found {
      background-color: green;
      color: white;
    }
    .eliminated {
      background-color: red;
      color: white;
    }
  </style>

 <script src="cdn/babylon.js"></script>
<script src="cdn/babylon.loaders.js"></script>
<script src="cdn/babylon.gui.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <!-- Fade to Black Overlay -->
  <div id="fade-screen"></div>

  <!-- HUD -->
  <div class="hud">
    <div><strong>Room:</strong> <span id="room-label">---</span></div>
    <div><strong>Sanity:</strong> <span id="sanity-label">100%</span></div>
    <div><strong>Weather:</strong> <span id="weather-label">---</span></div>
    <button id="notebookBtn">Notebook</button>
    <button id="guessGhostBtn">Guess Ghost</button>
  </div>

  <!-- Notebook Panel -->
  <div id="notebookUI">
    <h3>Evidence</h3>
    <div id="evidence-panel">
      <button id="evi-EMF">EMF</button>
      <button id="evi-Spirit Box">Spirit Box</button>
      <button id="evi-Fingerprints">Fingerprints</button>
      <button id="evi-Orbs">Orbs</button>
      <button id="evi-Writing">Writing</button>
      <button id="evi-Freezing">Freezing</button>
      <button id="evi-D.O.T.S">D.O.T.S</button>
    </div>
    <h4>Ghost Suggestions</h4>
    <div id="ghost-suggestions"></div>
  </div>

  <!-- Ghost Guess Panel -->
  <div id="guess-panel">
    <label for="ghost-select">Who is the ghost?</label>
    <select id="ghost-select"></select>
    <button onclick="submitGuess()">Submit</button>
  </div>
<script>
// === GHOST PROFILES ===
const ghostProfiles = [
  { name: "Spirit", evidence: ["EMF", "Spirit Box", "Writing"], behavior: {} },
  { name: "Wraith", evidence: ["EMF", "Spirit Box", "D.O.T.S"], behavior: {} },
  { name: "Phantom", evidence: ["Spirit Box", "Fingerprints", "D.O.T.S"], behavior: {} },
  { name: "Poltergeist", evidence: ["Spirit Box", "Fingerprints", "Writing"], behavior: {} },
  { name: "Banshee", evidence: ["Orbs", "Fingerprints", "D.O.T.S"], behavior: {} },
  { name: "Jinn", evidence: ["EMF", "Freezing", "Fingerprints"], behavior: {} },
  { name: "Mare", evidence: ["Spirit Box", "Orbs", "Writing"], behavior: { turnsOffLights: true } },
  { name: "Revenant", evidence: ["Orbs", "Freezing", "Writing"], behavior: {} },
  { name: "Shade", evidence: ["EMF", "Freezing", "Writing"], behavior: {} },
  { name: "Demon", evidence: ["Freezing", "Writing", "Fingerprints"], behavior: {} },
  { name: "Yurei", evidence: ["Orbs", "Freezing", "D.O.T.S"], behavior: { smudgeLock: true } },
  { name: "Oni", evidence: ["EMF", "Freezing", "D.O.T.S"], behavior: {} },
  { name: "Hantu", evidence: ["Freezing", "Fingerprints", "Orbs"], behavior: {} },
  { name: "Goryo", evidence: ["EMF", "Fingerprints", "D.O.T.S"], behavior: { noWander: true } },
  { name: "Myling", evidence: ["EMF", "Writing", "Fingerprints"], behavior: {} },
  { name: "Onryo", evidence: ["Spirit Box", "Freezing", "Orbs"], behavior: { flameHunter: true } },
  { name: "Twins", evidence: ["EMF", "Freezing", "Spirit Box"], behavior: {} },
  { name: "Raiju", evidence: ["EMF", "Orbs", "D.O.T.S"], behavior: {} },
  { name: "Obake", evidence: ["EMF", "Fingerprints", "Orbs"], behavior: {} },
  { name: "The Mimic", evidence: ["Spirit Box", "Fingerprints", "Freezing"], behavior: { mimic: true } },
  { name: "Moroi", evidence: ["Spirit Box", "Freezing", "Writing"], behavior: {} },
  { name: "Deogen", evidence: ["Spirit Box", "Writing", "D.O.T.S"], behavior: {} },
  { name: "Thaye", evidence: ["Orbs", "Writing", "D.O.T.S"], behavior: {} },
  { name: "Succubus", evidence: ["Spirit Box", "Writing", "Orbs"], behavior: {} }
];

// === GAME STATE ===
let activeGhost = ghostProfiles[Math.floor(Math.random() * ghostProfiles.length)];
let mimicTarget = null;
let mimicCounter = 30000 + Math.random() * 30000;
let lastMimicChange = performance.now();

// === EVIDENCE TRACKING ===
const allEvidence = ["EMF", "Spirit Box", "Fingerprints", "Orbs", "Writing", "Freezing", "D.O.T.S"];
let foundEvidence = new Set();
let eliminatedEvidence = new Set();

// === HELPER: Current Ghost ===
function getCurrentGhost() {
  return (activeGhost.name === "The Mimic" && mimicTarget) ? mimicTarget : activeGhost;
}
</script>
<script>
// === NOTEBOOK TOGGLE ===
function toggleNotebook() {
  const el = document.getElementById('notebookUI');
  el.style.display = (el.style.display === 'none') ? 'block' : 'none';
}

// === GHOST GUESS PANEL TOGGLE ===
function toggleGuess() {
  const el = document.getElementById('guess-panel');
  el.style.display = (el.style.display === 'none') ? 'block' : 'none';
}

// === GHOST GUESS SUBMISSION ===
function submitGuess() {
  const guess = document.getElementById("ghost-select").value;
  if (!guess) return;

  const actual = activeGhost.name;
  const result = (guess === actual);
  const message = result
    ? `✅ Correct! The ghost was indeed ${actual}.`
    : `❌ Wrong! It was actually ${actual}.`;

  document.getElementById("guess-panel").style.display = "none";
  fadeScreen(true, 1000);
  setTimeout(() => {
    alert(message);
    location.reload();
  }, 1200);
}

// === GHOST DROPDOWN POPULATION ===
function populateGhostDropdown() {
  const select = document.getElementById("ghost-select");
  ghostProfiles.forEach(g => {
    const opt = document.createElement("option");
    opt.value = g.name;
    opt.textContent = g.name;
    select.appendChild(opt);
  });
}

// === HOOK TO BUTTONS ===
document.getElementById("notebookBtn").addEventListener("click", toggleNotebook);
document.getElementById("guessGhostBtn").addEventListener("click", toggleGuess);
document.getElementById("submitGuessBtn").addEventListener("click", submitGuess);
</script>
<script>
// === GHOST BEHAVIOR ENGINE ===
function getCurrentGhost() {
  return (activeGhost.name === "The Mimic" && mimicTarget) ? mimicTarget : activeGhost;
}

function updateGhostBehavior(playerRoomMesh, sanity) {
  const ghost = getCurrentGhost();

  // === Mimic Behavior Swapping ===
  if (activeGhost.name === "The Mimic") {
    const now = performance.now();
    if (now - lastMimicChange > mimicCounter) {
      const candidates = ghostProfiles.filter(g => g.name !== "The Mimic");
      mimicTarget = candidates[Math.floor(Math.random() * candidates.length)];
      mimicCounter = 30000 + Math.random() * 30000;
      lastMimicChange = now;
    }
  }

  // === Yurei Lock After Smudge ===
  if (ghost.name === "Yurei" && smudgeTurnsRemaining > 0) {
    smudgeTurnsRemaining--;
    return;
  }

  // === Onryo Flame Trigger ===
  if (ghost.behavior.flameHunter) {
    const flames = countLitFlames();
    if (flames >= 3 || wasRelitCandleLitWithin(20)) {
      extinguishFlame();
      triggerHunt();
    }
  }

  // === Mare Turns Off Light ===
  if (ghost.behavior.turnsOffLights && roomHasLight(playerRoomMesh)) {
    maybeTurnOffLight(playerRoomMesh);
  }

  // === Shade Doesn't Hunt When Player Is Present ===
  if (ghost.name === "Shade" && isPlayerInRoom(playerRoomMesh)) return;

  // === Roaming Logic (not Goryo) ===
  if (ghostCanRoam() && Math.random() < 0.2) changeGhostRoom();

  // === Hunt Chance Triggered by Sanity
  if (sanity < 50 && Math.random() < 0.1) triggerHunt();
}

function ghostCanRoam() {
  return !activeGhost.behavior.noWander;
}
</script>
<script>
// === GLOBAL STATE ===
let scene, engine, currentCamera;
let fpCamera, tpCamera;
let cameraMode = "first";
const canvas = document.getElementById("renderCanvas");

// === PLAYER CAMERA SETUP ===
function setupPlayerAndCameras(scene, canvas) {
  // First-person
  fpCamera = new BABYLON.UniversalCamera("fpCamera", new BABYLON.Vector3(0, 1.8, -10), scene);
  fpCamera.applyGravity = true;
  fpCamera.checkCollisions = true;
  fpCamera.ellipsoid = new BABYLON.Vector3(0.5, 1, 0.5);
  fpCamera.speed = 0.15;
  fpCamera.attachControl(canvas, true);

  // Third-person
  tpCamera = new BABYLON.FollowCamera("tpCamera", fpCamera.position.clone().add(new BABYLON.Vector3(0, 5, -10)), scene);
  tpCamera.lockedTarget = fpCamera;
  tpCamera.radius = 6;
  tpCamera.heightOffset = 3;
  tpCamera.rotationOffset = 180;
  tpCamera.cameraAcceleration = 0.05;
  tpCamera.maxCameraSpeed = 10;

  currentCamera = fpCamera;
  scene.activeCamera = currentCamera;
}

// === ITEM INTERACTIONS ===
let heldItems = ["Flashlight", "Spirit Box", "Camera"];
let currentHeldIndex = 0;

function getHeldItem() {
  return heldItems[currentHeldIndex];
}
function cycleHeldItem() {
  currentHeldIndex = (currentHeldIndex + 1) % heldItems.length;
  updateHUDInventory();
}
function updateHUDInventory() {
  const slot = document.getElementById("hud-item-slot");
  if (slot) slot.innerText = getHeldItem();
}

let flashlightMesh = null, flashlightOn = false;
function toggleFlashlight() {
  flashlightOn = !flashlightOn;
  if (flashlightMesh) flashlightMesh.setEnabled(flashlightOn);
}

let spiritBoxActive = false;
function toggleSpiritBox() {
  spiritBoxActive = !spiritBoxActive;
  if (spiritBoxActive) {
    playSound("radioStatic", null, { volume: 0.5, loop: true, name: "spiritBox" });
  } else {
    stopSound("spiritBox");
  }
}

let usingCamera = false;
function toggleCameraView() {
  usingCamera = !usingCamera;
  const overlay = document.getElementById("camera-overlay");
  if (overlay) overlay.style.display = usingCamera ? "block" : "none";
}

function toggleCandle(candleMesh) {
  const isLit = candleMesh.metadata?.isLit;
  candleMesh.metadata.isLit = !isLit;
  candleMesh.getChildMeshes().forEach(m => m.isVisible = !isLit);
  playSound(isLit ? "candleExtinguish" : "candleIgnite", candleMesh.position);
}

// === ITEM KEY HANDLER ===
window.addEventListener("keydown", e => {
  if (e.key === "e") {
    const item = getHeldItem();
    if (item === "Flashlight") toggleFlashlight();
    else if (item === "Spirit Box") toggleSpiritBox();
    else if (item === "Camera") toggleCameraView();
  } else if (e.key === "q") {
    cycleHeldItem();
  }
});

// === SOUND HELPERS ===
let ambientSound;
function setAmbientWeatherSound(weather = "rain") {
  if (ambientSound) ambientSound.stop();
  const file = weather === "rain" ? "rainstorm.mp3" : "clearWeather.mp3";
  ambientSound = new BABYLON.Sound("ambient", `sounds/${file}`, scene, null, {
    loop: true, autoplay: true, volume: 0.4
  });
}
function playSound(name, position = null, options = {}) {
  const sound = new BABYLON.Sound(name, `sounds/${name}.mp3`, scene, null, {
    spatialSound: !!position,
    autoplay: true,
    loop: options.loop || false,
    volume: options.volume || 1
  });
  if (position) sound.setPosition(position);
}
function stopSound(name) {
  const sound = scene.soundTracks?.flatMap(track => track.soundCollection).find(s => s.name === name);
  if (sound) sound.stop();
}
</script>

<script>
// === ENGINE, SCENE & MODEL LOADING ===
engine = new BABYLON.Engine(canvas, true);

engine.runRenderLoop(() => {
  if (scene && scene.activeCamera) scene.render();
});

window.addEventListener("resize", () => engine.resize());

window.addEventListener("DOMContentLoaded", async () => {
  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color3.Black();
  scene.collisionsEnabled = true;
  scene.gravity = new BABYLON.Vector3(0, -0.2, 0);

  const light = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);
  light.intensity = 0.5;

  try {
    await BABYLON.SceneLoader.AppendAsync("models/", "Abandoned_House.glb", scene);
    console.log("House model loaded");

    // Fix collisions for ALL meshes
function applyCollisionToAll(mesh) {
  mesh.checkCollisions = true;
  mesh.isPickable = true;
  if (mesh.getChildMeshes) {
    mesh.getChildMeshes().forEach(child => {
      applyCollisionToAll(child);
    });
  }
}

// After loading:
scene.meshes.forEach(mesh => {
  applyCollisionToAll(mesh);
});


    // Optional: Log mesh names to confirm
    scene.meshes.forEach(m => console.log("Mesh:", m.name));

  } catch (err) {
    console.error("Failed to load house model:", err);
  }

  setupPlayerAndCameras(scene, canvas);
  engine.resize();
});
</script>


</body>
</html>
