<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Phasma-Phoney — 3D Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Local engine & loaders (keep paths from your repo_map) -->
<script src="./cdn/babylon.js"></script>
<script src="./cdn/earcut.min.js"></script>
<script src="./cdn/meshopt_decoder.js"></script>
<script src="./cdn/draco_decoder_gltf.js"></script>
<script src="./cdn/draco_decoder_gltf.wasm"></script>
<script src="./cdn/loaders/babylon.glTFFileLoader.js"></script>
<script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script>

<style>
  html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:monospace;color:#8ff}
  #renderCanvas{width:100%;height:100%;touch-action:none;display:block;background:#000}
  /* HUD */
  .hud{position:fixed;top:12px;left:12px;z-index:10;border:2px solid #0ff;border-radius:6px;padding:8px 10px;background:#000a;backdrop-filter:blur(2px);min-width:180px}
  .hud h4{margin:0 0 6px 0;color:#6ff}
  .hud .row{display:flex;justify-content:space-between;font-size:12px;line-height:1.25}
  /* Storage button (van zone only) */
  #storageBtn{position:fixed;right:18px;top:45%;transform:translateY(-50%);padding:10px 14px;border:2px solid #0ff;border-radius:6px;background:#001820;color:#8ff;cursor:pointer;display:none;z-index:10}
  #storagePanel{position:fixed;right:18px;top:55%;transform:translateY(-50%);border:2px solid #0ff;border-radius:6px;background:#000e;padding:10px;display:none;z-index:11;min-width:220px}
  /* Hotbar */
  #hotbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:12px;z-index:10}
  .slot{width:96px;height:64px;border:2px solid #0ff;border-radius:6px;background:#001820;color:#8ff;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .slot.active{box-shadow:0 0 8px #0ff inset;border-color:#9ff}
  .slot small{opacity:.7}
  /* Active item preview (right hand) */
  #hand{position:fixed;right:22px;bottom:22px;width:160px;height:160px;border:2px dashed #077;border-radius:8px;background:#0004;z-index:9;pointer-events:none;display:flex;align-items:center;justify-content:center}
  /* Dev modal prompt */
  #devPrompt{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20}
  #devPrompt .card{background:#001820;border:2px solid #0ff;border-radius:8px;padding:16px;color:#9ff;min-width:260px}
  #devPanel{position:fixed;right:12px;top:12px;border:2px solid #0ff;border-radius:6px;background:#001820;color:#9ff;padding:8px 10px;z-index:12;display:none}
  #devPanel button{display:block;width:220px;margin:6px 0;padding:6px 8px;border:1px solid #0ff;background:#022;color:#9ff;border-radius:4px;cursor:pointer}
  /* Log */
  #log{position:fixed;left:8px;bottom:8px;z-index:10;color:#8ff;background:#0008;border:1px solid #066;border-radius:4px;padding:6px 8px;max-width:420px;max-height:120px;overflow:auto;font-size:12px}
  /* Lightning flash */
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<!-- HUD -->
<div class="hud" id="hud">
  <h4>Status</h4>
  <div class="row"><span>Weather</span><span id="hudWeather">Clear</span></div>
  <div class="row"><span>Room</span><span id="hudRoom">Outside</span></div>
  <div class="row"><span>Sanity</span><span id="hudSanity">100%</span></div>
</div>

<button id="storageBtn">STORAGE</button>
<div id="storagePanel">
  <div style="margin-bottom:6px;color:#9ff;">Van Storage</div>
  <div id="storageList" style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;"></div>
  <button id="closeStorage" style="margin-top:8px;border:1px solid #0ff;background:#022;color:#9ff;padding:6px 8px;border-radius:4px">Close</button>
</div>

<div id="hotbar">
  <div class="slot" data-slot="1"><small>1</small><div id="slot1">Empty</div></div>
  <div class="slot" data-slot="2"><small>2</small><div id="slot2">Empty</div></div>
  <div class="slot" data-slot="3"><small>3</small><div id="slot3">Empty</div></div>
  <div class="slot" data-slot="4"><small>4</small><div id="slot4">Lighter</div></div>
  <div class="slot" data-slot="5"><small>5</small><div id="slot5">Notebook</div></div>
</div>

<div id="hand"><span style="font-size:12px;opacity:.6">Active Item</span></div>

<!-- Dev unlock -->
<div id="devPrompt">
  <div class="card">
    <div style="margin-bottom:8px">Enable Developer Options?</div>
    <input id="devPass" type="password" placeholder="password" style="width:100%;padding:6px;border-radius:4px;border:1px solid #066;background:#000;color:#9ff"/>
    <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
      <button id="devCancel" style="border:1px solid #066;background:#111;color:#8ff;padding:6px 10px;border-radius:4px">No</button>
      <button id="devOk" style="border:1px solid #0ff;background:#022;color:#9ff;padding:6px 10px;border-radius:4px">OK</button>
    </div>
  </div>
</div>

<!-- Dev panel -->
<div id="devPanel">
  <div style="margin-bottom:6px;font-weight:700;color:#cff">Developer Options</div>
  <button id="btnTeleportGhost">Teleport to Ghost</button>
  <button id="btnGod">Toggle God Mode</button>
  <button id="btnPing">Ping XYZ to Log</button>
  <button id="btnRecenter">Recenter to Van</button>
  <button id="btnRevealGhost">Reveal Ghost Name</button>
</div>

<!-- Lightning flash overlay -->
<div id="flash"></div>

<div id="log"></div>

<script>
/* =========================
   Globals & simple state
========================= */
const canvas = document.getElementById('renderCanvas');
const hudWeather = document.getElementById('hudWeather');
const hudRoom = document.getElementById('hudRoom');
const hudSanity = document.getElementById('hudSanity');
const logBox = document.getElementById('log');

const storageBtn = document.getElementById('storageBtn');
const storagePanel = document.getElementById('storagePanel');
const storageList = document.getElementById('storageList');
document.getElementById('closeStorage').onclick = () => storagePanel.style.display = 'none';

let engine = new BABYLON.Engine(canvas, true, {preserveDrawingBuffer:true, stencil:true});
let scene = new BABYLON.Scene(engine);
scene.useRightHandedSystem = false;
scene.collisionsEnabled = true;
scene.gravity = new BABYLON.Vector3(0, -0.15, 0);

// Camera & player capsule
const camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0, 1.6, 0), scene);
camera.minZ = 0.1; camera.maxZ = 2000;
camera.speed = 0.25;
camera.attachControl(canvas, true);
camera.inertia = 0.2;
camera.checkCollisions = true;
camera.applyGravity = true;

const playerCapsule = new BABYLON.Mesh.CreateCapsule("playerCapsule", {
  height: 1.8, radius: 0.4, tessellation: 12
}, scene);
playerCapsule.isVisible = false;
playerCapsule.ellipsoid = new BABYLON.Vector3(0.4, 0.9, 0.4);
playerCapsule.ellipsoidOffset = new BABYLON.Vector3(0, 0.9, 0);
playerCapsule.checkCollisions = true;
playerCapsule.position.set(0, 1.2, 0);

// keep camera sitting on top of capsule
camera.parent = playerCapsule;

// Safety ground (invisible, collidable) to always catch player
const safetyGround = BABYLON.MeshBuilder.CreateGround("safetyGround",
  { width: 400, height: 400, subdivisions: 2 }, scene);
safetyGround.position.y = 0.0;
safetyGround.checkCollisions = true;
safetyGround.isPickable = true;
safetyGround.visibility = 0;

// Lights
const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
hemi.intensity = 0.85;

// Weather & lightning
let weather = "Clear"; // "Clear" | "Rain"
let lightningTimer = 0;
const flash = document.getElementById('flash');

function flashLightning() {
  flash.style.transition = "none";
  flash.style.opacity = "0.6";
  setTimeout(()=>{ flash.style.transition = "opacity 220ms ease-out"; flash.style.opacity = "0"; }, 40);
}

// Simple randomize weather each load
if (Math.random() < 0.5) weather = "Rain";
hudWeather.textContent = weather;

// Audio (optional: muted by default to avoid autoplay restrictions)
const snd = {
  rain: new Audio("./assets/audio/rainstorm.mp3"),
  clear: new Audio("./assets/audio/clearWeather.mp3"),
  doorCreak: new Audio("./assets/audio/doorCreak1.mp3"),
};
for (const k in snd) { snd[k].loop = true; snd[k].volume = 0.0; } // start silent
setTimeout(()=>{
  if (weather === "Rain") { snd.rain.volume = 0.2; snd.rain.play().catch(()=>{}); }
  else { snd.clear.volume = 0.1; snd.clear.play().catch(()=>{}); }
}, 500);

/* =========================
   World loading
========================= */

const PATH_MAP   = "./assets/models/map/Abandoned_House.glb";
const PATH_ITEMS = "./assets/models/items/exploration_objects.glb";
const GHOST_LIST = [
  "./assets/models/ghosts/ghost1.glb",
  "./assets/models/ghosts/ghost2.glb",
  "./assets/models/ghosts/ghost3.glb",
  "./assets/models/ghosts/ghost4.glb",
  "./assets/models/ghosts/ghost5.glb"
];

let ghostMesh = null;
let ghostName = "UNKNOWN";
let ghostMoveDir = new BABYLON.Vector3(0,0,0);
let ghostSpeed = 0.06;
let ghostIdle = true;

// House references
let houseFloor = null;
let frontDoor = null;
let doorOpen = false;

// VAN spawn area mid-point (from your PINGs near the van)
const VAN_A = new BABYLON.Vector3(51.062, 0.905, -104.156);
const VAN_B = new BABYLON.Vector3(45.480, 0.905, -104.154);

// House bounds you provided earlier (rectangle). Used for random ghost spawn/wander.
const BOUNDS = [
  new BABYLON.Vector3(18.404, -0.016, -96.040),
  new BABYLON.Vector3(57.205, -0.718, -94.031),
  new BABYLON.Vector3(62.145, -0.651, -105.142),
  new BABYLON.Vector3(61.872,  1.165, -149.928),
  new BABYLON.Vector3(18.660,  1.165, -149.900)
];

/* Log helper */
function say(msg){
  const p = document.createElement('div');
  p.textContent = msg;
  logBox.appendChild(p);
  logBox.scrollTop = logBox.scrollHeight;
}

/* Load map */
BABYLON.SceneLoader.Append("", PATH_MAP, scene, () => {
  // Collision policy per mesh
  scene.meshes.forEach(m=>{
    const n = (m.name||"").toLowerCase();
    const mat = m.material;
    const transparent = !!(mat && 'alpha' in mat && mat.alpha < 0.999);

    const looksLikeFloor =
      n.includes("floor") || n.includes("ground") || n.includes("road") ||
      n.includes("sidewalk") || n.includes("porch") || n.includes("stairs") ||
      n.endsWith("_floor") || n.endsWith("_ground");

    const looksLikeDoor = n.includes("door") || n.includes("hinge") || n.includes("frontdoor");

    if (looksLikeFloor) {
      m.checkCollisions = true; m.isPickable = true;
      houseFloor = houseFloor || m;
    } else if (looksLikeDoor) {
      m.checkCollisions = true; m.isPickable = true;
      if (!frontDoor) frontDoor = m;
    } else if (transparent || n.includes("trash") || n.includes("foliage")
                || n.includes("paper") || n.includes("decal") || n.includes("leaf")) {
      // allow walking through clutter & decals
      m.checkCollisions = false; m.isPickable = false;
    } else {
      m.checkCollisions = true; m.isPickable = true;
    }
  });

  say("Map loaded.");
  spawnAtVan();
  spawnGhost();
});

/* Load item GLB (for hotbar thumbnails & right-hand preview) */
let itemRoot = null;
let itemMeshes = {};
BABYLON.SceneLoader.ImportMeshAsync("", "", PATH_ITEMS, scene).then(res=>{
  itemRoot = new BABYLON.TransformNode("itemsRoot", scene);
  res.meshes.forEach(m=>{
    if (!m.name || m.name === "__root__") return;
    m.setEnabled(false);
    m.parent = itemRoot;
    itemMeshes[m.name] = m;
  });
  say("Items loaded.");
});

/* =========================
   Movement & input
========================= */
const keys = {w:false,a:false,s:false,d:false,shift:false,pgup:false,pgdn:false, e:false, mouse:false};
window.addEventListener('keydown', e=>{
  if (e.repeat) return;
  if (e.code === 'KeyW') keys.w = true;
  if (e.code === 'KeyA') keys.a = true;
  if (e.code === 'KeyS') keys.s = true;
  if (e.code === 'KeyD') keys.d = true;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = true;
  if (e.code === 'PageUp') keys.pgup = true;
  if (e.code === 'PageDown') keys.pgdn = true;
  if (e.code === 'KeyE') keys.e = true;
  // hotbar selection
  if (e.code === 'Digit1') selectSlot(1);
  if (e.code === 'Digit2') selectSlot(2);
  if (e.code === 'Digit3') selectSlot(3);
  if (e.code === 'Digit4') selectSlot(4);
  if (e.code === 'Digit5') selectSlot(5);
  // Dev unlock with ESC
  if (e.code === 'Escape') toggleDevPrompt();
});
window.addEventListener('keyup', e=>{
  if (e.code === 'KeyW') keys.w = false;
  if (e.code === 'KeyA') keys.a = false;
  if (e.code === 'KeyS') keys.s = false;
  if (e.code === 'KeyD') keys.d = false;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = false;
  if (e.code === 'PageUp') keys.pgup = false;
  if (e.code === 'PageDown') keys.pgdn = false;
  if (e.code === 'KeyE') keys.e = false;
});
window.addEventListener('mousedown', ()=>{ keys.mouse = true; });
window.addEventListener('mouseup', ()=>{ keys.mouse = false; });

/* WASD movement vector from camera forward/right */
function moveVector(dt){
  let forward = camera.getDirection(BABYLON.Axis.Z);
  let right   = camera.getDirection(BABYLON.Axis.X);
  forward.y = 0; right.y = 0;
  forward.normalize(); right.normalize();

  let v = new BABYLON.Vector3(0,0,0);
  if (keys.w) v.addInPlace(forward);
  if (keys.s) v.addInPlace(forward.scale(-1));
  if (keys.d) v.addInPlace(right);
  if (keys.a) v.addInPlace(right.scale(-1));

  const speed = keys.shift ? 0.16 : 0.08;
  v = v.normalize().scale(speed);

  // Fly only in dev mode using PgUp/PgDn
  if (devMode){
    if (keys.pgup) v.y += 0.12;
    if (keys.pgdn) v.y -= 0.12;
  }
  return v;
}

/* Snap player capsule to the closest ground below each frame */
function snapToGround(){
  // cast a ray from above the player downward
  const origin = playerCapsule.position.add(new BABYLON.Vector3(0, 3, 0));
  const ray = new BABYLON.Ray(origin, new BABYLON.Vector3(0, -1, 0), 10);
  const hit = scene.pickWithRay(ray, m=>m.checkCollisions===true);
  if (hit && hit.hit && hit.pickedPoint){
    const desiredY = hit.pickedPoint.y + playerCapsule.ellipsoidOffset.y;
    if (playerCapsule.position.y < desiredY - 0.02){
      playerCapsule.position.y = desiredY;
    }
  }
}

/* =========================
   Hotbar & items
========================= */
const hotbar = {1:null,2:null,3:null,4:"Lighter",5:"Notebook"};
let activeSlot = 1;
function refreshHotbar(){
  for (let i=1;i<=5;i++){
    document.querySelector(`.slot[data-slot="${i}"]`).classList.toggle('active', i===activeSlot);
    const el = document.getElementById(`slot${i}`);
    el.textContent = hotbar[i] ? hotbar[i] : "Empty";
  }
}
refreshHotbar();
function selectSlot(n){ activeSlot = n; refreshHotbar(); setHandPreview(hotbar[n]); }
function setHandPreview(name){
  const hand = document.getElementById('hand');
  // remove any previous child mesh preview (we use a mini engine layer)
  // Simpler: just write the name (actual model is in-scene, not in HUD UI scene to keep code lean)
  hand.innerHTML = `<span style="font-size:12px;opacity:.9">${name?name:"Empty"}</span>`;
}

/* =========================
   Van storage UI
========================= */
const VAN_STOCK = [
  "EMF","Spirit Box","Thermometer","Photo Camera","Video Camera",
  "UV Light","D.O.T.S","Ghost Writing Book","Crucifix","Salt","Smudge"
];
function isInVanZone(){
  // within a small box around VAN mid
  const mid = BABYLON.Vector3.Center(VAN_A, VAN_B);
  const p = playerCapsule.position;
  return Math.abs(p.x - mid.x) < 3.0 && Math.abs(p.z - mid.z) < 3.0 && Math.abs(p.y - mid.y) < 2.0;
}
function updateStorageVisibility(){
  storageBtn.style.display = isInVanZone() ? "block" : "none";
  if (!isInVanZone()) storagePanel.style.display = "none";
}
storageBtn.onclick = ()=>{
  storagePanel.style.display = 'block';
  storageList.innerHTML = "";
  VAN_STOCK.forEach(name=>{
    const b = document.createElement('button');
    b.textContent = name;
    b.style.cssText = "border:1px solid #0ff;background:#022;color:#9ff;padding:6px;border-radius:4px;cursor:pointer";
    b.onclick = ()=>{
      // place into first empty hotbar slot 1..3 (4=Lighter,5=Notebook fixed)
      for (let i=1;i<=3;i++){
        if (!hotbar[i]){ hotbar[i] = name; refreshHotbar(); setHandPreview(hotbar[activeSlot]); break; }
      }
    };
    storageList.appendChild(b);
  });
};

/* =========================
   Doors (front door)
========================= */
function tryOpenFrontDoor(){
  if (!frontDoor || doorOpen) return;
  const dist = BABYLON.Vector3.Distance(playerCapsule.position, frontDoor.getAbsolutePosition());
  if (dist > 2.5) return;
  // rotate around local Y a bit; also disable collisions to pass through
  frontDoor.rotate(BABYLON.Axis.Y, -Math.PI*0.5, BABYLON.Space.LOCAL);
  frontDoor.checkCollisions = false;
  doorOpen = true;
  // sound
  snd.doorCreak.volume = 0.4; snd.doorCreak.currentTime = 0; snd.doorCreak.play().catch(()=>{});
}

/* =========================
   Ghost spawn & simple AI
========================= */
function randomPointInBounds(){
  // simple rectangle between min/max XZ of bounds
  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
  BOUNDS.forEach(v=>{ minX=Math.min(minX,v.x); maxX=Math.max(maxX,v.x);
                      minZ=Math.min(minZ,v.z); maxZ=Math.max(maxZ,v.z); });
  const x = minX + Math.random()*(maxX-minX);
  const z = minZ + Math.random()*(maxZ-minZ);
  return new BABYLON.Vector3(x, 0.9, z);
}
function spawnGhost(){
  const src = GHOST_LIST[Math.floor(Math.random()*GHOST_LIST.length)];
  ghostName = src.split("/").pop().replace(".glb","").toUpperCase();
  BABYLON.SceneLoader.ImportMeshAsync("", "", src, scene).then(res=>{
    ghostMesh = res.meshes.find(m=>m.name && m.name!=="__root__") || res.meshes[0];
    if (!ghostMesh) return;
    // make parent transform
    const pivot = new BABYLON.TransformNode("ghostPivot", scene);
    ghostMesh.parent = pivot;
    pivot.position = randomPointInBounds();
    // upright orientation fix
    ghostMesh.rotationQuaternion = null;
    ghostMesh.rotation.set(0, Math.PI, 0);
    // scale normalize if huge
    const bb = ghostMesh.getBoundingInfo().boundingBox.extendSizeWorld;
    const maxSide = Math.max(bb.x, bb.y, bb.z);
    const scale = (maxSide>1.0) ? (1.0/maxSide) : 1.0;
    ghostMesh.scaling.setAll(scale*1.2);

    // idle initially
    ghostIdle = true;
    say("Ghost spawned: " + ghostName);
  });
}

// wander logic
let ghostTimer = 0;
function updateGhost(dt){
  if (!ghostMesh) return;
  const pivot = ghostMesh.parent;
  ghostTimer -= dt;
  if (ghostTimer <= 0){
    ghostTimer = 2 + Math.random()*3;
    // choose new target within bounds; point pivot toward it
    const target = randomPointInBounds();
    ghostMoveDir = target.subtract(pivot.position); ghostMoveDir.y = 0;
    const dist = ghostMoveDir.length();
    ghostIdle = dist < 1.5;
    if (!ghostIdle){
      ghostMoveDir.normalize();
      const ry = Math.atan2(ghostMoveDir.x, ghostMoveDir.z);
      pivot.rotation.y = ry;
    }
  }
  if (!ghostIdle){
    pivot.position.addInPlace(ghostMoveDir.scale(ghostSpeed));
    // keep ghost above ground using same snap helper (temporary Vector3)
    const origin = pivot.position.add(new BABYLON.Vector3(0, 3, 0));
    const ray = new BABYLON.Ray(origin, new BABYLON.Vector3(0,-1,0), 10);
    const hit = scene.pickWithRay(ray, m=>m.checkCollisions===true);
    if (hit && hit.hit) pivot.position.y = hit.pickedPoint.y + 0.05;
  }
}

/* =========================
   Spawning player
========================= */
function spawnAtVan(){
  const mid = BABYLON.Vector3.Center(VAN_A, VAN_B);
  playerCapsule.position.copyFrom(mid);
  playerCapsule.position.y = Math.max(playerCapsule.position.y, 1.2); // ensure above floor
  camera.rotation.set(0, Math.PI, 0);
  hudRoom.textContent = "Outside";
}

/* =========================
   Dev mode
========================= */
let devMode = false;
let godMode = false;
const devPrompt = document.getElementById('devPrompt');
const devPanel = document.getElementById('devPanel');

function toggleDevPrompt(){
  devPrompt.style.display = (devPrompt.style.display==='flex')?'none':'flex';
  devPrompt.style.alignItems = 'center'; devPrompt.style.justifyContent='center';
}
document.getElementById('devCancel').onclick = ()=> devPrompt.style.display='none';
document.getElementById('devOk').onclick = ()=>{
  const pw = document.getElementById('devPass').value.trim();
  if (pw === 'devmode'){
    devMode = true; devPrompt.style.display = 'none'; devPanel.style.display='block';
    say("Developer mode enabled.");
  } else {
    say("Wrong password.");
  }
};
document.getElementById('btnGod').onclick = ()=>{ godMode = !godMode; say("God Mode: " + (godMode?"ON":"OFF")); };
document.getElementById('btnTeleportGhost').onclick = ()=>{
  if (!ghostMesh) return;
  const pivot = ghostMesh.parent;
  playerCapsule.position.copyFrom(pivot.position.add(new BABYLON.Vector3(0,1.2, -1.5)));
  say("Teleported near ghost.");
};
document.getElementById('btnPing').onclick = ()=>{
  const p = playerCapsule.position;
  say(`PING @ x:${p.x.toFixed(3)} y:${p.y.toFixed(3)} z:${p.z.toFixed(3)}`);
};
document.getElementById('btnRecenter').onclick = ()=> spawnAtVan();
document.getElementById('btnRevealGhost').onclick = ()=> say(`Ghost: ${ghostName}`);

/* =========================
   Interact / Use
========================= */
function useActiveItem(){
  const name = hotbar[activeSlot];
  if (!name) return;
  // placeholder behaviors; real evidence logic would go here
  say(`Used: ${name}`);
}
function tryInteract(){
  // open front door if close
  tryOpenFrontDoor();
}

/* =========================
   Lightning schedule for rain
========================= */
function updateLightning(dt){
  if (weather !== "Rain") return;
  lightningTimer -= dt;
  if (lightningTimer <= 0){
    lightningTimer = 4 + Math.random()*6;
    flashLightning();
  }
}

/* =========================
   Main render loop
========================= */
engine.runRenderLoop(function(){
  const dt = scene.getEngine().getDeltaTime()/1000;

  // movement
  const mv = moveVector(dt);
  const g = scene.gravity; // gravity vector
  playerCapsule.moveWithCollisions(mv.add(g));
  snapToGround(); // << keep glued to nearest valid floor

  // HUD updates
  updateStorageVisibility();
  hudSanity.textContent = "100%"; // (placeholder for your sanity logic)

  // Use / Interact (they do NOT auto-fire, only if pressed)
  if (keys.e){ tryInteract(); }
  if (keys.mouse){ /* keep for camera shooting in future; not auto-using items */ }

  updateLightning(dt);
  updateGhost(dt);

  scene.render();
});
window.addEventListener('resize', ()=>engine.resize());
</script>
