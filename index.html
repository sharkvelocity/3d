<!DOCTYPE html>

  <script src="./cdn/earcut.min.js"></script>
  <script src="./cdn/meshopt_decoder.js"></script>
  <script src="./cdn/draco_decoder_gltf.js"></script>

<script>
(function(){
  // 1) Your maps here
  window.MAP_REGISTRY = {
    "Jailhouse": "./assets/models/map/jailhouse.glb",
    // "Farmhouse": "./assets/models/map/farmhouse.glb",
    // "School":    "./assets/models/map/school.glb"
  };

  // 2) resolve default map
  const sel   = document.getElementById('map-select');
  const stat  = document.getElementById('map-status');
  const saved = localStorage.getItem('PP_MAP');
  const first = Object.keys(MAP_REGISTRY)[0];
  const key   = (saved && MAP_REGISTRY[saved]) ? saved : first;

  // expose early for map.js
  window.MAP_URL = MAP_REGISTRY[key];

  // build dropdown
  sel.innerHTML = '';
  for (const [label, url] of Object.entries(MAP_REGISTRY)) {
    const o = document.createElement('option');
    o.value = label; o.textContent = label; o.dataset.url = url;
    if (label === key) o.selected = true;
    sel.appendChild(o);
  }

  async function head(u){
    try { const r = await fetch(u, { method:'HEAD', cache:'no-cache' }); return r.ok; }
    catch { return false; }
  }
  // warm the browser cache with a lightweight GET
  async function warm(u){
    try { await fetch(u, { method:'GET', cache:'force-cache' }); } catch {}
  }

  async function updateStatus(u){
    stat.textContent = 'Checking…'; stat.style.color = '#9ff';
    const ok = await head(u);
    if (ok) {
      stat.textContent = 'OK';
      stat.style.color = '#9ff';
      warm(u); // pull into HTTP cache so start is snappier
    } else {
      stat.textContent = '⚠ missing';
      stat.style.color = '#f88';
    }
  }

  updateStatus(window.MAP_URL);

  sel.addEventListener('change', async ()=>{
    const k = sel.value;
    const u = MAP_REGISTRY[k];
    window.MAP_URL = u;
    localStorage.setItem('PP_MAP', k);
    updateStatus(u);
  });

  // Re-assert the selected URL right before the game starts
  document.getElementById('start-button')?.addEventListener('click', ()=>{
    const k = sel.value;
    window.MAP_URL = MAP_REGISTRY[k];
    localStorage.setItem('PP_MAP', k);
  }, { capture:true });
})();
</script>

  <style>

    #renderCanvas { width:100vw; height:100vh; display:block; background:#000; outline:none; }

    #loading-box{ position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(0,0,0,0.92); z-index:2147483000; color:#9ef; font-family:monospace; }
    #loading-logo{ width:240px; max-width:60vw; opacity:0.95; filter:drop-shadow(0 0 10px #0ff4); }
    #loading-text{ font-size:16px; letter-spacing:.3px; text-align:center; max-width:70vw; }
    #loading-bar{ width:64vw; max-width:720px; height:14px; border:1px solid #066; border-radius:10px; background:#071017; overflow:hidden; }

    #title-screen{ position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:9999; }
    #title-logo{ max-width:60vw; max-height:35vh; object-fit:contain; }

    #hud-bar{ position:fixed; top:10px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:6000; }
    .chip { padding:2px 6px; border:1px solid #066; border-radius:6px; color:#aff; font-size:12px; background:rgba(0,0,0,0.5); }
    .sanity-wrap{ display:flex; align-items:center; gap:6px; padding:0 6px; }
    #sanity-gauge{ width:170px; height:10px; border:1px solid #066; background:#061013; border-radius:8px; overflow:hidden; }
    #sanity-fill{ width:100%; height:100%; background:linear-gradient(90deg,#19f,#0ff); transition:width .25s ease; }
    #hud-xyz { position:fixed; top:36px; right:12px; background:rgba(0,0,0,0.5); border:1px solid #066; padding:6px 8px; color:#0ff; font:12px monospace; z-index:6000; display:none; }

    #belt{ position:fixed; left:50%; bottom:72px; transform:translateX(-50%); display:flex; gap:12px; z-index:6000; align-items:center; background:rgba(0,0,0,0.55); border:1px solid #066; padding:8px 10px; border-radius:10px; }

    #toast{ position:fixed; left:50%; top:16px; transform:translateX(-50%); background:rgba(0,0,0,0.7); border:1px solid #066; border-radius:8px; padding:8px 12px; color:#0ff; z-index:10001; display:none; max-width:70vw; text-align:center; }
  </style>
</head>
<body>
  <div id="loading-box" aria-live="polite">
    <img src="logo.png" alt="Logo" id="loading-logo">
    <div id="loading-text">Initializing…</div>
    <div id="loading-bar"><div id="loading-fill" style="width:0%"></div></div>
  </div>

  <div id="title-screen">
    <img id="title-logo" src="./logo.png" alt="PhasmaPhoney Logo" />
    <button id="start-button">Start</button>
    <div id="map-wrap">
      <span>Map:</span>
      <select id="map-select">
        <option value="-1">(loading maps...)</option>
      </select>
      <!-- status text restored -->
      <span id="map-status" style="margin-left:8px;color:#9ff;">Checking…</span>
    </div>
  </div>

  <!-- Map registry + pre-check (restored) -->
  <script>
  (function(){
    // 1) your maps here
    window.MAP_REGISTRY = {
      "Jailhouse": "./assets/models/map/jailhouse.glb",
      // "Farmhouse": "./assets/models/map/farmhouse.glb",
      // "School":    "./assets/models/map/school.glb"
    };

    const sel  = document.getElementById('map-select');
    const stat = document.getElementById('map-status');

    // 2) resolve default + expose MAP_URL early for your loader
    const saved = localStorage.getItem('PP_MAP');
    const first = Object.keys(MAP_REGISTRY)[0];
    const key   = (saved && MAP_REGISTRY[saved]) ? saved : first;
    window.MAP_URL = MAP_REGISTRY[key];

    // 3) build dropdown
    sel.innerHTML = '';
    for (const [label, url] of Object.entries(MAP_REGISTRY)) {
      const o = document.createElement('option');
      o.value = label; o.textContent = label; o.dataset.url = url;
      if (label === key) o.selected = true;
      sel.appendChild(o);
    }

    async function head(u){
      try { const r = await fetch(u, { method:'HEAD', cache:'no-cache' }); return r.ok; }
      catch { return false; }
    }
    async function warm(u){ try { await fetch(u, { method:'GET', cache:'force-cache' }); } catch {} }

    async function updateStatus(u){
      if (!stat) return;
      stat.textContent = 'Checking…'; stat.style.color = '#9ff';
      const ok = await head(u);
      if (ok) { stat.textContent = 'OK'; stat.style.color = '#9ff'; warm(u); }
      else    { stat.textContent = '⚠ missing'; stat.style.color = '#f88'; }
    }

    updateStatus(window.MAP_URL);

    sel.addEventListener('change', ()=>{
      const k = sel.value;
      const u = MAP_REGISTRY[k];
      window.MAP_URL = u;
      localStorage.setItem('PP_MAP', k);
      updateStatus(u);
    });

    // Re-assert selection right before Start handlers run
    document.getElementById('start-button')?.addEventListener('click', ()=>{
      const k = sel.value;
      window.MAP_URL = MAP_REGISTRY[k];
      localStorage.setItem('PP_MAP', k);
    }, { capture:true });

    // --- Optional: true Babylon pre-parse (toggle) ---
    const WANT_PREPARSE = false; // set true to actually parse GLB in background
    if (WANT_PREPARSE) {
      (function preparse(){
        function waitEngine(){
          return new Promise(res=>{
            (function poll(){
              const eng = BABYLON.Engine?.LastCreatedEngine || BABYLON.EngineStore?.LastCreatedEngine;
              if (eng) return res(eng);
              setTimeout(poll, 60);
            })();
          });
        }
        async function doLoad(url){
          try{
            const engine = await waitEngine();
            const preScene = new BABYLON.Scene(engine);
            BABYLON.SceneLoader.LoadAssetContainer(url, null, preScene, (container)=>{
              window.__PRELOADED_MAP__ = { url, container, preScene };
              if (stat){ stat.textContent = 'Ready'; stat.style.color = '#9ff'; }
            });
          }catch(e){ console.warn('[map preparse] failed', e); }
        }
        // kick once URL exists
        (function kick(){ if (!window.MAP_URL) return setTimeout(kick, 60); doLoad(window.MAP_URL); })();
        // re-preparse on selection change
        sel.addEventListener('change', ()=> doLoad(window.MAP_URL));
      })();
    }
  })();
  </script>

  <canvas id="renderCanvas" tabindex="0"></canvas>

  <script>
  (function hookAudioStart(){
    function attach(){
      var btn = document.getElementById('start-button') || document.querySelector('[data-start]');
      if (!btn){ return setTimeout(attach, 100); }
      btn.addEventListener('click', function once(){
        btn.removeEventListener('click', once);
        try { PP && PP.audio && PP.audio.init(); } catch(e){ console.warn('[audio.init] failed', e); }
      });
    }
    attach();
  })();
  </script>

  <script src="./assets/dev/util/player_rig_controller_final.js"></script>
