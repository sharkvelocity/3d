<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phasma‑Phoney WebGL — Tanglewood Final Accurate Build</title>
  <style>
    html, body {margin:0; padding:0; overflow:hidden; width:100%; height:100%;}
    #renderCanvas {width:100%; height:100%; display:block;}
    #hud {
      position:absolute; top:10px; left:10px; color:white; font-family:monospace;
      background:rgba(0,0,0,0.5); padding:8px; border-radius:6px;
    }
    #evidence-log {
      position:absolute; top:60px; left:10px; color:white; font-family:monospace;
      background:rgba(0,0,0,0.5); padding:8px; border-radius:6px;
    }
    #guess-ghost {
      margin-top:5px; display:block; background:black; color:white;
      border:1px solid white; cursor:pointer;
    }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">Sanity: <span id="sanity">100</span>%</div>
  <div id="evidence-log">
    Evidence: <span id="evidence-list">None</span>
    <button id="guess-ghost">Guess Ghost</button>
  </div>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);
let scene, player, sanity = 100;
const collectedEvidence = new Set();
let carriedItem = null;
let chosenGhostType = null;

function createScene() {
scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color3(0,0,0);
scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
scene.fogColor = new BABYLON.Color3(0.05,0.05,0.08);
scene.fogDensity = 0.02;

// === CAMERA & LIGHT ===
const camera = new BABYLON.ArcRotateCamera("camera",
  BABYLON.Tools.ToRadians(45), BABYLON.Tools.ToRadians(80), 28,
  new BABYLON.Vector3(0,0,0), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = camera.upperRadiusLimit = 28;

const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0,1,0), scene);
light.intensity = 0.5;

// === FLOOR PLAN (Exact to Reference Map) ===
function makeRoom(name, x, z, w, h, color) {
  const room = BABYLON.MeshBuilder.CreateGround(name,{width:w,height:h},scene);
  room.position.set(x,0,z);
  room.material = new BABYLON.StandardMaterial(`${name}Mat`,scene);
  room.material.diffuseColor=color;
  room.checkCollisions=true; return room;
}

const livingColor=new BABYLON.Color3(0.2,0.2,0.25),
kitchenColor=new BABYLON.Color3(0.25,0.25,0.2),
bedroomColor=new BABYLON.Color3(0.25,0.2,0.2),
bathColor=new BABYLON.Color3(0.2,0.25,0.25),
hallColor=new BABYLON.Color3(0.3,0.3,0.3);

// === Accurate Room Placement (meters scaled) ===
// Aligned according to the reference map
makeRoom("Garage", -6.5,-4.5,7,7, hallColor);
makeRoom("Utility", -3.5,-1,2.5,3, hallColor);
makeRoom("Kitchen", -2.5,2.5,3,3, kitchenColor);
makeRoom("Dining", 1,4.5,4,3, kitchenColor);
makeRoom("Living", 1,1,6,6, livingColor);
makeRoom("Foyer", -1,1,2,2, hallColor);
makeRoom("MainBathroom", -1,5,2,2, bathColor);
makeRoom("BoysBedroom", -1,7.5,4,3, bedroomColor);
makeRoom("Nursery", 3,7.5,3,3, bedroomColor);
makeRoom("MasterBedroom", 5.5,5,4,4, bedroomColor);
makeRoom("Bathroom", 7,3,2,2, bathColor);
makeRoom("Hallway", 4,1,2,3, hallColor);
makeRoom("BasementHatch", -0.5,-3.5,1,1, bathColor);
// === WALLS (Accurate Per Reference Map) ===
const wallMat=new BABYLON.StandardMaterial("wallMat",scene);
wallMat.diffuseColor=new BABYLON.Color3(0.45,0.45,0.45);

function solidWall(x,z,length,rot=0){
  const w=BABYLON.MeshBuilder.CreateBox("wall",{width:length,height:2.5,depth:0.2},scene);
  w.position.set(x,1.25,z); w.rotation.y=rot; w.material=wallMat; w.checkCollisions=true;
}

function wallWithDoor(x,z,length,doorWidth=2,rot=0){
  const half=(length-doorWidth)/2,dx=rot===0?0:half,dz=rot===0?half:0;
  const left=BABYLON.MeshBuilder.CreateBox("wall",{width:half,height:2.5,depth:0.2},scene);
  left.position.set(x-dx,1.25,z-dz);left.rotation.y=rot;left.material=wallMat;left.checkCollisions=true;
  const right=BABYLON.MeshBuilder.CreateBox("wall",{width:half,height:2.5,depth:0.2},scene);
  right.position.set(x+dx,1.25,z+dz);right.rotation.y=rot;right.material=wallMat;right.checkCollisions=true;
}

// === Perimeter Walls ===
solidWall(0,9,15,0);    // North
solidWall(0,-7.5,15,0); // South
solidWall(8,1,17,Math.PI/2); // East
solidWall(-8,1,17,Math.PI/2); // West

// === Interior Walls (Door gaps per reference) ===
// Garage / Utility / Kitchen
wallWithDoor(-3.5,-2.5,3,2,Math.PI/2);
wallWithDoor(-2.5,1,3,2,0);
wallWithDoor(-1,3.5,4,2,Math.PI/2);

// Kitchen / Dining / Living
solidWall(0,3.5,4,Math.PI/2);
wallWithDoor(3,3.5,4,2,Math.PI/2);
wallWithDoor(3,0,3,2,Math.PI/2);

// Hallway to Bedrooms
wallWithDoor(5,3.5,4,2,Math.PI/2);
wallWithDoor(5,6,4,2,Math.PI/2);
wallWithDoor(5,8,4,2,Math.PI/2);

// Bathroom, Foyer, Basement Hatch
wallWithDoor(7,3,2,2,0);
wallWithDoor(-1,0,3,2,Math.PI/2);
wallWithDoor(-0.5,-2,2,2,0);

// === DOOR MESHES (Placeholders for future open/close animation) ===
const doorMat=new BABYLON.StandardMaterial("doorMat",scene);
doorMat.diffuseColor=new BABYLON.Color3(0.3,0.2,0.1);

function addDoor(x,z,rot=0){
  const d=BABYLON.MeshBuilder.CreateBox("door",{width:1,height:2,depth:0.1},scene);
  d.position.set(x,1,z);d.rotation.y=rot;d.material=doorMat;return d;
}

// Example Door Placement
addDoor(-3.5,-2.5,Math.PI/2);  // Garage/Utility
addDoor(-2.5,1,0);             // Utility/Kitchen
addDoor(3,3.5,Math.PI/2);      // Dining/Living
addDoor(5,3.5,Math.PI/2);      // Hallway/Master

// === PROPS (Scaled & Oriented to Match Reference) ===
function makeBox(name,x,y,z,w,h,d,color,rot=0){
  const box=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);
  box.position.set(x,y+h/2,z);
  box.material=new BABYLON.StandardMaterial(`${name}Mat`,scene);
  box.material.diffuseColor=color; box.rotation.y=rot; box.checkCollisions=true;
  return box;
}

const wood=new BABYLON.Color3(0.4,0.25,0.15),
fabric=new BABYLON.Color3(0.3,0.3,0.35),
metal=new BABYLON.Color3(0.6,0.6,0.6),
white=new BABYLON.Color3(0.9,0.9,0.9);

// Living Room
makeBox("Couch",1,0,3.5,3,1,1,fabric,Math.PI);
makeBox("CoffeeTable",1,0,2.5,2,0.5,1,wood);
makeBox("TV",1,1,1.5,2,1,0.2,new BABYLON.Color3(0,0,0));

// Kitchen & Dining
makeBox("DiningTable",1,0,4.5,3,0.7,1.5,wood);
makeBox("KitchenCounter",-2.5,0,2.5,3,1,0.5,metal);
makeBox("Fridge",-2.5,0,1.5,1,2,1,white,Math.PI/2);

// Bedrooms
makeBox("MasterBed",6,0,5.5,3,0.6,2,fabric,Math.PI/2);
makeBox("BoyBed",-1,0,7.5,2.5,0.6,1.5,fabric);
makeBox("Crib",3,0,7.5,1.5,0.8,1,white);

// Bathroom & Utility
makeBox("Bathtub",7,0,3,2,0.8,1,white);
makeBox("Washer",-3.5,0,-1,1,1,1,white);

// Garage
makeBox("Car",-6.5,0,-4.5,4,1.5,6,metal);
// === PLAYER SETUP ===
player = BABYLON.MeshBuilder.CreateSphere("player",{diameter:1},scene);
player.position.y=0.5;
const pMat=new BABYLON.StandardMaterial("pMat",scene);
pMat.diffuseColor=new BABYLON.Color3(0,1,0);
player.material=pMat;
scene.collisionsEnabled=true; player.checkCollisions=true;

const keys={w:false,a:false,s:false,d:false};
window.addEventListener("keydown",e=>{if(keys[e.key.toLowerCase()]!==undefined)keys[e.key.toLowerCase()]=true;});
window.addEventListener("keyup",e=>{if(keys[e.key.toLowerCase()]!==undefined)keys[e.key.toLowerCase()]=false;});

scene.onBeforeRenderObservable.add(()=>{
  const sp=0.1;
  const move=new BABYLON.Vector3((keys.a?-sp:0)+(keys.d?sp:0),0,(keys.w?-sp:0)+(keys.s?sp:0));
  player.moveWithCollisions(move);
});

// === LIGHTING & AMBIENT EFFECTS ===
const roomLights=[];
function addRoomLight(x,z,intensity=0.6){
  const l=new BABYLON.PointLight("roomLight",new BABYLON.Vector3(x,2.5,z),scene);
  l.diffuse=new BABYLON.Color3(1,1,0.9);l.intensity=intensity;roomLights.push(l);return l;
}
addRoomLight(1,3.5);addRoomLight(-2.5,2.5);addRoomLight(6,5.5);
addRoomLight(-6.5,-4.5);addRoomLight(3,7.5);addRoomLight(-1,7.5);

function randomFlicker(){
  const light=roomLights[Math.floor(Math.random()*roomLights.length)];
  const orig=light.intensity;let c=0;
  const i=setInterval(()=>{
    light.intensity=Math.random()>0.5?0:orig;
    if(++c>5){light.intensity=orig;clearInterval(i);}
  },100);
}
setInterval(()=>{if(Math.random()<0.3)randomFlicker();},3000);

function randomAmbientSound(){
  const s=[
    "👣 Footsteps echo near the hallway...",
    "📦 A thud in the garage...",
    "🕯 Whisper brushes past your ear..."
  ];
  console.log(s[Math.floor(Math.random()*s.length)]);
}
function randomObjectMove(){
  const p=["Couch","DiningTable","Crib"];
  const item=scene.getMeshByName(p[Math.floor(Math.random()*p.length)]);
  if(item){const o=item.position.y;item.position.y=o+0.1;setTimeout(()=>item.position.y=o,300);}
}
setInterval(()=>{if(Math.random()<0.5)randomAmbientSound();},5000);
setInterval(()=>{if(Math.random()<0.2)randomObjectMove();},8000);

// === GHOST LOGIC ===
const ghostProfiles = {
  Spirit:{evidence:["EMF Level 5","Spirit Box","Ghost Writing"]},
  Wraith:{evidence:["EMF Level 5","Spirit Box","D.O.T.S Projector"]},
  Phantom:{evidence:["Spirit Box","Fingerprints","D.O.T.S Projector"]},
  Poltergeist:{evidence:["Spirit Box","Fingerprints","Ghost Writing"]},
  Banshee:{evidence:["Fingerprints","Ghost Orbs","D.O.T.S Projector"]},
  Jinn:{evidence:["EMF Level 5","Fingerprints","Freezing Temps"]},
  Revenant:{evidence:["Ghost Orbs","Ghost Writing","Freezing Temps"]},
  Shade:{evidence:["EMF Level 5","Ghost Writing","Freezing Temps"]},
  Demon:{evidence:["Fingerprints","Ghost Writing","Freezing Temps"]},
  Yurei:{evidence:["Ghost Orbs","Freezing Temps","D.O.T.S Projector"]},
  Oni:{evidence:["EMF Level 5","Freezing Temps","D.O.T.S Projector"]},
  Hantu:{evidence:["Fingerprints","Ghost Orbs","Freezing Temps"]},
  Goryo:{evidence:["EMF Level 5","Fingerprints","D.O.T.S Projector"]},
  Myling:{evidence:["EMF Level 5","Fingerprints","Ghost Writing"]},
  Onryo:{evidence:["Spirit Box","Ghost Orbs","Freezing Temps"]},
  Twins:{evidence:["EMF Level 5","Spirit Box","Freezing Temps"]},
  Raiju:{evidence:["EMF Level 5","Ghost Orbs","D.O.T.S Projector"]},
  Obake:{evidence:["EMF Level 5","Fingerprints","Ghost Orbs"]},
  Mimic:{evidence:["Spirit Box","Fingerprints","Freezing Temps"]},
  Succubus:{evidence:["Spirit Box","Ghost Writing","D.O.T.S Projector"]}
};

const tanglewoodRooms=[
  {name:"Living",x:1,z:3.5},{name:"Dining",x:1,z:4.5},{name:"Kitchen",x:-2.5,z:2.5},
  {name:"Master Bedroom",x:6,z:5.5},{name:"Boy Bedroom",x:-1,z:7.5},
  {name:"Nursery",x:3,z:7.5},{name:"Bathroom",x:7,z:3},
  {name:"Utility",x:-3.5,z:-1},{name:"Garage",x:-6.5,z:-4.5}
];

let ghost={currentRoom:null,mesh:null};

function spawnGhost(){
  const room=tanglewoodRooms[Math.floor(Math.random()*tanglewoodRooms.length)];
  ghost.currentRoom=room;
  if(!chosenGhostType){
    const keys=Object.keys(ghostProfiles);
    chosenGhostType=keys[Math.floor(Math.random()*keys.length)];
    console.log(`👻 Ghost Type: ${chosenGhostType}`);
  }
  if(!ghost.mesh){
    ghost.mesh=BABYLON.MeshBuilder.CreateSphere("ghost",{diameter:1.2},scene);
    ghost.mesh.material=new BABYLON.StandardMaterial("ghostMat",scene);
    ghost.mesh.material.diffuseColor=new BABYLON.Color3(1,1,1);
    ghost.mesh.material.alpha=0.4;
  }
  ghost.mesh.position.set(room.x,0.6,room.z);
}
function moveGhost(){
  const room=tanglewoodRooms[Math.floor(Math.random()*tanglewoodRooms.length)];
  ghost.currentRoom=room;
  ghost.mesh.position.set(room.x,0.6,room.z);
}
setInterval(moveGhost,10000); spawnGhost();

// === SANITY DRAIN ===
scene.onBeforeRenderObservable.add(()=>{
  const d=BABYLON.Vector3.Distance(player.position,ghost.mesh.position);
  if(d<3){
    sanity=Math.max(0,sanity-0.02);
    document.getElementById("sanity").textContent=sanity.toFixed(0);
  }
});

// === EVIDENCE SYSTEM ===
const evidence={emfReader:null,writingBook:null,dotsProjector:null};
function placeEvidence(){
  evidence.emfReader=BABYLON.MeshBuilder.CreateBox("emfReader",{width:0.4,height:0.2,depth:0.8},scene);
  evidence.emfReader.material=new BABYLON.StandardMaterial("emfMat",scene);
  evidence.emfReader.material.diffuseColor=new BABYLON.Color3(0,0.3,0);
  evidence.emfReader.position.set(1,0.1,3.5);

  evidence.writingBook=BABYLON.MeshBuilder.CreateBox("writingBook",{width:0.6,height:0.1,depth:0.8},scene);
  evidence.writingBook.material=new BABYLON.StandardMaterial("bookMat",scene);
  evidence.writingBook.material.diffuseColor=new BABYLON.Color3(0.5,0.5,0.4);
  evidence.writingBook.position.set(6,0.05,5.5);

  evidence.dotsProjector=BABYLON.MeshBuilder.CreatePlane("dotsProjector",{width:3,height:3},scene);
  evidence.dotsProjector.position.set(ghost.currentRoom.x,1.5,ghost.currentRoom.z);
  evidence.dotsProjector.rotation.x=Math.PI/2;
  const dm=new BABYLON.StandardMaterial("dotsMat",scene);
  dm.diffuseColor=new BABYLON.Color3(0,1,0);dm.alpha=0.2;
  evidence.dotsProjector.material=dm;
}
placeEvidence();

// Pickup & Drop Logic
window.addEventListener("keydown",e=>{
  if(e.key.toLowerCase()==="e")pickUpNearest();
  if(e.key.toLowerCase()==="q")dropItem();
});
function pickUpNearest(){
  if(carriedItem)return;
  const items=[evidence.emfReader,evidence.writingBook,evidence.dotsProjector];
  let nearest=null,min=2;
  items.forEach(it=>{
    const d=BABYLON.Vector3.Distance(player.position,it.position);
    if(d<min&&!it.isPicked){nearest=it;min=d;}
  });
  if(nearest){carriedItem=nearest;nearest.isPicked=true;console.log(`✅ Picked up ${nearest.name}`);}
}
function dropItem(){
  if(!carriedItem)return;
  carriedItem.position.copyFrom(player.position).addInPlace(new BABYLON.Vector3(0,0,0.5));
  carriedItem.isPicked=false;console.log(`⬇️ Dropped ${carriedItem.name}`);carriedItem=null;
}

function logEvidence(type){
  if(!collectedEvidence.has(type)){
    collectedEvidence.add(type);
    document.getElementById("evidence-list").textContent=[...collectedEvidence].join(", ");
  }
}
function ghostHasEvidence(type){return ghostProfiles[chosenGhostType].evidence.includes(type);}

// Orbs & Freezing Temps
const orbMat=new BABYLON.StandardMaterial("orbMat",scene);
orbMat.emissiveColor=new BABYLON.Color3(1,1,1);
function spawnOrb(){
  const o=BABYLON.MeshBuilder.CreateSphere("orb",{diameter:0.2},scene);
  o.material=orbMat;
  o.position.copyFrom(ghost.mesh.position).addInPlace(new BABYLON.Vector3(Math.random()-0.5,1,Math.random()-0.5));
  o.material.alpha=0.7;setTimeout(()=>o.dispose(),3000);
}
function freezingBreath(){
  const p=BABYLON.MeshBuilder.CreateSphere("puff",{diameter:0.1},scene);
  p.position.copyFrom(player.position).addInPlace(new BABYLON.Vector3(0,1,0));
  const pm=new BABYLON.StandardMaterial("puffMat",scene);
  pm.diffuseColor=new BABYLON.Color3(0.8,0.9,1);pm.alpha=0.5;p.material=pm;setTimeout(()=>p.dispose(),500);
}

// Main Evidence Loop
scene.onBeforeRenderObservable.add(()=>{
  if(carriedItem){carriedItem.position.copyFrom(player.position).addInPlace(new BABYLON.Vector3(0,0.5,0.5));}

  if(!evidence.emfReader.isPicked&&ghostHasEvidence("EMF Level 5")&&
     BABYLON.Vector3.Distance(evidence.emfReader.position,ghost.mesh.position)<3){
    evidence.emfReader.material.diffuseColor=new BABYLON.Color3(1,0,0);
    logEvidence("EMF Level 5");
  } else evidence.emfReader.material.diffuseColor=new BABYLON.Color3(0,0.3,0);

  if(!evidence.writingBook.isPicked&&ghostHasEvidence("Ghost Writing")&&
     BABYLON.Vector3.Distance(evidence.writingBook.position,ghost.mesh.position)<2){
    if(!evidence.writingBook.hasWritten&&Math.random()<0.001){
      evidence.writingBook.hasWritten=true;
      evidence.writingBook.material.diffuseColor=new BABYLON.Color3(0.2,0.2,0.2);
      logEvidence("Ghost Writing");
    }
  }

  if(!evidence.dotsProjector.isPicked&&ghostHasEvidence("D.O.T.S Projector")&&
     BABYLON.Vector3.Distance(evidence.dotsProjector.position,ghost.mesh.position)<3&&Math.random()<0.002){
    evidence.dotsProjector.material.alpha=0.8;
    setTimeout(()=>evidence.dotsProjector.material.alpha=0.2,500);
    logEvidence("D.O.T.S Projector");
  }
});

// Ambient Orbs & Freezing Temps near ghost
setInterval(()=>{
  if(BABYLON.Vector3.Distance(player.position,ghost.mesh.position)<3){
    if(ghostHasEvidence("Ghost Orbs")&&Math.random()<0.4)spawnOrb();
    if(ghostHasEvidence("Freezing Temps")&&Math.random()<0.2)freezingBreath();
  }
},1000);

// === INVESTIGATION FLOW ===
document.getElementById("guess-ghost").onclick=openGhostGuess;
function openGhostGuess(){
  const g=prompt(`Choose your ghost:\n${Object.keys(ghostProfiles).join(", ")}`);
  if(!g)return; endInvestigation(g);
}
function endInvestigation(guess){
  const success=guess.toLowerCase()===chosenGhostType.toLowerCase();
  alert(`You guessed: ${guess}
Correct Ghost: ${chosenGhostType}
${success?"✅ Correct!":"❌ Wrong!"}
Evidence Found: ${[...collectedEvidence].join(", ")}
Sanity left: ${sanity.toFixed(0)}%`);
  location.reload();
}

return scene;
}

scene=createScene();
engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize",()=>engine.resize());
</script>
</body>
</html>
