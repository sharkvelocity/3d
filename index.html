<style>
html, body { margin:0; height:100%; width:100%; background:#000; overflow:hidden; font-family:monospace; color:#0ff; touch-action:none; }
#renderCanvas { width:100vw; height:100vh; display:block; background:#000; outline:none; }
#loading-box{ position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(0,0,0,0.92); z-index:2147483000; color:#9ef; }
#loading-logo{ width:240px; max-width:60vw; opacity:0.95; filter:drop-shadow(0 0 10px #0ff4); }
#loading-text{ font-size:16px; letter-spacing:.3px; text-align:center; max-width:70vw; }
#loading-bar{ width:64vw; max-width:720px; height:14px; border:1px solid #066; border-radius:10px; background:#071017; overflow:hidden; }
#loading-fill{ height:100%; width:0%; background:linear-gradient(90deg,#19f,#0ff); transition:width .15s ease; }

#title-screen{ position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:9999; }
#title-logo{ max-width:60vw; max-height:35vh; object-fit:contain; }
#start-button{ padding:14px 28px; font-size:22px; cursor:pointer; border:2px solid #0ff; color:#0ff; background:#111; }

#hud-overlay{ position:fixed; inset:0; pointer-events:none; z-index:6000; }
#hud-bar{ position:fixed; top:10px; left:50%; transform:translateX(-50%); display:none; gap:8px; z-index:6000; }
.chip { padding:2px 6px; border:1px solid #066; border-radius:6px; color:#aff; font-size:12px; background:rgba(0,0,0,0.5); }
.sanity-wrap{ display:flex; align-items:center; gap:6px; padding:0 6px; }
#sanity-gauge{ width:170px; height:10px; border:1px solid #066; background:#061013; border-radius:8px; overflow:hidden; }
#sanity-fill{ width:100%; height:100%; background:linear-gradient(90deg,#19f,#0ff); transition:width .25s ease; }
#sanity-text{ margin-left:6px; }
#hud-xyz { position:fixed; top:36px; right:12px; background:rgba(0,0,0,0.5); border:1px solid #066; padding:6px 8px; color:#0ff; font:12px monospace; z-index:6000; }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-box" aria-live="polite">
  <img src="logo.png" alt="Logo" id="loading-logo">
  <div id="loading-text">Initializing…</div>
  <div id="loading-bar"><div id="loading-fill"></div></div>
</div>

<!-- Title / Start -->
<div id="title-screen">
  <img id="title-logo" src="./logo.png" alt="PhasmaPhoney Logo" />
  <button id="start-button">Start Investigation</button>
  <div id="map-wrap">
    <span>Map:</span>
    <select id="map-select"><option value="-1">(loading maps...)</option></select>
  </div>
</div>

<!-- Canvas -->
<canvas id="renderCanvas" tabindex="0"></canvas>

<!-- HUD Overlay -->
<div id="hud-overlay">
  <div id="hud-bar">
    <div class="chip sanity-wrap">
      <span>Sanity:</span>
      <div id="sanity-gauge"><div id="sanity-fill"></div></div>
      <span id="sanity-text">100%</span>
    </div>
    <div class="chip">Weather: <span id="hud-weather">Clear</span></div>
    <div class="chip">Temp: <span id="hud-temp">20°C</span></div>
  </div>
  <div id="hud-xyz">XYZ: <span id="hud-pos">0,0,0</span></div>
</div>

<!-- ===================== HUD INIT ===================== -->
<script>
(function(){
  const sanityFill = document.getElementById("sanity-fill");
  const sanityText = document.getElementById("sanity-text");
  const hudPos = document.getElementById("hud-pos");
  const hudWeather = document.getElementById("hud-weather");
  const hudTemp = document.getElementById("hud-temp");

  window.updateSanity = function(value){
    if (!sanityFill || !sanityText) return;
    const clamped = Math.max(0, Math.min(100, value));
    sanityFill.style.width = clamped + "%";
    sanityFill.style.background = clamped > 50 ? "#0f0" : (clamped > 25 ? "#ff0" : "#f00");
    sanityText.textContent = clamped + "%";
  };

  window.updatePlayerPos = function(x,y,z){
    if (!hudPos) return;
    hudPos.textContent = x.toFixed(1)+","+y.toFixed(1)+","+z.toFixed(1);
  };

  window.updateWeather = function(type,temp){
    if (hudWeather) hudWeather.textContent = type;
    if (hudTemp) hudTemp.textContent = temp+"°C";
  };

  // init defaults
  setTimeout(()=>{ window.updateSanity(100); window.updateWeather("Clear",20); }, 0);
})();
</script>

<!-- ===================== START BUTTON + BOOTSTRAP ===================== -->
<script>
(async function(){
  const btn = document.getElementById('start-button');
  const loadingBox = document.getElementById('loading-box');
  const loadingFill = document.getElementById('loading-fill');

  if (!btn) return;

  btn.addEventListener('click', async function onStart(){
    // Remove title screen
    document.getElementById('title-screen')?.remove();

    // Show loading UI
    if (loadingBox) loadingBox.style.display = 'flex';
    if (loadingFill) loadingFill.style.width = '0%';

    window.__PP_ALREADY_STARTED__ = true;
    window.dispatchEvent(new CustomEvent('pp:start'));

    const canvas = document.getElementById('renderCanvas');
    try { canvas?.requestPointerLock?.(); } catch {}
    try { canvas?.focus?.(); } catch {}

    // Wait for Babylon scene
    let scene = window.SCENE || BABYLON.EngineStore.LastCreatedScene;
    while(!scene) {
      await new Promise(r => setTimeout(r, 50));
      scene = window.SCENE || BABYLON.EngineStore.LastCreatedScene;
    }
    window.scene = scene; // make global for weather + others

    // Progress: 10%
    if (loadingFill) loadingFill.style.width = '10%';

    // Enable collisions
    scene.collisionsEnabled = true;

    // Physics
    const havok = await HavokPhysics();
    scene.enablePhysics(new BABYLON.Vector3(0,-9.81,0), new BABYLON.HavokPlugin(true, havok));

    // Progress: 30%
    if (loadingFill) loadingFill.style.width = '30%';

    // Skybox
    const skybox = BABYLON.Mesh.CreateBox("skyBox", 1000.0, scene);
    const skyboxMaterial = new BABYLON.SkyMaterial("skyMaterial", scene);
    skyboxMaterial.backFaceCulling = false;
    skybox.material = skyboxMaterial;
    const anim = new BABYLON.Animation("cloudAnim", "turbidity", 30, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
    anim.setKeys([{frame:0,value:10},{frame:100,value:50},{frame:200,value:10}]);
    skyboxMaterial.animations.push(anim);
    scene.beginAnimation(skyboxMaterial, 0, 200, true);

    // Progress: 50%
    if (loadingFill) loadingFill.style.width = '50%';

    // Import map
    if (window.MAP_DEF?.file) {
      const mapPath = "./assets/models/map/" + window.MAP_DEF.file;
      BABYLON.SceneLoader.ImportMesh("", mapPath, "", scene, function(meshes){
        meshes.forEach(mesh=>{
          mesh.isPickable = true;
          mesh.checkCollisions = true;
          mesh.physicsImpostor = new BABYLON.PhysicsImpostor(
            mesh,
            BABYLON.PhysicsImpostor.MeshImpostor,
            { mass: 0, restitution: 0.1, friction: 0.8 },
            scene
          );
        });

        // Progress: 80%
        if (loadingFill) loadingFill.style.width = '80%';

        // Position player rig
        if (window.PP?.rig?.body){
          const sp = window.MAP_DEF?.spawn || {x:0,y:5,z:0};
          window.PP.rig.body.position.set(sp.x, sp.y, sp.z);

          if (!window.PP.rig.body.physicsImpostor){
            window.PP.rig.body.physicsImpostor = new BABYLON.PhysicsImpostor(
              window.PP.rig.body,
              BABYLON.PhysicsImpostor.CapsuleImpostor,
              { mass: 80, restitution:0, friction:0.5 },
              scene
            );
          }
        }

        // Progress: 100%
        if (loadingFill) loadingFill.style.width = '100%';

        // Hide loading box after short delay
        setTimeout(() => {
          if (loadingBox) loadingBox.style.display = 'none';
        }, 400);

      }, null, function(scene,msg,ex){
        console.error("Error loading map:", msg, ex);
      });
    }
  }, {once:true});
})();
</script>
