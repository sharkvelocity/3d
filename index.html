<script>
/* ============================================================
   GLOBALS (minimal scaffolding)
   ============================================================ */
const canvas = document.getElementById('renderCanvas');
let engine, scene, camera, skybox;
let moonLight, moonShadows, flashLight, flashShadows, uvLight, irLight, cloudMat;
let hemiLight = null;

let houseLights = []; let housePower = true;
let houseRoot = null;

let player = { sanity:100, room:'Van', speedWalk:0.9, speedRun:1.8, running:false, god:false };
let controls = { forward:false, back:false, left:false, right:false };

const weather = { state:'Clear', rainPS:null, snowPS:null, lightningTimer:0, nextStrike: 5 };
function scheduleNextLightning(){ weather.lightningTimer=0; weather.nextStrike = 3 + Math.random()*10; }
function lightningStrike(){ const overlay=document.getElementById('flash-overlay'); overlay.style.opacity='0.6'; setTimeout(()=>overlay.style.opacity='0', 120); }

function toast(msg, ms=1500){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', ms);
}
function inVanZone(pos){ return false; } // replace with your real van zone if needed
function updatePlayerFootsteps(dt){}  // placeholder, your real routine can override
function rebuildBelt(){}              // placeholder
function updateGhost(dt){}            // placeholder

/* ============================================================
   INPUT SYSTEM (WASD + pointer-lock mouse + touch halves)
   ============================================================ */
const InputSystem = (()=>{
  let move = {x:0,z:0}, running=false;
  let lookDelta = {x:0,y:0};
  let actionsQueue = [];
  let pointerLocked = false;

  const keys = new Set();
  const keyMap = {
    'KeyW':'fw','ArrowUp':'fw', 'KeyS':'bk','ArrowDown':'bk',
    'KeyA':'lt','ArrowLeft':'lt','KeyD':'rt','ArrowRight':'rt',
    'ShiftLeft':'run','ShiftRight':'run',
    'Digit1':'slot1','Digit2':'slot2','Digit3':'slot3','Digit4':'slot4','Digit5':'slot5',
    'KeyN':'openNotebook',
    'KeyF':'toggleFlash','KeyU':'toggleUV','KeyI':'toggleIR'
  };

  function recomputeMove(){
    const f = (keys.has('fw')?1:0) + (keys.has('bk')?-1:0);
    const r = (keys.has('rt')?1:0) + (keys.has('lt')?-1:0);
    move.z = f; move.x = r;
    running = keys.has('run');
  }
  function onKey(e,down){
    const tag = keyMap[e.code];
    if(tag){
      if(down) keys.add(tag); else keys.delete(tag);
      recomputeMove();
      if(down && /^slot[1-5]|openNotebook|toggle(F|U|IR)$/.test(tag)) actionsQueue.push(tag);
    }
  }

  function bindPointerLock(canvas){
    function pl(){ try{ canvas.requestPointerLock && canvas.requestPointerLock(); }catch{} }
    canvas.addEventListener('click', pl);
    document.addEventListener('pointerlockchange', ()=>{ pointerLocked=document.pointerLockElement===canvas; });
    document.addEventListener('mousemove', (e)=>{
      if(!pointerLocked) return;
      lookDelta.x += e.movementX||0;
      lookDelta.y += e.movementY||0;
    });
  }

  // Touch halves: left=move, right=look (each 50% width), start at 20% screen height
  function bindTouchHalves(){
    const left  = document.getElementById('touch-left');
    const right = document.getElementById('touch-right');
    let leftId=null, rightId=null;
    let lastRight = null;

    left.addEventListener('touchstart', e=>{
      for(const t of e.changedTouches) if(leftId===null){ leftId=t.identifier; break; }
    }, {passive:false});
    right.addEventListener('touchstart', e=>{
      for(const t of e.changedTouches) if(rightId===null){ rightId=t.identifier; lastRight={x:t.clientX,y:t.clientY}; break; }
    }, {passive:false});

    function norm(v,dead=10){ return Math.abs(v)<dead?0:v; }

    window.addEventListener('touchmove', e=>{
      for(const t of e.changedTouches){
        if(t.identifier===leftId){
          const cx = t.clientX, cy = t.clientY;
          const midX = window.innerWidth*0.25; // center of left half
          const refY = window.innerHeight*0.70; // comfort vertical center
          const vx = norm(cx - midX);
          const vy = norm(cy - refY);
          move.x = Math.sign(vx);
          move.z = vy<0 ? 1 : (vy>0 ? -1 : 0);
        } else if(t.identifier===rightId){
          if(lastRight){
            lookDelta.x += (t.clientX - lastRight.x);
            lookDelta.y += (t.clientY - lastRight.y);
          }
          lastRight = {x:t.clientX, y:t.clientY};
        }
      }
    }, {passive:false});

    window.addEventListener('touchend', e=>{
      for(const t of e.changedTouches){
        if(t.identifier===leftId){ leftId=null; move.x=0; move.z=0; }
        if(t.identifier===rightId){ rightId=null; lastRight=null; }
      }
    }, {passive:false});
  }

  function bindUIButtons(){
    const push = a=>actionsQueue.push(a);
    const byId = id=>document.getElementById(id);
    [
      ['btn-use','use'],['btn-place','place'],['btn-toss','toss'],
      ['btn-slot-prev','slotPrev'],['btn-slot-next','slotNext'],
      ['btn-notebook','openNotebook']
    ].forEach(([id,a])=>{ const el=byId(id); if(el) el.onclick=()=>push(a); });

    // Inspector toggle
    const insp = byId('btn-inspector');
    if (insp){
      insp.onclick = ()=>{
        try{
          if (!scene) return;
          if (scene.debugLayer.isVisible()) scene.debugLayer.hide();
          else scene.debugLayer.show({ overlay:true });
        }catch(e){ console.warn('Inspector load failed', e); }
      };
    }
  }

  return {
    init(canvas){
      document.addEventListener('keydown', e=>onKey(e,true));
      document.addEventListener('keyup',   e=>onKey(e,false));
      bindPointerLock(canvas);
      bindTouchHalves();
      bindUIButtons();
    },
    snapshot(){
      const out = {
        moveVec: { x: move.x, z: move.z },
        running,
        lookDelta: { x: lookDelta.x, y: lookDelta.y },
        actions: actionsQueue.splice(0)
      };
      lookDelta.x = 0; lookDelta.y = 0;
      return out;
    }
  };
})();
</script>

<script>
/* ============================================================
   Movement & Look helpers (invert Y for look)
   ============================================================ */
function handleMovementFromInput(input, dt){
  if(!window.camera || !window.scene) return;
  const speedWalk = (window.player?.speedWalk) || 0.9;
  const speedRun  = (window.player?.speedRun)  || 1.8;
  const speed = input.running ? speedRun : speedWalk;

  const fwd = camera.getForwardRay().direction.clone(); fwd.y = 0; fwd.normalize();
  const right = BABYLON.Vector3.Cross(fwd, BABYLON.Axis.Y).scale(-1);
  const desired = fwd.scale(input.moveVec.z).add(right.scale(input.moveVec.x));
  if (desired.lengthSquared()>0){
    const v = desired.normalize().scale(speed * dt * 60 * 0.0167);
    camera.cameraDirection = v;
  } else {
    camera.cameraDirection = BABYLON.Vector3.Zero();
  }
}
function applyLookFromInput(lookDelta){
  if(!window.camera) return;
  const sens = 0.0022;     // higher = less hand travel needed
  camera.rotation.y += lookDelta.x * sens;
  const invertY = -1;      // invert up/down as requested
  const minPitch = -Math.PI/2 + 0.15;
  const maxPitch =  Math.PI/2 - 0.15;
  const pitch = (camera.rotation.x || 0) + (invertY * lookDelta.y * sens * 0.8);
  camera.rotation.x = Math.min(maxPitch, Math.max(minPitch, pitch));
}
</script>

<script>
/* ============================================================
   Procedural RAIN (no external texture) + Weather
   ============================================================ */
let __rainDynTex = null;
function makeRainTexture(scene){
  if (__rainDynTex) return __rainDynTex;
  // a 2x32 vertical streak, soft gradient
  const w=2, h=32;
  const dt = new BABYLON.DynamicTexture("rainDynTex", {width:w, height:h}, scene, false);
  const ctx = dt.getContext();
  ctx.clearRect(0,0,w,h);
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0.00, "rgba(255,255,255,0.00)");
  g.addColorStop(0.20, "rgba(255,255,255,0.40)");
  g.addColorStop(0.50, "rgba(255,255,255,0.85)");
  g.addColorStop(0.80, "rgba(255,255,255,0.40)");
  g.addColorStop(1.00, "rgba(255,255,255,0.00)");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);
  dt.update(false);
  __rainDynTex = dt;
  return dt;
}

function ensureRainPS(scene){
  if (weather.rainPS) return weather.rainPS;
  const ps = new BABYLON.ParticleSystem("rain", 3500, scene);
  ps.particleTexture = makeRainTexture(scene);
  ps.minEmitBox = new BABYLON.Vector3(-90, 55, -90);
  ps.maxEmitBox = new BABYLON.Vector3( 90, 55,  90);
  ps.minSize = 0.8; ps.maxSize = 1.2;
  ps.minLifeTime = 0.6; ps.maxLifeTime = 1.0;
  ps.direction1 = new BABYLON.Vector3(-0.2, -1.6, 0.1);
  ps.direction2 = new BABYLON.Vector3( 0.2, -1.4,-0.1);
  ps.gravity = new BABYLON.Vector3(0, -9.8, 0);
  ps.emitRate = 1800;
  ps.updateSpeed = 0.015;
  ps.color1 = new BABYLON.Color4(0.95, 0.98, 1.00, 0.85);
  ps.color2 = new BABYLON.Color4(0.95, 0.98, 1.00, 0.55);
  ps.colorDead = new BABYLON.Color4(1,1,1,0.0);
  ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
  ps.disposeOnStop = false;
  weather.rainPS = ps;
  return ps;
}

function setWeather(state){
  weather.state = state;
  const label = document.getElementById('hud-weather');
  if (label) label.textContent = state;

  if (weather.rainPS) weather.rainPS.stop();
  if (weather.snowPS) weather.snowPS.stop();

  // Clear
  if (state === 'Clear'){
    applyNightPalette?.();
    return;
  }

  // Snow (simple procedural flake)
  if (state === 'Snow'){
    applyNightPalette?.();
    if (!weather.snowPS){
      const ps = new BABYLON.ParticleSystem("snow", 2200, scene);
      const snowTex = new BABYLON.DynamicTexture("snowTex",{width:8,height:8},scene,false);
      const ctx = snowTex.getContext(); ctx.clearRect(0,0,8,8);
      ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(4,4,3,0,Math.PI*2); ctx.fill(); snowTex.update(false);
      ps.particleTexture = snowTex;
      ps.minEmitBox = new BABYLON.Vector3(-80, 42, -80);
      ps.maxEmitBox = new BABYLON.Vector3( 80, 42,  80);
      ps.minSize = 0.06; ps.maxSize = 0.14;
      ps.minLifeTime = 2.0; ps.maxLifeTime = 3.6;
      ps.emitRate = 1100;
      ps.direction1 = new BABYLON.Vector3(-0.15, -0.7, 0.1);
      ps.direction2 = new BABYLON.Vector3( 0.15, -0.9,-0.1);
      ps.gravity = new BABYLON.Vector3(0,-0.2,0);
      ps.updateSpeed = 0.02;
      ps.color1 = new BABYLON.Color4(1,1,1,0.95);
      ps.color2 = new BABYLON.Color4(1,1,1,0.70);
      ps.disposeOnStop = false;
      weather.snowPS = ps;
    }
    weather.snowPS.start();
    return;
  }

  // Rain + Blood Moon (rain + lightning)
  if (state === 'Rain' || state === 'Blood Moon'){
    if (state === 'Blood Moon'){
      applyBloodMoonPalette?.();
      applyMoonTintForWeather?.();
    } else {
      applyNightPalette?.();
    }
    const ps = ensureRainPS(scene);
    ps.start();
    scheduleNextLightning();
    return;
  }
}
</script>

<script>
/* ============================================================
   Minimal palette helpers + moon tint hook
   ============================================================ */
function applyNightPalette(){
  scene.clearColor = new BABYLON.Color4(0.01,0.01,0.02,1);
  scene.ambientColor = new BABYLON.Color3(0.02,0.02,0.05);
  scene.imageProcessingConfiguration.exposure = 0.8;
  scene.imageProcessingConfiguration.contrast = 1.15;
  scene.environmentIntensity = 0.25;
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.0045;
  scene.fogColor = new BABYLON.Color3(0.02,0.03,0.05);
}
function applyBloodMoonPalette(){
  scene.clearColor = new BABYLON.Color4(0.02,0,0.02,1);
  scene.ambientColor = new BABYLON.Color3(0.04,0.01,0.02);
  scene.imageProcessingConfiguration.exposure = 0.5;
  scene.imageProcessingConfiguration.contrast = 1.2;
  scene.environmentIntensity = 0.25;
  scene.fogDensity = 0.005;
  scene.fogColor = new BABYLON.Color3(0.06,0.01,0.02);
}
function applyMoonTintForWeather(){
  const node = scene.getMeshByName("MoonMesh");
  if (!node) return;
  const mat = node.material;
  if (weather.state === 'Blood Moon'){
    if (mat && mat.emissiveColor) mat.emissiveColor = new BABYLON.Color3(0.9, 0.16, 0.16);
  } else {
    if (mat && mat.emissiveColor) mat.emissiveColor = new BABYLON.Color3(1,1,1);
  }
}
</script>

<script>
/* ============================================================
   LOADERS: Map, Moon, Ghost (with cube fallback)
   ============================================================ */
async function loadMap(){
  try{
    const result = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/map/", "Abandoned_House.glb", scene);
    houseRoot = result.meshes[0] || result.meshes.find(m=>m.name==="__root__");
    result.meshes.forEach(m=>{ m.checkCollisions = true; m.isPickable = true; m.receiveShadows = true; });
  }catch(e){
    console.warn("Map load failed, using ground fallback", e);
    const ground = BABYLON.MeshBuilder.CreateGround("fallbackGround", { width:160, height:160 }, scene);
    ground.position.y = 0; ground.checkCollisions = true;
    const gmat = new BABYLON.StandardMaterial("gmat", scene);
    gmat.diffuseColor = new BABYLON.Color3(0.06,0.08,0.12); gmat.specularColor = new BABYLON.Color3(0,0,0);
    ground.material = gmat;
  }
}
function afterMapLoadedForShadows(){ (scene.meshes||[]).forEach(m=> m && (m.receiveShadows = true)); }
function adoptExistingGltfLights(){ return 0; }
function buildHouseLights(){
  const p=new BABYLON.PointLight("houseLight_0", new BABYLON.Vector3(0,4,0), scene);
  p.intensity=0.0; p.range=14; houseLights.push({light:p, mesh:null});
}

async function loadMoon(){
  try{
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/sky/", "moon.glb", scene);
    const moonMesh = r.meshes.find(m=>m.name && m.name!=="__root__") || r.meshes[0];
    if(moonMesh){
      moonMesh.name = "MoonMesh";
      moonMesh.isPickable=false; moonMesh.applyFog=false; moonMesh.renderingGroupId=1;
      const mat = moonMesh.material || new BABYLON.StandardMaterial("moonMat", scene);
      mat.disableLighting = true; mat.emissiveColor = new BABYLON.Color3(1,1,1); moonMesh.material = mat;
      moonMesh.position = new BABYLON.Vector3(0, 350, 380);
      // gentle drift
      scene.onBeforeRenderObservable.add(()=>{
        const t = performance.now()*0.00002;
        moonMesh.position.x = Math.cos(t)*380;
        moonMesh.position.z = Math.sin(t)*380;
        moonMesh.position.y = 340 + Math.sin(t*1.7)*10;
      });
    }
  }catch(e){ console.warn("Moon load failed", e); }
}

async function loadGhost(){
  try{
    const list = ["ghost1.glb","ghost2.glb","ghost3.glb","ghost4.glb","ghost5.glb"];
    const pick = list[(Math.random()*list.length)|0];
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/ghosts/", pick, scene);
    const g = r.meshes[0] || r.meshes.find(m=>m.name==="__root__");
    if(g){
      g.isPickable=false; g.checkCollisions=false;
      const bb = g.getHierarchyBoundingVectors(true);
      const height = bb.max.y - bb.min.y;
      const scale = (1.9 / (height || 1));
      g.scaling = new BABYLON.Vector3(scale, scale, scale);
      g.position = new BABYLON.Vector3(43.657, 1.2, -119.008);
      window.ghost = { mesh:g, hunting:false, stepInterval:0.55, footAudible:18, visible:false };
      return;
    }
  }catch(e){
    console.warn("Ghost GLB failed, using cube fallback", e);
  }
  // Fallback translucent cube ghost
  const m = BABYLON.MeshBuilder.CreateBox("fallbackGhost",{size:1.2},scene);
  const mat = new BABYLON.StandardMaterial("fgMat", scene);
  mat.alpha=0.35; mat.emissiveColor=new BABYLON.Color3(0.6,0.6,1);
  m.material=mat; m.isPickable=false;
  m.position = new BABYLON.Vector3(43.657, 1.2, -119.008);
  window.ghost = { mesh:m, hunting:false, stepInterval:0.55, footAudible:18, visible:true };
}
</script>

<script>
/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true, disableWebGL2Support:false });
  try{ engine.setHardwareScalingLevel(1 / (window.devicePixelRatio||1)); }catch{}
  scene = new BABYLON.Scene(engine);
  scene.environmentTexture = null;
  const oldSky = scene.getMeshByName("BackgroundSkybox"); if (oldSky) oldSky.dispose();
  scene.collisionsEnabled = true;
  scene.gravity = new BABYLON.Vector3(0, -0.5, 0);

  // Camera
  camera = new BABYLON.UniversalCamera("playerCam", new BABYLON.Vector3(43.657, 3, -119.008), scene);
  camera.attachControl(canvas, true);
  camera.applyGravity = true;
  camera.checkCollisions = true;
  camera.ellipsoid = new BABYLON.Vector3(0.35, 0.9, 0.35);
  camera.ellipsoidOffset = new BABYLON.Vector3(0, 0.4, 0);
  camera.keysUp = [87]; camera.keysDown = [83]; camera.keysLeft = [65]; camera.keysRight = [68];
  camera.minZ = 0.1; camera.inertia = 0;
  // We'll handle movement ourselves:
  camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

  // Lights & palette
  applyNightPalette();
  hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  hemiLight.intensity = 0.06;

  await loadMap().catch(()=>{});
  afterMapLoadedForShadows();
  if (!adoptExistingGltfLights()) buildHouseLights();
  await loadGhost().catch(()=>{});
  await loadMoon().catch(()=>{});

  // UI/input
  InputSystem.init(canvas);
  document.getElementById("hud").style.display="block";

  toast("WASD to move • Pointer-Lock look • F=Flash, U=UV, I=IR", 2600);

  // Main tick
  scene.onBeforeRenderObservable.add(()=>{
    const dt = engine.getDeltaTime()/1000;

    const input = InputSystem.snapshot();
    handleMovementFromInput(input, dt);
    applyLookFromInput(input.lookDelta);

    // HUD gunk
    document.getElementById('hud-sanity').textContent = `${player.sanity|0}%`;
    if (camera){
      document.getElementById('hud-xyz').style.display = 'block';
      document.getElementById('hud-x').textContent = camera.position.x.toFixed(2);
      document.getElementById('hud-y').textContent = camera.position.y.toFixed(2);
      document.getElementById('hud-z').textContent = camera.position.z.toFixed(2);
    }

    // Weather loop
    if (weather.state==='Rain' || weather.state==='Blood Moon'){
      weather.lightningTimer += dt;
      if(weather.lightningTimer > weather.nextStrike){ lightningStrike(); scheduleNextLightning(); }
      if (weather.rainPS){ weather.rainPS.emitRate = inVanZone(camera.position) ? 0 : 1800; }
    }

    updateGhost(dt);
    updatePlayerFootsteps(dt);
  });

  engine.runRenderLoop(()=> scene.render());
  window.addEventListener('resize', ()=> engine.resize());
}
</script>

<script>
/* ============================================================
   START FLOW (robust binding)
   ============================================================ */
let __started=false, __starting=false;

async function safeStart(){
  if(__started || __starting) return;
  __starting = true;

  if(!window.BABYLON || !BABYLON.Engine){
    toast("Engine not ready. Check Babylon includes.", 2200);
    __starting = false; return;
  }

  const screen = document.getElementById('title-screen');
  const btn    = document.getElementById('start-button');

  try{
    if(btn){ btn.disabled = true; btn.textContent = 'Starting…'; }
    if(screen) screen.style.display='none';

    await boot();

    // Pick initial weather
    const r = Math.random();
    const w = r < 0.40 ? 'Clear' : r < 0.65 ? 'Rain' : r < 0.85 ? 'Snow' : 'Blood Moon';
    setWeather(w);
    toast(`Investigation started. Weather: ${w}.`, 1600);

    __started = true;
  }catch(err){
    console.error('[Start] error', err);
    if(screen){ screen.style.display='flex'; if(btn){ btn.disabled=false; btn.textContent='Start Investigation'; } }
  }finally{
    __starting = false;
  }
}
function bindStartControls(){
  const btn    = document.getElementById('start-button');
  const screen = document.getElementById('title-screen');
  if(btn && !btn.__wired){
    btn.__wired = true;
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); safeStart(); });
    btn.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.code==='Space'){ e.preventDefault(); safeStart(); }});
  }
  if(screen && !screen.__wired){
    screen.__wired = true;
    screen.addEventListener('click', (e)=>{ if(e.target===screen) safeStart(); });
  }
}
document.addEventListener('DOMContentLoaded', bindStartControls);
window.addEventListener('load', bindStartControls);
window.addEventListener('keydown', (e)=>{
  const screen=document.getElementById('title-screen');
  if(!screen || screen.style.display==='none') return;
  if(e.key==='Enter' || e.code==='Space'){ e.preventDefault(); safeStart(); }
});
</script>
