  <!-- ==================== Map registry + picker logic (before map.js) ==================== -->
 <script>
(function(){
  // ✅ Use the maps that are actually in your repo
  window.MAP_REGISTRY = {
    "Jailhouse":                 "./assets/models/map/jailhouse.glb",
    "Furnished House":           "./assets/models/map/furnished_house.glb",
    "Abandoned House":           "./assets/models/map/Abandoned_House.glb", // note casing
    "Apartment Floor Plan":      "./assets/models/map/apartment_floor_plan.glb",
    "House (Procedural Export)": "./assets/models/map/house_procedural_export.glb"
  };

  // Resolve default from localStorage or first registry entry
  const savedKey  = localStorage.getItem('PP_MAP');
  const firstKey  = Object.keys(MAP_REGISTRY)[0];
  const initialKey = (savedKey && MAP_REGISTRY[savedKey]) ? savedKey : firstKey;

  // Expose MAP_URL early so map.js can use it
  window.MAP_URL = MAP_REGISTRY[initialKey];

  // Build dropdown
  const sel = document.getElementById('map-select');
  sel.innerHTML = '';
  for (const [label, url] of Object.entries(MAP_REGISTRY)){
    const opt = document.createElement('option');
    opt.value = label; opt.textContent = label; opt.dataset.url = url;
    if (label === initialKey) opt.selected = true;
    sel.appendChild(opt);
  }

  // Status helper (HEAD check)
  async function head(url){
    try{ const r=await fetch(url, {method:'HEAD'}); return r.ok; }
    catch{ return false; }
  }

  (async ()=>{
    const status = document.getElementById('map-status');
    status.textContent = 'Checking map…';
    const ok = await head(MAP_URL);
    status.textContent = ok ? 'Map OK' : '⚠ Map missing (check path/filename)';
    status.style.color = ok ? '#9ff' : '#f88';
  })();

  // Update selection live
  sel.addEventListener('change', async ()=>{
    const key = sel.value;
    const url = MAP_REGISTRY[key];
    window.MAP_URL = url;
    localStorage.setItem('PP_MAP', key);

    const status = document.getElementById('map-status');
    status.textContent = 'Checking map…';
    const ok = await head(url);
    status.textContent = ok ? `Selected: ${key}` : `⚠ ${key} missing (check file)`;
    status.style.color = ok ? '#9ff' : '#f88';
  });

  // Extra safety: re-assert MAP_URL right before Start is handled by game code
  document.getElementById('start-button')?.addEventListener('click', ()=>{
    const key = sel.value;
    window.MAP_URL = MAP_REGISTRY[key];
    localStorage.setItem('PP_MAP', key);
  }, {capture:true}); // run before bubbling handlers
})();
</script>

  <!-- ==================== Item-model shim (uses exploration_objects.glb) ==================== -->
  <script>
  (function(){
    const TOOLS_GLB = './assets/models/items/exploration_objects.glb';
    const KEY_HINTS = {
      lighter:['lighter','zippo','flame'],
      emf:['emf','meter'],
      book:['book','journal'],
      camera:['camera'],
      dots:['dots','projector'],
      uv:['uv','blacklight'],
      candle:['candle'],
      thermometer:['thermo','thermometer'],
      crucifix:['crucifix','cross'],
      smudge:['smudge','incense','sage'],
      salt:['salt'],
      spirit_box:['spirit box','spiritbox','radio']
    };
    let _loaded=null; const REGISTRY={};

    async function load(scene){
      if (_loaded) return _loaded;
      _loaded = BABYLON.SceneLoader.ImportMeshAsync('', TOOLS_GLB, undefined, scene)
        .then(res=>{
          const meshes=(res.meshes||[]).filter(m=>m && m.name && m.name!=='__root__');
          const names=meshes.map(m=>m.name), lower=names.map(n=>n.toLowerCase());
          for (const [key,hints] of Object.entries(KEY_HINTS)){
            let idx=-1; for (const h of hints){ idx=lower.findIndex(n=>n.includes(h)); if (idx!==-1) break; }
            if (idx!==-1) REGISTRY[key]=meshes[idx];
          }
          console.log('[items] exploration_objects loaded; keys:', Object.fromEntries(Object.entries(REGISTRY).map(([k,m])=>[k,m.name])));
        })
        .catch(e=>console.warn('[items] load failed', TOOLS_GLB, e));
      return _loaded;
    }

    function clone(key, scene){
      const src=REGISTRY[key]; if (!src) return null;
      const c=src.clone(key+'_clone', null); c.setEnabled(true);
      c.getChildMeshes().forEach((m,i)=>{ if (m.material) m.material = m.material.clone((m.material.name||key)+'_mat_'+i); });
      return c;
    }

    window.ItemModels = { ready: load, clone: (k,s)=>clone(k,s) };

    window.replaceItemPrimitive = async function(primitiveMesh, key){
      try{
        const scene=primitiveMesh.getScene(); await load(scene);
        const real=clone(key, scene);
        if (real){
          real.position.copyFrom(primitiveMesh.position);
          if (primitiveMesh.rotationQuaternion){
            real.rotationQuaternion = primitiveMesh.rotationQuaternion.clone();
          } else if (primitiveMesh.rotation) {
            real.rotation = primitiveMesh.rotation.clone ? primitiveMesh.rotation.clone() : primitiveMesh.rotation;
          }
          real.scaling.copyFrom(primitiveMesh.scaling);
          primitiveMesh.dispose();
          return real;
        }
      }catch(e){ console.warn('[items] replace failed', key, e); }
      return primitiveMesh;
    };
  })();
  </script>

  <script>
    window.enableHavok = async function(){
      try{
        const HK = await HavokPhysics({ locateFile: (f)=> './cdn/havok/' + f });
        const scene = window.scene || BABYLON.Engine.LastCreatedScene;
        if (!scene) return;
        const plugin = new BABYLON.HavokPlugin(true, HK);
        scene.enablePhysics(new BABYLON.Vector3(0,-9.81,0), plugin);
        window.physicsPlugin = plugin;
        console.log('[havok] enabled');
      }catch(e){ console.warn('[havok] failed', e); }
    };
    (function hookPhysics(){
      const once = ()=> window.enableHavok?.();
      document.getElementById('start-button')?.addEventListener('click', once, { once:true });
      window.addEventListener('pointerdown', once, { once:true, passive:true });
    })();
  </script>

  <!-- DevTools (prevent auto-open unless Alt+T or ?dev=1) -->
  <script>window.DEVTOOLS_AUTO_OPEN = false;</script>
  <script src="./assets/index3/devtools.js?v=7.4.0"></script>
  <script>
    (function(){
      const css = document.createElement('style');
      css.id = 'devtools-startup-hide';
      css.textContent = `#dev-gate, #devtools-panel { display:none !important; visibility:hidden !important; }`;
      document.head.appendChild(css);
      const hide = ()=> {
        const a=document.getElementById('dev-gate'), b=document.getElementById('devtools-panel');
        if (a){ a.style.display='none'; a.style.visibility='hidden'; }
        if (b){ b.style.display='none'; b.style.visibility='hidden'; }
      };
      const sweep = setInterval(hide, 60); setTimeout(()=>clearInterval(sweep), 2000);
      const allow=()=>{ const s=document.getElementById('devtools-startup-hide'); if (s) s.remove(); };
      const btn=document.getElementById('devtools-toggle'); if (btn) btn.addEventListener('click', allow, {capture:true, once:true});
      window.addEventListener('keydown', (e)=>{ if (e.altKey && (e.code==='KeyT'||e.key==='t'||e.key==='T')) allow(); }, {capture:true});
      if (/[?#](dev|devtools)=1/i.test(location.href)) allow();
      const mo=new MutationObserver(()=>{ if (document.getElementById('devtools-startup-hide')) hide(); else mo.disconnect(); });
      mo.observe(document.documentElement, { attributes:true, childList:true, subtree:true });
    })();
  </script>

  <!-- Audio unlock (fixes "sound broken" on first load) -->
  <script>
    (function audioGate(){
      let unlocked = false;
      function unlock(){
        if (unlocked) return;
        try { BABYLON.Engine.audioEngine?.unlock(); } catch {}
        unlocked = true; window.audioUnlocked = true;
        try { Weather && Weather.init && Weather.init(); } catch {}
        window.removeEventListener('pointerdown', unlock, true);
        window.removeEventListener('keydown', unlock, true);
      }
      const btn = document.getElementById('start-button');
      if (btn) btn.addEventListener('click', unlock, { once:true });
      window.addEventListener('pointerdown', unlock, true);
      window.addEventListener('keydown', unlock, true);
    })();
  </script>

  <!-- Attach live video feed if the board exists -->
  <script>
    (function spawnFeedOnPizarra(){
      const id = setInterval(()=>{
        const s = window.scene;
        if (!s || !window.VideoFeed) return;
        const m = s.getMeshByName('Pizarra_Pizarra_0');
        if (!m) return;
        clearInterval(id);
        VideoFeed.setActive(true);
        VideoFeed.setLight(true, 0.8);
        let mat = m.material;
        const isPBR = mat && mat.getClassName && /PBR/i.test(mat.getClassName());
        const tex = VideoFeed.getTexture();
        if (isPBR){
          mat.emissiveTexture = tex;
          mat.emissiveColor = new BABYLON.Color3(1,1,1);
          try { mat.unlit = true; } catch {}
        } else {
          if (!(mat instanceof BABYLON.StandardMaterial)) {
            mat = new BABYLON.StandardMaterial('PizarraVideoMat', s);
            m.material = mat;
          }
          mat.disableLighting = true;
          mat.emissiveTexture = tex;
          mat.emissiveColor = new BABYLON.Color3(1,1,1);
          mat.backFaceCulling = false;
        }
      }, 120);
    })();
  </script>
