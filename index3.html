
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ghost Investigation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#000; color:#9ff; font-family:sans-serif; height:100%; }
    #renderCanvas { width:100%; height:100%; touch-action:none; display:block; }
    #start-screen { position:absolute; top:0; left:0; width:100%; height:100%; background:#000; display:flex; align-items:center; justify-content:center; flex-direction:column; }
    #start-button { padding:12px 24px; font-size:18px; background:#066; color:#9ff; border:none; cursor:pointer; border-radius:8px; }
    #loading-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; flex-direction:column; align-items:center; justify-content:center; color:#9ff; font-size:18px; }
    #loading-bar { width:60%; background:#222; border:1px solid #066; border-radius:4px; margin-top:12px; }
    #loading-bar-inner { width:0%; height:16px; background:#0f8; border-radius:4px; transition:width 0.3s; }
    #hud { position:absolute; bottom:10px; left:10px; font-size:14px; color:#9ff; background:rgba(0,0,0,0.5); padding:6px; border-radius:6px; }
    #devtools-toggle { position:absolute; top:10px; right:10px; z-index:20; display:none; }
    #devtools-panel { position:absolute; top:50px; right:10px; background:#111; border:1px solid #066; padding:10px; max-height:70%; overflow-y:auto; display:none; color:#8ff; }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
  <div id="start-screen">
    <h1>Ghost Investigation</h1>
    <button id="start-button">Start Investigation</button>
  </div>
  <div id="loading-overlay">
    <div>Loading... <span id="loading-text">0%</span></div>
    <div id="loading-bar"><div id="loading-bar-inner"></div></div>
  </div>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">
    Sanity: <span id="hud-sanity">100%</span> | Room: <span id="hud-room">Van</span>
  </div>
  <button id="devtools-toggle">DevTools</button>
  <div id="devtools-panel"><h3>Developer Tools</h3><textarea id="devtools-log" style="width:100%;height:120px;"></textarea></div>
<script>
let canvas, engine, scene, camera, light;
let player = { sanity:100, room:"Van", speedWalk:1.2, speedRun:3.0 };
let ghost = { visible:false, hunting:false, speed:0.9, stepInterval:0.55 };
let weather = { modSanityDrain:1, modHuntChance:1, modHuntPace:1 };
let sunLight, moonLight, sunMesh, moonMesh, moonMat;
let timeOfDay = "Night";

function showLoading(on){ document.getElementById('loading-overlay').style.display=on?'flex':'none'; }
function setProgress(pct,msg){ document.getElementById('loading-bar-inner').style.width=pct+'%'; document.getElementById('loading-text').textContent=Math.floor(pct)+'% '+(msg||''); }

function safeStart(){ document.getElementById('start-screen').style.display='none'; showLoading(true); boot(); }
document.getElementById('start-button').onclick = safeStart;

function boot(){
  canvas = document.getElementById('renderCanvas');
  engine = new BABYLON.Engine(canvas,true);
  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0,0,0,1);
  camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0,2,-6), scene);
  camera.attachControl(canvas,true);
  light = new BABYLON.HemisphericLight("hl", new BABYLON.Vector3(0,1,0), scene);
  light.intensity = 0.8;
  // Night lights
  sunLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.5,-1,0.5), scene);
  sunLight.intensity=0;
  moonLight = new BABYLON.DirectionalLight("moon", new BABYLON.Vector3(0.5,-1,-0.5), scene);
  moonLight.intensity=0.4;
  let sphere = BABYLON.MeshBuilder.CreateSphere("sphere",{diameter:2},scene);
  sphere.position.y=1;
  let ground = BABYLON.MeshBuilder.CreateGround("ground",{width:20,height:20},scene);
  setTimeOfDay("Night");
  showLoading(false);
  engine.runRenderLoop(()=>scene.render());
  window.addEventListener('resize',()=>engine.resize());
}

function setTimeOfDay(mode){
  timeOfDay = mode;
  if(timeOfDay==="Day"){
    sunLight.intensity=1.2; moonLight.intensity=0; scene.clearColor=new BABYLON.Color4(0.6,0.8,1,1);
  } else if(timeOfDay==="Blood Moon"){
    sunLight.intensity=0; moonLight.intensity=0.55; scene.clearColor=new BABYLON.Color4(0.05,0.02,0.02,1);
  } else {
    sunLight.intensity=0; moonLight.intensity=0.4; scene.clearColor=new BABYLON.Color4(0.05,0.05,0.1,1);
  }
}
</script>
</body>
</html>
