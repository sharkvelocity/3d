<script>
/* === CONSOLIDATED HELPERS (fixed) === */
(function(){
  // Diagnostics overlay
  if (!window.__diagnosticsInstalled){
    window.__diagnosticsInstalled = true;
    function ensureOverlay(){
      var o = document.getElementById('error-overlay');
      if(!o){
        o = document.createElement('div'); o.id='error-overlay';
        o.style.cssText='position:fixed;left:8px;bottom:8px;max-width:60vw;z-index:100000;background:rgba(128,0,0,0.9);color:#fff;border:1px solid #f66;padding:8px 10px;border-radius:8px;font:12px/1.35 monospace;display:none;white-space:pre-wrap;';
        document.body.appendChild(o);
      }
      return o;
    }
    function show(msg){
      try{
        console.error(msg);
        var o = ensureOverlay();
        o.textContent = '[Error] '+ msg;
        o.style.display='block';
        clearTimeout(o.__t);
        o.__t = setTimeout(function(){ o.style.display='none'; }, 7000);
      }catch(e){}
    }
    window.addEventListener('error', function(e){
      show((e && e.message) ? e.message : String(e));
    });
    window.addEventListener('unhandledrejection', function(e){
      var m = (e && e.reason && (e.reason.stack || e.reason.message)) || String(e && e.reason);
      show('Unhandled promise rejection: ' + m);
    });
  }

  // Minimal shims
  if (typeof window.$ !== 'function') { window.$ = function(sel){ return document.querySelector(sel); }; }
  if (typeof window.toast !== 'function') { window.toast = function(m){ try{ console.log('[toast]', m); }catch(_){}}; }

  // Engine/Scene bootstrap
  window.ensureCES = function(){
    try {
      var canvas = document.getElementById('renderCanvas') || document.querySelector('canvas');
      if (!canvas) {
        canvas = document.createElement('canvas');
        canvas.id = 'renderCanvas';
        canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;display:block;background:#000;';
        document.body.appendChild(canvas);
      }
      if (!window.engine || typeof window.engine.runRenderLoop !== 'function') {
        window.engine = new BABYLON.Engine(canvas, true, { disableUniformBuffers: true });
      }
      if (!window.scene) {
        window.scene = new BABYLON.Scene(window.engine);
      }
      return { canvas, engine: window.engine, scene: window.scene };
    } catch (e) {
      console.error('ensureCES failed', e);
      return {};
    }
  };

  // Safe weather invoker
  window.callSetWeather = function(w){
    if (!window.scene) { window.__pendingWeather = w; return; }
    try { if (typeof window.setWeather === 'function') window.setWeather(w); } catch(e){ console.warn(e); }
  };
  document.addEventListener('scene-ready', function(){
    if (window.__pendingWeather && window.scene && typeof window.setWeather === 'function'){
      try { window.setWeather(window.__pendingWeather); } finally { window.__pendingWeather = null; }
    }
  });

  // Light cap
  window.capLightsAndMaterials = function(maxLights){
    try{
      maxLights = Math.max(1, Math.min(maxLights||2, 8));
      const sc = window.scene;
      if (!sc) return;
      (sc.lights||[]).forEach((L,i)=>{
        const on = i < maxLights;
        try { L.setEnabled(on); } catch(_){}
        try { const sg = L.getShadowGenerator && L.getShadowGenerator(); if (sg && i >= 1) sg.dispose(); } catch(_){}
      });
      (sc.materials||[]).forEach(m=>{
        if ('maxSimultaneousLights' in m){
          try { m.maxSimultaneousLights = Math.min(m.maxSimultaneousLights||maxLights, maxLights); } catch(_){}
        }
      });
      if (sc.onNewMaterialAddedObservable){
        sc.onNewMaterialAddedObservable.add(m=>{
          if ('maxSimultaneousLights' in m){
            try { m.maxSimultaneousLights = Math.min(m.maxSimultaneousLights||maxLights, maxLights); } catch(_){}
          }
        });
      }
    }catch(e){ console.warn('capLightsAndMaterials error', e); }
  };

  // Load moon (safe)
  if (typeof window.loadMoon !== 'function') {
    window.loadMoon = async function(){
      try {
        const res = await fetch("./assets/models/sky/moon.glb", { method: "GET" });
        if (!res.ok) throw new Error("moon.glb not reachable: " + res.status);
        const ct = (res.headers.get("content-type")||"");
        if (ct.includes("text/html")) throw new Error("moon.glb served as HTML");
        const imp = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/sky/", "moon.glb", scene);
        let moonMesh = imp.meshes.find(m=>m && m.name!=="__root__") || imp.meshes[0];
        if (!moonMesh) throw new Error("moon.glb had no meshes");
        moonMesh.isPickable=false; moonMesh.checkCollisions=false; moonMesh.applyFog=false;
        moonMesh.renderingGroupId=1;
        const mat = moonMesh.material || new BABYLON.StandardMaterial("moonMat", scene);
        mat.disableLighting = true; mat.emissiveColor = new BABYLON.Color3(1,1,1);
        moonMesh.material = mat;
      } catch (e){
        console.warn("loadMoon shim fallback:", e);
        const moonMesh = BABYLON.MeshBuilder.CreateSphere("moon", {diameter:60, segments:18}, scene);
        moonMesh.isPickable=false; moonMesh.applyFog=false; moonMesh.renderingGroupId=1;
        const mat = new BABYLON.StandardMaterial("moonMat", scene);
        mat.disableLighting=true; mat.emissiveColor = new BABYLON.Color3(0.9,0.9,0.9);
        moonMesh.material = mat; moonMesh.position = new BABYLON.Vector3(0,350,380);
      }
    };
  }

  // Baseline render loop helper (unbreakable)
  window.startRenderLoopSafe = function(){
    const render = function(){ if (window.scene && window.scene.activeCamera) window.scene.render(); };
    if (window.engine && typeof window.engine.runRenderLoop === 'function'){
      window.window.startRenderLoopSafe(render);
    } else {
      (function loop(){ render(); requestAnimationFrame(loop); })();
    }
  };
})();
</script>

      try { __origSetWeather(w); } catch(e){ console.warn('setWeather failed', e); }
    };
    window.__setWeatherWrapped = true;
  }

  // Apply any pending weather once scene is ready
  function applyPendingWeather(){
    if (window.__pendingWeather && typeof window.setWeather === 'function' && window.scene){
      try { if (typeof window.setWeather==='function') window.setWeather(window.__pendingWeather); } finally { window.__pendingWeather = null; }
    }
  }
  document.addEventListener('scene-ready', applyPendingWeather);
  window.__applyPendingWeather = applyPendingWeather;
})();
</script>

// Map helper shims (only if missing)
if (typeof window.pickGroundHeightAt !== 'function') {
  window.pickGroundHeightAt = function(scene, x, z){
    try {
      const ray = new BABYLON.Ray(new BABYLON.Vector3(x, 1000, z), new BABYLON.Vector3(0,-1,0), 5000);
      const hit = scene.pickWithRay(ray, m => m && m.isPickable !== false);
      return (hit && hit.pickedPoint) ? hit.pickedPoint.y : 0;
    } catch(e){ return 0; }
  };
}
if (typeof window.randomPointInPolygonXZ !== 'function') {
  window.randomPointInPolygonXZ = function(poly){
    // naive box fallback if not provided: choose within bounding box
    let minX=Infinity,minZ=Infinity,maxX=-Infinity,maxZ=-Infinity;
    for (const p of (poly||[])){ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minZ=Math.min(minZ,p.z); maxZ=Math.max(maxZ,p.z); }
    if (!isFinite(minX)) return {x:0,z:0};
    return { x: minX + Math.random()*(maxX-minX), z: minZ + Math.random()*(maxZ-minZ) };
  };
}
</script>

<script>
/* === GLOBAL LIGHT LIMITERS === */
(function(){
  window.hookSceneLightCaps = function(scene, maxLights){
    try{
      maxLights = Math.max(1, Math.min(maxLights||2, 8));
      function applyToLights(){
        const arr = scene.lights || [];
        for (let i=0;i<arr.length;i++){
          const L = arr[i];
          const on = i < maxLights;
          try { L.setEnabled(on); } catch(_){}
          try {
            const sg = L.getShadowGenerator && L.getShadowGenerator();
            if (sg && i >= 1) { sg.dispose(); }
          } catch(_){}
        }
      }
      applyToLights();
      if (scene.onNewLightAddedObservable){
        scene.onNewLightAddedObservable.add(()=>applyToLights());
      } else {
        setTimeout(applyToLights, 0);
      }
      function capMat(m){
        if (!m) return;
        if ('maxSimultaneousLights' in m){
          try { m.maxSimultaneousLights = Math.min(m.maxSimultaneousLights||maxLights, maxLights); } catch(_){}
        }
      }
      (scene.materials||[]).forEach(capMat);
      if (scene.onNewMaterialAddedObservable){
        scene.onNewMaterialAddedObservable.add(capMat);
      }
    }catch(e){ try{ console.warn('hookSceneLightCaps error', e); }catch(_e){} }
  };
  if (typeof window.capLightsAndMaterials !== 'function') {
    window.capLightsAndMaterials = function(maxLights){
      try{ if (window.scene) window.hookSceneLightCaps(window.scene, maxLights); }catch(e){ try{ console.warn('capLightsAndMaterials error', e); }catch(_e){} }
    };
  }
  try { if (typeof hookSceneLightCaps === 'undefined') var hookSceneLightCaps = window.hookSceneLightCaps; } catch(_){}
  try { if (typeof capLightsAndMaterials === 'undefined') var capLightsAndMaterials = window.capLightsAndMaterials; } catch(_){}
})();
</script>

function toast(msg, ms=1500){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none', ms); }
function inVanZone(pos){ return BABYLON.Vector3.Distance(pos, vanZone.center) <= vanZone.radius; }
function pickGroundHeightAt(x, z){
  const ray = new BABYLON.Ray(new BABYLON.Vector3(x, 80, z), new BABYLON.Vector3(0,-1,0), 200);
  const hit = scene.pickWithRay(ray, m=>{
    if(!m || !m.isPickable) return false;
    const n = (m.name||"");
    return /ground|floor|terrain|fallbackground/i.test(n);
  });
  if(hit.hit && hit.pickedPoint) return hit.pickedPoint.y;
  return 1.2;
}
function randomPointInPolygonXZ(poly){
  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
  poly.forEach(p=>{ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minZ=Math.min(minZ,p.z); maxZ=Math.max(maxZ,p.z); });
  for(let i=0;i<500;i++){
    const x = minX + Math.random()*(maxX-minX);
    const z = minZ + Math.random()*(maxZ-minZ);
    if(pointInPolyXZ(new BABYLON.Vector3(x,0,z), poly)) return new BABYLON.Vector3(x, 0, z);
  }
  return poly[0].clone();
}
function pointInPolyXZ(p, poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x, zi=poly[i].z, xj=poly[j].x, zj=poly[j].z;
    const intersect = ((zi>p.z)!=(zj>p.z)) && (p.x < (xj-xi)*(p.z-zi)/(zj-zi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}
function lookAtXZ(mesh, target){ const dir = target.subtract(mesh.position); dir.y=0; if(dir.lengthSquared()>0.001){ mesh.rotationQuaternion=null; mesh.rotation = new BABYLON.Vector3(0, Math.atan2(dir.x, dir.z), 0); } }

let __started = false;

async function safeStart(){
  
  if (window.ensureCES) window.ensureCES();
if (window.__started) return;
  window.__started = true;
  try {
    // Hide title UI immediately to avoid double clicks
    var t = document.getElementById('title-screen');
    if (t) t.style.display = 'none';

    await boot();

    // Weather & ghost selection
    const r = Math.random();
    const w = r < 0.40 ? 'Clear' : r < 0.65 ? 'Rain' : r < 0.85 ? 'Snow' : 'Blood Moon';
    if (window.scene) { callSetWeather(w); } else { window.__pendingWeather = w; }
    const keys = Object.keys(GHOSTS);
    currentGhostKey = keys[Math.floor(Math.random() * keys.length)];
    if ((currentGhostKey||"").toLowerCase()==='myling'){ ghost.footAudible = 8; }

    if (typeof toast === 'function') toast(`Investigation started. Weather: ${w}.`, 1600);
  } catch (e) {
    console.error('safeStart failed:', e);
    if (typeof toast === 'function') toast('Failed to start: ' + (e && e.message ? e.message : e), 2200);
    window.__started = false;
    // Restore title UI so user can retry
    var t2 = document.getElementById('title-screen');
    if (t2) t2.style.display = '';
  }
}
(function bindStart(){
  const btn = document.getElementById('start-button');
  const screen = document.getElementById('title-screen');
  if (btn){
    btn.onclick = safeStart;
    btn.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); safeStart(); } };
  }
  if (screen){
    screen.addEventListener('click', e=>{ if(e.target===screen) safeStart(); });
  }
  window.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.code==='Space') safeStart(); });
})();

/* ===========================================================
   ENGINE & SCENE
   =========================================================== */
async function boot(){
  // === BASELINE MODE: skip heavy effects and just load the map ===
  if (window.BASELINE_MODE) {
    // Engine/scene/camera basic setup (assumes engine already created and canvas exists)
    try {
      const canvas = document.getElementById('renderCanvas') || document.querySelector('canvas');
      if (!window.engine) window.engine = new BABYLON.Engine(canvas, true, { disableUniformBuffers: true });
      if (!window.scene) window.scene = new BABYLON.Scene(engine);
      const scene = window.scene;

      // Minimal camera
      if (!scene.activeCamera) {
        const camera = new BABYLON.ArcRotateCamera('cam', Math.PI/2, 1.2, 25, new BABYLON.Vector3(0,2,0), scene);
        camera.attachControl(canvas, true);
        scene.activeCamera = camera;
      }
      // Minimal single light
      if (!scene.lights || scene.lights.length===0) {
        new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0,1,0), scene);
      }

      // Load the map only
      if (typeof window.loadMap === 'function') {
        try { await window.loadMap(); } catch(e){ console.error('loadMap failed in baseline mode:', e); }
      }

      // Start render loop
      window.startRenderLoopSafe(()=>{ if (scene && scene.activeCamera) scene.render(); });
    } catch (e) {
      console.error('Baseline boot failed:', e);
    }
    return; // do NOT execute heavy boot path
  }

  engine = new BABYLON.Engine(canvas, true, { disableUniformBuffers: true });
  try{ engine.setHardwareScalingLevel(1 / (window.devicePixelRatio||1)); }catch{}
  scene = new BABYLON.Scene(engine);
  scene.environmentTexture = null;
  const oldSky = scene.getMeshByName("BackgroundSkybox"); if (oldSky) oldSky.dispose();
  scene.collisionsEnabled = true;
  scene.gravity = new BABYLON.Vector3(0, -0.5, 0);

  // Camera
  camera = new BABYLON.UniversalCamera("playerCam", new BABYLON.Vector3(43.657, 3, -119.008), scene);
  camera.attachControl(canvas, true);
  camera.applyGravity = true;
  camera.checkCollisions = true;
  camera.ellipsoid = new BABYLON.Vector3(0.35, 0.9, 0.35);
  camera.ellipsoidOffset = new BABYLON.Vector3(0, 0.4, 0);
  camera.keysUp = [87]; camera.keysDown = [83]; camera.keysLeft = [65]; camera.keysRight = [68];
  camera.minZ = 0.1; camera.inertia = 0;
  camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

  
  if (!scene.activeCamera) scene.activeCamera = camera;
// Atmosphere/lights
  setupNightAtmosphere();

  // Fill
  hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  hemiLight.intensity = 0.06;

  // Map + items + ghost + moon
  await loadMap().catch(()=>{});
  afterMapLoadedForShadows();
  if (!adoptExistingGltfLights()) buildHouseLights();
    // Ensure global light/material cap function exists
    if (typeof window.capLightsAndMaterials !== 'function') {
      window.capLightsAndMaterials = function(){ /* no-op cap */ };
    }
    window.capLightsAndMaterials(2);

  await loadItems().catch(()=>{});
  await loadGhost().catch(()=>{});
  
// --- robust moon load ---
if (typeof loadMoon === 'function') {
  await loadMoon().catch(()=>{});
} else if (typeof window.loadMoon === 'function') {
  await window.loadMoon().catch(()=>{});
} else {
  // inline fallback if nothing is defined
  const moonMesh = BABYLON.MeshBuilder.CreateSphere("moon", {diameter:60, segments:18}, scene);
  moonMesh.isPickable=false; moonMesh.applyFog=false; moonMesh.renderingGroupId=1;
  const mat = new BABYLON.StandardMaterial("moonMat", scene);
  mat.disableLighting = true; mat.emissiveColor = new BABYLON.Color3(0.9,0.9,0.9);
  moonMesh.material = mat; moonMesh.position = new BABYLON.Vector3(0,350,380);
}

  setupBreathFX();

  if (!houseRoot){
    const ground = BABYLON.MeshBuilder.CreateGround("fallbackGround", { width:120, height:120 }, scene);
    ground.position.y = 0; ground.checkCollisions = true;
    const gmat = new BABYLON.StandardMaterial("gmat", scene);
    gmat.diffuseColor = new BABYLON.Color3(0.06,0.08,0.12); gmat.specularColor = new BABYLON.Color3(0,0,0);
    ground.material = gmat;

    const lamp = new BABYLON.PointLight("fallbackLamp", new BABYLON.Vector3(0,4,0), scene);
    lamp.intensity = 0.8; houseLights.push({ light: lamp, mesh: null });
  }

  if (ghost.mesh){ moonShadows.addShadowCaster(ghost.mesh, true); flashShadows.addShadowCaster(ghost.mesh, true); }

  // UI/inputs
  initUI();
  updateHUD();
  setupJoysticks(); // dual sticks

  // Render loop + tickers
  scene.onBeforeRenderObservable.add(()=>{
    const dt = engine.getDeltaTime()/1000;
    handleMovement(dt);
    sanityTick(dt);
    updateBreath(dt);
    if(weather.state==='Rain'){ weather.lightningTimer += dt; if(weather.lightningTimer > weather.nextStrike){ lightningStrike(); scheduleNextLightning(); } }
    if (ghost.hunting && flickerOn){
      flickerTimer += dt;
      if (flickerTimer > 0.08){
        flickerTimer = 0;
        houseLights.forEach(h=>{ if (!housePower) return; h.light.intensity = (Math.random()<0.65) ? 0.2 + Math.random()*0.9 : 0.0; });
      }
    }
    updateGhost(dt);
  });

  window.startRenderLoopSafe(()=> scene.render());
  window.addEventListener('resize', ()=> engine.resize());

  // HUD visible now
  document.getElementById("hud").style.display="block";
  rebuildBelt();
  toast("F=Flash, U=UV, I=IR, L=nearest light, P=power. Touch: dual sticks + USE.", 3200);
}

/* ===========================================================
   ATMOSPHERE / SKY / LIGHTS
   =========================================================== */
function setupNightAtmosphere(){
  applyNightPalette();

  cloudMat = new BABYLON.StandardMaterial("cloudSky", scene);
  cloudMat.backFaceCulling = false;
  cloudMat.disableLighting = true;
  cloudMat.diffuseTexture = new BABYLON.Texture("./assets/images/sky/clouds_night.jpg", scene);
  cloudMat.diffuseTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
  cloudMat.emissiveColor = new BABYLON.Color3(0.02,0.03,0.07);
  cloudMat.disableDepthWrite = true;

  if (skybox) skybox.dispose();
  skybox = BABYLON.MeshBuilder.CreateBox("skybox", { size: 1500 }, scene);
  skybox.material = cloudMat;
  skybox.infiniteDistance = true;
  skybox.isPickable = false;
  skybox.renderingGroupId = 0;

  moonLight = new BABYLON.DirectionalLight("moonLight", new BABYLON.Vector3(-0.2,-1,0.1), scene);
  moonLight.position = new BABYLON.Vector3(0,200,0);
  moonLight.intensity = 0.45;

  moonShadows = new BABYLON.ShadowGenerator(2048, moonLight);
  moonShadows.useBlurExponentialShadowMap = true;
  moonShadows.blurKernel = 16;
  moonShadows.bias = 0.001;
  moonShadows.normalBias = 0.5;

  flashLight = new BABYLON.SpotLight("flashLight", new BABYLON.Vector3(0,0,0), new BABYLON.Vector3(0,0,1), Math.PI/3, 10, scene);
  flashLight.parent = camera; flashLight.intensity = 0; flashLight.range = 40;
  flashShadows = new BABYLON.ShadowGenerator(1024, flashLight);
  flashShadows.useBlurExponentialShadowMap = true;

  uvLight = new BABYLON.SpotLight("uvLight", new BABYLON.Vector3(0,0,0), new BABYLON.Vector3(0,0,1), Math.PI/3, 8, scene);
  uvLight.parent = camera; uvLight.intensity = 0; uvLight.range = 30;
  uvLight.diffuse = new BABYLON.Color3(0.6,0.3,0.9); uvLight.specular = new BABYLON.Color3(0,0,0);

  irLight = new BABYLON.SpotLight("irLight", new BABYLON.Vector3(0,0,0), new BABYLON.Vector3(0,0,1), Math.PI/2, 10, scene);
  irLight.parent = camera; irLight.intensity = 0;
  irLight.diffuse = new BABYLON.Color3(0.4,0.6,0.4); irLight.specular = new BABYLON.Color3(0,0,0);

  scene.onBeforeRenderObservable.add(()=>{
    cloudScroll += engine ? engine.getDeltaTime()*0.00003 : 0.00003;
    if (cloudMat?.diffuseTexture) cloudMat.diffuseTexture.uOffset = cloudScroll;
  });
}
function applyNightPalette(){
  scene.clearColor = new BABYLON.Color4(0.01,0.01,0.02,1);
  scene.ambientColor = new BABYLON.Color3(0.02,0.02,0.05);
  scene.imageProcessingConfiguration.exposure = 0.75;
  scene.imageProcessingConfiguration.contrast = 1.15;
  scene.environmentIntensity = 0.2;
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.0045;
  scene.fogColor = new BABYLON.Color3(0.02,0.03,0.05);
  if (cloudMat) cloudMat.emissiveColor = new BABYLON.Color3(0.02,0.03,0.07);
}
function applyBloodMoonPalette(){
  scene.clearColor = new BABYLON.Color4(0.02,0,0.02,1);
  scene.ambientColor = new BABYLON.Color3(0.04,0.01,0.02);
  scene.imageProcessingConfiguration.exposure = 0.5;
  scene.imageProcessingConfiguration.contrast = 1.2;
  scene.environmentIntensity = 0.25;
  scene.fogDensity = 0.005;
  scene.fogColor = new BABYLON.Color3(0.06,0.01,0.02);
  if (cloudMat) cloudMat.emissiveColor = new BABYLON.Color3(0.16,0.03,0.03);
}
function applyMoonTintForWeather(){
  if (!moonMat) return;

    moonMat.emissiveColor = new BABYLON.Color3(0.9, 0.16, 0.16);

function makeSnowTexture(){
  if (weather.snowTex) return weather.snowTex;
  const tex = new BABYLON.DynamicTexture("snowTex",{width:32,height:32},scene,false);
  const ctx = tex.getContext();
  ctx.clearRect(0,0,32,32);
  ctx.fillStyle="white";
  ctx.beginPath(); ctx.arc(16,16,12,0,Math.PI*2); ctx.fill();
  tex.update(false);
  weather.snowTex = tex;
  return tex;
}
function stopAllWeatherPS(){ if (weather.rainPS){ weather.rainPS.stop(); } if (weather.snowPS){ weather.snowPS.stop(); } }
function stopAllWeatherAudio(){ try{ audio.rain.pause(); audio.rain.currentTime=0; }catch{} try{ audio.clear.pause(); audio.clear.currentTime=0; }catch{} }

function setWeather(state){
  weather.state = state;
  document.getElementById('hud-weather').textContent = state;
  stopAllWeatherPS(); stopAllWeatherAudio();

  weather.modSanityDrain = 1.0; weather.modHuntChance = 1.0; weather.modHuntPace = 1.0;

  if(state === 'Rain'){
    if(!weather.rainPS){
      const ps = new BABYLON.ParticleSystem("rain", 4000, scene);
      ps.particleTexture = new BABYLON.Texture("./assets/images/nosignal.gif", scene); // placeholder
      ps.minEmitBox = new BABYLON.Vector3(-80, 50, -80);
      ps.maxEmitBox = new BABYLON.Vector3(80, 50, 80);
      ps.minSize = 0.05; ps.maxSize = 0.1;
      ps.minLifeTime = 0.9; ps.maxLifeTime = 1.4;
      ps.emitRate = 1800;
      ps.direction1 = new BABYLON.Vector3(0, -1.2, 0);
      ps.direction2 = new BABYLON.Vector3(0, -1.0, 0);
      ps.color1 = new BABYLON.Color4(0.8,0.9,1,0.75);
      ps.color2 = new BABYLON.Color4(0.8,0.9,1,0.6);
      ps.gravity = new BABYLON.Vector3(0,-9.8,0);
      ps.disposeOnStop = false;
      weather.rainPS = ps;
    }
    weather.rainPS.start();

async function loadMap(){
  try{
    const result = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/map/", "Abandoned_House.glb", scene);
    houseRoot = result.meshes[0] || result.meshes.find(m=>m.name==="__root__");
    result.meshes.forEach(m=>{
      m.checkCollisions = true; m.isPickable = true;
      const bb = m.getBoundingInfo().boundingBox;
      const size = bb.maximum.subtract(bb.minimum);
      const thin = (size.y < 0.12) || (size.x < 0.12) || (size.z < 0.12);
      if(thin) m.checkCollisions = false;
      if(m.material && m.material.alpha && m.material.alpha < 0.9) m.checkCollisions = false;
      if(/door/i.test(m.name||"")) doorMeshes.push(m);
    });

    const fallbackGround = BABYLON.MeshBuilder.CreateGround("fallbackGround", { width:400, height:400, subdivisions:1 }, scene);
    fallbackGround.position.y = 0;
    fallbackGround.checkCollisions = true;
    fallbackGround.isPickable = true;
    fallbackGround.visibility = 0;

    const y = pickGroundHeightAt(vanZone.center.x, vanZone.center.z);
    camera.position = new BABYLON.Vector3(vanZone.center.x, y + 1.7, vanZone.center.z);

    doorMeshes.forEach(door=>{ door.actionManager = new BABYLON.ActionManager(scene); door.isPickable = true; });
  }catch(e){
    console.warn("Map load failed:", e);
  }
}

async function loadGhost(){
  try{
    const list = ["ghost1.glb","ghost2.glb","ghost3.glb","ghost4.glb","ghost5.glb"];
    const pick = list[Math.floor(Math.random()*list.length)];
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/ghosts/", pick, scene);
    ghost.mesh = r.meshes[0] || r.meshes.find(m=>m.name==="__root__");
    ghost.mesh.checkCollisions = false; ghost.mesh.isPickable = false;

    const bb = ghost.mesh.getHierarchyBoundingVectors(true);
    const height = bb.max.y - bb.min.y;
    const scale = (1.9 / (height || 1));
    ghost.mesh.scaling = new BABYLON.Vector3(scale, scale, scale);
    ghost.mesh.rotation = new BABYLON.Vector3(0,0,0);

    r.animationGroups.forEach(ag=>{ if(/idle/i.test(ag.name)) ghost.anims.idle = ag; if(/walk|run/i.test(ag.name)) ghost.anims.walk = ag; });
    if(ghost.anims.idle) ghost.anims.idle.start(true);

    const p = randomPointInPolygonXZ(ghostPolygon);
    const gy = pickGroundHeightAt(p.x, p.z);
    ghost.mesh.position = new BABYLON.Vector3(p.x, gy, p.z);
    ghost.target = randomPointInPolygonXZ(ghostPolygon);

    setGhostVisible(false);
  }catch(e){ console.warn("Ghost load failed:", e); }
}
function setGhostVisible(v){
  ghost.visible = !!v;
  if (!ghost.mesh) return;
  ghost.mesh.getChildMeshes(false).concat([ghost.mesh]).forEach(m=>{ m.isVisible = v; m.visibility = v ? 1 : 0; });
}
function beginHunt(){

  ghost.hunting = true;

function endHunt(){

let flickerTimer=0, flickerOn=false;

function flickerStop(){ flickerOn = false;
  houseLights.forEach(h=>{

let huntCooldown = 22 + Math.random()*18;
let huntClock = 0;
function sanityTick(dt){
  const nearGhost = ghost.mesh ? BABYLON.Vector3.Distance(ghost.mesh.position, camera.position) < 7 : false;
  const base = 0.6/60;
  const add = nearGhost ? 1.2/60 : 0;
  const drain = (base+add) * (storageOpen?0.2:1) * (inVanZone(camera.position)?0.4:1) * (weather.modSanityDrain||1);
  player.sanity = Math.max(0, player.sanity - drain);
  document.getElementById('hud-sanity').textContent = `${player.sanity|0}%`;

  if (!ghost.hunting && !inVanZone(camera.position) && player.sanity <= 65){
    huntClock += dt * (weather.modHuntPace||1);
    if (huntClock >= huntCooldown){
      huntClock = 0; huntCooldown = 22 + Math.random()*18;
      const baseChance = (player.sanity<40 ? 0.85 : 0.55);
      if (Math.random() < baseChance * (weather.modHuntChance||1)) beginHunt();
    }
  }
  if (ghost.hunting && (inVanZone(camera.position) || Math.random()<0.0015)) endHunt();
}

/* === Cold Breath FX (defensive) === */
(function(){
  if (!window.BREATH_RANGE) window.BREATH_RANGE = 5.0;
  if (!window.breath) window.breath = { ps:null, anchor:null, cooldown:0 };

  window.setupBreathFX = function(){
    if (!window.scene || !window.camera){
      console.warn("setupBreathFX: missing scene or camera");
      setTimeout(()=>{ if (window.scene && window.camera) window.setupBreathFX(); }, 120);
      return;
    }
    if (breath.ps) return;

    const emitter = new BABYLON.TransformNode("breathAnchor", scene);
    breath.anchor = emitter;

    scene.onBeforeRenderObservable.add(()=>{
      if (!camera) return;
      const fwd = camera.getForwardRay().direction.clone(); fwd.normalize();
      const pos = camera.position.add(fwd.scale(0.35));
      emitter.position.copyFrom(pos);
      emitter.position.y = camera.position.y - 0.1;
    });

    const ps = new BABYLON.ParticleSystem("breathPS", 300, scene);
    ps.particleTexture = new BABYLON.Texture("./assets/images/particles/smoke.png", scene, true);
    ps.emitter = emitter;
    ps.minSize = 0.02; ps.maxSize = 0.05;
    ps.minLifeTime = 0.35; ps.maxLifeTime = 0.8;
    ps.emitRate = 0;
    ps.direction1 = new BABYLON.Vector3(0, 0.02, 0.02);
    ps.direction2 = new BABYLON.Vector3(0, 0.03, 0.03);
    ps.color1 = new BABYLON.Color4(0.9,0.95,1,0.45);
    ps.color2 = new BABYLON.Color4(0.9,0.95,1,0.25);
    ps.updateSpeed = 0.02;
    ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
    ps.start();

    breath.ps = ps;
  };

  window.updateBreath = function(dt){
    if (!breath.ps) return;
    const nearGhost = (window.ghost && ghost.mesh) ? BABYLON.Vector3.Distance(ghost.mesh.position, camera.position) < BREATH_RANGE : false;

    // Weather gating
    const state = (window.weather && weather.state) ? weather.state : 'Clear';
    const isCold = state === 'Snow' || state === 'Rain' || state === 'Blood Moon' || nearGhost;
    const target = isCold ? 220 : 0;

    const cur = breath.ps.emitRate||0;
    breath.ps.emitRate = cur + (target - cur) * 0.15;
  };
})();

   HOUSE LIGHTS
   =========================================================== */
const HOUSE_LIGHT_REGEX = /(lamp|light|bulb|ceiling|sconce)/i;
function adoptExistingGltfLights(){
  let adopted = 0;
  (scene.lights||[]).forEach(l=>{
    if ([moonLight,flashLight,uvLight,irLight,hemiLight].includes(l)) return;
    if (HOUSE_LIGHT_REGEX.test(l.name||"")){
      l.intensity = 0;
      l.diffuse = new BABYLON.Color3(1.0, 0.95, 0.8);
      houseLights.push({ light:l, mesh:null });
      adopted++;
    }
  });
  return adopted>0;
}
function buildHouseLights(){
  const candidates = scene.meshes.filter(m=>HOUSE_LIGHT_REGEX.test(m.name||""));
  candidates.forEach((mesh, i)=>{
    const b = mesh.getBoundingInfo().boundingBox;
    const pos = b.centerWorld.clone(); pos.y += 0.2;
    const pl = new BABYLON.PointLight("houseLight_"+i, pos, scene);
    pl.intensity = 0; pl.range = 12; pl.diffuse = new BABYLON.Color3(1.0,0.95,0.8);
    houseLights.push({ light:pl, mesh });
    if (mesh.material && mesh.material.emissiveColor) mesh.material.emissiveColor = new BABYLON.Color3(0,0,0);
  });
}
function setHousePower(on){
  housePower = on;
  houseLights.forEach(({light,mesh})=>{
    light.intensity = on ? (light.intensity>0 ? light.intensity : 0.8) : 0;
    if (mesh?.material?.emissiveColor) mesh.material.emissiveColor = on && light.intensity>0
      ? new BABYLON.Color3(1.4,1.2,0.9) : new BABYLON.Color3(0,0,0);
  });
}
function toggleNearestHouseLight(){
  if (!houseLights.length || !housePower) { toast(housePower? "No lights found." : "Power is OFF", 900); return; }
  let n=null, best=1e9;
  houseLights.forEach(h=>{ const d=BABYLON.Vector3.Distance(camera.position, h.light.position); if(d<best){ best=d; n=h; }});
  if (!n) return;
  const on = n.light.intensity>0;
  n.light.intensity = on ? 0 : 0.8;
  if (n.mesh?.material?.emissiveColor) n.mesh.material.emissiveColor = on ? new BABYLON.Color3(0,0,0) : new BABYLON.Color3(1.4,1.2,0.9);
}

function updateHUD(){ document.getElementById('hud-sanity').textContent = `${player.sanity|0}%`; document.getElementById('hud-room').textContent = player.room; }
function handleMovement(dt){
  const speed = player.running ? player.speedRun : player.speedWalk;
  let move = new BABYLON.Vector3(0,0,0);
  if(controls.forward) move.z += 1;
  if(controls.back)    move.z -= 1;
  if(controls.left)    move.x -= 1;
  if(controls.right)   move.x += 1;

  if(move.lengthSquared() > 0){
    move.normalize();
    const fwd = camera.getForwardRay().direction; fwd.y = 0; fwd.normalize();
    const right = BABYLON.Vector3.Cross(fwd, BABYLON.Axis.Y).scale(-1);
    const desired = fwd.scale(move.z).add(right.scale(move.x)).normalize();
    camera.cameraDirection = desired.scale(speed * dt);
  } else {
    camera.cameraDirection = new BABYLON.Vector3(0,0,0);
  }

  if(allowFly && dev.enabled){
    if(keysDown["PageUp"])   camera.position.y += 0.6 * dt * 60;
    if(keysDown["PageDown"]) camera.position.y -= 0.6 * dt * 60;
  }

  player.room = inVanZone(camera.position) ? "Van" : "Grounds";
  document.getElementById('storage-button').style.display = (player.room==="Van") ? "block" : "none";
  updateHUD();
}
function openDoorNearby(){
  const ray = scene.createPickingRay(scene.pointerX, scene.pointerY, BABYLON.Matrix.Identity(), camera);
  const pick = scene.pickWithRay(ray, m => /door/i.test(m.name||""));
  if(pick.hit && pick.pickedMesh){
    const d = BABYLON.Vector3.Distance(pick.pickedPoint, camera.position);
    if(d < 3.0){
      const door = pick.pickedMesh;
      const open = !door.metadata?.open;
      const baseRot = door.metadata?.baseRot ?? door.rotation.y;
      if(open){
        door.rotation = new BABYLON.Vector3(door.rotation.x, baseRot + Math.PI/2, door.rotation.z);
        door.checkCollisions = false;
        (Math.random()>0.5?audio.doorCreak1:audio.doorCreak2).play().catch(()=>{});
      } else {
        door.rotation = new BABYLON.Vector3(door.rotation.x, baseRot, door.rotation.z);
        door.checkCollisions = true;
      }
      door.metadata = { baseRot, open };
    }
  }
}

/* ===========================================================
   BELT / PREVIEW / CAMERA OVERLAY (safe/defensive)
   =========================================================== */
let notebookOpen = false;

// optional: cache a single preview engine so we don't leak multiples
let __pv = { engine: null, scene: null, cam: null, canvas: null, mesh: null };

function rebuildBelt(){
  const belt = document.getElementById('belt');
  if (!belt) return;                 // Guard: belt not in DOM yet → no-op

  belt.innerHTML = '';               // Clear once

  for (let i = 1; i <= 5; i++) {
    const slotDiv = document.createElement('div');
    slotDiv.className = 'slot' + (i === activeItemSlot ? ' active' : '');
    slotDiv.dataset.slot = i;

    const key = document.createElement('div');
    key.className = 'key';
    key.textContent = i;
    slotDiv.appendChild(key);

    const label = (typeof labelForSlot === 'function')
      ? labelForSlot(i)
      : (inventory.slots[i] || '-');

    const span = document.createElement('div');
    span.style.fontSize = '11px';
    span.style.color = '#8ff';
    span.style.textAlign = 'center';
    span.textContent = label;
    slotDiv.appendChild(span);

    slotDiv.onclick = (ev) => { ev.stopPropagation(); selectSlot(i); };
    belt.appendChild(slotDiv);
  }

  // Keep the rest of the UI in sync (guarded)
  if (typeof refreshHandPreview === 'function') refreshHandPreview();
  if (typeof refreshCameraOverlay === 'function') refreshCameraOverlay();
  if (typeof syncHeldLights === 'function') syncHeldLights();
}

function selectSlot(n){
  activeItemSlot = n;
  // if notebook is open and switching away from it, close
  if (notebookOpen && inventory.slots[n] !== 'Notebook' && typeof closeNotebook === 'function') {
    closeNotebook();
  }
  rebuildBelt();
  if (typeof syncHeldLights === 'function') syncHeldLights();
}

function refreshHandPreview(){
  const wrap = document.getElementById('hand-preview');
  if (!wrap) return;                 // Guard: preview host not mounted yet
  wrap.innerHTML = '';

  const item = inventory.slots[activeItemSlot];
  if (!item || !itemsGlb) { wrap.style.display = 'none'; return; }

  // Reuse a single engine/canvas for the preview
  if (!__pv.canvas) {
    __pv.canvas = document.createElement('canvas');
    __pv.canvas.width = 180;
    __pv.canvas.height = 140;
    __pv.canvas.style.width = '100%';
    __pv.canvas.style.height = '100%';
    wrap.appendChild(__pv.canvas);

    __pv.engine = new BABYLON.Engine(__pv.canvas, true);
    __pv.scene = new BABYLON.Scene(__pv.engine);
    __pv.scene.clearColor = new BABYLON.Color4(0,0,0,0);
    __pv.cam = new BABYLON.ArcRotateCamera("pvcam", Math.PI*1.2, Math.PI/3, 2.4, new BABYLON.Vector3(0,0.1,0), __pv.scene);
    __pv.cam.attachControl(__pv.canvas, false);
    __pv.cam.panningSensibility = 0; __pv.cam.wheelPrecision = 50;
    new BABYLON.HemisphericLight("pvH", new BABYLON.Vector3(0,1,0), __pv.scene).intensity = 1.2;

    __pv.window.startRenderLoopSafe(()=> __pv.scene && __pv.scene.render());
    window.addEventListener('resize', ()=> { try { __pv.engine && __pv.engine.resize(); } catch {} });
  } else {
    wrap.appendChild(__pv.canvas);
  }

  // swap mesh
  if (__pv.mesh) { try { __pv.mesh.dispose(); } catch {} __pv.mesh = null; }

  const meshName = ITEM_MODEL_MAP[item];
  const src = meshName && inventory.models[meshName];
  if (!src) { wrap.style.display = 'none'; return; }

  __pv.mesh = src.clone("pv-"+meshName, null, true);
  __pv.scene.addMesh(__pv.mesh);
  __pv.mesh.rotation = new BABYLON.Vector3(-Math.PI/2, Math.PI, 0);
  __pv.mesh.scaling = new BABYLON.Vector3(0.008,0.008,0.008);

  wrap.style.display = 'block';
}

function refreshCameraOverlay(){
  const overlay = document.getElementById('camera-overlay');
  const irBadge = document.getElementById('camera-ir');
  if (!overlay) return;              // Guard: overlay not mounted yet

  const item = inventory.slots[activeItemSlot];

  switch(item){

    case 'Spirit Box':
      if(player.room!=='Van' && dist<4){ if(Math.random()<0.55){ audio.spiritbox.play().catch(()=>{}); logEvidence("Spirit Box"); } else { audio.spiritStatic.play().catch(()=>{}); toast("...static...", 900); } }
      else toast("No response.", 800); break;

    case 'UV Light':
      if(Math.random()<0.4){ logEvidence("Fingerprints"); toast("A latent mark glows faintly.", 1000); } else toast("Nothing glows.", 900); break;
    case 'Ghost Writing Book':
      audio.writing.play().catch(()=>{}); setTimeout(()=>logEvidence("Ghost Writing"), 1200); toast("You place the book down...", 900); break;
    case 'D.O.T.S':
      if(Math.random()<0.45){ logEvidence("D.O.T.S"); toast("Something flickers through your setup...", 1000); } else toast("Nothing passes through.", 900); break;

  const ePage=pages.evidence; ePage.innerHTML=''; const ewrap=document.createElement('div');
  ewrap.innerHTML = '<div style="color:#9ff; margin-bottom:6px;">Check what you have found:</div>';
  EVIDENCE_TYPES.forEach(ev=>{ const r=document.createElement('div'); r.className='ev-row'; const cb=document.createElement('input'); cb.type='checkbox'; cb.dataset.ev=ev; cb.checked=discoveredEvidence.has(ev); cb.onchange=()=>{ if(cb.checked) discoveredEvidence.add(ev); else discoveredEvidence.delete(ev); }; const l=document.createElement('label'); l.textContent=ev; l.style.color='#8ff'; r.appendChild(cb); r.appendChild(l); ewrap.appendChild(r); });
  ePage.appendChild(ewrap);

  const gg=pages.guess; gg.innerHTML=''; const glabel=document.createElement('div'); glabel.style.color='#9ff'; glabel.textContent='Who do you think it is?'; gg.appendChild(glabel);
  const grid=document.createElement('div'); grid.style.display='grid'; grid.style.gridTemplateColumns='repeat(auto-fit, minmax(140px,1fr))'; grid.style.gap='6px'; grid.style.marginTop='6px';
  Object.keys(GHOSTS).forEach(k=>{ const btn=document.createElement('button'); btn.textContent=k.toUpperCase(); btn.style.cssText='border:1px solid #066; color:#9ff; background:#111; padding:8px 10px; cursor:pointer;'; btn.onclick=()=>{ const req=GHOSTS[k]; const allFound=req.every(e=>discoveredEvidence.has(e)); toast(allFound?`✅ Correct set matches: ${k.toUpperCase()}`:`❌ Not all evidence matches ${k.toUpperCase()}`, 1600); }; grid.appendChild(btn); });
  gg.appendChild(grid);
}

/* ===========================================================
   STORAGE
   =========================================================== */
function openStorage(){
  const modal=document.getElementById('storage-modal'); const grid=document.getElementById('storage-grid'); grid.innerHTML='';
  STORAGE_ITEMS.forEach(it=>{
    const card=document.createElement('div'); card.style.cssText='border:1px solid #066; padding:8px; background:#111; border-radius:6px;';
    const title=document.createElement('div'); title.style.color='#9ff'; title.style.marginBottom='6px'; title.textContent=it;
    const btn=document.createElement('button'); btn.textContent='Add to Slots 1–3'; btn.className='hud-btn'; btn.onclick=()=> addToLoadout(it);
    card.appendChild(title); card.appendChild(btn); grid.appendChild(card);
  });
  document.getElementById('storage-info').textContent = `Current: [${inventory.slots[1]||'-'}, ${inventory.slots[2]||'-'}, ${inventory.slots[3]||'-'}] — (4:Lighter, 5:Notebook)`;
  modal.style.display='flex'; storageOpen=true;
}
function closeStorage(){ document.getElementById('storage-modal').style.display='none'; storageOpen=false; }
function addToLoadout(item){ for(let i=1;i<=3;i++){ if(!inventory.slots[i]){ inventory.slots[i]=item; toast(`Added ${item} to slot ${i}`, 900); rebuildBelt(); return; } } toast('Slots 1–3 full. Remove one first.', 1200); }
function confirmLoadout(){ closeStorage(); }

/* ===========================================================
   DUAL JOYSTICKS (movement + look)
   =========================================================== */
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints>0);
const leftJoy = document.getElementById('joy-left');
const rightJoy = document.getElementById('joy-right');
const btnUse = document.getElementById('touch-use');
const btnNote = document.getElementById('touch-notebook');

let joyMove = { active:false, id:null, dx:0, dy:0 };
let joyLook = { active:false, id:null, dx:0, dy:0 };

function setupJoysticks(){
  if(!isTouch) return;
  leftJoy.style.display = 'block';
  rightJoy.style.display = 'block';
  btnUse.style.display = 'block';
  btnNote.style.display = 'block';

  const initJoy = (root, state)=>{
    const stick = root.querySelector('.stick');
    const base = root.getBoundingClientRect();
    const maxR = base.width*0.42;

    const setStick = (dx,dy)=>{
      const len = Math.hypot(dx,dy);
      if(len>maxR){ const s=maxR/len; dx*=s; dy*=s; }
      stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      state.dx = dx/maxR; state.dy = dy/maxR;
    };
    const reset = ()=>{ setStick(0,0); state.active=false; state.id=null; state.dx=0; state.dy=0; };

    root.addEventListener('pointerdown', (e)=>{
      if(state.active) return;
      state.active = true; state.id = e.pointerId;
      root.setPointerCapture(e.pointerId);
      const r = root.getBoundingClientRect();
      setStick(e.clientX-(r.left+r.width/2), e.clientY-(r.top+r.height/2));
      e.preventDefault();
    });
    root.addEventListener('pointermove', (e)=>{
      if(!state.active || e.pointerId!==state.id) return;
      const r = root.getBoundingClientRect();
      setStick(e.clientX-(r.left+r.width/2), e.clientY-(r.top+r.height/2));
    });
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
      root.addEventListener(ev, (e)=>{ if(e.pointerId===state.id) reset(); });
    });
  };

  initJoy(leftJoy, joyMove);
  initJoy(rightJoy, joyLook);

  btnUse.addEventListener('pointerdown', (e)=>{ useActiveItem(); e.preventDefault(); });
  btnNote.addEventListener('pointerdown', (e)=>{ openNotebook(); e.preventDefault(); });

  // Apply joystick states each frame
  scene.onBeforeRenderObservable.add(()=>{
    // movement (left)
    controls.forward = joyMove.dy < -0.25;
    controls.back    = joyMove.dy >  0.25;
    controls.left    = joyMove.dx < -0.25;
    controls.right   = joyMove.dx >  0.25;

    // look (right) — adjust camera rotation
    const lookYaw = joyLook.dx * 0.025;   // horizontal
    const lookPitch = joyLook.dy * 0.02;  // vertical
    camera.cameraRotation = camera.cameraRotation || new BABYLON.Vector2(0,0);
    camera.cameraRotation.y += lookYaw * engine.getDeltaTime(); // yaw
    camera.cameraRotation.x += lookPitch * engine.getDeltaTime(); // pitch
    camera.rotation.y = camera.cameraRotation.y;
    camera.rotation.x = BABYLON.Scalar.Clamp(camera.cameraRotation.x, -Math.PI/2.2, Math.PI/2.2);
  });
}

/* ===========================================================
   BREATH FX
   =========================================================== */
function setupBreathFX(){
  const ps = new BABYLON.ParticleSystem("breath", 200, scene);
  ps.particleTexture = new BABYLON.Texture("./assets/images/particles/smoke.png", scene, true);
  ps.color1 = new BABYLON.Color4(0.8,0.9,1,0.6);
  ps.color2 = new BABYLON.Color4(0.8,0.9,1,0.1);
  ps.minSize = 0.02; ps.maxSize = 0.06;
  ps.emitRate = 0;
  ps.minLifeTime = 0.3; ps.maxLifeTime = 0.7;
  ps.direction1 = new BABYLON.Vector3(0,0.7,0.2);
  ps.direction2 = new BABYLON.Vector3(0.1,0.8,0.1);
  ps.gravity = new BABYLON.Vector3(0,0,0);
  ps.updateSpeed = 0.02;
  ps.disposeOnStop = false;

  const anchor = new BABYLON.TransformNode("breathAnchor", scene);
  ps.emitter = anchor; ps.start();
  breath.ps = ps; breath.anchor = anchor;
}
function updateBreath(dt){
  if (!breath.ps || !breath.anchor) return;
  breath.anchor.position.copyFrom(camera.position.add(camera.getForwardRay().direction.scale(0.3)).add(new BABYLON.Vector3(0,0.1,0)));
  const nearGhost = ghost.mesh ? BABYLON.Vector3.Distance(ghost.mesh.position, camera.position) < BREATH_RANGE : false;
  const targetRate = nearGhost ? 90 : 0;
  const current = breath.ps.emitRate || 0;
  breath.ps.emitRate = BABYLON.Scalar.Lerp(current, targetRate, 0.1);
}

/* ===========================================================
   GHOST UPDATE / AI
   =========================================================== */
let footTimer = 0;
function updateGhost(dt){
  if(!ghost.mesh) return;

  if(!ghost.hunting){
    const pos = ghost.mesh.position;
    if(!ghost.target || BABYLON.Vector3.Distance(pos, ghost.target) < 1){
      ghost.target = randomPointInPolygonXZ(ghostPolygon);
    }
    const dir = ghost.target.subtract(pos); dir.y = 0; const len = dir.length();
    if (len > 0.001){
      dir.normalize();
      ghost.mesh.moveWithCollisions(dir.scale(ghost.speed * dt * 1.2));
      lookAtXZ(ghost.mesh, ghost.target);
    }
  } else {
    const target = camera.position.clone();
    const pos = ghost.mesh.position;
    const dir = target.subtract(pos); dir.y = 0; const len = dir.length();
    if(len > 0.001){
      dir.normalize();
      ghost.mesh.moveWithCollisions(dir.scale(ghost.speed * dt * 2.2 * (weather.modHuntPace||1)));
      lookAtXZ(ghost.mesh, target);
    }
  }

  // footstep SFX
  footTimer -= dt;
  if (footTimer <= 0){
    const dist = BABYLON.Vector3.Distance(ghost.mesh.position, camera.position);
    const audible = dist < ghost.footAudible;
    if (ghost.hunting && audible){
      try{
        const pick = Math.random()<0.5?audio.step1:(Math.random()<0.5?audio.step2:audio.step3);
        pick.currentTime=0; pick.volume=0.6; pick.play().catch(()=>{});
      }catch{}
    }
    footTimer = ghost.stepInterval + Math.random()*0.12;
  }
}

/* ===========================================================
   UI / INPUT BINDINGS
   =========================================================== */
let flashOn=false, uvOn=false, irOn=false;
const keysDown = {};

function initUI(){
  // Storage buttons
  document.getElementById('storage-button').addEventListener('click', openStorage);
  document.getElementById('storage-close').addEventListener('click', closeStorage);
  document.getElementById('storage-confirm').addEventListener('click', confirmLoadout);

  // Notebook
  document.getElementById('notebook-close').addEventListener('click', closeNotebook);

  // Touch helpers already wired in setupJoysticks()

  // Keyboard movement + actions
  window.addEventListener('keydown', (e)=>{
    keysDown[e.key] = true;
    if (e.repeat) return;
    switch(e.key){
      case 'w': case 'W': controls.forward=true; break;
      case 's': case 'S': controls.back=true; break;
      case 'a': case 'A': controls.left=true; break;
      case 'd': case 'D': controls.right=true; break;
      case 'Shift': player.running = true; break;

      case '1': case '2': case '3': case '4': case '5': selectSlot(parseInt(e.key,10)); break;
      case 'n': case 'N': openNotebook(); break;
      case 'e': case 'E': openDoorNearby(); break;

      case 'f': case 'F': flashOn=!flashOn; uvOn=false; irOn=false; syncHeldLights(); break;
      case 'u': case 'U': uvOn=!uvOn; flashOn=false; irOn=false; syncHeldLights(); break;
      case 'i': case 'I': irOn=!irOn; flashOn=false; uvOn=false; syncHeldLights(); refreshCameraOverlay(); break;
      case 'l': case 'L': toggleNearestHouseLight(); break;
      case 'p': case 'P': setHousePower(!housePower); break;
    }
  });
  window.addEventListener('keyup', (e)=>{
    keysDown[e.key] = false;
    switch(e.key){
      case 'w': case 'W': controls.forward=false; break;
      case 's': case 'S': controls.back=false; break;
      case 'a': case 'A': controls.left=false; break;
      case 'd': case 'D': controls.right=false; break;
      case 'Shift': player.running = false; break;
    }
  });

  // Mouse to use active item
  window.addEventListener('mousedown', (e)=>{ if(e.button===0) useActiveItem(); });

  // Scroll to change slots
  window.addEventListener('wheel', (e)=>{
    const dir = Math.sign(e.deltaY);
    activeItemSlot += dir>0 ? 1 : -1;
    if (activeItemSlot<1) activeItemSlot=5;
    if (activeItemSlot>5) activeItemSlot=1;
    rebuildBelt(); syncHeldLights();
  }, {passive:true});
}

function syncHeldLights(){
  const item = inventory.slots[activeItemSlot];
  flashLight.intensity = 0; uvLight.intensity = 0; irLight.intensity = 0;
  if (item==='Flashlight' && flashOn) flashLight.intensity = 3.0;
  if (item==='UV Light'   && uvOn)    uvLight.intensity   = 2.0;
  if (item==='Camera'     && irOn)    irLight.intensity   = 1.6;
}


/* === Dev Options Gate (ESC -> Yes -> password) === */
(function(){
  const ensureUI = ()=>{
    let gate = document.getElementById('dev-gate');
    if (!gate){
      gate = document.createElement('div'); gate.id='dev-gate';
      gate.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;z-index:99999;align-items:center;justify-content:center;';
      gate.innerHTML = '<div style="background:#0b0b0b;border:1px solid #066;border-radius:8px;padding:12px 14px;color:#0ff;width:min(420px,92vw)">'+
                       '<div style="font-weight:bold;margin-bottom:6px">Enable Developer Options?</div>'+
                       '<div style="display:flex;gap:8px;margin-bottom:8px;"><button id="dev-yes" class="hud-btn">Yes</button><button id="dev-no" class="hud-btn">No</button></div>'+
                       '<div id="dev-pass-wrap" style="display:none;gap:6px;align-items:center;"><input id="dev-pass" placeholder="Password" style="flex:1;padding:6px;background:#111;color:#9ff;border:1px solid #066;border-radius:6px"><button id="dev-pass-submit" class="hud-btn">Unlock</button></div>'+
                       '</div>';
      document.body.appendChild(gate);
    }
    let toggle = document.getElementById('devtools-toggle');
    if (!toggle){
      toggle = document.createElement('button');
      toggle.id='devtools-toggle';
      toggle.textContent='Dev Tools';
      toggle.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99998;display:none;padding:8px 12px;border:1px solid #066;background:#111;color:#0ff;border-radius:8px;';
      document.body.appendChild(toggle);
    }
    let panel = document.getElementById('devtools-panel');
    if (!panel){
      panel = document.createElement('div');
      panel.id='devtools-panel';
      panel.style.cssText='position:fixed;right:12px;bottom:56px;width:min(420px,92vw);max-height:60vh;overflow:auto;background:#0b0b0b;border:1px solid #066;border-radius:8px;padding:10px;color:#9ff;display:none;z-index:99997;';
      panel.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><div style="font-weight:bold;">Developer Panel</div><button id="devtools-close" class="hud-btn">Close</button></div>'+
                        '<div style="font-size:12px;color:#8ff;opacity:0.9">Quick toggles:</div>'+
                        '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;"><button class="hud-btn" id="dev-god">God Mode</button><button class="hud-btn" id="dev-fly">Fly Mode</button><button class="hud-btn" id="dev-blood">Blood Moon</button><button class="hud-btn" id="dev-clear">Clear</button><button class="hud-btn" id="dev-rain">Rain</button><button class="hud-btn" id="dev-snow">Snow</button></div>';
      document.body.appendChild(panel);
    }
    return {gate, toggle, panel};
  };

  const {gate, toggle, panel} = ensureUI();
  window.dev = window.dev || { enabled:false, gateOpen:false };

  // ESC -> gate
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !dev.enabled && !dev.gateOpen){
      gate.style.display = 'flex'; dev.gateOpen = true;
    }
  });

  gate.addEventListener('click', function(e){ if(e.target===gate){ gate.style.display='none'; dev.gateOpen=false; } });

  const btnYes = document.getElementById('dev-yes');
  const btnNo = document.getElementById('dev-no');
  const passWrap = document.getElementById('dev-pass-wrap');
  const passInput = document.getElementById('dev-pass');
  const passSubmit = document.getElementById('dev-pass-submit');

  if (btnYes) btnYes.onclick = ()=>{ passWrap.style.display='flex'; passInput.focus(); };
  if (btnNo)  btnNo.onclick  = ()=>{ gate.style.display='none'; dev.gateOpen=false; };
  if (passSubmit) passSubmit.onclick = ()=>{
    const val = (passInput.value||'').trim();
    if (val === 'letmein'){
      dev.enabled = true; gate.style.display='none'; dev.gateOpen=false;
      toast('Developer options enabled.', 1800);
      toggle.style.display='block';
    } else {
      toast('Wrong password.', 1200);
    }
    passInput.value='';
  };

  toggle.addEventListener('click', ()=>{ panel.style.display = (panel.style.display==='block' ? 'none' : 'block'); });

  document.getElementById('devtools-close').addEventListener('click', ()=>{ panel.style.display='none'; });

  // Quick toggles in panel (defensive)
  const byId = id => document.getElementById(id);
  const bind = (id, fn)=>{ const el = byId(id); if(el) el.onclick = fn; };

  bind('dev-god', ()=>{ window.player = window.player||{}; player.god = !player.god; toast('God mode: '+(player.god?'ON':'OFF'), 1000); });
  bind('dev-fly', ()=>{ window.allowFly = !window.allowFly; toast('Fly mode: '+(window.allowFly?'ON':'OFF'), 1000); });
  bind('dev-blood', ()=>{ if(typeof setWeather==='function') callSetWeather('Blood Moon'); });
  bind('dev-clear', ()=>{ if(typeof setWeather==='function') callSetWeather('Clear'); });
  bind('dev-rain', ()=>{ if(typeof setWeather==='function') callSetWeather('Rain'); });
  bind('dev-snow', ()=>{ if(typeof setWeather==='function') callSetWeather('Snow'); });
})();
