<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney — 3D Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <meta name="author" content="Shark-Blades" />
  <meta name="description" content="3D ghost hunting prototype built with Babylon.js" />
  <meta name="keywords" content="PhasmaPhoney, Phasmophobia, ghost, hunting, game, HTML, Babylon.js" />

  <!-- Babylon core + loaders -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/earcut.min.js"></script>
  <script src="./cdn/meshopt_decoder.js"></script>
  <script src="./cdn/draco_decoder_gltf.js"></script>
  <script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script>
  <script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
  <script src="./cdn/gui/babylon.gui.min.js"></script>

  <!-- Procedural house builder -->
  <script src="./assets/index3/house_procedural.js"></script>
  <!-- (Removed the old inline call here) -->

  <!-- Optional: room names -->
  <script src="./rooms.js"></script>

  <style>
    html, body { margin:0; height:100%; width:100%; background:#000; overflow:hidden; font-family:monospace; color:#0ff; }
    #renderCanvas { width:100vw; height:100vh; touch-action:none; display:block; background:#000; }
    /* (all your existing CSS unchanged) */
  </style>
</head>

<body>
  <div id="flash-overlay"></div>
  <div id="camera-overlay">
    <div id="camera-rec">REC ●</div>
    <div id="camera-orb"></div>
    <div id="camera-ir">IR</div>
  </div>
  <canvas id="renderCanvas"></canvas>

  <!-- (HUD, notebook, storage, dev tools etc. all unchanged from your current file) -->

  <!------------------------------- SCRIPTS ---------------------------->
  <script src="./assets/index3/core.js"></script>
  <script src="./assets/index3/utils.js"></script>

  <!-- Reticle -->
  <script>
    window.RETICLE_OPTS = { style: "circle-dot", size: 22, color: "#9ff", hitColor: "#0f0" };
  </script>
  <script src="./assets/index3/reticle.js?v=1"></script>

  <!-- Input & UI -->
  <script src="./assets/index3/ui_input.js?v=1"></script>

  <!-- icons + items -->
  <script src="./assets/index3/icons.js?v=1"></script>
  <script src="./assets/index3/video_feed.js?v=1.2"></script>
  <script src="./assets/index3/items_models_exploration.js?v=2.0"></script>
  <script src="./assets/index3/spiritbox_audio_glue.js?v=1.0"></script>
  <script src="./assets/index3/items_runtime_patch.js?v=1.1"></script>
  <script src="./assets/index3/items.js?v=2.0"></script>

  <!-- atmosphere / world -->
  <script src="./assets/index3/atmosphere.js?v=1"></script>

  <!-- Weather config FIRST, then weather engine -->
  <script>
    window.WEATHER_AUDIO_MAP = { thunder: ['thunder.mp3'] };
  </script>
  <script src="./assets/index3/weather.js?v=1"></script>
  <script src="./assets/index3/weather_glue.js?v=1.0"></script>

  <script src="./assets/index3/temperature.js?v=1"></script>
  <script src="./assets/index3/moon.js?v=1"></script>
  <script src="./assets/index3/lights.js?v=1"></script>
  <script>window.MAP_URL = "./assets/models/map/jailhouse.glb";</script>

  <script src="./assets/index3/map.js?v=2.1"></script>
  <script src="./assets/index3/player_crouch.js?v=1.0"></script>

  <!-- DevTools -->
  <script>window.DEVTOOLS_AUTO_OPEN = false;</script>
  <script src="./assets/index3/devtools.js?v=7.4.0"></script>
  <!-- (devtools guard code unchanged) -->

  <!-- Ghost systems -->
  <script src="./assets/index3/ghost_dev.js?v=1.4"></script>
  <script src="./assets/index3/ghost_movement.js?v=2.2"></script>
  <script src="./assets/index3/ghost_glue.js?v=1"></script>
  <script src="./assets/index3/ghost_data.js?v=1"></script>
  <script src="./assets/index3/ghost_cam.js?v=1.0"></script>

  <!-- Post-load helpers (video feed, ground tagging) -->
  <script>
    // (unchanged helper code)
  </script>

  <!-- Main runtime -->
  <script src="./assets/index3/main.js?v=1"></script>

  <!-- Havok integration -->
  <script src="./cdn/havok/HavokPhysics_umd.js"></script>
  <script src="./assets/index3/havok_bootstrap.js"></script>
  <script src="./assets/index3/house_physics.js"></script>
  <script src="./assets/index3/init_house_and_havok.js"></script>
</body>
</html>
