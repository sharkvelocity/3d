<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney — 3D Prototype (CDN-Local, Moon Fix)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="description" content="Babylon.js prototype with consolidated dev panel and corrected moon loader." />

  <!-- Use YOUR repo's local runtime (./cdn) -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/earcut.min.js"></script>
  <script src="./cdn/meshopt_decoder.js"></script>
  <script src="./cdn/draco_decoder_gltf.js"></script>
  <script src="./cdn/babylonjs.loaders.min.js"></script>
  <!-- optional inspector if present -->
  <script src="./cdn/babylon.inspector.bundle.js"></script>

  <style>
    :root{ --bg:#0a0a0a; --fg:#e6f1ff; --muted:#93a4b7; --accent:#7dd3fc; --accent2:#34d399; }
    html,body{height:100%;margin:0;background:#0a0a0a;color:#e6f1ff;font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
    #renderCanvas{width:100vw;height:100vh;touch-action:none;display:block;background:#000}
    .screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 800px at 50% 40%,#12151a 0%,#0a0a0a 60%,#000 100%);z-index:50}
    #titleCard{width:min(720px,92vw);padding:28px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);text-align:center}
    #logo{font-size:40px;font-weight:800;color:#eaf2ff;text-shadow:0 0 20px rgba(125,211,252,.35)}
    .row{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:20px}
    .btn{appearance:none;border:0;border-radius:12px;padding:14px 18px;font-weight:700;letter-spacing:.4px;cursor:pointer;color:#061018}
    .solid{background:linear-gradient(180deg,var(--accent),#38bdf8)}
    .ghost{background:linear-gradient(180deg,var(--accent2),#16a34a)}
    #loadingOverlay{position:fixed;inset:0;background:linear-gradient(180deg,#0a0f14,#07090c 60%,#050607);display:none;align-items:center;justify-content:center;z-index:60}
    #loadingCard{width:min(680px,92vw);padding:22px;border-radius:16px;background:rgba(18,20,23,0.65);backdrop-filter:blur(8px)}
    .bar{height:12px;background:#1a2733;border-radius:999px;overflow:hidden}
    .fill{height:100%;width:0%;background:linear-gradient(90deg,#34d399,#22d3ee,#38bdf8);transition:width .1s ease}
    #hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:30}
    #hudTop{position:absolute;top:12px;left:12px;display:flex;gap:10px}
    .chip{pointer-events:auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);padding:8px 10px;border-radius:12px;font-size:12px}
    #hudRight{position:absolute;top:12px;right:12px;display:flex;gap:10px}
    #hudBottom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
    #belt{pointer-events:auto;display:flex;gap:8px;background:rgba(10,12,15,.55);padding:10px 12px;border-radius:14px}
    .slot{width:70px;min-height:60px;border-radius:12px;background:linear-gradient(180deg,#0f1319,#0c0f14);border:1px solid rgba(255,255,255,.08);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .slot.active{outline:2px solid #38bdf8}
    .key{position:absolute;top:4px;left:6px;font-size:10px;color:#a7c1d6}
    .label{font-size:12px;color:#bfe5ff;margin-top:4px}
    #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#e5f0ff;border:1px solid #233244;padding:10px 12px;border-radius:10px;display:none;z-index:80}
    #dev-gate{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;z-index:99999;align-items:center;justify-content:center;}
    #dev-panel{position:fixed;right:12px;bottom:56px;width:min(440px,92vw);max-height:60vh;overflow:auto;background:#0b0b0b;border:1px solid #066;border-radius:10px;padding:10px;color:#9ff;display:none;z-index:99997;}
    #dev-toggle{position:fixed;right:12px;bottom:12px;z-index:99998;display:none;padding:8px 12px;border:1px solid #066;background:#111;color:#0ff;border-radius:8px;}
  </style>
</head>
<body>
  <div id="titleScreen" class="screen">
    <div id="titleCard">
      <div id="logo">PHASMAPHONEY</div>
      <div>Local Babylon runtime (./cdn) • Clean startup • Moon loader fixed</div>
      <div class="row">
        <button id="startBtn" class="btn solid">Start Investigation</button>
        <button id="inspectorBtn" class="btn ghost" title="Shift+I also works">Open Inspector</button>
      </div>
    </div>
  </div>

  <div id="loadingOverlay">
    <div id="loadingCard">
      <div>Loading assets… <span id="loadPct">0%</span></div>
      <div class="bar"><div id="loadFill" class="fill"></div></div>
      <div style="display:flex;justify-content:space-between;color:#93a4b7;font-size:12px;margin-top:8px">
        <span id="loadLabel">Preparing engine</span><span id="loadDetail">0 / 0</span>
      </div>
    </div>
  </div>

  <div id="hud">
    <div id="hudTop">
      <div class="chip" id="roomChip">Room: —</div>
      <div class="chip" id="weatherChip">Weather: Clear</div>
      <div class="chip" id="sanityChip">Sanity: 100%</div>
    </div>
    <div id="hudRight">
      <div class="chip" id="posChip">X: 0 Y: 0 Z: 0</div>
      <div class="chip" id="modeChip">Walk</div>
    </div>
    <div id="hudBottom"><div id="belt"></div></div>
  </div>

  <!-- Dev Gate + Panel -->
  <div id="dev-gate">
    <div style="background:#0b0b0b;border:1px solid #066;border-radius:8px;padding:12px 14px;color:#0ff;width:min(420px,92vw)">
      <div style="font-weight:bold;margin-bottom:6px">Enable Developer Options?</div>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <button id="dev-yes" class="btn ghost" style="padding:8px 12px;">Yes</button>
        <button id="dev-no" class="btn solid" style="padding:8px 12px;">No</button>
      </div>
      <div id="dev-pass-wrap" style="display:none;gap:6px;align-items:center;">
        <input id="dev-pass" placeholder="Password" style="flex:1;padding:6px;background:#111;color:#9ff;border:1px solid #066;border-radius:6px">
        <button id="dev-pass-submit" class="btn ghost" style="padding:8px 12px;">Unlock</button>
      </div>
    </div>
  </div>
  <button id="dev-toggle">Dev Tools</button>
  <div id="dev-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <div style="font-weight:bold;">Developer Panel</div>
      <button id="dev-close" class="btn ghost" style="padding:6px 10px;">Close</button>
    </div>
    <div style="font-size:12px;color:#8ff;opacity:0.9">Quick toggles:</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;">
      <button class="btn ghost" id="dev-god"     style="padding:6px 10px;">God Mode</button>
      <button class="btn ghost" id="dev-fly"     style="padding:6px 10px;">Fly Mode</button>
      <button class="btn ghost" id="dev-blood"   style="padding:6px 10px;">Blood Moon</button>
      <button class="btn ghost" id="dev-clear"   style="padding:6px 10px;">Clear</button>
      <button class="btn ghost" id="dev-rain"    style="padding:6px 10px;">Rain</button>
      <button class="btn ghost" id="dev-snow"    style="padding:6px 10px;">Snow</button>
    </div>
  </div>

  <canvas id="renderCanvas"></canvas>
  <div id="toast" style="display:none"></div>

  <script>
  (()=>{
    'use strict';
    const $ = (id)=>document.getElementById(id);
    const startBtn=$('startBtn'), inspectorBtn=$('inspectorBtn');
    const titleScreen=$('titleScreen'), loadingOverlay=$('loadingOverlay');
    const loadFill=$('loadFill'), loadPct=$('loadPct'), loadLabel=$('loadLabel'), loadDetail=$('loadDetail');
    const hud=$('hud'), weatherChip=$('weatherChip'), sanityChip=$('sanityChip'), posChip=$('posChip'), modeChip=$('modeChip'), beltEl=$('belt');
    const toastEl=$('toast'); const canvas=$('renderCanvas');

    const S={ booting:false, booted:false, engine:null, scene:null, camera:null, light:null, ghost:null,
              lighterOn:false, flyMode:false, activeSlot:1, inventory:{1:'EMF',2:'Camera',3:'Crucifix',4:'Lighter',5:'Notebook'},
              toLoad:0, done:0, weather:'Clear', sanity:100 };

    let toastTimer=null;
    function toast(msg,ms=2200){ toastEl.textContent=msg; toastEl.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.style.display='none',ms); }
    function show(el,on){ el.style.display = on ? (el===loadingOverlay?'flex':'block') : 'none'; }
    function setLoading(total){ S.toLoad=total; S.done=0; updateLoad(0,'Initializing'); show(loadingOverlay,true); }
    function stepLoad(label){ S.done++; updateLoad(S.done/S.toLoad*100,label); }
    function updateLoad(pct,label){ const p=Math.max(0,Math.min(100,Math.floor(pct))); loadFill.style.width=p+'%'; loadPct.textContent=p+'%'; if(label) loadLabel.textContent=label; loadDetail.textContent=`${S.done} / ${S.toLoad}`; }
    function renderBelt(){ beltEl.innerHTML=''; for(let i=1;i<=5;i++){ const slot=document.createElement('div'); slot.className='slot'+(i===S.activeSlot?' active':''); const k=document.createElement('div'); k.className='key'; k.textContent=i; slot.appendChild(k); const lab=document.createElement('div'); lab.className='label'; lab.textContent=S.inventory[i]||'-'; slot.appendChild(lab); slot.onclick=(e)=>{ e.stopPropagation(); S.activeSlot=i; renderBelt(); }; beltEl.appendChild(slot);} }

    function ensureEngine(){ if(!S.engine){ S.engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true}); } return S.engine; }
    function ensureScene(){ if(!S.scene){ S.scene=new BABYLON.Scene(S.engine); S.scene.collisionsEnabled=true; } return S.scene; }

    function setupLighting(){ stepLoad('Lighting…'); const hemi=new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0,1,0), S.scene); hemi.intensity=0.6;
      const dir=new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.6,-1,-0.3), S.scene); dir.position=new BABYLON.Vector3(20,40,20); dir.intensity=0.8; S.light=dir;
      const L=S.scene.lights; for(let i=0;i<L.length;i++){ const on=i<2; try{L[i].setEnabled(on);}catch{} }
      (S.scene.materials||[]).forEach(m=>{ if('maxSimultaneousLights' in m) m.maxSimultaneousLights=Math.min(m.maxSimultaneousLights||2,2); });
    }

    function setupCameraAndPlayer(){ stepLoad('Camera & player…');
      const cam=new BABYLON.UniversalCamera('playerCam', new BABYLON.Vector3(0,2,0), S.scene);
      cam.attachControl(canvas,true); cam.speed=0.35; cam.angularSensibility=4000; cam.ellipsoid=new BABYLON.Vector3(0.4,0.9,0.4); cam.checkCollisions=true; cam.applyGravity=true;
      S.scene.gravity=new BABYLON.Vector3(0,-0.098,0); cam.keysUp.push(87); cam.keysDown.push(83); cam.keysLeft.push(65); cam.keysRight.push(68); S.camera=cam;
      const ground=BABYLON.MeshBuilder.CreateGround('fallbackGround',{width:400,height:400,subdivisions:2},S.scene); ground.isPickable=true; ground.checkCollisions=true; ground.position.y=0; ground.visibility=0.0;
      cam.position=new BABYLON.Vector3(0,1.8,0);
    }

    async function loadHouse(){ stepLoad('Loading house…');
      const path = "./assets/models/map/Abandoned_House.glb"; // exact path from your repo
      await BABYLON.SceneLoader.AppendAsync("./assets/models/map/", "Abandoned_House.glb", S.scene);
      S.scene.meshes.forEach(m=>{ if(!m) return; const n=(m.name||'').toLowerCase(); m.checkCollisions=/(wall|door|floor|ground|stairs|house|room)/.test(n); m.isPickable=true; });
    }

    // --- Moon loader (FIXED) ---
    async function loadMoon(){
      stepLoad('Loading moon…');
      try{
        const imp = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/sky/", "moon.glb", S.scene);
        const moon = imp.meshes.find(m=>m && m.name!=="__root__") || imp.meshes[0];
        moon.isPickable=false; moon.checkCollisions=false; moon.applyFog=false; moon.renderingGroupId=1;
        // ensure emissive, no lighting
        const mat = moon.material || new BABYLON.StandardMaterial("moonMat", S.scene);
        mat.disableLighting = true;
        mat.emissiveColor = new BABYLON.Color3(1,1,1);
        moon.material = mat;
        // simple sky motion
        S.scene.onBeforeRenderObservable.add(()=>{
          const t = performance.now()*0.00002;
          moon.position.x = Math.cos(t)*380;
          moon.position.z = Math.sin(t)*380;
          moon.position.y = 340 + Math.sin(t*1.7)*10;
        });
      }catch(e){
        // fallback: emissive sphere so the sky isn't empty
        const moon=BABYLON.MeshBuilder.CreateSphere('moon',{diameter:60,segments:18},S.scene);
        moon.isPickable=false; moon.applyFog=false; moon.renderingGroupId=1;
        const mat=new BABYLON.StandardMaterial('moonMat',S.scene); mat.disableLighting=true; mat.emissiveColor=new BABYLON.Color3(0.9,0.9,0.9); moon.material=mat; moon.position=new BABYLON.Vector3(0,350,380);
      }
    }

    async function spawnGhost(){ stepLoad('Spawning entity…'); const ghost=new BABYLON.TransformNode('ghost',S.scene); ghost.setEnabled(false); S.ghost=ghost; }

    function setupHUD(){ renderBelt(); weatherChip.textContent='Weather: '+S.weather; sanityChip.textContent='Sanity: '+S.sanity+'%'; }
    function setupInputs(){
      window.addEventListener('keydown',(e)=>{
        if(e.key==='`'){ S.flyMode=!S.flyMode; modeChip.textContent=S.flyMode?'Fly':'Walk'; S.scene.gravity=S.flyMode? new BABYLON.Vector3(0,0,0):new BABYLON.Vector3(0,-0.098,0); toast('Mode: '+modeChip.textContent); }
        if(e.key.toLowerCase()==='l'){ S.lighterOn=!S.lighterOn; toast(S.lighterOn?'Lighter ON':'Lighter OFF'); }
        if(e.key.toLowerCase()==='n'){ toast('Notebook toggled'); }
        if(e.shiftKey && (e.key==='I'||e.key==='i')){ try{ BABYLON.Inspector.Show(S.scene,{});}catch{ toast('Inspector not available'); } }
      });
      S.scene.onBeforeRenderObservable.add(()=>{ const p=S.camera.position; posChip.textContent=`X: ${p.x.toFixed(1)} Y: ${p.y.toFixed(1)} Z: ${p.z.toFixed(1)}`; });
    }

    // Dev gate/panel
    const devGate=$('dev-gate'), devYes=$('dev-yes'), devNo=$('dev-no'), devPassWrap=$('dev-pass-wrap'), devPass=$('dev-pass'), devPassSubmit=$('dev-pass-submit');
    const devToggle=$('dev-toggle'), devPanel=$('dev-panel'), devClose=$('dev-close');
    window.addEventListener('keydown',(e)=>{ if(e.key==='Escape' && devGate.style.display!=='flex' && !S.booted){ devGate.style.display='flex'; devPass.value=''; devPassWrap.style.display='none'; } });
    if(devYes) devYes.onclick=()=>{ devPassWrap.style.display='flex'; devPass.focus(); };
    if(devNo)  devNo.onclick =()=>{ devGate.style.display='none'; };
    if(devPassSubmit) devPassSubmit.onclick=()=>{ const v=(devPass.value||'').trim(); if(v==='letmein'){ devGate.style.display='none'; devToggle.style.display='block'; toast('Developer options enabled.',1200);} else toast('Wrong password.',1200); devPass.value=''; };
    devToggle.onclick=()=>{ devPanel.style.display = (devPanel.style.display==='block'?'none':'block'); };
    devClose.onclick =()=>{ devPanel.style.display='none'; };
    const qe=(id)=>document.getElementById(id); qe('dev-god').onclick=()=>{ window.__god=!window.__god; toast('God mode: '+(window.__god?'ON':'OFF'),900); };
    qe('dev-fly').onclick=()=>{ const e=new KeyboardEvent('keydown',{key:'`'}); window.dispatchEvent(e); };
    qe('dev-blood').onclick=()=>{ weatherChip.textContent='Weather: Blood Moon'; };
    qe('dev-clear').onclick=()=>{ weatherChip.textContent='Weather: Clear'; };
    qe('dev-rain').onclick=()=>{ weatherChip.textContent='Weather: Rain'; };
    qe('dev-snow').onclick=()=>{ weatherChip.textContent='Weather: Snow'; };

    async function safeStart(){
      if(S.booting||S.booted) return; S.booting=true;
      try{
        show(titleScreen,false); setLoading(6);
        ensureEngine(); ensureScene();
        setupLighting();
        setupCameraAndPlayer();
        await loadHouse();
        await spawnGhost();
        await loadMoon(); // fixed loader with exact path
        setupHUD(); setupInputs();
        stepLoad('Finalizing…');
        S.engine.runRenderLoop(()=>{ if(S.scene) S.scene.render(); });
        window.addEventListener('resize', ()=>{ try{ S.engine.resize(); }catch{} });
        show(loadingOverlay,false); hud.style.display='block'; S.booted=true; toast('Investigation started.');
      }catch(err){
        console.error('Startup error', err); toast('Startup failed: '+(err?.message||err));
        show(titleScreen,true); show(loadingOverlay,false);
      }finally{ S.booting=false; }
    }

    startBtn.addEventListener('click', (ev)=>{ ev.preventDefault(); safeStart(); });
    inspectorBtn.addEventListener('click', ()=>{ try{ BABYLON.Inspector.Show(S.scene, {embedMode:false}); }catch{ toast('Inspector not available'); } });
  })();
  </script>
</body>
</html>
