  <div id="devtools-panel" style="position:fixed;right:12px;bottom:60px;width:420px;max-height:70vh;overflow:auto;background:#111;border:1px solid #333;border-radius:10px;padding:12px;display:none;z-index:9999;font:12px/1.4 monospace;color:#ddd;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <strong>Developer Tools</strong>
      <button id="devtools-close" class="hud-btn">Close</button>

      <legend>Map Recorder</legend>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button id="map-start" class="hud-btn">Start</button>
        <button id="map-pin" class="hud-btn" disabled>Pin</button>
        <button id="map-save" class="hud-btn" disabled>Save</button>

          <option value="">Select room…</option>
        </select>

      <label for="dev-log">Log</label>
      <textarea id="dev-log" style="width:100%;height:160px;background:#0b0b0b;color:#a8f;resize:vertical;border:1px solid #333;border-radius:8px;padding:8px;" readonly></textarea>
    </div>
  </div>

  <!-- Hand preview, Belt, Touch controls, Toast -->
  <div id="hand-preview"></div>
  <div id="belt"></div>
  <div id="touch-controls">
    <div class="tbtn" id="t-up">↑</div>
    <div class="tbtn" id="t-use">USE</div>
    <div class="tbtn" id="t-left">←</div>
    <div class="tbtn" id="t-right">→</div>
  </div>
  <div id="toast"></div>

<script>
/* ========= Loading overlay helpers ========= */
function showLoading(on){
  const el = document.getElementById('loading-overlay');
  if(!el) return;
  el.style.display = on ? 'flex' : 'none';
  el.setAttribute('aria-hidden', on ? 'false' : 'true');
}
function setProgress(pct, msg){
  const bar = document.getElementById('loading-bar');
  const text = document.getElementById('loading-text');
  const title = document.getElementById('loading-title');
  const clamped = Math.max(0, Math.min(100, Math.round(pct)));
  if(bar) bar.style.width = clamped + '%';
  if(text) text.textContent = clamped + '%';
  if(title && msg) title.textContent = msg;
}
function toast(msg, ms=1400){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none', ms); }

/* ========= Globals ========= */
const canvas = document.getElementById('renderCanvas');
let engine, scene, camera, skybox;
let moonLight, flashLight, uvLight, irLight;
let houseLights = []; let housePower = true;

let player = { sanity:100, room:'Van', speedWalk:0.9, speedRun:1.8, running:false };
let controls = { forward:false, back:false, left:false, right:false };
let allowFly=false;
let activeItemSlot = 1;

let inventory = { slots:{1:null,2:null,3:null,4:'Lighter',5:'Notebook'} };
const STORAGE_ITEMS = ['Flashlight','UV Light','Camera','EMF','Spirit Box','Thermometer','Crucifix','Salt','Smudge','D.O.T.S','Ghost Writing Book','Motion Sensor'];
const EVIDENCE_TYPES = ["EMF Level 5","Spirit Box","Fingerprints","Ghost Writing","Freezing Temps","D.O.T.S","Orbs"];
const GHOSTS = {
  spirit:["Spirit Box","Ghost Writing","EMF Level 5"],
  wraith:["Spirit Box","D.O.T.S","EMF Level 5"],
  poltergeist:["Spirit Box","Ghost Writing","Fingerprints"],
  banshee:["D.O.T.S","Fingerprints","Orbs"],
  jinn:["EMF Level 5","Freezing Temps","Fingerprints"],
  mare:["Spirit Box","Ghost Writing","Orbs"],
  revenant:["Ghost Writing","Orbs","Freezing Temps"],
  shade:["Ghost Writing","Freezing Temps","EMF Level 5"],
  demon:["Freezing Temps","Ghost Writing","Fingerprints"],
  yurei:["Freezing Temps","D.O.T.S","Orbs"],
  oni:["EMF Level 5","Freezing Temps","D.O.T.S"],
  yokai:["Spirit Box","D.O.T.S","Orbs"],
  hantu:["Freezing Temps","Ghost Writing","Fingerprints"],
  goryo:["EMF Level 5","D.O.T.S","Fingerprints"],
  myling:["Ghost Writing","EMF Level 5","Fingerprints"],
  onryo:["Freezing Temps","Spirit Box","Orbs"],
  "the twins":["Spirit Box","Freezing Temps","EMF Level 5"],
  raiju:["EMF Level 5","D.O.T.S","Orbs"],
  obake:["EMF Level 5","Orbs","Fingerprints"],
  "the mimic":["Spirit Box","Freezing Temps","Fingerprints"],
  moroi:["Freezing Temps","Ghost Writing","Spirit Box"],
  deogen:["Spirit Box","Ghost Writing","D.O.T.S"],
  thaye:["Ghost Writing","Orbs","D.O.T.S"],
  phantom:["Spirit Box","D.O.T.S","Fingerprints"],
  succubus:["Ghost Writing","Orbs","Spirit Box"]
};
let discoveredEvidence = new Set();

/* ========= Start button binding ========= */
let __started=false;
async function safeStart(){
  if(__started) return; __started=true;

  if(!window.BABYLON || !BABYLON.Engine){
    toast("Engine not ready. Check Babylon includes.", 2200);
    __started=false; return;
  }

  document.getElementById('title-screen').style.display='none';
  showLoading(true); setProgress(5,"Initializing…");

  try{
    await boot();
  }catch(err){
    console.error(err);
    toast("Startup failed: " + (err?.message||err), 2800);
    document.getElementById('title-screen').style.display='flex';
    showLoading(false);
    __started=false; return;
  }

  setProgress(100,"Ready.");
  setTimeout(()=> showLoading(false), 240);
  toast("Atmosphere ready. F=Flash, U=UV, I=IR, L=nearest light, N=Notebook.", 3200);
}
(function bindStart(){
  const btn=document.getElementById('start-button');
  const screen=document.getElementById('title-screen');
  btn.onclick=safeStart;
  btn.onkeydown=e=>{ if(e.key==='Enter'||e.code==='Space'){e.preventDefault();safeStart();} };
  screen.addEventListener('click', e=>{ if(e.target===screen) safeStart(); });
  window.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.code==='Space') safeStart(); });
})();

/* ========= Scene boot ========= */
async function boot(){
  engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true });
  scene = new BABYLON.Scene(engine);
  scene.collisionsEnabled = true;
  scene.gravity = new BABYLON.Vector3(0,-0.5,0);

  // Camera
  camera = new BABYLON.UniversalCamera("playerCam", new BABYLON.Vector3(0, 2, -6), scene);
  camera.attachControl(canvas, true);
  camera.applyGravity = true;
  camera.checkCollisions = true;
  camera.ellipsoid = new BABYLON.Vector3(0.35, 0.9, 0.35);
  camera.ellipsoidOffset = new BABYLON.Vector3(0, 0.4, 0);
  camera.minZ = 0.1; camera.inertia=0;

  // Lights & simple night sky
  setupNightAtmosphere();

  // Map fallback: simple ground so there’s always something to stand on
  setProgress(30,"Loading map…");
  const ground = BABYLON.MeshBuilder.CreateGround("ground",{width:120,height:120},scene);
  ground.checkCollisions = true;
  const gmat = new BABYLON.StandardMaterial("gmat", scene);
  gmat.diffuseColor = new BABYLON.Color3(0.05,0.07,0.10);
  gmat.specularColor = new BABYLON.Color3(0,0,0);
  ground.material = gmat;

  // Basic house light placeholders (near player)
  setProgress(55,"Setting up lights…");
  for(let i=0;i<4;i++){
    const pl = new BABYLON.PointLight("houseLight_"+i, new BABYLON.Vector3(-4+i*2, 3, -2), scene);
    pl.intensity = 0.8; pl.range=10; pl.diffuse = new BABYLON.Color3(1.0,0.95,0.8);
    houseLights.push({ light:pl, mesh:null });
  }

  // UI
  setProgress(70,"Bringing up UI…");
  document.getElementById("hud").style.display="block";
  rebuildBelt();
  renderNotebook(); // prepare notebook content

  // Render
  engine.runRenderLoop(()=> scene.render());
  window.addEventListener('resize', ()=> engine.resize());
}

/* ========= Atmosphere ========= */
function setupNightAtmosphere(){
  scene.clearColor = new BABYLON.Color4(0.01,0.01,0.02,1);
  scene.ambientColor = new BABYLON.Color3(0.02,0.02,0.05);
  scene.imageProcessingConfiguration.exposure = 0.58;
  scene.imageProcessingConfiguration.contrast = 1.15;
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.0042;
  scene.fogColor = new BABYLON.Color3(0.02,0.03,0.05);

  // Skybox (simple dark cube)
  const sky = BABYLON.MeshBuilder.CreateBox("skybox",{size:1200},scene);
  const mat = new BABYLON.StandardMaterial("skyMat", scene);
  mat.backFaceCulling=false; mat.disableLighting=true; mat.emissiveColor=new BABYLON.Color3(0.02,0.03,0.07);
  mat.diffuseColor = new BABYLON.Color3(0,0,0); mat.specularColor=new BABYLON.Color3(0,0,0);
  sky.material=mat; sky.infiniteDistance=true; sky.isPickable=false;

  // Moon / player lights
  moonLight = new BABYLON.DirectionalLight("moonLight", new BABYLON.Vector3(-0.2,-1,0.1), scene);
  moonLight.position = new BABYLON.Vector3(0,200,0);
  moonLight.intensity = 0.45;

  flashLight = new BABYLON.SpotLight("flashLight", new BABYLON.Vector3(0,0,0), new BABYLON.Vector3(0,0,1), Math.PI/3, 10, scene);
  flashLight.parent = camera; flashLight.intensity = 0; flashLight.range = 40;

  uvLight = new BABYLON.SpotLight("uvLight", new BABYLON.Vector3(0,0,0), new BABYLON.Vector3(0,0,1), Math.PI/3, 8, scene);
  uvLight.parent = camera; uvLight.intensity = 0; uvLight.range = 30;
  uvLight.diffuse = new BABYLON.Color3(0.6,0.3,0.9); uvLight.specular = new BABYLON.Color3(0,0,0);

  irLight = new BABYLON.SpotLight("irLight", new BABYLON.Vector3(0,0,0), new BABYLON.Vector3(0,0,1), Math.PI/2, 10, scene);
  irLight.parent = camera; irLight.intensity = 0;
  irLight.diffuse = new BABYLON.Color3(0.4,0.6,0.4); irLight.specular = new BABYLON.Color3(0,0,0);
}

/* ========= HUD / Storage / Belt ========= */
function updateHUD(){
  document.getElementById('hud-sanity').textContent = `${player.sanity|0}%`;
  document.getElementById('hud-room').textContent = player.room;
}
function rebuildBelt(){
  const belt = document.getElementById('belt'); belt.innerHTML='';
  for(let i=1;i<=5;i++){
    const slotDiv = document.createElement('div');
    slotDiv.className = 'slot' + (i===activeItemSlot?' active':''); slotDiv.dataset.slot = i;
    const key = document.createElement('div'); key.className='key'; key.textContent=i; slotDiv.appendChild(key);
    const label = inventory.slots[i] || '-';
    const span = document.createElement('div'); span.style.fontSize='11px'; span.style.color='#8ff'; span.style.textAlign='center'; span.textContent=label;
    slotDiv.appendChild(span);
    slotDiv.onclick = ()=>selectSlot(i);
    belt.appendChild(slotDiv);
  }
  refreshCameraOverlay();
}
function selectSlot(n){ activeItemSlot = n; rebuildBelt(); syncHeldLights(); }
function openStorage(){
  const modal=document.getElementById('storage-modal'); const grid=document.getElementById('storage-grid'); grid.innerHTML='';
  STORAGE_ITEMS.forEach(it=>{
    const card=document.createElement('div'); card.style.cssText='border:1px solid #066; padding:8px; background:#111; border-radius:6px;';
    const title=document.createElement('div'); title.style.color='#9ff'; title.style.marginBottom='6px'; title.textContent=it;
    const btn=document.createElement('button'); btn.textContent='Add to Slots 1–3'; btn.className='hud-btn'; btn.onclick=()=> addToLoadout(it);
    card.appendChild(title); card.appendChild(btn); grid.appendChild(card);
  });
  document.getElementById('storage-info').textContent = `Current: [${inventory.slots[1]||'-'}, ${inventory.slots[2]||'-'}, ${inventory.slots[3]||'-'}] — (4:Lighter, 5:Notebook)`;
  modal.style.display='flex';
}
function closeStorage(){ document.getElementById('storage-modal').style.display='none'; }
function addToLoadout(item){ for(let i=1;i<=3;i++){ if(!inventory.slots[i]){ inventory.slots[i]=item; toast(`Added ${item} to slot ${i}`, 900); rebuildBelt(); return; } } toast('Slots 1–3 full. Remove one first.', 1200); }
function confirmLoadout(){ closeStorage(); }

/* ========= Notebook ========= */
function renderNotebook(){
  // Tabs
  const tabs = Array.from(document.querySelectorAll('#notebook-tabs .tab'));
  const pages = { ghosts:document.getElementById('page-ghosts'), evidence:document.getElementById('page-evidence'), guess:document.getElementById('page-guess') };
  tabs.forEach(t=>{ t.onclick = ()=>{ tabs.forEach(x=>x.classList.remove('active')); t.classList.add('active'); document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); pages[t.dataset.tab].classList.add('active'); }; });

  // Ghost list
  const gPage=pages.ghosts; gPage.innerHTML=''; const gp=document.createElement('div');
  gp.innerHTML='<div style="color:#9ff; margin-bottom:6px;">Ghost Types & Required Evidence:</div>';
  Object.entries(GHOSTS).forEach(([name,evs])=>{ const row=document.createElement('div'); row.style.margin='4px 0'; row.textContent=name.toUpperCase()+' — '+evs.join(', '); gp.appendChild(row); });
  gPage.appendChild(gp);

  // Evidence checklist
  const ePage=pages.evidence; ePage.innerHTML=''; const ewrap=document.createElement('div');
  ewrap.innerHTML = '<div style="color:#9ff; margin-bottom:6px;">Check what you have found:</div>';
  EVIDENCE_TYPES.forEach(ev=>{ const r=document.createElement('div'); r.className='ev-row'; const cb=document.createElement('input'); cb.type='checkbox'; cb.dataset.ev=ev; cb.checked=discoveredEvidence.has(ev); cb.onchange=()=>{ if(cb.checked) discoveredEvidence.add(ev); else discoveredEvidence.delete(ev); }; const l=document.createElement('label'); l.textContent=ev; l.style.color='#8ff'; r.appendChild(cb); r.appendChild(l); ewrap.appendChild(r); });
  ePage.appendChild(ewrap);

  // Guess
  const gg=pages.guess; gg.innerHTML=''; const glabel=document.createElement('div'); glabel.style.color='#9ff'; glabel.textContent='Who do you think it is?'; gg.appendChild(glabel);
  const grid=document.createElement('div'); grid.style.display='grid'; grid.style.gridTemplateColumns='repeat(auto-fit, minmax(140px,1fr))'; grid.style.gap='6px'; grid.style.marginTop='6px';
  Object.keys(GHOSTS).forEach(k=>{ const btn=document.createElement('button'); btn.textContent=k.toUpperCase(); btn.style.cssText='border:1px solid #066; color:#9ff; background:#111; padding:8px 10px; cursor:pointer;'; btn.onclick=()=>{ const req=GHOSTS[k]; const allFound=req.every(e=>discoveredEvidence.has(e)); toast(allFound?`✅ Correct set matches: ${k.toUpperCase()}`:`❌ Not all evidence matches ${k.toUpperCase()}`, 1600); }; grid.appendChild(btn); });
  gg.appendChild(grid);
}
function openNotebook(){ document.getElementById('notebook-modal').style.display='flex'; }
function closeNotebook(){ document.getElementById('notebook-modal').style.display='none'; }

/* ========= Lights / camera overlay ========= */
let flashOn=false, uvOn=false, irOn=false;
function syncHeldLights(){
  const item = inventory.slots[activeItemSlot];
  flashLight.intensity = 0; uvLight.intensity = 0; irLight.intensity = 0;
  if (item==='Flashlight' && flashOn) flashLight.intensity = 3.0;
  if (item==='UV Light'   && uvOn)    uvLight.intensity   = 2.0;
  if (item==='Camera'     && irOn)    irLight.intensity   = 1.6;
}
function refreshCameraOverlay(){
  const item = inventory.slots[activeItemSlot];
  const show = (item==='Camera');
  document.getElementById('camera-overlay').style.display = show ? 'block' : 'none';
  document.getElementById('camera-ir').style.display = (show && irOn) ? 'block' : 'none';
}
function toggleNearestHouseLight(){
  if (!houseLights.length || !housePower) { toast(housePower? "No lights found." : "Power is OFF", 900); return; }
  let n=null, best=1e9;
  houseLights.forEach(h=>{ const d=BABYLON.Vector3.Distance(camera.position, h.light.position); if(d<best){ best=d; n=h; }});
  if (!n) return;
  const on = n.light.intensity>0;
  n.light.intensity = on ? 0 : 0.8;
}

/* ========= Input ========= */
const keysDown = {};
function handleMovement(dt){
  const speed = player.running ? player.speedRun : player.speedWalk;
  let move = new BABYLON.Vector3(0,0,0);
  if(controls.forward) move.z += 1;
  if(controls.back)    move.z -= 1;
  if(controls.left)    move.x -= 1;
  if(controls.right)   move.x += 1;

  if(move.lengthSquared() > 0){
    move.normalize();
    const fwd = camera.getForwardRay().direction; fwd.y = 0; fwd.normalize();
    const right = BABYLON.Vector3.Cross(fwd, BABYLON.Axis.Y).scale(-1);
    const desired = fwd.scale(move.z).add(right.scale(move.x)).normalize();
    camera.cameraDirection = desired.scale(speed * dt);
  } else {
    camera.cameraDirection = new BABYLON.Vector3(0,0,0);
  }

  // room label is simple for this minimal scene
  player.room = (camera.position.z < -3) ? "Van" : "Grounds";
  document.getElementById('storage-button').style.display = (player.room==="Van") ? "block" : "none";
  updateHUD();
}
scene?.onBeforeRenderObservable?.add?.(()=>{ // guard if called early
  const dt = engine.getDeltaTime()/1000;
  handleMovement(dt);
});

window.addEventListener('keydown', (e)=>{
  keysDown[e.key] = true;
  if (e.repeat) return;

  switch(e.key){
    case 'w': case 'W': controls.forward=true; break;
    case 's': case 'S': controls.back=true; break;
    case 'a': case 'A': controls.left=true; break;
    case 'd': case 'D': controls.right=true; break;
    case 'Shift': player.running = true; break;

    case '1': case '2': case '3': case '4': case '5':
      selectSlot(parseInt(e.key,10)); break;

    case 'n': case 'N': openNotebook(); break;

    case 'f': case 'F': flashOn=!flashOn; uvOn=false; irOn=false; syncHeldLights(); break;
    case 'u': case 'U': uvOn=!uvOn; flashOn=false; irOn=false; syncHeldLights(); break;
    case 'i': case 'I': irOn=!irOn; flashOn=false; uvOn=false; syncHeldLights(); refreshCameraOverlay(); break;
    case 'l': case 'L': toggleNearestHouseLight(); break;
    case 'p': case 'P': housePower=!housePower; if(!housePower){ houseLights.forEach(h=>h.light.intensity=0); } break;
  }
});
window.addEventListener('keyup', (e)=>{
  keysDown[e.key] = false;
  switch(e.key){
    case 'w': case 'W': controls.forward=false; break;
    case 's': case 'S': controls.back=false; break;
    case 'a': case 'A': controls.left=false; break;
    case 'd': case 'D': controls.right=false; break;
    case 'Shift': player.running = false; break;
  }
});
window.addEventListener('mousedown', (e)=>{ if(e.button===0){ const item=inventory.slots[activeItemSlot]; if(item==='Notebook') openNotebook(); else toast(item? `${item}...` : 'Empty slot', 800);} });
window.addEventListener('wheel', (e)=>{
  const dir = Math.sign(e.deltaY);
  activeItemSlot += dir>0 ? 1 : -1;
  if (activeItemSlot<1) activeItemSlot=5;
  if (activeItemSlot>5) activeItemSlot=1;
  rebuildBelt(); syncHeldLights();
}, {passive:true});

/* ========= UI wiring ========= */
document.getElementById('storage-button').addEventListener('click', openStorage);
document.getElementById('storage-close').addEventListener('click', closeStorage);
document.getElementById('storage-confirm').addEventListener('click', confirmLoadout);
document.getElementById('notebook-close').addEventListener('click', closeNotebook);

// Dev gate
window.addEventListener('keydown', (e)=>{
  if (e.key === 'Escape'){
    const gate = document.getElementById('dev-gate');
    const toggle = document.getElementById('devtools-toggle');
    if (toggle.style.display!=='none'){ // dev already enabled -> toggle panel
      document.getElementById('devtools-panel').style.display =
        (document.getElementById('devtools-panel').style.display==='block') ? 'none' : 'block';
    } else {
      gate.style.display = (gate.style.display==='flex') ? 'none' : 'flex';
    }
  }
});
document.getElementById('dev-yes').addEventListener('click', ()=>{ document.getElementById('dev-pass-wrap').style.display='block'; });
document.getElementById('dev-no').addEventListener('click', ()=>{ document.getElementById('dev-gate').style.display='none'; });
document.getElementById('dev-pass-submit').addEventListener('click', ()=>{
  const val = (document.getElementById('dev-pass').value||'').trim();
  if (val){
    document.getElementById('dev-gate').style.display='none';
    document.getElementById('devtools-toggle').style.display='block';
    toast('Developer options enabled.', 1200);
  } else toast('Enter a password.', 900);
});
document.getElementById('devtools-toggle').addEventListener('click', ()=>{
  const p=document.getElementById('devtools-panel');
  p.style.display = (p.style.display==='block') ? 'none' : 'block';
});
document.getElementById('devtools-close').addEventListener('click', ()=>{
  document.getElementById('devtools-panel').style.display='none';
});

// Dev tools simple hooks
(function(){
  const walk=document.getElementById('dev-walk');
  const run =document.getElementById('dev-run');
  const fly =document.getElementById('dev-fly');
  const log =document.getElementById('dev-log');
  const roomSel = document.getElementById('map-room');
  try{
    const raw = (window.ROOMS && Array.isArray(window.ROOMS)) ? window.ROOMS : [];
    const names = raw.map(r => typeof r === 'string' ? r : (r?.name || 'Unnamed'));
    if (roomSel && names.length){
      roomSel.innerHTML = '<option value="">Select room…</option>' + names.map(n=>`<option>${n}</option>`).join('');

async function loadGhost(){
  try{
    const list = ["ghost1.glb","ghost2.glb","ghost3.glb","ghost4.glb","ghost5.glb"];
    const pick = list[Math.floor(Math.random()*list.length)];
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/ghosts/", pick, scene);
    ghost.mesh = r.meshes[0] || r.meshes.find(m=>m.name==="__root__");
    ghost.mesh.checkCollisions = false; ghost.mesh.isPickable = false;

    // scale to ~1.9m tall
    const bb = ghost.mesh.getHierarchyBoundingVectors(true);
    const height = bb.max.y - bb.min.y;
    const targetHeight = 1.9;
    const scale = targetHeight / (height || 1);
    ghost.mesh.scaling = new BABYLON.Vector3(scale, scale, scale);
    ghost.mesh.rotation = new BABYLON.Vector3(0,0,0);

    r.animationGroups.forEach(ag=>{ if(/idle/i.test(ag.name)) ghost.anims.idle = ag; if(/walk|run/i.test(ag.name)) ghost.anims.walk = ag; });
    if(ghost.anims.idle) ghost.anims.idle.start(true);

    const p = randomPointInPolygonXZ(ghostPolygon);
    const gy = pickGroundHeightAt(p.x, p.z);
    ghost.mesh.position = new BABYLON.Vector3(p.x, gy, p.z);
    ghost.target = randomPointInPolygonXZ(ghostPolygon);

    setGhostVisible(false);
  }catch(e){ console.warn("Ghost load failed:", e); }
}
function setGhostVisible(v){
  ghost.visible = !!v;
  if (!ghost.mesh) return;
  ghost.mesh.getChildMeshes(false).concat([ghost.mesh]).forEach(m=>{
    m.isVisible = v; m.visibility = v ? 1 : 0;
  });
}

function beginHunt(){
  if (!ghost.mesh || ghost.hunting) return;
  ghost.hunting = true;
  $('#hud-hunt-state').textContent = 'HUNTING';
  setGhostVisible(true);
  ghost.speed = 1.4;
  ghost.stepInterval = 0.48;
  flickerStart();
  toast('⚠️ Hunt started!', 1200);
}
function endHunt(){
  if (!ghost.hunting) return;
  ghost.hunting = false;
  $('#hud-hunt-state').textContent = 'Calm';
  setGhostVisible(false);
  ghost.speed = 0.9;
  ghost.stepInterval = 0.55;
  flickerStop();
  toast('Hunt ended.', 900);
}
let flickerTimer=0, flickerOn=false;
function flickerStart(){ flickerTimer = 0; flickerOn = true; }
function flickerStop(){ flickerOn = false;
  houseLights.forEach(h=>{
    if (!housePower) { h.light.intensity = 0; return; }
    if (h.light.intensity>0) h.light.intensity = 0.8;
  });
}

let huntCooldown = 22 + Math.random()*18;
let huntClock = 0;
function sanityTick(dt){
  const nearGhost = ghost.mesh ? BABYLON.Vector3.Distance(ghost.mesh.position, camera.position) < 7 : false;
  const base = 0.6/60;
  const add = nearGhost ? 1.2/60 : 0;
  const drain = (base+add) * (storageOpen?0.2:1) * (inVanZone(camera.position)?0.4:1) * (weather.modSanityDrain||1);
  player.sanity = Math.max(0, player.sanity - drain);
  $('#hud-sanity').textContent = `${player.sanity|0}%`;

  if (!ghost.hunting && !inVanZone(camera.position) && player.sanity <= 65){
    huntClock += dt * (weather.modHuntPace||1);
    if (huntClock >= huntCooldown){
      huntClock = 0; huntCooldown = 22 + Math.random()*18;
      const baseChance = (player.sanity<40 ? 0.85 : 0.55);
      if (Math.random() < baseChance * (weather.modHuntChance||1)) beginHunt();
    }
  }
  if (ghost.hunting && (inVanZone(camera.position) || Math.random()<0.0015)) endHunt();
}

const HOUSE_LIGHT_REGEX = /(lamp|light|bulb|ceiling|sconce)/i;
function adoptExistingGltfLights(){
  let adopted = 0;
  (scene.lights||[]).forEach(l=>{
    if ([moonLight,flashLight,uvLight,irLight].includes(l)) return;
    if (HOUSE_LIGHT_REGEX.test(l.name||"")){
      l.intensity = 0;
      l.diffuse = new BABYLON.Color3(1.0, 0.95, 0.8);
      houseLights.push({ light:l, mesh:null });
      adopted++;
    }
  });
  return adopted>0;
}
function buildHouseLights(){
  const candidates = scene.meshes.filter(m=>HOUSE_LIGHT_REGEX.test(m.name||""));
  candidates.forEach((mesh, i)=>{
    const b = mesh.getBoundingInfo().boundingBox;
    const pos = b.centerWorld.clone(); pos.y += 0.2;
    const pl = new BABYLON.PointLight("houseLight_"+i, pos, scene);
    pl.intensity = 0; pl.range = 12; pl.diffuse = new BABYLON.Color3(1.0,0.95,0.8);
    houseLights.push({ light:pl, mesh });
    if (mesh.material && mesh.material.emissiveColor) mesh.material.emissiveColor = new BABYLON.Color3(0,0,0);
  });
}
function setHousePower(on){
  housePower = on;
  houseLights.forEach(({light,mesh})=>{
    light.intensity = on ? (light.intensity>0 ? light.intensity : 0.8) : 0;
    if (mesh?.material?.emissiveColor) mesh.material.emissiveColor = on && light.intensity>0
      ? new BABYLON.Color3(1.4,1.2,0.9) : new BABYLON.Color3(0,0,0);
  });
}

function updateHUD(){ $('#hud-sanity').textContent = `${player.sanity|0}%`; $('#hud-room').textContent = player.room; }
function handleMovement(dt){
  const speed = player.running ? player.speedRun : player.speedWalk;
  let move = new BABYLON.Vector3(0,0,0);
  if(controls.forward) move.z += 1;
  if(controls.back)    move.z -= 1;
  if(controls.left)    move.x -= 1;
  if(controls.right)   move.x += 1;

  if(move.lengthSquared() > 0){
    move.normalize();
    const fwd = camera.getForwardRay().direction; fwd.y = 0; fwd.normalize();
    const right = BABYLON.Vector3.Cross(fwd, BABYLON.Axis.Y).scale(-1);
    const desired = fwd.scale(move.z).add(right.scale(move.x)).normalize();
    camera.cameraDirection = desired.scale(speed * dt);
  } else {
    camera.cameraDirection = new BABYLON.Vector3(0,0,0);
  }

  if(allowFly && dev.enabled){
    if(keysDown["PageUp"])   camera.position.y += 0.6 * dt * 60;
    if(keysDown["PageDown"]) camera.position.y -= 0.6 * dt * 60;
  }

  player.room = inVanZone(camera.position) ? "Van" : "Grounds";
  document.getElementById('storage-button').style.display = (player.room==="Van") ? "block" : "none";
  updateHUD();
}
function openDoorNearby(){
  const ray = scene.createPickingRay(scene.pointerX, scene.pointerY, BABYLON.Matrix.Identity(), camera);
  const pick = scene.pickWithRay(ray, m => /door/i.test(m.name||""));
  if(pick.hit && pick.pickedMesh){
    const d = BABYLON.Vector3.Distance(pick.pickedPoint, camera.position);
    if(d < 3.0){
      const door = pick.pickedMesh;
      const open = !door.metadata?.open;
      const baseRot = door.metadata?.baseRot ?? door.rotation.y;
      if(open){
        door.rotation = new BABYLON.Vector3(door.rotation.x, baseRot + Math.PI/2, door.rotation.z);
        door.checkCollisions = false;
        (Math.random()>0.5?audio.doorCreak1:audio.doorCreak2).play().catch(()=>{});
      } else {
        door.rotation = new BABYLON.Vector3(door.rotation.x, baseRot, door.rotation.z);
        door.checkCollisions = true;
      }
      door.metadata = { baseRot, open };
    }
  }
}

function logEvidence(type){

function useActiveItem(){

    case 'Spirit Box':
      if(player.room!=='Van' && dist<4){ if(Math.random()<0.55){ audio.spiritbox.play().catch(()=>{}); logEvidence("Spirit Box"); } else { audio.spiritStatic.play().catch(()=>{}); toast("...static...", 900); } }

    case 'UV Light':
      if(Math.random()<0.4){ logEvidence("Fingerprints"); toast("A latent mark glows faintly.", 1000); } else toast("Nothing glows.", 900); break;

      audio.writing.play().catch(()=>{}); setTimeout(()=>logEvidence("Ghost Writing"), 1200); toast("You place the book down...", 900); break;
    case 'D.O.T.S':
      if(Math.random()<0.45){ logEvidence("D.O.T.S"); toast("Something flickers through your setup...", 1000); } else toast("Nothing passes through.", 900); break;

  const enableBtn   = document.getElementById('devtools-enable');
  const chkGhost    = document.getElementById('devtools-group-ghost');
  const chkEv       = document.getElementById('devtools-group-evidence');
  const chkXYZ      = document.getElementById('devtools-group-xyz');
  const roomSel     = document.getElementById('devtools-room-select');
  const logTa       = document.getElementById('devtools-log');

  function log(msg){
    const line = `[${new Date().toLocaleTimeString()}] ${msg}\n`;
    logTa.value += line; logTa.scrollTop = logTa.scrollHeight;
    console.debug('%cDEV','color:#8af', msg);
  }
  window.DevTools = { showToggle(){ toggleBtn.style.display='block'; }, open(){ panel.style.display='block'; }, log };
  toggleBtn.addEventListener('click', ()=>{ panel.style.display = (panel.style.display==='block') ? 'none' : 'block'; });

  try{
    const raw = (window.ROOMS && Array.isArray(window.ROOMS)) ? window.ROOMS : [];
    const names = raw.map(r => typeof r === 'string' ? r : (r?.name || 'Unnamed'));
    if (roomSel && names.length){
      roomSel.innerHTML = '<option value="">Select room…</option>' + names.map(n=>`<option>${n}</option>`).join('');
    }
  }catch{}

  enableBtn.addEventListener('click', ()=>{
    const on = enableBtn.dataset.on==='1' ? false : true;
    enableBtn.dataset.on = on ? '1':'0';
    enableBtn.textContent = on ? 'Disable Developer Listen' : 'Enable Developer Listen';
    log(on ? 'Developer Listen: ON' : 'Developer Listen: OFF');

    if (chkGhost) {
      if (on && chkGhost.checked) devBus.addEventListener('ghost', ghostLogger);
      else                         devBus.removeEventListener('ghost', ghostLogger);
    }
    if (chkEv) {
      if (on && chkEv.checked) window.__onEvidenceLogged = d=> evidenceLogger(d);
      else                     window.__onEvidenceLogged = null;
    }
    if (chkXYZ) {
      if (on && chkXYZ.checked) startXYZ();
      else                      stopXYZ();
    }
  });

  function ghostLogger(){
    if(performance.now() - __devGhostLogTimer < 250) return;
    __devGhostLogTimer = performance.now();
    const g = ghost.mesh?.position; if(!g) return;
    log(`Ghost @ x:${g.x.toFixed(2)} y:${g.y.toFixed(2)} z:${g.z.toFixed(2)} hunting:${ghost.hunting}`);
  }
  function evidenceLogger(d){ log(`EV: ${d.item} in ${d.room} (${d.success?'OK':'FAIL'})`); }

  let xyzTimer=null;
  function startXYZ(){
    if (xyzTimer) return;
    xyzTimer = setInterval(()=>{
      const p=camera?.position; if(!p) return;
      log(`XYZ x:${p.x.toFixed(2)} y:${p.y.toFixed(2)} z:${p.z.toFixed(2)}`);
    }, 1000);
  }
  function stopXYZ(){ if(xyzTimer){ clearInterval(xyzTimer); xyzTimer=null; } }
})();

/* ===========================================================
   BREATH FX (freezing breath near ghost)
   =========================================================== */
function setupBreathFX(){
  const ps = new BABYLON.ParticleSystem("breath", 200, scene);
  ps.particleTexture = new BABYLON.Texture("./assets/images/particles/smoke.png", scene, true);
  ps.color1 = new BABYLON.Color4(0.8,0.9,1,0.6);
  ps.color2 = new BABYLON.Color4(0.8,0.9,1,0.1);
  ps.minSize = 0.02; ps.maxSize = 0.06;
  ps.emitRate = 0;
  ps.minLifeTime = 0.3; ps.maxLifeTime = 0.7;
  ps.direction1 = new BABYLON.Vector3(0,0.7,0.2);
  ps.direction2 = new BABYLON.Vector3(0.1,0.8,0.1);
  ps.gravity = new BABYLON.Vector3(0,0,0);
  ps.updateSpeed = 0.02;
  ps.disposeOnStop = false;

  const anchor = new BABYLON.TransformNode("breathAnchor", scene);
  ps.emitter = anchor; ps.start();
  breath.ps = ps; breath.anchor = anchor;
}
function updateBreath(dt){
  if (!breath.ps || !breath.anchor) return;
  breath.anchor.position.copyFrom(camera.position.add(camera.getForwardRay().direction.scale(0.3)).add(new BABYLON.Vector3(0,0.1,0)));
  const nearGhost = ghost.mesh ? BABYLON.Vector3.Distance(ghost.mesh.position, camera.position) < BREATH_RANGE : false;
  const targetRate = nearGhost ? 90 : 0;
  const current = breath.ps.emitRate || 0;
  breath.ps.emitRate = BABYLON.Scalar.Lerp(current, targetRate, 0.1);
}

/* ===========================================================
   GHOST UPDATE / AI
   =========================================================== */
let footTimer = 0;
function updateGhost(dt){
  if(!ghost.mesh) return;

  // roaming or chase
  if(!ghost.hunting){
    const pos = ghost.mesh.position;
    if(!ghost.target || BABYLON.Vector3.Distance(pos, ghost.target) < 1){
      ghost.target = randomPointInPolygonXZ(ghostPolygon);
    }
    const dir = ghost.target.subtract(pos); dir.y = 0; const len = dir.length();
    if (len > 0.001){
      dir.normalize();
      ghost.mesh.moveWithCollisions(dir.scale(ghost.speed * dt * 1.2));
      lookAtXZ(ghost.mesh, ghost.target);
    }
  } else {
    const target = camera.position.clone();
    const pos = ghost.mesh.position;
    const dir = target.subtract(pos); dir.y = 0; const len = dir.length();
    if(len > 0.001){
      dir.normalize();
      ghost.mesh.moveWithCollisions(dir.scale(ghost.speed * dt * 2.2 * (weather.modHuntPace||1)));
      lookAtXZ(ghost.mesh, target);
    }
  }

  // footsteps
  footTimer -= dt;
  if (footTimer <= 0){
    const dist = BABYLON.Vector3.Distance(ghost.mesh.position, camera.position);
    const audible = dist < ghost.footAudible;
    if (ghost.hunting && audible){
      const isMyling = (currentGhostKey||"") === "myling";
      const clip = isMyling ? (Math.random()<0.5?audio.footMy1:audio.footMy2) : (Math.random()<0.5?audio.foot1:audio.foot2);
      try{ clip.currentTime=0; clip.play().catch(()=>{}); }catch{}
    }
    footTimer = ghost.stepInterval + Math.random()*0.12;
  }

  // dev bus tick
  devBus.dispatchEvent(new Event('ghost'));
}

/* ===========================================================
   UI / INPUT BINDINGS
   =========================================================== */
let flashOn=false, uvOn=false, irOn=false;
const keysDown = {};

function initUI(){
  // Storage buttons
  $('#storage-button').addEventListener('click', openStorage);
  $('#storage-close').addEventListener('click', closeStorage);
  $('#storage-confirm').addEventListener('click', confirmLoadout);

  // Notebook
  $('#notebook-close').addEventListener('click', closeNotebook);

  // Dev gate on ESC
  window.addEventListener('keydown', (e)=>{
    if (e.key === 'Escape'){
      if (!dev.enabled){
        const gate = document.getElementById('dev-gate');
        gate.style.display = (gate.style.display==='flex') ? 'none' : 'flex';
      } else {
        const t=document.getElementById('devtools-toggle');
        if (t.style.display!=='none') t.click();
      }
    }
  });
  // Dev gate controls
  $('#dev-yes').addEventListener('click', ()=>{ $('#dev-pass-wrap').style.display='block'; });
  $('#dev-no').addEventListener('click', ()=>{ $('#dev-gate').style.display='none'; });
  $('#dev-pass-submit').addEventListener('click', ()=>{
    const val = ($('#dev-pass').value||'').trim();
    if (val){ // accept any non-empty for now
      dev.enabled = true;
      $('#dev-gate').style.display='none';
      if (window.DevTools) window.DevTools.showToggle();
      toast('Developer options enabled.', 1200);
    } else {
      toast('Enter a password.', 900);
    }
  });

  // Touch controls
  const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints>0;
  const tbox = document.getElementById('touch-controls');
  if (hasTouch){ tbox.style.display='grid'; }

  const tUp  = document.getElementById('t-up');
  const tLeft= document.getElementById('t-left');
  const tRight=document.getElementById('t-right');
  const tUse = document.getElementById('t-use');
  const press = (el, on, off)=>{
    const start=()=>on();
    const end=()=>off();
    el.addEventListener('touchstart', (e)=>{ e.preventDefault(); start(); }, {passive:false});
    el.addEventListener('touchend',   (e)=>{ e.preventDefault(); end(); },   {passive:false});
    el.addEventListener('mousedown',  (e)=>{ e.preventDefault(); start(); });
    el.addEventListener('mouseup',    (e)=>{ e.preventDefault(); end(); });
    el.addEventListener('mouseleave', (e)=>{ e.preventDefault(); end(); });
  };
  press(tUp, ()=>controls.forward=true, ()=>controls.forward=false);
  press(tLeft, ()=>controls.left=true, ()=>controls.left=false);
  press(tRight, ()=>controls.right=true, ()=>controls.right=false);
  press(tUse, ()=>useActiveItem(), ()=>{});
}

// Keyboard movement + actions
window.addEventListener('keydown', (e)=>{
  keysDown[e.key] = true;
  if (e.repeat) return;

  switch(e.key){
    case 'w': case 'W': controls.forward=true; break;
    case 's': case 'S': controls.back=true; break;
    case 'a': case 'A': controls.left=true; break;
    case 'd': case 'D': controls.right=true; break;
    case 'Shift': player.running = true; break;

    case '1': case '2': case '3': case '4': case '5':
      selectSlot(parseInt(e.key,10)); break;

    case 'n': case 'N': openNotebook(); break;
    case 'e': case 'E': openDoorNearby(); break;

    case 'f': case 'F': flashOn=!flashOn; uvOn=false; irOn=false; syncHeldLights(); break;
    case 'u': case 'U': uvOn=!uvOn; flashOn=false; irOn=false; syncHeldLights(); break;
    case 'i': case 'I': irOn=!irOn; flashOn=false; uvOn=false; syncHeldLights(); refreshCameraOverlay(); break;
    case 'l': case 'L': toggleNearestHouseLight(); break;
    case 'p': case 'P': setHousePower(!housePower); break;
    case ' ':
      useActiveItem(); break;
  }
});
window.addEventListener('keyup', (e)=>{
  keysDown[e.key] = false;
  switch(e.key){
    case 'w': case 'W': controls.forward=false; break;
    case 's': case 'S': controls.back=false; break;
    case 'a': case 'A': controls.left=false; break;
    case 'd': case 'D': controls.right=false; break;
    case 'Shift': player.running = false; break;
  }
});

// Mouse to use active item
window.addEventListener('mousedown', (e)=>{ if(e.button===0) useActiveItem(); });

// Mouse wheel: cycle slots
window.addEventListener('wheel', (e)=>{
  const dir = Math.sign(e.deltaY);
  activeItemSlot += dir>0 ? 1 : -1;
  if (activeItemSlot<1) activeItemSlot=5;
  if (activeItemSlot>5) activeItemSlot=1;
  rebuildBelt();
  syncHeldLights();
}, {passive:true});

function syncHeldLights(){
  const item = inventory.slots[activeItemSlot];
  // defaults off
  flashLight.intensity = 0;
  uvLight.intensity = 0;
  irLight.intensity = 0;

  if (item==='Flashlight' && flashOn) flashLight.intensity = 3.0;
  if (item==='UV Light'   && uvOn)    uvLight.intensity   = 2.0;
  if (item==='Camera'     && irOn)    irLight.intensity   = 1.6;
}

/* ===========================================================
   DEBUG: spinning cube if no map (so it's never just black)
   =========================================================== */
function ensureDebugCube(){
  if (scene.getMeshByName("dbgCube")) return;
  const m = BABYLON.MeshBuilder.CreateBox("dbgCube",{size:2},scene);
  m.position = new BABYLON.Vector3(43.657, 2, -112);
  const mat = new BABYLON.StandardMaterial("dbgMat", scene);
  mat.diffuseColor = new BABYLON.Color3(0.1,0.6,0.8);
  m.material = mat;
  scene.onBeforeRenderObservable.add(()=>{ m.rotation.y += 0.01; });
}

/* ===========================================================
   START: wire the Start button after the DOM is ready
   =========================================================== */
document.getElementById('start-button').addEventListener('click', safeStart);

</script>
