<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fixed Render Loop</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <script>
    // Engine & Scene setup
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);

    const camera = new BABYLON.ArcRotateCamera("Camera", 
      Math.PI / 2, Math.PI / 4, 6, BABYLON.Vector3.Zero(), scene);
    camera.attachControl(canvas, true);

    const light = new BABYLON.HemisphericLight("light", 
      new BABYLON.Vector3(1, 1, 0), scene);

    const sphere = BABYLON.MeshBuilder.CreateSphere("sphere", {diameter: 2}, scene);

    // Safe render loop function
    window.startRenderLoopSafe = function() {
      if (!engine._isRendering) {
        engine._isRendering = true;
        engine.runRenderLoop(() => {
          if (scene.activeCamera) scene.render();
        });
      }
    };

    // Start button simulation
    window.safeStart = async function() {
      try {
        window.startRenderLoopSafe();
      } catch (e) {
        console.error("safeStart failed:", e);
      }
    };

    // Auto start for testing
    window.safeStart();

    // Resize handler
    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
