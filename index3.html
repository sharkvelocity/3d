  <!-- ======= Media Autoplay Guard (prevents SFX before click) ======= -->
  <script>
  (function mediaAutoplayGuard(){
    const proto = window.HTMLMediaElement && HTMLMediaElement.prototype;
    const OriginalAudio = window.Audio;
    const guard = { unlocked:false, queue:[] };

    function safePlay(el){
      if (!guard.unlocked) {
        guard.queue.push(() => el.play?.().catch(()=>{}));
        return Promise.resolve(); // swallow attempts pre-unlock
      }
      return el.play?.().catch(()=>{});
    }

    if (proto && !proto.__pp_guarded) {
      const _play = proto.play;
      proto.play = function(){ return safePlay(this) || Promise.resolve(); };
      proto.__pp_guarded = true;
    }

    if (OriginalAudio && !OriginalAudio.__pp_guarded) {
      window.Audio = function(src){
        const el = new OriginalAudio(src);
        // Never autoplay
        el.autoplay = false;
        el.muted = !guard.unlocked;
        return el;
      };
      window.Audio.__pp_guarded = true;
    }

    window.__PP_AUDIO_GUARD__ = {
      unlock(){
        guard.unlocked = true;
        // Drain queued plays
        const q = guard.queue.splice(0, guard.queue.length);
        q.forEach(fn => { try{ fn(); }catch{} });
      }
    };
  })();
  </script>

  <!-- ======= Startup hooks ======= -->
  <script>
  // Initialize audio ONLY on Start button click, then unlock guard
  (function hookAudioStart(){
    function attach(){
      var btn = document.getElementById('start-button') || document.querySelector('[data-start]');
      if (!btn){ return setTimeout(attach, 100); }
      btn.addEventListener('click', function once(){
        btn.removeEventListener('click', once);
        try {
          PP && PP.audio && PP.audio.init().then(()=>{
            // allow media play; staged prewarm so UI stays smooth
            window.__PP_AUDIO_GUARD__?.unlock();
            PP.audio.stagePrewarm();
          });
        } catch(e){ console.warn('[audio.init] failed', e); }
      });
    }
    attach();
  })();

  // Pointer lock toggle (L), ESC unlocks
  (function pointerLockFix(){
    const canvas = document.getElementById('renderCanvas');
    let desireLock = false;
    function lock(){ if (document.pointerLockElement !== canvas) canvas.requestPointerLock?.(); }
    function unlock(){ document.exitPointerLock?.(); }
    document.addEventListener('pointerlockchange', ()=>{ desireLock = (document.pointerLockElement === canvas); });
    canvas.addEventListener('click', ()=>{ if (desireLock) lock(); });
    window.addEventListener('keydown', (e)=>{
      if (e.code === 'KeyL'){ if (document.pointerLockElement) unlock(); else { desireLock = true; lock(); } }
      if (e.code === 'Escape') unlock();
    }, {capture:true});
    document.getElementById('start-button')?.addEventListener('click', ()=>{ desireLock=true; setTimeout(lock, 150); }, {once:true});
  })();

  // Belt/icon leak guard (unchanged)
  (function guardIconLeaks(){
    const belt = () => document.getElementById('belt');
    const hide = (img) => { img.style.display='none'; img.style.position='absolute'; img.style.left='-99999px'; img.style.top='-99999px'; };
    document.querySelectorAll('img[src*="/assets/icons/"]').forEach(img=>{
      if (!belt() || !belt().contains(img)) hide(img); else img.classList.add('item-icon');
    });
    new MutationObserver(muts=>{
      for (const m of muts) for (const n of m.addedNodes){
        if (n && n.tagName==='IMG' && (n.src||'').includes('/assets/icons/')){
          if (!belt() || !belt().contains(n)) hide(n); else n.classList.add('item-icon');
        }
      }
    }).observe(document.documentElement, {childList:true, subtree:true});
  })();

  // HUD XYZ updater (unchanged behavior)
  (function fixHudXYZ(){
    const label = document.getElementById('hud-xyz');
    if (!label) return;
    function S(){ return window.SCENE; }
    function src(){
      const s=S(); if (!s) return null;
      return s.__playerBody || (s.getMeshByName && s.getMeshByName('player_capsule')) || s.activeCamera || null;
    }
    function loop(){
      const o = src();
      if (o && o.position){
        const p = o.position;
        label.textContent = `${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)}`;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
