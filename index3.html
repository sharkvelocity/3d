<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PhasmoPhoney - Patched</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<script>
// Ensure Babylon engine + scene exist before starting loop
function startRenderLoopSafe(engine, scene) {
  if (!engine || !scene) {
    console.warn("Engine or Scene not ready for render loop.");
    return;
  }
  if (window.__loopStarted) return;
  window.__loopStarted = true;

  try {
    engine.runRenderLoop(() => {
      if (scene && scene.activeCamera) {
        scene.render();
      }
    });
  } catch (e) {
    console.error("RenderLoop error:", e);
    requestAnimationFrame(() => startRenderLoopSafe(engine, scene));
  }
}

window.addEventListener("DOMContentLoaded", function () {
  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true);
  const scene = new BABYLON.Scene(engine);
  const camera = new BABYLON.ArcRotateCamera("camera1",
    Math.PI / 2, Math.PI / 4, 4, BABYLON.Vector3.Zero(), scene);
  camera.attachControl(canvas, true);
  const light = new BABYLON.HemisphericLight("light",
    new BABYLON.Vector3(0, 1, 0), scene);
  const sphere = BABYLON.MeshBuilder.CreateSphere("sphere", {}, scene);

  startRenderLoopSafe(engine, scene);
});
</script>
</body>
</html>
