<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney — index3 modular</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />

  <!-- Babylon core + loaders -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/earcut.min.js"></script>
  <script src="./cdn/meshopt_decoder.js"></script>
  <script src="./cdn/draco_decoder_gltf.js"></script>
  <script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script>
  <script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
  <script src="./cdn/gui/babylon.gui.min.js"></script>
  <script src="./cdn/inspector/babylon.inspector.bundle.js"></script>

  <style>
    html, body { margin:0; height:100%; width:100%; background:#000; overflow:hidden; font-family:monospace; color:#0ff; touch-action:none; }
    #renderCanvas { width:100vw; height:100vh; display:block; background:#000; outline:none; }

    #loading-box{ position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(0,0,0,0.92); z-index:2147483000; color:#9ef; }
    #loading-logo{ width:220px; max-width:60vw; opacity:0.95; filter:drop-shadow(0 0 10px #0ff4); }
    #loading-text{ font-size:15px; letter-spacing:.3px; text-align:center; max-width:70vw; }
    #loading-bar{ width:64vw; max-width:720px; height:12px; border:1px solid #066; border-radius:10px; background:#071017; overflow:hidden; }
    #loading-fill{ height:100%; width:0%; background:linear-gradient(90deg,#19f,#0ff); transition:width .15s ease; }

    #title-screen{ position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:9999; }
    #title-logo{ max-width:60vw; max-height:35vh; object-fit:contain; }
    #start-button{ padding:14px 28px; font-size:22px; cursor:pointer; border:2px solid #0ff; color:#0ff; background:#111; }
    #map-wrap{ display:flex; gap:8px; align-items:center; color:#9ef; }
    #map-select{ background:#0b1518; color:#bff; border:1px solid #066; padding:8px; border-radius:8px; }

    #hud-xyz { position:fixed; top:10px; right:12px; background:rgba(0,0,0,0.5); border:1px solid #066; padding:6px 8px; color:#0ff; font:12px monospace; z-index:6000; display:none; }
    #itemBar { position:fixed; left:50%; bottom:72px; transform:translateX(-50%); display:flex; gap:12px; z-index:6000; align-items:center; background:rgba(0,0,0,0.55); border:1px solid #066; padding:8px 10px; border-radius:10px; }
    #itemBar .slot { width:48px; height:48px; display:grid; place-items:center; border-radius:10px; border:1px solid #1a2a3c; background:#0e1622; cursor:pointer; user-select:none; }
    #itemBar .slot.active{ outline:2px solid #0ff; box-shadow:0 0 12px rgba(0,255,255,0.35) inset; }

    #storage{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.85); z-index:12001; }
    #storageInner{ background:#0b1518; border:1px solid #066; border-radius:12px; padding:14px; width:min(520px,90vw); color:#bfe; }
    #storeGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px; }
    #storeConfirm{ margin-top:12px; padding:8px 12px; }

    #toast{ position:fixed; left:50%; top:16px; transform:translateX(-50%); background:rgba(0,0,0,0.7); border:1px solid #066; border-radius:8px; padding:8px 12px; color:#0ff; z-index:10001; display:none; max-width:70vw; text-align:center; }
  </style>
</head>
<body>
  <!-- Loader -->
  <div id="loading-box" aria-live="polite">
    <img src="logo.png" alt="Logo" id="loading-logo">
    <div id="loading-text">Initializing…</div>
    <div id="loading-bar"><div id="loading-fill" style="width:0%"></div></div>
  </div>

  <!-- Title -->
  <div id="title-screen">
    <img id="title-logo" src="./logo.png" alt="PhasmaPhoney Logo" />
    <button id="start-button">Start Investigation</button>
    <div id="map-wrap">
      <span>Map:</span>
      <select id="map-select">
        <option value="-1">(loading maps...)</option>
      </select>
    </div>
  </div>

  <canvas id="renderCanvas" tabindex="0"></canvas>

  <div id="hud-xyz">XYZ: <span id="hud-x">0</span>, <span id="hud-y">0</span>, <span id="hud-z">0</span></div>
  <div id="itemBar"></div>

  <!-- Minimal Storage modal -->
  <div id="storage">
    <div id="storageInner">
      <h3>Select up to 3 Items</h3>
      <div id="storeGrid"></div>
      <button id="storeConfirm" class="hud-btn">Confirm Loadout</button>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Index3 modular scripts (order matters) -->
  <script src="./assets/index3/maps_manifest.js"></script>
  <script src="./assets/index3/mapdefs_furnished_house.js"></script>
  <script src="./assets/index3/mapdefs_jailhouse.js"></script>

  <script src="./assets/index3/ui_belt.js"></script>
  <script src="./assets/index3/minimap_xyz.js"></script>
  <script src="./assets/index3/sound.js"></script>
  <script src="./assets/index3/boot.js"></script>
</body>
</html>
