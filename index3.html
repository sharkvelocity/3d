    #title-screen{ position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:9999; }

  (function hookAudioStart(){
    function attach(){
      const btn = document.getElementById('start-button');
      if (!btn) return setTimeout(attach, 100);
      btn.addEventListener('click', function once(){
        btn.removeEventListener('click', once);
        try { PP && PP.audio && PP.audio.init(); } catch(e){ console.warn('[audio.init] failed', e); }
      }, { once:true });
    }
    attach();
  })();
  </script>

  <!-- --- ICONS configuration (prevent 404s) --- -->
  <script>
    // Point these to your actual repo paths
    window.ICONS_BASE_URL = './assets/icons';
    window.ITEM_ICON_MAP = {
      emf: 'emf.png',
      spirit_box: 'spirit_box.png',
      book: 'book.png',
      uv: 'uv.png',
      dots: 'dots.png',
      camera: 'camera.png',
      candle: 'candle.png',
      thermometer: 'thermometer.png',
      lighter: 'lighter.png',
      notebook: 'notebook.png',
      salt: 'salt.png',
      crucifix: 'crucifix.png',
      smudge: 'smudge.png'
    };
    window.ITEM_ICON_HINTS = {
      emf: ['emf.png','emf_reader.png','emf5.png'],
      spirit_box: ['spirit_box.png','spiritbox.png'],
      book: ['book.png','ghost_book.png','writing_book.png'],
      uv: ['uv.png','uv_light.png','blacklight.png'],
      dots: ['dots.png','dots_projector.png'],
      thermometer: ['thermometer.png','thermo.png']
    };
    // Safe resolver anyone can use:
    window.getItemIcon = function(key){
      const base = window.ICONS_BASE_URL || '.';
      const main = window.ITEM_ICON_MAP?.[key];
      const hints = window.ITEM_ICON_HINTS?.[key] || [];
      const list = [].concat(main? [main]:[], hints);
      return list.map(f=> `${base}/${f}`);
    };
  </script>

  <!-- --- MAP registry + dropdown (sets MAP_URL before bootstrap uses it) --- -->
  <script>
  (function(){
    // Include the maps you actually ship:
    window.MAP_REGISTRY = {
      "Jailhouse": "./assets/models/map/jailhouse.glb"
      // "Farmhouse": "./assets/models/map/farmhouse.glb",
      // "School":    "./assets/models/map/school.glb"
    };

    const sel = document.getElementById('map-select');
    const status = document.getElementById('map-status');

    const savedKey = localStorage.getItem('PP_MAP');
    const firstKey = Object.keys(MAP_REGISTRY)[0];
    const initialKey = (savedKey && MAP_REGISTRY[savedKey]) ? savedKey : firstKey;

    window.MAP_URL = MAP_REGISTRY[initialKey];

    // Build dropdown
    sel.innerHTML = '';
    Object.entries(MAP_REGISTRY).forEach(([label, url])=>{
      const opt = document.createElement('option');
      opt.value = label; opt.textContent = label; opt.dataset.url = url;
      if (label === initialKey) opt.selected = true;
      sel.appendChild(opt);
    });

    // Quick HEAD check
    async function ping(url){ try{ const r = await fetch(url, {method:'HEAD'}); return r.ok; } catch { return false; } }
    (async ()=>{
      status.textContent = 'Checking map…';
      const ok = await ping(window.MAP_URL);
      status.textContent = ok ? 'Map OK' : '⚠ Map missing';
      status.style.color = ok ? '#9ff' : '#f88';
    })();

    sel.addEventListener('change', async ()=>{
      const key = sel.value;
      const url = MAP_REGISTRY[key];
      window.MAP_URL = url;
      localStorage.setItem('PP_MAP', key);
      status.textContent = 'Checking map…';
      const ok = await fetch(url, {method:'HEAD'}).then(r=>r.ok).catch(()=>false);
      status.textContent = ok ? `Selected: ${key}` : `⚠ ${key} missing`;
      status.style.color = ok ? '#9ff' : '#f88';
    });

    // Re-assert before Start
    document.getElementById('start-button')?.addEventListener('click', ()=>{
      const key = sel.value;
      window.MAP_URL = MAP_REGISTRY[key];
      localStorage.setItem('PP_MAP', key);
    }, {capture:true, once:false});
  })();
  </script>

  <!-- Export globals early -->
  <script>
  (function ensureGlobals(){
    function tryExport(){
      try {
        if (window.ENGINE && window.SCENE) { window.camera = window.SCENE.activeCamera || window.camera; return; }
        const eng = BABYLON.EngineStore?.LastCreatedEngine || BABYLON.Engine?.LastCreatedEngine;
        const scn = BABYLON.EngineStore?.LastCreatedScene  || BABYLON.Engine?.LastCreatedScene;
        if (eng && scn){
          window.ENGINE = eng;
          window.SCENE  = scn;
          window.camera = scn.activeCamera || window.camera;
          return;
        }
      } catch {}
      setTimeout(tryExport, 50);
    }
    tryExport();
  })();
  </script>

  <!-- First/Third person & consistent spawn ABOVE ground -->
  <script>
  (function fpTpAndSpawn(){
    if (window.__PP_BOOT_ONCE__) return; window.__PP_BOOT_ONCE__ = true;

    const B = window.BABYLON;

    function scene(){ return window.SCENE || B.Engine?.LastCreatedScene; }
    function cam(){ return (scene() && scene().activeCamera) || window.camera; }

    function groundYAtXZ(x,z, approxY){
      const s = scene(); if (!s) return null;
      const from = new B.Vector3(x, (approxY ?? 2) + 6, z);
      const ray  = new B.Ray(from, new B.Vector3(0,-1,0), 20);
      const hit  = s.pickWithRay(ray, (m)=> m && (m.metadata?.isGround===true || m.isPickable!==false));
      return (hit && hit.hit && hit.pickedPoint) ? hit.pickedPoint.y : null;
    }

    // Clamp player scale if base model is huge
    function normalizePlayerScale(){
      const s = scene(); if (!s) return;
      const root = s.getTransformNodeByName?.('player_root') || s.getMeshByName?.('player_capsule') || null;
      if (!root) return;
      const bb = root.getHierarchyBoundingVectors?.();
      if (!bb) return;
      const size = bb.max.subtract(bb.min);
      const tallest = Math.max(0.01, size.y);
      if (tallest > 3.2){                     // too big? scale down to ~1.8m
        const k = 1.8 / tallest;
        try { root.scaling.scaleInPlace(k); } catch {}
      }
    }

    function placePlayerAboveGround(){
      const s = scene(); const c = cam(); if (!s || !c) return;
      // Prefer named spawn points in the map:
      const spawnNode = s.getTransformNodeByName?.('spawn') || s.getTransformNodeByName?.('van_spawn');
      let p = spawnNode?.getAbsolutePosition?.() || c.position.clone();
      const gy = groundYAtXZ(p.x, p.z, p.y);
      if (gy != null) c.position.set(p.x, gy + 1.7, p.z); // NEVER under the map
    }

    function attachFPKeys(){
      window.addEventListener('keydown', (e)=>{
        if (e.code === 'KeyV'){               // toggle FP/TP
          try { PP && PP.rig && PP.rig.toggleView && PP.rig.toggleView(); }
          catch{}
        }
      });
    }

    function lockToBody(){
      const s = scene(); if (!s) return;
      const body = s.__playerBody || s.getMeshByName?.('player_capsule');
      if (body && s.activeCamera){
        try { s.activeCamera._lockedTarget = body; } catch {}
      }
    }

    function onceStart(){
      normalizePlayerScale();
      placePlayerAboveGround();
      attachFPKeys();
      lockToBody();
    }

    const btn = document.getElementById('start-button');
    if (btn) btn.addEventListener('click', onceStart, { once:true });

    // Safety: if Start already pressed or auto booted
    setTimeout(onceStart, 3500);
  })();
  </script>

  <!-- Simple WEATHER driver (no external file; uses audio, updates HUD, randomizes on start) -->
  <script>
  (function WeatherDriver(){
    const B = BABYLON;
    const hud = document.getElementById('hud-weather');

    const AUDIO = {
      clear:   ['ambient.mp3'],
      rain:    ['rainstorm.mp3'],
      snow:    ['snow.mp3'],
      thunder: ['thunder.mp3']
    };
    const MODES = ['clear','rain','snow']; // pick from these on start

    let current = null, sounds = [];

    function scene(){ return window.SCENE || B.Engine?.LastCreatedScene; }

    function stopAll(){
      sounds.forEach(s=>{ try{s.stop();}catch{} }); sounds = [];
    }

    function play(list){
      (list||[]).forEach(name=>{
        try{
          const snd = new B.Sound(name, `./assets/audio/${name}`, scene(), null, { loop:true, autoplay:true, volume:0.6 });
          sounds.push(snd);
        }catch(e){ console.warn('[weather] audio', e); }
      });
    }

    function tint(mode){
      const s = scene(); if (!s) return;
      if (!s.environmentIntensity) s.environmentIntensity = 1.0;
      if (mode==='clear'){ s.fogEnabled=false; s.clearColor = new B.Color4(0,0,0,1); }
      if (mode==='rain'){  s.fogEnabled=true;  s.fogColor = new B.Color3(0.05,0.08,0.12); s.fogDensity=0.006; }
      if (mode==='snow'){  s.fogEnabled=true;  s.fogColor = new B.Color3(0.2,0.22,0.25); s.fogDensity=0.01; }
    }

    function set(mode){
      if (current === mode) return;
      current = mode;
      stopAll();
      play(AUDIO[mode] || []);
      tint(mode);
      if (hud) hud.textContent = mode[0].toUpperCase() + mode.slice(1);
      window.currentWeather = mode;
    }

    window.Weather = { set };

    // Start weather after audio unlock
    function startRand(){
      const pick = MODES[Math.floor(Math.random()*MODES.length)];
      try { set(pick); } catch {}
    }
    document.getElementById('start-button')?.addEventListener('click', startRand, { once:true });
  })();
  </script>

  <!-- Anti-orbit / single active camera guard -->
  <script>
  (function antiOrbitOnce(){
    if (window.__antiOrbitApplied__) return; window.__antiOrbitApplied__ = true;
    function S(){ return window.SCENE || window.scene || (window.ENGINE && ENGINE.scenes && ENGINE.scenes[0]) || null; }
    function apply(){
      const s = S(); if (!s) return setTimeout(apply, 50);
      let c = s.activeCamera;
      if (!c) return setTimeout(apply, 50);

      if (BABYLON.ArcRotateCamera && c instanceof BABYLON.ArcRotateCamera){
        const u = new BABYLON.UniversalCamera("PlayerCam", c.position.clone(), s);
        if (c.rotation) u.rotation.copyFrom(c.rotation);
        s.activeCamera = u;
        try { c.detachControl(); } catch(_){}
        try { c.dispose(); } catch(_){}
        c = u;
      }
      if (c.inputs && c.inputs.clear) c.inputs.clear();
      c.inertia = 0;
      c.angularSensibility = 1e9;

      (function tether(){
        const body = s.__playerBody || (s.getMeshByName && s.getMeshByName('player_capsule'));
        if (body && s.activeCamera){
          try { s.activeCamera._lockedTarget = body; } catch(_){}
          return;
        }
        setTimeout(tether, 50);
      })();
    }
    apply();
  })();
  </script>

  <!-- HUD XYZ updater (optional) -->
  <script>
  (function hudXYZ(){
    const label = document.getElementById('hud-xyz');
    if (!label) return;
    function S(){ return window.SCENE; }
    function src(){
      const s=S(); if (!s) return null;
      return s.__playerBody || s.getMeshByName?.('player_capsule') || s.activeCamera || null;
    }
    function loop(){
      const o = src();
      if (o && o.position){
        const p = o.position;
        label.textContent = `${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)}`;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
