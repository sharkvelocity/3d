<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney — 3D Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="author" content="Shark-Blades" />
  <meta name="description" content="3D ghost hunting prototype built with Babylon.js" />
  <meta name="keywords" content="PhasmaPhoney, Phasmophobia, ghost, hunting, game, HTML, Babylon.js" />

  <!-- Babylon core + loaders (local to repo) -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/earcut.min.js"></script>
  <script src="./cdn/meshopt_decoder.js"></script>
  <script src="./cdn/draco_decoder_gltf.js"></script>
  <script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script>
  <script src="./cdn/loaders/babylonjs.loaders.min.js"></script>
  <script src="./cdn/gui/babylon.gui.min.js"></script>

  <!-- Optional: room names / zones for the Map Recorder dropdown -->
  <script src="./rooms.js"></script>

  <style>
    html, body { margin:0; height:100%; width:100%; background:#000; overflow:hidden; font-family:monospace; color:#0ff; }
    #renderCanvas{ width:100vw; height:100dvh; touch-action:none; display:block; background:#000; }
    #title-screen{ position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999;}
    #start-button{ padding:14px 28px; font-size:22px; cursor:pointer; border:2px solid #0ff; color:#0ff; background:#111; }
    #hud{ position:fixed; top:10px; left:10px; z-index:6000; background:rgba(0,0,0,0.5); border:1px solid #066; padding:8px 10px; border-radius:6px; display:none; }
  </style>
</head>
<body>
  <div id="title-screen">
    <div id="title-content">
      <h1 style="color:#0ff">PhasmaPhoney</h1>
      <button id="start-button">Start Investigation</button>
    </div>
  </div>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">HUD Active</div>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    let scene;
    function createScene(){
      scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0,0,0,1);
      const camera = new BABYLON.FreeCamera("cam", new BABYLON.Vector3(0,2,-6), scene);
      camera.setTarget(BABYLON.Vector3.Zero());
      camera.attachControl(canvas,true);
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0,1,0), scene);
      const sphere = BABYLON.MeshBuilder.CreateSphere("sphere",{diameter:2},scene);
      return scene;
    }
    document.getElementById("start-button").onclick = ()=>{
      document.getElementById("title-screen").style.display="none";
      document.getElementById("hud").style.display="block";
      scene = createScene();
      engine.runRenderLoop(()=> scene.render());
    };
    window.addEventListener("resize", ()=> engine.resize());
  </script>
</body>
</html>
