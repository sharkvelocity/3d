<script>
/*** ==========================================================
    AUDIO MANAGER (unlock + master volume + fallbacks)
    ========================================================== ***/
const AudioManager = (()=>{
  let unlocked=false, master=1.0;
  function unlockNow(){
    try{ BABYLON.Engine.audioEngine?.unlock?.(); }catch{}
    try{ BABYLON.Engine.audioEngine?.audioContext?.resume?.(); }catch{}
    unlocked = true;
  }
  function bindOnce(){
    const fire = ()=>{ document.removeEventListener('pointerdown', fire, true); document.removeEventListener('touchstart', fire, true); unlockNow(); };
    document.addEventListener('pointerdown', fire, true);
    document.addEventListener('touchstart', fire, true);
  }
  function setMaster(v){ master=Math.max(0,Math.min(1,v)); try{ BABYLON.Engine.audioEngine?.setGlobalVolume?.(master); }catch{} }
  bindOnce();
  return { unlock: unlockNow, setMaster, get unlocked(){ return unlocked; } };
})();
</script>

<script>
/*** ==========================================================
    UTILITIES
    ========================================================== ***/
function toast(msg, ms=1500){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toast.__t); toast.__t = setTimeout(()=>t.style.display='none', ms);
}
function pointInPolyXZ(p, poly){
  let inside = false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x, zi=poly[i].z, xj=poly[j].x, zj=poly[j].z;
    const intersect = ((zi>p.z)!==(zj>p.z)) && (p.x < (xj-xi)*(p.z-zi)/( (zj-zi)||1e-9 ) + xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
</script>

<script>
/*** ==========================================================
    AMBIENT & EVENT AUDIO (hardened)
    ========================================================== ***/
const WeatherAudio = (()=>{
  let sceneRef=null, current=null, fading=false;
  const tracks={ clear:null, rain:null, snow:null, drone:null };

  function ensure(scene){
    if(sceneRef) return;
    sceneRef = scene;
    tracks.clear = new BABYLON.Sound("clear","./assets/audio/clearWeather.mp3",sceneRef,null,{ loop:true, autoplay:false, volume:0.40, streaming:true });
    tracks.rain  = new BABYLON.Sound("rain","./assets/audio/rainstorm.mp3",sceneRef,null, { loop:true, autoplay:false, volume:0.55, streaming:true });
    tracks.snow  = new BABYLON.Sound("snow","./assets/audio/ambient.mp3",sceneRef,null,    { loop:true, autoplay:false, volume:0.28, streaming:true });
    tracks.drone = new BABYLON.Sound("drone","./assets/audio/ambient.mp3",sceneRef,null,   { loop:true, autoplay:false, volume:0.18, streaming:true });

    document.addEventListener("visibilitychange", ()=>{
      if (document.hidden) return;
      if(!AudioManager.unlocked) return;
      switch(current){
        case 'Clear':      if(!tracks.clear.isPlaying) tracks.clear.play(); break;
        case 'Rain':       if(!tracks.rain.isPlaying)  tracks.rain.play();  break;
        case 'Snow':       if(!tracks.snow.isPlaying)  tracks.snow.play();  break;
        case 'Blood Moon': if(!tracks.rain.isPlaying)  tracks.rain.play();
                           if(!tracks.drone.isPlaying) tracks.drone.play(); break;
      }
    });
  }

  function fadeTo(target){
    if(!sceneRef) return;
    if(current===target || fading) return;
    fading=true;

    const want={ clear:target==='Clear', rain:(target==='Rain'||target==='Blood Moon'), snow:target==='Snow', drone:target==='Blood Moon' };
    if (want.clear && !tracks.clear.isPlaying){ tracks.clear.setVolume(0); tracks.clear.play(); }
    if (want.rain  && !tracks.rain.isPlaying ){ tracks.rain.setVolume(0);  tracks.rain.play();  }
    if (want.snow  && !tracks.snow.isPlaying ){ tracks.snow.setVolume(0);  tracks.snow.play();  }
    if (want.drone && !tracks.drone.isPlaying){ tracks.drone.setVolume(0); tracks.drone.play(); }

    const tgt = { clear: want.clear?0.40:0, rain:want.rain?0.55:0, snow:want.snow?0.28:0, drone:want.drone?0.18:0 };
    const start={ clear:tracks.clear.getVolume(), rain:tracks.rain.getVolume(), snow:tracks.snow.getVolume(), drone:tracks.drone.getVolume() };

    let i=0, steps=16, stepMs=50;
    const tick=setInterval(()=>{
      i++; const a=i/steps; const ease=(x)=>x<.5?2*x*x:-1+(4-2*x)*x;
      ['clear','rain','snow','drone'].forEach(k=>tracks[k].setVolume(start[k]+(tgt[k]-start[k])*ease(a)));
      if(i>=steps){
        clearInterval(tick);
        ['clear','rain','snow','drone'].forEach(k=>{ if(tgt[k]===0 && tracks[k].isPlaying) try{ tracks[k].stop(); }catch{} });
        current=target; fading=false;
      }
    }, stepMs);
  }
  return { init:(s)=>ensure(s), set:(state)=>{ fadeTo(state);} };
})();

function ensureGhostAudio(){
  if(ghost.audio.heartbeat && ghost.audio.singing) return;
  const make = (name, url, opts)=>{
    try{
      const s = new BABYLON.Sound(name, url, scene, null, opts);
      s.onErrorObservable?.add((_, ev)=>{ console.warn('Sound load failed:', url, ev); });
      return s;
    }catch(e){ console.warn('Sound init failed:', url, e); return null; }
  };
  ghost.audio.heartbeat = ghost.audio.heartbeat || make("heartbeat","./assets/audio/ambient.mp3", { loop:true, autoplay:false, volume:0.06, spatialSound:false, streaming:true });
  ghost.audio.singing   = ghost.audio.singing   || make("singing","./assets/audio/whisper.mp3", { loop:true, autoplay:false, volume:0.0, spatialSound:true, maxDistance:20, streaming:true });
}
</script>

<script>
/*** ==========================================================
    BELT UI + HELD LIGHTS
    ========================================================== ***/
function itemById(id){ return ALL_ITEMS.find(x=>x.id===id); }

function rebuildBelt(){
  const el=document.getElementById('belt'); el.innerHTML='';
  belt.forEach((id,i)=>{
    const d=document.createElement('div'); d.className='slot'+(i===activeSlot?' active':'');
    const item=itemById(id);
    d.innerHTML = `<div class="label">${item?.name||id}</div>`;
    d.onclick=()=>{ activeSlot=i; rebuildBelt(); };
    d.oncontextmenu=(e)=>{ e.preventDefault(); cycleSlot(i); };
    el.appendChild(d);
  });
}
function cycleSlot(i){
  const idx = ALL_ITEMS.findIndex(x=>x.id===belt[i]);
  let j=(idx+1)%ALL_ITEMS.length;
  for(let k=0;k<ALL_ITEMS.length;k++){
    const cand = ALL_ITEMS[j].id;
    if(!belt.includes(cand)){ belt[i]=cand; break; }
    j=(j+1)%ALL_ITEMS.length;
  }
  rebuildBelt();
}
function activeItem(){ return itemById(belt[activeSlot]); }

// Held lights
function ensureHeldFlash(){
  if(!held.light){
    held.light = new BABYLON.SpotLight("handFlash", new BABYLON.Vector3(0,1.6,0), new BABYLON.Vector3(0,0,1), Math.PI/7, 14, scene);
    held.light.intensity = 0; held.light.range = 18;
  }
  return held.light;
}
function ensureHeldUV(){
  if(!held.uvLight){
    held.uvLight = new BABYLON.SpotLight("handUV", new BABYLON.Vector3(0,1.6,0), new BABYLON.Vector3(0,0,1), Math.PI/7, 12, scene);
    held.uvLight.diffuse = new BABYLON.Color3(0.6,0.4,1.0);
    held.uvLight.specular = new BABYLON.Color3(0.2,0.1,0.5);
    held.uvLight.intensity = 0; held.uvLight.range = 14;
  }
  return held.uvLight;
}
function ensureHeldLighter(){
  if(!held.lighter){
    held.lighter = new BABYLON.PointLight("handLighter", new BABYLON.Vector3(0,1.6,0), scene);
    held.lighter.intensity = 0; held.lighter.range = 6;
  }
  return held.lighter;
}
function toggleFlash(){ const l=ensureHeldFlash(); l.intensity = (player.inside ? (l.intensity>0?0:1.25) : 0); toast(l.intensity>0?'Flashlight ON':'Flashlight OFF'); }
function toggleUV(){ const u=ensureHeldUV(); u.intensity = (player.inside ? (u.intensity>0?0:1.00) : 0); toast(u.intensity>0?'UV ON':'UV OFF'); }
function toggleLighter(){ lighterOn=!lighterOn; const li=ensureHeldLighter(); li.intensity = (player.inside && lighterOn) ? 0.85 : 0; toast(lighterOn?'Lighter ON':'Lighter OFF'); }

// Item actions
function useActiveItem(){
  const it = activeItem(); if(!it){ toast('Empty slot'); return; }
  switch(it.id){
    case 'flash': toggleFlash(); break;
    case 'uv':    toggleUV(); break;
    case 'camera': takePhoto(); break;
    case 'emf':   pingEMF(); break;
    case 'thermo':readTemp(); break;
    case 'salt':  placeSalt(); break;
    case 'book':  dropWritingBook(); break;
    case 'dots':  toggleDOTS(); break;
    case 'cruci': useCrucifix(); break;
    case 'smudge': burnSmudge(); break;
    default: toast('Use '+it.name);
  }
}
function placeActiveItem(){
  const it = activeItem(); if(!it){ toast('Empty slot'); return; }
  switch(it.id){
    case 'dots': placeDOTS(); break;
    case 'book': placeWritingBook(); break;
    case 'salt': placeSalt(); break;
    default: toast('Place '+it.name);
  }
}
function tossActiveItem(){ toast('Toss '+(activeItem()?.name||'')); }
</script>

<script>
/*** ==========================================================
    INPUT (WASD/Touch) + PICKUP + Tap-to-Sprint
    ========================================================== ***/
const InputSystem = (()=>{
  let move={x:0,z:0}, running=false, lookDelta={x:0,y:0};
  const keys = new Set();
  const keyMap = {
    'KeyW':'fw','KeyS':'bk','KeyA':'lt','KeyD':'rt',
    'ArrowUp':'fw','ArrowDown':'bk','ArrowLeft':'lt','ArrowRight':'rt',
    'ShiftLeft':'run','ShiftRight':'run',
    'Digit1':'slot0','Digit2':'slot1','Digit3':'slot2',
    'KeyE':'pickup', 'KeyG':'drop',
    'Backslash':'tps', 'KeyV':'swap'
  };

  function recomputeMove(){
    const f=(keys.has('fw')?1:0)+(keys.has('bk')?-1:0);
    const r=(keys.has('rt')?1:0)+(keys.has('lt')?-1:0);
    move.z=f; move.x=r; running=keys.has('run') || _tapSprint;
  }
  function onKey(e,down){
    const tag=keyMap[e.code];
    if(!tag) return;
    if(down) keys.add(tag); else keys.delete(tag);
    if(tag.startsWith('slot') && down){
      const idx = parseInt(tag.replace('slot',''),10);
      if(idx>=0 && idx<3){ activeSlot=idx; rebuildBelt(); }
    }
    if(tag==='pickup' && down) tryPickup();
    if(tag==='drop' && down)   tryDrop();
    if(tag==='tps' && down)    toggleThirdPerson();
    if(tag==='swap' && down)   swapShoulder();
    recomputeMove();
  }

  // Mouse look (NO pointer lock; easier debug)
  let lastMouse=null;
  document.addEventListener('mousemove', e=>{
    if(lastMouse){ lookDelta.x += (e.clientX-lastMouse.x); lookDelta.y += (e.clientY-lastMouse.y); }
    lastMouse = {x:e.clientX,y:e.clientY};
  });

  // Touch halves: left = analog move, right = look
  const left=document.getElementById('touch-left'), right=document.getElementById('touch-right');
  let leftId=null, leftCenter=null, rightId=null, lastRight=null;
  const DEAD=14, MAX=120;
  const norm=(v)=> Math.abs(v)<DEAD?0:v;

  left.addEventListener('touchstart', e=>{ for(const t of e.changedTouches){ if(leftId===null){ leftId=t.identifier; leftCenter={x:t.clientX,y:t.clientY}; break; } } e.preventDefault(); },{passive:false});
  right.addEventListener('touchstart', e=>{ for(const t of e.changedTouches){ if(rightId===null){ rightId=t.identifier; lastRight={x:t.clientX,y:t.clientY}; break; } } e.preventDefault(); },{passive:false});

  window.addEventListener('touchmove', e=>{
    for(const t of e.changedTouches){
      if(t.identifier===leftId && leftCenter){
        const dx=clamp(t.clientX-leftCenter.x,MAX), dy=clamp(t.clientY-leftCenter.y,MAX);
        const nx=norm(dx)/MAX, ny=norm(dy)/MAX;
        move.x = nx>0.25? 1 : nx<-0.25? -1 : 0;
        move.z = ny<-0.25? 1 : ny>0.25? -1 : 0;
        // analog drag sets a speed scale (farther -> faster) but clamp overall
        _analogSpeedScale = clamp(Math.max(Math.abs(nx),Math.abs(ny))*1.4, 0.6, 1.3);
        e.preventDefault();
      } else if(t.identifier===rightId){
        if(lastRight){ lookDelta.x += (t.clientX-lastRight.x); lookDelta.y += (t.clientY-lastRight.y); }
        lastRight={x:t.clientX,y:t.clientY}; e.preventDefault();
      }
    }
  },{passive:false});
  window.addEventListener('touchend', e=>{
    for(const t of e.changedTouches){
      if(t.identifier===leftId){ leftId=null; leftCenter=null; move.x=0; move.z=0; _analogSpeedScale=1.0; }
      if(t.identifier===rightId){ rightId=null; lastRight=null; }
    }
    e.preventDefault();
  },{passive:false});

  // Tap-to-sprint button
  document.getElementById('btn-sprint').onclick = ()=>{ _tapSprint = !_tapSprint; toast(_tapSprint?'Sprint: ON':'Sprint: OFF'); recomputeMove(); };

  // Try pickup / drop
  function tryPickup(){
    const ray = camera.getForwardRay(2.2);
    const hit = scene.pickWithRay(ray, m=>m && m.metadata?.itemId);
    if(hit?.pickedMesh?.metadata?.itemId){
      const id = hit.pickedMesh.metadata.itemId;
      if(!belt.includes(id)){
        const empty = belt.findIndex(s=>!s);
        if(empty>=0) belt[empty]=id; else belt[activeSlot]=id;
        rebuildBelt();
      }
      hit.pickedMesh.dispose();
      const i = WORLD_ITEMS.findIndex(x=>x===hit.pickedMesh); if(i>=0) WORLD_ITEMS.splice(i,1);
      toast('Picked up '+itemById(id).name);
    }
  }
  function tryDrop(){
    const it = activeItem(); if(!it) return;
    const box = BABYLON.MeshBuilder.CreateBox("drop_"+it.id,{size:0.25},scene);
    box.position = camera.position.add(new BABYLON.Vector3(0,-0.9,0)).add(camera.getForwardRay().direction.scale(0.6));
    box.isPickable=true; box.checkCollisions=false;
    box.metadata={ itemId: it.id };
    const mat = new BABYLON.StandardMaterial("im_"+it.id,scene); mat.emissiveColor=new BABYLON.Color3(0.2,0.4,0.5); box.material=mat;
    WORLD_ITEMS.push(box);
    toast('Dropped '+it.name);
  }

  // keyboard
  document.addEventListener('keydown', e=>onKey(e,true), {passive:false});
  document.addEventListener('keyup',   e=>onKey(e,false), {passive:false});

  // public
  let _tapSprint=false, _analogSpeedScale=1.0;
  return {
    init(){ /* bound above */ },
    snapshot(){
      const out={ moveVec:{...move}, running, lookDelta:{...lookDelta}, speedScale:_analogSpeedScale };
      lookDelta.x=0; lookDelta.y=0; return out;
    }
  };
})();
</script>

<script>
/*** ==========================================================
    MOVEMENT & LOOK (+ TPS spring arm)
    ========================================================== ***/
function handleMovement(input, dt){
  if(!camera) return;
  const base = input.running ? player.speedRun : player.speedWalk;
  const speed = base * (input.speedScale||1.0);
  const fwd = camera.getForwardRay().direction.clone(); fwd.y=0; fwd.normalize();
  const right = BABYLON.Vector3.Cross(fwd, BABYLON.Axis.Y).scale(-1);
  const desired = fwd.scale(input.moveVec.z).add(right.scale(input.moveVec.x));
  if (desired.lengthSquared()>0){
    const v = desired.normalize().scale(speed*dt);
    const next = camera.position.add(v);
    const probe = next.add(new BABYLON.Vector3(0, player.stepUpMax, 0));
    const downRay = new BABYLON.Ray(probe, new BABYLON.Vector3(0,-1,0), player.stepUpMax+0.6);
    const hit = scene.pickWithRay(downRay, m=>m && m.isPickable!==false);
    if(hit && hit.pickedPoint){
      const deltaY = hit.pickedPoint.y + 1.7 - camera.position.y;
      if(deltaY<=player.stepUpMax) camera.position = new BABYLON.Vector3(next.x, hit.pickedPoint.y+1.7, next.z);
      else camera.position = next;
    } else camera.position = next;
  }
  if(_avatar.enabled){
    // keep avatar root under camera (XZ), locking Y to ground hit
    const pos = camera.position.clone();
    let y = pos.y - 1.7;
    const down = scene.pickWithRay(new BABYLON.Ray(pos.add(new BABYLON.Vector3(0,0.1,0)), new BABYLON.Vector3(0,-1,0), 3), m=>m && m.isPickable!==false);
    if(down?.pickedPoint) y = down.pickedPoint.y;
    _avatar.root.position.set(pos.x, y, pos.z);
  }
}
function applyLook(lookDelta){
  if(!camera) return;
  const sens = player.firstPerson ? player.lookSensFP : player.lookSensTPS;
  camera.rotation.y += lookDelta.x * sens;
  const invertY = 1;
  const minPitch=-Math.PI/2+0.15, maxPitch=Math.PI/2-0.15;
  const pitch=(camera.rotation.x||0)+(invertY * lookDelta.y * sens * 0.85);
  camera.rotation.x=Math.min(maxPitch, Math.max(minPitch, pitch));
}

/* Third-person toggle + shoulder swap */
function swapShoulder(){ _avatar.shoulder *= -1; toast(_avatar.shoulder>0?'Right shoulder':'Left shoulder'); }
function toggleThirdPerson(){
  _avatar.enabled = !_avatar.enabled;
  player.firstPerson = !_avatar.enabled;
  toast(_avatar.enabled?'Third person':'First person');
}

/* Spring arm collision that ignores non-blocking meshes (no glass/foliage jitter) */
function springArmTick(dt){
  if(!_avatar.enabled || !camera) return;
  const camFwd = camera.getForwardRay().direction;
  const back = camFwd.scale(-1);
  const target = _avatar.root.position.add(new BABYLON.Vector3(0,_avatar.offsetY,0));
  const side = BABYLON.Vector3.Cross(BABYLON.Axis.Y, back).normalize().scale(0.38 * _avatar.shoulder);
  const want = target.add(side).add(back.scale(_avatar.dist));
  const dir = want.subtract(target); const len = dir.length(); dir.normalize();
  const ray = new BABYLON.Ray(target, dir, len);
  const hit = scene.pickWithRay(ray, m=>{
    if(!m) return false;
    if(m.metadata?.noCameraCollision) return false;
    if(m.checkCollisions===false) return false;
    const mat = m.material;
    if(mat && ('alpha' in mat) && mat.alpha<0.25) return false; // glass/leaves etc
    return true;
  });
  const pos = hit?.pickedPoint ? hit.pickedPoint.add(dir.scale(-0.12)) : want;
  camera.position.copyFrom(pos);
}
</script>

<script>
/*** ==========================================================
    WEATHER & MOON (particles anchored to map bounds)
    ========================================================== ***/
let __rainTex = null;
function makeRainTexture(){
  if(__rainTex) return __rainTex;
  const w=2, h=32;
  const dt = new BABYLON.DynamicTexture("rainTex",{width:w,height:h},scene,false);
  const ctx=dt.getContext(); ctx.clearRect(0,0,w,h);
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0.0,"rgba(255,255,255,0.00)");
  g.addColorStop(0.3,"rgba(255,255,255,0.40)");
  g.addColorStop(0.6,"rgba(255,255,255,0.80)");
  g.addColorStop(0.9,"rgba(255,255,255,0.40)");
  g.addColorStop(1.0,"rgba(255,255,255,0.00)");
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h); dt.update(false);
  __rainTex=dt; return dt;
}
function ensureWeatherEmitterNode(){
  if(weather.emitterNode) return weather.emitterNode;
  weather.emitterNode = new BABYLON.TransformNode("weatherEmitter", scene);
  weather.emitterNode.position = new BABYLON.Vector3(0, 12, 0);
  return weather.emitterNode;
}
function updateEmitterToBounds(){
  if(!weather.emitterNode) return;
  const b = window.WORLD_BOUNDS;
  if(b){
    const cx=(b.minx+b.maxx)/2, cz=(b.minz+b.maxz)/2;
    const w=Math.max(10, b.maxx-b.minx), d=Math.max(10, b.maxz-b.minz);
    weather.emitterNode.position.set(cx, 14, cz);
    weather._emitSize = { w: w*0.9, d: d*0.9 }; // cover most of area
  }else{
    weather.emitterNode.position.set(0,14,0);
    weather._emitSize = { w: 24, d: 24 };
  }
}
function ensureRain(){
  if(weather.rainPS) return weather.rainPS;
  const ps=new BABYLON.ParticleSystem("rain", 2400, scene);
  ps.particleTexture=makeRainTexture();
  ps.emitter = ensureWeatherEmitterNode();
  updateEmitterToBounds();
  ps.minEmitBox=new BABYLON.Vector3(-weather._emitSize.w/2, 0, -weather._emitSize.d/2);
  ps.maxEmitBox=new BABYLON.Vector3( weather._emitSize.w/2, 0,  weather._emitSize.d/2);
  ps.minSize=0.9; ps.maxSize=1.2;
  ps.minLifeTime=0.7; ps.maxLifeTime=1.0;
  ps.direction1=new BABYLON.Vector3(-0.15,-1.7, 0.1);
  ps.direction2=new BABYLON.Vector3( 0.15,-1.5,-0.1);
  ps.gravity=new BABYLON.Vector3(0,-9.8,0);
  ps.emitRate=1200; ps.updateSpeed=0.02;
  ps.color1=new BABYLON.Color4(0.95,0.98,1.00,0.85);
  ps.color2=new BABYLON.Color4(0.95,0.98,1.00,0.55);
  ps.colorDead=new BABYLON.Color4(1,1,1,0.0);
  ps.disposeOnStop=false;
  weather.rainPS=ps; return ps;
}
function ensureSnow(){
  if(weather.snowPS) return weather.snowPS;
  const ps=new BABYLON.ParticleSystem("snow", 1800, scene);
  const snowTex=new BABYLON.DynamicTexture("snowTex",{width:8,height:8},scene,false);
  const ctx=snowTex.getContext(); ctx.clearRect(0,0,8,8);
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(4,4,3,0,Math.PI*2); ctx.fill(); snowTex.update(false);
  ps.particleTexture=snowTex;
  ps.emitter = ensureWeatherEmitterNode();
  updateEmitterToBounds();
  ps.minEmitBox=new BABYLON.Vector3(-weather._emitSize.w/2, 0, -weather._emitSize.d/2);
  ps.maxEmitBox=new BABYLON.Vector3( weather._emitSize.w/2, 0,  weather._emitSize.d/2);
  ps.minSize=0.06; ps.maxSize=0.12;
  ps.minLifeTime=2.0; ps.maxLifeTime=3.2;
  ps.emitRate=900;
  ps.direction1=new BABYLON.Vector3(-0.12,-0.7, 0.08);
  ps.direction2=new BABYLON.Vector3( 0.12,-0.9,-0.08);
  ps.gravity=new BABYLON.Vector3(0,-0.25,0);
  ps.updateSpeed=0.02;
  ps.color1=new BABYLON.Color4(1,1,1,0.95);
  ps.color2=new BABYLON.Color4(1,1,1,0.70);
  ps.disposeOnStop=false;
  weather.snowPS=ps; return ps;
}
function setWeather(state){
  weather.state=state;
  document.getElementById('hud-weather').textContent=state;
  WeatherAudio.set(state);
  if(weather.rainPS) weather.rainPS.stop();
  if(weather.snowPS) weather.snowPS.stop();
  if(state==='Clear'){ /* none */ }
  if(state==='Snow'){ ensureSnow().start(); }
  if(state==='Rain'){ ensureRain().start(); scheduleNextLightning(); }
  if(state==='Blood Moon'){ ensureRain().start(); scheduleNextLightning(); }
}
async function loadMoon(){
  try{
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/sky/", "moon.glb", scene);
    moonMesh = r.meshes.find(m=>m.name && m.name!=="__root__") || r.meshes[0];
    if(moonMesh){
      moonMesh.name="MoonMesh";
      moonMesh.isPickable=false; moonMesh.applyFog=false; moonMesh.renderingGroupId=1;
      const mat = moonMesh.material || new BABYLON.StandardMaterial("moonMat", scene);
      mat.disableLighting=true; mat.emissiveColor=new BABYLON.Color3(1,1,1);
      moonMesh.material=mat;
      moonMesh.position.copyFromFloats(0, 120, 180);
      scene.onBeforeRenderObservable.add(()=>{
        const t=performance.now()*0.00002;
        moonMesh.position.x=Math.cos(t)*180;
        moonMesh.position.z=Math.sin(t)*180;
        moonMesh.position.y=115+Math.sin(t*1.7)*6;
      });
    }
  }catch(e){ console.warn('Moon load failed', e); }
}
</script>

<script>
/*** ==========================================================
    MAP SELECTOR + DYNAMIC DEF LOADER (CLEAN)
    ========================================================== ***/
const MAP_FILES = [
  { file:"Abandoned_House.glb", title:"Abandoned House", def:"Abandoned_House.js" },
  { file:"furnished_house.glb", title:"Furnished House", def:"furnished_house.js" }
];
let CURRENT_MAP = null;
let WORLD_BOUNDS = null;

function populateMapSelector(){
  const sel = document.getElementById('map-select'); if(!sel) return;
  sel.innerHTML = MAP_FILES.map((m,i)=>`<option value="${i}">${m.title}</option>`).join('');
  sel.value = "0";
}
(function(){
  const run = ()=>{ try{ populateMapSelector(); }catch(e){ console.warn('populateMapSelector failed', e);} };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', run, {once:true}); else run();
})();
function getSelectedMap(){
  const sel = document.getElementById('map-select'); const idx = Math.max(0, Math.min(MAP_FILES.length-1, parseInt(sel?.value||"0",10) || 0));
  return MAP_FILES[idx];
}
function loadScriptOnce(src){
  return new Promise((resolve)=>{
    const s=document.createElement('script'); s.src=src;
    s.onload=()=>resolve(true); s.onerror=()=>resolve(false);
    document.head.appendChild(s);
  });
}
async function loadMatchingMapDef(mapFile){
  const base = mapFile.replace(/\.[^.]+$/,'');
  const guess = `./assets/models/map/${base}.js`;
  const ok = await loadScriptOnce(guess);
  if(!ok){ window.MAP_DEF = undefined; }
}
window.loadSelectedMap = async function(){
  const mapFile = (window.CURRENT_MAP && window.CURRENT_MAP.file) ? window.CURRENT_MAP.file : "Abandoned_House.glb";
  try { await loadMatchingMapDef(mapFile); } catch{}
  try{
    const res = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/map/", mapFile, scene);
    houseRoot = res.meshes[0] || res.meshes.find(m=>m.name==="__root__") || null;
    res.meshes.forEach(m=>{ m.checkCollisions=true; m.isPickable=true; m.receiveShadows=true; });
    const bb = houseRoot?.getHierarchyBoundingVectors?.(true);
    if(bb){
      window.WORLD_BOUNDS = { minx:bb.min.x, maxx:bb.max.x, minz:bb.min.z, maxz:bb.max.z };
      updateEmitterToBounds(); // position rain/snow over map
    }
  }catch(e){
    console.warn('Map load failed; building ground fallback', e);
    const g=BABYLON.MeshBuilder.CreateGround("fallback",{width:180,height:180},scene); g.checkCollisions=true;
  }
};
</script>

<script>
/*** ==========================================================
    MARKER TOOL (discs)
    ========================================================== ***/
function currentRoomName(){
  if(!window.MAP_DEF) return player.inside?'House':'Exterior';
  const pos = {x:camera.position.x, z:camera.position.z};
  for(const r of MAP_DEF.rooms){ if(pointInPolyXZ(pos, r.poly)) return r.name; }
  return player.inside ? 'House' : 'Exterior';
}
function isInsideExterior(p){
  if(!window.MAP_DEF) return true;
  return pointInPolyXZ({x:p.x, z:p.z}, MAP_DEF.exterior);
}
const MarkerTool = (()=>{
  let enabled=false, interior=true, points=[];
  let polyMesh=null, polyMat=null, discs=[];

  function toggle(){ enabled=!enabled; toast('Markers '+(enabled?'enabled':'disabled')); }
  function toggleFill(){ interior=!interior; document.getElementById('btn-marker-fill').textContent = 'Fill: ' + (interior?'Interior':'Exterior'); redraw(); }
  function clear(){
    points.length=0;
    discs.forEach(d=>d.dispose()); discs=[];
    if(polyMesh){ polyMesh.dispose(); polyMesh=null; }
  }
  function pointerToGround(){
    const ray = scene.createPickingRay(scene.pointerX, scene.pointerY, BABYLON.Matrix.Identity(), camera);
    const hit = scene.pickWithRay(ray, m=>m && m.isPickable!==false);
    return hit?.pickedPoint ? hit.pickedPoint.clone() : null;
  }
  function addDisc(p){
    const d = BABYLON.MeshBuilder.CreateDisc("mk", {radius:0.25, tessellation:24}, scene);
    d.rotation.x = Math.PI/2;
    d.position = new BABYLON.Vector3(p.x, p.y+0.02, p.z);
    const m = new BABYLON.StandardMaterial("mkMat", scene);
    m.emissiveColor = new BABYLON.Color3(0, 0.8, 0.8);
    m.alpha = 0.8;
    d.material = m;
    discs.push(d);
  }
  function redraw(){
    if(polyMesh){ polyMesh.dispose(); polyMesh=null; }
    if(points.length<3) return;
    const shape = points.map(p=> new BABYLON.Vector2(p.x, p.z));
    const builder = new BABYLON.PolygonMeshBuilder("poly", shape, scene);
    polyMesh = builder.build(false, 0.02);
    if(!polyMat){ polyMat=new BABYLON.StandardMaterial("polyMat",scene); polyMat.alpha=0.35; }
    polyMat.diffuseColor = interior? new BABYLON.Color3(0,0.3,0.3): new BABYLON.Color3(0.3,0,0.3);
    polyMesh.material=polyMat;
    polyMesh.position.y = discs[0]?.position.y ?? (camera.position.y-1.6)+0.05;
  }
  scene.onPointerObservable.add((pi)=>{
    if(!enabled) return;
    if(pi.type===BABYLON.PointerEventTypes.POINTERDOWN){
      const ev = pi.event;
      const P = pointerToGround(); if(!P) return;
      if(ev.button===2){ ev.preventDefault(); if(points.length){ points.pop(); const d=discs.pop(); if(d) d.dispose(); redraw(); } return; }
      if(points.length>0){
        const first=points[0];
        const d = Math.hypot(P.x-first.x, P.z-first.z);
        if(d<0.8){ points.push({...first}); redraw(); toast('Polygon closed'); return; }
      }
      points.push({x:P.x,y:P.y,z:P.z}); addDisc(P); redraw();
    }
  });
  function save(){
    const data = { interior, points: points.map(p=>({x:p.x,y:p.y,z:p.z})) };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='markers.json'; a.click();
  }
  return { toggle, toggleFill, save, clear, init(){ /* buttons wired below */ } };
})();
document.getElementById('btn-marker').onclick=()=>MarkerTool.toggle();
document.getElementById('btn-marker-fill').onclick=()=>MarkerTool.toggleFill();
document.getElementById('btn-marker-save').onclick=()=>MarkerTool.save();
document.getElementById('btn-marker-clear').onclick=()=>MarkerTool.clear();
</script>

<script>
/*** ==========================================================
    VAN TOOLS (spawn in van, not around house)
    ========================================================== ***/
function randomPointInRoomPoly(poly){
  const xs=poly.map(p=>p.x), zs=poly.map(p=>p.z);
  const minx=Math.min(...xs), maxx=Math.max(...xs), minz=Math.min(...zs), maxz=Math.max(...zs);
  for(let tries=0; tries<80; tries++){
    const x=minx+(maxx-minx)*Math.random();
    const z=minz+(maxz-minz)*Math.random();
    if(pointInPolyXZ({x,z}, poly)){
      const ray = new BABYLON.Ray(new BABYLON.Vector3(x, 12, z), new BABYLON.Vector3(0,-1,0), 40);
      const hit = scene.pickWithRay(ray, m=>m && m.isPickable!==false);
      const y = hit?.pickedPoint ? hit.pickedPoint.y+0.05 : 1.7;
      return new BABYLON.Vector3(x,y,z);
    }
  }
  return new BABYLON.Vector3(poly[0].x, 1.7, poly[0].z);
}
async function spawnToolsInVan(){
  const van = (MAP_DEF?.rooms||[]).find(r=>r.name==='Van');
  if(!van){ console.warn('No Van room poly; falling back'); return; }
  try{
    // If we have a GLB with item meshes, import it and drop a few nodes.
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/items/", "exploration_objects.glb", scene);
    const nodes = r.meshes.filter(m=>m.name && m.name!=="__root__");
    const pick = (i)=> nodes[i % nodes.length];
    // Flashlight, EMF, Camera near van center
    const posA = randomPointInRoomPoly(van.poly), posB = randomPointInRoomPoly(van.poly), posC = randomPointInRoomPoly(van.poly);
    [ {id:'flash',pos:posA}, {id:'emf',pos:posB}, {id:'camera',pos:posC} ].forEach((it,i)=>{
      const m = pick(i).clone(it.id+"_m");
      m.position.copyFrom(it.pos); m.isPickable=true; m.metadata={ itemId: it.id }; WORLD_ITEMS.push(m);
    });
  }catch(e){
    // Fallback: simple boxes
    ['flash','emf','camera','thermo','salt','book','dots'].forEach((id,i)=>{
      const room=(MAP_DEF?.rooms||[]).find(r=>r.name==='Van')||{poly:MAP_DEF?.exterior||[{x:0,z:0}]};
      const pos = randomPointInRoomPoly(room.poly);
      const box = BABYLON.MeshBuilder.CreateBox("item_"+id,{size:0.25},scene);
      const mat = new BABYLON.StandardMaterial("im_"+id,scene); mat.emissiveColor=new BABYLON.Color3(0.2+Math.random()*0.2,0.6,0.7);
      box.material=mat; box.position=pos; box.isPickable=true; box.metadata={ itemId:id }; WORLD_ITEMS.push(box);
    });
  }
}
</script>

<script>
/*** ==========================================================
    GHOST: SPAWN, EVENTS, HUNTS, VISIBILITY
    ========================================================== ***/
function makeFlickerController(mesh){
  let t=0,on=false,next=0,solid=0.85;
  return {
    setSolid(v){ solid=v; },
    reset(){ t=0; on=false; next=0; },
    tick(dt, mode, profile){
      t+=dt;
      if(mode==='idle'){ apply(0); return; }
      if(t>=next){
        const fast = 0.05 + Math.random()*0.07;
        const slow = 0.28 + Math.random()*0.22;
        let onDur, offDur;
        if(profile==='phantom'){ onDur = fast*0.6; offDur = 0.9 + Math.random()*0.6; }
        else if(profile==='oni'){ onDur = 0.30 + Math.random()*0.25; offDur = (Math.random()<0.5)?0.7:1.0; }
        else { onDur = fast; offDur = slow; }
        on=true; next=t+onDur; apply(solid);
        setTimeout(()=>{ on=false; apply(0); }, onDur*1000);
        next += offDur;
      } else apply(on?solid:0);
      function apply(a){ if(!mesh) return; if(mesh.material && 'alpha' in mesh.material) mesh.material.alpha=a; else mesh.visibility=a; }
    }
  };
}
function randomInsideExterior(){
  const poly = MAP_DEF?.exterior || [{x:-10,z:-10},{x:10,z:-10},{x:10,z:10},{x:-10,z:10}];
  return randomPointInRoomPoly(poly);
}
async function spawnGhost(){
  const profile = GHOSTS[(Math.random()*GHOSTS.length)|0];
  ghost.type = profile.name;
  ghost.wanderRadius = profile.rules?.wander ?? 8;
  ghost.canChangeRoom = profile.rules?.roomChange !== false;

  try{
    const list = ["ghost1.glb","ghost2.glb","ghost3.glb","ghost4.glb","ghost5.glb"];
    const pick = list[(Math.random()*list.length)|0];
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/ghosts/", pick, scene);
    ghost.mesh = r.meshes.find(m=>m.name && m.name!=="__root__") || r.meshes[0];
    if(ghost.mesh){
      ghost.mesh.isPickable=false; ghost.mesh.checkCollisions=false;
      const bb = ghost.mesh.getHierarchyBoundingVectors(true);
      const height=bb.max.y-bb.min.y; const s=1.9/Math.max(0.8,height||1);
      ghost.mesh.scaling.set(s,s,s);
    }
  }catch(e){ /* fallback */ }

  if(!ghost.mesh){
    const m=BABYLON.MeshBuilder.CreateBox("ghostFallback",{size:1.2},scene);
    const mat=new BABYLON.StandardMaterial("ghostMat",scene); mat.alpha=0; mat.emissiveColor=new BABYLON.Color3(0.6,0.7,1.0);
    m.material=mat; m.isPickable=false; ghost.mesh=m;
  }

  ghost.roomCenter = randomInsideExterior();
  ghost.mesh.position.copyFrom(ghost.roomCenter);
  ghost.visible=false;
  ghost.flicker = makeFlickerController(ghost.mesh);
  if(ghost.type==='Phantom') ghost.flicker.setSolid(0.45);
  if(ghost.type==='Oni')     ghost.flicker.setSolid(0.95);

  ensureGhostAudio();
  ghost.audio.singing.attachToMesh(ghost.mesh);
}
function wanderGhost(dt){
  if(!ghost.mesh) return;
  if(ghost.mode!=='idle' && ghost.mode!=='event') return;
  if(!ghost._dir || Math.random()<0.02){
    const ang=Math.random()*Math.PI*2;
    const spd=0.28;
    ghost._dir = new BABYLON.Vector3(Math.cos(ang)*spd,0,Math.sin(ang)*spd);
  }
  const step = ghost._dir.scale(dt);
  const cand = ghost.mesh.position.add(step);
  if(isInsideExterior(cand)) ghost.mesh.position = cand; else ghost._dir=null;
}
function startEvent(){
  ghost.mode='event';
  ghost._eventLeft = 3 + Math.random()*2;
  toast('You hear something...');
}
function ghostEventTick(dt){
  ghost.eventTimer += dt;
  if(ghost.mode!=='hunt' && ghost.eventTimer>ghost.nextEvent){
    ghost.eventTimer=0; ghost.nextEvent=10+Math.random()*14;
    const chance = clamp((80-player.sanity)/120,0.05,0.7);
    if(Math.random()<chance) startEvent();
  }
  if(ghost.mode==='event'){
    ghost._eventLeft -= dt;
    if(ghost._eventLeft<=0) ghost.mode='idle';
  }
}
function startHunt(){
  ghost.mode='hunt'; ghost._huntLeft = 8 + Math.random()*5;
  document.getElementById('hud-hunt').textContent='Hunting';
  toast('Hunt started!');
  if(!ghost.audio.heartbeat.isPlaying) ghost.audio.heartbeat.play();
  if(!ghost.audio.singing.isPlaying)   ghost.audio.singing.play();
}
function stopHunt(reason){
  ghost.mode='idle'; document.getElementById('hud-hunt').textContent='Calm';
  toast('Hunt ended'+(reason?` (${reason})`:'')); 
  if(ghost.audio.heartbeat.isPlaying) ghost.audio.heartbeat.stop();
  if(ghost.audio.singing.isPlaying)   ghost.audio.singing.stop();
}
function huntTick(dt){
  if(!ghost._huntTimer){ ghost._huntTimer=0; ghost._nextHunt=50+Math.random()*40; }
  if(ghost.mode==='hunt'){
    if(performance.now() < (ghost.smudgedUntil||0)) return;
    const dir = camera.position.subtract(ghost.mesh.position); dir.y=0;
    const dist = dir.length();
    ghost.nearPlayer = dist<3.0;
    if(dist>0.02){
      dir.normalize();
      const spd = (ghost.type==='Revenant' && player.sanity<50) ? 2.6 : 1.35;
      ghost.mesh.position.addInPlace(dir.scale(spd*dt));
    }
    ghost._huntLeft -= dt;
    if(ghost._huntLeft<=0) stopHunt();
  } else {
    ghost._huntTimer += dt;
    if(ghost._huntTimer>ghost._nextHunt){
      ghost._huntTimer=0; ghost._nextHunt=55+Math.random()*45;
      if(player.sanity<65){ startHunt(); }
    }
  }
}
function ghostVisibilityTick(dt){
  const profile = (ghost.type==='Phantom')?'phantom':(ghost.type==='Oni')?'oni':'default';
  const mode = (ghost.mode==='event' || ghost.mode==='hunt') ? ghost.mode : 'idle';
  ghost.flicker?.tick(dt, mode, profile);
  ghost.visible = (ghost.mesh.material?.alpha ?? ghost.mesh.visibility) > 0.05;
}
function ghostAbortHunt(reason){ stopHunt(reason); }
</script>

<script>
/*** ==========================================================
    SANITY (light/room/weather ties) + audio gains
    ========================================================== ***/
function sanityTick(dt){
  player.inside = isInsideExterior(camera.position);
  const roomNow = currentRoomName();
  if(roomNow!==player.room){ player.room = roomNow; document.getElementById('hud-room').textContent=roomNow; }

  // Held light contribution (only inside)
  const li = player.inside ? (
    (held.light?.intensity||0)*0.7 +
    (held.uvLight?.intensity||0)*0.5 +
    (held.lighter?.intensity||0)*0.8
  ) : 0;
  player.lightLevel = clamp(li/2.5, 0, 1);

  // Base rates
  let drain = 0.004;  // ambient decay
  let recover = 0;

  // Recovery in light
  if(player.lightLevel>0.4) recover += 0.008 * (player.lightLevel-0.4);

  // Darkness hurts (more in Blood Moon)
  if(player.lightLevel<0.25){
    drain += (0.010 * (0.25-player.lightLevel));
    if(weather.state==='Blood Moon') drain += 0.004;
  }

  // Ghost proximity
  if(ghost.mesh){
    const d = BABYLON.Vector3.Distance(ghost.mesh.position, camera.position);
    if(d<6) drain += 0.016 * ((6-d)/6);
  }

  // Events & Hunts
  if(ghost.mode==='event') drain += 0.010;
  if(ghost.mode==='hunt')  drain += 0.020;

  // Van recovers quickly
  if(player.room==='Van') recover += 0.040;

  // Apply
  player.sanity = clamp(player.sanity + (recover - drain)*dt*60, 0, 100);
  const pct = Math.round(player.sanity);
  document.getElementById('hud-sanity-label').textContent = pct+'%';
  document.getElementById('hud-sanity-fill').style.width = pct+'%';
}
function updateEventAudioGains(){
  if(!ghost.audio || !ghost.audio.heartbeat || !ghost.audio.singing) return;
  const d = ghost.mesh ? BABYLON.Vector3.Distance(ghost.mesh.position, camera.position) : 99;
  const near = clamp(1-(d/12), 0, 1);
  if(ghost.mode==='hunt'){
    ghost.audio.heartbeat.setVolume(0.18 + 0.40*near);
    ghost.audio.singing.setVolume(0.12 + 0.50*near);
  }else if(ghost.mode==='event'){
    ghost.audio.heartbeat.setVolume(0.10*near);
    ghost.audio.singing.setVolume(0.20 + 0.30*near);
    if(!ghost.audio.singing.isPlaying) ghost.audio.singing.play();
  }else{
    ghost.audio.heartbeat.setVolume(0);
    ghost.audio.singing.setVolume(0);
    if(ghost.audio.singing.isPlaying) ghost.audio.singing.stop();
  }
}
</script>

<script>
/*** ==========================================================
    GLB VIEWER (clean)
    ========================================================== ***/
let viewerEngine=null, viewerScene=null, viewerCam=null;
function openViewer(){
  const modal = document.getElementById('viewer-modal');
  modal.style.display='block';
  if(!viewerEngine){
    const canvas = document.getElementById('viewer-canvas');
    viewerEngine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true, disableWebGL2Support:false });
    viewerScene = new BABYLON.Scene(viewerEngine);
    viewerScene.clearColor = new BABYLON.Color4(0.02,0.03,0.05,1);
    viewerCam = new BABYLON.ArcRotateCamera("vCam", Math.PI/4, Math.PI/3, 6, new BABYLON.Vector3(0,1,0), viewerScene);
    viewerCam.attachControl(canvas, true);
    new BABYLON.HemisphericLight("vHemi", new BABYLON.Vector3(0,1,0), viewerScene);
    new BABYLON.GlowLayer("glow", viewerScene, { blurKernelSize: 16 });
    viewerEngine.runRenderLoop(()=>viewerScene.render());
    window.addEventListener('resize', ()=>viewerEngine?.resize?.());
  }
}
function closeViewer(){ document.getElementById('viewer-modal').style.display='none'; }
function fitViewerCamera(){
  try{
    let minX=Infinity,minY=Infinity,minZ=Infinity,maxX=-Infinity,maxY=-Infinity,maxZ=-Infinity;
    viewerScene.meshes.forEach(m=>{
      if(m.name==="__root__") return;
      const bb = m.getBoundingInfo()?.boundingBox; if(!bb) return;
      const vs = bb.vectorsWorld;
      for(const v of vs){ minX=Math.min(minX,v.x); minY=Math.min(minY,v.y); minZ=Math.min(minZ,v.z);
                          maxX=Math.max(maxX,v.x); maxY=Math.max(maxY,v.y); maxZ=Math.max(maxZ,v.z);}
    });
    const center = new BABYLON.Vector3((minX+maxX)/2,(minY+maxY)/2,(minZ+maxZ)/2);
    const radius = Math.max(maxX-minX, maxY-minY, maxZ-minZ) * 1.2 || 5;
    viewerCam.target = center; viewerCam.radius = radius;
  }catch(e){}
}
async function viewerLoadPath(){
  const path = document.getElementById('viewer-path').value.trim(); if(!path) return;
  viewerScene.meshes.slice().forEach(m=>{ if(m.name!=="__root__") m.dispose(); });
  try{ await BABYLON.SceneLoader.AppendAsync("", path, viewerScene); fitViewerCamera(); }
  catch(e){ console.warn('Viewer path load failed', e); toast('Failed to load'); }
}
function viewerLoadFile(file){
  if(!file) return;
  viewerScene.meshes.slice().forEach(m=>{ if(m.name!=="__root__") m.dispose(); });
  const url = URL.createObjectURL(file);
  BABYLON.SceneLoader.Append("", url, viewerScene, ()=>{ fitViewerCamera(); URL.revokeObjectURL(url); }, null, (scene,msg,exc)=>{
    console.warn('Viewer file error', msg, exc); toast('Failed to load file'); URL.revokeObjectURL(url);
  });
}
document.getElementById('btn-viewer').onclick = openViewer;
document.getElementById('viewer-close').onclick = closeViewer;
document.getElementById('viewer-load-path').onclick = viewerLoadPath;
document.getElementById('viewer-choose').onclick = ()=> document.getElementById('viewer-file').click();
document.getElementById('viewer-file').addEventListener('change', (e)=>{ const f=e.target.files?.[0]; if(f) viewerLoadFile(f); });
</script>

    const mesh = r.meshes.find(m=>m.name && m.name!=="__root__") || r.meshes[0];
    _avatar.root = new BABYLON.TransformNode("playerAvatar", scene);

<script>
/*** ==========================================================
    BOOT + MAIN LOOP
    ========================================================== ***/
async function boot(){
  engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true, disableWebGL2Support:false });
  scene  = new BABYLON.Scene(engine);
  scene.collisionsEnabled = true;
  scene.gravity = new BABYLON.Vector3(0,-0.5,0);

  camera = new BABYLON.UniversalCamera("playerCam", new BABYLON.Vector3(MAP_DEF?.vanSpawn?.x||0, MAP_DEF?.vanSpawn?.y||2, MAP_DEF?.vanSpawn?.z||24), scene);
  camera.attachControl(canvas, true);
  camera.checkCollisions = true;
  camera.applyGravity = false; // handled by groundSnapTick
  camera.ellipsoid = new BABYLON.Vector3(0.35,0.9,0.35);
  camera.ellipsoidOffset = new BABYLON.Vector3(0,0.4,0);
  camera.minZ = 0.1; camera.inertia=0;
  camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

  // Atmosphere
  scene.clearColor = new BABYLON.Color4(0.01,0.01,0.02,1);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.0045;
  scene.fogColor = new BABYLON.Color3(0.02,0.03,0.05);
  hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  hemiLight.intensity = 0.06;

  // Load selected map -> set WORLD_BOUNDS (affects weather emitters)
  await loadSelectedMap();
  await loadMoon();
  WeatherAudio.init(scene);
  ensureWeatherEmitterNode(); updateEmitterToBounds();

  // Weather
  const r=Math.random();
  const w = r<0.40?'Clear' : r<0.70?'Rain' : r<0.88?'Snow' : 'Blood Moon';
  setWeather(w);

  // Items & inputs
  rebuildBelt();
  InputSystem.init();
  canvas.focus();

  // Avatar + van tools + ghost
  await ensurePlayerModel();
  await spawnToolsInVan();
  await spawnGhost();

  // Buttons
  document.getElementById('btn-use').onclick=useActiveItem;
  document.getElementById('btn-place').onclick=placeActiveItem;
  document.getElementById('btn-toss').onclick=tossActiveItem;
  document.getElementById('btn-lighter').onclick=toggleLighter;
  document.getElementById('btn-notebook').onclick=openNotebook;
  document.getElementById('btn-inspector').onclick=()=>{ try{ scene.debugLayer.isVisible()?scene.debugLayer.hide():scene.debugLayer.show({overlay:true}); }catch(e){} };

  // Main loop
  scene.onBeforeRenderObservable.add(()=>{
    const dt = engine.getDeltaTime()/1000;
    const input = InputSystem.snapshot();

    handleMovement(input, dt);
    applyLook(input.lookDelta);

    // Held lights follow camera (force off outdoors)
    const camForward = camera.getForwardRay().direction;
    if(held.light){
      held.light.position = camera.position.add(new BABYLON.Vector3(0,0.3,0));
      held.light.setDirectionToTarget(camera.position.add(camForward));
      if(!player.inside) held.light.intensity=0;
    }
    if(held.uvLight){
      held.uvLight.position = camera.position.add(new BABYLON.Vector3(0,0.3,0));
      held.uvLight.setDirectionToTarget(camera.position.add(camForward));
      if(!player.inside) held.uvLight.intensity=0;
    }
    if(held.lighter){
      held.lighter.position = camera.position.add(new BABYLON.Vector3(0,0.2,0));
      if(!player.inside) held.lighter.intensity=0;
    }

    // Spring arm
    springArmTick(dt);

    // Weather: lightning pacing
    if(weather.state==='Rain' || weather.state==='Blood Moon'){
      weather.lightningTimer += dt;
      if(weather.lightningTimer > weather.nextStrike){ lightningFlash(); scheduleNextLightning(); }
    }

    // Ghost
    ghostEventTick(dt);
    huntTick(dt);
    wanderGhost(dt);
    ghostVisibilityTick(dt);
    updateEventAudioGains();

    // Sanity
    sanityTick(dt);

    // HUD XYZ
    const xyz=document.getElementById('hud-xyz'); xyz.style.display='block';
    document.getElementById('hud-x').textContent = camera.position.x.toFixed(2);
    document.getElementById('hud-y').textContent = camera.position.y.toFixed(2);
    document.getElementById('hud-z').textContent = camera.position.z.toFixed(2);
  });

  engine.runRenderLoop(()=>scene.render());
  window.addEventListener('resize', ()=>engine.resize());
}
</script>

  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:#fff;opacity:.0;pointer-events:none;z-index:12000;transition:opacity 90ms ease-out;';
