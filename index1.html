<script>
/*** ==========================================================
    GLOBALS
    ========================================================== ***/
const canvas = document.getElementById('renderCanvas'); // NOTE: Babylon canvas
let engine, scene, camera, hemiLight; // NOTE: core Babylon refs
let houseRoot = null; // NOTE: root of map once loaded
let navMesh = null;   // NOTE: reserved for future
let moonMesh = null;  // NOTE: moon GLB

const player = { // NOTE: player config/state
  speedWalk: 1.1, // NOTE: walk speed m/s
  speedRun: 2.2,  // NOTE: run speed m/s

  room: 'Van',
  stepUpMax: 0.45 // NOTE: max ledge height we can auto-step
};

const weather = { // NOTE: weather state + particles
  state: 'Clear',
  rainPS: null,
  snowPS: null,
  lightningTimer:0,
  nextStrike: 6
};
function scheduleNextLightning(){ weather.lightningTimer=0; weather.nextStrike = 4 + Math.random()*10; } // NOTE: random lightning cadence

/*** ==========================================================
    TOAST (HUD message)
    ========================================================== ***/
function toast(msg, ms=1500){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', ms);
} // NOTE: small HUD message at top center

/*** ==========================================================
    WEATHER AUDIO (crossfaded ambience)
    ========================================================== ***/
const WeatherAudio = (()=>{
  let sceneRef=null, current=null, fading=false;
  const tracks={ clear:null, rain:null, snow:null, drone:null };

  function ensure(scene){
    if(sceneRef) return;
    sceneRef = scene;
    tracks.clear = new BABYLON.Sound("clear","./assets/audio/clearWeather.mp3",sceneRef,null,{ loop:true, autoplay:false, volume:0.45 });
    tracks.rain  = new BABYLON.Sound("rain","./assets/audio/rainstorm.mp3",sceneRef,null, { loop:true, autoplay:false, volume:0.55 });
    tracks.snow  = new BABYLON.Sound("snow","./assets/audio/ambient.mp3",sceneRef,null,    { loop:true, autoplay:false, volume:0.30 });
    tracks.drone = new BABYLON.Sound("drone","./assets/audio/ambient.mp3",sceneRef,null,   { loop:true, autoplay:false, volume:0.22 });
    document.addEventListener("visibilitychange", ()=>{
      if (document.hidden) return;
      try { BABYLON.Engine.audioEngine?.unlock?.(); } catch{}
      // NOTE: gently attempt resume but only if current state expects it
      switch(current){
        case 'Clear':      if(!tracks.clear.isPlaying) tracks.clear.play(); break;
        case 'Rain':       if(!tracks.rain.isPlaying) tracks.rain.play(); break;
        case 'Snow':       if(!tracks.snow.isPlaying) tracks.snow.play(); break;
        case 'Blood Moon': if(!tracks.rain.isPlaying) tracks.rain.play(); if(!tracks.drone.isPlaying) tracks.drone.play(); break;
      }
    });
  } // NOTE: prepares audio buffers; no autoplay for mobile compliance

  function fadeTo(target){
    if(!sceneRef) return;
    if(current===target || fading) return;
    fading=true;

    const want={
      clear: target==='Clear',
      rain:  (target==='Rain'||target==='Blood Moon'),
      snow:  target==='Snow',
      drone: target==='Blood Moon'
    };
    // start needed tracks at 0
    if (want.clear && !tracks.clear.isPlaying){ tracks.clear.setVolume(0); tracks.clear.play(); }
    if (want.rain  && !tracks.rain.isPlaying ){ tracks.rain.setVolume(0);  tracks.rain.play();  }
    if (want.snow  && !tracks.snow.isPlaying ){ tracks.snow.setVolume(0);  tracks.snow.play();  }
    if (want.drone && !tracks.drone.isPlaying){ tracks.drone.setVolume(0); tracks.drone.play(); }

    const tgt = { clear: want.clear?0.45:0, rain:want.rain?0.55:0, snow:want.snow?0.30:0, drone:want.drone?0.22:0 };
    const start={ clear:tracks.clear.getVolume(), rain:tracks.rain.getVolume(), snow:tracks.snow.getVolume(), drone:tracks.drone.getVolume() };

    let i=0, steps=16, stepMs=50; // NOTE: 800ms fade
    const tick=setInterval(()=>{
      i++;
      const a=i/steps; const ease=(x)=>x<.5?2*x*x:-1+(4-2*x)*x;
      ['clear','rain','snow','drone'].forEach(k=>{
        const v=start[k]+(tgt[k]-start[k])*ease(a);
        tracks[k].setVolume(v);
      });
      if(i>=steps){
        clearInterval(tick);
        ['clear','rain','snow','drone'].forEach(k=>{
          if(tgt[k]===0 && tracks[k].isPlaying) try{ tracks[k].stop(); }catch{}
        });
        current=target; fading=false;
      }
    }, stepMs);
  } // NOTE: crossfade implementation

  return { init:(s)=>ensure(s), set:(state)=>{ try{BABYLON.Engine.audioEngine?.unlock?.();}catch{} fadeTo(state);} };
})(); // NOTE: module for ambience
</script>

<script>
/*** ==========================================================
    ITEM SYSTEM (3-slot belt, separate lighter)
    ========================================================== ***/
const ALL_ITEMS=[
  {id:'flash',  name:'Flashlight'},
  {id:'uv',     name:'UV Light'},
  {id:'emf',    name:'EMF Reader'},
  {id:'spirit', name:'Spirit Box'},
  {id:'camera', name:'Photo Camera'},
  {id:'salt',   name:'Salt'},
  {id:'thermo', name:'Thermometer'},
  {id:'dots',   name:'DOTS Projector'},
  {id:'book',   name:'Ghost Writing Book'},
  {id:'cruci',  name:'Crucifix'},
  {id:'smudge', name:'Smudge Sticks'}
]; // NOTE: available items (expand as you like)

let belt = ['flash','emf','camera']; // NOTE: exactly 3 slots chosen
let activeSlot = 0; // NOTE: which belt slot is active (0..2)
let lighterOn = false; // NOTE: separate lighter toggle

// Runtime item nodes
const held = { flash:null, uv:null, dots:null, light:null, uvLight:null };

function itemById(id){ return ALL_ITEMS.find(x=>x.id===id); } // NOTE: helper

function rebuildBelt(){
  const el=document.getElementById('belt'); el.innerHTML='';
  belt.forEach((id,i)=>{
    const d=document.createElement('div'); d.className='slot'+(i===activeSlot?' active':'');
    const item=itemById(id);
    d.innerHTML = `<div class="label">${item?.name||id}</div>`;
    d.onclick=()=>{ activeSlot=i; rebuildBelt(); }; // NOTE: select slot
    d.oncontextmenu=(e)=>{ e.preventDefault(); cycleSlot(i); }; // NOTE: right-click cycles available items
    el.appendChild(d);
  });
} // NOTE: rebuilds 3-slot belt UI

function cycleSlot(i){
  const idx = ALL_ITEMS.findIndex(x=>x.id===belt[i]);
  const next = (idx+1)%ALL_ITEMS.length;
  // prevent duplicates in belt (optional)
  let j=next;
  for(let k=0;k<ALL_ITEMS.length;k++){
    const cand = ALL_ITEMS[j].id;
    if(!belt.includes(cand)){ belt[i]=cand; break; }
    j=(j+1)%ALL_ITEMS.length;
  }
  rebuildBelt();
} // NOTE: rotates slot to next available unique item

// ==== Item actions (use/place/toss/light) ====
function activeItem(){ return itemById(belt[activeSlot]); } // NOTE: current item data

function useActiveItem(){
  const it = activeItem(); if(!it){ toast('Empty slot'); return; }
  switch(it.id){
    case 'flash': toggleFlash(true); break;
    case 'uv': toggleUV(true); break;
    case 'emf': pingEMF(); break;
    case 'spirit': spiritBoxTalk(); break;
    case 'camera': takePhoto(); break;
    case 'salt': placeSalt(); break;
    case 'thermo': readTemp(); break;
    case 'dots': toggleDOTS(); break;
    case 'book': dropWritingBook(); break;
    case 'cruci': useCrucifix(); break;
    case 'smudge': burnSmudge(); break;
    default: toast('Use '+it.name); break;
  }
} // NOTE: routes primary use to item behavior

function placeActiveItem(){
  const it = activeItem(); if(!it){ toast('Empty slot'); return; }
  switch(it.id){
    case 'camera': placeTripodCamera(); break;
    case 'dots': placeDOTS(); break;
    case 'book': placeWritingBook(); break;
    case 'salt': placeSalt(); break;
    default: toast('Place '+it.name); break;
  }
} // NOTE: placing logic by item

function tossActiveItem(){ toast('Toss '+(activeItem()?.name||'')); } // NOTE: basic toss (expand with physics if you want)

function toggleLighter(){ lighterOn=!lighterOn; toast(lighterOn?'Lighter ON':'Lighter OFF'); } // NOTE: lighter separate control

// ---- Implementations (minimal but real) ----
function ensureHeldLight(){
  if(!held.light){
    held.light = new BABYLON.SpotLight("handFlash", new BABYLON.Vector3(0,1.6,0), new BABYLON.Vector3(0,0,1), Math.PI/6, 12, scene);
    held.light.intensity = 0; // off
    held.light.range = 18;
  }
  return held.light;
} // NOTE: creates player flashlight

function toggleFlash(explicit){
  const lamp = ensureHeldLight();
  lamp.intensity = lamp.intensity>0 ? 0 : 1.2;
  toast(lamp.intensity>0?'Flashlight ON':'Flashlight OFF');
} // NOTE: toggles flashlight intensity

function ensureHeldUV(){
  if(!held.uvLight){
    held.uvLight = new BABYLON.SpotLight("handUV", new BABYLON.Vector3(0,1.6,0), new BABYLON.Vector3(0,0,1), Math.PI/6, 12, scene);
    held.uvLight.diffuse = new BABYLON.Color3(0.6,0.4,1.0);
    held.uvLight.specular = new BABYLON.Color3(0.2,0.1,0.5);
    held.uvLight.intensity = 0;
  }
  return held.uvLight;
} // NOTE: creates player UV cone

function toggleUV(){
  const uv = ensureHeldUV();
  uv.intensity = uv.intensity>0 ? 0 : 1.0;
  toast(uv.intensity>0?'UV ON':'UV OFF');
} // NOTE: toggles UV cone

function pingEMF(){ toast('EMF: '+(ghost?.nearPlayer? 'Level 5!':'Level 2')); } // NOTE: cheap EMF demo; tied to ghost proximity

function spiritBoxTalk(){ if(ghost?.mode==='hunt') toast('Spirit Box: *static*'); else toast('Spirit Box: ...'); } // NOTE: stubbed “response” logic

function takePhoto(){

  const flash = document.createElement('div');
  flash.style.cssText='position:fixed;inset:0;background:#fff;opacity:.8;pointer-events:none;z-index:12001;';
  document.body.appendChild(flash);
  setTimeout(()=>flash.style.opacity='0',40);
  setTimeout(()=>flash.remove(),180);
  if(ghost && ghost.visible) toast('Ghost captured!');
} // NOTE: photo flash + feedback

function placeSalt(){ toast('Salt placed'); } // NOTE: minimal placement
function readTemp(){ toast('Temp: '+(ghost?.room===player.room?'3°C':'11°C')); } // NOTE: colder in ghost room
function toggleDOTS(){ toast('DOTS toggled'); } // NOTE: handheld toggle
function placeDOTS(){ toast('DOTS placed'); }
function dropWritingBook(){ toast('Book dropped'); }
function placeWritingBook(){ toast('Book placed'); }
function useCrucifix(){ if(ghost?.mode==='hunt'){ ghostAbortHunt('Crucifix'); } else toast('Crucifix readied'); }
function burnSmudge(){ if(ghost){ ghost.smudgedUntil = performance.now()+6000; toast('Smudge in effect (6s)'); } }
</script>

<script>

function openNotebook(){
  const box=document.getElementById('notebook-modal');
  const list=document.getElementById('evidence-list');
  list.innerHTML='';
  EVIDENCE.forEach(ev=>{
    const row=document.createElement('div'); row.className='ev-row';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=found[ev];
    cb.onchange=()=>{ found[ev]=cb.checked; updatePossible(); };
    const lbl=document.createElement('span'); lbl.textContent=ev;
    row.appendChild(cb); row.appendChild(lbl);
    list.appendChild(row);
  });
  updatePossible();
  box.style.display='block';
} // NOTE: creates the evidence checklist UI

function closeNotebook(){ document.getElementById('notebook-modal').style.display='none'; } // NOTE: hides notebook

function resetEvidence(){ for(const k of EVIDENCE) found[k]=false; updatePossible(); } // NOTE: clears all checks

function updatePossible(){
  // NOTE: treat Mimic special (adds Orbs decoy even if not checked)
  const result = GHOSTS.filter(g=>{
    const ghostEv = new Set(g.ev);
    if (g.rules?.mimicOrbs) ghostEv.add('Orbs'); // NOTE: Mimic can show orbs regardless
    // every checked must be in ghostEv
    return Object.entries(found).every(([e,has])=>!has || ghostEv.has(e));
  }).map(g=>g.name);
  document.getElementById('possible-ghosts').textContent = 'Possible: ' + (result.length? result.join(', ') : 'None');
} // NOTE: filters ghosts based on ticked evidence

<script>
/*** ==========================================================
    INPUT SYSTEM (WASD + Pointer Lock + Multi-touch)
    ========================================================== ***/
const InputSystem = (()=>{
  let move={x:0,z:0}, running=false, lookDelta={x:0,y:0};
  let pointerLocked=false;

  const keys = new Set();
  const keyMap = {
    'KeyW':'fw','KeyS':'bk','KeyA':'lt','KeyD':'rt',
    'ArrowUp':'fw','ArrowDown':'bk','ArrowLeft':'lt','ArrowRight':'rt',
    'ShiftLeft':'run','ShiftRight':'run',
    'Digit1':'slot0','Digit2':'slot1','Digit3':'slot2'
  };

  function recomputeMove(){
    const f=(keys.has('fw')?1:0)+(keys.has('bk')?-1:0);
    const r=(keys.has('rt')?1:0)+(keys.has('lt')?-1:0);
    move.z=f; move.x=r; running=keys.has('run');
  } // NOTE: translate held keys to movement vector

  function onKey(e,down){
    const tag=keyMap[e.code];
    if(!tag) return;
    e.preventDefault();
    if(down) keys.add(tag); else keys.delete(tag);
    if(tag.startsWith('slot') && down){
      const idx = parseInt(tag.replace('slot',''),10);
      if(idx>=0 && idx<3){ activeSlot=idx; rebuildBelt(); }
    }
    recomputeMove();
  } // NOTE: keyboard handler

  function bindPointerLock(){
    document.addEventListener('click', ()=>{ if(document.pointerLockElement!==canvas) canvas.requestPointerLock?.(); }, {capture:true});
    document.addEventListener('pointerlockchange', ()=>{ pointerLocked=(document.pointerLockElement===canvas); });
    document.addEventListener('mousemove', e=>{
      if(!pointerLocked) return;
      lookDelta.x += e.movementX||0;
      lookDelta.y += e.movementY||0;
    });
  } // NOTE: mouse look (relative) with pointer lock

  function bindTouchHalves(){
    const left=document.getElementById('touch-left'), right=document.getElementById('touch-right');
    let leftId=null, leftCenter=null, rightId=null, lastRight=null;
    const DEAD=14, MAX=110;
    const norm=(v)=> Math.abs(v)<DEAD?0:v;
    const clamp=(v,m)=> Math.max(-m, Math.min(m, v));

    left.addEventListener('touchstart', e=>{
      for(const t of e.changedTouches){ if(leftId===null){ leftId=t.identifier; leftCenter={x:t.clientX,y:t.clientY}; break; } }
      e.preventDefault();
    },{passive:false});
    right.addEventListener('touchstart', e=>{
      for(const t of e.changedTouches){ if(rightId===null){ rightId=t.identifier; lastRight={x:t.clientX,y:t.clientY}; break; } }
      e.preventDefault();
    },{passive:false});

    window.addEventListener('touchmove', e=>{
      for(const t of e.changedTouches){
        if(t.identifier===leftId && leftCenter){
          const dx=clamp(t.clientX-leftCenter.x,MAX), dy=clamp(t.clientY-leftCenter.y,MAX);
          const nx=norm(dx)/MAX, ny=norm(dy)/MAX;
          move.x = Math.sign(nx);
          move.z = ny<0 ? 1 : (ny>0 ? -1 : 0);
          e.preventDefault();
        } else if(t.identifier===rightId){
          if(lastRight){
            lookDelta.x += (t.clientX-lastRight.x);
            lookDelta.y += (t.clientY-lastRight.y);
          }
          lastRight={x:t.clientX,y:t.clientY};
          e.preventDefault();
        }
      }
    },{passive:false});

    window.addEventListener('touchend', e=>{
      for(const t of e.changedTouches){
        if(t.identifier===leftId){ leftId=null; leftCenter=null; move.x=0; move.z=0; }
        if(t.identifier===rightId){ rightId=null; lastRight=null; }
      }
      e.preventDefault();
    },{passive:false});
  } // NOTE: two-thumb control regions

  return {
    init(){
      document.addEventListener('keydown', e=>onKey(e,true), {passive:false});
      document.addEventListener('keyup',   e=>onKey(e,false), {passive:false});
      bindPointerLock();
      bindTouchHalves();
    },
    snapshot(){
      const out={ moveVec:{...move}, running, lookDelta:{...lookDelta} };
      lookDelta.x=0; lookDelta.y=0;
      return out;
    }
  };
})(); // NOTE: input module
</script>

<script>
/*** ==========================================================
    MOVEMENT, LOOK & STEP-UP
    ========================================================== ***/
function handleMovement(input, dt){
  if(!camera) return;
  const speed = input.running ? player.speedRun : player.speedWalk;
  const fwd = camera.getForwardRay().direction.clone(); fwd.y=0; fwd.normalize();
  const right = BABYLON.Vector3.Cross(fwd, BABYLON.Axis.Y).scale(-1);
  const desired = fwd.scale(input.moveVec.z).add(right.scale(input.moveVec.x));

  if (desired.lengthSquared()>0){
    const v = desired.normalize().scale(speed*dt);
    // tentative next
    const next = camera.position.add(v);
    // step-up check: ray from chest forward, then down to see if small ledge
    const probe = next.add(new BABYLON.Vector3(0, player.stepUpMax, 0));
    const downRay = new BABYLON.Ray(probe, new BABYLON.Vector3(0,-1,0), player.stepUpMax+0.6);
    const hit = scene.pickWithRay(downRay, m=>m && m.isPickable!==false);
    if(hit && hit.pickedPoint){
      // allow stepping if height difference <= stepUpMax
      const deltaY = hit.pickedPoint.y + 1.7 - camera.position.y;
      if(deltaY<=player.stepUpMax) camera.position = new BABYLON.Vector3(next.x, hit.pickedPoint.y+1.7, next.z);
      else camera.position = next;
    } else {
      camera.position = next;
    }
  }
} // NOTE: free-walk + small step-up ledge handling

function applyLook(lookDelta){
  if(!camera) return;
  const sens = 0.0026;
  camera.rotation.y += lookDelta.x * sens;
  const invertY = 1; // NOTE: up = up (as requested)
  const minPitch=-Math.PI/2+0.15, maxPitch=Math.PI/2-0.15;
  const pitch=(camera.rotation.x||0)+(invertY * lookDelta.y * sens * 0.85);
  camera.rotation.x=Math.min(maxPitch, Math.max(minPitch, pitch));
} // NOTE: mouse/touch look, with correct “up = up”
</script>

<script>
/*** ==========================================================
    WEATHER RENDERING + MOON
    ========================================================== ***/
let __rainTex = null;
function makeRainTexture(){
  if(__rainTex) return __rainTex;
  const w=2, h=32;
  const dt = new BABYLON.DynamicTexture("rainTex",{width:w,height:h},scene,false);
  const ctx=dt.getContext(); ctx.clearRect(0,0,w,h);
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0.00,"rgba(255,255,255,0.00)");
  g.addColorStop(0.25,"rgba(255,255,255,0.35)");
  g.addColorStop(0.55,"rgba(255,255,255,0.80)");
  g.addColorStop(0.85,"rgba(255,255,255,0.35)");
  g.addColorStop(1.00,"rgba(255,255,255,0.00)");
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h); dt.update(false);
  __rainTex=dt; return dt;
} // NOTE: procedural streak texture (no external GIF)

function ensureRain(){
  if(weather.rainPS) return weather.rainPS;
  const ps=new BABYLON.ParticleSystem("rain", 3200, scene);
  ps.particleTexture=makeRainTexture();
  ps.minEmitBox=new BABYLON.Vector3(-70, 36, -70);
  ps.maxEmitBox=new BABYLON.Vector3( 70, 36,  70); // NOTE: lower ceiling than before
  ps.minSize=0.9; ps.maxSize=1.3;
  ps.minLifeTime=0.7; ps.maxLifeTime=1.0;
  ps.direction1=new BABYLON.Vector3(-0.15,-1.5, 0.1);
  ps.direction2=new BABYLON.Vector3( 0.15,-1.4,-0.1);
  ps.gravity=new BABYLON.Vector3(0,-9.8,0);
  ps.emitRate=1400;
  ps.updateSpeed=0.018;
  ps.color1=new BABYLON.Color4(0.95,0.98,1.00,0.85);
  ps.color2=new BABYLON.Color4(0.95,0.98,1.00,0.55);
  ps.colorDead=new BABYLON.Color4(1,1,1,0.0);
  ps.disposeOnStop=false;
  weather.rainPS=ps; return ps;
} // NOTE: rain emitter tuned lower & thinner

function ensureSnow(){
  if(weather.snowPS) return weather.snowPS;
  const ps=new BABYLON.ParticleSystem("snow", 2200, scene);
  const snowTex=new BABYLON.DynamicTexture("snowTex",{width:8,height:8},scene,false);
  const ctx=snowTex.getContext(); ctx.clearRect(0,0,8,8);
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(4,4,3,0,Math.PI*2); ctx.fill(); snowTex.update(false);
  ps.particleTexture=snowTex;
  ps.minEmitBox=new BABYLON.Vector3(-60, 28, -60);
  ps.maxEmitBox=new BABYLON.Vector3( 60, 28,  60); // NOTE: lower snow height
  ps.minSize=0.06; ps.maxSize=0.13;
  ps.minLifeTime=2.0; ps.maxLifeTime=3.2;
  ps.emitRate=900;
  ps.direction1=new BABYLON.Vector3(-0.12,-0.7, 0.08);
  ps.direction2=new BABYLON.Vector3( 0.12,-0.9,-0.08);
  ps.gravity=new BABYLON.Vector3(0,-0.25,0);
  ps.updateSpeed=0.02;
  ps.color1=new BABYLON.Color4(1,1,1,0.95);
  ps.color2=new BABYLON.Color4(1,1,1,0.70);
  ps.disposeOnStop=false;
  weather.snowPS=ps; return ps;
} // NOTE: snow tuned for gentler fall & lower ceiling

function setWeather(state){
  weather.state=state;
  document.getElementById('hud-weather').textContent=state;
  WeatherAudio.set(state);

  if(weather.rainPS) weather.rainPS.stop();
  if(weather.snowPS) weather.snowPS.stop();

  if(state==='Clear'){ /* palette unchanged */ }
  if(state==='Snow'){ ensureSnow().start(); }
  if(state==='Rain'){ ensureRain().start(); scheduleNextLightning(); }
  if(state==='Blood Moon'){ ensureRain().start(); scheduleNextLightning(); }

} // NOTE: switches particle systems and audio theme

async function loadMoon(){
  try{
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/sky/", "moon.glb", scene);
    moonMesh = r.meshes.find(m=>m.name && m.name!=="__root__") || r.meshes[0];
    if(moonMesh){
      moonMesh.name="MoonMesh";
      moonMesh.isPickable=false; moonMesh.applyFog=false; moonMesh.renderingGroupId=1;
      const mat = moonMesh.material || new BABYLON.StandardMaterial("moonMat", scene);
      mat.disableLighting=true; mat.emissiveColor=new BABYLON.Color3(1,1,1);
      moonMesh.material=mat;
      moonMesh.position.copyFromFloats(0, 280, 320); // NOTE: in front of skybox
      scene.onBeforeRenderObservable.add(()=>{
        const t=performance.now()*0.00002;
        moonMesh.position.x=Math.cos(t)*320;
        moonMesh.position.z=Math.sin(t)*320;
        moonMesh.position.y=270+Math.sin(t*1.7)*8;
      });
    }
  }catch(e){ console.warn('Moon load failed', e); }
} // NOTE: loads & animates moon in front of skybox
</script>

<script>
/*** ==========================================================
    MAP LOADING + GLB VIEWER + MARKER TOOL
    ========================================================== ***/
async function loadMap(){
  // NOTE: your Abandoned_House.glb; marks meshes pickable/collidable
  try{
    const res = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/map/", "Abandoned_House.glb", scene);
    houseRoot = res.meshes[0] || res.meshes.find(m=>m.name==="__root__") || null;
    res.meshes.forEach(m=>{ m.checkCollisions=true; m.isPickable=true; m.receiveShadows=true; });
  }catch(e){
    console.warn('Map load failed; building ground fallback', e);
    const g=BABYLON.MeshBuilder.CreateGround("fallback",{width:180,height:180},scene); g.checkCollisions=true;
  }
} // NOTE: loads main map

// --- GLB viewer: pick/drag files into scene ---
document.getElementById('file-input').addEventListener('change', async (e)=>{
  const f=e.target.files?.[0]; if(!f) return;
  try{
    const blobUrl = URL.createObjectURL(f);
    await BABYLON.SceneLoader.AppendAsync("", blobUrl, scene); // NOTE: append to current scene
    toast('Imported '+f.name, 1600);
  }catch(err){ console.error(err); toast('Import failed'); }
}); // NOTE: quick GLB loader append

// Drag-drop import
window.addEventListener('dragover', e=>{ e.preventDefault(); });
window.addEventListener('drop', async (e)=>{
  e.preventDefault();
  if(!e.dataTransfer?.files?.length) return;
  const f=e.dataTransfer.files[0];
  try{
    const url=URL.createObjectURL(f);
    await BABYLON.SceneLoader.AppendAsync("", url, scene);
    toast('Imported '+f.name, 1600);
  }catch(err){ console.error(err); toast('Import failed'); }
}); // NOTE: drop files to import

// --- Marker Tool (polygon with fill & save JSON) ---
const MarkerTool = (()=>{
  let enabled=false, interior=true, points=[]; // NOTE: interior/exterior fill choice
  let mesh=null, mat=null;

  function toggle(){ enabled=!enabled; toast('Markers '+(enabled?'enabled':'disabled')); }
  function toggleFill(){ interior=!interior; document.getElementById('btn-marker-fill').textContent = 'Fill: ' + (interior?'Interior':'Exterior'); redraw(); }
  function clear(){ points.length=0; redraw(); }

  function redraw(){
    if(mesh){ mesh.dispose(); mesh=null; }
    if(points.length<3) return;
    const shape = points.map(p=> new BABYLON.Vector3(p.x, p.y, p.z));
    // Triangulate in XZ plane
    const path2D = points.map(p=> new BABYLON.Vector2(p.x, p.z));
    const tri = BABYLON.PolygonMeshBuilder.BuildFromPoints("poly", path2D, scene);
    mesh = tri || BABYLON.MeshBuilder.CreatePolygon("poly",{shape: path2D, depth:0.02}, scene);
    if(!mat){
      mat = new BABYLON.StandardMaterial("polyMat", scene);
      mat.diffuseColor = interior? new BABYLON.Color3(0,0.3,0.3): new BABYLON.Color3(0.3,0,0.3);
      mat.alpha = 0.35;
    }else{
      mat.diffuseColor = interior? new BABYLON.Color3(0,0.3,0.3): new BABYLON.Color3(0.3,0,0.3);
    }
    mesh.material = mat;
    // lift slightly
    const y = shape[0].y + 0.05;
    mesh.position.y = y;
  }

  function save(){
    const data = { interior, points: points.map(p=>({x:p.x,y:p.y,z:p.z})) };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'markers.json';
    a.click();
  }

  function pickPoint(){
    const ray = scene.createPickingRay(scene.pointerX, scene.pointerY, BABYLON.Matrix.Identity(), camera);
    const hit = scene.pickWithRay(ray, m=>m && m.isPickable!==false);
    if(hit?.pickedPoint){
      const p = hit.pickedPoint.clone();
      points.push({x:p.x, y:p.y, z:p.z});
      redraw();
    }
  }

  // click to add point
  scene?.onPointerObservable?.add((pi)=>{
    if(!enabled) return;
    if(pi.type===BABYLON.PointerEventTypes.POINTERDOWN){
      pickPoint();
    }
  });

  return { toggle, toggleFill, save, clear };
})(); // NOTE: polygon marker with save

// Toolbar wiring
document.getElementById('btn-marker').onclick=()=>MarkerTool.toggle();
document.getElementById('btn-marker-fill').onclick=()=>MarkerTool.toggleFill();
document.getElementById('btn-marker-save').onclick=()=>MarkerTool.save();
document.getElementById('btn-marker-clear').onclick=()=>MarkerTool.clear();

// Reload map shortcut
document.getElementById('btn-load-map').onclick=async ()=>{ await loadMap(); toast('Map reloaded'); };
</script>

<script>
/*** ==========================================================
    GHOST SYSTEM (spawn, flicker, wander, hunt)
    ========================================================== ***/
const ghost = {
  mesh: null,
  type: null,
  roomCenter: null,
  wanderRadius: 8,
  canChangeRoom: true,
  mode: 'idle', // idle | event | hunt
  visible: false,
  flicker: null,
  smudgedUntil: 0,
  nearPlayer: false
}; // NOTE: central ghost state

function randomPointInHouse(){
  if(!houseRoot){
    return new BABYLON.Vector3(46.16, 1.7, -105.52);
  }
  const bb = houseRoot.getHierarchyBoundingVectors(true);
  // margin away from walls
  const x = BABYLON.Scalar.Lerp(bb.min.x+3, bb.max.x-3, Math.random());
  const z = BABYLON.Scalar.Lerp(bb.min.z+3, bb.max.z-3, Math.random());
  // drop to floor
  const ray = new BABYLON.Ray(new BABYLON.Vector3(x, (bb.max.y||10)+4, z), new BABYLON.Vector3(0,-1,0), 40);
  const hit = scene.pickWithRay(ray, m=>m && m.isPickable!==false);
  const y = hit?.pickedPoint ? hit.pickedPoint.y + 0.05 : 1.7;
  return new BABYLON.Vector3(x,y,z);
} // NOTE: finds a plausible floor point inside house bounds

function makeFlickerController(mesh){
  let t=0, on=false, next=0, solid=0.85;
  return {
    setSolid(v){ solid=v; },
    reset(){ t=0; on=false; next=0; },
    tick(dt, mode, profile){
      t+=dt;
      if(mode==='idle'){ apply(0); return; }
      if(t>=next){
        const fast = 0.05 + Math.random()*0.07; // 50-120ms on
        const slow = 0.28 + Math.random()*0.22; // 280-500ms off
        let onDur, offDur;
        if(profile==='phantom'){ onDur = fast*0.6; offDur = 0.9 + Math.random()*0.6; }
        else if(profile==='oni'){ onDur = 0.30 + Math.random()*0.25; offDur = (Math.random()<0.5)?0.7:1.0; }
        else { onDur = fast; offDur = slow; }
        on=true; next=t+onDur; apply(solid);
        setTimeout(()=>{ on=false; apply(0); }, onDur*1000);
        next += offDur;
      } else apply(on?solid:0);
      function apply(a){
        if(!mesh) return;
        if(mesh.material && 'alpha' in mesh.material) mesh.material.alpha=a; else mesh.visibility=a;
      }
    }
  };
} // NOTE: parametric flicker matching Phantom/Oni variants

async function spawnGhost(){
  // Pick a ghost type consistent with evidence dynamics later (random for now)
  const profile = GHOSTS[(Math.random()*GHOSTS.length)|0];
  ghost.type = profile.name;
  ghost.wanderRadius = profile.rules?.wander ?? 8;
  ghost.canChangeRoom = profile.rules?.roomChange !== false;

  // Spawn mesh (GLB if available else translucent box fallback)
  try{
    const list = ["ghost1.glb","ghost2.glb","ghost3.glb","ghost4.glb","ghost5.glb"];
    const pick = list[(Math.random()*list.length)|0];
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/ghosts/", pick, scene);
    ghost.mesh = r.meshes.find(m=>m.name && m.name!=="__root__") || r.meshes[0];
    if(ghost.mesh){
      ghost.mesh.isPickable=false; ghost.mesh.checkCollisions=false;
      const bb = ghost.mesh.getHierarchyBoundingVectors(true);
      const height=bb.max.y-bb.min.y; const s=1.9/Math.max(0.8,height||1);
      ghost.mesh.scaling.set(s,s,s);
    }
  }catch(e){ /* fallback below */ }

  if(!ghost.mesh){
    const m=BABYLON.MeshBuilder.CreateBox("ghostFallback",{size:1.2},scene);
    const mat=new BABYLON.StandardMaterial("ghostMat",scene); mat.alpha=0; mat.emissiveColor=new BABYLON.Color3(0.6,0.7,1.0);
    m.material=mat; m.isPickable=false; ghost.mesh=m;
  }

  ghost.roomCenter = randomPointInHouse();
  ghost.mesh.position.copyFrom(ghost.roomCenter);
  ghost.visible=false;

  // Flicker controller
  ghost.flicker = makeFlickerController(ghost.mesh);
  if(ghost.type==='Phantom') ghost.flicker.setSolid(0.45);
  if(ghost.type==='Oni')     ghost.flicker.setSolid(0.95);
} // NOTE: creates ghost with per-type wander rules and flicker profile

function wanderGhost(dt){
  if(!ghost.mesh) return;
  if(ghost.mode!=='idle' && ghost.mode!=='event') return; // NOTE: no wander while hunting (or minor during event)
  if(!ghost._dir || Math.random()<0.02){
    const ang=Math.random()*Math.PI*2;
    const spd=0.28; // m/s ghost idle walk
    ghost._dir = new BABYLON.Vector3(Math.cos(ang)*spd,0,Math.sin(ang)*spd);
  }
  // Stay within wander radius of roomCenter (Goryo 4m, Shade 6m, default 8m etc.)
  const step = ghost._dir.scale(dt);
  const candidate = ghost.mesh.position.add(step);
  const center = ghost.roomCenter;
  if(candidate.subtract(center).length() <= ghost.wanderRadius){
    ghost.mesh.position = candidate;
  }else{
    ghost._dir = null;
  }
} // NOTE: constrained wandering

function ghostEventTick(dt){
  // NOTE: random short “event” flashes when not hunting
  if(!ghost._eventTimer){ ghost._eventTimer=0; ghost._nextEvent= 8+Math.random()*12; }
  ghost._eventTimer += dt;
  if(ghost.mode!=='hunt' && ghost._eventTimer>ghost._nextEvent){
    ghost.mode='event';
    ghost._eventLeft = 3.0 + Math.random()*1.5;
    ghost._eventTimer=0; ghost._nextEvent=10+Math.random()*14;
  }
  if(ghost.mode==='event'){
    ghost._eventLeft -= dt;
    if(ghost._eventLeft<=0) ghost.mode='idle';
  }
} // NOTE: schedules small events

function huntTick(dt){
  if(!ghost._huntTimer){ ghost._huntTimer=0; ghost._nextHunt=50+Math.random()*40; }
  if(ghost.mode==='hunt'){
    // smudge suppression
    if(performance.now() < (ghost.smudgedUntil||0)) return;
    // chase player: move toward camera
    const dir = camera.position.subtract(ghost.mesh.position); dir.y=0;
    const dist = dir.length();
    ghost.nearPlayer = dist<3.0;
    if(dist>0.02){
      dir.normalize();
      const spd = (ghost.type==='Revenant' && player.sanity<50) ? 2.8 : 1.4; // NOTE: faster if Rev style case
      ghost.mesh.position.addInPlace(dir.scale(spd*dt));
    }
    // end hunt after duration
    ghost._huntLeft -= dt;
    if(ghost._huntLeft<=0){ ghost.mode='idle'; document.getElementById('hud-hunt').textContent='Calm'; }
  } else {
    ghost._huntTimer += dt;
    if(ghost._huntTimer>ghost._nextHunt){
      ghost._huntTimer=0; ghost._nextHunt=55+Math.random()*45;
      if(player.sanity<65){ startHunt(); } // NOTE: simple sanity gate
    }
  }
} // NOTE: handles starting/ending hunts

function startHunt(){
  ghost.mode='hunt'; ghost._huntLeft = 8 + Math.random()*5;
  document.getElementById('hud-hunt').textContent='Hunting';
  toast('Hunt started!');
} // NOTE: begins hunt

function ghostAbortHunt(reason){
  ghost.mode='idle'; document.getElementById('hud-hunt').textContent='Calm';
  toast('Hunt stopped by '+reason);
} // NOTE: ends hunt due to crucifix/smudge etc.

function ghostVisibilityTick(dt){
  const profile = (ghost.type==='Phantom')?'phantom':(ghost.type==='Oni')?'oni':'default';
  const mode = ghost.mode;
  ghost.flicker?.tick(dt, mode, profile);
  ghost.visible = (ghost.mesh.material?.alpha ?? ghost.mesh.visibility) > 0.05;
} // NOTE: drives flicker per state
</script>

<script>
/*** ==========================================================
    BOOT, WEATHER PICK & MAIN LOOP
    ========================================================== ***/
async function boot(){
  engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true, disableWebGL2Support:false }); // NOTE: engine
  scene  = new BABYLON.Scene(engine); // NOTE: scene
  scene.collisionsEnabled = true;     // NOTE: collisions on
  scene.gravity = new BABYLON.Vector3(0,-0.5,0); // NOTE: gravity

  camera = new BABYLON.UniversalCamera("playerCam", new BABYLON.Vector3(46.16, 2.0, -105.52), scene); // NOTE: spawn near your coords
  camera.attachControl(canvas, true);
  camera.checkCollisions = true;
  camera.applyGravity = true;
  camera.ellipsoid = new BABYLON.Vector3(0.35,0.9,0.35);
  camera.ellipsoidOffset = new BABYLON.Vector3(0,0.4,0);
  camera.minZ = 0.1; camera.inertia=0;
  camera.inputs.removeByType("FreeCameraKeyboardMoveInput"); // NOTE: we handle keyboard

  // Atmosphere
  scene.clearColor = new BABYLON.Color4(0.01,0.01,0.02,1);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.0045;
  scene.fogColor = new BABYLON.Color3(0.02,0.03,0.05);
  hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  hemiLight.intensity = 0.06;

  await loadMap();  // NOTE: load house GLB
  await loadMoon(); // NOTE: load moon

  // Weather pick AFTER scene exists
  WeatherAudio.init(scene); // NOTE: set up audio engine
  const r=Math.random();
  const w = r<0.40?'Clear' : r<0.70?'Rain' : r<0.88?'Snow' : 'Blood Moon';
  setWeather(w);

  // Items & inputs
  rebuildBelt(); // NOTE: build belt UI
  InputSystem.init(); // NOTE: keyboard + pointer lock + touch
  canvas.focus(); // NOTE: grab focus so WASD works immediately

  // Ghost spawn
  await spawnGhost();

  // Buttons
  document.getElementById('btn-use').onclick=useActiveItem;
  document.getElementById('btn-place').onclick=placeActiveItem;
  document.getElementById('btn-toss').onclick=tossActiveItem;
  document.getElementById('btn-lighter').onclick=toggleLighter;
  document.getElementById('btn-notebook').onclick=openNotebook;
  document.getElementById('btn-inspector').onclick=()=>{ try{ scene.debugLayer.isVisible()?scene.debugLayer.hide():scene.debugLayer.show({overlay:true}); }catch(e){} };

  // Title “reload map” button rebind (already wired; noop if pressed later)

  // Main loop
  scene.onBeforeRenderObservable.add(()=>{
    const dt = engine.getDeltaTime()/1000;
    const input = InputSystem.snapshot();

    // movement + look
    handleMovement(input, dt);
    applyLook(input.lookDelta);

    // attach held lights to camera
    if(held.light){ held.light.position = camera.position.add(new BABYLON.Vector3(0,0.3,0)); held.light.setDirectionToTarget(camera.position.add(camera.getForwardRay().direction)); }
    if(held.uvLight){ held.uvLight.position = camera.position.add(new BABYLON.Vector3(0,0.3,0)); held.uvLight.setDirectionToTarget(camera.position.add(camera.getForwardRay().direction)); }

    // weather loop: lightning pacing
    if(weather.state==='Rain' || weather.state==='Blood Moon'){
      weather.lightningTimer += dt;
      if(weather.lightningTimer > weather.nextStrike){ lightningFlash(); scheduleNextLightning(); }
      if(weather.rainPS){ weather.rainPS.emitRate = 1400; }
    }
    if(weather.snowPS){ weather.snowPS.emitRate = 900; }

    // ghost AI
    ghostEventTick(dt);
    huntTick(dt);
    wanderGhost(dt);
    ghostVisibilityTick(dt);

    // HUD XYZ
    const xyz=document.getElementById('hud-xyz'); xyz.style.display='block';
    document.getElementById('hud-x').    document.getElementById('hud-x').textContent = camera.position.x.toFixed(2);
    document.getElementById('hud-y').textContent = camera.position.y.toFixed(2);
    document.getElementById('hud-z').textContent = camera.position.z.toFixed(2);
  });

  // render + resize hooks
  engine.runRenderLoop(()=>scene.render()); // NOTE: drive Babylon render loop
  window.addEventListener('resize', ()=>engine.resize()); // NOTE: keep canvas sized
} // NOTE: end boot()

/*** ==========================================================
    LIGHTNING FLASH (quick white pop)
    ========================================================== ***/
function lightningFlash(){
  // NOTE: ephemeral overlay so we don't need a permanent DOM node
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:#fff;opacity:.0;pointer-events:none;z-index:12000;transition:opacity 90ms ease-out;';
  document.body.appendChild(d);
  // pop to ~0.55 then fade
  requestAnimationFrame(()=>{ d.style.opacity='0.55'; });
  setTimeout(()=>{ d.style.opacity='0'; }, 110);
  setTimeout(()=>{ d.remove(); }, 260);
} // NOTE: used by weather lightning pacing

/*** ==========================================================
    START FLOW (title → game)
    ========================================================== ***/
let __started=false;
async function safeStart(){
  if(__started) return;                 // NOTE: guard against double start
  __started = true;
  document.getElementById('title-screen').style.display='none'; // NOTE: hide title
  await boot();                         // NOTE: build scene, load map/moon/ghost, wire systems

  // small UX: try to grab focus & unlock audio context once we have a gesture
  try{ canvas.focus(); }catch{}
  try{ BABYLON.Engine.audioEngine?.unlock?.(); }catch{}
} // NOTE: user gesture entry point (button press / Enter)

document.getElementById('start-button').addEventListener('click', ()=>safeStart()); // NOTE: Start button
document.addEventListener('keydown', (e)=>{ if(!__started && (e.key==='Enter'||e.code==='Space')){ e.preventDefault(); safeStart(); } }); // NOTE: Enter/Space from title
</script>
