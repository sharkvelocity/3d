<script>
/*** ==========================================================
    UTILITIES
    ========================================================== ***/
function toast(msg, ms=1500){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', ms);
}

function pointInPolyXZ(p, poly){
  let inside = false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x, zi=poly[i].z, xj=poly[j].x, zj=poly[j].z;
    const intersect = ((zi>p.z)!==(zj>p.z)) && (p.x < (xj-xi)*(p.z-zi)/(((zj-zi)||1e-9)) + xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
</script>

<script>
/*** ==========================================================
    SIMPLE AUDIO HELPERS
    ========================================================== ***/
const WeatherAudio = (()=>{
  let sceneRef=null, current=null;
  const tracks={ clear:null, rain:null, snow:null, drone:null };

  function ensure(scene){
    if(sceneRef) return;
    sceneRef = scene;
    tracks.clear = new BABYLON.Sound("clear","./assets/audio/clearWeather.mp3",sceneRef,null,{ loop:true, autoplay:false, volume:0.40 });
    tracks.rain  = new BABYLON.Sound("rain","./assets/audio/rainstorm.mp3",sceneRef,null, { loop:true, autoplay:false, volume:0.55 });
    tracks.snow  = new BABYLON.Sound("snow","./assets/audio/ambient.mp3",sceneRef,null,    { loop:true, autoplay:false, volume:0.28 });
    tracks.drone = new BABYLON.Sound("drone","./assets/audio/ambient.mp3",sceneRef,null,   { loop:true, autoplay:false, volume:0.18 });
  }

  function fadeTo(target){
    if(!sceneRef) return;
    if(current===target) return;

    const want={ clear:target==='Clear', rain:(target==='Rain'||target==='Blood Moon'), snow:target==='Snow', drone:target==='Blood Moon' };
    for(const k of Object.keys(tracks)){
      const snd = tracks[k];
      if(!snd) continue;
      const tgt = (k==='clear'&&want.clear)?0.40:
                  (k==='rain' &&want.rain )?0.55:
                  (k==='snow' &&want.snow )?0.28:
                  (k==='drone'&&want.drone)?0.18:0.0;
      if(tgt>0){ if(!snd.isPlaying) { try{ snd.setVolume(0); snd.play(); }catch{} } }
      const start = snd.getVolume();
      let i=0, steps=18, stepMs=40;
      const id=setInterval(()=>{
        i++; const a=i/steps; const ease=(x)=>x<.5?2*x*x:-1+(4-2*x)*x;
        snd.setVolume(start + (tgt-start)*ease(a));
        if(i>=steps){ clearInterval(id); if(tgt===0 && snd.isPlaying) try{ snd.stop(); }catch{} }
      }, stepMs);
    }
    current=target;
  }
  return { init:(s)=>ensure(s), set:(state)=>{ try{BABYLON.Engine.audioEngine?.unlock?.();}catch{} fadeTo(state);} };
})();
</script>

<script>
/*** ==========================================================
    BELT UI + HELD LIGHTS
    ========================================================== ***/
function itemById(id){ return ALL_ITEMS.find(x=>x.id===id); }

function rebuildBelt(){
  const el=document.getElementById('belt'); el.innerHTML='';
  belt.forEach((id,i)=>{
    const d=document.createElement('div'); d.className='slot'+(i===activeSlot?' active':'');
    const item=itemById(id);
    d.innerHTML = `<div class="label">${item?.name||id}</div>`;
    d.onclick=()=>{ activeSlot=i; rebuildBelt(); };
    d.oncontextmenu=(e)=>{ e.preventDefault(); cycleSlot(i); };
    el.appendChild(d);
  });
}
function cycleSlot(i){
  const idx = ALL_ITEMS.findIndex(x=>x.id===belt[i]);
  let j=(idx+1)%ALL_ITEMS.length;
  for(let k=0;k<ALL_ITEMS.length;k++){
    const cand = ALL_ITEMS[j].id;
    if(!belt.includes(cand)){ belt[i]=cand; break; }
    j=(j+1)%ALL_ITEMS.length;
  }
  rebuildBelt();
}
function activeItem(){ return itemById(belt[activeSlot]); }

// Held lights
function ensureHeldFlash(){
  if(!held.light){
    held.light = new BABYLON.SpotLight("handFlash", new BABYLON.Vector3(0,1.6,0), new BABYLON.Vector3(0,0,1), Math.PI/6, 12, scene);
    held.light.intensity = 0; held.light.range = 28;
  }
  return held.light;
}
function ensureHeldUV(){
  if(!held.uvLight){
    held.uvLight = new BABYLON.SpotLight("handUV", new BABYLON.Vector3(0,1.6,0), new BABYLON.Vector3(0,0,1), Math.PI/7.5, 10, scene);
    held.uvLight.diffuse = new BABYLON.Color3(0.7,0.35,1.0);
    held.uvLight.specular = new BABYLON.Color3(0.25,0.15,0.5);
    held.uvLight.intensity = 0; held.uvLight.range = 18;
  }
  return held.uvLight;
}
function ensureHeldLighter(){
  if(!held.lighter){
    held.lighter = new BABYLON.PointLight("handLighter", new BABYLON.Vector3(0,1.6,0), scene);
    held.lighter.intensity = 0; held.lighter.range = 6;
  }
  return held.lighter;
}
function toggleFlash(){ const l=ensureHeldFlash(); l.intensity = (l.intensity>0?0:2.2); toast(l.intensity>0?'Flashlight ON':'Flashlight OFF'); }
function toggleUV(){ const u=ensureHeldUV(); u.intensity = (u.intensity>0?0:1.3); UV_ACTIVE = (u.intensity>0); _refreshUVFootprintMaterials(); toast(u.intensity>0?'UV ON':'UV OFF'); }
function toggleLighter(){ lighterOn=!lighterOn; const li=ensureHeldLighter(); li.intensity = (lighterOn) ? 0.85 : 0; toast(lighterOn?'Lighter ON':'Lighter OFF'); }

// ===== SALT System: place salt lines and disturb logic =====
const SALT_LINES = []; // array of {mesh, a:Vector3, b:Vector3, disturbed:false}
let saltCharges = 6; // basic total lines available (tune as desired)

function _aimPointOnGround(maxDist=3.5){
  const origin = camera.position.clone();
  const dir = camera.getForwardRay().direction.clone();
  const ray = new BABYLON.Ray(origin, dir, maxDist);
  const pick = scene.pickWithRay(ray, m=>m && m.isPickable!==false);
  if(pick && pick.hit){
    return pick.pickedPoint;
  }
  const ahead = origin.add(dir.scale(Math.min(maxDist, 3.5)));
  ahead.y = 0.02;
  return ahead;
}

function placeSalt(){
  if(saltCharges<=0){ toast('Out of salt'); return; }
  const center = _aimPointOnGround(3.8);
  const yaw = Math.atan2(camera.getForwardRay().direction.z, camera.getForwardRay().direction.x);
  const half = 0.6;
  const a = new BABYLON.Vector3(center.x - Math.cos(yaw)*half, 0.01, center.z - Math.sin(yaw)*half);
  const b = new BABYLON.Vector3(center.x + Math.cos(yaw)*half, 0.01, center.z + Math.sin(yaw)*half);
  const path = [a, b];
  const mesh = BABYLON.MeshBuilder.CreateTube("salt_line", {path, radius:0.05, tessellation:4}, scene);
  const mat = new BABYLON.StandardMaterial("salt_mat", scene);
  mat.diffuseColor = new BABYLON.Color3(0.95,0.95,0.95);
  mat.specularColor = new BABYLON.Color3(0.2,0.2,0.2);
  mat.emissiveColor = new BABYLON.Color3(0.05,0.05,0.05);
  mat.alpha = 0.9;
  mesh.material = mat;
  mesh.layerMask = LAYERS.INTERIOR | LAYERS.EXTERIOR;
  SALT_LINES.push({mesh, a, b, disturbed:false, mat});
  saltCharges--;
  toast('Salt line placed ('+saltCharges+' left)');
}

function _pointToSegmentDistance(p, a, b){
  const ap = p.subtract(a);
  const ab = b.subtract(a);
  const ab2 = ab.x*ab.x + ab.z*ab.z + 1e-9;
  const t = Math.max(0, Math.min(1, (ap.x*ab.x + ap.z*ab.z) / ab2));
  const proj = new BABYLON.Vector3(a.x + ab.x*t, p.y, a.z + ab.z*t);
  const dx = p.x - proj.x, dz = p.z - proj.z;
  return Math.sqrt(dx*dx + dz*dz);
}
</script>

<script>
/*** ==========================================================
    UV FOOTPRINTS (1 minute lifetime)
    ========================================================== ***/
let UV_ACTIVE = false;
const UV_FOOT_MATS = [];
function _refreshUVFootprintMaterials(){
  // For now, nothing dynamic is required; placeholder if we later add different shaders.
}
function spawnUVFootprints(origin, count=2, step=0.35){
  for(let i=0;i<count;i++){
    const quad = BABYLON.MeshBuilder.CreatePlane("uv_foot_"+i, {size:0.18}, scene);
    quad.rotation.x = Math.PI/2;
    quad.position = new BABYLON.Vector3(origin.x + (Math.random()-0.5)*0.3 + i*step*0.6, origin.y+0.02, origin.z + (Math.random()-0.5)*0.3 + i*step);
    quad.isPickable=false;
    const m = new BABYLON.StandardMaterial("uv_mat_"+Math.random(), scene);
    m.diffuseColor = new BABYLON.Color3(0.6,0.3,1.0);
    m.emissiveColor = new BABYLON.Color3(0.2,0.1,0.6);
    m.specularColor = new BABYLON.Color3(0,0,0);
    m.alpha = 0.0; // fade in
    quad.material = m;
    UV_FOOT_MATS.push(m);
    // fade in
    let t=0; const fadeIn = scene.onBeforeRenderObservable.add(()=>{
      t += engine.getDeltaTime()/1000; m.alpha = Math.min(0.9, t*3);
      if(m.alpha>=0.9) scene.onBeforeRenderObservable.remove(fadeIn);
    });
    // hold ~60s then fade out and dispose
    setTimeout(()=>{
      let f=1;
      const h = scene.onBeforeRenderObservable.add(()=>{
        f -= engine.getDeltaTime()/3; m.alpha = Math.max(0, f*0.9);
        if(m.alpha<=0){ scene.onBeforeRenderObservable.remove(h); try{ quad.dispose(); }catch{} }
      });
    }, 60000);
  }
}
</script>

<script>
/*** ==========================================================
    DISTURB SALT (ties to UV footprints) + ITEM ACTIONS
    ========================================================== ***/
function disturbSaltAt(pos){
  // Wraith does NOT disturb salt
  if((ghost?.type||'').toLowerCase()==='wraith') return;
  for(const s of SALT_LINES){
    if(s.disturbed) continue;
    const d = _pointToSegmentDistance(pos, s.a, s.b);
    if(d < 0.18){
      s.disturbed = true;
      try{
        const ps = new BABYLON.ParticleSystem("saltPuff", 400, scene);
        ps.particleTexture = new BABYLON.Texture("./assets/images/particles/smoke.png", scene);
        ps.emitter = s.mesh;
        ps.minSize = 0.02; ps.maxSize = 0.08;
        ps.minEmitPower = 0.4; ps.maxEmitPower = 1.0;
        ps.emitRate = 600; ps.targetStopDuration = 0.35;
        ps.color1 = new BABYLON.Color4(1,1,1,0.8);
        ps.color2 = new BABYLON.Color4(1,1,1,0.4);
        ps.colorDead = new BABYLON.Color4(1,1,1,0);
        ps.start();
        setTimeout(()=>{ try{ ps.stop(); ps.dispose(); }catch{} }, 800);
      }catch{}
      try{ s.mat.emissiveColor = new BABYLON.Color3(0.01,0.01,0.01); s.mat.alpha = 0.8; }catch{}
      // footprints appear for ~1 minute
      try{ spawnUVFootprints(pos, 2, 0.4); }catch{}
    }
  }
}
function useActiveItem(){

  switch(it.id){
    case 'flash': toggleFlash(); break;

    case 'camera': takePhoto(); break;

    case 'thermo':readTemp(); break;

    case 'book':  dropWritingBook(); break;
    case 'dots':  toggleDOTS(); break;
    case 'cruci': useCrucifix(); break;
    case 'smudge': burnSmudge(); break;
    default: toast('Use '+it.name);
  }
}
function placeActiveItem(){
  const it = activeItem(); if(!it){ toast('Empty slot'); return; }
  switch(it.id){
    case 'dots': placeDOTS(); break;
    case 'book': placeWritingBook(); break;
    case 'salt': placeSalt(); break;
    default: toast('Place '+it.name);
  }
}
function tossActiveItem(){ toast('Toss '+(activeItem()?.name||'')); }
</script>

<script>
/*** ==========================================================
    INPUT (KBD/Touch) + PICKUP
    ========================================================== ***/
const InputSystem = (()=>{
  let move={x:0,z:0}, running=false, lookDelta={x:0,y:0};
  const keys = new Set();
  let isTouchMode=false;
  let _tapSprint=false;
  let _analogScale=1.0;

  const keyMap = {
    'KeyW':'fw','KeyS':'bk','KeyA':'lt','KeyD':'rt',
    'ArrowUp':'fw','ArrowDown':'bk','ArrowLeft':'lt','ArrowRight':'rt',
    'ShiftLeft':'run','ShiftRight':'run',
    'Digit1':'slot0','Digit2':'slot1','Digit3':'slot2',
    'KeyE':'pickup', 'KeyG':'drop',
    'Backslash':'tps', 'KeyV':'swap'
  };

  function recomputeMove(){
    const f=(keys.has('fw')?1:0)+(keys.has('bk')?-1:0);
    const r=(keys.has('rt')?1:0)+(keys.has('lt')?-1:0);
    move.z=f; move.x=r; running=keys.has('run') || _tapSprint;
  }

  function onKey(e,down){
    const tag=keyMap[e.code];
    if(!tag) return;
    e.preventDefault();
    if(down) keys.add(tag); else keys.delete(tag);
    if(tag.startsWith('slot') && down){
      const idx = parseInt(tag.replace('slot',''),10);
      if(idx>=0 && idx<3){ activeSlot=idx; rebuildBelt(); }
    }
    if(tag==='pickup' && down) tryPickup();
    if(tag==='drop' && down)   tryDrop();
    if(tag==='tps' && down)    toggleThirdPerson();
    if(tag==='swap' && down)   swapShoulder();
    recomputeMove();
  }

  function bindTouchHalves(){
    const left=document.getElementById('touch-left'), right=document.getElementById('touch-right');
    let leftId=null, leftCenter=null, rightId=null, lastRight=null;
    const DEAD=14, MAX=110;
    const norm=(v)=> Math.abs(v)<DEAD?0:v;
    const clampv=(v,m)=> Math.max(-m, Math.min(m, v));

    const onStart = ()=>{ isTouchMode=true; };
    left.addEventListener('touchstart', e=>{ onStart(); for(const t of e.changedTouches){ if(leftId===null){ leftId=t.identifier; leftCenter={x:t.clientX,y:t.clientY}; break; } } e.preventDefault(); },{passive:false});
    right.addEventListener('touchstart', e=>{ onStart(); for(const t of e.changedTouches){ if(rightId===null){ rightId=t.identifier; lastRight={x:t.clientX,y:t.clientY}; break; } } e.preventDefault(); },{passive:false});

    window.addEventListener('touchmove', e=>{
      for(const t of e.changedTouches){
        if(t.identifier===leftId && leftCenter){
          const dx=clampv(t.clientX-leftCenter.x,MAX), dy=clampv(t.clientY-leftCenter.y,MAX);
          const nx=norm(dx)/MAX, ny=norm(dy)/MAX;
          _analogScale = Math.min(1, Math.hypot(nx,ny));
          move.x = Math.sign(nx);
          move.z = ny<0 ? 1 : (ny>0 ? -1 : 0);
          e.preventDefault();
        } else if(t.identifier===rightId){
          if(lastRight){ lookDelta.x += (t.clientX-lastRight.x); lookDelta.y += (t.clientY-lastRight.y); }
          lastRight={x:t.clientX,y:t.clientY}; e.preventDefault();
        }
      }
    },{passive:false});
    window.addEventListener('touchend', e=>{
      for(const t of e.changedTouches){
        if(t.identifier===leftId){ leftId=null; leftCenter=null; move.x=0; move.z=0; _analogScale=1.0; }
        if(t.identifier===rightId){ rightId=null; lastRight=null; }
      }
      e.preventDefault();
    },{passive:false});

    // mobile sprint toggle
    const sprintWrap = document.getElementById('mobile-sprint');
    const sprintBtn  = document.getElementById('btn-sprint');
    sprintWrap.style.display='block';
    sprintBtn.onclick = ()=>{ _tapSprint=!_tapSprint; sprintBtn.textContent = 'Sprint: ' + (_tapSprint?'ON':'OFF'); };
  }

  function tryPickup(){
    const ray = camera.getForwardRay(2.2);
    const hit = scene.pickWithRay(ray, m=>m && m.metadata?.itemId);
    if(hit?.pickedMesh?.metadata?.itemId){
      const id = hit.pickedMesh.metadata.itemId;
      if(!belt.includes(id)){
        const empty = belt.findIndex(s=>!s);
        if(empty>=0) belt[empty]=id; else belt[activeSlot]=id;
        rebuildBelt();
      }
      hit.pickedMesh.dispose();
      const i = WORLD_ITEMS.findIndex(x=>x===hit.pickedMesh); if(i>=0) WORLD_ITEMS.splice(i,1);
      toast('Picked up '+itemById(id).name);
    }
  }
  function tryDrop(){
    const it = activeItem(); if(!it) return;
    const box = BABYLON.MeshBuilder.CreateBox("drop_"+it.id,{size:0.25},scene);
    box.position = camera.position.add(new BABYLON.Vector3(0,-0.9,0)).add(camera.getForwardRay().direction.scale(0.6));
    box.isPickable=true; box.checkCollisions=false;
    box.metadata={ itemId: it.id };
    const mat = new BABYLON.StandardMaterial("im_"+it.id,scene); mat.emissiveColor=new BABYLON.Color3(0.2,0.6,0.7);
    box.material=mat;
    WORLD_ITEMS.push(box);
    toast('Dropped '+it.name);
  }

  return {
    init(){
      document.addEventListener('keydown', e=>onKey(e,true), {passive:false});
      document.addEventListener('keyup',   e=>onKey(e,false), {passive:false});
      bindTouchHalves();
    },
    snapshot(){
      const out={ moveVec:{...move}, running, lookDelta:{...lookDelta}, analog:_analogScale };
      lookDelta.x=0; lookDelta.y=0; return out;
    },
    isTouch: ()=>isTouchMode
  };
})();
</script>

<script>
/*** ==========================================================
    MOVEMENT & LOOK  +  THIRD-PERSON SPRING ARM
    ========================================================== ***/
let OTS={ enabled:false, shoulder:1, dist:3.6, height:1.55, yaw:0 };
let __camTarget = new BABYLON.Vector3(0,1.6,0);

function toggleThirdPerson(){ OTS.enabled=!OTS.enabled; toast(OTS.enabled?'Third-person ON':'Third-person OFF'); }
function swapShoulder(){ OTS.shoulder*=-1; }

function handleMovement(input, dt){
  if(!camera) return;
  const baseWalk = player.speedWalk * (input.analog||1);
  const speed = input.running ? player.speedRun : baseWalk;
  const fwd = camera.getForwardRay().direction.clone(); fwd.y=0; fwd.normalize();
  const right = BABYLON.Vector3.Cross(fwd, BABYLON.Axis.Y).scale(-1);
  const desired = fwd.scale(input.moveVec.z).add(right.scale(input.moveVec.x));
  if (desired.lengthSquared()>0){
    const v = desired.normalize().scale(speed*dt);
    const next = camera.position.add(v);
    // simple ground snap
    const probe = next.add(new BABYLON.Vector3(0, player.stepUpMax, 0));
    const downRay = new BABYLON.Ray(probe, new BABYLON.Vector3(0,-1,0), player.stepUpMax+0.6);
    const hit = scene.pickWithRay(downRay, m=>m && m.isPickable!==false);
    if(hit && hit.pickedPoint){
      const deltaY = hit.pickedPoint.y + 1.7 - camera.position.y;
      if(deltaY<=player.stepUpMax) camera.position = new BABYLON.Vector3(next.x, hit.pickedPoint.y+1.7, next.z);
      else camera.position = next;
    } else camera.position = next;
  }
}
function applyLook(lookDelta){
  if(!camera) return;
  const sens = (OTS?.enabled ? 0.0022 : 0.0028);
  camera.rotation.y += lookDelta.x * sens;
  const invertY = 1;
  const minPitch=-Math.PI/2+0.15, maxPitch=Math.PI/2-0.15;
  const pitch=(camera.rotation.x||0)+(invertY * lookDelta.y * sens * 0.85);
  camera.rotation.x=Math.min(maxPitch, Math.max(minPitch, pitch));
}

function springArmTick(dt){
  if(!OTS.enabled || !camera) return;
  const target = __camTarget = camera.position.clone().add(new BABYLON.Vector3(0, OTS.height-1.6, 0));
  const yaw = camera.rotation.y + (OTS.shoulder>0?0:Math.PI);
  const side = new BABYLON.Vector3(Math.sin(yaw),0, -Math.cos(yaw)).scale(0.7*OTS.shoulder);
  const back = new BABYLON.Vector3(-Math.cos(yaw),0,-Math.sin(yaw)).scale(OTS.dist);
  const ideal = target.add(side).add(back);

  // collision check for camera (ignore thin glass/foliage by min thickness)
  const ray = new BABYLON.Ray(target, ideal.subtract(target).normalize(), OTS.dist+1.0);
  const hit = scene.pickWithRay(ray, (m)=>m && m.isPickable!==false && (m.getBoundingInfo()?.boundingBox?._max?.subtract(m.getBoundingInfo()?.boundingBox?._min).length()>0.1));
  const camPos = (hit?.pickedPoint) ? BABYLON.Vector3.Lerp(target, hit.pickedPoint, 0.8) : ideal;
  camera.position = camPos;
}
</script>

<script>

function setWeather(state){

async function loadMoon(){

<script>
/*** ==========================================================
    MAP SELECTOR + DYNAMIC DEF LOADER (via maps.json)
    ========================================================== ***/

// === Render Layers for lighting separation ===
const LAYERS = {
  EXTERIOR: 0x10000000,  // yard, skybox, exterior props
  INTERIOR: 0x20000000,  // house meshes (walls, floors, furniture)
  ALL:      0x0fffffff
};
let MAP_FILES = [];
let CURRENT_MAP = null;
let WORLD_BOUNDS = null;

async function loadManifest() {
  try {
    const res = await fetch("./assets/models/map/maps.json", { cache: "no-store" });
    const json = await res.json();
    MAP_FILES = Array.isArray(json) ? json : (json.maps || []);
    MAP_FILES.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  } catch (e) {
    console.warn("maps.json missing or invalid; using fallback.", e);
    MAP_FILES = [
      { file:"Abandoned_House.glb", title:"Abandoned House", def:"Abandoned_House.js" },
      { file:"furnished_house.glb", title:"Furnished House" }
    ];
  }
  populateMapSelector();
}

function populateMapSelector(){
  const sel = document.getElementById('map-select'); if(!sel) return;
  if (!MAP_FILES.length) { sel.innerHTML = `<option value="-1">(no maps found)</option>`; return; }
  sel.innerHTML = MAP_FILES.map((m,i)=>`<option value="${i}">${m.title||m.file}</option>`).join('');
  sel.value = "0";
  sel.addEventListener('change', ()=>{ try{ window.CURRENT_MAP = getSelectedMap(); }catch{} });
}

function getSelectedMap(){
  const sel = document.getElementById('map-select');
  const idx = Math.max(0, Math.min(MAP_FILES.length-1, parseInt(sel?.value||"0",10) || 0));
  return MAP_FILES[idx];
}

function loadScriptOnce(src){
  return new Promise((resolve)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve(true);
    s.onerror = ()=>resolve(false);
    document.head.appendChild(s);
  });
}
async function loadMatchingMapDef(mapFile, explicitDef){
  const base = (explicitDef || mapFile.replace(/\.[^.]+$/,'') + ".js");
  const path = `./assets/models/map/${base}`;
  const ok = await loadScriptOnce(path);
  if(!ok){ window.MAP_DEF = undefined; }
}

// Light/Layer helpers
function markExteriorMesh(mesh){
  try { mesh.layerMask = (mesh.layerMask|0) | LAYERS.EXTERIOR; } catch{}
}
function attachInteriorLight(light){
  try { light.includeOnlyWithLayerMask = LAYERS.INTERIOR; } catch{}
}

function updateEmitterToBounds(){
  if(!WORLD_BOUNDS) return;
  const cx = (WORLD_BOUNDS.minx + WORLD_BOUNDS.maxx) * 0.5;
  const cz = (WORLD_BOUNDS.minz + WORLD_BOUNDS.maxz) * 0.5;
  const half = Math.max(WORLD_BOUNDS.maxx - WORLD_BOUNDS.minx, WORLD_BOUNDS.maxz - WORLD_BOUNDS.minz) * 0.6;

  const applyPS = (ps)=>{
    if(!ps) return;
    ps.emitter = new BABYLON.Vector3(cx, 14, cz);
    ps.minEmitBox = new BABYLON.Vector3(-half, 0, -half);
    ps.maxEmitBox = new BABYLON.Vector3( half, 0,  half);
  };
  try { applyPS(weather?.rainPS); } catch{}
  try { applyPS(weather?.snowPS); } catch{}
}

window.loadSelectedMap = async function(){
  const map = (window.CURRENT_MAP = getSelectedMap());
  const mapFile = map?.file || "Abandoned_House.glb";

  await loadMatchingMapDef(mapFile, map?.def);

  try{
    const res = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/map/", mapFile, scene);
    houseRoot = res.meshes[0] || res.meshes.find(m=>m.name==="__root__") || null;
    // Layer the house meshes as INTERIOR for light scoping
    try {
      res.meshes.forEach(m=>{ m.layerMask = (m.layerMask|0) | LAYERS.INTERIOR; });
    } catch(e) {}

// Force-origin mode
    const FORCE_ORIGIN = true;

        // Apply map transform if provided by MAP_DEF
    try {
      const s = (window.MAP_DEF && (MAP_DEF.scale||MAP_DEF.scaling)) ? (MAP_DEF.scale||MAP_DEF.scaling) : null;
      if (s && houseRoot && houseRoot.scaling) { houseRoot.scaling.set(s, s, s); }
      const off = (window.MAP_DEF && MAP_DEF.offset) ? MAP_DEF.offset : null;
      if (off && houseRoot && houseRoot.position) { houseRoot.position.addInPlace(new BABYLON.Vector3(off.x||0, off.y||0, off.z||0)); }
      const ry = (window.MAP_DEF && (MAP_DEF.rotationY!==undefined)) ? (MAP_DEF.rotationY * Math.PI/180) : null;
      if (ry!==null && houseRoot && houseRoot.rotation) { houseRoot.rotation.y += ry; }
    } catch(e) { console.warn('Map transform apply failed', e); }

    // Force each GLB root to origin (0,0,0)
    try { if (FORCE_ORIGIN && houseRoot && houseRoot.position) { houseRoot.position.set(0,0,0); } } catch(e){}

    // WORLD_BOUNDS
    const bb = houseRoot?.getHierarchyBoundingVectors?.(true);
    WORLD_BOUNDS = bb ? { minx: bb.min.x, maxx: bb.max.x, minz: bb.min.z, maxz: bb.max.z } : null;
    updateEmitterToBounds();
  }catch(e){
    console.warn('Map load failed; building ground fallback', e);
    const g=BABYLON.MeshBuilder.CreateGround("fallback",{width:180,height:180},scene); g.checkCollisions=true;
  }
};
</script>

<script>
/*** ==========================================================
    ITEMS: RANDOM SPAWN + GHOST TOSS
    ========================================================== ***/
function randomPointInRoomPoly(poly){
  const xs=poly.map(p=>p.x), zs=poly.map(p=>p.z);
  const minx=Math.min(...xs), maxx=Math.max(...xs), minz=Math.min(...zs), maxz=Math.max(...zs);
  for(let tries=0; tries<80; tries++){
    const x=minx+(maxx-minx)*Math.random();
    const z=minz+(maxz-minz)*Math.random();
    if(pointInPolyXZ({x,z}, poly)){
      const ray = new BABYLON.Ray(new BABYLON.Vector3(x, 12, z), new BABYLON.Vector3(0,-1,0), 40);
      const hit = scene.pickWithRay(ray, m=>m && m.isPickable!==false);
      const y = hit?.pickedPoint ? hit.pickedPoint.y+0.05 : 1.7;
      return new BABYLON.Vector3(x,y,z);
    }
  }
  return new BABYLON.Vector3(poly[0].x, 1.7, poly[0].z);
}
function spawnWorldItems(){
  const rooms = (MAP_DEF?.rooms||[]).filter(r=>r.name!=='Van');
  if(rooms.length===0) return;
  const count = Math.min(ITEM_TYPES.length, 6);
  for(let i=0;i<count;i++){
    const type = ITEM_TYPES[i];
    const room = rooms[(Math.random()*rooms.length)|0];
    const pos = randomPointInRoomPoly(room.poly);
    const mesh = BABYLON.MeshBuilder.CreateBox("item_"+type.id,{size:0.25},scene);
    const mat = new BABYLON.StandardMaterial("im_"+type.id,scene); mat.emissiveColor=new BABYLON.Color3(0.2+Math.random()*0.2,0.6,0.7);
    mesh.material=mat; mesh.position=pos; mesh.isPickable=true; mesh.metadata={ itemId:type.id };
    WORLD_ITEMS.push(mesh);
  }
}
function ghostTossNearby(dt){
  if(!ghost.mesh || ghost.mode==='idle') return;
  let best=null, bd=99;
  for(const m of WORLD_ITEMS){
    const d = BABYLON.Vector3.Distance(m.position, ghost.mesh.position);
    if(d<3 && d<bd){ best=m; bd=d; }
  }
  if(best && Math.random()<0.02){
    const dir = camera.position.subtract(ghost.mesh.position); dir.y=0; dir.normalize();
    best.position.addInPlace(dir.scale(0.8)).addInPlace(new BABYLON.Vector3(0,0.6,0));
  }
}
</script>

<script>
/*** ==========================================================
    NOTEBOOK / EVIDENCE

function openNotebook(){

  });

function resetEvidence(){ for(const k of EVIDENCE) found[k]=false; updatePossible(); }
function updatePossible(){
  const result = GHOSTS.filter(g=>{
    const ghostEv = new Set(g.ev); if (g.rules?.mimicOrbs) ghostEv.add('Orbs');
    return Object.entries(found).every(([e,has])=>!has || ghostEv.has(e));
  }).map(g=>g.name);

}

<script>
/*** ==========================================================
    GHOST: SPAWN, EVENTS, HUNTS, VISIBILITY
    ========================================================== ***/
function makeFlickerController(mesh){
  let t=0,on=false,next=0,solid=0.85;
  return {
    setSolid(v){ solid=v; },
    reset(){ t=0; on=false; next=0; },
    tick(dt, mode, profile){
      t+=dt;
      if(mode==='idle'){ apply(0); return; }
      if(t>=next){
        const fast = 0.05 + Math.random()*0.07;
        const slow = 0.28 + Math.random()*0.22;
        let onDur, offDur;
        if(profile==='phantom'){ onDur = fast*0.6; offDur = 0.9 + Math.random()*0.6; }
        else if(profile==='oni'){ onDur = 0.30 + Math.random()*0.25; offDur = (Math.random()<0.5)?0.7:1.0; }
        else { onDur = fast; offDur = slow; }
        on=true; next=t+onDur; apply(solid);
        setTimeout(()=>{ on=false; apply(0); }, onDur*1000);
        next += offDur;
      } else apply(on?solid:0);
      function apply(a){ if(!mesh) return; if(mesh.material && 'alpha' in mesh.material) mesh.material.alpha=a; else mesh.visibility=a; }
    }
  };
}
function randomInsideExterior(){
  const poly = MAP_DEF?.exterior || [{x:-10,z:-10},{x:10,z:-10},{x:10,z:10},{x:-10,z:10}];
  return randomPointInRoomPoly(poly);
}
function randomInsideRoom(){
  const rooms = (MAP_DEF?.rooms||[]).filter(r=>r.name!=='Van');
  if(!rooms.length) return new BABYLON.Vector3(0,1.7,0);
  const room = rooms[(Math.random()*rooms.length)|0];
  return randomPointInRoomPoly(room.poly);
}
async function spawnGhost(){
  const profile = GHOSTS[(Math.random()*GHOSTS.length)|0];
  ghost.type = profile.name;
  ghost.wanderRadius = profile.rules?.wander ?? 8;
  ghost.canChangeRoom = profile.rules?.roomChange !== false;

  try{
    const list = ["ghost1.glb","ghost2.glb","ghost3.glb","ghost4.glb","ghost5.glb"];
    const pick = list[(Math.random()*list.length)|0];
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/ghosts/", pick, scene);
    ghost.mesh = r.meshes.find(m=>m.name && m.name!=="__root__") || r.meshes[0];
    if(ghost.mesh){
      ghost.mesh.isPickable=false; ghost.mesh.checkCollisions=false;
      const bb = ghost.mesh.getHierarchyBoundingVectors(true);
      const height=bb.max.y-bb.min.y; const s=1.9/Math.max(0.8,height||1);
      ghost.mesh.scaling.set(s,s,s);
    }
  }catch(e){ /* fallback */ }

  if(!ghost.mesh){
    const m=BABYLON.MeshBuilder.CreateBox("ghostFallback",{size:1.2},scene);
    const mat=new BABYLON.StandardMaterial("ghostMat",scene); mat.alpha=0; mat.emissiveColor=new BABYLON.Color3(0.6,0.7,1.0);
    m.material=mat; m.isPickable=false; ghost.mesh=m;
  }

  ghost.roomCenter = randomInsideRoom();
  ghost.mesh.position.copyFrom(ghost.roomCenter);
  ghost.visible=false;
  ghost.flicker = makeFlickerController(ghost.mesh);
  if(ghost.type==='Phantom') ghost.flicker.setSolid(0.45);
  if(ghost.type==='Oni')     ghost.flicker.setSolid(0.95);

  if(!ghost.audio.heartbeat){
    ghost.audio.heartbeat = new BABYLON.Sound("heartbeat","./assets/audio/whisper.mp3",scene,null,{ loop:true, autoplay:false, volume:0.0, spatialSound:false });
    ghost.audio.singing   = new BABYLON.Sound("singing","./assets/audio/Radio.mp3",scene,null,{ loop:true, autoplay:false, volume:0.0, spatialSound:true, distanceModel:"linear", maxDistance:20 });
  }
  try{ ghost.audio.singing.attachToMesh(ghost.mesh); }catch{}
}
function wanderGhost(dt){
  if(!ghost.mesh) return;
  if(ghost.mode!=='idle' && ghost.mode!=='event') return;
  if(!ghost._dir || Math.random()<0.02){
    const ang=Math.random()*Math.PI*2;
    const spd=0.28;
    ghost._dir = new BABYLON.Vector3(Math.cos(ang)*spd,0,Math.sin(ang)*spd);
  }
  const step = ghost._dir.scale(dt);
  const cand = ghost.mesh.position.add(step);
  if(isInsideExterior(cand)) ghost.mesh.position = cand; else ghost._dir=null;
  try{ disturbSaltAt(ghost.mesh.position); }catch{}
}
function isInsideExterior(p){
  if(!window.MAP_DEF) return true;
  return pointInPolyXZ({x:p.x, z:p.z}, MAP_DEF.exterior);
}
function isInsideHouse(p){
  if(!window.MAP_DEF) return true;
  const poly = MAP_DEF.exterior || [];
  const inside = pointInPolyXZ({x:p.x, z:p.z}, poly);
  // If the map says 'interior', inside the polygon means *inside the house*.
  // Otherwise (default 'exterior'), inside polygon means *outside* (yard), so invert.
  const mode = (MAP_DEF.exteriorMode||'exterior');
  return mode==='interior' ? inside : !inside;
}
function startEvent(){
  ghost.mode='event';
  ghost._eventLeft = 3 + Math.random()*2;
  toast('You hear something...');
}
function ghostEventTick(dt){
  ghost.eventTimer += dt;
  if(ghost.mode!=='hunt' && ghost.eventTimer>ghost.nextEvent){
    ghost.eventTimer=0; ghost.nextEvent=10+Math.random()*14;
    const chance = clamp((80-player.sanity)/120,0.05,0.7);
    if(Math.random()<chance) startEvent();
  }
  if(ghost.mode==='event'){
    ghost._eventLeft -= dt;
    if(ghost._eventLeft<=0) ghost.mode='idle';
  }
}
function startHunt(){
  ghost.mode='hunt'; ghost._huntLeft = 8 + Math.random()*5;
  document.getElementById('hud-hunt').textContent='Hunting';
  toast('Hunt started!');
  if(!ghost.audio.heartbeat.isPlaying) ghost.audio.heartbeat.play();
  if(!ghost.audio.singing.isPlaying)   ghost.audio.singing.play();
}
function stopHunt(reason){
  ghost.mode='idle'; document.getElementById('hud-hunt').textContent='Calm';
  toast('Hunt ended'+(reason?` (${reason})`:'')); 
  if(ghost.audio.heartbeat.isPlaying) ghost.audio.heartbeat.stop();
  if(ghost.audio.singing.isPlaying)   ghost.audio.singing.stop();
}
function huntTick(dt){
  if(!ghost._huntTimer){ ghost._huntTimer=0; ghost._nextHunt=50+Math.random()*40; }
  if(ghost.mode==='hunt'){
    if(performance.now() < (ghost.smudgedUntil||0)) return;
    const dir = camera.position.subtract(ghost.mesh.position); dir.y=0;
    const dist = dir.length();
    ghost.nearPlayer = dist<3.0;
    if(dist>0.02){
      dir.normalize();
      const spd = (ghost.type==='Revenant' && player.sanity<50) ? 2.6 : 1.35;
      ghost.mesh.position.addInPlace(dir.scale(spd*dt));
    }
    ghost._huntLeft -= dt;
    if(ghost._huntLeft<=0) stopHunt();
  } else {
    ghost._huntTimer += dt;
    if(ghost._huntTimer>ghost._nextHunt){
      ghost._huntTimer=0; ghost._nextHunt=55+Math.random()*45;
      if (player.sanity < 65 && player.inside) { startHunt(); }
    }
  }
}
function ghostVisibilityTick(dt){
  const profile = (ghost.type==='Phantom')?'phantom':(ghost.type==='Oni')?'oni':'default';
  const mode = (ghost.mode==='event' || ghost.mode==='hunt') ? ghost.mode : 'idle';
  ghost.flicker?.tick(dt, mode, profile);
  ghost.visible = (ghost.mesh.material?.alpha ?? ghost.mesh.visibility) > 0.05;
}
function ghostAbortHunt(reason){ stopHunt(reason); }
</script>

<script>
/*** ==========================================================
    SANITY & AUDIO GAINS
    ========================================================== ***/
function sanityTick(dt){
  player.inside = isInsideHouse(camera.position);
  const roomNow = (player.inside ? (currentRoomName()||'House') : 'Exterior');
  if(roomNow!==player.room){ player.room = roomNow; document.getElementById('hud-room').textContent=roomNow; }

  // Held light contribution (only inside)
  const li = player.inside ? (
    (held.light?.intensity||0)*0.7 + (held.uvLight?.intensity||0)*0.5 + (held.lighter?.intensity||0)*0.8
  ) : 0;
  player.lightLevel = clamp(li/2.5, 0, 1);

  // Rates
  let drain = 0.004, recover = 0;
  if(player.lightLevel>0.4) recover += 0.008 * (player.lightLevel-0.4);
  if(player.lightLevel<0.25){ drain += (0.010 * (0.25-player.lightLevel)); if(weather.state==='Blood Moon') drain += 0.004; }
  if(ghost.mesh){
    const d = BABYLON.Vector3.Distance(ghost.mesh.position, camera.position);
    if(d<6) drain += 0.016 * ((6-d)/6);
  }
  if(ghost.mode==='event') drain += 0.010;
  if(ghost.mode==='hunt')  drain += 0.020;
  if(player.room==='Van') recover += 0.040;

  // Apply + animated bar
  player.sanity = clamp(player.sanity + (recover - drain)*dt*60, 0, 100);
  document.getElementById('hud-sanity').textContent = Math.round(player.sanity)+'%';
  const fill = document.getElementById('sanity-fill');
  fill.style.width = Math.round(player.sanity)+'%';
}

// Audio gain vs distance/state
function updateEventAudioGains(){
  if(!ghost.audio.heartbeat || !ghost.audio.singing) return;
  const d = ghost.mesh ? BABYLON.Vector3.Distance(ghost.mesh.position, camera.position) : 99;
  const near = clamp(1-(d/12), 0, 1);
  if(ghost.mode==='hunt'){
    ghost.audio.heartbeat.setVolume(0.18 + 0.40*near);
    ghost.audio.singing.setVolume(0.12 + 0.50*near);
  }else if(ghost.mode==='event'){
    ghost.audio.heartbeat.setVolume(0.10*near);
    ghost.audio.singing.setVolume(0.20 + 0.30*near);
    if(!ghost.audio.singing.isPlaying) ghost.audio.singing.play();
  }else{
    ghost.audio.heartbeat.setVolume(0);
    ghost.audio.singing.setVolume(0);
    if(ghost.audio.singing.isPlaying) ghost.audio.singing.stop();
  }
}
</script>

<script>
/*** ==========================================================
    BOOT + MAIN LOOP (touch friendly; no pointer-lock)
    ========================================================== ***/
function currentRoomName(){
  if(!window.MAP_DEF) return player.inside?'House':'Exterior';
  const pos = {x:camera.position.x, z:camera.position.z};
  for(const r of MAP_DEF.rooms){ if(pointInPolyXZ(pos, r.poly)) return r.name; }
  return player.inside ? 'House' : 'Exterior';
}

async function boot(){
  engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true, disableWebGL2Support:false });
  scene  = new BABYLON.Scene(engine);
  scene.collisionsEnabled = true;
  scene.gravity = new BABYLON.Vector3(0,-0.5,0);

  camera = new BABYLON.UniversalCamera("playerCam", new BABYLON.Vector3(0, 2, 24), scene);
  camera.attachControl(canvas, true);
  camera.checkCollisions = true;
  camera.applyGravity = false; // handled by ground snap
  camera.ellipsoid = new BABYLON.Vector3(0.35,0.9,0.35);
  camera.ellipsoidOffset = new BABYLON.Vector3(0,0.4,0);
  camera.minZ = 0.1; camera.inertia=0;
  camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

  // Exterior hemispheric light
  hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.2,1,0.2), scene);
  hemiLight.intensity = 0.6;
  hemiLight.includeOnlyWithLayerMask = LAYERS.EXTERIOR;

  // Atmosphere
  scene.clearColor = new BABYLON.Color4(0.01,0.01,0.02,1);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.0045;
  scene.fogColor = new BABYLON.Color3(0.02,0.03,0.05);

  await loadSelectedMap();
// Force player start at world origin for consistent authoring
  if (true /* FORCE_ORIGIN */) {
    try { camera.position = new BABYLON.Vector3(0, 1.8, 0); } catch(e){}
  } else {
  // Move player camera to map-defined spawn if provided
  try {
    if (window.MAP_DEF && (MAP_DEF.spawn || MAP_DEF.vanSpawn)) {
      const sp = MAP_DEF.spawn || MAP_DEF.vanSpawn;
      camera.position = new BABYLON.Vector3(sp.x||0, sp.y||1.8, sp.z||0);
    }
  } catch(e){ console.warn('Spawn apply failed', e); }
  await loadMoon();
  // Make sure we truly end up at origin even if something later nudges us
  try { camera.position = new BABYLON.Vector3(0, 1.8, 0); } catch(e){}

  WeatherAudio.init(scene);

  // Weather
  const r=Math.random();
  const w = r<0.40?'Clear' : r<0.70?'Rain' : r<0.88?'Snow' : 'Blood Moon';
  setWeather(w);

  // Items & inputs
  rebuildBelt();
  InputSystem.init();
  canvas.focus();

  // Spawn ghost/items
  await spawnGhost();
  spawnWorldItems();

  // Buttons
  document.getElementById('btn-use').onclick=useActiveItem;
  document.getElementById('btn-place').onclick=placeActiveItem;
  document.getElementById('btn-toss').onclick=tossActiveItem;
  document.getElementById('btn-lighter').onclick=toggleLighter;
  document.getElementById('btn-notebook').onclick=openNotebook;
  document.getElementById('btn-inspector').onclick=()=>{ try{ scene.debugLayer.isVisible()?scene.debugLayer.hide():scene.debugLayer.show({overlay:true}); }catch(e){} };

  // Main loop
  scene.onBeforeRenderObservable.add(()=>{
    const dt = engine.getDeltaTime()/1000;
    const input = InputSystem.snapshot();

    handleMovement(input, dt);
    applyLook(input.lookDelta);
    springArmTick(dt);

    // Attach held lights to camera (force off outdoors)
    const camForward = camera.getForwardRay().direction;
    if(held.light){
      held.light.position = camera.position.add(new BABYLON.Vector3(0,0.3,0));
      held.light.setDirectionToTarget(camera.position.add(camForward));
      if(!player.inside) held.light.intensity=0;
      else attachInteriorLight(held.light);
    }
    if(held.uvLight){
      held.uvLight.position = camera.position.add(new BABYLON.Vector3(0,0.3,0));
      held.uvLight.setDirectionToTarget(camera.position.add(camForward));
      if(!player.inside) held.uvLight.intensity=0;
      else attachInteriorLight(held.uvLight);
    }
    if(held.lighter){
      held.lighter.position = camera.position.add(new BABYLON.Vector3(0,0.2,0));
      if(!player.inside) held.lighter.intensity=0;
      else attachInteriorLight(held.lighter);
    }

    // Weather: lightning pacing
    if(weather.state==='Rain' || weather.state==='Blood Moon'){
      weather.lightningTimer += dt;
      if(weather.lightningTimer > weather.nextStrike){ lightningFlash(); scheduleNextLightning(); }
    }

    // Ghost
    ghostEventTick(dt);
    huntTick(dt);
    wanderGhost(dt);
    ghostVisibilityTick(dt); try{ disturbSaltAt(ghost.mesh?.position||camera.position); }catch{};
    ghostTossNearby(dt);
    updateEventAudioGains();

    // Sanity
    sanityTick(dt);

    // HUD XYZ
    const xyz=document.getElementById('hud-xyz'); xyz.style.display='block';
    document.getElementById('hud-x').textContent = camera.position.x.toFixed(2);
    document.getElementById('hud-y').textContent = camera.position.y.toFixed(2);
    document.getElementById('hud-z').textContent = camera.position.z.toFixed(2);
  });

  engine.runRenderLoop(()=>scene.render());
  window.addEventListener('resize', ()=>engine.resize());
}
</script>

<script>
/* === Third-Person Avatar Patch (inlined) ===============================
   - Expects: ./assets/models/player/main_player.glb
   - Toggle: Backslash "\"
   - No edits to InputSystem required.
========================================================================= */
(function(){
  const PLAYER_MODEL_DIR = "./assets/models/player/";
  const PLAYER_MODEL_FILE = "main_player.glb";
  const EYE_HEIGHT = 1.7;

  const avatar = {
    root: null,
    mesh: null,
    loaded: false,
    third: false,
    dist: 2.8,
    height: 1.55
  };

  async function ensurePlayerModel(){
    if(avatar.loaded || !window.scene) return;
    try{
      const r = await BABYLON.SceneLoader.ImportMeshAsync("", PLAYER_MODEL_DIR, PLAYER_MODEL_FILE, scene);
      const mesh = r.meshes.find(m=>m.name && m.name!=="__root__") || r.meshes[0];
      avatar.root = new BABYLON.TransformNode("playerRoot", scene);
      avatar.mesh = mesh;
      mesh.parent = avatar.root;
      mesh.isPickable = false;
      // scale to ~1.8 m tall
      const bb = mesh.getHierarchyBoundingVectors(true);
      const h = Math.max(0.001, bb.max.y - bb.min.y);
      const s = 1.8 / h;
      mesh.scaling.set(s,s,s);
      mesh.setEnabled(false); // hidden in first-person
      avatar.loaded = true;
    }catch(e){ console.warn("[3P] Failed to load main_player.glb", e); }
  }

  function toggleThirdPerson(){
    avatar.third = !avatar.third;
    if(avatar.mesh){ avatar.mesh.setEnabled(avatar.third); }
    if(typeof toast === "function") toast(avatar.third ? "Third-person ON (\\)" : "Third-person OFF (\\)");
  }
  window.toggleThirdPerson = toggleThirdPerson; // optional global

  function updateAvatarAndCamera(dt){
    if(!window.scene || !window.camera || !window.engine) return;
    ensurePlayerModel();
    if(avatar.root){
      // Ground at player's location (camera x/z)
      const start = new BABYLON.Vector3(camera.position.x, camera.position.y + 0.5, camera.position.z);
      const ray = new BABYLON.Ray(start, new BABYLON.Vector3(0,-1,0), 6.0);
      const hit = scene.pickWithRay(ray, m=>m && m.isPickable!==false);
      const groundY = hit?.pickedPoint ? hit.pickedPoint.y : (camera.position.y - EYE_HEIGHT);

      // Position avatar at ground, face camera yaw
      avatar.root.position.set(camera.position.x, groundY, camera.position.z);
      avatar.root.rotation.set(0, camera.rotation.y, 0);

      if(avatar.third){
        // Desired camera position behind avatar (ignore pitch for forward vector)
        const yaw = camera.rotation.y;
        const fwd = new BABYLON.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
        const pivot = new BABYLON.Vector3(avatar.root.position.x, groundY + avatar.height, avatar.root.position.z);
        const ideal = pivot.subtract(fwd.scale(avatar.dist)); ideal.y = groundY + avatar.height;

        // Wall avoidance: ray from pivot toward ideal
        const dir = ideal.subtract(pivot); const len = Math.max(0.001, dir.length());
        const rayBack = new BABYLON.Ray(pivot, dir.scale(1/len), len);
        const hitBack = scene.pickWithRay(rayBack, m=>m && m.isPickable!==false);
        const finalPos = hitBack?.pickedPoint ? hitBack.pickedPoint.add(dir.scale(1/len).scale(0.2)) : ideal;

        camera.position.copyFrom(finalPos);
        camera.minZ = 0.1;
      }
    }
  }

  // Backslash toggles
  document.addEventListener("keydown", (e)=>{
    if(e.code === "Backslash"){ e.preventDefault(); toggleThirdPerson(); }
  }, {passive:false});

  // Attach update loop once scene exists
  (function waitScene(){
    if (window.scene && window.engine && window.camera){
      ensurePlayerModel();
      scene.onBeforeRenderObservable.add(()=>{
        const dt = engine.getDeltaTime()/1000;
        updateAvatarAndCamera(dt);
      });
    } else {
      setTimeout(waitScene, 300);
    }
  })();
})();
</script>


<script>

   - Toggle view: Backslash (\) ; Swap shoulder: V ; Zoom: Mouse Wheel

      // Layer to interior by default if you want: comment out if not needed
      // mesh.layerMask = LAYERS ? (LAYERS.INTERIOR|0) : mesh.layerMask;

      // Try to find head bones/meshes by common names (Mixamo, GLTF2 human rigs)
      avatar.headLinks = findHeadNodes(mesh, skel);

      avatar.loaded = true;
    }catch(e){ console.warn("[Avatar] load failed:", e); }
  }

  function findHeadNodes(mesh, skel){
    const targets = [];
    const nameHas = (n,keys)=> keys.some(k=> n.toLowerCase().includes(k));
    const headKeys = ["head", "neck", "helmet"];
    // Bones first
    if(skel){
      for(const b of skel.bones){
        if(nameHas(b.name, headKeys)) targets.push(b);
      }
    }
    // Mesh nodes named like head
    const stack = mesh.getChildMeshes(false);
    for(const m of stack){
      if(nameHas(m.name||"", headKeys)) targets.push(m);
    }
    return targets;
  }

  function setHeadHidden(hidden){
    if(!avatar.mesh) return;
    const epsilon = hidden ? 0.0001 : 1.0;
    // If we have bones, scale head bones to a tiny value in 1P (more robust than alpha)
    for(const t of avatar.headLinks){
      if(t instanceof BABYLON.Bone){
        const cur = t.getScale();
        t.setScale(new BABYLON.Vector3(epsilon, epsilon, epsilon));
      } else if(t && t.scaling){ // mesh node
        t.scaling.set(epsilon, epsilon, epsilon);
      } else if(t && t.material && "alpha" in t.material){ // fallback
        t.material.alpha = hidden ? 0.0 : 1.0;
      }
    }
  }

  function groundYAt(x,y,z){
    const start = new BABYLON.Vector3(x, y+0.5, z);
    const ray   = new BABYLON.Ray(start, new BABYLON.Vector3(0,-1,0), 6.0);
    const hit   = scene.pickWithRay(ray, m=>m && m.isPickable!==false);
    return hit?.pickedPoint ? hit.pickedPoint.y : (y - 1.7);
  }

  function tick(dt){
    if(!window.scene || !window.camera || !window.engine) return;
    ensureAvatar();
    if(!avatar.root) return;

    // Keep avatar at camera XZ, grounded
    const gy = groundYAt(camera.position.x, camera.position.y, camera.position.z);
    avatar.root.position.set(camera.position.x, gy, camera.position.z);
    avatar.root.rotation.set(0, camera.rotation.y, 0);

    // Toggle head visibility depending on mode
    setHeadHidden(rig.mode === "first");

    if(rig.mode === "first"){
      rig.pos = camera.position.clone();
      camera.minZ = 0.06; // allow near-body without clipping too soon
      return;
    }

    // === Third-person desired spot ===
    const yaw = camera.rotation.y;
    const fwd = new BABYLON.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
    const right = new BABYLON.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const pivot = new BABYLON.Vector3(avatar.root.position.x, gy + rig.height, avatar.root.position.z);
    let ideal = pivot.subtract(fwd.scale(rig.dist)).add(right.scale(rig.shoulder));
    // collision push-in
    const dir = ideal.subtract(pivot); const len = Math.max(0.001, dir.length());
    const ray = new BABYLON.Ray(pivot, dir.scale(1/len), len);
    const hit = scene.pickWithRay(ray, m=>m && m.isPickable!==false);
    if(hit?.pickedPoint){
      ideal = hit.pickedPoint.subtract(dir.scale(rig.collidePad/len));
    }
    // smooth
    if(!rig.pos) rig.pos = ideal.clone();
    const alpha = 1 - Math.exp(-rig.stiffness * dt);
    rig.pos = BABYLON.Vector3.Lerp(rig.pos, ideal, alpha);

    camera.position.copyFrom(rig.pos);
    camera.minZ = 0.1;
  }

  // Hotkeys
  document.addEventListener("keydown", (e)=>{
    if(e.code==="Backslash"){ e.preventDefault(); rig.mode = (rig.mode==="first"?"third":"first"); toast?.(rig.mode.toUpperCase()+" person"); }
    if(e.code==="KeyV"){ rig.shoulder *= -1; toast?.("Swap shoulder"); }
  }, {passive:false});

  // Zoom with wheel in 3rd-person
  document.addEventListener("wheel", (e)=>{
    const step = (e.deltaY>0 ? 0.4 : -0.4);
    rig.dist = Math.min(rig.maxDist, Math.max(rig.minDist, rig.dist + step));
  }, {passive:true});

  // Hook into your render loop
  (function wait(){
    if(window.scene && window.engine && window.camera){
      scene.onBeforeRenderObservable.add(()=> tick(engine.getDeltaTime()/1000));
    } else setTimeout(wait, 200);
  })();
})();
</script>

</body>
</html>
