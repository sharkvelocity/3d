<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhasmaPhoney — Fixed Input + Audio + Moon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />

  <!-- Babylon core + loaders (LOCAL) -->
  <script src="./cdn/babylon.js"></script>
  <script src="./cdn/earcut.min.js"></script>
  <script src="./cdn/meshopt_decoder.js"></script>
  <script src="./cdn/draco_decoder_gltf.js"></script>
  <script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script>
  <script src="./cdn/loaders/babylonjs.loaders.min.js"></script>

  <style>
    html, body { margin:0; height:100%; width:100%; background:#000; overflow:hidden; font-family:monospace; color:#0ff; touch-action:none; }
    #renderCanvas { width:100vw; height:100vh; display:block; background:#000; outline:none; }

    /* Title */
    #title-screen{ position:fixed; inset:0; background:rgba(0,0,0,0.88);
      display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999;}
    #title-content{ text-align:center; max-width:90vw;}
    #title-logo{ max-width:60vw; max-height:35vh; object-fit:contain; margin-bottom:24px;}
    #start-button{ padding:14px 28px; font-size:22px; cursor:pointer; border:2px solid #0ff; color:#0ff; background:#111; box-shadow:0 0 14px rgba(0,255,255,0.25); }
    #start-button:active{ transform:translateY(1px); }

    /* HUD XYZ */
    #hud-xyz { position:fixed; top:10px; right:12px; background:rgba(0,0,0,0.5); border:1px solid #066;
      padding:6px 8px; color:#0ff; font:12px monospace; z-index:6000; display:none; }

    /* Belt */
    #belt{ position:fixed; left:50%; bottom:72px; transform:translateX(-50%);
      display:flex; gap:12px; z-index:6000; align-items:center;
      background:rgba(0,0,0,0.55); border:1px solid #066; padding:8px 10px; border-radius:10px; }
    .slot{ width:72px; height:72px; display:flex; align-items:center; justify-content:center;
      border-radius:8px; border:1px solid #0aa; background:rgba(0,20,20,0.6);
      position:relative; cursor:pointer; user-select:none; }
    .slot .key{ position:absolute; top:2px; left:4px; font-size:11px; color:#9ff; opacity:0.9; }
    .slot .label{ font-size:12px; color:#adf; text-align:center; line-height:1.1; padding:4px; }
    .slot.active{ outline:2px solid #0ff; box-shadow:0 0 12px rgba(0,255,255,0.45) inset; }

    /* Buttons */
    .hud-btn{ border:1px solid #333; background:#181818; color:#ddd; padding:6px 10px; border-radius:8px; cursor:pointer; }
    #action-bar { position:fixed; right:12px; bottom:18px; display:flex; gap:10px; z-index:6500; }

    /* Touch halves — 20vh from top to 12vh above bottom, split 50/50 */
    .touch-half { position:fixed; top:20vh; bottom:12vh; width:50vw; z-index:7000; touch-action:none; }
    #touch-left { left:0; }
    #touch-right{ right:0; }

    /* Toast */
    #toast{ position:fixed; left:50%; top:16px; transform:translateX(-50%);
      background:rgba(0,0,0,0.7); border:1px solid #066; border-radius:8px; padding:8px 12px; color:#0ff;
      z-index:10001; display:none; max-width:70vw; text-align:center; }
  </style>
</head>
<body>
  <div id="title-screen">
    <div id="title-content">
      <img id="title-logo" src="./logo.png" alt="PhasmaPhoney Logo" />
      <div style="margin:8px 0 16px; color:#9ff;">“Welcome back. Keep the lights on and the sanity high.”</div>
      <button id="start-button">Start Investigation</button>
    </div>
  </div>

  <canvas id="renderCanvas" tabindex="0"></canvas>

  <div id="hud-xyz">XYZ: <span id="hud-x">0</span>, <span id="hud-y">0</span>, <span id="hud-z">0</span></div>

  <div id="belt"></div>
  <div id="action-bar">
    <button id="btn-use" class="hud-btn">Use</button>
    <button id="btn-place" class="hud-btn">Place</button>
    <button id="btn-toss" class="hud-btn">Toss</button>
    <button id="btn-notebook" class="hud-btn">Notebook</button>
    <button id="btn-inspector" class="hud-btn">Inspector</button>
  </div>

  <div id="touch-left"  class="touch-half"></div>
  <div id="touch-right" class="touch-half"></div>

  <div id="toast"></div>

<script>
const canvas = document.getElementById('renderCanvas');
let engine, scene, camera;

/* Toast */
function toast(msg, ms=1500){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', ms);
}

// --- Weather-aware audio (drop-in replacement for AudioSys) ---
const WeatherAudio = (()=> {
  let sceneRef = null;
  let current = null;      // "Clear" | "Rain" | "Snow" | "Blood Moon"
  let fading = false;

  // Tracks we actually have in /assets/audio:
  // - clearWeather.mp3 (calm night)
  // - rainstorm.mp3    (rain + distant thunder bed)
  // - ambient.mp3      (generic hum; we reuse for Snow/Blood layer)
  const tracks = {
    clear:  null,
    rain:   null,
    snow:   null,   // will alias to ambient
    drone:  null    // extra ominous bed layered for Blood Moon
  };

  function ensure(scene){
    if (sceneRef) return;
    sceneRef = scene;
    tracks.clear = new BABYLON.Sound("clear","./assets/audio/clearWeather.mp3",sceneRef,null,{ loop:true, autoplay:false, volume:0.45 });
    tracks.rain  = new BABYLON.Sound("rain","./assets/audio/rainstorm.mp3",sceneRef,null, { loop:true, autoplay:false, volume:0.55 });
    tracks.snow  = new BABYLON.Sound("snow","./assets/audio/ambient.mp3",sceneRef,null,    { loop:true, autoplay:false, volume:0.30 });
    tracks.drone = new BABYLON.Sound("drone","./assets/audio/ambient.mp3",sceneRef,null,    { loop:true, autoplay:false, volume:0.22 });

    // Auto-resume when tab regains focus
    document.addEventListener("visibilitychange", ()=>{
      if (document.hidden) return;
      try {
        BABYLON.Engine.audioEngine?.unlock?.();
        // resume current bed if it was paused
        switch(current){
          case "Clear":      if (!tracks.clear.isPlaying) tracks.clear.play(); break;
          case "Rain":       if (!tracks.rain.isPlaying)  tracks.rain.play();  break;
          case "Snow":       if (!tracks.snow.isPlaying)  tracks.snow.play();  break;
          case "Blood Moon": if (!tracks.rain.isPlaying)  tracks.rain.play();
                             if (!tracks.drone.isPlaying) tracks.drone.play();
                             break;
        }
      } catch {}
    });
  }

  function fadeTo(targetState){
    if (!sceneRef) return;
    if (current === targetState) return;
    if (fading) return;
    fading = true;

    const dur = 800; // ms
    const steps = 16;
    const stepMs = dur/steps;

    // Determine which should be up/down per target
    const want = {
      clear:      (targetState==="Clear"),
      rain:       (targetState==="Rain" || targetState==="Blood Moon"),
      snow:       (targetState==="Snow"),
      drone:      (targetState==="Blood Moon")
    };

    // Start any new ones at volume 0
    if (want.clear && !tracks.clear.isPlaying){ tracks.clear.setVolume(0); tracks.clear.play(); }
    if (want.rain  && !tracks.rain.isPlaying ){ tracks.rain.setVolume(0);  tracks.rain.play(); }
    if (want.snow  && !tracks.snow.isPlaying ){ tracks.snow.setVolume(0);  tracks.snow.play(); }
    if (want.drone && !tracks.drone.isPlaying){ tracks.drone.setVolume(0); tracks.drone.play(); }

    // Target volumes
    const tgt = {
      clear: want.clear ? 0.45 : 0,
      rain:  want.rain  ? 0.55 : 0,
      snow:  want.snow  ? 0.30 : 0,
      drone: want.drone ? 0.22 : 0
    };

    // Capture starting vols
    const start = {
      clear: tracks.clear.getVolume(),
      rain:  tracks.rain.getVolume(),
      snow:  tracks.snow.getVolume(),
      drone: tracks.drone.getVolume()
    };

    let i=0;
    const tick = setInterval(()=>{
      i++;
      const a = i/steps;
      // simple ease
      const ease = (x)=> x<0?0: x>1?1 : (x<0.5? 2*x*x : -1+(4-2*x)*x);

      ["clear","rain","snow","drone"].forEach(k=>{
        const v = start[k] + (tgt[k]-start[k]) * ease(a);
        tracks[k].setVolume(v);
      });

      if (i>=steps){
        clearInterval(tick);
        // stop any fully faded-out tracks
        ["clear","rain","snow","drone"].forEach(k=>{
          if (tgt[k]===0 && tracks[k].isPlaying){ try{ tracks[k].stop(); }catch{} }
        });
        current = targetState;
        fading = false;
      }
    }, stepMs);
  }

  return {
    init(scene){ ensure(scene); },
    set(state){
      try { BABYLON.Engine.audioEngine?.unlock?.(); } catch {}
      fadeTo(state);
    }
  };
})();

function setWeather(state){
  // Route ambience to match weather
  WeatherAudio.set(state);
  // (Optional) If you later add a weather HUD label:
  // const el = document.getElementById('hud-weather');
  // if (el) el.textContent = state;
}
/* ---------------- Belt ---------------- */
const INVENTORY=[{id:"flash",name:"Flashlight"},{id:"uv",name:"UV Light"},{id:"emf",name:"EMF Reader"},{id:"salt",name:"Salt"},{id:"camera",name:"Photo Camera"}];
let activeItemSlot=1;
function rebuildBelt(){
  const belt=document.getElementById('belt'); if(!belt) return; belt.innerHTML="";
  INVENTORY.forEach((it,i)=>{
    const d=document.createElement('div'); d.className='slot'+(i+1===activeItemSlot?' active':''); d.title=it.name;
    const k=document.createElement('div'); k.className='key'; k.textContent=(i+1);
    const l=document.createElement('div'); l.className='label'; l.textContent=it.name;
    d.appendChild(k); d.appendChild(l);
    d.onclick=()=>{ activeItemSlot=i+1; rebuildBelt(); };
    belt.appendChild(d);
  });
}

/* ---------------- Input System ---------------- */
const InputSystem=(()=>{
  let move={x:0,z:0},running=false,lookDelta={x:0,y:0};
  let pointerLocked=false;
  const keys=new Set();
  const keyMap={
    'KeyW':'fw','KeyS':'bk','KeyA':'lt','KeyD':'rt',
    'ArrowUp':'fw','ArrowDown':'bk','ArrowLeft':'lt','ArrowRight':'rt',
    'ShiftLeft':'run','ShiftRight':'run'
  };
  function recomputeMove(){
    const f=(keys.has('fw')?1:0)+(keys.has('bk')?-1:0);
    const r=(keys.has('rt')?1:0)+(keys.has('lt')?-1:0);
    move.z=f; move.x=r; running=keys.has('run');
  }
  function onKey(e,down){
    const tag=keyMap[e.code];
    if(tag){ e.preventDefault(); if(down) keys.add(tag); else keys.delete(tag); recomputeMove(); }
  }
  function bindPointerLock(){
    document.addEventListener('click', ()=>canvas.requestPointerLock?.(), {capture:true});
    document.addEventListener('pointerlockchange', ()=>{ pointerLocked=(document.pointerLockElement===canvas); });
    document.addEventListener('mousemove', e=>{ if(pointerLocked){ lookDelta.x+=e.movementX||0; lookDelta.y+=e.movementY||0; }});
  }
  function bindTouchHalves(){
    const left=document.getElementById('touch-left'), right=document.getElementById('touch-right');
    let leftId=null,leftCenter=null,rightId=null,lastRight=null;
    const DEAD=14,MAX=110;
    function norm(v){ return Math.abs(v)<DEAD?0:v; }
    function clamp(v,m){ return Math.max(-m,Math.min(m,v)); }
    left.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(leftId===null){leftId=t.identifier;leftCenter={x:t.clientX,y:t.clientY};break;}} e.preventDefault();},{passive:false});
    right.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(rightId===null){rightId=t.identifier;lastRight={x:t.clientX,y:t.clientY};break;}} e.preventDefault();},{passive:false});
    window.addEventListener('touchmove',e=>{
      for(const t of e.changedTouches){
        if(t.identifier===leftId&&leftCenter){
          const dx=clamp(t.clientX-leftCenter.x,MAX),dy=clamp(t.clientY-leftCenter.y,MAX);
          move.x=Math.sign(norm(dx)); move.z=dy<0?1:(dy>0?-1:0); e.preventDefault();
        }else if(t.identifier===rightId){
          if(lastRight){ lookDelta.x+=(t.clientX-lastRight.x); lookDelta.y+=(t.clientY-lastRight.y); }
          lastRight={x:t.clientX,y:t.clientY}; e.preventDefault();
        }
      }
    },{passive:false});
    window.addEventListener('touchend',e=>{
      for(const t of e.changedTouches){
        if(t.identifier===leftId){ leftId=null; leftCenter=null; move.x=0; move.z=0; }
        if(t.identifier===rightId){ rightId=null; lastRight=null; }
      } e.preventDefault();
    },{passive:false});
  }
  return {
    init(){ document.addEventListener('keydown',e=>onKey(e,true),{passive:false}); document.addEventListener('keyup',e=>onKey(e,false),{passive:false}); bindPointerLock(); bindTouchHalves(); },
    snapshot(){ const out={moveVec:{x:move.x,z:move.z},running,lookDelta:{x:lookDelta.x,y:lookDelta.y}}; lookDelta.x=0;lookDelta.y=0; return out;}
  };
})();

/* ---------------- Movement & Look ---------------- */
function handleMovementFromInput(input,dt){
  if(!camera) return;
  const speed=input.running?1.8:0.9;
  const fwd=camera.getForwardRay().direction.clone(); fwd.y=0; fwd.normalize();
  const right=BABYLON.Vector3.Cross(fwd,BABYLON.Axis.Y).scale(-1);
  const desired=fwd.scale(input.moveVec.z).add(right.scale(input.moveVec.x));
  if(desired.lengthSquared()>0){ camera.cameraDirection=desired.normalize().scale(speed*dt*60*0.0167);} else camera.cameraDirection=BABYLON.Vector3.Zero();
}
function applyLookFromInput(lookDelta){
  if(!camera) return;
  const sens=0.0026;
  camera.rotation.y+=lookDelta.x*sens;
  const invertY= 1; // FIX: up = up
  const pitch=(camera.rotation.x||0)+(invertY*lookDelta.y*sens*0.85);
  camera.rotation.x=Math.min(Math.PI/2-0.15,Math.max(-Math.PI/2+0.15,pitch));
}

/* ---------------- Loaders ---------------- */
async function loadMap(){ try{ const r=await BABYLON.SceneLoader.ImportMeshAsync("","./assets/models/map/","Abandoned_House.glb",scene); r.meshes.forEach(m=>{m.checkCollisions=true;m.isPickable=true;m.receiveShadows=true;}); }catch(e){ BABYLON.MeshBuilder.CreateGround("g",{width:200,height:200},scene).checkCollisions=true; } }
async function loadMoon(){ try{ const r=await BABYLON.SceneLoader.ImportMeshAsync("","./assets/models/sky/","moon.glb",scene); const moon=r.meshes.find(m=>m.name&&m.name!=="__root__")||r.meshes[0]; if(moon){ moon.name="MoonMesh"; moon.isPickable=false; moon.applyFog=false; moon.renderingGroupId=1; const mat=moon.material||new BABYLON.StandardMaterial("moonMat",scene); mat.disableLighting=true; mat.emissiveColor=new BABYLON.Color3(1,1,1); moon.material=mat; moon.position.copyFromFloats(0,350,380); scene.onBeforeRenderObservable.add(()=>{const t=performance.now()*0.00002; moon.position.x=Math.cos(t)*380; moon.position.z=Math.sin(t)*380; moon.position.y=340+Math.sin(t*1.7)*10;}); } }catch(e){console.warn("Moon load failed",e);} }

/* ---------------- Boot ---------------- */
async function boot(){
  engine=new BABYLON.Engine(canvas,true);
  scene=new BABYLON.Scene(engine);
  scene.gravity=new BABYLON.Vector3(0,-0.5,0); scene.collisionsEnabled=true;
  camera=new BABYLON.UniversalCamera("playerCam",new BABYLON.Vector3(46.16,2,-105.52),scene);
  camera.attachControl(canvas,true); camera.applyGravity=true; camera.checkCollisions=true;
  camera.ellipsoid=new BABYLON.Vector3(0.35,0.9,0.35); camera.ellipsoidOffset=new BABYLON.Vector3(0,0.4,0); camera.minZ=0.1; camera.inertia=0; camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

  scene.clearColor=new BABYLON.Color4(0.01,0.01,0.02,1);
  scene.fogMode=BABYLON.Scene.FOGMODE_EXP2; scene.fogDensity=0.0045; scene.fogColor=new BABYLON.Color3(0.02,0.03,0.05);
  new BABYLON.HemisphericLight("hemi",new BABYLON.Vector3(0,1,0),scene).intensity=0.06;

  await loadMap();
  await loadMoon();

  InputSystem.init(); canvas.focus();
WeatherAudio.init(scene);

  rebuildBelt();

  scene.onBeforeRenderObservable.add(()=>{ const dt=engine.getDeltaTime()/1000; const input=InputSystem.snapshot(); handleMovementFromInput(input,dt); applyLookFromInput(input.lookDelta); const xyz=document.getElementById('hud-xyz'); xyz.style.display='block'; document.getElementById('hud-x').textContent=camera.position.x.toFixed(2); document.getElementById('hud-y').textContent=camera.position.y.toFixed(2); document.getElementById('hud-z').textContent=camera.position.z.toFixed(2); });

  engine.runRenderLoop(()=>scene.render());
  window.addEventListener('resize',()=>engine.resize());
}
/* ---------------- Start ---------------- */
let __started=false;
async function safeStart(){
  if(__started) return;
  __started = true;

  document.getElementById('title-screen').style.display='none';
  await boot();                    // scene now exists

  try { canvas.focus(); } catch {}
  try { BABYLON.Engine.audioEngine?.unlock?.(); } catch {}

  // Pick and apply weather AFTER boot so WeatherAudio has a scene
  const r = Math.random();
  const w = r < 0.40 ? 'Clear'
          : r < 0.70 ? 'Rain'
          : r < 0.88 ? 'Snow'
          :           'Blood Moon';
  setWeather(w);
}
</style>
</body>
</html>
