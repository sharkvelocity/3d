<!DOCTYPE html> <html lang="en"> <head> <meta charset="utf-8" /> <title>index3 — merged (index + index3)</title> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" /> <!-- Babylon.js stack from local ./cdn --> <script src="./cdn/babylon.js"></script> <script src="./cdn/earcut.min.js"></script> <script src="./cdn/meshopt_decoder.js"></script> <script src="./cdn/draco_decoder_gltf.js"></script> <script src="./cdn/loaders/babylon.glTF2FileLoader.js"></script> <script src="./cdn/loaders/babylonjs.loaders.min.js"></script> <script src="./cdn/gui/babylon.gui.min.js"></script> <script src="./cdn/serializers/babylonjs.serializers.min.js"></script> <script src="./cdn/inspector/babylon.inspector.bundle.js"></script> <style> :root{ --bg:#05080e; --panel:#0e1620; --glow:#3ddc97; --border:#1a2a3c; --fg:#e6f1ff; --muted:#94a9c3; --warn:#ffb020; --danger:#ff6b6b; --accent:#58a6ff; } *{box-sizing:border-box} html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial} /* Stage */ #stage{position:fixed;inset:0;background:#000} #c{width:100%;height:100%;display:block} /* Loader */ #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px; background:radial-gradient(900px 500px at 50% 30%, #0b1522 0%, #05080e 60%, #000 100%);z-index:10} #start h1{font-size:16px;margin:0;color:#cfe6ff;letter-spacing:.4px} #start button{padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:#111c2a;color:#dff; cursor:pointer;font-weight:700} #start .bar{width:340px;height:10px;border-radius:999px;border:1px solid var(--border);overflow:hidden;display:none} #start .fill{height:100%;width:0;background:linear-gradient(90deg,#58a6ff,#7ee787)} #status{font:12px/1.2 ui-monospace,monospace;color:#9ad8ff;opacity:.9} /* HUD */ #hud{position:fixed;left:12px;top:12px;display:grid;grid-template-columns:auto auto;gap:8px 12px;align-items:center;z-index:3} #hud .card{padding:6px 10px;background:#0a1220cc;border:1px solid var(--border);border-radius:10px;font-size:12px;backdrop-filter:blur(3px)} #xyz{position:fixed;right:12px;bottom:76px;padding:6px 10px;background:#0a1220cc;border:1px solid var(--border);border-radius:10px;font:12px/1.2 ui-monospace,monospace;z-index:3} /* Controls row */ #controls{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;display:flex;gap:8px;z-index:3} .btn{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:#101a2a;color:#dff;min-width:72px;cursor:pointer} /* Item Belt (keep from index3) */ #itemBar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:8px;padding:8px 10px; background:#0b111bcc;border:1px solid var(--border);border-radius:12px;z-index:3} .slot{width:48px;height:48px;border-radius:10px;border:1px solid var(--border);background:#0e1622;display:grid;place-items:center;cursor:pointer} .slot.active{outline:2px solid var(--accent)} .slot img{max-width:36px;max-height:36px;opacity:.9} /* Storage modal (keep from index3, re-styled) */ #storage{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:5} #storage .panel{width:520px;max-width:90vw;max-height:80vh;overflow:auto;background:#0b111bcc;border:1px solid var(--border); border-radius:12px;padding:12px} #storage h3{margin:0 0 8px 0;font-size:14px;color:#9fd4ff;letter-spacing:.8px} #storage .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px} #storage .it{padding:8px;border:1px solid var(--border);border-radius:10px;background:#0e1622;cursor:pointer;text-align:center} #storage .it.sel{outline:2px solid var(--glow)} /* Panels */ .panelUI{position:fixed;right:12px;top:12px;width:360px;max-height:70vh;overflow:auto;background:#0b111bcc;border:1px solid var(--border); border-radius:12px;padding:10px;z-index:3;display:none} .panelUI h3{margin:0 0 8px 0;font-size:13px;color:#9fd4ff;text-transform:uppercase;letter-spacing:1px} .row{display:flex;align-items:center;gap:8px;margin:6px 0} .fld{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:#0c1422;color:#dff} #drop{position:fixed;inset:50px;border:2px dashed #275186;border-radius:12px;color:#9cc7ff;display:none;align-items:center;justify-content:center;background:rgba(39,81,134,.12);z-index:4} /* Inspector z-index fix */ .babylon-inspector{z-index:9999 !important} </style> </head> <body> <div id="stage"><canvas id="c"></canvas></div> <!-- Loader --> <div id="start"> <h1>PhasmaPhoney</h1> <button id="btnStart">Start Investigation</button> <div class="bar" id="bar"><div class="fill" id="fill"></div></div> <div id="status"></div> </div> <!-- HUD --> <div id="hud"> <div class="card">Map: <span id="mapName">—</span></div> <div class="card">Weather: <span id="weather">—</span></div> <div class="card">Hunt: <span id="hunt">Calm</span></div> <div class="card">Room: <span id="room">Van</span></div> <div class="card">Sanity: <span id="sanity">100%</span></div> </div> <div id="xyz">XYZ: 0, 0, 0</div> <!-- Controls --> <div id="controls"> <button class="btn" id="btnUse">Use</button> <button class="btn" id="btnPlace">Place</button> <button class="btn" id="btnToss">Toss</button> <button class="btn" id="btnLighter">Lighter</button> <button class="btn" id="btnNotebook">Notebook</button> <button class="btn" id="btnInspector">Inspector</button> </div> <!-- Item Bar (keep) --> <div id="itemBar"></div> <!-- Storage Modal (keep) --> <div id="storage"> <div class="panel"> <h3>Choose Your Loadout (pick up to 3)</h3> <div id="storeGrid" class="grid"></div> <div class="row" style="justify-content:flex-end"> <button class="btn" id="storeCancel">Cancel</button> <button class="btn" id="storeConfirm">Confirm</button> </div> </div> </div> <!-- Evidence Panel (from index) --> <div id="evidence" class="panelUI"> <h3>Evidence</h3> <div class="row" style="flex-wrap:wrap;gap:6px"> <button class="btn">Where are you?</button> <button class="btn">How old are you?</button> <button class="btn">Are you friendly?</button> <button class="btn">Give us a sign</button> <button class="btn">Can you speak?</button> <button class="btn">Do you want us here?</button> </div> <div class="row" style="justify-content:flex-end"><button class="btn" id="btnCloseEvidence">Close</button></div> </div> <!-- GLB Viewer Panel --> <div id="glb" class="panelUI"> <h3>GLB Viewer</h3> <div class="row"><input id="glbUrl" class="fld" placeholder="Paste .glb/.gltf URL…" /><button class="btn" id="glbLoad">Load</button><label class="btn" for="glbFile">Choose File…</label><input type="file" id="glbFile" accept=".glb,.gltf" style="display:none"/></div> <div id="drop">Drop a .glb/.gltf file here…</div> <div class="row" style="justify-content:flex-end"><button class="btn" id="glbClose">Close ✕</button></div> </div> <script> // ==== Namespaces =========================================================== window.PP = window.PP || {}; // global project namespace PP.cfg = PP.cfg || {}; PP.state = PP.state || { started:false, sprint:false, sanity:100, weather:'Rain', hunt:'Calm', room:'Van' }; PP.items = PP.items || {}; // registry of item defs PP.util = PP.util || {}; PP.hooks = PP.hooks || {}; // extension hooks (ghost logic etc.) // ==== Babylon core ======================================================== const canvas = document.getElementById('c'); const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true }); const scene = new BABYLON.Scene(engine); window.scene = scene; scene.useRightHandedSystem = true; scene.createDefaultEnvironment({ createGround:false, createSkybox:false }); scene.clearColor = new BABYLON.Color4(0,0,0,1); const camera = new BABYLON.UniversalCamera('cam', new BABYLON.Vector3(0, 1.8, 0), scene); camera.attachControl(canvas, true); camera.speed = 0.22; camera.inertia = 0.6; camera.minZ = 0.05; scene.activeCamera = camera; const light = new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0.25,1,0.25), scene); light.intensity = 0.95; // ==== HUD binds =========================================================== const hud = { mapName: document.getElementById('mapName'), weather: document.getElementById('weather'), hunt: document.getElementById('hunt'), room: document.getElementById('room'), sanity: document.getElementById('sanity'), xyz: document.getElementById('xyz'), }; // ==== Loader UI =========================================================== const startPane = document.getElementById('start'); const btnStart = document.getElementById('btnStart'); const bar = document.getElementById('bar'); const fill = document.getElementById('fill'); const status = document.getElementById('status'); function setProgress(p, msg){ fill.style.width = (p*100).toFixed(1)+'%'; if(msg) status.textContent = msg; } btnStart.onclick = async ()=>{ btnStart.disabled = true; bar.style.display = 'block'; status.textContent = 'Initializing…'; await boot(); startPane.style.display = 'none'; PP.state.started = true; }; // ==== Config & Map ======================================================== PP.cfg.spawnWS = new BABYLON.Vector3(47.52, 0.22, -105.28); // keep index3 spawn window.MAP_DEF = window.MAP_DEF || { title: "Merged House", file: "Abandoned_House.glb", scale: 1, rotationY: 0, offset: {x:0,y:0,z:0}, exterior: [ {x:-30,z:-30}, {x:30,z:-30}, {x:30,z:30}, {x:-30,z:30} ] }; hud.mapName.textContent = MAP_DEF.title; function toRad(d){ return d*Math.PI/180; } function localToWorld(p, def){ const s = (def?.scale ?? 1), yaw = toRad(def?.rotationY ?? 0); const cos=Math.cos(yaw), sin=Math.sin(yaw); const x=(p?.x??0)*s, y=(p?.y??0)*s, z=(p?.z??0)*s; const xr = x*cos - z*sin, zr = x*sin + z*cos; return new BABYLON.Vector3((def?.offset?.x??0)+xr, (def?.offset?.y??0)+y, (def?.offset?.z??0)+zr); } // ==== Storage (keep) ====================================================== PP.storage = PP.storage || (function(){ const KEY_INV = 'pp_inventory_v1'; const KEY_FLAGS = 'pp_flags_v1'; function get(key, def){ try{ return JSON.parse(localStorage.getItem(key)) ?? def; }catch(e){ return def; } } function set(key, val){ localStorage.setItem(key, JSON.stringify(val)); return val; } return { saveInventory: inv => set(KEY_INV, inv), loadInventory: () => get(KEY_INV, {slots:[], equipped:0}), getFlag: (k, d=false)=>{ const f=get(KEY_FLAGS,{}); return k in f?f[k]:d; }, setFlag: (k, v)=>{ const f=get(KEY_FLAGS,{}); f[k]=v; set(KEY_FLAGS,f); } }; })(); // ==== Item defs (minimal — extend with your real list) ==================== const ITEM_DEFS = [ {id:'emf', name:'EMF Reader', icon:'./assets/icons/emf.png'}, {id:'spirit', name:'Spirit Box', icon:'./assets/icons/spirit.png'}, {id:'uv', name:'UV Light', icon:'./assets/icons/uv.png'}, {id:'cam', name:'Photo Cam', icon:'./assets/icons/camera.png'}, {id:'salt', name:'Salt', icon:'./assets/icons/salt.png'}, {id:'lighter', name:'Lighter', icon:'./assets/icons/lighter.png'}, {id:'notebook', name:'Notebook', icon:'./assets/icons/notebook.png'}, ]; // ==== Storage modal UI (keep) ============================================ const storageEl = document.getElementById('storage'); const storeGrid = document.getElementById('storeGrid'); const storeConfirm = document.getElementById('storeConfirm'); const storeCancel = document.getElementById('storeCancel'); let selectedIDs = new Set(); function openStorage(){ storeGrid.innerHTML = ''; selectedIDs = new Set(PP.storage.loadInventory().slots); for (const it of ITEM_DEFS){ const cell = document.createElement('div'); cell.className = 'it' + (selectedIDs.has(it.id) ? ' sel':''); cell.dataset.id = it.id; cell.innerHTML = `<img src="${it.icon}" alt="" style="display:block;margin:0 auto 6px;max-width:48px;max-height:48px"><div style="font-size:12px">${it.name}</div>`; cell.onclick = ()=>{ if (selectedIDs.has(it.id)) { selectedIDs.delete(it.id); cell.classList.remove('sel'); } else { if (selectedIDs.size>=3) return; selectedIDs.add(it.id); cell.classList.add('sel'); } }; storeGrid.appendChild(cell); } storageEl.style.display = 'flex'; } storeCancel.onclick = ()=> storageEl.style.display='none'; storeConfirm.onclick = ()=>{ const slots = Array.from(selectedIDs); PP.storage.saveInventory({slots, equipped:0}); rebuildBelt(slots); storageEl.style.display='none'; }; // ==== Item belt (keep visual; drive with newer logic) ===================== const itemBar = document.getElementById('itemBar'); function rebuildBelt(slots){ itemBar.innerHTML = ''; slots.forEach((id, i)=>{ const def = ITEM_DEFS.find(d=>d.id===id) || {icon:'', name:id}; const s = document.createElement('div'); s.className = 'slot' + (i===0 ? ' active':''); s.title = def.name; s.innerHTML = def.icon ? `<img src="${def.icon}" alt="">` : `<span style="font-size:10px">${def.name}</span>`; s.onclick = ()=> setEquipped(i); itemBar.appendChild(s); }); } function setEquipped(i){ const inv = PP.storage.loadInventory(); inv.equipped = Math.max(0, Math.min(i, inv.slots.length-1)); PP.storage.saveInventory(inv); itemBar.querySelectorAll('.slot').forEach((el, idx)=> el.classList.toggle('active', idx===inv.equipped)); } function cycleSlot(dir){ const inv = PP.storage.loadInventory(); if (inv.slots.length===0) return; inv.equipped = (inv.equipped + (dir>0?1:-1) + inv.slots.length) % inv.slots.length; PP.storage.saveInventory(inv); itemBar.querySelectorAll('.slot').forEach((el, idx)=> el.classList.toggle('active', idx===inv.equipped)); } window.addEventListener('wheel', (e)=>{ if (e.deltaY>0) cycleSlot(+1); else cycleSlot(-1); }, {passive:true}); // ==== Map load ============================================================ async function loadMap(){ setProgress(0.05,'Loading map…'); try{ const ctn = await BABYLON.SceneLoader.LoadAssetContainerAsync("./assets/models/map/", MAP_DEF.file, scene); ctn.addAllToScene(); setProgress(0.35,'Map added'); forceSpawn(); // keep index3 spawn scatterItems(); // keep index3 random items exteriorRain(); // world-anchored rain ensureAmbience(); // ambient/rain sounds }catch(e){ console.error(e); status.textContent='Map load failed'; throw e; } } // ==== Spawn (keep index3) ================================================= function forceSpawn(){ camera.position.copyFrom(PP.cfg.spawnWS); camera.setTarget(PP.cfg.spawnWS.add(new BABYLON.Vector3(0,1,2))); } // ==== Random Item Scatter (keep) ========================================== function scatterItems(){ // minimal placeholder: drop icons in space near van; replace with your real item meshes const inv = PP.storage.loadInventory(); if (!inv.slots.length) return; const base = PP.cfg.spawnWS; inv.slots.forEach((id, idx)=>{ const node = new BABYLON.TransformNode('item_'+id, scene); node.position = new BABYLON.Vector3(base.x+1.2+0.6*idx, base.y+0.1, base.z-1.5); }); } // ==== Exterior rain (world-anchored) ====================================== function exteriorRain(){ const ext = (window.MAP_DEF && Array.isArray(window.MAP_DEF.exterior)) ? MAP_DEF.exterior : null; if (!ext || ext.length<3) return; const likelyLocal = Math.max(...ext.map(p=>Math.abs(p.x))) < 100 && Math.max(...ext.map(p=>Math.abs(p.z))) < 100; const poly = likelyLocal ? ext.map(p=>localToWorld(p, MAP_DEF)) : ext.map(p=>new BABYLON.Vector3(p.x,0,p.z)); let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity; for(const v of poly){ minX=Math.min(minX,v.x); maxX=Math.max(maxX,v.x); minZ=Math.min(minZ,v.z); maxZ=Math.max(maxZ,v.z); } function inside(px,pz){ let ok=false; for(let i=0,j=poly.length-1;i<poly.length;j=i){ const A=poly[i], B=poly[j]; const hit=((A.z>pz)!=(B.z>pz)) && (px < (B.x-A.x)*(pz-A.z)/((B.z-A.z)||1e-9)+A.x); if(hit) ok=!ok; } return ok; } const tpl = new BABYLON.ParticleSystem("rain_template", 2000, scene); tpl.particleTexture = new BABYLON.Texture("./assets/textures/rain.png", scene, true, false); tpl.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD; tpl.isBillboardBased = true; tpl.updateSpeed=0.02; tpl.minSize=0.05; tpl.maxSize=0.15; tpl.minEmitPower=4; tpl.maxEmitPower=7; tpl.gravity = new BABYLON.Vector3(0,-9.81,0); const STEP=6, YTOP=14, EMIT=5, MAXR=60; const centers=[]; for(let x=minX;x<=maxX;x+=STEP){ for(let z=minZ;z<=maxZ;z+=STEP){ if(inside(x,z)) centers.push(new BABYLON.Vector3(x,YTOP,z)); } } const emitters=[]; for(const c of centers){ const node=new BABYLON.TransformNode("rain_emitter",scene); node.position.copyFrom(c); const ps=tpl.clone("rain_ps",node); ps.isLocal=false; ps.emitter=node; ps.createBoxEmitter(new BABYLON.Vector3(-EMIT,0,-EMIT),new BABYLON.Vector3(EMIT,0,EMIT),new BABYLON.Vector3(0,-1,0),0,0); emitters.push({node,ps}); } scene.onBeforeRenderObservable.add(()=>{ const p=camera.position; const r2=MAXR*MAXR; for(const e of emitters){ const d2=BABYLON.Vector3.DistanceSquared(p,e.node.position); const on=d2<r2; if(on && !e.ps.isStarted()) e.ps.start(); else if(!on && e.ps.isStarted()) e.ps.stop(); } }); } // ==== Foliage non-collision (from earlier) ================================ const NO_COLLIDE_HINTS = ['grass','bush','plant','tree','leaf','foliage','hedge','shrub','vine','flower','weed','debris','paper','trash','wire','rope','net','fence','twigs','bamboo']; function makeFoliageNonBlocking(){ const re = new RegExp('(' + NO_COLLIDE_HINTS.map(x=>x.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')).join('|') + ')', 'i'); for (const m of scene.meshes){ if (!m || !m.name) continue; if (re.test(m.name)){ m.checkCollisions = false; m.isPickable = false; if (m.physicsImpostor) try{ m.physicsImpostor.dispose(); }catch{} } } } // ==== Sounds (keep ambient/rain) ========================================== function ensureAmbience(){ const hasAmb = (scene.soundTracks||[]).some(tr => (tr.soundCollection||[]).some(a=>/ambient|wind|outside/i.test(a.name||''))); if (!hasAmb){ try{ new BABYLON.Sound('ambient_default','./audio/ambient_outside.mp3',scene,null,{loop:true,autoplay:true,volume:0.25}); }catch{} } const hasRainPS = (scene.particleSystems||[]).some(ps=>/rain/i.test(ps.name||'')); const hasRainSnd = (scene.soundTracks||[]).some(tr => (tr.soundCollection||[]).some(a=>/rain/i.test(a.name||''))); if (hasRainPS && !hasRainSnd){ try{ new BABYLON.Sound('rain_loop','./audio/rain_loop.mp3',scene,null,{loop:true,autoplay:true,volume:0.35}); }catch{} } } // ==== Evidence/Notebook panel toggles ==================================== document.getElementById('btnNotebook').onclick = ()=>{ const el = document.getElementById('evidence'); el.style.display = (el.style.display==='block'?'none':'block'); }; document.getElementById('btnCloseEvidence').onclick = ()=> document.getElementById('evidence').style.display='none'; // ==== Inspector toggle ===================================================== document.getElementById('btnInspector').onclick = ()=>{ if (scene.debugLayer.isVisible()) scene.debugLayer.hide(); else scene.debugLayer.show({overlay:true}); }; // ==== Controls: Use/Place/Toss/Lighter (stubs) ============================ document.getElementById('btnUse').onclick = ()=> console.log('Use'); document.getElementById('btnPlace').onclick = ()=> console.log('Place'); document.getElementById('btnToss').onclick = ()=> console.log('Toss'); document.getElementById('btnLighter').onclick = ()=> console.log('Lighter'); // ==== Telemetry HUD updates =============================================== engine.runRenderLoop(()=>{ scene.render(); const p = scene.activeCamera.position; hud.xyz.textContent = `XYZ: ${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)}`; }); window.addEventListener('resize', ()=> engine.resize()); // ==== Boot ================================================================= async function boot(){ setProgress(0.02,'Creating scene…'); await loadMap(); setProgress(0.7,'Applying world fx…'); makeFoliageNonBlocking(); setProgress(0.9,'Finalizing…'); // Open storage once on first run const inv = PP.storage.loadInventory(); if (!inv.slots.length){ openStorage(); } setProgress(1,'Ready'); } </script> </body> </html>
