<script>
// Safe queue for callbacks before Babylon 'scene' exists
window.__pendingOBR = window.__pendingOBR || [];
window.onBeforeRenderAdd = function(cb){
  if (window.scene && scene.onBeforeRenderObservable) {
    try { return onBeforeRenderAdd(cb); } catch(e) { try { console.warn(e); } catch(_) {} }
  } else {
    window.__pendingOBR.push(cb);
    return null;
  }
};
// When scene becomes available, flush pending once
(function flushWhenReady(){
  if (window.scene && scene.onBeforeRenderObservable) {
    var list = window.__pendingOBR || [];
    for (var i=0;i<list.length;i++){ try{ onBeforeRenderAdd(list[i]); } catch(e){} }
    window.__pendingOBR = [];
  } else {
    setTimeout(flushWhenReady, 120);
  }
})();
</script>

<script>
/*** ==========================================================
    UTILITIES
    ========================================================== ***/
function toast(msg, ms=1500){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', ms);
}
function pointInPolyXZ(p, poly){
  if(!poly || !poly.length) return false;
  let inside = false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x, zi=poly[i].z, xj=poly[j].x, zj=poly[j].z;
    const intersect = ((zi>p.z)!==(zj>p.z)) && (p.x < (xj-xi)*(p.z-zi)/(((zj-zi)||1e-9)) + xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
</script>
<script>
  // -------------- LOADER
const Loader = (() => {
  // Resolve elements no matter which ID set you use.
  const box  = () =>
      document.getElementById('loading-box')
   || document.getElementById('bar')
   || document.querySelector('#start .bar')       // common layout
   || document.querySelector('#start #loading-box');

  const text = () =>
      document.getElementById('loading-text')
   || document.getElementById('status')
   || document.querySelector('#start #status');

  const fill = () =>
      document.getElementById('loading-fill')
   || document.getElementById('fill')
   || (box() ? box().querySelector('.fill') : null);

  let totalWeight = 0;
  let progressed  = 0;
  const queue = [];

  function show(){ const b=box(); if (b) b.style.display='flex'; }
  function hide(){ const b=box(); if (b) b.style.display='none'; }
  function label(s){ const t=text(); if (t) t.textContent = s ?? ''; }

  function pct01(){
    return totalWeight ? Math.max(0, Math.min(1, progressed / totalWeight)) : 0;
  }
  function draw(){
    const f = fill(); if (!f) return;            // guard prevents the crash
    f.style.width = (pct01() * 100).toFixed(1) + '%';
  }

  function addStep(label, fnOrPromise, weight=1){
    queue.push({label, run: fnOrPromise, weight});
    totalWeight += weight;
  }

  async function run(){
    // Loader is shown by safeStart()
    for (const step of queue){
      label(step.label);
      draw();
      try{
        if (typeof step.run === 'function') {
          const maybe = step.run();
          if (maybe && typeof maybe.then === 'function') await maybe;
        } else if (step.run && typeof step.run.then === 'function') {
          await step.run;
        }
      } catch(e){
        console.warn('Loader step failed:', step.label, e);
        label(step.label + ' — failed, continuing…');
        await new Promise(r=>setTimeout(r, 250));
      }
      progressed += step.weight;
      draw();
    }
    label('Finalizing…');
    progressed = totalWeight; draw();
    await new Promise(r=>setTimeout(r, 150));
    hide();
  }

  function wrap(labelText, weight, fn){
    addStep(labelText, async ()=>{ await fn(); }, weight);
  }

  function reset(){
    queue.length = 0; totalWeight = 0; progressed = 0; draw();
  }

  return { addStep, run, wrap, show, hide, label, draw, reset };
})();
</script>
<script>
/*** ==========================================================
    INSPECTOR TOP-MOST ENSURER
    ========================================================== ***/
/** Ensure Babylon Inspector stays above everything on the page */
(function setupInspectorTopmost(){
  let host = document.getElementById('inspector-topmost-host');
  if(!host){
    host = document.createElement('div');
    host.id = 'inspector-topmost-host';
    document.body.appendChild(host);
  }

  function elevateInspectorHost(){
    const nodes = Array.from(document.querySelectorAll(
      'iframe[id*="inspector"],iframe[src*="inspector"],div[id*="inspector"],div[class*="inspector"]'
    ));
    nodes.forEach(el => {
      try {
        el.style.zIndex = '2147483647';
        el.style.position = 'fixed';
      } catch(_) {}
    });
  }

  const mo = new MutationObserver(() => elevateInspectorHost());
  mo.observe(document.documentElement, { childList:true, subtree:true });
  window.__elevateInspectorHost = elevateInspectorHost;
})();
</script>

<script>
/*** ==========================================================
    SIMPLE AUDIO HELPERS
    ========================================================== ***/
const WeatherAudio = (()=>{
  let sceneRef=null, current=null;
  const tracks={ clear:null, rain:null, snow:null, drone:null };

  function ensure(scene){
    if(sceneRef) return;
    sceneRef = scene;
    tracks.clear = new BABYLON.Sound("clear","./assets/audio/clearWeather.mp3",sceneRef,null,{ loop:true, autoplay:false, volume:0.45 });
    tracks.rain  = new BABYLON.Sound("rain","./assets/audio/rainstorm.mp3",sceneRef,null, { loop:true, autoplay:false, volume:0.55 });
    tracks.snow  = new BABYLON.Sound("snow","./assets/audio/ambient.mp3",sceneRef,null,    { loop:true, autoplay:false, volume:0.28 });
    tracks.drone = new BABYLON.Sound("drone","./assets/audio/ambient.mp3",sceneRef,null,   { loop:true, autoplay:false, volume:0.18 });
  }

  function fadeTo(target){
    if(!sceneRef) return;
    if(current===target) return;

    const want={ clear:(target==='Clear'||target==='Sunset'), rain:(target==='Rain'||target==='Blood Moon'), snow:target==='Snow', drone:target==='Blood Moon' };
    for(const k of Object.keys(tracks)){
      const snd = tracks[k];
      if(!snd) continue;
      const tgt = (k==='clear'&&want.clear)?0.45:
                  (k==='rain' &&want.rain )?0.55:
                  (k==='snow' &&want.snow )?0.28:
                  (k==='drone'&&want.drone)?0.18:0.0;
      if(tgt>0){ if(!snd.isPlaying) { try{snd.setVolume(0); snd.play(); } catch(e){}} }
      const start = snd.getVolume();
      let i=0, steps=18, stepMs=40;
      const id=setInterval(()=>{
        i++; const a=i/steps; const ease=(x)=>x<.5?2*x*x:-1+(4-2*x)*x;
        snd.setVolume(start + (tgt-start)*ease(a));
        if(i>=steps){ clearInterval(id); if(tgt===0 && snd.isPlaying) try{snd.stop(); } catch(e){}}
      }, stepMs);
    }
    current=target;
  }
  return { init:(s)=>ensure(s), set:(state)=>{ try{BABYLON.Engine.audioEngine?.unlock?.();} catch(e){}fadeTo(state);} };
})();
</script>

<script>
/*** ==========================================================
    BELT UI + HELD LIGHTS
    ========================================================== ***/
function itemById(id){ return ALL_ITEMS.find(x=>x.id===id); }

function rebuildBelt(){
  const el=document.getElementById('belt'); el.innerHTML='';
  belt.forEach((id,i)=>{
    const d=document.createElement('div'); d.className='slot'+(i===activeSlot?' active':'');
    const item=itemById(id);
    d.innerHTML = `<div class="label">${item?.name||id}</div>`;
    d.onclick=()=>{ activeSlot=i; rebuildBelt(); };
    d.oncontextmenu=(e)=>{ e.preventDefault(); cycleSlot(i); };
    el.appendChild(d);
  });
}
function cycleSlot(i){
  const idx = ALL_ITEMS.findIndex(x=>x.id===belt[i]);
  let j=(idx+1)%ALL_ITEMS.length;
  for(let k=0;k<ALL_ITEMS.length;k++){
    const cand = ALL_ITEMS[j].id;
    if(!belt.includes(cand)){ belt[i]=cand; break; }
    j=(j+1)%ALL_ITEMS.length;
  }
  rebuildBelt();
}
function activeItem(){ return itemById(belt[activeSlot]); }

// Held lights
function ensureHeldFlash(){
  if(!held.light){
    held.light = new BABYLON.SpotLight("handFlash", new BABYLON.Vector3(0,1.6,0), new BABYLON.Vector3(0,0,1), Math.PI/6, 12, scene);
    held.light.intensity = 0; held.light.range = 28;
  }
  return held.light;
}
function ensureHeldUV(){
  if(!held.uvLight){
    held.uvLight = new BABYLON.SpotLight("handUV", new BABYLON.Vector3(0,1.6,0), new BABYLON.Vector3(0,0,1), Math.PI/7.5, 10, scene);
    held.uvLight.diffuse = new BABYLON.Color3(0.7,0.35,1.0);
    held.uvLight.specular = new BABYLON.Color3(0.25,0.15,0.5);
    held.uvLight.intensity = 0; held.uvLight.range = 18;
  }
  return held.uvLight;
}
function ensureHeldLighter(){
  if(!held.lighter){
    held.lighter = new BABYLON.PointLight("handLighter", new BABYLON.Vector3(0,1.6,0), scene);
    held.lighter.intensity = 0; held.lighter.range = 6;
  }
  return held.lighter;
}
function toggleFlash(){ const l=ensureHeldFlash(); l.intensity = (l.intensity>0?0:2.2); toast(l.intensity>0?'Flashlight ON':'Flashlight OFF'); }
function toggleUV(){ const u=ensureHeldUV(); u.intensity = (u.intensity>0?0:1.3); toast(u.intensity>0?'UV ON':'UV OFF'); }
function toggleLighter(){ lighterOn=!lighterOn; const li=ensureHeldLighter(); li.intensity = (lighterOn) ? 0.85 : 0; toast(lighterOn?'Lighter ON':'Lighter OFF'); }

// ===== SALT System =====
const SALT_LINES = [];
let saltCharges = 6;
function _aimPointOnGround(maxDist=3.5){
  const origin = camera.position.clone();
  const dir = camera.getForwardRay().direction.clone();
  const ray = new BABYLON.Ray(origin, dir, maxDist);
  const pick = scene.pickWithRay(ray, m=>m && m.isPickable!==false);
  if(pick && pick.hit) return pick.pickedPoint;
  const ahead = origin.add(dir.scale(Math.min(maxDist, 3.5)));
  ahead.y = 0.02; return ahead;
}
function placeSalt(){
  if(saltCharges<=0){ toast('Out of salt'); return; }
  const center = _aimPointOnGround(3.8);
  const yaw = Math.atan2(camera.getForwardRay().direction.z, camera.getForwardRay().direction.x);
  const half = 0.6;
  const a = new BABYLON.Vector3(center.x - Math.cos(yaw)*half, 0.01, center.z - Math.sin(yaw)*half);
  const b = new BABYLON.Vector3(center.x + Math.cos(yaw)*half, 0.01, center.z + Math.sin(yaw)*half);
  const path = [a, b];
  const mesh = BABYLON.MeshBuilder.CreateTube("salt_line", {path, radius:0.05, tessellation:4}, scene);
  const mat = new BABYLON.StandardMaterial("salt_mat", scene);
  mat.diffuseColor = new BABYLON.Color3(0.95,0.95,0.95);
  mat.specularColor = new BABYLON.Color3(0.2,0.2,0.2);
  mat.emissiveColor = new BABYLON.Color3(0.05,0.05,0.05);
  mat.alpha = 0.9;
  mesh.material = mat;
  SALT_LINES.push({mesh, a, b, disturbed:false, mat});
  saltCharges--;
  try{ mesh.receiveShadows = true; if(sunShadows) sunShadows.addShadowCaster(mesh, true); if(moonShadows) moonShadows.addShadowCaster(mesh, true); }catch(e){}
  toast('Salt line placed ('+saltCharges+' left)');
}
function _pointToSegmentDistance(p, a, b){
  const ap = p.subtract(a);
  const ab = b.subtract(a);
  const ab2 = ab.x*ab.x + ab.z*ab.z + 1e-9;
  const t = Math.max(0, Math.min(1, (ap.x*ab.x + ap.z*ab.z) / ab2));
  const proj = new BABYLON.Vector3(a.x + ab.x*t, p.y, a.z + ab.z*t);
  const dx = p.x - proj.x, dz = p.z - proj.z;
  return Math.sqrt(dx*dx + dz*dz);
}
</script>

<script>
/*** ==========================================================
    UV FOOTPRINTS
    ========================================================== ***/
function spawnUVFootprints(origin, count=2, step=0.35){
  for(let i=0;i<count;i++){
    const quad = BABYLON.MeshBuilder.CreatePlane("uv_foot_"+i, {size:0.18}, scene);
    quad.rotation.x = Math.PI/2;
    quad.position = new BABYLON.Vector3(origin.x + (Math.random()-0.5)*0.3 + i*step*0.6, origin.y+0.02, origin.z + (Math.random()-0.5)*0.3 + i*step);
    quad.isPickable=false;
    const m = new BABYLON.StandardMaterial("uv_mat_"+Math.random(), scene);
    m.diffuseColor = new BABYLON.Color3(0.6,0.3,1.0);
    m.emissiveColor = new BABYLON.Color3(0.2,0.1,0.6);
    m.specularColor = new BABYLON.Color3(0,0,0);
    m.alpha = 0.0;
    quad.material = m;
    let t=0; const fadeIn = onBeforeRenderAdd(()=>{
      t += engine.getDeltaTime()/1000; m.alpha = Math.min(0.9, t*3);
      if(m.alpha>=0.9) scene.onBeforeRenderObservable.remove(fadeIn);
    });
    setTimeout(()=>{
      let f=1;
      const h = onBeforeRenderAdd(()=>{
        f -= engine.getDeltaTime()/3; m.alpha = Math.max(0, f*0.9);
        if(m.alpha<=0){ scene.onBeforeRenderObservable.remove(h); try{quad.dispose(); } catch(e){}}
      });
    }, 60000);
  }
}
</script>

<script>
/*** ==========================================================
    DISTURB SALT (UV gated + Wraith/Obake rules)
    ========================================================== ***/
function disturbSaltAt(pos){
  if((ghost?.type||'').toLowerCase()==='wraith') return;
  for(const s of SALT_LINES){
    if(s.disturbed) continue;
    const d = _pointToSegmentDistance(pos, s.a, s.b);
    if(d < 0.18){
      s.disturbed = true;
      try{
        const ps = new BABYLON.ParticleSystem("saltPuff", 400, scene);
        ps.particleTexture = new BABYLON.Texture("./assets/images/particles/smoke.png", scene);
        ps.emitter = s.mesh;
        ps.minSize = 0.02; ps.maxSize = 0.08;
        ps.minEmitPower = 0.4; ps.maxEmitPower = 1.0;
        ps.emitRate = 600; ps.targetStopDuration = 0.35;
        ps.color1 = new BABYLON.Color4(1,1,1,0.8);
        ps.color2 = new BABYLON.Color4(1,1,1,0.4);
        ps.colorDead = new BABYLON.Color4(1,1,1,0);
        ps.start();
        setTimeout(()=>{ try{ps.stop(); ps.dispose(); } catch(e){} }, 800);
      } catch(e) {}
      try{ s.mat.emissiveColor = new BABYLON.Color3(0.01,0.01,0.01); s.mat.alpha = 0.8; } catch(e){}
      if (_shouldLeaveUVFromSalt()){
        try{ spawnUVFootprints(pos, 2, 0.4); } catch(e) {}
      }
    }
  }
}
</script>

<script>
/*** ==========================================================
    INPUT (KBD/Touch) + PICKUP + NOCLIP + MOUSE LOOK
    ========================================================== ***/
const InputSystem = (()=>{
  let move={x:0,y:0,z:0}, running=false, lookDelta={x:0,y:0};
  const keys = new Set();
  let isTouchMode=false;
  let _tapSprint=false;
  let _analogScale=1.0;

  // Normalize keys from both e.code and e.key
  function mapKey(e){
    const k = (e.key||'').toLowerCase();
    const c = e.code||'';
    if (c==='KeyW' || k==='w' || c==='ArrowUp')    return 'fw';
    if (c==='KeyS' || k==='s' || c==='ArrowDown')  return 'bk';
    if (c==='KeyA' || k==='a' || c==='ArrowLeft')  return 'lt';
    if (c==='KeyD' || k==='d' || c==='ArrowRight') return 'rt';
    if (c==='ShiftLeft'||c==='ShiftRight' || k==='shift') return 'run';
    if (c==='PageUp' || k===' ')  return 'up';
    if (c==='PageDown' || k==='control') return 'down';
    if (c==='Digit1' || k==='1') return 'slot0';
    if (c==='Digit2' || k==='2') return 'slot1';
    if (c==='Digit3' || k==='3') return 'slot2';
    if (c==='KeyE' || k==='e')   return 'pickup';
    if (c==='KeyG' || k==='g')   return 'drop';
    if (c==='KeyN' || k==='n')   return 'noclip';
    return '';
  }

  function recomputeMove(){
    const f=(keys.has('fw')?1:0)+(keys.has('bk')?-1:0);
    const r=(keys.has('rt')?1:0)+(keys.has('lt')?-1:0);
    const v=(keys.has('up')?1:0)+(keys.has('down')?-1:0);
    move.z=f; move.x=r; move.y=v; running=keys.has('run') || _tapSprint;
  }

  function onKey(e,down){
    const tag = mapKey(e);
    if(!tag) return; // don’t block unrelated keys
    e.preventDefault(); // only block when we actually handle it
    if(down) keys.add(tag); else keys.delete(tag);

    if(tag==='noclip' && down && window.camera){
      const noclipNow = !(camera.checkCollisions);
      camera.checkCollisions = !noclipNow;
      camera.applyGravity   = !noclipNow;
      toast(noclipNow ? 'Noclip: ON' : 'Noclip: OFF');
    }
    if(tag.startsWith('slot') && down){
      const idx = Number(tag.slice(-1));
      if(idx>=0 && idx<3){ activeSlot=idx; rebuildBelt(); }
    }
    if(tag==='pickup' && down) tryPickup();
    if(tag==='drop'   && down) tryDrop();
    recomputeMove();
  }

  // Desktop mouse look via Pointer Lock
  function bindMouseLook(){
    const c = document.getElementById('renderCanvas');
    if(!c) return;
    function onMove(e){
      if (document.pointerLockElement !== c) return;
      lookDelta.x += e.movementX||0;
      lookDelta.y += e.movementY||0;
    }
    c.addEventListener('mousemove', onMove);
    // click to lock
    c.addEventListener('mousedown', ()=>{ if(document.pointerLockElement!==c) c.requestPointerLock?.(); });
    // escape unlock → small hint
    document.addEventListener('pointerlockchange', ()=>{
      if(document.pointerLockElement!==c) toast('Pointer unlocked (click canvas to lock)');
    });
  }

  // Touch halves
  function bindTouchHalves(){
    const left=document.getElementById('touch-left'), right=document.getElementById('touch-right');
    if(!left||!right) return;
    let leftId=null, leftCenter=null, rightId=null, lastRight=null;
    const DEAD=14, MAX=110;
    const norm=(v)=> Math.abs(v)<DEAD?0:v;
    const clampv=(v,m)=> Math.max(-m, Math.min(m, v));

    const onStart = ()=>{ isTouchMode=true; };
    left.addEventListener('touchstart', e=>{ onStart(); for(const t of e.changedTouches){ if(leftId===null){ leftId=t.identifier; leftCenter={x:t.clientX,y:t.clientY}; break; } } e.preventDefault(); },{passive:false});
    right.addEventListener('touchstart', e=>{ onStart(); for(const t of e.changedTouches){ if(rightId===null){ rightId=t.identifier; lastRight={x:t.clientX,y:t.clientY}; break; } } e.preventDefault(); },{passive:false});

    window.addEventListener('touchmove', e=>{
      for(const t of e.changedTouches){
        if(t.identifier===leftId && leftCenter){
          const dx=clampv(t.clientX-leftCenter.x,MAX), dy=clampv(t.clientY-leftCenter.y,MAX);
          const nx=norm(dx)/MAX, ny=norm(dy)/MAX;
          _analogScale = Math.min(1, Math.hypot(nx,ny));
          move.x = Math.sign(nx);
          move.z = ny<0 ? 1 : (ny>0 ? -1 : 0);
          e.preventDefault();
        } else if(t.identifier===rightId){
          if(lastRight){ lookDelta.x += (t.clientX-lastRight.x); lookDelta.y += (t.clientY-lastRight.y); }
          lastRight={x:t.clientX,y:t.clientY}; e.preventDefault();
        }
      }
    },{passive:false});
    window.addEventListener('touchend', e=>{
      for(const t of e.changedTouches){
        if(t.identifier===leftId){ leftId=null; leftCenter=null; move.x=0; move.z=0; _analogScale=1.0; }
        if(t.identifier===rightId){ rightId=null; lastRight=null; }
      }
      e.preventDefault();
    },{passive:false});

    const sprintWrap = document.getElementById('mobile-sprint');
    const sprintBtn  = document.getElementById('btn-sprint');
    if(sprintWrap && sprintBtn){
      sprintWrap.style.display='block';
      sprintBtn.onclick = ()=>{ _tapSprint=!_tapSprint; sprintBtn.textContent = 'Sprint: ' + (_tapSprint?'ON':'OFF'); };
    }
  }

  return {
    init(){
      document.addEventListener('keydown', e=>onKey(e,true), {passive:false});
      document.addEventListener('keyup',   e=>onKey(e,false), {passive:false});
      bindMouseLook();
      bindTouchHalves();
    },
    snapshot(){
      const out={ moveVec:{...move}, running, lookDelta:{...lookDelta}, analog:_analogScale };
      lookDelta.x=0; lookDelta.y=0; return out;
    },
    isTouch: ()=>isTouchMode
  };
})();
</script>

<script>
/*** ==========================================================
    PLAYER MODEL (Visible Body in First Person)
    ========================================================== ***/
const PlayerRig = (()=>{
  let root = null;
  let meshRoot = null;
  let loaded = false;
  let headHidden = false;
  let scaleApplied = false;

  const CONFIG = {
    modelDir: "./assets/models/player/",
    modelFile: "main_player.glb",
    bodyYOffset: 1.70,
    bodyForward: 0.06,
    minScale: 0.6,
    maxScale: 1.6
  };

  function _hideHeadIfFound(node) {
    if (!node) return;
    const name = (node.name||"").toLowerCase();
    const looksLikeHead = name.includes("head") || name.includes("mixamorig:head") || name.includes("bone_head");
    if (looksLikeHead && node.getClassName && node.getClassName()!=="TransformNode") {
      try { node.isVisible = false; headHidden = true; } catch(_){}
    }
    if (node.getChildren) node.getChildren().forEach(_hideHeadIfFound);
  }

  function _tuneMaterials(node) {
    if (!node || !node.material) return;
    try {
      node.material.backFaceCulling = true;
      if (node.material.albedoTexture) node.material.albedoTexture.hasAlpha = false;
      if (node.material.opacityTexture) node.material.opacityTexture.getAlphaFromRGB = false;
    } catch(_){}
  }

  function _fitScaleToHuman(meshes) {
    try {
      const m0 = meshes.find(m=> m.getClassName && m.getClassName()!=="TransformNode");
      if (!m0) return;
      const bi = m0.getBoundingInfo();
      const height = (bi.boundingBox.maximumWorld.y - bi.boundingBox.minimumWorld.y) || 1.7;
      const want = 1.7 / height;
      const clamped = Math.max(CONFIG.minScale, Math.min(CONFIG.maxScale, want));
      root.scaling = new BABYLON.Vector3(clamped, clamped, clamped);
      scaleApplied = true;
    } catch(_){}
  }

  async function load() {
    if (loaded) return;
    root = new BABYLON.TransformNode("playerRoot", scene);
    try {
      const r = await BABYLON.SceneLoader.ImportMeshAsync("", CONFIG.modelDir, CONFIG.modelFile, scene);
      meshRoot = r.meshes.find(m => (m.name||"") !== "__root__") || r.meshes[0];
      r.meshes.forEach(m=>{
        try {
          m.isPickable = false;
          m.checkCollisions = false;
          m.parent = root;
          _tuneMaterials(m);
        } catch(_){}
      });
      try { r.meshes.forEach(m => m.receiveShadows = false); } catch(_){}
      _fitScaleToHuman(r.meshes);
      _hideHeadIfFound(root);
      if (!headHidden) {
        try {
          const tallest = r.meshes
            .filter(m=>m.getBoundingInfo)
            .sort((a,b)=>b.getBoundingInfo().boundingBox.maximumWorld.y - a.getBoundingInfo().boundingBox.maximumWorld.y)[0];
          if (tallest && (tallest.name||"").toLowerCase().includes("head")) { tallest.isVisible = false; headHidden = true; }
        } catch(_){}
      }
      loaded = true;
    } catch (e) {
      console.warn("Player model load failed, creating capsule proxy.", e);
      const capsule = BABYLON.MeshBuilder.CreateCapsule("fp_capsule", {height:1.7, radius:0.25, tessellation:10}, scene);
      const m = new BABYLON.StandardMaterial("fp_capsule_mat", scene);
      m.diffuseColor = new BABYLON.Color3(0.75,0.75,0.8);
      m.emissiveColor = new BABYLON.Color3(0.05,0.08,0.1);
      capsule.material = m;
      capsule.isPickable = false; capsule.checkCollisions = false;
      root = capsule; meshRoot = capsule; loaded = true; headHidden = true;
    }
  }

  function update() {
    if (!loaded || !camera || !root) return;
    const fwd = camera.getForwardRay().direction.clone(); fwd.y = 0; fwd.normalize();
    const yaw = Math.atan2(fwd.z, fwd.x);
    const bodyPos = camera.position
      .add(fwd.scale(CONFIG.bodyForward))
      .add(new BABYLON.Vector3(0, -CONFIG.bodyYOffset, 0));
    root.position.copyFrom(bodyPos);
    root.rotation.y = yaw;
    if (!scaleApplied) try { root.scaling = root.scaling || new BABYLON.Vector3(1,1,1); } catch(_){}
  }

  return { load, update };
})();
</script>

<script>
/*** ==========================================================
    MOVEMENT + LOOK
    ========================================================== ***/
window.handleMovement = function(input, dt){
  if(!window.camera) return;

  const baseWalk = player.speedWalk * (input.analog||1);
  const speed = input.running ? player.speedRun : baseWalk;

  const fwd = camera.getForwardRay().direction.clone(); fwd.y=0; fwd.normalize();
  const right = BABYLON.Vector3.Cross(fwd, BABYLON.Axis.Y).scale(-1);
  const desired = fwd.scale(input.moveVec.z).add(right.scale(input.moveVec.x));

  const vert = input.moveVec.y || 0;
  const wantsFly = vert !== 0;

  const prevGravity = camera.applyGravity;
  if (wantsFly) camera.applyGravity = false;

  let next = camera.position.clone();
  if (desired.lengthSquared() > 0) next = next.add(desired.normalize().scale(speed * dt));
  if (wantsFly) next = next.add(new BABYLON.Vector3(0, vert * speed * dt, 0));

  if (!wantsFly && desired.lengthSquared() > 0) {
    const probe = next.add(new BABYLON.Vector3(0, player.stepUpMax, 0));
    const downRay = new BABYLON.Ray(probe, new BABYLON.Vector3(0,-1,0), player.stepUpMax+0.6);
    const hit = scene.pickWithRay(downRay, m=>m && m.isPickable!==false);
    if(hit && hit.pickedPoint){
      const y = hit.pickedPoint.y + 1.7;
      const dy = y - camera.position.y;
      camera.position = (dy<=player.stepUpMax) ? new BABYLON.Vector3(next.x, y, next.z) : next;
    } else {
      camera.position = next;
    }
  } else {
    camera.position = next;
  }
  camera.applyGravity = prevGravity;
};

window.applyLook = function(lookDelta){
  if(!window.camera) return;
  const sens = 0.0025;
  camera.rotation.y += (lookDelta.x || 0) * sens;
  const minPitch = -Math.PI/2 + 0.15;
  const maxPitch =  Math.PI/2 - 0.15;
  const next = (camera.rotation.x || 0) + ((lookDelta.y || 0) * sens * 0.85);
  camera.rotation.x = Math.max(minPitch, Math.min(maxPitch, next));
};
</script>

<script>
/*** ==========================================================
    WEATHER, SUN, MOON + SHADOWS
    ========================================================== ***/
const LAYERS = { EXTERIOR: 0x10000000, INTERIOR: 0x20000000, ALL: 0x0fffffff };

function setupSun(){
  if(sunLight) return;
  sunLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.35,-1,0.25).normalize(), scene);
  sunLight.intensity = 1.1;
  sunLight.position = new BABYLON.Vector3(60,80,-60);
  sunLight.shadowMinZ = 1; sunLight.shadowMaxZ = 250;
  sunShadows = new BABYLON.ShadowGenerator(2048, sunLight);
  sunShadows.usePercentageCloserFiltering = true;
  sunShadows.filteringQuality = BABYLON.ShadowGenerator.QUALITY_HIGH;
}
function setupMoon(){
  if(moonLight) return;
  moonLight = new BABYLON.DirectionalLight("moonDir", new BABYLON.Vector3(1,-0.8,-0.6).normalize(), scene);
  moonLight.intensity = 0.45;
  moonLight.position = new BABYLON.Vector3(-120,140,100);
  moonLight.shadowMinZ = 1; moonLight.shadowMaxZ = 250;
  moonShadows = new BABYLON.ShadowGenerator(1024, moonLight);
  moonShadows.usePoissonSampling = true;
}
function markShadowable(meshes){
  try{
    meshes.forEach(m=>{
      if(m && m.getClassName && m.getClassName()!=="TransformNode"){
        m.receiveShadows = true;
        if(sunShadows) sunShadows.addShadowCaster(m, true);
        if(moonShadows) moonShadows.addShadowCaster(m, true);
      }
    });
  }catch(e){}
}
/* Simple rain/snow particle systems so setWeather() has valid refs */

function ensureRain(scene){
  try{
    scene = scene || (window.SCENE||scene); if (!scene) return null;
    if (scene.__rainPS){ return scene.__rainPS; }
    var ps = new BABYLON.GPUParticleSystem("rain", { capacity: 30000 }, scene);
    ps.activeParticleCount = 14000;
    ps.emitRate = 12000;
    ps.minSize = 0.01; ps.maxSize = 0.03;
    ps.minLifeTime = 1.0; ps.maxLifeTime = 2.0;
    ps.minEmitPower = 10; ps.maxEmitPower = 15;
    ps.gravity = new BABYLON.Vector3(0, -9.0, 0);
    var box = new BABYLON.Mesh.CreateBox("rainEmitter", 1, scene);
    box.isVisible = false; box.isPickable=false;
    box.position = (window.player && window.player.position) ? window.player.position.clone().addInPlace(new BABYLON.Vector3(0,10,0)) : new BABYLON.Vector3(0,10,0);
    ps.emitter = box;
    var emitter = new BABYLON.BoxParticleEmitter();
    emitter.direction1 = new BABYLON.Vector3(0, -1.0, 0);
    emitter.direction2 = new BABYLON.Vector3(0, -1.0, 0);
    emitter.minEmitBox = new BABYLON.Vector3(-40, 0, -40);
    emitter.maxEmitBox = new BABYLON.Vector3(40, 0, 40);
    ps.particleEmitterType = emitter;
    ps.start(); scene.__rainPS = ps;
    return ps;
  }catch(_){ return null; }
}
function ensureSnow(scene){
  try{
    scene = scene || (window.SCENE||scene); if (!scene) return null;
    if (scene.__snowPS){ return scene.__snowPS; }
    var ps = new BABYLON.GPUParticleSystem("snow", { capacity: 20000 }, scene);
    ps.activeParticleCount = 8000;
    ps.emitRate = 6000;
    ps.minSize = 0.05; ps.maxSize = 0.12;
    ps.minLifeTime = 4; ps.maxLifeTime = 8;
    ps.minEmitPower = 0.5; ps.maxEmitPower = 1.4;
    ps.gravity = new BABYLON.Vector3(0, -0.7, 0);
    // emitter: a big box over the map
    var box = new BABYLON.Mesh.CreateBox("snowEmitter", 1, scene);
    box.isVisible = false; box.isPickable=false;
    box.position = (window.player && window.player.position) ? window.player.position.clone() : new BABYLON.Vector3(0,8,0);
    ps.emitter = box;
    var emitter = new BABYLON.BoxParticleEmitter();
    emitter.direction1 = new BABYLON.Vector3(-0.2, -1.0, 0.2);
    emitter.direction2 = new BABYLON.Vector3(0.2, -1.0, -0.2);
    emitter.minEmitBox = new BABYLON.Vector3(-40, 0, -40);
    emitter.maxEmitBox = new BABYLON.Vector3(40, 0, 40);
    ps.particleEmitterType = emitter;
    ps.start(); scene.__snowPS = ps;
    return ps;
  }catch(_){ return null; }
}
function setWeather(state){
  weather.state=state;
  const hw=document.getElementById('hud-weather'); if(hw) hw.textContent=state;
  WeatherAudio.set(state);

  if(hemiLight) hemiLight.dispose();
  setupSun(); setupMoon();
  if(weather.rainPS) weather.rainPS.stop();
  if(weather.snowPS) weather.snowPS.stop();

  if(state==='Clear'){
    scene.fogDensity = 0.0045;
    sunLight.intensity = 0.9;
    moonLight.intensity = 0.35;
  } else if(state==='Sunset'){
    scene.fogDensity = 0.0022;
    sunLight.direction = new BABYLON.Vector3(-0.18,-1,0.12).normalize();
    sunLight.intensity = 1.45;
    sunLight.diffuse = new BABYLON.Color3(1.0,0.86,0.58);
    sunLight.specular = new BABYLON.Color3(1.0,0.9,0.8);
    moonLight.intensity = 0.25;
    scene.clearColor = new BABYLON.Color4(0.10,0.06,0.05,1);
  } else if(state==='Snow'){
    ensureSnow().start(); scene.fogDensity=0.0032; sunLight.intensity=0.8; moonLight.intensity=0.35;
  } else if(state==='Rain'){
    ensureRain().start(); scheduleNextLightning(); scene.fogDensity=0.0048;
  } else if(state==='Blood Moon'){
    ensureRain().start(); scheduleNextLightning(); scene.fogDensity=0.006; moonLight.intensity=0.6;
  }

  try{ markShadowable(scene.meshes||[]); } catch(e){}
}

/*** Static, visible moon (no orbit) ***/
async function loadMoon(){
  const MOON_DIAM = 18;
  const MOON_POS   = new BABYLON.Vector3(0, 120, 160);

  function makeMat(){
    const mat = new BABYLON.StandardMaterial("moonMatVisible", scene);
    mat.disableLighting = true;
    mat.emissiveColor   = new BABYLON.Color3(1,1,1);
    mat.diffuseColor    = new BABYLON.Color3(1,1,1);
    mat.specularColor   = new BABYLON.Color3(0,0,0);
    mat.backFaceCulling = false;
    return mat;
  }

  try{
    const r = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/sky/", "moon.glb", scene);
    moonMesh = r.meshes.find(m=>m.name && m.name!=="__root__") || r.meshes[0];
  }catch(e){
    console.warn("Moon GLB missing; creating disc fallback.");
    moonMesh = BABYLON.MeshBuilder.CreateDisc("MoonMesh",{radius:MOON_DIAM*0.5, tessellation:48}, scene);
  }

  moonMesh.material = makeMat();
  moonMesh.isPickable = false;
  moonMesh.applyFog   = false;
  moonMesh.renderingGroupId = 2;
  moonMesh.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  moonMesh.scaling.setAll(MOON_DIAM);
  moonMesh.position.copyFrom(MOON_POS);

  if (moonLight){
    const dir = moonMesh.position.subtract(BABYLON.Vector3.Zero()).normalize().scale(-1);
    moonLight.direction = dir;
    moonLight.intensity = Math.max(moonLight.intensity, 0.45);
  }
}
</script>

<script>
/*** ==========================================================
    MAP SELECTOR + MAP DEF LOADER (smart fallbacks)
    ========================================================== ***/
let MAP_FILES = [];
let CURRENT_MAP = null;

async function loadManifest() {
  try {
    const res = await fetch("./assets/models/map/maps.json", { cache: "no-store" });
    const json = await res.json();
    MAP_FILES = Array.isArray(json) ? json : (json.maps || []);
    MAP_FILES.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  } catch(e) {
    console.warn("maps.json missing or invalid; using fallback.", e);
    MAP_FILES = [
      { file:"Abandoned_House.glb", title:"Abandoned House", def:"Abandoned_House.js" },
      { file:"furnished_house.glb", title:"Furnished House", def:"furnished_house.config.js" }
    ];
  }
  populateMapSelector();
}

function populateMapSelector(){
  const sel = document.getElementById('map-select'); if(!sel) return;
  if (!MAP_FILES.length) { sel.innerHTML = `<option value="-1">(no maps found)</option>`; return; }
  sel.innerHTML = MAP_FILES.map((m,i)=>`<option value="${i}">${m.title||m.file}</option>`).join('');
  sel.value = "0";
  sel.addEventListener('change', ()=>{ try{window.CURRENT_MAP = getSelectedMap(); } catch(e){} });
}

function getSelectedMap(){
  const sel = document.getElementById('map-select');
  const idx = Math.max(0, Math.min(MAP_FILES.length-1, parseInt(sel?.value||"0",10) || 0));
  return MAP_FILES[idx];
}

function loadScriptOnce(src){
  return new Promise((resolve)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve(true);
    s.onerror = ()=>resolve(false);
    document.head.appendChild(s);
  });
}

/* Try explicit def, then inferred names, then the exact fallbacks requested */
async function loadMatchingMapDef(mapFile, explicitDef){
  const baseNoExt = (mapFile||'').replace(/\.[^.]+$/,'');
  const candidates = [];

  if (explicitDef) candidates.push(explicitDef);

  // Inferred
  candidates.push(baseNoExt + ".js");
  candidates.push(baseNoExt + ".config.js");

  // Special-case exact names requested
  const low = (mapFile||'').toLowerCase();
  if (low.includes('abandoned')) candidates.push("Abandoned_House.js");
  if (low.includes('furnished')){
    candidates.push("furnished_house.config.js");
    candidates.push("fully_furnished.config.js");
  }

  const tried = new Set(), ordered = candidates.filter(c=>{ if(tried.has(c)) return false; tried.add(c); return true; });

  let loadedAny = false;
  for (const name of ordered){
    const ok = await loadScriptOnce(`./assets/models/map/${name}`);
    if (ok && window.MAP_DEF) { loadedAny = true; break; }
  }
  if (!loadedAny) {
    console.warn("No map def loaded for", mapFile, "— spawn will use fallback.");
    window.MAP_DEF = undefined;
  }
}

window.loadSelectedMap = async function(){
  const map = (window.CURRENT_MAP = getSelectedMap());
  const mapFile = map?.file || "Abandoned_House.glb";

  Loader.label('Loading map definition…');
  await loadMatchingMapDef(mapFile, map?.def);

  Loader.label('Importing map meshes…');
  try{
    const res = await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/models/map/", mapFile, scene);
    houseRoot = res.meshes[0] || res.meshes.find(m=>m.name==="__root__") || null;
    res.meshes.forEach(m=>{
      try{
        m.receiveShadows = true;
        if(sunShadows) sunShadows.addShadowCaster(m, true);
        if(moonShadows) moonShadows.addShadowCaster(m, true);
      }catch(_){}
    });
  } catch(e){
    console.warn('Map load failed; building ground fallback', e);
    const g=BABYLON.MeshBuilder.CreateGround("fallback",{width:180,height:180},scene); g.checkCollisions=true; g.receiveShadows=true;
    try{ if(sunShadows) sunShadows.addShadowCaster(g, true); if(moonShadows) moonShadows.addShadowCaster(g, true);}catch(_){}
  }
};
</script>

function postInitUI(){
  rebuildBelt();
  InputSystem.init();

  onBeforeRenderAdd(()=>{
    const dt = engine.getDeltaTime()/1000;
    const input = InputSystem.snapshot();

    // Sprint stamina gating (3s sprint, 5s cooldown)
    const moving = !!(input.moveVec.x || input.moveVec.y || input.moveVec.z);
    let canRun = (player.sprintCDLeft <= 0 && player.sprintLeft > 0);
    let wantsRun = input.running && canRun;
    if (wantsRun && moving) {
      player.sprintLeft -= dt;
      if (player.sprintLeft <= 0) { player.sprintLeft = 0; player.sprintCDLeft = player.sprintCD; wantsRun = false; }
    } else {
      if (player.sprintCDLeft > 0) {
        player.sprintCDLeft = Math.max(0, player.sprintCDLeft - dt);
        if (player.sprintCDLeft === 0) player.sprintLeft = player.sprintMax;
      } else {
        player.sprintLeft = Math.min(player.sprintMax, player.sprintLeft + dt);
      }
    }
    input.running = wantsRun;

    if (typeof window.handleMovement === 'function') window.handleMovement(input, dt);
    const isMoving = Math.abs(input.moveVec.x) + Math.abs(input.moveVec.z) > 0.01;
    Footsteps.tick(isMoving, input.running);
    if (typeof window.applyLook === 'function') window.applyLook(input.lookDelta);
    PlayerRig.update();
    try{ CameraRig.update(dt); }catch(_){ }

    // Lightweight ghost event sampler
    ghost.eventTimer += dt;
    if(ghost.eventTimer >= ghost.nextEvent){
      ghost.eventTimer = 0;
      ghost.nextEvent = 8 + Math.random()*12;
      const r = Math.random();
      if(r < 0.30) { GhostAudio.doorCreak(); }
      else if(r < 0.55) { GhostAudio.whisper(); }
      else if(r < 0.82) { GhostAudio.doorSlam(); }
      else { GhostAudio.toss(); }

      try{
        const d = BABYLON.Vector3.Distance(camera.position, ghost.position||BABYLON.Vector3.Zero());
        if(d < 6.0) EMFAudio.extend(10 + Math.random()*5);
      }catch(_){}
    }

    try{ disturbSaltAt(camera.position.clone()); }catch(e){}

    player.inside = true; // placeholder until room volumes wired
    document.getElementById('hud-sanity').textContent = Math.round(player.sanity)+'%';
    document.getElementById('sanity-fill').style.width = Math.round(player.sanity)+'%';

    const xyz=document.getElementById('hud-xyz'); xyz.style.display='block';
    document.getElementById('hud-x').textContent = camera.position.x.toFixed(2);
    document.getElementById('hud-y').textContent = camera.position.y.toFixed(2);
    document.getElementById('hud-z').textContent = camera.position.z.toFixed(2);
  });

  // Inspector button (ensure topmost lift right after showing)
  document.getElementById('btn-inspector').onclick = ()=>{
    try{
      scene.debugLayer.show({ embedMode:false });
      setTimeout(()=>window.__elevateInspectorHost?.(), 0);
      setTimeout(()=>window.__elevateInspectorHost?.(), 250);
    }catch(e){
      toast('Inspector not available');
    }
  };

  document.getElementById('btn-use').onclick = useActiveItem;
  document.getElementById('btn-place').onclick = placeActiveItem;
  document.getElementById('btn-toss').onclick = tossActiveItem;
  document.getElementById('btn-lighter').onclick = toggleLighter;
  document.getElementById('btn-notebook').onclick = ()=>document.getElementById('notebook-modal').style.display='block';
}

  engine.runRenderLoop(()=>scene.render());
  window.addEventListener('resize', ()=>engine.resize());
}

<script>
/*** ==========================================================
    START FLOW (Loader after Start) — hardened
========================================================== ***/
let __started = false;

async function safeStart(e){
  e?.preventDefault?.();
  if (__started) return;
  __started = true;

  // Hide title screen (if present)
  const title = document.getElementById('title-screen');
  if (title) title.style.display = 'none';

  // Show loader
  Loader.reset?.();
  Loader.show();
  Loader.label('Initializing…');
  Loader.draw();

  // Helper: add a step only if the function exists
  const add = (label, fnOrPromise, weight=1) => {
    if (typeof fnOrPromise === 'function' || (fnOrPromise && typeof fnOrPromise.then === 'function')) {
      Loader.addStep(label, fnOrPromise, weight);
    } else {
      // no-op step so the label still shows
      Loader.addStep(label, async()=>{}, Math.max(1, weight));
    }
  };

  // Build the queue (guards if any function is undefined)
  add('Loading maps manifest…',       typeof loadManifest      === 'function' ? ()=>loadManifest()         : null, 3);
  add('Preparing Babylon engine…',    typeof prepareEngineScene=== 'function' ? ()=>prepareEngineScene()   : null, 2);
  add('Setting up sky lights…',       typeof setupLightsPreMoon=== 'function' ? ()=>setupLightsPreMoon()   : null, 1);
  add('Loading sky / moon…',          typeof loadMoon          === 'function' ? ()=>loadMoon()             : null, 2);
  add('Initializing audio engine…',   (window.WeatherAudio && WeatherAudio.init) ? ()=>WeatherAudio.init(scene) : null, 1);
  add('Loading player model…',        (window.PlayerRig && PlayerRig.load)      ? ()=>PlayerRig.load()      : null, 3);
  add('Loading selected map…',        typeof loadSelectedMap   === 'function' ? ()=>loadSelectedMap()      : null, 5);
  add('Positioning player spawn…',    typeof applySpawn        === 'function' ? ()=>applySpawn()           : null, 2);
  add('Selecting starting weather…',  typeof pickAndSetWeather === 'function' ? ()=>pickAndSetWeather()    : null, 1);
  add('Building shadows & flags…',    typeof markShadowable    === 'function' ? ()=>markShadowable(scene.meshes) : null, 1);
  add('Wiring input + UI…',           typeof postInitUI        === 'function' ? ()=>postInitUI()           : null, 1);
  add('Starting render loop…',        typeof startRenderLoop   === 'function' ? ()=>startRenderLoop()      : null, 1);

  await Loader.run();

  const canvas = window.canvas || document.getElementById('renderCanvas') || document.querySelector('canvas');
  try { canvas?.focus?.(); } catch(_) {}
  try { BABYLON.Engine.audioEngine?.unlock?.(); } catch(_) {}

  // Desktop convenience: request pointer lock
  if (canvas?.requestPointerLock) {
    setTimeout(()=>{ try{ canvas.requestPointerLock(); }catch(_){/* user gesture rule */} }, 0);
  }
}

// Start button & keyboard wiring (all guarded)
const startBtn = document.getElementById('start-button') || document.querySelector('#start button');
startBtn?.addEventListener('click', safeStart, {passive:false});
document.addEventListener('keydown', (e)=>{
  if (!__started && (e.key === 'Enter' || e.code === 'Space')) { e.preventDefault(); safeStart(e); }
}, {passive:false});

// Optional: preload manifest after DOM ready
window.addEventListener('DOMContentLoaded', () => {
  if (typeof loadManifest === 'function') { try { loadManifest(); } catch(_) {} }
});

// Notebook helpers (guarded)
function closeNotebook(){ const m=document.getElementById('notebook-modal'); if (m) m.style.display='none'; }
function resetEvidence(){ typeof toast==='function' ? toast('Evidence reset') : console.log('Evidence reset'); }
</script>

<script>
const EMFAudio = (()=>{
  let ctx=null, osc=null, gain=null, running=false;
  let emf5Until = 0;
  const MAX_EXTEND_MS = 120000;
  function ensure(){
    try{
      ctx = BABYLON.Engine.audioEngine?.audioContext || ctx;
      if(!ctx) return false;
      if(!gain){ gain = ctx.createGain(); gain.gain.value = 0; gain.connect(ctx.destination); }
      if(!osc){ osc = ctx.createOscillator(); osc.type='square'; osc.frequency.value=1150; osc.connect(gain); try{osc.start();}catch(_){}} 
      return true;
    }catch(_){ return false; }
  }
  function now(){ return (typeof performance!=='undefined'?performance.now():Date.now()); }
  function _set(v){ try{ gain && gain.gain.setTargetAtTime(v, ctx.currentTime, 0.005);}catch(_){ } }
  function spike(){
    if(!ensure()) return;
    const pattern=[1,0,1,0,1,0], dur=0.12, gap=0.12; let t=0;
    pattern.forEach(on=>{ setTimeout(()=>_set(on?0.18:0.0), Math.round(t*1000)); t += on?dur:gap; });
    setTimeout(()=>_set(0.0), Math.round(t*1000)+20);
  }
  function startEMF5(seconds){
    if(!ensure()) return;
    const add = Math.max(0.5, seconds||10+Math.random()*5);
    const stopAt = now() + add*1000;
    emf5Until = Math.min(now()+MAX_EXTEND_MS, Math.max(emf5Until, stopAt));
    running=true; _set(0.22);
  }
  function extend(seconds){
    if(emf5Until<=now()) return;
    const add = Math.max(1.0, seconds||10+Math.random()*5);
    emf5Until = Math.min(now()+MAX_EXTEND_MS, emf5Until + add*1000);
  }
  function update(){
    if(emf5Until > now()){ if(!running){ running=true; _set(0.22);} }
    else if(running){ running=false; _set(0.0); }
  }
  (function poll(){ if(window.scene&&window.engine){ onBeforeRenderAdd(()=>{ try{ update(); }catch(_){ } }); } else setTimeout(poll,120); })();
  return { spike, startEMF5, extend };
})();
</script>
<script>
const GhostAudio = (()=>{
  let whisperSnd=null, slamSnd1=null, slamSnd2=null, creakSnd1=null, creakSnd2=null, tossSnd=null;
  let lastCreakTime = 0;

  function ensure(){
    try{
      const opt = { loop:false, autoplay:false };
      whisperSnd = whisperSnd || new BABYLON.Sound('ga_whisper','./assets/audio/whisper.mp3', scene, null, { ...opt, volume:0.7 });
      slamSnd1   = slamSnd1   || new BABYLON.Sound('ga_slam1','./assets/audio/doorSlam1.mp3', scene, null, { ...opt, volume:0.9 });
      slamSnd2   = slamSnd2   || new BABYLON.Sound('ga_slam2','./assets/audio/doorSlam2.mp3', scene, null, { ...opt, volume:0.9 });
      creakSnd1  = creakSnd1  || new BABYLON.Sound('ga_creak1','./assets/audio/doorCreak1.mp3', scene, null, { ...opt, volume:0.7 });
      creakSnd2  = creakSnd2  || new BABYLON.Sound('ga_creak2','./assets/audio/doorCreak2.mp3', scene, null, { ...opt, volume:0.7 });
      tossSnd    = tossSnd    || new BABYLON.Sound('ga_toss','./assets/audio/Toss.wav',         scene, null, { ...opt, volume:0.85 });
    }catch(_){}
  }

  // optional positional attachment
  function attachTo(node){
    try{
      whisperSnd?.attachToMesh?.(node);
      slamSnd1?.attachToMesh?.(node);
      slamSnd2?.attachToMesh?.(node);
      creakSnd1?.attachToMesh?.(node);
      creakSnd2?.attachToMesh?.(node);
      tossSnd?.attachToMesh?.(node);
    }catch(_){}
  }

  return {
    ensure,
    attachTo,
    whisper(){ ensure(); try{ whisperSnd?.stop(); whisperSnd?.play(); }catch(_){} },
    doorSlam(){ ensure(); try{ (Math.random()<0.5?slamSnd1:slamSnd2)?.play(); }catch(_){} },
    doorCreak(){

<script>
/*** Minimal ghost wander + events (hardened) ***/
(function setupGhostLoop(){
  // ---- shims / guards ------------------------------------------------------
  const SceneRef = window.scene || BABYLON.Engine?.LastCreatedScene;
  if (!SceneRef) { console.warn('[GhostLoop] No scene yet; delaying setup.'); 
    const iv = setInterval(()=>{ if (window.scene || BABYLON.Engine?.LastCreatedScene){ clearInterval(iv); setupGhostLoop(); } }, 120);
    return;
  }
  const SCENE = window.scene || BABYLON.Engine.LastCreatedScene;
  const ENGINE = SCENE.getEngine?.() || BABYLON.Engine?.LastCreatedEngine;
  const CAMERA = SCENE.activeCamera;

  // scene onBeforeRender helper
  function onBeforeRenderAdd(fn){
    try { SCENE.onBeforeRenderObservable.add(fn); } catch (_) {}
  }

  // poly check on XZ plane (fallback if user didn't define pointInPolyXZ)
  const pointInPolyXZ = window.pointInPolyXZ || function(v3, poly){
    if (!poly || poly.length < 3) return false;
    const px = v3.x, pz = v3.z;
    let inside = false;
    for (let i=0,j=poly.length-1; i<poly.length; j=i++){
      const xi = poly[i].x, zi = poly[i].z;
      const xj = poly[j].x, zj = poly[j].z;
      const intersect = ((zi>pz)!=(zj>pz)) && (px < (xj - xi) * (pz - zi) / ((zj - zi)||1e-9) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  };

  // ghost object scaffold (non-destructive)
  const ghost = (window.ghost = window.ghost || {});
  if (!(ghost.position instanceof BABYLON.Vector3)) ghost.position = new BABYLON.Vector3(0, 0, 0);
  if (!(ghost.roomCenter instanceof BABYLON.Vector3)) ghost.roomCenter = new BABYLON.Vector3(2, 0, 2);
  ghost.type = ghost.type || 'Spirit';  // default type if not set

  // map rooms (optional)
  function assignGhostRoomFromCenter(){
    try{
      const rooms = (window.MAP_DEF && Array.isArray(MAP_DEF.rooms)) ? MAP_DEF.rooms : null;
      if (!rooms) return;
      for (const r of rooms){
        if (r?.poly && pointInPolyXZ(ghost.roomCenter, r.poly)) { ghost.roomName = r.name; break; }
      }
    }catch(_){}
  }
  assignGhostRoomFromCenter();

  function currentRoomNameSafe(){
    try { return (typeof window.currentRoomName === 'function') ? window.currentRoomName() : ''; }
    catch(_) { return ''; }
  }
  function isPlayerInGhostRoom(){
    try { return !!ghost.roomName && currentRoomNameSafe() === ghost.roomName; } catch(_) { return false; }
  }
  const isShade = () => (ghost?.type || '').toLowerCase() === 'shade';

  // ---- loop state ----------------------------------------------------------
  let t = 0;
  let next = 10 + Math.random() * 15;
  let radioCooldown = 0;
  let wanderTarget = ghost.roomCenter.clone();

  // ---- main loop -----------------------------------------------------------
  onBeforeRenderAdd(()=>{
    const dt = (ENGINE?.getDeltaTime?.() || 16.7) / 1000;

    t += dt;
    if (radioCooldown > 0) radioCooldown -= dt;

    // randomize wander target occasionally
    if (Math.random() < 0.01) {
      const dx = (Math.random() - 0.5) * 4;
      const dz = (Math.random() - 0.5) * 4;
      wanderTarget = ghost.roomCenter.add(new BABYLON.Vector3(dx, 0, dz));
    }

    // move toward wander target
    const dir = wanderTarget.subtract(ghost.position);
    dir.y = 0;
    const L = dir.length();
    if (L > 0.01) ghost.position = ghost.position.add(dir.normalize().scale(Math.min(L, dt * 0.6)));

    try { ghost.nearPlayer = BABYLON.Vector3.Distance(CAMERA.position, ghost.position) < 5.0; } catch (_) {}

    if (t >= next) {
      t = 0; next = 10 + Math.random() * 15;

      // Shade: suppress noisy events when player is present
      if (isShade() && isPlayerInGhostRoom()) return;

      // pick an event
      const r = Math.random();
      try {
        if (r < 0.25)      GhostAudio.whisper();
        else if (r < 0.55) GhostAudio.doorCreak();
        else if (r < 0.80) GhostAudio.doorSlam();
        else               GhostAudio.toss();
      } catch(_) {}

      // EMF & radio chance
      try {
        const d = BABYLON.Vector3.Distance(CAMERA.position, ghost.position || BABYLON.Vector3.Zero());
        if (d < 6.0 && window.EMFAudio?.extend) EMFAudio.extend(10 + Math.random() * 5);

        const inRoom = isPlayerInGhostRoom();
        const radioChance = inRoom ? 0.45 : 0.12;
        if (radioCooldown <= 0 && Math.random() < radioChance) {
          window.RadioAudio?.playOnce?.();
          radioCooldown = 20 + Math.random() * 20;
        }
      } catch(_) {}
    }
  });
})();
</script>

<script>
/*** Ghost writing — hardened, positional audio, cooldown ***/
(function(){
  const SCENE  = window.scene || BABYLON.Engine?.LastCreatedScene;
  const ENGINE = SCENE?.getEngine?.() || BABYLON.Engine?.LastCreatedEngine;
  const CAMERA = SCENE?.activeCamera;

  // safe observable add
  function onBeforeRenderAdd(fn){ try{ SCENE?.onBeforeRenderObservable.add(fn); }catch(_){} }

  // safe toast
  function say(msg){ try{ toast && toast(msg); }catch(_){ console.log('[Book]', msg); } }

  // ray helper if _aimPointOnGround is missing
  function aimPointOnGround(maxDist=5){
    if (typeof _aimPointOnGround === 'function') {
      try { return _aimPointOnGround(maxDist); } catch(_){}
    }
    try{
      const origin = CAMERA?.position ?? new BABYLON.Vector3(0,1.8,0);
      const fwd = CAMERA?.getForwardRay?.(maxDist)?.direction ?? new BABYLON.Vector3(0,0,1);
      const ray = new BABYLON.Ray(origin, fwd, maxDist);
      const pick = SCENE?.pickWithRay?.(ray, m=>m?.isPickable!==false);
      if (pick?.hit) return pick.pickedPoint;
    }catch(_){}
    return CAMERA?.position?.clone?.() ?? new BABYLON.Vector3(0,1.8,0);
  }

  // ----- Audio (positional) -----
  const WritingAudio = (()=>{
    let writeClip=null, tossClip=null;
    function ensure(){
      try{
        const base = { loop:false, autoplay:false, spatialSound:true, refDistance:2, rolloffFactor:1.2, maxDistance:25 };
        writeClip = writeClip || new BABYLON.Sound('ghostWriting','./assets/audio/GhostWriting1.mp3', SCENE, null, { ...base, volume:0.9 });
        tossClip  = tossClip  || new BABYLON.Sound('bookToss','./assets/audio/Toss.wav',        SCENE, null, { ...base, volume:0.85 });
      }catch(_){}
    }
    function at(pos, snd){
      try{
        ensure();
        snd?.setPosition?.(pos ?? CAMERA?.position ?? BABYLON.Vector3.Zero());
        snd?.stop?.(); snd?.play?.();
      }catch(_){}
    }
    return {
      writeAt(pos){ at(pos, writeClip); },
      tossAt(pos){ at(pos, tossClip); }
    };
  })();

  // ----- State -----
  let BOOK_PLACED=false, BOOK_POS=null, BOOK_WRITTEN=false;
  let bookCooldown = 0; // seconds

  // expose your original API (kept name)
  window.dropWritingBook = function dropWritingBook(){
    BOOK_PLACED = true;
    BOOK_WRITTEN = false;
    const p = aimPointOnGround(3.8) || CAMERA?.position?.clone?.();
    BOOK_POS = (p instanceof BABYLON.Vector3) ? p : new BABYLON.Vector3(p?.x||0, p?.y||0, p?.z||0);
    bookCooldown = 2; // brief arming delay to avoid instant trigger
    say('Book dropped');
  };

  // helpers used in logic
  function isShadeAndPlayerInRoom(){
    try{
      const isShade = ((ghost?.type||'').toLowerCase() === 'shade');
      const sameRoom = typeof currentRoomName === 'function' && ghost?.roomName && currentRoomName() === ghost.roomName;
      return isShade && sameRoom;
    }catch(_){ return false; }
  }
  function ghostHasWritingEvidence(){
    try { return typeof ghostHasEvidence === 'function' ? !!ghostHasEvidence('writing') : true; }
    catch(_){ return true; } // default true so feature still works if checker missing
  }

  // ----- Loop -----
  (function bookLoop(){
    let timer=0, nextCheck = 6 + Math.random()*10;
    onBeforeRenderAdd(()=>{
      const dt = (ENGINE?.getDeltaTime?.() || 16.7) / 1000;
      timer += dt;
      if (bookCooldown > 0) bookCooldown -= dt;

      if (!BOOK_PLACED || !BOOK_POS) return;
      if (timer < nextCheck || bookCooldown > 0) return;

      // reset window
      timer = 0; nextCheck = 8 + Math.random()*14;

      // Shade: suppress while player in ghost room
      if (isShadeAndPlayerInRoom()) return;

      try{
        const gpos = ghost?.position || BABYLON.Vector3.Zero();
        const near = BABYLON.Vector3.Distance(BOOK_POS, gpos) < 3.2;
        if (!near) return;

        if (ghostHasWritingEvidence()){
          if (Math.random() < 0.5){
            WritingAudio.writeAt(BOOK_POS);
            BOOK_WRITTEN = true;
            bookCooldown = 10; // avoid immediate repeats
            say('Ghost wrote in book!');
          } else {
            WritingAudio.tossAt(BOOK_POS);
            BOOK_PLACED = false;
            bookCooldown = 5;
            say('The book was tossed!');
          }
        } else {
          // no writing evidence: likely toss
          WritingAudio.tossAt(BOOK_POS);
          BOOK_PLACED = false;
          bookCooldown = 5;
          say('The book was tossed!');
        }
      }catch(_){}
    });
  })();
})();
</script>

<script>
const DOTS = window.DOTS || { projectors:[], monitorPlane:null, tripod:null, monitorText:null, _mat:null };

/* ---------- helpers ---------- */
(function(){
  const SCENE  = window.scene || BABYLON.Engine?.LastCreatedScene;
  const ENGINE = SCENE?.getEngine?.() || BABYLON.Engine?.LastCreatedEngine;
  const CAMERA = SCENE?.activeCamera;

  function say(msg){ try{ toast?.(msg); }catch(_){ console.log('[DOTS]', msg); } }

  function aimPointOnGround(maxDist=4){
    if (typeof _aimPointOnGround === 'function') {
      try { const p = _aimPointOnGround(maxDist); if (p) return p; } catch(_){}
    }
    try{
      const origin = CAMERA?.position ?? new BABYLON.Vector3(0,1.8,0);
      const ray = CAMERA?.getForwardRay?.(maxDist) ?? new BABYLON.Ray(origin, new BABYLON.Vector3(0,0,1), maxDist);
      const pick = SCENE?.pickWithRay?.(ray, m => m?.isPickable !== false);
      if (pick?.hit) return pick.pickedPoint;
    }catch(_){}
    return (CAMERA?.position?.clone?.()) || new BABYLON.Vector3(0,1.8,0);
  }

  function ensureDotMaterial(){
    if (DOTS._mat) return DOTS._mat;
    const mat = new BABYLON.StandardMaterial('dotMat_shared', SCENE);
    mat.emissiveColor = new BABYLON.Color3(0,1,0);
    mat.disableLighting = true;
    mat.specularColor = new BABYLON.Color3(0,0,0);
    return (DOTS._mat = mat);
  }

  function _makeDotsGrid(node){
    const countX=10, countZ=10, spacing=0.25, size=0.03;
    const mat = ensureDotMaterial();
    // create one base mesh, then instances for perf (100 per projector)
    const base = BABYLON.MeshBuilder.CreateSphere('dotBase',{diameter:size, segments:4}, SCENE);
    base.material = mat; base.isPickable = false; base.setEnabled(false); // hidden template

    const halfX = (countX/2), halfZ = (countZ/2);
    for(let ix=0; ix<countX; ix++){
      for(let iz=0; iz<countZ; iz++){
        const inst = base.createInstance('dotInst');
        inst.isPickable = false;
        inst.parent = node;
        inst.position = new BABYLON.Vector3((ix-halfX)*spacing, 0.9, (iz-halfZ)*spacing);
      }
    }
    return base; // caller may dispose template if desired
  }

  function ensureVanMonitor(){
    if (DOTS.monitorPlane) return DOTS.monitorPlane;
    const plane = BABYLON.MeshBuilder.CreatePlane('vanMonitor',{width:2.2,height:1.3}, SCENE);
    plane.position = new BABYLON.Vector3(0,1.6,22.8);
    plane.rotation.y = Math.PI;

    const mat = new BABYLON.StandardMaterial('vanMonitorMat', SCENE);
    mat.emissiveColor = new BABYLON.Color3(0.1,0.9,0.1);
    mat.diffuseColor = mat.specularColor = new BABYLON.Color3(0,0,0);
    plane.material = mat;

    const dyn = new BABYLON.DynamicTexture('vanMonitorDT', {width:1024,height:512}, SCENE, true);
    mat.emissiveTexture = dyn;
    const ctx = dyn.getContext();
    function writeMsg(msg){
      ctx.save();
      ctx.fillStyle = 'black'; ctx.fillRect(0,0,1024,512);
      ctx.fillStyle = '#00ff88'; ctx.font = '36px monospace';
      ctx.textBaseline = 'top';
      ctx.fillText(msg, 40, 40);
      ctx.restore();
      dyn.update();
    }
    DOTS.monitorPlane = plane;
    DOTS.monitorText = writeMsg;
    writeMsg('Camera: offline');
    return plane;
  }

  function ensureTripodAt(p){
    if (DOTS.tripod) return DOTS.tripod;
    const n = DOTS.tripod = new BABYLON.TransformNode('TripodCam', SCENE);
    n.position = new BABYLON.Vector3(p.x,1.4,p.z);
    const pole = BABYLON.MeshBuilder.CreateCylinder('tripodPole',{height:1.4,diameter:0.06}, SCENE);
    const head = BABYLON.MeshBuilder.CreateBox('tripodHead',{size:0.12}, SCENE);
    const m = new BABYLON.StandardMaterial('tripodMat', SCENE);
    m.emissiveColor = new BABYLON.Color3(0.05,0.2,0.2);
    pole.material = m; head.material = m;
    pole.parent=n; head.parent=n; pole.position.y = -0.7;
    return n;
  }

  // Public: place DOTS projector
  window.placeDotsProjector = function placeDotsProjector(){
    const p = aimPointOnGround(4.0);
    const node = new BABYLON.TransformNode('DOTS_Projector', SCENE);
    node.position = new BABYLON.Vector3(p.x, 0, p.z);
    _makeDotsGrid(node);
    DOTS.projectors.push({ node, radius:2.6, cooldown:0 });
    say('DOTS projector placed');
  };

  // Public: van monitor + tripod cam
  window.placeVideoCam = function placeVideoCam(){
    ensureVanMonitor();
    const p = aimPointOnGround(4.0);
    ensureTripodAt(p);
    DOTS.monitorText?.('Camera: online');
  };

  function _ghostInsideAnyDots(){
    if (!DOTS.projectors.length) return null;
    const gpos = ghost?.position || BABYLON.Vector3.Zero();
    for (const p of DOTS.projectors){
      try{
        if (p.cooldown > 0) continue;
        const d = BABYLON.Vector3.Distance(gpos, p.node.position);
        if (d < p.radius) return p;
      }catch(_){}
    }
    return null;
  }

  function _showDotsApparition(atPos, onlyOnMonitor=false){
    const pos = atPos || ghost?.position || BABYLON.Vector3.Zero();
    if (onlyOnMonitor){
      ensureVanMonitor();
      DOTS.monitorText?.('Camera: DOTS detected');
      setTimeout(()=>DOTS.monitorText?.('Camera: online'), 2000);
      return;
    }
    const plane = BABYLON.MeshBuilder.CreatePlane('dotsSil',{size:1.5}, SCENE);
    plane.position = new BABYLON.Vector3(pos.x, 1.2, pos.z);
    plane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_Y;
    const mat = new BABYLON.StandardMaterial('dotsSilMat', SCENE);
    mat.diffuseColor = mat.emissiveColor = new BABYLON.Color3(0,1,0);
    mat.alpha = 0.0; plane.material = mat;

    let t=0;
    const h = SCENE.onBeforeRenderObservable.add(()=>{
      const dt = (ENGINE?.getDeltaTime?.() || 16.7)/1000;
      t += dt;
      mat.alpha = t < 0.2 ? t*4.5 : Math.max(0, 1.0 - (t-0.2)*1.2);
      if (t > 1.2){
        try{ SCENE.onBeforeRenderObservable.remove(h); plane.dispose(); }catch(_){}
      }
    });
  }

  function updateDOTS(dt){
    // cooldown decay
    for (const p of DOTS.projectors) if (p.cooldown > 0) p.cooldown = Math.max(0, p.cooldown - dt);

    const hit = _ghostInsideAnyDots(); if (!hit) return;
    if (!(typeof ghostHasEvidence === 'function' ? ghostHasEvidence('dots') : true)) return;

    const isGoryo = ((ghost?.type||'').toLowerCase() === 'goryo');
    const hasCamInRoom = !!DOTS.tripod && BABYLON.Vector3.Distance(DOTS.tripod.position, hit.node.position) < 6.5;

    if (isGoryo){
      if (hasCamInRoom){
        _showDotsApparition(ghost?.position, true);
        hit.cooldown = 3.0; // prevent spam
      }
    } else {
      _showDotsApparition(ghost?.position, false);
      hit.cooldown = 3.0;
    }
  }

  // hook into Babylon's render loop instead of RAF
  (function hookDotsLoop(){
    SCENE.onBeforeRenderObservable.add(()=>{
      const dt = (ENGINE?.getDeltaTime?.() || 16.7)/1000;
      try { updateDOTS(dt); } catch(_){}
    });
  })();

  // optional cleanup API
  window.clearDotsProjectors = function(){
    for (const p of DOTS.projectors){
      try { p.node.getChildMeshes()?.forEach(m=>m.dispose()); p.node.dispose(); } catch(_){}
    }
    DOTS.projectors.length = 0;
  };
})();
</script>
<script>
const SpiritBoxQuestions = (()=>{
  const WRAP_ID = 'sbox-questions';
  const SCENE = window.scene || BABYLON.Engine?.LastCreatedScene;
  let bound = false;
  let lastAsk = 0;

  function safeToast(msg){
    try { if (typeof window.toast === 'function') window.toast(msg); else console.log(msg); }
    catch(_) { console.log(msg); }
  }

  function wrap(){ return document.getElementById(WRAP_ID); }
  function show(){ const el=wrap(); if (el) el.style.display='block'; }
  function hide(){ const el=wrap(); if (el) el.style.display='none'; }

  function _hasEvidenceSpirit(){
    try { return (typeof ghostHasEvidence === 'function') ? !!ghostHasEvidence('spiritbox') : true; }
    catch(_) { return true; }
  }
  function _nearGhost(){
    try {
      const cam = (SCENE?.activeCamera) || null;
      const gpos = (ghost?.position) || BABYLON.Vector3.Zero();
      return cam ? BABYLON.Vector3.Distance(cam.position, gpos) < 5.5 : false;
    } catch(_) { return false; }
  }

  function ask(q){
    const now = performance?.now?.() ?? Date.now();
    if (now - lastAsk < 250) return; // debounce click spam
    lastAsk = now;

    if (!SpiritBoxAudio.isOn()) return;
    const ok = _hasEvidenceSpirit() && _nearGhost() && Math.random() < 0.20;
    try {
      if (ok) { SpiritBoxAudio.speak(); safeToast(`Spirit Box: "${q}"`); }
      else    { safeToast(`...static... "${q}"`); }
    } catch(_) {}
  }

  // robust binder: run once; if the element isn't in DOM yet, retry
  function bind(){
    if (bound) return;
    const el = wrap();
    if (!el) { setTimeout(bind, 250); return; }

    // Avoid duplicate listeners across re-binds by using a signal
    const controller = new AbortController();
    el.dataset.sbBind = '1';
    el.querySelectorAll('.sbox-q').forEach(btn=>{
      btn.addEventListener('click', ()=> ask(btn.textContent?.trim() || 'Question'), { signal: controller.signal });
    });
    // mark as bound
    bound = true;
  }
  setTimeout(bind, 0);

  return { show, hide, ask, _bind: bind };
})();

// periodic random whisper while ON, near ghost
(function periodicSpiritSpeech(){
  function tick(){
    try{
      const SCENE = window.scene || BABYLON.Engine?.LastCreatedScene;
      const cam = SCENE?.activeCamera;
      const gpos = (ghost?.position) || BABYLON.Vector3.Zero();

      if (SpiritBoxAudio.isOn() &&
          (typeof ghostHasEvidence !== 'function' || ghostHasEvidence('spiritbox')) &&
          cam) {
        const d = BABYLON.Vector3.Distance(cam.position, gpos);
        if (d < 5.5 && Math.random() < 0.01) SpiritBoxAudio.speak();
      }
    }catch(_){}
    setTimeout(tick, 850);
  }
  setTimeout(tick, 1200);
})();
</script>

    if (typeof ghostHasEvidence !== 'function' || !ghostHasEvidence('uv')) return false;

  function snapToGround(p){
    try{
      const ray = new BABYLON.Ray(new BABYLON.Vector3(p.x, (p.y||2)+5, p.z), new BABYLON.Vector3(0,-1,0), 20);
      const hit = SCENE.pickWithRay(ray, m => m && m.isPickable !== false);
      if (hit?.hit && hit.pickedPoint) return hit.pickedPoint;
    }catch(_){}
    return p;
  }

  // Public API
  window.UVPrints = window.UVPrints || {};

  // Add a single footprint at position with optional facing (rotY in radians)
  UVPrints.addFootprint = function(pos, rotY=0){
    const p = snapToGround(pos);
    const flip = Math.random() < 0.5;
    const mesh = makePrintNode(p, rotY, flip);
    const born = now();
    PRINTS.push({ mesh, born });
    return mesh;
  };

  // Add a pair of prints like a step (offset along direction)
  UVPrints.addStepPair = function(centerPos, dirYRad){
    const dir = new BABYLON.Vector3(Math.sin(dirYRad), 0, Math.cos(dirYRad)); // Yaw to XZ
    const side = BABYLON.Vector3.Cross(dir, BABYLON.Axis.Y).normalize();     // left/right
    const stride = 0.35;  // forward spacing
    const width  = 0.12;  // left/right spacing
    // Left, then right (or randomize)
    const pL = centerPos.add(dir.scale(stride)).add(side.scale(+width));
    const pR = centerPos.add(dir.scale(stride*1.9)).add(side.scale(-width));
    UVPrints.addFootprint(pL, dirYRad);
    UVPrints.addFootprint(pR, dirYRad);
  };

  // Clear all (optional)
  UVPrints.clear = function(){
    for (const it of PRINTS){ try{ it.mesh.dispose(); }catch(_){ } }
    PRINTS.length = 0;
  };

  // Fade + dispose loop
  SCENE.onBeforeRenderObservable.add(()=>{
    const t = now();
    for (let i=PRINTS.length-1; i>=0; i--){
      const it = PRINTS[i], age = t - it.born;
      if (age >= TTL){
        try{ it.mesh.dispose(); }catch(_){}
        PRINTS.splice(i,1);
        continue;
      }
      if (age >= (TTL - FADE)){
        // fade alpha
        const a = 1 - ((age - (TTL - FADE))/FADE);
        const m = it.mesh.material;
        if (m) { m.alpha = Math.max(0, Math.min(1, a)); }
      }
    }
  });
})();
</script>

<script id="tweakpatch-js">
(function(){
  const log = (...a)=>console.log("[TweakPatch]",...a);

  // ------- Inspector super-topmost lifter
  const liftInspector = () => {
    const insp = document.querySelector(".babylonjsInspector, #inspector-host, .inspector");
    if (insp) {
      insp.style.zIndex = 2147483647;
      insp.style.pointerEvents = "auto";
    }
  };
  const mo = new MutationObserver(liftInspector);
  mo.observe(document.documentElement, {subtree:true, childList:true, attributes:true});
  liftInspector();

  // ------- HUD helpers
  const $ = sel => document.querySelector(sel);
  const hudPL = $("#hud-pl");
  const hudWASD = $("#hud-wasd");
  const hudSprint = $("#hud-sprint");
  const toast = $("#map-toast");

  const keys = { w:false, a:false, s:false, d:false, shift:false };

  const renderHud = () => {
    if (hudPL) hudPL.textContent = (document.pointerLockElement ? "yes" : "no");
    if (hudWASD) hudWASD.textContent = `${keys.w?'W':'-'}${keys.a?'A':'-'}${keys.s?'S':'-'}${keys.d?'D':'-'}`;
    if (hudSprint) hudSprint.textContent = keys.shift ? "on" : "off";
  };

  window.(function(){
    function isArc(cam){ return cam && cam.alpha!==undefined && cam.beta!==undefined && cam.radius!==undefined; }
    async function toggleThirdPerson(){
      var s = S(); if (!s) return;
      ensureRig(s);
      var cam = s.activeCamera;
      var fps = s.getCameraByName && s.getCameraByName("FPCam");
      var arc = s.getCameraByName && s.getCameraByName("TPCam");
      if (!fps || !arc){
        // create if missing
        ensureRig(s);
        fps = s.getCameraByName && s.getCameraByName("FPCam");
        arc = s.getCameraByName && s.getCameraByName("TPCam");
      }
      if (!fps || !arc) return;
      if (isArc(cam)){
        s.activeCamera = fps; try{ fps.attachControl(Canvas(), true); }catch(_){}
      } else {
        s.activeCamera = arc; try{ arc.attachControl(Canvas(), true); }catch(_){}
      }
      window.camera = s.activeCamera;
      updatePlayerVisibility();
    }
    window.toggleThirdPerson = toggleThirdPerson;

    function keyHandler(e){
      var k = (e.key||"").toLowerCase(), c=e.keyCode||0, code=e.code||"";
      if (k==="v" or c===86 or code==="KeyV"){ e.stopPropagation(); toggleThirdPerson(); return; }
      if(e.repeat) return;
      if(k==="w"||c===87)K.w=1; else if(k==="a"||c===65)K.a=1; else if(k==="s"||c===83)K.s=1; else if(k==="d"||c===68)K.d=1; else if(k==="shift"||c===16)K.run=true;
    }
    function keyUpHandler(e){
      var k=(e.key||"").toLowerCase(),c=e.keyCode||0;
      if(k==="w"||c===87)K.w=0; else if(k==="a"||c===65)K.a=0; else if(k==="s"||c===83)K.s=0; else if(k==="d"||c===68)K.d=0; else if(k==="shift"||c===16)K.run=false;
    }
    // Bubble
    window.addEventListener("keydown", keyHandler, false);
    window.addEventListener("keyup", keyUpHandler, false);
    // Capture
    document.addEventListener("keydown", keyHandler, true);
    document.addEventListener("keyup", keyUpHandler, true);
  })();
  addEventListener("keyup", function(e){ var k=(e.key||"").toLowerCase(),c=e.keyCode||0;
    if(k==="w"||c===87)K.w=0; else if(k==="a"||c===65)K.a=0; else if(k==="s"||c===83)K.s=0; else if(k==="d"||c===68)K.d=0; else if(k==="shift"||c===16)K.run=false;
  }, {passive:true});

  (function(){
    var canvas = Canvas(); if (!canvas) return;
    canvas.addEventListener("click", function(){ try{ canvas.requestPointerLock && canvas.requestPointerLock(); }catch(_){}});
    addEventListener("mousemove", function(ev){
      var s=S(), cam=s && s.activeCamera; if (!cam || isArc(cam)) return;
      if (!(document.pointerLockElement===canvas || document.mozPointerLockElement===canvas || document.webkitPointerLockElement===canvas)) return;
      var dx = ev.movementX || 0, dy = ev.movementY || 0;
      cam.cameraRotation = cam.cameraRotation || new BABYLON.Vector2(0,0);
      cam.cameraRotation.y += -dx * MOUSE_SENS;
      cam.cameraRotation.x += -dy * MOUSE_SENS;
    }, {passive:true});
  })();

  (function(){
    var leftId=null,rightId=null, lx=0,ly=0, rx=0,ry=0;
    addEventListener("touchstart", function(e){
      for (var i=0;i<e.changedTouches.length;i++){
        var t=e.changedTouches[i];
        if (t.clientX < innerWidth*0.5 && leftId===null){ leftId=t.identifier; lx=t.clientX; ly=t.clientY; }
        else if (t.clientX >= innerWidth*0.5 && rightId===null){ rightId=t.identifier; rx=t.clientX; ry=t.clientY; }
      }
    }, {passive:true});
    addEventListener("touchmove", function(e){
      var s=S(); if(!s) return;
      for (var i=0;i<e.changedTouches.length;i++){
        var t=e.changedTouches[i];
        if (t.identifier===leftId){
          var dx=(t.clientX-lx), dy=(t.clientY-ly);
          K.w = dy < -10 ? 1:0; K.s = dy > 10 ? 1:0; K.a = dx < -10 ? 1:0; K.d = dx > 10 ? 1:0;
        } else if (t.identifier===rightId){
          var cam=s.activeCamera; if(!cam) continue;
          if (isArc(cam)){
            cam.alpha += -0.01 * (t.clientX - rx);
            cam.beta  += -0.01 * (t.clientY - ry);
            cam.beta = Math.min(cam.upperBetaLimit, Math.max(cam.lowerBetaLimit, cam.beta));
          } else {
            cam.cameraRotation = cam.cameraRotation || new BABYLON.Vector2(0,0);
            cam.cameraRotation.y += -(t.clientX - rx) * TOUCH_LOOK_SENS;
            cam.cameraRotation.x += -(t.clientY - ry) * TOUCH_LOOK_SENS;
          }
          rx=t.clientX; ry=t.clientY;
        }
      }
    }, {passive:true});
    addEventListener("touchend", function(e){
      for (var i=0;i<e.changedTouches.length;i++){
        var t=e.changedTouches[i];
        if (t.identifier===leftId){ leftId=null; K.w=K.a=K.s=K.d=0; }
        if (t.identifier===rightId){ rightId=null; }
      }
    }, {passive:true});
  })();

  function fwd(cam){ try{ var v=cam.getDirection(BABYLON.Axis.Z); v.y=0; v.normalize(); return v; }catch(_){ return new BABYLON.Vector3(0,0,1);}}
  function right(cam){ try{ var v=cam.getDirection(BABYLON.Axis.X); v.y=0; v.normalize(); return v; }catch(_){ return new BABYLON.Vector3(1,0,0);}}

  function attachLoop(){
    var s=S(); if (!s) return false;
    ensureRig(s);
    if (s.__inputCamLoop_v2) return true;
    s.__inputCamLoop_v2 = true;
    s.onBeforeRenderObservable.add(function(){
      var cam = s.activeCamera; if (!cam) return;
      var body = s.__playerBody; if (!body) return;
      var v = new BABYLON.Vector3(0,0,0);
      var fw=fwd(cam), rt=right(cam);
      if (K.w) v.addInPlace(fw);
      if (K.s) v.addInPlace(fw.scale(-1));
      if (K.d) v.addInPlace(rt);
      if (K.a) v.addInPlace(rt.scale(-1));
      var len=v.length();
      if (len>0){
        v.scaleInPlace(1/len);
        var eng=(s.getEngine&&s.getEngine())||window.ENGINE;
        var dt=((eng&&eng.getDeltaTime)?eng.getDeltaTime():16.7)/1000;
        var sp = (K.run?SPEED_RUN:SPEED_WALK)*dt;
        var d=v.scale(sp);
        try{
          if (body.moveWithCollisions) body.moveWithCollisions(d);
          else body.position.addInPlace(d);
        }catch(_){}
      }
      updatePlayerVisibility();
    });
    return true;
  }

  (function wait(){
    var s=S();
    if (!s){ setTimeout(wait, 120); return; }
    ensureRig(s);
    attachLoop();
  })();
})();
</script>
